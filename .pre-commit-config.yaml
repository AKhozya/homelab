---
# Local subset of the .github/workflows/validate.yaml gates.
# shellcheck uses CI's `-S warning` threshold. yamllint runs `--strict`, which CI does not.
# kubeconform per Kustomize root, helm-render and the analysis drift check run in CI only.
# Install: pre-commit install && pre-commit install --hook-type commit-msg
# Run-all-files: pre-commit run -a

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            .*\.sops\.yaml|
            .*-secret\.yaml|
            .*-secrets\.yaml|
            .*credentials.*\.yaml|
            clusters/flux-system/gotk-components\.yaml|
            agents/skills/.*|
            agents/rules/AGENTS\.global\.md
          )$
      # agents/skills and AGENTS.global.md are byte copies from dotfiles, and
      # scripts/sync-agents.sh --check reports any byte a hook changes as drift.
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            .*\.sops\.yaml|
            agents/skills/.*|
            agents/rules/AGENTS\.global\.md
          )$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=5000']

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ['--strict']

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      # No path anchor — shell also lives in apps/, .backup/ and .claude/hooks/,
      # and a directory allowlist would miss them.
      - id: shellcheck
        args: ['-S', 'warning']
        files: \.(sh|bash)$

  - repo: local
    hooks:
      - id: sops-encryption
        name: SOPS encryption presence
        entry: scripts/ci/check-sops-encrypted.sh
        language: script
        pass_filenames: false
        files: \.ya?ml$

      - id: init-container-resources
        name: initContainer resource limits
        entry: scripts/ci/check-init-resources.sh
        language: script
        pass_filenames: false
        files: \.yaml$

      - id: image-pin
        name: image pin audit (major.minor.patch)
        entry: scripts/ci/image-pin-audit.sh
        language: script
        pass_filenames: false
        files: \.ya?ml$

      # Content secret scan (gitleaks) — the gate sops-check can't be: it scans
      # ARBITRARY staged content for plaintext credentials/keys, not just that
      # designated *-secret.yaml files are encrypted. Config: .gitleaks.toml.
      # Requires the gitleaks binary on PATH (brew install gitleaks).
      - id: gitleaks
        name: gitleaks secret scan (staged)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false

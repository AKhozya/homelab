name: Secret scan

# Deliberately SEPARATE from validate.yaml, which carries
# `paths-ignore: ['**.md', ...]`. A markdown-only push skips that whole workflow,
# so while gitleaks lived there a pasted credential in a runbook or plan reached
# main unscanned. This job is cheap (checkout + scan, ~15s), so it carries no path
# filter at all. Trigger scope still matches validate.yaml — pushes to main and PRs
# targeting main; pushes to other remote branches are not scanned by either.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" gitleaks
          "$HOME/.local/bin/gitleaks" version
      - name: Scan working tree
        run: |
          set -euo pipefail
          # Scans the CURRENT TREE (gitleaks dir), not git history. The repo invariant
          # is that the checked-out tree carries no plaintext secret; sops-check only
          # proves designated files are encrypted, not that arbitrary content is clean.
          # History is deliberately NOT scanned — it holds already-ROTATED (dead) values
          # that would red this gate forever. Per-commit coverage = the pre-commit
          # gitleaks hook (.pre-commit-config.yaml); config = .gitleaks.toml.
          gitleaks dir . --config .gitleaks.toml --no-banner --redact

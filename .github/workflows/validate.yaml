name: Validate

on:
  # No paths-ignore: the main ruleset requires ci-ok, and a workflow that a path filter
  # skips leaves its required check pending for ever, so a docs-only PR could never merge.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: v0.6.7
  # Must match what kustomize-controller embeds, or CI renders a different tree
  # than the cluster does. Chain: controller v1.9.4 -> sigs.k8s.io/kustomize/api
  # v0.21.1 -> kustomize CLI v5.8.1. Re-derive from the controller's go.mod on
  # any Flux bump; v5.5.0 (api v0.18.0) had drifted three minors behind.
  KUSTOMIZE_VERSION: v5.8.1
  # Track the live cluster (v1.37.0+k3s1). yannh/kubernetes-json-schema ships
  # v1.37.0 schemas. Bump alongside any k3s upgrade (k3s-upgrade skill checklist).
  KUBERNETES_VERSION: "1.37.0"
  # Each digest is the SHA-256 of the linux amd64 asset, from that release's published
  # checksums file. Bump a digest together with its version, or the install step fails.
  KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
  KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
  YQ_VERSION: v4.44.3
  YQ_SHA256: a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
  # A commit, not `main`: an upstream push would otherwise change the CRD schemas this
  # job validates against. If a CRD gains fields, update the catalog commit.
  DATREE_CATALOG_SHA: ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: pip install yamllint==1.35.1
      - run: yamllint .

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shellcheck
        run: |
          set -euo pipefail
          # Every tracked shell file, repo-wide: shell files also exist in apps/, .backup/ and
          # .claude/hooks/. set -e fails the step on xargs' exit 123, which means a file failed.
          # If git ls-files fails, pipefail fails the step too, so a partial list cannot pass.
          # NOT a full logic gate: SC2015 (A && B || C) is emitted at *info* severity
          # (shellcheck Analytics.hs, `info id 2015`), so -S warning filters it out.
          # That class stays a manual review item (.claude/review-invariants.md).
          # Lowering to -S info surfaces pre-existing findings (SC1091/2016/2162/2086/2012)
          # and needs its own cleanup pass before the threshold can move.
          git ls-files -z '*.sh' '*.bash' | xargs -0 -r shellcheck -S warning

  node-script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Offline tests for the node-maintenance scripts
        # The whole-script harness (node-maintenance/lib/tests/heal-harness) needs a privileged
        # local container and several minutes, so it runs on the workstation, not here.
        run: |
          set -euo pipefail
          bash node-maintenance/lib/tests/test-node-script-lib.sh
          bash node-maintenance/ansible/roles/node_isolation_heal/tests/test-ladder.sh
          bash node-maintenance/ansible/roles/k3s_config/tests/test-wait-ready.sh

  sops-check:
    name: sops encryption presence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci/check-sops-encrypted.sh

  init-resources:
    name: initContainer resource limits guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install-yq
      - run: scripts/ci/check-init-resources.sh

  image-pin:
    name: image pin audit (major.minor.patch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install-yq
      # Closes the gap Kyverno's image-pin policy leaves: it only rejects :latest/no-tag,
      # so major-only / major.minor tags float silently. This asserts major.minor.patch
      # (or @sha256 digest). Allowlist for native-2-component upstreams in the script.
      - run: scripts/ci/image-pin-audit.sh .

  kubeconform:
    name: kubeconform (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          # clusters/ holds the Flux Kustomization CRs themselves. Structural only: the
          # CRD types healthChecks/dependsOn entries as strings, so a name or GVK that
          # matches nothing still passes here — that stays a manual check
          # (.claude/review-invariants.md).
          - clusters
          - apps
          - infrastructure/configs
          - infrastructure/controllers
          - infrastructure/coredns
          - monitoring/configs
          - monitoring/controllers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kustomize + kubeconform + yq
        run: |
          set -euo pipefail
          # Pinned binaries to a runner-writable dir on PATH.
          # Avoids both flaky upstream install scripts and pointless sudo.
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          dl=$(mktemp -d)
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -o "$dl/kustomize.tgz"
          echo "${KUSTOMIZE_SHA256}  $dl/kustomize.tgz" | sha256sum -c -
          tar xzf "$dl/kustomize.tgz" -C "$HOME/.local/bin" kustomize
          "$HOME/.local/bin/kustomize" version
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o "$dl/kubeconform.tgz"
          echo "${KUBECONFORM_SHA256}  $dl/kubeconform.tgz" | sha256sum -c -
          tar xzf "$dl/kubeconform.tgz" -C "$HOME/.local/bin" kubeconform
          "$HOME/.local/bin/kubeconform" -v
      - uses: ./.github/actions/install-yq
      - name: Build + validate
        run: |
          set -euo pipefail
          # SOPS-encrypted Secrets carry a top-level `sops:` field that schemas reject.
          # Strip the field across all docs before piping to kubeconform.
          # Missing CRDs (operator-defined) are tolerated by `-ignore-missing-schemas`,
          # but for first-party operators we still ship Datree's CRDs-catalog fallback.
          out=$(mktemp)
          kustomize build --enable-helm "${{ matrix.root }}" > "$out"
          printf 'Built %s (%d lines)\n' "${{ matrix.root }}" "$(wc -l < "$out")"
          yq eval 'del(.sops)' "$out" | \
            kubeconform \
              -strict \
              -ignore-missing-schemas \
              -kubernetes-version "${KUBERNETES_VERSION}" \
              -schema-location default \
              -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${DATREE_CATALOG_SHA}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
              -summary

  homelab-analysis-drift:
    name: HOMELAB_ANALYSIS keyfact drift (warn-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Count live invariants vs documented
        run: |
          set -euo pipefail
          # Counts authored objects in the repo and compares each with its keyfact line in
          # docs/HOMELAB_ANALYSIS.md. A mismatch, or a line the pattern no longer finds,
          # emits a ::warning:: annotation. Warn-only: the keyfact wording changes over time.
          analysis=docs/HOMELAB_ANALYSIS.md
          [ -f "$analysis" ] || { echo "no $analysis"; exit 0; }

          np_files=$(find . -path './.git' -prune -o -name '*.yaml' -print0 2>/dev/null \
            | xargs -0 grep -l '^kind: NetworkPolicy' 2>/dev/null | wc -l | tr -d ' ')
          np_resources=$(find . -path './.git' -prune -o -name '*.yaml' -print0 2>/dev/null \
            | xargs -0 grep -c '^kind: NetworkPolicy' 2>/dev/null \
            | awk -F: '{s+=$2} END {print s+0}')
          sops_count=$(find . -path './.git' -prune -o -name '*.yaml' -print0 2>/dev/null \
            | xargs -0 grep -l 'ENC\[AES256_GCM' 2>/dev/null | wc -l | tr -d ' ')
          kyverno_count=$(find infrastructure/configs/kyverno-policies -name '*.yaml' \
            -exec grep -l '^kind: ValidatingPolicy' {} \; 2>/dev/null | wc -l | tr -d ' ')

          echo "Live counts:"
          printf '  NetworkPolicy files=%s resources=%s\n' "$np_files" "$np_resources"
          printf '  SOPS-encrypted files=%s\n' "$sops_count"
          printf '  Kyverno ValidatingPolicy=%s\n' "$kyverno_count"

          # check <label> <live> <documented>
          check() {
            if [ -z "$3" ]; then
              echo "::warning file=$analysis::$1: keyfact line not found; update the pattern in validate.yaml"
            elif [ "$2" != "$3" ]; then
              echo "::warning file=$analysis::$1: repo has $2, HOMELAB_ANALYSIS.md says $3"
            else
              echo "  $1: $2 matches"
            fi
          }
          check "NetworkPolicy manifests" "$np_resources" \
            "$(grep -oE '[0-9]+ raw manifests in git' "$analysis" | grep -oE '^[0-9]+' | head -1 || true)"
          check "SOPS-encrypted files" "$sops_count" \
            "$(grep -oE '\*\*[0-9]+\*\* SOPS-encrypted' "$analysis" | grep -oE '[0-9]+' | head -1 || true)"
          check "Kyverno ValidatingPolicy" "$kyverno_count" \
            "$(grep -oE '\*\*[0-9]+\*\* Kyverno CEL' "$analysis" | grep -oE '[0-9]+' | head -1 || true)"

  helm-render:
    name: helm render (HelmRelease charts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install-yq
      # KUBERNETES_VERSION comes from the workflow-level env above.
      - name: Render every HelmRelease chart
        run: scripts/ci/helm-render-check.sh .

  # The main ruleset requires this one check instead of each job's name. if: always()
  # makes it run and fail when a job fails or is cancelled; a skipped required check
  # counts as passing. homelab-analysis-drift is warn-only, so it is not listed.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [yamllint, shellcheck, node-script-tests, sops-check, init-resources, image-pin, kubeconform, helm-render]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: $RESULTS"
          [ -n "$RESULTS" ] || exit 1
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

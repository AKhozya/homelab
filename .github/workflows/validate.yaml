name: Validate

on:
  pull_request:
    branches: [main]
    # Docs/assets touch no validate job (yaml/shell/sops/manifest). Skip on pure
    # doc-only changes; mixed md+yaml pushes still run (paths-ignore skips only when
    # EVERY changed file matches). Markdown secret coverage = pre-commit gitleaks hook.
    # docs/scripts/** (shell) deliberately NOT ignored — shellcheck job scans it.
    paths-ignore: ['**.md', 'docs/images/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/images/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: v0.6.7
  KUSTOMIZE_VERSION: v5.5.0
  # Track the live cluster (v1.36.1+k3s1). yannh/kubernetes-json-schema ships
  # v1.36.1 schemas. Bump alongside any k3s upgrade (k3s-upgrade skill checklist).
  KUBERNETES_VERSION: "1.36.1"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install yamllint==1.35.1
      - run: yamllint .

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(find scripts docs/scripts -type f \
            \( -name '*.sh' -o -name '*.bash' \) 2>/dev/null)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no shell scripts found"
            exit 0
          fi
          printf 'Found %d shell scripts\n' "${#files[@]}"
          # -S warning catches the SC2015 (A && B || C) class the review-invariants flag; the
          # tree is clean at this level (0 warnings) so the gate stays green.
          fail=0
          for f in "${files[@]}"; do
            if ! shellcheck -S warning "$f"; then
              fail=1
            fi
          done
          exit $fail

  sops-check:
    name: sops encryption presence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci/check-sops-encrypted.sh

  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" gitleaks
          "$HOME/.local/bin/gitleaks" version
      - name: Scan working tree
        run: |
          set -euo pipefail
          # Scans the CURRENT TREE (gitleaks dir), not git history. The repo invariant
          # is that the checked-out tree carries no plaintext secret; sops-check only
          # proves designated files are encrypted, not that arbitrary content is clean.
          # History is deliberately NOT scanned — it holds already-ROTATED (dead) values
          # that would red this gate forever. Per-commit coverage = the pre-commit
          # gitleaks hook (.pre-commit-config.yaml); config = .gitleaks.toml.
          gitleaks dir . --config .gitleaks.toml --no-banner --redact

  init-resources:
    name: initContainer resource limits guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install yq
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -sSL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o "$HOME/.local/bin/yq"
          chmod +x "$HOME/.local/bin/yq"
          "$HOME/.local/bin/yq" --version
      - run: scripts/ci/check-init-resources.sh

  image-pin:
    name: image pin audit (major.minor.patch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install yq
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -sSL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o "$HOME/.local/bin/yq"
          chmod +x "$HOME/.local/bin/yq"
          "$HOME/.local/bin/yq" --version
      # Closes the gap Kyverno's image-pin policy leaves: it only rejects :latest/no-tag,
      # so major-only / major.minor tags float silently. This asserts major.minor.patch
      # (or @sha256 digest). Allowlist for native-2-component upstreams in the script.
      - run: scripts/ci/image-pin-audit.sh .

  kubeconform:
    name: kubeconform (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - apps
          - infrastructure/configs
          - infrastructure/controllers
          - infrastructure/coredns
          - monitoring/configs
          - monitoring/controllers
    steps:
      - uses: actions/checkout@v7
      - name: Install kustomize + kubeconform + yq
        run: |
          set -euo pipefail
          # Pinned binaries to a runner-writable dir on PATH.
          # Avoids both flaky upstream install scripts and pointless sudo.
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" kustomize
          "$HOME/.local/bin/kustomize" version
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" kubeconform
          "$HOME/.local/bin/kubeconform" -v
          curl -sSL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o "$HOME/.local/bin/yq"
          chmod +x "$HOME/.local/bin/yq"
      - name: Build + validate
        run: |
          set -euo pipefail
          # SOPS-encrypted Secrets carry a top-level `sops:` field that schemas reject.
          # Strip the field across all docs before piping to kubeconform.
          # Missing CRDs (operator-defined) are tolerated by `-ignore-missing-schemas`,
          # but for first-party operators we still ship Datree's CRDs-catalog fallback.
          out=$(mktemp)
          kustomize build --enable-helm "${{ matrix.root }}" > "$out"
          printf 'Built %s (%d lines)\n' "${{ matrix.root }}" "$(wc -l < "$out")"
          yq eval 'del(.sops)' "$out" | \
            kubeconform \
              -strict \
              -ignore-missing-schemas \
              -kubernetes-version "${KUBERNETES_VERSION}" \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -summary

  homelab-analysis-drift:
    name: HOMELAB_ANALYSIS keyfact drift (warn-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Count live invariants vs documented
        run: |
          set -euo pipefail
          # Static drift check — counts authored objects in-repo and compares to the
          # keyfact line in docs/HOMELAB_ANALYSIS.md. Warn-only since exact phrasing
          # in the keyfact line evolves (multi-doc NP files, etc.).
          analysis=docs/HOMELAB_ANALYSIS.md
          [ -f "$analysis" ] || { echo "no $analysis"; exit 0; }

          np_files=$(find . -path './.git' -prune -o -name '*.yaml' -print 2>/dev/null \
            | xargs grep -l '^kind: NetworkPolicy' 2>/dev/null | wc -l | tr -d ' ')
          np_resources=$(find . -path './.git' -prune -o -name '*.yaml' -print 2>/dev/null \
            | xargs grep -c '^kind: NetworkPolicy' 2>/dev/null \
            | awk -F: '{s+=$2} END {print s+0}')
          sops_count=$(find . -path './.git' -prune -o -name '*.yaml' -print 2>/dev/null \
            | xargs grep -l 'ENC\[AES256_GCM' 2>/dev/null | wc -l | tr -d ' ')
          kyverno_count=$(find infrastructure/configs/kyverno-policies -name '*.yaml' \
            -exec grep -l '^kind: ValidatingPolicy' {} \; 2>/dev/null | wc -l | tr -d ' ')

          echo "Live counts:"
          printf '  NetworkPolicy files=%s resources=%s\n' "$np_files" "$np_resources"
          printf '  SOPS-encrypted files=%s\n' "$sops_count"
          printf '  Kyverno ValidatingPolicy=%s\n' "$kyverno_count"

          echo
          echo "Documented (HOMELAB_ANALYSIS.md):"
          grep -E 'NetworkPolicy resources|SOPS secrets|Kyverno CEL' "$analysis" | head -5 || true

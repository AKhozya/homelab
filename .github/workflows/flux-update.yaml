name: Flux Update

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      version:
        description: 'Flux version (leave empty for latest)'
        required: false
        type: string

jobs:
  update-flux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        with:
          version: ${{ inputs.version || 'latest' }}

      - name: Get current and new versions
        id: versions
        run: |
          # Extract versions and normalize (remove 'v' prefix for comparison)
          CURRENT=$(grep -m1 'Flux Version:' clusters/flux-system/gotk-components.yaml | awk '{print $4}' | sed 's/^v//')
          NEW=$(flux --version | awk '{print $NF}')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT, New: $NEW"

      - name: Generate new manifests
        if: steps.versions.outputs.current != steps.versions.outputs.new
        run: |
          flux install --export > clusters/flux-system/gotk-components.yaml

      # GITHUB_TOKEN cannot open the PR: the repo setting that lets Actions create pull
      # requests is off (2026-09-28 hardening). If GITHUB_TOKEN opens a PR, GitHub starts no workflows for it.
      - name: Require FLUX_UPDATE_TOKEN
        if: steps.versions.outputs.current != steps.versions.outputs.new
        env:
          TOKEN: ${{ secrets.FLUX_UPDATE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Repo secret FLUX_UPDATE_TOKEN is missing. Add a fine-grained PAT for this repo with Contents and Pull requests write."
            exit 1
          fi

      - name: Create Pull Request
        if: steps.versions.outputs.current != steps.versions.outputs.new
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.FLUX_UPDATE_TOKEN }}
          commit-message: "chore(deps): update Flux to ${{ steps.versions.outputs.new }}"
          title: "chore(deps): update Flux to ${{ steps.versions.outputs.new }}"
          body: |
            Automated Flux update from `${{ steps.versions.outputs.current }}` to `${{ steps.versions.outputs.new }}`.

            ## Release Notes
            https://github.com/fluxcd/flux2/releases/tag/v${{ steps.versions.outputs.new }}

            ## Verification
            After merging, verify with:
            ```bash
            flux check
            kubectl get pods -n flux-system
            ```
          branch: flux-update-${{ steps.versions.outputs.new }}
          delete-branch: true
          labels: |
            dependencies
            flux

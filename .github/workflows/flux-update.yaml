name: Flux Update

on:
  schedule:
    # Weekly on Sunday at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      version:
        description: 'Flux version (leave empty for latest)'
        required: false
        type: string

jobs:
  update-flux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@6a650dba1b4ae9945185c4bb3cc3f386aaf71b3d # v2.9.2
        with:
          version: ${{ inputs.version || 'latest' }}

      - name: Get current and new versions
        id: versions
        run: |
          # Extract versions and normalize (remove 'v' prefix for comparison)
          CURRENT=$(grep -m1 'Flux Version:' clusters/flux-system/gotk-components.yaml | awk '{print $4}' | sed 's/^v//')
          NEW=$(flux --version | awk '{print $NF}')
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "Current: $CURRENT, New: $NEW"

      - name: Generate new manifests
        if: steps.versions.outputs.current != steps.versions.outputs.new
        run: |
          flux install --export > clusters/flux-system/gotk-components.yaml

      - name: Create Pull Request
        if: steps.versions.outputs.current != steps.versions.outputs.new
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update Flux to ${{ steps.versions.outputs.new }}"
          title: "chore(deps): update Flux to ${{ steps.versions.outputs.new }}"
          body: |
            Automated Flux update from `${{ steps.versions.outputs.current }}` to `${{ steps.versions.outputs.new }}`.

            ## Release Notes
            https://github.com/fluxcd/flux2/releases/tag/${{ steps.versions.outputs.new }}

            ## Verification
            After merging, verify with:
            ```bash
            flux check
            kubectl get pods -n flux-system
            ```
          branch: flux-update-${{ steps.versions.outputs.new }}
          delete-branch: true
          labels: |
            dependencies
            flux

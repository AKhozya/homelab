name: Build Claude Telegram Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g., 1.0). Leave empty to auto-increment.'
        required: false
        default: ''
  schedule:
    # Bi-weekly rebuild — Mon + Thu @ 23:00 UTC. Picks up SDK/CLI/base-image bumps.
    - cron: '0 23 * * 1,4'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: akhozya/claude-telegram-bot

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout homelab (for git tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout bot repo
        uses: actions/checkout@v6
        with:
          repository: AKhozya/claude-telegram-bot
          path: bot

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            LATEST=$(git tag -l 'claude-telegram-v1.*' --sort=-v:refname | head -1)
            if [ -z "$LATEST" ]; then
              NEXT="1.0"
            else
              MINOR=$(echo "$LATEST" | sed 's/claude-telegram-v1\.//')
              NEXT="1.$((MINOR + 1))"
            fi
            echo "tag=${NEXT}" >> $GITHUB_OUTPUT
          fi
          echo "Version: $(cat $GITHUB_OUTPUT | grep tag)"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: bot
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          # Cache-bust deps layer so caret ranges resolve to latest each rebuild.
          build-args: |
            BUILD_TS=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -f "claude-telegram-v${{ steps.version.outputs.tag }}"
          git push origin "claude-telegram-v${{ steps.version.outputs.tag }}" --force

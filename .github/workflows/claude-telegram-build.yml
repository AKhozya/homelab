name: Build Claude Telegram Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag, major.minor.patch (e.g., 1.25.0). Leave empty to auto-increment patch.'
        required: false
        default: ''
  schedule:
    # Bi-weekly rebuild — Mon + Thu @ 23:00 UTC. Picks up SDK/CLI/base-image bumps.
    - cron: '0 23 * * 1,4'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: akhozya/claude-telegram-bot

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout homelab (for git tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout bot repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AKhozya/claude-telegram-bot
          path: bot

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version tag
        id: version
        # The input reaches the script through env, never through ${{ }} inside run:,
        # so its text cannot become shell code.
        env:
          INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT" ]; then
            if ! echo "$INPUT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version must be major.minor.patch (e.g. 1.25.0), got '$INPUT'"
              exit 1
            fi
            NEXT="$INPUT"
          else
            # Auto-increment PATCH from the latest 3-component tag (each scheduled rebuild
            # is a dependency refresh = a patch bump). Reserve minor/major for manual input.
            LATEST=$(git tag -l 'claude-telegram-v*.*.*' --sort=-v:refname | head -1)
            if [ -n "$LATEST" ]; then
              V="${LATEST#claude-telegram-v}"          # e.g. 1.25.3
              MAJOR="${V%%.*}"; REST="${V#*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"
              NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
            else
              NEXT="1.0.0"
            fi
          fi
          # Check before the build, because the push step overwrites an existing registry tag
          # that the deployment may pin. The registry check also catches an image pushed by
          # hand before its git tag existed. A failed lookup stops the run: only a confirmed
          # absence lets the build go ahead.
          # The assignment is not piped, so under bash -e a failed ls-remote ends the step.
          REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/claude-telegram-v${NEXT}")
          if [ -n "$REMOTE_TAG" ]; then
            echo "::error::Tag claude-telegram-v${NEXT} already exists. Re-run with a new version input."
            exit 1
          fi
          if INSPECT=$(docker manifest inspect "${REGISTRY}/${IMAGE_NAME}:${NEXT}" 2>&1); then
            echo "::error::Image ${REGISTRY}/${IMAGE_NAME}:${NEXT} already exists. Re-run with a new version input."
            exit 1
          elif ! echo "$INSPECT" | grep -qiE 'manifest unknown|no such manifest'; then
            echo "::error::Registry lookup for ${NEXT} failed: ${INSPECT}"
            exit 1
          fi
          echo "tag=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Version: ${NEXT}"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: bot
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          # Cache-bust deps layer so caret ranges resolve to latest each rebuild.
          build-args: |
            BUILD_TS=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "claude-telegram-v${{ steps.version.outputs.tag }}"
          git push origin "claude-telegram-v${{ steps.version.outputs.tag }}"

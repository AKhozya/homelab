name: Build Claude Telegram Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag, major.minor.patch (e.g., 1.25.0). Leave empty to auto-increment patch.'
        required: false
        default: ''
  schedule:
    # Bi-weekly rebuild — Mon + Thu @ 23:00 UTC. Picks up SDK/CLI/base-image bumps.
    - cron: '0 23 * * 1,4'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: akhozya/claude-telegram-bot

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout homelab (for git tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout bot repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AKhozya/claude-telegram-bot
          path: bot

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version tag
        id: version
        run: |
          INPUT="${{ github.event.inputs.version }}"
          if [ -n "$INPUT" ]; then
            if ! echo "$INPUT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version must be major.minor.patch (e.g. 1.25.0), got '$INPUT'"
              exit 1
            fi
            NEXT="$INPUT"
          else
            # Auto-increment PATCH from the latest 3-component tag (each scheduled rebuild
            # is a dependency refresh = a patch bump). Reserve minor/major for manual input.
            LATEST=$(git tag -l 'claude-telegram-v*.*.*' --sort=-v:refname | head -1)
            if [ -n "$LATEST" ]; then
              V="${LATEST#claude-telegram-v}"          # e.g. 1.25.3
              MAJOR="${V%%.*}"; REST="${V#*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"
              NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
            else
              # Transition: no 3-component tag yet — continue the minor from the latest
              # legacy 2-component tag (claude-telegram-v1.NN → 1.NN.0).
              OLD=$(git tag -l 'claude-telegram-v1.*' --sort=-v:refname | head -1)
              if [ -n "$OLD" ]; then
                NEXT="1.$(echo "$OLD" | sed 's/claude-telegram-v1\.//').0"
              else
                NEXT="1.0.0"
              fi
            fi
          fi
          echo "tag=${NEXT}" >> $GITHUB_OUTPUT
          echo "Version: ${NEXT}"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: bot
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          # Cache-bust deps layer so caret ranges resolve to latest each rebuild.
          build-args: |
            BUILD_TS=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if git ls-remote --tags origin "claude-telegram-v${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "::error::Tag claude-telegram-v${{ steps.version.outputs.tag }} already exists. Re-run with manual version input."
            exit 1
          fi
          git tag "claude-telegram-v${{ steps.version.outputs.tag }}"
          git push origin "claude-telegram-v${{ steps.version.outputs.tag }}"

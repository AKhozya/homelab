name: Build Claude Telegram Image

on:
  push:
    branches: [main]
    paths:
      - 'docker/claude-telegram/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g., 1.5). Leave empty to auto-increment.'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: akhozya/claude-telegram

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Auto-increment: find latest claude-telegram-v1.* tag
            LATEST=$(git tag -l 'claude-telegram-v1.*' --sort=-v:refname | head -1)
            if [ -z "$LATEST" ]; then
              NEXT="1.0"
            else
              MINOR=$(echo "$LATEST" | sed 's/claude-telegram-v1\.//')
              NEXT="1.$((MINOR + 1))"
            fi
            echo "tag=${NEXT}" >> $GITHUB_OUTPUT
          fi
          echo "Version: $(cat $GITHUB_OUTPUT | grep tag)"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker/claude-telegram
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "claude-telegram-v${{ steps.version.outputs.tag }}"
          git push origin "claude-telegram-v${{ steps.version.outputs.tag }}"

[defaults]
# Force ansible-core 2.24 future behavior: facts NOT auto-injected as top-level vars.
# Bare `ansible_hostname` fails; must use `ansible_facts['hostname']`.
# Catches deprecation usage before upstream removal.
inject_facts_as_vars = False

# Fail-fast on deprecation warnings (CI/dev only — humans see stderr output anyway).
deprecation_warnings = True

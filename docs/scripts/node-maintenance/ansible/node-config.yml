---
# node-config.yml — idempotent node config drift-heal.
# Invoke from CP: ansible-playbook -D /etc/node-maintenance/ansible/node-config.yml -i /etc/node-maintenance/ansible/inventory.yml
# Role order: `packages` first so pkgs (ufw, logrotate, etc.) exist before config
# roles reference them. `ad_hoc` tasks tagged `never` — skipped by default daily
# timer, invoked explicitly via `-t <tag>`.

- name: Node config drift-heal (all hosts)
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: packages
    - role: base_config
    - role: k3s_config
    - role: k3s_image_gc
    # firewall_preflight runs BEFORE firewall so any drift-induced ip6tables
    # error gets healed (settle + modprobe + chain repair) before ufw tasks
    # touch the firewall.
    - role: firewall_preflight
    - role: firewall
    - role: hardening
    - role: nic_tuning
    - role: security_scan
    - role: ad_hoc

- name: Node config drift-heal (workers only)
  hosts: workers
  become: true
  gather_facts: false
  roles:
    # Defense: re-run preflight on workers before rebuilderd. rebuilderd does
    # not call ufw directly today but the play boundary resets state and a
    # cheap settle barrier guards against future role additions that might.
    - role: firewall_preflight
    - role: rebuilderd

---
# node-config.yml — idempotent node config drift-heal
# Invoke from CP: ansible-playbook -D /etc/node-maintenance/ansible/node-config.yml -i /etc/node-maintenance/ansible/inventory.yml
# Phases live: A (base_config, k3s_image_gc, rebuilderd).
#   Later phases add: UFW (C), SSH/sysctl (D), ad-hoc (E).

- name: Node config drift-heal — base + k3s-image-gc (all hosts)
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: base_config
    - role: k3s_image_gc

- name: Node config drift-heal — rebuilderd (workers only)
  hosts: workers
  become: true
  gather_facts: false
  roles:
    - role: rebuilderd

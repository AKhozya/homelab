---
# node-config.yml — idempotent node config drift-heal.
# Invoke from CP: ansible-playbook -D /etc/node-maintenance/ansible/node-config.yml -i /etc/node-maintenance/ansible/inventory.yml
# Role order: `packages` first so pkgs (ufw, logrotate, etc.) exist before config
# roles reference them. `ad_hoc` tasks tagged `never` — skipped by default daily
# timer, invoked explicitly via `-t <tag>`.
#
# Three-play split:
#   Play 1 (parallel): non-disruptive roles (file copies, package state).
#   Play 2 (serial:1): firewall — UFW reload races with k3s/flannel chain rebuild.
#                      Limit blast radius to 1 node at a time. Quorum (2/3) preserved.
#                      Coupled with firewall role's drift fingerprint gate, the
#                      rules block runs only when actual drift is detected.
#   Play 3 (parallel): post-firewall roles + workers-only tail.

- name: Node config drift-heal — non-disruptive (all hosts, parallel)
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: packages
    - role: base_config
    - role: k3s_config
    - role: k3s_image_gc
    # firewall_preflight runs BEFORE firewall so any drift-induced ip6tables
    # error gets healed (settle + modprobe + chain repair) before ufw tasks
    # touch the firewall.
    - role: firewall_preflight

- name: Node config drift-heal — firewall (serial, blast-radius limit)
  hosts: all
  become: true
  gather_facts: false
  serial: 1
  roles:
    - role: firewall

- name: Node config drift-heal — post-firewall (all hosts, parallel)
  hosts: all
  become: true
  gather_facts: false
  roles:
    - role: hardening
    - role: nic_tuning
    - role: security_scan
    - role: ad_hoc

- name: Node config drift-heal (workers only)
  hosts: workers
  become: true
  gather_facts: false
  roles:
    # Defense: re-run preflight on workers. The play boundary resets state and a
    # cheap settle barrier guards against role additions that might touch ufw.
    - role: firewall_preflight
    # Node-local self-heal for the post-reboot kube-proxy ClusterIP DNAT wedge
    # (restart k3s-agent when 10.43.0.1 DNAT is missing). Workers here; the CP is
    # handled by clusterip_heal_cp below (pod-netns probe + k3s restart).
    - role: clusterip_heal
    # ONE-SHOT: mops up rebuilderd leftovers the teardown missed (data root,
    # diffoscope orphan, pkg cache). Delete this role + line once verified (like
    # rebuilderd_teardown was). Idempotent no-op afterwards.
    - role: rebuilderd_cleanup

- name: Node config drift-heal (control-plane only)
  hosts: control_plane
  become: true
  gather_facts: false
  roles:
    # CP counterpart of clusterip_heal. The CP host-netns ClusterIP probe false-reads wedged, so this
    # uses a pod-netns probe (nsenter into coredns) + a timeout-guarded `systemctl restart k3s`. The
    # "restart-k3s-on-CP hangs" caveat was disproven 2026-06-29 (clean ~30-60s restart that
    # reprogrammed the DNAT); the timeout makes any future hang a give-up+alert, never an indefinite
    # control-plane wedge. Fixes the gap where a CP-pinned pod (e.g. uptime-kuma) stays DNS-dead
    # post-reboot with no auto-heal.
    - role: clusterip_heal_cp

---
# rebuilderd — worker-specific tasks.
# Out of scope: /etc/rebuilderd-worker.conf (hand-configured build timeout inside [build] section — leave).
# Orphan units removed: rebuilderd-reenable-stop.* (W1), rebuilderd-worker-scheduled.service (W2).

- name: Ensure rebuilderd pkg installed
  ansible.builtin.package:
    name: rebuilderd
    state: present
  register: pkg_rebuilderd
  until: pkg_rebuilderd is not failed
  retries: 3
  delay: 30
  tags: [rebuilderd, pkg]

- name: Ensure node-exporter textfile dir
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [rebuilderd, metrics]

- name: Ensure rebuilderd-worker@.service.d exists
  ansible.builtin.file:
    path: /etc/systemd/system/rebuilderd-worker@.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [rebuilderd, resources]

- name: Deploy rebuilderd-worker resources.conf drop-in (per-host cpu/mem/path)
  ansible.builtin.copy:
    src: "resources-{{ inventory_hostname }}.conf"
    dest: /etc/systemd/system/rebuilderd-worker@.service.d/resources.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [rebuilderd, resources]

- name: Deploy rebuilderd-metrics units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - rebuilderd-metrics.service
    - rebuilderd-metrics.timer
  notify: Reload systemd
  tags: [rebuilderd, metrics]

- name: Deploy rebuilderd-metrics.sh
  ansible.builtin.copy:
    src: rebuilderd-metrics.sh
    dest: /usr/local/bin/rebuilderd-metrics.sh
    owner: root
    group: root
    mode: "0755"
  tags: [rebuilderd, metrics]

- name: Deploy rebuilderd-watchdog units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - rebuilderd-watchdog.service
    - rebuilderd-watchdog.timer
  notify: Reload systemd
  tags: [rebuilderd, watchdog]

- name: Deploy rebuilderd-watchdog.sh
  ansible.builtin.copy:
    src: rebuilderd-watchdog.sh
    dest: /usr/local/bin/rebuilderd-watchdog.sh
    owner: root
    group: root
    mode: "0755"
  tags: [rebuilderd, watchdog]

- name: Deploy rebuilderd-worker-boot.timer
  ansible.builtin.copy:
    src: rebuilderd-worker-boot.timer
    dest: /etc/systemd/system/rebuilderd-worker-boot.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [rebuilderd, boot]

- name: Deploy repro-cleanup units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - repro-cleanup.service
    - repro-cleanup.timer
  notify: Reload systemd
  tags: [rebuilderd, repro-cleanup]

- name: Deploy cleanup-stale-repro.sh (per-host repro path)
  ansible.builtin.copy:
    src: "cleanup-stale-repro-{{ inventory_hostname }}.sh"
    dest: /usr/local/bin/cleanup-stale-repro.sh
    owner: root
    group: root
    mode: "0755"
  tags: [rebuilderd, repro-cleanup]

- name: Enable rebuilderd ancillary timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: false
  loop:
    - rebuilderd-metrics.timer
    - rebuilderd-watchdog.timer
    - rebuilderd-worker-boot.timer
    - repro-cleanup.timer
  tags: [rebuilderd, timers]

# ── orphan cleanup ──
- name: Stop + disable orphan rebuilderd-reenable-stop units (W1)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
    daemon_reload: false
  loop:
    - rebuilderd-reenable-stop.timer
    - rebuilderd-reenable-stop.service
  failed_when: false
  when: inventory_hostname == "worker-node"
  tags: [rebuilderd, orphan]

- name: Remove orphan rebuilderd-reenable-stop unit files (W1)
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - rebuilderd-reenable-stop.service
    - rebuilderd-reenable-stop.timer
  when: inventory_hostname == "worker-node"
  notify: Reload systemd
  tags: [rebuilderd, orphan]

- name: Stop + disable orphan rebuilderd-worker-scheduled (W2)
  ansible.builtin.systemd_service:
    name: rebuilderd-worker-scheduled.service
    enabled: false
    state: stopped
    daemon_reload: false
  failed_when: false
  when: inventory_hostname == "worker-node-2"
  tags: [rebuilderd, orphan]

- name: Remove orphan rebuilderd-worker-scheduled.service (W2)
  ansible.builtin.file:
    path: /etc/systemd/system/rebuilderd-worker-scheduled.service
    state: absent
  when: inventory_hostname == "worker-node-2"
  notify: Reload systemd
  tags: [rebuilderd, orphan]

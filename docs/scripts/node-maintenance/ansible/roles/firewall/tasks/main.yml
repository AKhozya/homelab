---
# firewall — UFW policies, rules, route rules, enable.
# Applies to: all hosts. Idempotent — community.general.ufw skips rules already
# present (matched by src/dst/port/proto, ignoring comment).
#
# Safety: UFW is already active on all 3 nodes with a working rule set.
# This role is declarative-additive: it will not delete rules not in the list.
# To remove a rule, edit live state manually + the var, then re-run.
# Never `ufw reset` here — lockout risk.

- name: Ensure ufw package is installed
  ansible.builtin.package:
    name: ufw
    state: present
  tags: [firewall]

# Pre-heal: ip6tables state drifts at runtime when K3s/kube-router + fail2ban
# race-mutate kernel nft state against UFW's ip6tables-restore (silent partial
# load). Symptom: `ufw status verbose` returns "ERROR: problem running ip6tables";
# community.general.ufw tasks then fail.
#
# Strategy: try `ufw reload`, on failure do per-chain repair (idempotent
# ip6tables -N for any chain declared in UFW rules files but missing from
# kernel). Repair is race-free because each -N is a single syscall; no atomic
# restore to collide with.
#
# Related boot-time heal: ufw-heal-post-k3s.service (deployed below).
# Refs: UFW #1987227, #1294544; K3s #1280.
- name: Pre-heal — ufw reload with retry + per-chain repair
  ansible.builtin.shell: |
    set +e
    reload_ok=0
    for attempt in 1 2 3; do
      if /usr/sbin/ufw reload >/dev/null 2>&1; then
        reload_ok=1
        break
      fi
      sleep 5
    done
    if [ "$reload_ok" = "1" ]; then
      echo "RELOAD_OK"
      exit 0
    fi
    # Fallback: check if ufw is simply inactive (benign)
    status=$(/usr/sbin/ufw status 2>&1 || true)
    if echo "$status" | grep -qiE "inactive|not enabled"; then
      echo "UFW_INACTIVE"
      exit 0
    fi
    # Per-chain repair (race-free)
    repaired=0
    for rules_file in /etc/ufw/before.rules /etc/ufw/after.rules /etc/ufw/user.rules; do
      [ -f "$rules_file" ] || continue
      for chain in $(grep -E '^:[a-zA-Z0-9_-]+' "$rules_file" | awk -F'[: ]' '{print $2}'); do
        if ! /usr/sbin/iptables -L "$chain" -n >/dev/null 2>&1; then
          /usr/sbin/iptables -N "$chain" 2>/dev/null && repaired=$((repaired + 1))
        fi
      done
    done
    for rules_file in /etc/ufw/before6.rules /etc/ufw/after6.rules /etc/ufw/user6.rules; do
      [ -f "$rules_file" ] || continue
      for chain in $(grep -E '^:[a-zA-Z0-9_-]+' "$rules_file" | awk -F'[: ]' '{print $2}'); do
        if ! /usr/sbin/ip6tables -L "$chain" -n >/dev/null 2>&1; then
          /usr/sbin/ip6tables -N "$chain" 2>/dev/null && repaired=$((repaired + 1))
        fi
      done
    done
    # Retry reload once after repair
    if /usr/sbin/ufw reload >/dev/null 2>&1; then
      echo "RELOAD_OK_AFTER_REPAIR repaired=$repaired"
      exit 0
    fi
    echo "PREHEAL_FAILED repaired=$repaired"
    exit 1
  args:
    executable: /bin/bash
  register: ufw_preheal
  changed_when: false
  failed_when: ufw_preheal.rc != 0
  tags: [firewall]

# SSH rule first — guarantees lockout-safety if policies applied before rules
# ever produce an inconsistent state (should not happen in steady state, but
# cheap insurance).
- name: Ensure SSH rule (lockout-safety, applied before policies)
  community.general.ufw:
    rule: allow
    from_ip: 192.168.1.0/24
    to_port: "65300"
    proto: tcp
    comment: "SSH from LAN"
  tags: [firewall]

- name: Set UFW default incoming policy + logging
  community.general.ufw:
    default: "{{ ufw_policy_incoming }}"
    direction: incoming
    logging: "{{ ufw_logging }}"
  tags: [firewall]

- name: Set UFW default outgoing policy
  community.general.ufw:
    default: "{{ ufw_policy_outgoing }}"
    direction: outgoing
  tags: [firewall]

- name: Set UFW default routed policy
  community.general.ufw:
    default: "{{ ufw_policy_routed }}"
    direction: routed
  tags: [firewall]

- name: Apply UFW rules (base + group + host)
  community.general.ufw:
    rule: "{{ item.rule }}"
    from_ip: "{{ item.from_ip | default(omit) }}"
    to_ip: "{{ item.to_ip | default(omit) }}"
    from_port: "{{ item.from_port | default(omit) }}"
    to_port: "{{ item.to_port | default(omit) }}"
    proto: "{{ item.proto | default(omit) }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ ufw_rules_base + ufw_rules_group + ufw_rules_host }}"
  loop_control:
    label: "{{ item.comment | default('rule') }} / {{ item.rule }} from={{ item.from_ip | default('any') }} to={{ item.to_port | default('any') }}/{{ item.proto | default('any') }}"
  tags: [firewall]

- name: Apply UFW route rules (base + group + host)
  community.general.ufw:
    rule: "{{ item.rule }}"
    route: true
    from_ip: "{{ item.from_ip | default(omit) }}"
    to_ip: "{{ item.to_ip | default(omit) }}"
    from_port: "{{ item.from_port | default(omit) }}"
    to_port: "{{ item.to_port | default(omit) }}"
    proto: "{{ item.proto | default(omit) }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ ufw_route_rules_base + ufw_route_rules_group + ufw_route_rules_host }}"
  loop_control:
    label: "{{ item.comment | default('route') }} / {{ item.rule }} {{ item.from_ip | default('any') }} -> {{ item.to_ip | default('any') }}"
  tags: [firewall]

- name: Enable UFW (no-op if already enabled)
  community.general.ufw:
    state: enabled
  tags: [firewall]

- name: Ensure ufw.service enabled at boot
  ansible.builtin.systemd_service:
    name: ufw.service
    enabled: true
  tags: [firewall]

# Post-boot heal: K3s/kube-router + fail2ban race-mutate ip6tables after
# ufw.service starts; UFW's ip6tables-restore partially loads, leaving chains
# missing. Healer script does settle-wait + reload + per-chain repair + verify.
# First seen: 2026-04-20 W1 post-reboot (see memory/gotcha_ufw_ip6tables_post_reboot.md).
# Replaces prior ufw-reload-after-k3s.service (bare `ufw reload`, too fragile).
- name: Deploy ufw-heal-post-k3s.sh (boot-time healer)
  ansible.builtin.copy:
    src: ufw-heal-post-k3s.sh
    dest: /usr/local/sbin/ufw-heal-post-k3s.sh
    owner: root
    group: root
    mode: "0755"
  tags: [firewall]

- name: Deploy ufw-heal-post-k3s.service
  ansible.builtin.copy:
    src: ufw-heal-post-k3s.service
    dest: /etc/systemd/system/ufw-heal-post-k3s.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [firewall]

- name: Enable ufw-heal-post-k3s.service at boot
  ansible.builtin.systemd_service:
    name: ufw-heal-post-k3s.service
    enabled: true
  tags: [firewall]

# Retire old service (safe — unit file no longer referenced, disable + remove).
- name: Disable legacy ufw-reload-after-k3s.service
  ansible.builtin.systemd_service:
    name: ufw-reload-after-k3s.service
    enabled: false
    state: stopped
  failed_when: false
  tags: [firewall]

- name: Remove legacy ufw-reload-after-k3s.service unit file
  ansible.builtin.file:
    path: /etc/systemd/system/ufw-reload-after-k3s.service
    state: absent
  notify: Reload systemd
  tags: [firewall]

# ──────────────────────────────────────────────────────────────
# L3: UFW state metric for node-exporter textfile collector
# ──────────────────────────────────────────────────────────────
- name: Ensure node-exporter textfile dir exists
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [firewall, metrics]

- name: Deploy ufw-state-metric.sh
  ansible.builtin.copy:
    src: ufw-state-metric.sh
    dest: /usr/local/sbin/ufw-state-metric.sh
    owner: root
    group: root
    mode: "0755"
  tags: [firewall, metrics]

- name: Deploy ufw-state-metric.service
  ansible.builtin.copy:
    src: ufw-state-metric.service
    dest: /etc/systemd/system/ufw-state-metric.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [firewall, metrics]

- name: Deploy ufw-state-metric.timer
  ansible.builtin.copy:
    src: ufw-state-metric.timer
    dest: /etc/systemd/system/ufw-state-metric.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [firewall, metrics]

- name: Enable + start ufw-state-metric.timer
  ansible.builtin.systemd_service:
    name: ufw-state-metric.timer
    enabled: true
    state: started
  tags: [firewall, metrics]

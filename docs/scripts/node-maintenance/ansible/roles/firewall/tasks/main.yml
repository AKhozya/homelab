---
# firewall — UFW policies, rules, route rules, enable.
# Applies to: all hosts. Idempotent — community.general.ufw skips rules already
# present (matched by src/dst/port/proto, ignoring comment).
#
# Safety: UFW is already active on all 3 nodes with a working rule set.
# This role is declarative-additive: it will not delete rules not in the list.
# To remove a rule, edit live state manually + the var, then re-run.
# Never `ufw reset` here — lockout risk.
#
# Resilience layers (2026-04-29 hardening):
#   L0  preflight role runs first (settle barrier, xtables-lock probe)
#   L1  pre-heal task: per-chain repair + ufw reload ONLY if a chain was missing
#       (unconditional reload wedged W2's k3s tunnel 2026-07-10 — see task below)
#   L2  per-task retries: until/retries=10 delay=20 → 200s window/task
#   L3  block/rescue around UFW rule set: on rescue → diag snapshot +
#       ufw-heal-post-k3s.sh + one re-attempt of the rule batch
#   L4  modules-load.d persistence + systemd ordering
#   L5  boot-time healer: ufw-heal-post-k3s.service

- name: Ensure ufw package is installed
  ansible.builtin.package:
    name: ufw
    state: present
  register: pkg_ufw
  until: pkg_ufw is not failed
  retries: 3
  delay: 30
  tags: [firewall]

- name: Pre-heal — per-chain repair then ufw reload
  ansible.builtin.shell: |
    set -o pipefail
    set +e
    status=$(/usr/sbin/ufw status 2>&1 || true)
    if echo "$status" | grep -qiE "inactive|not enabled"; then
      echo "UFW_INACTIVE"
      exit 0
    fi
    repaired=0
    for rules_file in /etc/ufw/before.rules /etc/ufw/after.rules /etc/ufw/user.rules; do
      [ -f "$rules_file" ] || continue
      for chain in $(grep -E '^:[a-zA-Z0-9_-]+' "$rules_file" | awk -F'[: ]' '{print $2}'); do
        if ! /usr/sbin/iptables -L "$chain" -n >/dev/null 2>&1; then
          /usr/sbin/iptables -N "$chain" 2>/dev/null && repaired=$((repaired + 1))
        fi
      done
    done
    for rules_file in /etc/ufw/before6.rules /etc/ufw/after6.rules /etc/ufw/user6.rules; do
      [ -f "$rules_file" ] || continue
      for chain in $(grep -E '^:[a-zA-Z0-9_-]+' "$rules_file" | awk -F'[: ]' '{print $2}'); do
        if ! /usr/sbin/ip6tables -L "$chain" -n >/dev/null 2>&1; then
          /usr/sbin/ip6tables -N "$chain" 2>/dev/null && repaired=$((repaired + 1))
        fi
      done
    done
    # Reload ONLY when a chain was actually missing (repaired > 0). The reload
    # exists to restore UFW rules over freshly-recreated chains; with nothing
    # repaired there is nothing to restore. An unconditional `ufw reload` on a
    # healthy node is a full iptables flush+rebuild that races the k3s agent↔CP
    # websocket tunnel (127.0.0.1:6444 client LB) — the reload dropped the
    # tunnel on W2 2026-07-10, wedging the node NotReady and blackholing host
    # SSH (65300) for ~90min until a manual power-cycle. Skip = idempotent no-op.
    if [ "$repaired" -eq 0 ]; then
      echo "NOHEAL_NEEDED repaired=0 (no missing chains — ufw reload skipped)"
      exit 0
    fi
    for attempt in 1 2 3; do
      if /usr/sbin/ufw reload >/dev/null 2>&1; then
        echo "RELOAD_OK repaired=$repaired attempt=$attempt"
        exit 0
      fi
      sleep 5
    done
    echo "PREHEAL_FAILED repaired=$repaired"
    exit 1
  args:
    executable: /bin/bash
  register: ufw_preheal
  changed_when: false
  failed_when: ufw_preheal.rc != 0
  tags: [firewall]

# Diag snapshot script — used by rescue block AND on-demand by operator.
- name: Deploy ufw-diag-snapshot.sh
  ansible.builtin.copy:
    src: ufw-diag-snapshot.sh
    dest: /usr/local/sbin/ufw-diag-snapshot.sh
    owner: root
    group: root
    mode: "0755"
  tags: [firewall, diag]

# Drift fingerprint gate — skip rules block when live state matches last known good.
# Cache lives at /var/lib/ufw-state/ufw-fingerprint. Each successful run
# updates it. Daily drift-heal on a healthy node = no UFW reload, no race.
#
# Fingerprint inputs (sha256):
#   - /etc/default/ufw            (default policies + logging)
#   - `ufw status verbose`         (rules + numbered state)
#   - sha256 of each ufw_rules_*   (var-side drift detection)
#
# To force re-run after manual rule edit: `rm /var/lib/ufw-state/ufw-fingerprint`
- name: Compute current UFW fingerprint
  ansible.builtin.shell: |
    set -o pipefail
    {
      cat /etc/default/ufw 2>/dev/null
      /usr/sbin/ufw status verbose 2>/dev/null
      printf '%s\n' \
        '{{ ufw_policy_incoming }}' \
        '{{ ufw_policy_outgoing }}' \
        '{{ ufw_policy_routed }}' \
        '{{ ufw_logging }}'
      printf '%s\n' {{ (ufw_rules_base + ufw_rules_group + ufw_rules_host) | to_json | quote }}
      printf '%s\n' {{ (ufw_route_rules_base + ufw_route_rules_group + ufw_route_rules_host) | to_json | quote }}
    } | sha256sum | awk '{print $1}'
  args:
    executable: /bin/bash
  register: ufw_current_fp
  changed_when: false
  tags: [firewall]

- name: Read cached UFW fingerprint
  ansible.builtin.slurp:
    src: /var/lib/ufw-state/ufw-fingerprint
  register: ufw_cached_fp_raw
  failed_when: false
  changed_when: false
  tags: [firewall]

- name: Set ufw_drift_detected fact
  ansible.builtin.set_fact:
    ufw_drift_detected: >-
      {{
        ufw_cached_fp_raw.content is not defined
        or (ufw_cached_fp_raw.content | b64decode | trim) != ufw_current_fp.stdout
      }}
  tags: [firewall]

- name: Log drift gate decision
  ansible.builtin.debug:
    msg: "ufw drift gate: drift_detected={{ ufw_drift_detected }} current_fp={{ ufw_current_fp.stdout[:12] }}"
  tags: [firewall]

# UFW rule application — wrapped in block/rescue for L3 resilience.
# On rescue: diag snapshot → ufw-heal-post-k3s.sh → single re-attempt.
# Per-task retries (L2): retries=10 delay=20 = 200s window/task. Survives
# longer kube-proxy/flannel race bursts (50s window was insufficient
# 2026-04-29; multiple W2 fatals at attempts=5).
#
# Gated on ufw_drift_detected (above). Default-true on first run (no cache).
- name: UFW rules block (with rescue heal+retry)
  when: ufw_drift_detected | default(true)
  block:
    - name: Ensure SSH rule (lockout-safety, applied before policies)
      community.general.ufw:
        rule: allow
        from_ip: 192.168.1.0/24
        to_port: "65300"
        proto: tcp
        comment: "SSH from LAN"
      register: ufw_ssh
      until: ufw_ssh is not failed
      retries: 10
      delay: 20

    - name: Set UFW default incoming policy + logging
      community.general.ufw:
        default: "{{ ufw_policy_incoming }}"
        direction: incoming
        logging: "{{ ufw_logging }}"
      register: ufw_default_in
      until: ufw_default_in is not failed
      retries: 10
      delay: 20

    - name: Set UFW default outgoing policy
      community.general.ufw:
        default: "{{ ufw_policy_outgoing }}"
        direction: outgoing
      register: ufw_default_out
      until: ufw_default_out is not failed
      retries: 10
      delay: 20

    - name: Set UFW default routed policy
      community.general.ufw:
        default: "{{ ufw_policy_routed }}"
        direction: routed
      register: ufw_default_routed
      until: ufw_default_routed is not failed
      retries: 10
      delay: 20

    - name: Apply UFW rules (base + group + host)
      community.general.ufw:
        rule: "{{ item.rule }}"
        from_ip: "{{ item.from_ip | default(omit) }}"
        to_ip: "{{ item.to_ip | default(omit) }}"
        from_port: "{{ item.from_port | default(omit) }}"
        to_port: "{{ item.to_port | default(omit) }}"
        proto: "{{ item.proto | default(omit) }}"
        comment: "{{ item.comment | default(omit) }}"
      loop: "{{ ufw_rules_base + ufw_rules_group + ufw_rules_host }}"
      loop_control:
        label: "{{ item.comment | default('rule') }} / {{ item.rule }} from={{ item.from_ip | default('any') }} to={{ item.to_port | default('any') }}/{{ item.proto | default('any') }}"
      register: ufw_rules_apply
      until: ufw_rules_apply is not failed
      retries: 10
      delay: 20

    - name: Apply UFW route rules (base + group + host)
      community.general.ufw:
        rule: "{{ item.rule }}"
        route: true
        from_ip: "{{ item.from_ip | default(omit) }}"
        to_ip: "{{ item.to_ip | default(omit) }}"
        from_port: "{{ item.from_port | default(omit) }}"
        to_port: "{{ item.to_port | default(omit) }}"
        proto: "{{ item.proto | default(omit) }}"
        comment: "{{ item.comment | default(omit) }}"
      loop: "{{ ufw_route_rules_base + ufw_route_rules_group + ufw_route_rules_host }}"
      loop_control:
        label: "{{ item.comment | default('route') }} / {{ item.rule }} {{ item.from_ip | default('any') }} -> {{ item.to_ip | default('any') }}"
      register: ufw_routes_apply
      until: ufw_routes_apply is not failed
      retries: 10
      delay: 20

    - name: Enable UFW (no-op if already enabled)
      community.general.ufw:
        state: enabled
      register: ufw_enable
      until: ufw_enable is not failed
      retries: 10
      delay: 20

    # Marker fact: block completed without rescue. Gates fingerprint cache
    # update — we only cache when state ended cleanly.
    - name: Mark UFW block clean (no rescue)
      ansible.builtin.set_fact:
        ufw_block_clean: true
  rescue:
    - name: Capture diag snapshot on UFW rule batch failure
      ansible.builtin.command:
        cmd: /usr/local/sbin/ufw-diag-snapshot.sh ansible-rescue
      register: ufw_diag
      changed_when: false
      failed_when: false

    - name: Run ufw-heal-post-k3s.sh from rescue
      ansible.builtin.command:
        cmd: /usr/local/sbin/ufw-heal-post-k3s.sh
      register: ufw_rescue_heal
      changed_when: false
      failed_when: false

    - name: Log rescue diag + heal outcome
      ansible.builtin.debug:
        msg: |
          UFW rule batch failed; rescue ran:
          diag={{ ufw_diag.stdout | default('(no path)') }}
          heal_rc={{ ufw_rescue_heal.rc | default('?') }}
          heal_stderr={{ (ufw_rescue_heal.stderr_lines | default([]))[-5:] }}

    # Re-attempt the single most-likely-to-fail policy task. If still fails,
    # play continues to next task (community.general.ufw rule batch is
    # idempotent on subsequent run).
    - name: Re-attempt UFW default incoming policy after heal
      community.general.ufw:
        default: "{{ ufw_policy_incoming }}"
        direction: incoming
        logging: "{{ ufw_logging }}"
      register: ufw_rescue_retry
      until: ufw_rescue_retry is not failed
      retries: 5
      delay: 15
      failed_when: false
  tags: [firewall]

# Update fingerprint cache after a clean block run. Skipped if rescue ran
# (state may be partially healed; want next run to re-evaluate, not cache
# bad state).
- name: Ensure UFW state cache directory
  ansible.builtin.file:
    path: /var/lib/ufw-state
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ufw_drift_detected | default(true)
  tags: [firewall]

- name: Recompute UFW fingerprint after rules apply
  ansible.builtin.shell: |
    set -o pipefail
    {
      cat /etc/default/ufw 2>/dev/null
      /usr/sbin/ufw status verbose 2>/dev/null
      printf '%s\n' \
        '{{ ufw_policy_incoming }}' \
        '{{ ufw_policy_outgoing }}' \
        '{{ ufw_policy_routed }}' \
        '{{ ufw_logging }}'
      printf '%s\n' {{ (ufw_rules_base + ufw_rules_group + ufw_rules_host) | to_json | quote }}
      printf '%s\n' {{ (ufw_route_rules_base + ufw_route_rules_group + ufw_route_rules_host) | to_json | quote }}
    } | sha256sum | awk '{print $1}'
  args:
    executable: /bin/bash
  register: ufw_post_fp
  changed_when: false
  when:
    - ufw_drift_detected | default(true)
    - ufw_block_clean | default(false)
  tags: [firewall]

- name: Persist new UFW fingerprint cache
  ansible.builtin.copy:
    content: "{{ ufw_post_fp.stdout }}\n"
    dest: /var/lib/ufw-state/ufw-fingerprint
    owner: root
    group: root
    mode: "0644"
  when:
    - ufw_drift_detected | default(true)
    - ufw_block_clean | default(false)
    - ufw_post_fp.stdout is defined
    - ufw_post_fp.stdout | length == 64
  tags: [firewall]

- name: Ensure ufw.service enabled at boot
  ansible.builtin.systemd_service:
    name: ufw.service
    enabled: true
  tags: [firewall]

- name: Deploy check-phase2-flag-age.sh (ExecCondition for config.service)
  ansible.builtin.copy:
    src: check-phase2-flag-age.sh
    dest: /usr/local/sbin/check-phase2-flag-age.sh
    owner: root
    group: root
    mode: "0755"
  tags: [firewall]

- name: Deploy ufw-heal-post-k3s.sh (boot-time healer)
  ansible.builtin.copy:
    src: ufw-heal-post-k3s.sh
    dest: /usr/local/sbin/ufw-heal-post-k3s.sh
    owner: root
    group: root
    mode: "0755"
  tags: [firewall]

- name: Deploy ufw-heal-post-k3s.service
  ansible.builtin.copy:
    src: ufw-heal-post-k3s.service
    dest: /etc/systemd/system/ufw-heal-post-k3s.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [firewall]

- name: Enable ufw-heal-post-k3s.service at boot
  ansible.builtin.systemd_service:
    name: ufw-heal-post-k3s.service
    enabled: true
  tags: [firewall]

- name: Deploy ufw-heal-watchdog.service
  ansible.builtin.copy:
    src: ufw-heal-watchdog.service
    dest: /etc/systemd/system/ufw-heal-watchdog.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [firewall]

- name: Deploy ufw-heal-watchdog.timer
  ansible.builtin.copy:
    src: ufw-heal-watchdog.timer
    dest: /etc/systemd/system/ufw-heal-watchdog.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [firewall]

- name: Enable ufw-heal-watchdog.timer
  ansible.builtin.systemd_service:
    name: ufw-heal-watchdog.timer
    enabled: true
    state: started
  tags: [firewall]

- name: Disable legacy ufw-reload-after-k3s.service
  ansible.builtin.systemd_service:
    name: ufw-reload-after-k3s.service
    enabled: false
    state: stopped
  failed_when: false
  tags: [firewall]

- name: Remove legacy ufw-reload-after-k3s.service unit file
  ansible.builtin.file:
    path: /etc/systemd/system/ufw-reload-after-k3s.service
    state: absent
  notify: Reload systemd
  tags: [firewall]

# ──────────────────────────────────────────────────────────────
# UFW state metric for node-exporter textfile collector
# ──────────────────────────────────────────────────────────────
- name: Ensure node-exporter textfile dir exists
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [firewall, metrics]

- name: Deploy ufw-state-metric.sh
  ansible.builtin.copy:
    src: ufw-state-metric.sh
    dest: /usr/local/sbin/ufw-state-metric.sh
    owner: root
    group: root
    mode: "0755"
  tags: [firewall, metrics]

- name: Deploy ufw-state-metric.service
  ansible.builtin.copy:
    src: ufw-state-metric.service
    dest: /etc/systemd/system/ufw-state-metric.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [firewall, metrics]

- name: Deploy ufw-state-metric.timer
  ansible.builtin.copy:
    src: ufw-state-metric.timer
    dest: /etc/systemd/system/ufw-state-metric.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [firewall, metrics]

- name: Enable + start ufw-state-metric.timer
  ansible.builtin.systemd_service:
    name: ufw-state-metric.timer
    enabled: true
    state: started
  tags: [firewall, metrics]

# ──────────────────────────────────────────────────────────────
# kernel module persistence + ordering
# ──────────────────────────────────────────────────────────────
- name: Deploy modules-load.d entry for UFW netfilter modules
  ansible.builtin.copy:
    src: modules-load-ufw.conf
    dest: /etc/modules-load.d/ufw-iptables.conf
    owner: root
    group: root
    mode: "0644"
  register: modules_load_ufw
  tags: [firewall, modules]

- name: Load netfilter modules now (idempotent)
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - ip6_tables
    - ip6table_filter
    - ip6table_nat
    - ip6table_mangle
    - ip6table_raw
    - iptable_filter
    - iptable_nat
    - iptable_mangle
    - iptable_raw
    - nf_conntrack
  tags: [firewall, modules]

- name: Ensure ufw.service.d drop-in dir
  ansible.builtin.file:
    path: /etc/systemd/system/ufw.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [firewall, modules]

- name: Deploy ufw.service drop-in to depend on systemd-modules-load.service
  ansible.builtin.copy:
    src: ufw-modules.conf
    dest: /etc/systemd/system/ufw.service.d/modules.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [firewall, modules]

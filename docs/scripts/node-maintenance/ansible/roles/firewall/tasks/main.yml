---
# firewall — UFW policies, rules, route rules, enable.
# Applies to: all hosts. Idempotent — community.general.ufw skips rules already
# present (matched by src/dst/port/proto, ignoring comment).
#
# Safety: UFW is already active on all 3 nodes with a working rule set.
# This role is declarative-additive: it will not delete rules not in the list.
# To remove a rule, edit live state manually + the var, then re-run.
# Never `ufw reset` here — lockout risk.

- name: Ensure ufw package is installed
  ansible.builtin.package:
    name: ufw
    state: present
  tags: [firewall]

# Pre-heal: ip6tables state drifts at runtime (suspected K3s/flannel + kube-proxy
# iptables-restore races with UFW's ip6tables-save on `ufw status verbose`). When
# this happens, every community.general.ufw task fails with "ERROR: problem
# running ip6tables". `ufw reload` rebuilds chains from rules files and
# normalizes state → subsequent module invocations succeed. changed_when: false
# keeps this out of the drift count. Boot-time heal via ufw-reload-after-k3s.service
# covers post-boot window; this covers mid-lifetime drift between drift-heal runs.
- name: Pre-heal — reload UFW to normalize ip6tables state
  ansible.builtin.command:
    cmd: ufw reload
  register: ufw_preheal
  changed_when: false
  failed_when: >-
    ufw_preheal.rc != 0 and
    'inactive' not in (ufw_preheal.stderr | default('')) and
    'not enabled' not in (ufw_preheal.stderr | default(''))
  tags: [firewall]

# SSH rule first — guarantees lockout-safety if policies applied before rules
# ever produce an inconsistent state (should not happen in steady state, but
# cheap insurance).
- name: Ensure SSH rule (lockout-safety, applied before policies)
  community.general.ufw:
    rule: allow
    from_ip: 192.168.1.0/24
    to_port: "65300"
    proto: tcp
    comment: "SSH from LAN"
  tags: [firewall]

- name: Set UFW default incoming policy + logging
  community.general.ufw:
    default: "{{ ufw_policy_incoming }}"
    direction: incoming
    logging: "{{ ufw_logging }}"
  tags: [firewall]

- name: Set UFW default outgoing policy
  community.general.ufw:
    default: "{{ ufw_policy_outgoing }}"
    direction: outgoing
  tags: [firewall]

- name: Set UFW default routed policy
  community.general.ufw:
    default: "{{ ufw_policy_routed }}"
    direction: routed
  tags: [firewall]

- name: Apply UFW rules (base + group + host)
  community.general.ufw:
    rule: "{{ item.rule }}"
    from_ip: "{{ item.from_ip | default(omit) }}"
    to_ip: "{{ item.to_ip | default(omit) }}"
    from_port: "{{ item.from_port | default(omit) }}"
    to_port: "{{ item.to_port | default(omit) }}"
    proto: "{{ item.proto | default(omit) }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ ufw_rules_base + ufw_rules_group + ufw_rules_host }}"
  loop_control:
    label: "{{ item.comment | default('rule') }} / {{ item.rule }} from={{ item.from_ip | default('any') }} to={{ item.to_port | default('any') }}/{{ item.proto | default('any') }}"
  tags: [firewall]

- name: Apply UFW route rules (base + group + host)
  community.general.ufw:
    rule: "{{ item.rule }}"
    route: true
    from_ip: "{{ item.from_ip | default(omit) }}"
    to_ip: "{{ item.to_ip | default(omit) }}"
    from_port: "{{ item.from_port | default(omit) }}"
    to_port: "{{ item.to_port | default(omit) }}"
    proto: "{{ item.proto | default(omit) }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ ufw_route_rules_base + ufw_route_rules_group + ufw_route_rules_host }}"
  loop_control:
    label: "{{ item.comment | default('route') }} / {{ item.rule }} {{ item.from_ip | default('any') }} -> {{ item.to_ip | default('any') }}"
  tags: [firewall]

- name: Enable UFW (no-op if already enabled)
  community.general.ufw:
    state: enabled
  tags: [firewall]

- name: Ensure ufw.service enabled at boot
  ansible.builtin.systemd_service:
    name: ufw.service
    enabled: true
  tags: [firewall]

# Post-boot heal: K3s/flannel populates ip6tables after ufw.service starts.
# On subsequent ufw invocations (e.g. `ufw status verbose` from ansible
# drift-heal), ufw's ip6tables-save parse can fail with "ERROR: problem
# running ip6tables" until a full ufw reload normalizes chain state.
# This unit runs `ufw reload` once at boot after k3s is up, self-healing
# the state before any scheduled drift-heal or operator invocation.
# First seen: 2026-04-20 W1 post-reboot (see memory/gotcha_ufw_ip6tables_post_reboot.md).
- name: Deploy ufw-reload-after-k3s.service (heals post-reboot ip6tables state)
  ansible.builtin.copy:
    dest: /etc/systemd/system/ufw-reload-after-k3s.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Reload UFW after K3s populates ip6tables (heals post-reboot drift)
      After=k3s.service k3s-agent.service ufw.service network-online.target
      Wants=ufw.service
      ConditionPathExists=/usr/sbin/ufw

      [Service]
      Type=oneshot
      ExecStartPre=/bin/sleep 15
      ExecStart=/usr/sbin/ufw reload
      RemainAfterExit=no

      [Install]
      WantedBy=multi-user.target
  notify: Reload systemd
  tags: [firewall]

- name: Enable ufw-reload-after-k3s.service at boot
  ansible.builtin.systemd_service:
    name: ufw-reload-after-k3s.service
    enabled: true
  tags: [firewall]

# /etc/modules-load.d/ufw-iptables.conf
# Ensure netfilter modules required by UFW are loaded at boot.
# Without these, `ufw status verbose` returns "ERROR: problem running ip6tables".
#
# History:
#   2026-04-26 W2: ip6_tables module unloaded mid-runtime
#   2026-04-28 W2: ufw status failed despite ip6_tables loaded — root cause
#     missing nat/mangle/raw table modules. iptables-restore on before6.rules
#     references *mangle/*nat tables; auto-load fails under K3s/fail2ban
#     iptables lock contention.
#
# Modules cover: filter (default UFW chains), nat (route rules / MASQUERADE),
# mangle (TOS / mark), raw (NOTRACK), nf_conntrack (stateful matching).
ip6_tables
ip6table_filter
ip6table_nat
ip6table_mangle
ip6table_raw
iptable_filter
iptable_nat
iptable_mangle
iptable_raw
nf_conntrack

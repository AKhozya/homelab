---
# k3s_image_gc — weekly `crictl rmi --prune` on all 3 nodes.

- name: Deploy k3s-image-gc units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - k3s-image-gc.service
    - k3s-image-gc.timer
  notify: Reload systemd
  tags: [k3s-image-gc]

- name: Enable k3s-image-gc.timer
  ansible.builtin.systemd_service:
    name: k3s-image-gc.timer
    enabled: true
    state: started
    daemon_reload: false
  tags: [k3s-image-gc]

---
# k3s_config — declarative /etc/rancher/k3s/config.yaml.
# Applies to: all hosts. Per-group/host shape via group_vars + host_vars.
#
# NO HANDLER by design. Mirrors kubelet.yaml pattern (hardening role):
# config drift = detected + logged + Telegram-alerted, human restarts K3s
# deliberately. Rationale: K3s restart = API gap (CP) or pod disruption (workers).
# Deliberate human gate avoids automatic production disturbance.

- name: Ensure /etc/rancher/k3s exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [k3s-config]

- name: Template /etc/rancher/k3s/config.yaml (drift-alert only; no auto-restart)
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    # 0644: K3s early-boot subprocess reads this before fully elevating; 0600 triggers
    # "permission denied" WARN and falls back to defaults. Historical live state was 0644.
    mode: "0644"
  tags: [k3s-config]

# ──────────────────────────────────────────────────────────────
# k3s-wait-ready — barrier service that gates downstream units (ufw-heal,
# anything else that needs k3s + kube-router iptables to be settled).
# ──────────────────────────────────────────────────────────────
- name: Deploy k3s-wait-ready.sh
  ansible.builtin.copy:
    src: k3s-wait-ready.sh
    dest: /usr/local/sbin/k3s-wait-ready.sh
    owner: root
    group: root
    mode: "0755"
  tags: [k3s-config, k3s-ready]

- name: Deploy k3s-wait-ready.service
  ansible.builtin.copy:
    src: k3s-wait-ready.service
    dest: /etc/systemd/system/k3s-wait-ready.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [k3s-config, k3s-ready]

- name: Enable k3s-wait-ready.service at boot
  ansible.builtin.systemd_service:
    name: k3s-wait-ready.service
    enabled: true
  tags: [k3s-config, k3s-ready]

# ──────────────────────────────────────────────────────────────
# Data-dir permissions audit. K3s defaults `<data-dir>` to 0700 (root). World-
# readable = secrets exposure (etcd snapshots, server tokens, kubelet kubeconfig
# all live under here). Stat only — no mutation, alert via failed task → Telegram.
# ──────────────────────────────────────────────────────────────
- name: Stat K3s data-dir
  ansible.builtin.stat:
    path: "{{ k3s_data_dir | default('/var/lib/rancher/k3s') }}"
  register: k3s_data_dir_stat
  tags: [k3s-config, perms-audit]

- name: Assert K3s data-dir is owned by root and not world-accessible
  ansible.builtin.assert:
    that:
      - k3s_data_dir_stat.stat.exists
      - k3s_data_dir_stat.stat.pw_name == 'root'
      - (k3s_data_dir_stat.stat.mode | int(base=8)) % 8 == 0
    fail_msg: >-
      K3s data-dir {{ k3s_data_dir | default('/var/lib/rancher/k3s') }}
      has unsafe perms (mode={{ k3s_data_dir_stat.stat.mode | default('?') }},
      owner={{ k3s_data_dir_stat.stat.pw_name | default('?') }}). Expected
      root-owned, no world access. Fix manually:
      sudo chown root:root <path> && sudo chmod 0700 <path>.
    success_msg: "K3s data-dir perms OK ({{ k3s_data_dir_stat.stat.mode }} root)"
  tags: [k3s-config, perms-audit]

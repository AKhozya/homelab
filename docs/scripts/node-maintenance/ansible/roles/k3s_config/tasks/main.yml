---
# k3s_config — declarative /etc/rancher/k3s/config.yaml.
# Applies to: all hosts. Per-group/host shape via group_vars + host_vars.
#
# NO HANDLER by design. Mirrors kubelet.yaml pattern (hardening role):
# config drift = detected + logged + Telegram-alerted, human restarts K3s
# deliberately. Rationale: K3s restart = API gap (CP) or pod disruption (workers).
# Deliberate human gate avoids automatic production disturbance.

- name: Ensure /etc/rancher/k3s exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [k3s-config]

- name: Template /etc/rancher/k3s/config.yaml (drift-alert only; no auto-restart)
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    # 0644: K3s early-boot subprocess reads this before fully elevating; 0600 triggers
    # "permission denied" WARN and falls back to defaults. Historical live state was 0644.
    mode: "0644"
  tags: [k3s-config]

# ──────────────────────────────────────────────────────────────
# k3s-wait-ready — barrier service that gates downstream units (ufw-heal,
# anything else that needs k3s + kube-router iptables to be settled).
# ──────────────────────────────────────────────────────────────
- name: Deploy k3s-wait-ready.sh
  ansible.builtin.copy:
    src: k3s-wait-ready.sh
    dest: /usr/local/sbin/k3s-wait-ready.sh
    owner: root
    group: root
    mode: "0755"
  tags: [k3s-config, k3s-ready]

- name: Deploy k3s-wait-ready.service
  ansible.builtin.copy:
    src: k3s-wait-ready.service
    dest: /etc/systemd/system/k3s-wait-ready.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [k3s-config, k3s-ready]

- name: Enable k3s-wait-ready.service at boot
  ansible.builtin.systemd_service:
    name: k3s-wait-ready.service
    enabled: true
  tags: [k3s-config, k3s-ready]

# ──────────────────────────────────────────────────────────────
# Sensitive-path permissions audit. K3s sets `<data-dir>` itself to 0755 by
# design (containerd/agent need traversal). Real secrets live in subdirs:
#   <data-dir>/server/cred/   (CP — node tokens, encryption keys)
#   <data-dir>/server/db/     (CP — etcd state)
#   <data-dir>/agent/         (workers — kubelet kubeconfig, tls)
# Audit those: must be root-owned + not world-accessible. Stat-only, alert via
# failed task → Telegram on drift.
# ──────────────────────────────────────────────────────────────
- name: Set K3s sensitive paths (CP — server/cred, server/db)
  ansible.builtin.set_fact:
    k3s_sensitive_paths:
      - "{{ k3s_data_dir | default('/var/lib/rancher/k3s') }}/server/cred"
      - "{{ k3s_data_dir | default('/var/lib/rancher/k3s') }}/server/db"
  when: "'control_plane' in group_names"
  tags: [k3s-config, perms-audit]

- name: Set K3s sensitive paths (workers — agent)
  ansible.builtin.set_fact:
    k3s_sensitive_paths:
      - "{{ k3s_data_dir | default('/var/lib/rancher/k3s') }}/agent"
  when: "'workers' in group_names"
  tags: [k3s-config, perms-audit]

- name: Stat K3s sensitive paths
  ansible.builtin.stat:
    path: "{{ item }}"
  register: k3s_sensitive_stat
  loop: "{{ k3s_sensitive_paths }}"
  tags: [k3s-config, perms-audit]

- name: Assert K3s sensitive paths root-owned and not world-accessible
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.pw_name == 'root'
      - (item.stat.mode | int(base=8)) % 8 == 0
    fail_msg: >-
      K3s sensitive path {{ item.item }} has unsafe perms
      (mode={{ item.stat.mode | default('?') }},
      owner={{ item.stat.pw_name | default('?') }}). Expected root-owned,
      no world access. Fix manually:
      sudo chmod o-rwx {{ item.item }}
    success_msg: "{{ item.item }} OK ({{ item.stat.mode }} root)"
  loop: "{{ k3s_sensitive_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: [k3s-config, perms-audit]

---
# k3s_config — declarative /etc/rancher/k3s/config.yaml.
# Applies to: all hosts. Per-group/host shape via group_vars + host_vars.
#
# NO HANDLER by design. Mirrors kubelet.yaml pattern (hardening role):
# config drift = detected + logged + Telegram-alerted, human restarts K3s
# deliberately. Rationale: K3s restart = API gap (CP) or pod disruption (workers).
# Deliberate human gate avoids automatic production disturbance.

- name: Ensure /etc/rancher/k3s exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [k3s-config]

- name: Template /etc/rancher/k3s/config.yaml (drift-alert only; no auto-restart)
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    # 0644: K3s early-boot subprocess reads this before fully elevating; 0600 triggers
    # "permission denied" WARN and falls back to defaults. Historical live state was 0644.
    mode: "0644"
  tags: [k3s-config]

# ──────────────────────────────────────────────────────────────
# k3s-wait-ready — barrier service that gates downstream units (ufw-heal,
# anything else that needs k3s + kube-router iptables to be settled).
# ──────────────────────────────────────────────────────────────
- name: Deploy k3s-wait-ready.sh
  ansible.builtin.copy:
    src: k3s-wait-ready.sh
    dest: /usr/local/sbin/k3s-wait-ready.sh
    owner: root
    group: root
    mode: "0755"
  tags: [k3s-config, k3s-ready]

- name: Deploy k3s-wait-ready.service
  ansible.builtin.copy:
    src: k3s-wait-ready.service
    dest: /etc/systemd/system/k3s-wait-ready.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [k3s-config, k3s-ready]

- name: Enable k3s-wait-ready.service at boot
  ansible.builtin.systemd_service:
    name: k3s-wait-ready.service
    enabled: true
  tags: [k3s-config, k3s-ready]

# ──────────────────────────────────────────────────────────────
# clusterip-probe.sh — single source of the ClusterIP-DNAT verdict. The phase2
# worker gate (PLAY 1) runs this on a freshly-rebooted worker before uncordon to
# prove kube-proxy actually programmed KUBE-SERVICES DNAT for 10.43.0.1 (kubelet
# Ready does NOT prove that — 2026-05-24 wedge). The cluster-reboot skill's
# verify-clusterip.sh runs the same check over SSH. All nodes (CP harmless).
# ──────────────────────────────────────────────────────────────
- name: Ensure /etc/node-maintenance/bin exists
  ansible.builtin.file:
    path: /etc/node-maintenance/bin
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [k3s-config, clusterip-probe]

- name: Deploy clusterip-probe.sh (phase2 ClusterIP gate invokes this)
  ansible.builtin.copy:
    src: clusterip-probe.sh
    dest: /etc/node-maintenance/bin/clusterip-probe.sh
    owner: root
    group: root
    mode: "0755"
  tags: [k3s-config, clusterip-probe]

# Note: NO directory-level perms audit on <data-dir>/server, /agent, etc.
# K3s sets those to 0755 by design (containerd/kubelet/agent need traversal).
# Real secrets are individual files (server/cred/*, agent/*.{crt,key},
# server/db/state.db) with K3s-managed 0600/0700 modes. Per-file audit is
# possible but high-noise / low-value — K3s manages this layer itself.

# Runtime verification: secrets-encryption is actually active on the API server.
# config.yaml says `secrets-encryption: true` but K3s could have failed to
# enable it silently (wrong perms, missing plugin dir). Read-only check via
# `k3s secrets-encrypt status`. CP only — workers have no k3s-server.
- name: Verify K3s secrets-encryption active (CP)
  ansible.builtin.shell: |
    set -o pipefail
    /usr/local/bin/k3s secrets-encrypt status | grep -q '^Encryption Status: Enabled$'
  args:
    executable: /bin/bash
  register: k3s_secrets_enc_check
  changed_when: false
  failed_when: k3s_secrets_enc_check.rc != 0
  when:
    - "'control_plane' in group_names"
    - k3s_secrets_encryption | default(false)
  tags: [k3s-config, secrets-encryption]

# CoreDNS HA is NO LONGER patched into the k3s addon manifest here. As of the
# 2026-05-31 convergence (--disable=coredns in control_plane.yml), k3s deletes the
# addon manifest /var/lib/rancher/k3s/server/manifests/coredns.yaml, so the old
# `ansible.builtin.replace` insert-replicas task failed every drift-heal run
# (exit=2 INVALIDARGUMENT on the missing file). HA is now the Flux-managed
# `coredns-ha` DaemonSet (infrastructure/coredns/, one pod per node). The
# deadlock itself is written up in ansible/group_vars/control_plane.yml.

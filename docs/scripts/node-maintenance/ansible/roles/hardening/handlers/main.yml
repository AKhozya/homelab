---
- name: Apply sysctls
  ansible.builtin.command: /usr/bin/sysctl --system
  changed_when: false

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
  register: resolved_restart
  until: resolved_restart is not failed
  retries: 2
  delay: 5

- name: Reload udev rules
  ansible.builtin.shell: |
    udevadm control --reload-rules
    udevadm trigger --subsystem-match=pci --attr-match=class=0x010802 || true
  changed_when: false

- name: Apply tmpfiles
  ansible.builtin.command: /usr/bin/systemd-tmpfiles --create
  changed_when: false

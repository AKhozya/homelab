---
# hardening — SSH, sysctls, kubelet, systemd drop-ins, resolved, udev, tmpfiles, fail2ban.
# Applies to all hosts.
#
# Safety:
# - SSH drop-in: `sshd -t` validate after copy, reload (not restart) preserves sessions.
# - sysctls: `sysctl --system` handler, non-disruptive.
# - kubelet.yaml + k3s service.d drop-ins: no restart handler — apply on next k3s restart.
# - udev: reload + trigger handler, safe for existing devices.
# - fail2ban: jail.local drift-healed; LAN whitelisted in DEFAULT (no lockout risk).

# ---------- SSH ----------
- name: Deploy sshd hardening drop-in
  ansible.builtin.copy:
    src: sshd-99-hardening.conf
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  register: sshd_dropin
  tags: [hardening, ssh]

- name: Validate sshd config (after drop-in change)  # noqa: no-handler
  # In-task guard (not handler): validate must fire IMMEDIATELY after copy so a
  # bad config blocks subsequent reload. Handler fires end-of-play — too late.
  ansible.builtin.command: /usr/sbin/sshd -t
  when: sshd_dropin.changed
  changed_when: false
  tags: [hardening, ssh]

- name: Reload sshd  # noqa: no-handler
  # Paired with validate above — reload ONLY if validate passed (same play).
  ansible.builtin.systemd_service:
    name: sshd
    state: reloaded
  when: sshd_dropin.changed
  tags: [hardening, ssh]

# ---------- sysctls ----------
- name: Deploy sysctl drop-ins
  ansible.builtin.copy:
    src: "sysctl-{{ item }}"
    dest: "/etc/sysctl.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - 99-unified-hardening.conf
    - 99-k8s-performance.conf
    - 99-watchdog.conf
  notify: Apply sysctls
  tags: [hardening, sysctl]

- name: Remove legacy sysctl files (superseded by unified-hardening)
  ansible.builtin.file:
    path: "/etc/sysctl.d/{{ item }}"
    state: absent
  loop:
    - 51-kptr-restrict.conf
    - 99-security-hardening.conf
  notify: Apply sysctls
  tags: [hardening, sysctl]

# ---------- systemd manager + k3s drop-ins ----------
- name: Ensure /etc/systemd/system.conf.d exists
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [hardening, systemd]

- name: Deploy systemd hardware watchdog drop-in
  ansible.builtin.copy:
    src: systemd-watchdog.conf
    dest: /etc/systemd/system.conf.d/watchdog.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [hardening, systemd]

- name: Ensure systemd default timeouts (main system.conf)
  ansible.builtin.lineinfile:
    path: /etc/systemd/system.conf
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    state: present
  loop:
    - { key: DefaultTimeoutStartSec, value: 120s }
    - { key: DefaultTimeoutStopSec, value: 120s }
  notify: Reload systemd
  tags: [hardening, systemd]

- name: Ensure k3s service.d drop-in directory exists
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ k3s_service }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [hardening, k3s-service]

- name: Deploy k3s service drop-ins
  ansible.builtin.copy:
    src: "k3s-{{ item }}"
    dest: "/etc/systemd/system/{{ k3s_service }}.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - shutdown-timeout.conf
    - conntrack-fix.conf
    - network-hardening.conf
  notify: Reload systemd
  tags: [hardening, k3s-service]

# ---------- resolved (LLMNR disable) ----------
- name: Ensure /etc/systemd/resolved.conf.d exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [hardening, resolved]

- name: Deploy resolved LLMNR disable drop-in
  ansible.builtin.copy:
    src: resolved-no-llmnr.conf
    dest: /etc/systemd/resolved.conf.d/no-llmnr.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-resolved
  tags: [hardening, resolved]

# ---------- DNS decoupling: cluster-independent upstream ----------
# Break the node→blocky→kube-proxy circular dependency. Nodes + CoreDNS
# (forward . /etc/resolv.conf, dnsPolicy: Default) must resolve external DNS
# without a cluster pod. See docs/plans/2026-06-04-dns-decoupling-*.md.
- name: Deploy resolved upstream-DNS drop-in (cluster-independent public DNS)
  ansible.builtin.copy:
    src: resolved-upstream-dns.conf
    dest: /etc/systemd/resolved.conf.d/upstream-dns.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-resolved
  tags: [hardening, resolved, networkd-dns]

- name: Ensure primary-NIC networkd drop-in dir exists
  ansible.builtin.file:
    path: "/etc/systemd/network/{{ primary_network_file }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [hardening, networkd-dns]

- name: Deploy networkd no-DHCP-DNS drop-in (drop blocky DNS from link)
  ansible.builtin.copy:
    src: networkd-no-dhcp-dns.conf
    dest: "/etc/systemd/network/{{ primary_network_file }}.d/10-no-dhcp-dns.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload networkd
  tags: [hardening, networkd-dns]

# ---------- kubelet ----------
- name: Deploy kubelet config (applies on next k3s restart)
  ansible.builtin.copy:
    src: k3s-kubelet.yaml
    dest: /etc/rancher/k3s/kubelet.yaml
    owner: root
    group: root
    mode: "0644"
  tags: [hardening, kubelet]

# ---------- modprobe / udev / tmpfiles (power) ----------
- name: Deploy NVMe APST disable modprobe conf
  ansible.builtin.copy:
    src: modprobe-nvme-no-apst.conf
    dest: /etc/modprobe.d/nvme-no-apst.conf
    owner: root
    group: root
    mode: "0644"
  tags: [hardening, power]

- name: Deploy udev rules (PCI runtime PM + SATA ALPM)
  ansible.builtin.copy:
    src: "udev-{{ item }}"
    dest: "/etc/udev/rules.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - 60-pci-no-runtime-pm.rules
    - 60-sata-no-alpm.rules
  notify: Reload udev rules
  tags: [hardening, power]

- name: Remove legacy 60-nvme-no-pm.rules (superseded by 60-pci-no-runtime-pm.rules)
  ansible.builtin.file:
    path: /etc/udev/rules.d/60-nvme-no-pm.rules
    state: absent
  notify: Reload udev rules
  tags: [hardening, power]

- name: Deploy tmpfiles.d entries (CPU power + NVMe no-PM)
  ansible.builtin.copy:
    src: "tmpfiles-{{ item }}"
    dest: "/etc/tmpfiles.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - cpu-power-settings.conf
    - nvme-no-pm.conf
  notify: Apply tmpfiles
  tags: [hardening, power]

- name: Remove legacy cpu-governor tmpfile (superseded by cpu-power-settings)
  ansible.builtin.file:
    path: /etc/tmpfiles.d/cpu-governor.conf
    state: absent
  notify: Apply tmpfiles
  tags: [hardening, power]

# ---------- fail2ban ----------
# fail2ban package is in `pacman_packages_base` (group_vars/all.yml). Already
# installed + active on all 3 nodes (live audit 2026-04-28). Standardize on
# systemd backend (reads journald — Arch has no /var/log/auth.log w/o rsyslog).
# W2 had stray `logpath = /var/log/auth.log` — drift-heal removes it.
- name: Deploy fail2ban jail.local
  ansible.builtin.copy:
    src: fail2ban-jail.local
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban
  tags: [hardening, fail2ban]

- name: Ensure fail2ban service enabled + active
  ansible.builtin.systemd_service:
    name: fail2ban.service
    enabled: true
    state: started
  tags: [hardening, fail2ban]

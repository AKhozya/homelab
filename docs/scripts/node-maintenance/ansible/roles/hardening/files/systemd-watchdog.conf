# Hardware watchdog — systemd pings /dev/watchdog0 (SP5100 TCO).
# RuntimeWatchdogSec: PID 1 freeze (kernel hang/deadlock) at runtime → hardware forces reboot.
# RebootWatchdogSec: arms the watchdog for the systemd-shutdown phase. A hung REBOOT — final
#   unmount of /, /var, the multi-device LVM, then reboot() stuck in an uninterruptible device/dm
#   quiesce (kernel stays ALIVE, so the softlockup/hardlockup panic sysctls do NOT catch it) —
#   self-resets instead of needing a human + power button. 2026-06-20: worker-node wedged exactly
#   here mid maintenance-reboot; the old 10min default meant the operator power-cycled before it
#   fired. 2min keeps ~20-40x margin over the normal seconds-long final phase. A watchdog reboot
#   leaves no graceful-shutdown trace in journalctl (journald already stopped).
[Manager]
RuntimeWatchdogSec=30
RebootWatchdogSec=2min

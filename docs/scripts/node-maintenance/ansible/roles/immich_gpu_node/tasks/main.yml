---
# immich_gpu_node — Immich GPU node (Arch VM) i915 render config + guest-local heal watchdog.
# Applied to the `virtual` inventory group only (node-config.yml Play "immich-gpu-node"): the passed-
# through Meteor Lake iGPU exists only on this VM; running this on a physical node is meaningless.
#
# i915 is render-only (disable_display=1) + boot-blacklisted (loads post-boot via load-i915.service);
# see files/i915-render.conf + files/load-i915.service. The heal watchdog mirrors clusterip_heal
# (bounded restart + node-exporter textfile metrics) but heals ONLY the render node — k3s-agent is
# clusterip_heal's job, the reset-bug wedge is the Tier-2 host watchdog's. See files/immich-gpu-heal.sh.

# ---- i915 render-only driver config ----

- name: Deploy i915 render-only modprobe conf
  ansible.builtin.copy:
    src: i915-render.conf
    dest: /etc/modprobe.d/i915-render.conf
    owner: root
    group: root
    mode: "0644"
  tags: [immich-gpu-node, i915]

- name: Ensure i915 boot-blacklist token on kernel cmdline (UKI)
  ansible.builtin.shell: |
    set -euo pipefail
    f=/etc/kernel/cmdline
    if grep -qw 'modprobe.blacklist=i915' "$f"; then
      exit 0
    fi
    line="$(head -n1 "$f" | sed 's/[[:space:]]*$//')"
    printf '%s modprobe.blacklist=i915\n' "$line" >"$f"
    echo CHANGED
  args:
    executable: /bin/bash
  register: immich_gpu_cmdline
  changed_when: "'CHANGED' in immich_gpu_cmdline.stdout"
  when: immich_gpu_boot_blacklist | bool
  notify: Rebuild UKI for i915 cmdline change
  tags: [immich-gpu-node, i915, i915-cmdline]

- name: Deploy load-i915.service (post-boot render load)
  ansible.builtin.copy:
    src: load-i915.service
    dest: /etc/systemd/system/load-i915.service
    owner: root
    group: root
    mode: "0644"
  tags: [immich-gpu-node, i915]

# Enabled (fires After=multi-user.target on every boot), not started here: a mid-run start would load
# i915 out of band. It runs at the next boot — which for this node is a host cold-restart (reset-bug).
- name: Enable load-i915.service
  ansible.builtin.systemd_service:
    name: load-i915.service
    enabled: true
    daemon_reload: true
  tags: [immich-gpu-node, i915]

# ---- Reset-bug safety: never auto-reboot in-guest (C3) ----
# On this GPU-passthrough VM an in-guest reboot wedges the passed-through iGPU → NAS host crash. Two
# in-guest auto-reboot vectors are inherited from the `hardening` role (hosts: all) and MUST be
# neutralized here (hardening runs before this play, so its files are on disk to override):
#   #5 kernel.panic=10 + softlockup/hardlockup_panic=1 → 0 (sysctl drop-in, applied by `sysctl --system`)
#   #6 systemd RuntimeWatchdogSec=30 pinging the q35 iTCO /dev/watchdog0 → 0 (system.conf.d drop-in,
#      applied by `systemctl daemon-reexec` — Manager config is only re-read on re-exec, not reload).
# #6 is NOT covered by #5: a hardware-watchdog reset fires while the kernel is still ALIVE (no panic).

- name: Disable auto-reboot-on-panic (reset-bug safety — overrides hardening 99-watchdog.conf sysctls)
  ansible.builtin.copy:
    src: 99-zz-immich-vm-nopanic.conf
    dest: /etc/sysctl.d/99-zz-immich-vm-nopanic.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply nopanic sysctl
  tags: [immich-gpu-node, reset-bug, sysctl]

- name: Disarm systemd hardware watchdog (reset-bug safety — q35 iTCO /dev/watchdog0 is NOT inert)
  ansible.builtin.copy:
    src: zz-immich-vm-nowatchdog.conf
    dest: /etc/systemd/system.conf.d/zz-immich-vm-nowatchdog.conf
    owner: root
    group: root
    mode: "0644"
  notify: Disarm systemd watchdog
  tags: [immich-gpu-node, reset-bug, watchdog]

# ---- Guest packages for on-node QSV health probing (vainfo) ----

- name: Ensure iHD VAAPI driver + vainfo present (watchdog QSV probe)
  ansible.builtin.package:
    name: "{{ immich_gpu_packages }}"
    state: present
  tags: [immich-gpu-node, packages]

# ---- virtiofs library mount (Immich library share from the NAS host) ----
# The library lives on the NAS host and is exposed to this guest as a virtiofs share (tag
# immich-library, defined in the domain XML). Mount it at a stable path so the k3s Immich pod (step 4)
# bind-mounts a real directory, not an empty one. The unit filename MUST be the systemd escape of the
# mount path (var-lib-immich\x2dlibrary.mount) — immich-gpu-heal.sh restarts it by that exact name
# (library_unit → systemd-escape -p --suffix=mount /var/lib/immich-library).

- name: Ensure Immich library mountpoint
  ansible.builtin.file:
    path: /var/lib/immich-library
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [immich-gpu-node, virtiofs]

- name: Deploy immich-library virtiofs mount unit
  ansible.builtin.copy:
    src: immich-library.mount
    dest: '/etc/systemd/system/var-lib-immich\x2dlibrary.mount'
    owner: root
    group: root
    mode: "0644"
  tags: [immich-gpu-node, virtiofs]

# enabled=at boot (WantedBy, non-fatal), started=mount now on this heal run. A mount failure here alerts
# (drift) — correct: an unmountable library means Immich is broken, worth a page. The heal watchdog
# covers transient drops between runs.
- name: Enable + start immich-library virtiofs mount
  ansible.builtin.systemd_service:
    name: 'var-lib-immich\x2dlibrary.mount'
    enabled: true
    state: started
    daemon_reload: true
  tags: [immich-gpu-node, virtiofs]

# ---- Heal watchdog (mirrors clusterip_heal) ----

# /var/lib/node-maintenance is node-maintenance's HOME (owned by base_config, 0751). Do NOT re-assert
# ownership here — the heal state file is written as root inside it, which works with o+x on the parent.

- name: Ensure node-exporter textfile dir (heal metrics)
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [immich-gpu-node, heal]

- name: Deploy immich-gpu-heal.sh
  ansible.builtin.copy:
    src: immich-gpu-heal.sh
    dest: /usr/local/sbin/immich-gpu-heal.sh
    owner: root
    group: root
    mode: "0755"
  tags: [immich-gpu-node, heal]

- name: Deploy immich-gpu-heal-watchdog.service
  ansible.builtin.copy:
    src: immich-gpu-heal-watchdog.service
    dest: /etc/systemd/system/immich-gpu-heal-watchdog.service
    owner: root
    group: root
    mode: "0644"
  tags: [immich-gpu-node, heal]

- name: Deploy immich-gpu-heal-watchdog.timer
  ansible.builtin.copy:
    src: immich-gpu-heal-watchdog.timer
    dest: /etc/systemd/system/immich-gpu-heal-watchdog.timer
    owner: root
    group: root
    mode: "0644"
  tags: [immich-gpu-node, heal]

- name: Enable + start immich-gpu-heal-watchdog.timer
  ansible.builtin.systemd_service:
    name: immich-gpu-heal-watchdog.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: [immich-gpu-node, heal]

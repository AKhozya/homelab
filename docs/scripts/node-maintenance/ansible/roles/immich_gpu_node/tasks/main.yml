---
# immich_gpu_node — Immich GPU node (Arch VM) i915 render config + guest-local heal watchdog.
# Applied to the `virtual` inventory group only (node-config.yml Play "immich-gpu-node"): the passed-
# through Meteor Lake iGPU exists only on this VM; running this on a physical node is meaningless.
#
# i915 is render-only (disable_display=1) + boot-blacklisted (loads post-boot via load-i915.service);
# see files/i915-render.conf + files/load-i915.service. The heal watchdog mirrors clusterip_heal
# (bounded restart + node-exporter textfile metrics) but heals ONLY the render node — k3s-agent is
# clusterip_heal's job, the reset-bug wedge is the Tier-2 host watchdog's. See files/immich-gpu-heal.sh.

# ---- i915 render-only driver config ----

- name: Deploy i915 render-only modprobe conf
  ansible.builtin.copy:
    src: i915-render.conf
    dest: /etc/modprobe.d/i915-render.conf
    owner: root
    group: root
    mode: "0644"
  tags: [immich-gpu-node, i915]

# Idempotent token-set management of the guest UKI cmdline. Three concerns, all order-independent:
#   - modprobe.blacklist  — a single comma-list token; MERGE i915 + xe into it (i915 keeps the IGD out
#                           of the boot path → loads render-only post-boot; xe is a second driver that
#                           probes the iGPU at boot and binds nothing → hygiene, keep it out too).
#   - drm_kms_helper.fbdev_emulation=0 + fbcon=off — the Track-0 wedge fix: remove the kernel fbdev
#                           consumer whose damage-work D-locks on the stalled host virtio-gpu virtqueue
#                           (holds drm_modeset_lock → every GPU open D-states → box wedges). Proven live.
# Standalone tokens are appended only if the exact token is absent; the blacklist merges missing drivers
# into the existing token (never a duplicate token). Run-twice → zero changes (asserted in role tests).
- name: Ensure GPU/display kernel cmdline tokens on the UKI (fbdev-off + i915,xe blacklist)
  ansible.builtin.shell: |
    set -euo pipefail
    f=/etc/kernel/cmdline
    read -r -a toks < <(head -n1 "$f") || true   # split the single cmdline line into tokens

    blacklist_want='i915 xe'      # drivers that must be present in the one modprobe.blacklist token
    have_fbdev=0 have_fbcon=0 bl_idx=-1
    for i in "${!toks[@]}"; do
      case "${toks[$i]}" in
        drm_kms_helper.fbdev_emulation=0) have_fbdev=1 ;;
        fbcon=off) have_fbcon=1 ;;
        modprobe.blacklist=*) bl_idx=$i ;;
      esac
    done

    changed=0
    if [ "$bl_idx" -ge 0 ]; then
      new="${toks[$bl_idx]#modprobe.blacklist=}"
      for d in $blacklist_want; do
        case ",$new," in
          *",$d,"*) : ;;
          *) new="${new:+$new,}$d"; changed=1 ;;
        esac
      done
      toks[$bl_idx]="modprobe.blacklist=$new"
    else
      toks+=("modprobe.blacklist=$(printf '%s' "$blacklist_want" | tr ' ' ',')"); changed=1
    fi
    [ "$have_fbdev" -eq 1 ] || { toks+=("drm_kms_helper.fbdev_emulation=0"); changed=1; }
    [ "$have_fbcon" -eq 1 ] || { toks+=("fbcon=off"); changed=1; }

    if [ "$changed" -eq 1 ]; then
      printf '%s\n' "${toks[*]}" >"$f"
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  register: immich_gpu_cmdline
  changed_when: "'CHANGED' in immich_gpu_cmdline.stdout"
  when: immich_gpu_boot_blacklist | bool
  notify: Rebuild UKI for i915 cmdline change
  tags: [immich-gpu-node, i915, i915-cmdline]

- name: Deploy load-i915.service (post-boot render load)
  ansible.builtin.copy:
    src: load-i915.service
    dest: /etc/systemd/system/load-i915.service
    owner: root
    group: root
    mode: "0644"
  tags: [immich-gpu-node, i915]

# Enabled (fires After=multi-user.target on every boot), not started here: a mid-run start would load
# i915 out of band. It runs at the next boot — which for this node is a host cold-restart (reset-bug).
- name: Enable load-i915.service
  ansible.builtin.systemd_service:
    name: load-i915.service
    enabled: true
    daemon_reload: true
  tags: [immich-gpu-node, i915]

# ---- Reset-bug safety: never auto-reboot in-guest (C3) ----
# On this GPU-passthrough VM an in-guest reboot wedges the passed-through iGPU → NAS host crash. Two
# in-guest auto-reboot vectors are inherited from the `hardening` role (hosts: all) and MUST be
# neutralized here (hardening runs before this play, so its files are on disk to override):
#   #5 kernel.panic=10 + softlockup/hardlockup_panic=1 → 0 (sysctl drop-in, applied by `sysctl --system`)
#   #6 systemd RuntimeWatchdogSec=30 pinging the q35 iTCO /dev/watchdog0 → 0 (system.conf.d drop-in,
#      applied by `systemctl daemon-reexec` — Manager config is only re-read on re-exec, not reload).
# #6 is NOT covered by #5: a hardware-watchdog reset fires while the kernel is still ALIVE (no panic).

- name: Disable auto-reboot-on-panic (reset-bug safety — overrides hardening 99-watchdog.conf sysctls)
  ansible.builtin.copy:
    src: 99-zz-immich-vm-nopanic.conf
    dest: /etc/sysctl.d/99-zz-immich-vm-nopanic.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply nopanic sysctl
  tags: [immich-gpu-node, reset-bug, sysctl]

- name: Disarm systemd hardware watchdog (reset-bug safety — q35 iTCO /dev/watchdog0 is NOT inert)
  ansible.builtin.copy:
    src: zz-immich-vm-nowatchdog.conf
    dest: /etc/systemd/system.conf.d/zz-immich-vm-nowatchdog.conf
    owner: root
    group: root
    mode: "0644"
  notify: Disarm systemd watchdog
  tags: [immich-gpu-node, reset-bug, watchdog]

# ---- Admin-sudo parity (remove the VM-build NOPASSWD override) ----
# The VM image shipped /etc/sudoers.d/akhozya-nopasswd (`akhozya ALL=(ALL) NOPASSWD:ALL`). sudoers is
# last-match-wins in lexical file order, so that file SHADOWS base_config's `00_akhozya`
# (`akhozya ALL=(ALL) ALL`, password-required) → akhozya is effectively NOPASSWD on this node, unlike
# the physical nodes where the admin user is password-required. base_config deploys the password rule
# but never REMOVES this build artifact, so the gap is silent. Remove it here (drift-enforced) → the
# already-present 00_akhozya governs → admin-sudo parity with the fleet. Safe: akhozya has a login
# password (node-maintenance keeps NOPASSWD for automation; virsh console is the ultimate break-glass).
- name: Remove VM-build akhozya NOPASSWD sudoers override (admin-sudo parity — 00_akhozya governs)
  ansible.builtin.file:
    path: /etc/sudoers.d/akhozya-nopasswd
    state: absent
  tags: [immich-gpu-node, sudoers, hardening]

# ---- Admin user (akhozya) SSH authorized_keys ----
# Seed the operator + automation pubkeys on the guest, EXCLUSIVE (drift-heal reconciles adds/removes +
# de-dups). /home is persistent ext4 LVM (no cloud-init) so keys survive reboots once written — closes
# the build-onboarding gap where the operator re-added the key every boot. Mirrors base_config's
# node-maintenance authorized_keys pattern. StrictModes needs 0700 dir / 0600 file, asserted here; the
# recurring NAS-side ~/.ssh 0771 reset is appliance-side (out of IaC) → operator `chmod 700 ~/.ssh`.
- name: Ensure admin_user ~/.ssh dir (StrictModes 0700)
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.ssh"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"
  tags: [immich-gpu-node, user, authorized-keys]

- name: Deploy admin_user authorized_keys (operator + automation pubkeys, exclusive)
  ansible.builtin.copy:
    dest: "/home/{{ admin_user }}/.ssh/authorized_keys"
    content: "{{ immich_gpu_authorized_keys | join('\n') }}\n"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
  when: immich_gpu_authorized_keys | length > 0
  tags: [immich-gpu-node, user, authorized-keys]

# ---- yay AUR helper bootstrap (parity with physical nodes) ----
# Physical nodes seed yay once at build via setup-node.sh; this VM's GPU-onboarding path skipped it,
# so phase2's `yay_cmd` (sudo -u node-maintenance yay -Syyu) silently no-op'd (`yay: command not
# found`, swallowed by the old rescue) → the VM went unpatched, undetected until 2026-07-11. Bootstrap
# it here, drift-enforced + idempotent (only when absent — thereafter the weekly yay_cmd self-updates
# yay). AUR-in-drift-heal is otherwise out of scope, but yay is the updater itself, a bootstrap gap not
# a package-set choice. Build/install SPLIT: makepkg refuses root, and akhozya has NO NOPASSWD on this
# node (the admin-parity task above removes it), so `makepkg -si` — which self-calls `sudo pacman` —
# would hang. Build as akhozya (deps pre-installed as root so no `-s` sudo), then `pacman -U` as root.
# stat, not `command -v yay`: ansible.builtin.command runs no shell and `command` is a shell builtin,
# so it would never resolve → the guard would report "missing" forever → bootstrap every drift-heal.
- name: Check yay present (AUR helper — the fleet weekly updater)
  ansible.builtin.stat:
    path: /usr/bin/yay
  register: immich_gpu_yay_check
  tags: [immich-gpu-node, yay, packages]

- name: Bootstrap yay-bin from AUR (idempotent — only when missing)
  when: not immich_gpu_yay_check.stat.exists
  tags: [immich-gpu-node, yay, packages]
  block:
    - name: Ensure makepkg build deps present (so the akhozya build needs no `-s` sudo)
      ansible.builtin.package:
        name:
          - base-devel
          - git
        state: present

    - name: Build yay-bin as the admin user (makepkg only — no install; akhozya has no NOPASSWD)
      become: true
      become_user: "{{ admin_user }}"
      ansible.builtin.shell: |
        set -euo pipefail
        build=/tmp/yay-bootstrap
        rm -rf "$build"
        mkdir -p "$build/src" "$build/pkg" "$build/bld"
        git clone --depth 1 https://aur.archlinux.org/yay-bin.git "$build/src/yay-bin"
        cd "$build/src/yay-bin"
        PKGDEST="$build/pkg" BUILDDIR="$build/bld" makepkg --noconfirm
        ls -1 "$build/pkg"/yay-bin-*.pkg.tar.zst | head -n1
      register: immich_gpu_yay_build
      changed_when: true

    - name: Install the built yay package as root (pacman -U — akhozya sudo not needed)
      ansible.builtin.command: "pacman -U --noconfirm {{ immich_gpu_yay_build.stdout_lines[-1] }}"
      changed_when: true

    - name: Remove the yay bootstrap build dir
      ansible.builtin.file:
        path: /tmp/yay-bootstrap
        state: absent

# ---- Guest packages for on-node QSV health probing (vainfo) ----

- name: Ensure iHD VAAPI driver + vainfo + qemu-guest-agent present (watchdog QSV probe + agent shutdown)
  ansible.builtin.package:
    name: "{{ immich_gpu_packages }}"
    state: present
  tags: [immich-gpu-node, packages]

# qemu-guest-agent talks to the host over the org.qemu.guest_agent.0 virtio channel (already in the
# domain XML) → the NAS-side watchdog gets a reliable `virsh shutdown --mode agent` (clean even when
# ACPI is ignored) + domtime/domfsinfo guest-health without SSH. Enabled + started (a plain systemd
# service — no GPU/reboot interaction, safe to start mid-run, unlike load-i915.service).
- name: Enable + start qemu-guest-agent
  ansible.builtin.systemd_service:
    name: qemu-guest-agent.service
    enabled: true
    state: started
    daemon_reload: true
  tags: [immich-gpu-node, packages, guest-agent]

# ---- virtiofs library mount (Immich library share from the NAS host) ----
# The library lives on the NAS host and is exposed to this guest as a virtiofs share (tag
# immich-library, defined in the domain XML). Mount it at a stable path so the k3s Immich pod (step 4)
# bind-mounts a real directory, not an empty one. The unit filename MUST be the systemd escape of the
# mount path (var-lib-immich\x2dlibrary.mount) — immich-gpu-heal.sh restarts it by that exact name
# (library_unit → systemd-escape -p --suffix=mount /var/lib/immich-library).

- name: Ensure Immich library mountpoint
  ansible.builtin.file:
    path: /var/lib/immich-library
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [immich-gpu-node, virtiofs]

- name: Deploy immich-library virtiofs mount unit
  ansible.builtin.copy:
    src: immich-library.mount
    dest: '/etc/systemd/system/var-lib-immich\x2dlibrary.mount'
    owner: root
    group: root
    mode: "0644"
  tags: [immich-gpu-node, virtiofs]

# enabled=at boot (WantedBy, non-fatal), started=mount now on this heal run. A mount failure here alerts
# (drift) — correct: an unmountable library means Immich is broken, worth a page. The heal watchdog
# covers transient drops between runs.
- name: Enable + start immich-library virtiofs mount
  ansible.builtin.systemd_service:
    name: 'var-lib-immich\x2dlibrary.mount'
    enabled: true
    state: started
    daemon_reload: true
  tags: [immich-gpu-node, virtiofs]

# ---- Heal watchdog (mirrors clusterip_heal) ----

# /var/lib/node-maintenance is node-maintenance's HOME (owned by base_config, 0751). Do NOT re-assert
# ownership here — the heal state file is written as root inside it, which works with o+x on the parent.

- name: Ensure node-exporter textfile dir (heal metrics)
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [immich-gpu-node, heal]

- name: Deploy immich-gpu-heal.sh
  ansible.builtin.copy:
    src: immich-gpu-heal.sh
    dest: /usr/local/sbin/immich-gpu-heal.sh
    owner: root
    group: root
    mode: "0755"
  tags: [immich-gpu-node, heal]

- name: Deploy immich-gpu-heal-watchdog.service
  ansible.builtin.copy:
    src: immich-gpu-heal-watchdog.service
    dest: /etc/systemd/system/immich-gpu-heal-watchdog.service
    owner: root
    group: root
    mode: "0644"
  tags: [immich-gpu-node, heal]

- name: Deploy immich-gpu-heal-watchdog.timer
  ansible.builtin.copy:
    src: immich-gpu-heal-watchdog.timer
    dest: /etc/systemd/system/immich-gpu-heal-watchdog.timer
    owner: root
    group: root
    mode: "0644"
  tags: [immich-gpu-node, heal]

- name: Enable + start immich-gpu-heal-watchdog.timer
  ansible.builtin.systemd_service:
    name: immich-gpu-heal-watchdog.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: [immich-gpu-node, heal]

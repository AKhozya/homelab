# Passthrough-VM safety (reset-bug C3). The q35 machine type emulates an ICH9 LPC bridge whose iTCO
# watchdog appears in-guest as /dev/watchdog0 (iTCO_wdt) — so the hardening role's watchdog.conf
# (RuntimeWatchdogSec=30 + RebootWatchdogSec=2min) is NOT inert here, contrary to the step-4 audit's
# original assumption. If systemd armed it, a PID-1/systemd freeze would fire the hardware watchdog →
# in-guest reset → wedged iGPU → NAS host crash. The panic sysctls (99-zz-immich-vm-nopanic.conf)
# do NOT cover this: a watchdog reset triggers while the kernel is still ALIVE (no panic).
#
# This drop-in sorts lexically AFTER hardening's watchdog.conf in /etc/systemd/system.conf.d
# (zz-* > watchdog.conf), so systemd merges these last → the watchdog is never armed on this VM.
# A guest lockup instead hangs → goes unreachable → is alerted → NAS-side virsh reset (operator/Tier-2).
[Manager]
RuntimeWatchdogSec=0
RebootWatchdogSec=0

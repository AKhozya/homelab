---
# Rebuild the systemd-boot UKI after a kernel cmdline change. mkinitcpio bakes /etc/kernel/cmdline
# into /boot/EFI/Linux/<preset>.efi; the change only takes effect after this rebuild + a reboot.
# Reboot is intentionally NOT automated here — on the GPU node a reboot must be a HOST cold-restart
# (reset-bug), driven by the Tier-2 watchdog / operator, never an in-guest `systemctl reboot`.
- name: Rebuild UKI for i915 cmdline change
  ansible.builtin.command: "mkinitcpio -p {{ immich_gpu_kernel_preset }}"
  changed_when: true

# Applies the reset-bug panic override (99-zz-immich-vm-nopanic.conf). Load ONLY that file — NOT
# `sysctl --system`, which re-applies every /etc/sysctl.d file and exits rc=1 on this VM's unsettable
# `kernel.nmi_watchdog` ("Operation not permitted"), failing the whole drift-heal when a mere comment
# change triggered this handler (2026-07-12). This file's 3 keys (panic/softlockup_panic/
# hardlockup_panic) are all settable, and applying it in isolation IS the override — boot-time ordering
# is handled by systemd-sysctl reading 99-zz last, independent of this runtime apply.
- name: Apply nopanic sysctl
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-zz-immich-vm-nopanic.conf
  changed_when: false

# Applies the reset-bug watchdog override (zz-immich-vm-nowatchdog.conf). systemd Manager config
# (RuntimeWatchdogSec/RebootWatchdogSec) is ONLY re-read on daemon-reexec, never daemon-reload — so a
# reexec is required to guarantee the watchdog stays disarmed. Safe: PID-1 re-exec preserves state and
# does not disrupt k3s-agent/containerd (they are not children of the re-exec).
- name: Disarm systemd watchdog
  ansible.builtin.command: systemctl daemon-reexec
  changed_when: false

---
# security_scan — monthly lynis + rkhunter scan. Applies to all hosts.
# Deploys canonical script (was duplicated between CP bin/ and 100-line heredoc in install-worker.sh)
# plus systemd service + timer. Preconditions (lynis + rkhunter pkgs) installed by `packages` role.

- name: Ensure /var/log/node-maintenance exists (owner root:adm 0750)
  ansible.builtin.file:
    path: /var/log/node-maintenance
    state: directory
    owner: root
    group: adm
    mode: "0750"
  tags: [security-scan]

- name: Deploy security-scan.sh
  ansible.builtin.copy:
    src: security-scan.sh
    dest: /usr/local/sbin/node-maintenance-security-scan.sh
    owner: root
    group: root
    mode: "0750"
  tags: [security-scan]

- name: Deploy security-scan systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - node-maintenance-security-scan.service
    - node-maintenance-security-scan.timer
  notify: Reload systemd
  tags: [security-scan]

- name: Enable + start security-scan timer
  ansible.builtin.systemd_service:
    name: node-maintenance-security-scan.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: [security-scan]

# Telegram notify was CP-only (install.sh installs it locally; workers never got it),
# leaving every worker-side ExecStopPost/notify path silently dead — including this
# role's scan-failure notify and the firewall role's check-phase2-flag-age. Control
# node = CP, so its installed copy + creds are the distribution source.
- name: Deploy telegram-notify.sh (CP-installed copy -> all hosts)
  ansible.builtin.copy:
    src: /usr/local/sbin/telegram-notify.sh
    dest: /usr/local/sbin/telegram-notify.sh
    owner: root
    group: root
    mode: "0750"
  tags: [security-scan]

- name: Distribute telegram credentials (CP-local files -> all hosts, 0600)
  ansible.builtin.copy:
    src: "/etc/node-maintenance/{{ item }}"
    dest: "/etc/node-maintenance/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - telegram-token
    - telegram-chat-id
  no_log: true
  tags: [security-scan]

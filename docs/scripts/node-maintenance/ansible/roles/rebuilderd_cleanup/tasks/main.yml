---
# One-shot follow-up to rebuilderd_teardown: removes leftovers the teardown's
# path list missed — the {base}/rebuilderd data root (archbuild/builds/cache;
# only worker-node-2 has it), the diffoscope orphan (+ its now-orphan python
# deps), and cached rebuilderd/archlinux-repro/diffoscope .pkg.tar in the pacman
# cache. Wired into the workers drift-heal until verified clean, then removed
# (same one-shot pattern as rebuilderd_teardown). Idempotent.

- name: Define rebuilderd data root (hardcoded per host — W1 path is a no-op)
  ansible.builtin.set_fact:
    _rebuilderd_data_root: "{{ '/mnt/extra-storage/rebuilderd' if inventory_hostname == 'worker-node-2' else '/mnt/k8s-storage/rebuilderd' }}"

- name: SAFETY ASSERT — data root is an exact rebuilderd path (guards sibling dirs)
  ansible.builtin.assert:
    that:
      - _rebuilderd_data_root is match('^/mnt/(extra-storage|k8s-storage)/rebuilderd$')
    fail_msg: "Refusing to rm '{{ _rebuilderd_data_root }}' — not an exact rebuilderd data root"
    quiet: true

- name: Remove leftover rebuilderd data root
  ansible.builtin.file:
    path: "{{ _rebuilderd_data_root }}"
    state: absent

- name: Remove diffoscope orphan (+ its now-orphan python deps)
  community.general.pacman:
    name: diffoscope
    state: absent
    extra_args: --recursive

- name: Find ANY leftover rebuilderd/archlinux-repro paths under managed dirs
  ansible.builtin.find:
    paths:
      - /etc
      - /etc/systemd/system
      - /etc/systemd/system.control
      - /usr/bin
      - /usr/local/bin
      - /var/lib
      - /var/lib/systemd/timers   # persistent-timer stamp files (stamp-*.timer)
    patterns: "*rebuilderd*,*archlinux-repro*,stamp-repro-cleanup.timer"
    file_type: any
    recurse: false
  register: _rebuilderd_leftover

- name: Remove leftover rebuilderd systemd/bin/lib paths
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _rebuilderd_leftover.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Find cached rebuilderd/archlinux-repro/diffoscope packages
  ansible.builtin.find:
    paths: /var/cache/pacman/pkg
    patterns: "rebuilderd-*,rebuilderd-tools-*,archlinux-repro-*,diffoscope-*"
  register: _rebuilderd_pkgcache

- name: Remove cached rebuilderd packages
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _rebuilderd_pkgcache.files }}"
  loop_control:
    label: "{{ item.path }}"

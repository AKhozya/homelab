---
# immich-vm (192.168.1.231) — Arch VM on the zettOS NAS, the Immich GPU node.
# Meteor Lake iGPU (0000:00:02.0) full-passthrough for QSV transcode. 4 vCPU / 12Gi, virtio disk + NIC.
# Member of `workers` (k3s-agent, clusterip_heal) + `virtual` (immich_gpu_node role) — see inventory.yml.
# NOT live until bootstrapped to node-maintenance@:65300 and added to inventory (go-live step).

# Cluster LAN IP for the /etc/hosts block (mirrors ansible_host, explicit).
node_ip: 192.168.1.231

# ---- NIC ----
# virtio NIC (enp2s0) — no igc/r8169 EEE link-drop issue → nic_tuning_iface intentionally UNSET, so the
# nic_tuning role no-ops (every task self-gates on nic_tuning_iface). No `virtual`-group when: needed.
# primary_network_file: the systemd-networkd file managing enp2s0 (networkctl: 20-ethernet.network).
# REQUIRED — the hardening role renders /etc/systemd/network/{{ primary_network_file }}.d/ UNguarded,
# so without this the hardening play errors on this host (undefined var). Same name W1 uses.
primary_network_file: 20-ethernet.network

# ---- Swap ----
# No swap (12Gi RAM, transcode node) → swap_* intentionally UNSET → base_config swap asserts skip.

# ---- Kernel cmdline (UKI + systemd-boot — NOT the workers group's AMD/NVMe params) ----
# base_config greps each token in the RUNNING /proc/cmdline with `grep -qFw` (missing = fail = alert).
#   console=hvc0                        virsh-console recovery token.
#   modprobe.blacklist=i915             keeps i915 out of the boot path (loads post-boot via
#                                       load-i915.service — early load on the passed IGD wedges boot).
#   drm_kms_helper.fbdev_emulation=0    Track-0 wedge fix — no kernel fbdev consumer to D-lock on the
#   fbcon=off                           stalled host virtio-gpu virtqueue (holds drm_modeset_lock).
# All four are live in /proc/cmdline (confirmed 2026-07-12). `-Fw` matches the whole token bounded by
# non-word chars, so `modprobe.blacklist=i915` also matches the running kernel once the immich_gpu_node
# role's cmdline task merges `xe` into the token (→ `modprobe.blacklist=i915,xe`). We DELIBERATELY do
# NOT list `modprobe.blacklist=i915,xe` here: the `xe` merge lands in the UKI *source* now but reaches
# the RUNNING kernel only after the next cold-cycle (now automated by phase2 PLAY 1b on a kernel bump;
# also operator/watchdog) — asserting it against /proc/cmdline pre-reboot would be a false alert. `xe`
# drift is enforced at the source by the role's cmdline task.
expected_kernel_params:
  - console=hvc0
  - modprobe.blacklist=i915
  - drm_kms_helper.fbdev_emulation=0
  - fbcon=off

# ---- Packages ----
# VM guest: microcode load is a host concern, but keep the pkg for mkinitcpio's microcode hook parity.
ucode_pkg: intel-ucode
gpu_vendor: intel

# ---- Admin user ----
admin_user: akhozya

# ---- Admin user SSH access (operator + automation pubkeys) ----
# akhozya's authorized_keys, deployed EXCLUSIVELY by the immich_gpu_node role (drift-heal reconciles
# adds/removes + de-dups the 3× master-node drift seen 2026-07-12). /home is persistent ext4 LVM (no
# cloud-init) so keys survive reboots once seeded — this closes the "key clears every reboot" build-
# onboarding gap. The recurring NAS-side ~/.ssh 0771 reset (sshd StrictModes reject) is appliance-side,
# out of IaC → operator `chmod 700 ~/.ssh`. Public keys are not secret; this is the exact deduped set
# live on the guest 2026-07-12 (a superset would lock the operator out — the file is exclusive).
immich_gpu_authorized_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP3LVqolWJr2vol503OhrF+3IkBE5dDYxBEXpvpLge8Z zl-nas-akhozya-20260628"  # operator (laptop, zl_nas_ed25519)
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBoaDR2hN2N4NzyQnOOz5in1jC4XW6handLW30EuTjBp master-node-homelab"       # automation (CP akhozya)

# ---- K3s config (step-4 join decisions) ----
# Data-dir on the 126Gi home LV, NOT the 32Gi root: containerd images + the Immich working set are
# far too big for root (mirrors W1/W2's big-volume data-dir + the W2 DiskPressure lesson). k3s_config
# writes this into /etc/rancher/k3s/config.yaml; the k3s installer reads it at first registration.
k3s_data_dir: /home/k3s

# Node label so the Intel GPU device-plugin DaemonSet + (later) the Immich server/ML pods can
# nodeSelector this node. This REPLACES the workers-group inherited label
# (svccontroller.k3s.cattle.io/enablelb=true) — deliberate: the GPU transcode node is not a servicelb
# ingress endpoint. If servicelb parity is ever wanted, add that label back here alongside gpu=intel.
k3s_node_labels:
  - "homelab/gpu=intel"

# NOTE: k3s_prefer_bundled_bin is NOT set here — it is inherited as `true` from group_vars/workers.yml
# (the VM is a `workers` member), which is the desired value (iptables-nft stale-chain avoidance,
# gotcha_k3s_reboot_ordering). Re-declaring it would be redundant.

---
# worker-node (192.168.1.129) — 8c/32G AMD Granite Ridge + Radeon iGPU, heavy lifter for LTO builds.

# Cluster LAN IP for /etc/hosts block (mirrors ansible_host but explicit).
node_ip: 192.168.1.129

# ---- NIC tuning (igc/r8169 EEE-off; no speed-force on workers) ----
# Primary NIC = enp4s0 (igc). 2.5GbE active. EEE off declarative; matches
# observed live state. No FORCE_SPEED → operates at link-negotiated speed.
nic_tuning_iface: enp4s0

# Swap config — 32G partition, UUID-mounted in fstab.
# swap_path MUST be the stable /dev/disk/by-uuid symlink, NOT a raw /dev/nvmeXn1p3
# name: NVMe controller enumeration (nvme0 vs nvme1) is non-deterministic across
# reboots, so a raw device name silently breaks the verify task after any reboot
# (history: flip-flopped nvme0↔nvme1 in c836a618/68bbf6fe). by-uuid resolves via
# readlink -f to whatever the current device is. UUID matches swap_fstab_entry below.
swap_kind: partition
swap_path: /dev/disk/by-uuid/a6b9e0ba-53f4-4335-8d9f-4d4a4e04306b
swap_fstab_entry: "UUID=a6b9e0ba-53f4-4335-8d9f-4d4a4e04306b\tnone\tswap\tdefaults\t0 0"

# ---- Packages ----
ucode_pkg: amd-ucode
gpu_vendor: amd

# ---- Admin user ----
admin_user: akhozya

# ---- K3s config ----
# K3s data (containerd, images, state) on LVM. Path includes /rancher/
# intermediate for historical reasons (previously a /var/lib/rancher symlink).
k3s_data_dir: /mnt/k8s-storage/rancher/k3s

# ---- UFW firewall ----
# W1-specific rules. Extras vs base: 10.42.2.0/24 (W2 pod subnet — redundant
# vs 10.42.0.0/16 but preserved to match live state).
ufw_rules_host:
  - { comment: "K8s pod network worker-node-2", rule: allow, from_ip: 10.42.2.0/24 }

# W1 route rules: pod-to-node + node-to-pod (same as CP).
ufw_route_rules_host:
  - { comment: "K3s pod-to-node traffic (API server)", rule: allow, from_ip: 10.42.0.0/16, to_ip: 192.168.1.0/24 }
  - { comment: "K3s node-to-pod traffic", rule: allow, from_ip: 192.168.1.0/24, to_ip: 10.42.0.0/16 }

# Primary NIC .network filename — target for the DNS-decoupling drop-in.
# DHCP link → blocky
# DNS dropped via UseDNS=no; resolved global drop-in supplies public DNS.
primary_network_file: 20-ethernet.network

# ---- node_isolation_heal (CP-isolation self-recovery watchdog) ----
# Reboot stagger index 0 → self-reboots at 15min isolated. W2 is index 1 (23min), so the
# two workers never self-reboot together (leaderless rolling reboot; HA DBs lose ≤1 replica).
node_isolation_reboot_index: 0

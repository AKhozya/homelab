---
# worker-node-2 (192.168.1.126) — 4c/16G AMD HawkPoint + Radeon iGPU, lower cap after DPDK OOM incident.

# Cluster LAN IP for /etc/hosts block (mirrors ansible_host but explicit).
node_ip: 192.168.1.126

# ---- NIC tuning (Realtek 8125 r8169 EEE-off; no speed-force) ----
# Primary NIC = enp2s0 (r8169 driver, 2.5GbE). EEE was enabled-active 2026-04-28
# audit — flipped off via nic-tune@enp2s0.service. Same wake-transition class
# of bugs as igc; preventive measure even without observed link drops yet.
nic_tuning_iface: enp2s0

# Swap config — 16G LVM logical volume, mounted via LV path in fstab.
swap_kind: lvm
swap_path: /dev/ArchinstallVg/swap
swap_fstab_entry: "/dev/ArchinstallVg/swap none swap sw 0 0"

# ---- Packages ----
ucode_pkg: amd-ucode
gpu_vendor: amd

# ---- Admin user ----
admin_user: z3us

# ---- K3s config ----
# K3s data (containerd, images, state) lives on LVM, not root FS.
k3s_data_dir: /mnt/k8s-storage/k3s

# ---- Rebuilderd ----
rebuilderd_cpu_quota: "400%"
rebuilderd_mem_max: "12G"
rebuilderd_mem_high: "11G"
rebuilderd_mem_swap_max: "16G"
rebuilderd_repro_dir: "/mnt/extra-storage/repro"
rebuilderd_mem_comment: |
  # RAM: 12GB (hard limit)
  # Reduced from 18GB after DPDK LTO build (lto1-ltrans) exceeded 18GB,
  # triggered OOM killer, and killed MySQL pods on the same node (2026-02-21).
  # Further reduced 14G->12G (2026-04-26) to leave more headroom for K8s pods.
  # Large builds fail inside cgroup instead of pressuring the whole system.
  # Swap increased 8G->16G so large LTO builds survive.

# ---- UFW firewall ----
# W2-specific rules. Extras vs base: 8472/udp from LAN (narrow dup of
# anywhere rule — preserved to match live state).
ufw_rules_host:
  - { comment: "Flannel VXLAN", rule: allow, from_ip: 192.168.1.0/24, to_port: 8472, proto: udp }

# W2 route rules: pod-to-node (diff comment vs CP/W1) + 2 legacy broad forwards.
# Broad routes are supersets of pod-to-pod but left in place to match live state;
# cleanup tracked as followup.
ufw_route_rules_host:
  - { comment: "K3s pod to nodes", rule: allow, from_ip: 10.42.0.0/16, to_ip: 192.168.1.0/24 }
  - { rule: allow, from_ip: 10.42.0.0/16 }
  - { rule: allow, to_ip: 10.42.0.0/16 }

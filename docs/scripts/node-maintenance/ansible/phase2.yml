---
# ──────────────────────────────────────────────────────────────
# PLAY 0: CP stabilize (post-reboot settle before worker rollout)
# ──────────────────────────────────────────────────────────────
# ExecStartPre gates on /readyz only (apiserver reachable); CP workloads
# (scheduler, controller-manager, flux controllers, coredns, traefik) may
# still churn. Sequence of checks + pause so CNI/DNS/controllers settle
# before cordoning workers.
- name: Node maintenance — Phase 2 (CP stabilize)
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  tasks:
    - name: CP control-plane gate — verify k3s loopback LB (127.0.0.1:6443) routes to apiserver
      # phase1 just rebooted the CP. The k3s client loadbalancer on 127.0.0.1:6443 — which the
      # embedded controller-manager AND every kubectl check below dial — can wedge post-reboot
      # while the apiserver is fine on the node IP. Controllers then stall SILENTLY (2026-05-25:
      # coredns scale frozen, observedGeneration stuck). Probe it FIRST so a wedge fails fast +
      # clear instead of 5 min of opaque "not ready" retries below. 401|200 = routed. Bounded
      # retry (tolerate the LB coming up slowly post-reboot; never single-shot). Do NOT auto-restart
      # k3s here — `systemctl restart k3s` HANGS on the CP (2026-05-25); a persistent fail means the
      # operator must `sudo reboot` the CP. See gotcha_k3s_reboot_ordering.
      ansible.builtin.shell: |
        set -o pipefail
        code=$(curl -sS -m5 -k -o /dev/null -w '%{http_code}' https://127.0.0.1:6443/healthz 2>/dev/null) || code=000
        case "$code" in 401 | 200) exit 0 ;; *) echo "CP loopback LB wedged (healthz=$code)"; exit 1 ;; esac
      args:
        executable: /bin/bash
      register: cp_loopback_gate
      until: cp_loopback_gate.rc == 0
      retries: 12
      delay: 10
      changed_when: false

    - name: CP stabilize — wait CP Node Ready
      ansible.builtin.shell: |
        set -o pipefail
        kubectl --kubeconfig={{ kubeconfig_path }} get node -l node-role.kubernetes.io/control-plane -o json \
          | jq -e '[.items[] | select(.status.conditions[]? | select(.type=="Ready") | .status != "True")] | length == 0'
      args:
        executable: /bin/bash
      register: cp_node_ready
      until: cp_node_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: CP stabilize — wait kube-system critical pods Ready (coredns + metrics-server)
      ansible.builtin.shell: |
        set -o pipefail
        kubectl --kubeconfig={{ kubeconfig_path }} -n kube-system get pods \
          -l 'k8s-app in (kube-dns,metrics-server)' -o json \
          | jq -e '
              [.items[]
                | select(.status.phase != "Succeeded")
                | select(.status.conditions[]? | select(.type=="Ready") | .status != "True")
              ] | length == 0
            '
      args:
        executable: /bin/bash
      register: kube_system_ready
      until: kube_system_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: CP stabilize — wait traefik ingress Ready
      ansible.builtin.shell: |
        set -o pipefail
        kubectl --kubeconfig={{ kubeconfig_path }} -n traefik get pods \
          -l 'app.kubernetes.io/name=traefik' -o json \
          | jq -e '
              (.items | length) > 0
              and ([.items[]
                     | select(.status.phase != "Succeeded")
                     | select(.status.conditions[]? | select(.type=="Ready") | .status != "True")
                   ] | length == 0)
            '
      args:
        executable: /bin/bash
      register: traefik_ready
      until: traefik_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: CP stabilize — wait flux-system controllers Ready
      ansible.builtin.shell: |
        set -o pipefail
        kubectl --kubeconfig={{ kubeconfig_path }} -n flux-system get pods \
          -l 'app in (source-controller,kustomize-controller,helm-controller,notification-controller)' -o json \
          | jq -e '
              [.items[]
                | select(.status.phase != "Succeeded")
                | select(.status.conditions[]? | select(.type=="Ready") | .status != "True")
              ] | length == 0
            '
      args:
        executable: /bin/bash
      register: flux_ctrl_ready
      until: flux_ctrl_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: CP stabilize — wait Flux kustomizations Ready
      ansible.builtin.shell: |
        set -o pipefail
        kubectl --kubeconfig={{ kubeconfig_path }} get kustomization -n flux-system -o json \
          | jq -e '[.items[] | select(.status.conditions[]? | select(.type=="Ready") | .status != "True")] | length == 0'
      args:
        executable: /bin/bash
      register: flux_ready_check
      until: flux_ready_check.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: CP stabilize pause
      ansible.builtin.pause:
        minutes: "{{ cp_stabilize_minutes }}"

# ──────────────────────────────────────────────────────────────
# PLAY 0.5: Pause rebuilderd fleet-wide
# ──────────────────────────────────────────────────────────────
# Fires only after CP is confirmed healthy. Stops rebuilderd on BOTH
# workers in parallel so the non-rebooting worker is idle during the
# other's reschedule window (evicted pods land on a quiet node —
# avoids cold image pulls competing with 13x rebuilderd builders for
# disk/network). rebuilderd-worker-boot.timer re-arms each worker at
# +60min post-its-own-reboot, so no explicit restart needed.
- name: Node maintenance — Phase 2 (pause rebuilderd fleet-wide)
  hosts: workers
  gather_facts: false
  become: true

  tasks:
    - name: Stop rebuilderd-worker on all workers (fleet-wide pause)
      ansible.builtin.systemd_service:
        name: rebuilderd-worker@1.service
        state: stopped
      failed_when: false  # tolerate "not running"

# ──────────────────────────────────────────────────────────────
# PLAY 1: Per-worker rolling update (serial: 1)
# ──────────────────────────────────────────────────────────────
- name: Node maintenance — Phase 2 (worker rolling update)
  hosts: workers
  serial: 1
  gather_facts: false
  become: true

  tasks:
    - name: Verify SSH reachable before start
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: Stop rebuilderd-worker (boot timer re-enables at +60min)
      ansible.builtin.systemd_service:
        name: rebuilderd-worker@1.service
        state: stopped
      failed_when: false   # tolerate "not running"

    - name: Cordon node
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: patched
        kind: Node
        name: "{{ inventory_hostname }}"
        definition:
          spec:
            unschedulable: true
      delegate_to: localhost
      become: false

    - name: Upgrade via yay (best-effort — transient AUR failures must not block reboot)
      block:
        - name: First attempt
          ansible.builtin.shell: "{{ yay_cmd }}"
          register: yay_result
          changed_when: "'there is nothing to do' not in yay_result.stdout"
      rescue:
        - name: Pause 30s before retry
          ansible.builtin.pause:
            seconds: 30
        - name: Retry attempt (non-fatal — proceed to reboot regardless)
          ansible.builtin.shell: "{{ yay_cmd }}"
          register: yay_result_retry
          changed_when: "'there is nothing to do' not in yay_result_retry.stdout"
          failed_when: false

    - name: CP-health guard — apiserver /readyz before rebooting this worker
      # Don't reboot a worker while the CP apiserver/tunnel is flapping: a worker that re-syncs
      # kube-proxy against an unstable CP is far likelier to land a partial iptables-restore that
      # wedges KUBE-SERVICES DNAT (2026-05-25 research). PLAY 0 gated the CP at run start; this
      # re-checks right before THIS worker's reboot. Bounded wait (~3min); if the CP isn't ready the
      # serial:1 play aborts (this worker not rebooted, next worker untouched, phase2-pending retained).
      ansible.builtin.command: kubectl --kubeconfig={{ kubeconfig_path }} get --raw=/readyz
      register: cp_readyz_guard
      until: cp_readyz_guard.rc == 0 and (cp_readyz_guard.stdout | trim) == "ok"
      retries: 18
      delay: 10
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Reboot node (graceful — shutdownGracePeriod 2min handles pods)
      ansible.builtin.reboot:
        reboot_timeout: "{{ reboot_timeout_sec }}"
        post_reboot_delay: "{{ post_reboot_delay_sec }}"
        test_command: "systemctl is-active {{ k3s_service }}"

    - name: Wait for node Ready in k8s API
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Node
        name: "{{ inventory_hostname }}"
      register: node_info
      until: >
        node_info.resources | length > 0
        and (node_info.resources[0].status.conditions
             | selectattr('type','equalto','Ready')
             | selectattr('status','equalto','True')
             | list | length) > 0
      retries: "{{ node_ready_retries }}"
      delay: "{{ node_ready_delay_sec }}"
      delegate_to: localhost
      become: false

    - name: ClusterIP gate — verify worker kube-proxy DNAT before uncordon (self-heal if wedged)
      # Node.Ready (above) proves kubelet, NOT that kube-proxy programmed KUBE-SERVICES DNAT for the
      # ClusterIP. A Ready-but-wedged worker would get uncordoned and take pods that crashloop on
      # 10.43.0.1 (2026-05-24 incident). Probe ON the worker; if wedged, restart k3s-agent (clean
      # kube-proxy re-sync) and re-probe. Runs on the worker (become from play; NO delegate_to).
      block:
        - name: Probe ClusterIP DNAT on the rebooted worker
          ansible.builtin.command: /etc/node-maintenance/bin/clusterip-probe.sh
          register: cip_probe
          until: cip_probe.rc == 0
          retries: 12
          delay: 10
          changed_when: false
      rescue:
        - name: Self-heal — restart k3s-agent (forces clean kube-proxy re-sync)
          ansible.builtin.systemd_service:
            name: "{{ k3s_service }}"
            state: restarted
        - name: Re-probe ClusterIP DNAT after k3s-agent restart
          ansible.builtin.command: /etc/node-maintenance/bin/clusterip-probe.sh
          register: cip_probe_reheal
          until: cip_probe_reheal.rc == 0
          retries: 12
          delay: 10
          changed_when: false
          # Still failing here → task errors → serial:1 play aborts: this worker stays CORDONED,
          # phase2-pending retained, the NEXT worker is never processed. Operator re-triggers after
          # manual remediation (cluster-reboot SKILL.md partial-completion model).

    - name: Pod-network gate — verify nat POSTROUTING jumps present before uncordon (self-heal if wedged)
      # The host-netns clusterip-probe.sh above PASSES while pod→ClusterIP/DNS is dead in the
      # 2026-05-30 failure mode: ufw-heal's disabled-recovery `flush-all` runs `iptables -t nat -F
      # POSTROUTING`, deleting the -j CNI-HOSTPORT-MASQ / -j KUBE-POSTROUTING jumps. portmap CNI is
      # NOT a daemon (k8s#93091) so the CNI jump never returns until a k3s-agent restart; host-netns
      # curl to 10.43.0.1 still works (OUTPUT path) so the existing probe is blind to it. Assert the
      # nat POSTROUTING jumps exist; if missing, restart k3s-agent (rebuilds CNI + kube-proxy chains).
      # Runs ON the worker (become from play; NO delegate_to).
      block:
        - name: Assert nat POSTROUTING has CNI-HOSTPORT-MASQ + KUBE-POSTROUTING jumps
          ansible.builtin.shell: |
            set -o pipefail
            s="$(iptables -t nat -S POSTROUTING 2>/dev/null)"
            printf '%s\n' "$s" | grep -q -- '-j CNI-HOSTPORT-MASQ' \
              && printf '%s\n' "$s" | grep -q -- '-j KUBE-POSTROUTING'
          args:
            executable: /bin/bash
          register: nat_jumps
          until: nat_jumps.rc == 0
          retries: 6
          delay: 10
          changed_when: false
      rescue:
        - name: Self-heal — restart k3s-agent (rebuilds flushed CNI/kube-proxy nat jumps)
          ansible.builtin.systemd_service:
            name: "{{ k3s_service }}"
            state: restarted
        - name: Re-assert nat POSTROUTING jumps after k3s-agent restart
          ansible.builtin.shell: |
            set -o pipefail
            s="$(iptables -t nat -S POSTROUTING 2>/dev/null)"
            printf '%s\n' "$s" | grep -q -- '-j CNI-HOSTPORT-MASQ' \
              && printf '%s\n' "$s" | grep -q -- '-j KUBE-POSTROUTING'
          args:
            executable: /bin/bash
          register: nat_jumps_reheal
          until: nat_jumps_reheal.rc == 0
          retries: 6
          delay: 10
          changed_when: false
          # Still failing → serial:1 aborts, worker stays CORDONED (existing partial-completion model).

    - name: Stabilization settle + final re-probe before uncordon (catch a post-gate re-wedge)
      # The gate above can pass on a node whose kube-proxy then RE-wedges seconds later (observed
      # 2026-05-25: gate caught a momentary-healthy flap, node re-wedged, took pods once uncordoned).
      # Settle, then re-probe (N-sample + kube-proxy :10256 healthz). If it re-wedged this fails →
      # serial:1 aborts, worker stays CORDONED — never uncordon a node that won't hold healthy.
      block:
        - name: Settle after gate (let kube-proxy converge)
          ansible.builtin.pause:
            seconds: 45
        - name: Final ClusterIP + kube-proxy re-probe before uncordon
          ansible.builtin.command: /etc/node-maintenance/bin/clusterip-probe.sh
          register: cip_final
          until: cip_final.rc == 0
          retries: 6
          delay: 10
          changed_when: false

    - name: Uncordon node
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: patched
        kind: Node
        name: "{{ inventory_hostname }}"
        definition:
          spec:
            unschedulable: false
      delegate_to: localhost
      become: false

    - name: Stabilize pause
      ansible.builtin.pause:
        minutes: "{{ per_node_stabilize_minutes }}"

    # NOTE: rebuilderd-worker is NOT explicitly restarted here. rebuilderd-worker-boot.timer
    # (OnBootSec=60min) re-arms on every reboot and is the sole re-enable path. An explicit
    # start at uncordon+stabilize (~4min) competed with pod reschedule for disk/CPU and slowed
    # convergence (2026-05-28: apprise/metrics-server cold-starts timed out under that load).
    # 60min delay clears the convergence window before 13x builders resume.

    - name: Observe crashloops (report-only; decision - continue, self-heal)
      ansible.builtin.shell: |
        set -o pipefail
        kubectl --kubeconfig={{ kubeconfig_path }} get pods -A -o json \
          | jq -r '.items[] | select(.status.containerStatuses[]?.state.waiting.reason=="CrashLoopBackOff")
                  | "\(.metadata.namespace)/\(.metadata.name)"'
      args:
        executable: /bin/bash
      register: crashloops
      changed_when: false
      failed_when: false
      delegate_to: localhost
      become: false

# ──────────────────────────────────────────────────────────────
# PLAY 2: Cluster-level post-tasks (cleanup + alerts + notify)
# ──────────────────────────────────────────────────────────────
- name: Node maintenance — Phase 2 (post-tasks)
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  tasks:
    - name: Final 5-minute stabilize
      ansible.builtin.pause:
        minutes: "{{ final_stabilize_minutes }}"

    - name: Pre-gate — verify source-controller Available before reconcile
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }} wait deployment/source-controller
        -n flux-system --for=condition=Available --timeout=120s
      changed_when: false

    - name: Flux reconcile kustomizations
      ansible.builtin.command: >
        flux reconcile kustomization {{ item }} --timeout=180s
      loop: "{{ flux_kustomizations }}"
      register: flux_results
      until: flux_results.rc == 0
      retries: 3
      delay: 60
      changed_when: false
      # Best-effort nudge only — Flux reconciles on its own timer regardless. A transient
      # timeout here must NOT fail PLAY 2, else phase2-pending is left stuck (PLAY 2 never
      # reaches its clear step) → sync + config drift-heal gated cluster-wide until the 2h
      # age-clear (2026-06-20: ~1.7h stall during the W1 DNAT wedge). Outcome still logged
      # via flux_results; Flux's own kustomization-failed alerts cover a real reconcile fault.
      failed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Cleanup — local CP (runs as root; no SSH needed)
      ansible.builtin.shell: |
        paccache -rk2
        paccache -ruk0
        ORPHANS=$(pacman -Qtdq || true)
        [ -n "$ORPHANS" ] && pacman -Rns --noconfirm $ORPHANS || true
        crictl rmi --prune || true
      changed_when: false
      failed_when: false

    - name: Cleanup — remote workers via SSH
      ansible.builtin.shell: |
        ssh -p 65300 -i {{ state_dir }}/.ssh/id_ed25519 \
            -o UserKnownHostsFile=/etc/node-maintenance/known_hosts \
            -o StrictHostKeyChecking=yes \
            node-maintenance@{{ item }} '
          sudo paccache -rk2
          sudo paccache -ruk0
          ORPHANS=$(pacman -Qtdq || true)
          [ -n "$ORPHANS" ] && sudo pacman -Rns --noconfirm $ORPHANS || true
          sudo crictl rmi --prune || true
        '
      loop:
        - 192.168.1.129
        - 192.168.1.126
      changed_when: false
      failed_when: false

    # Restricted to system/infra namespaces. User-app namespaces (immich,
    # paperless, n8n, mealie, etc.) excluded so a Failed pod the user is
    # investigating isn't silently nuked. Eviction artifacts in app ns get
    # GC'd by their controllers (Deployment/StatefulSet) on next sync.
    - name: Delete Failed/Evicted pods (system + infra namespaces only)
      ansible.builtin.shell: |
        kubectl --kubeconfig={{ kubeconfig_path }} -n {{ item }} delete pod \
          --field-selector=status.phase=Failed --ignore-not-found
      loop: "{{ phase2_pod_gc_namespaces }}"
      changed_when: false

    - name: Trigger Flux source GC
      ansible.builtin.command: flux reconcile source git flux-system --timeout=180s
      register: flux_source_result
      until: flux_source_result.rc == 0
      retries: 3
      delay: 30
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # ── Alertmanager interactions (via kubectl exec into alertmanager pod) ──
    - name: Find alertmanager pod
      ansible.builtin.shell: |
        kubectl --kubeconfig={{ kubeconfig_path }} -n monitoring \
          get pods -l app.kubernetes.io/name=alertmanager \
          -o jsonpath='{.items[0].metadata.name}'
      args:
        executable: /bin/bash
      register: am_pod
      changed_when: false
      check_mode: false

    - name: Re-check firing alerts (amtool)
      ansible.builtin.shell: |
        kubectl --kubeconfig={{ kubeconfig_path }} -n monitoring exec "{{ am_pod.stdout }}" -c alertmanager -- \
          amtool --alertmanager.url=http://localhost:9093 alert query --active --output=json
      args:
        executable: /bin/bash
      register: firing_alerts_raw
      changed_when: false
      failed_when: false

    - name: Parse firing alerts count
      ansible.builtin.set_fact:
        firing_alerts_count: "{{ (firing_alerts_raw.stdout | default('[]') | from_json | length) if (firing_alerts_raw.stdout | default('') | length > 0) else 0 }}"

    - name: Read silence ID (if present)
      ansible.builtin.slurp:
        src: "{{ silence_id_file }}"
      register: silence_id_b64
      failed_when: false

    # Expires only the broad silence (silence_alertnames). The deferred-start
    # silence (silence_deferred_alertnames, e.g. RebuilderdWorkerDown) is NOT
    # expired here — its worker starts 60 min post-boot, after this play ends;
    # it auto-expires via silence_deferred_duration_seconds.
    - name: Expire auto-silence (amtool)
      ansible.builtin.shell: |
        SILID="{{ silence_id_b64.content | b64decode | trim }}"
        kubectl --kubeconfig={{ kubeconfig_path }} -n monitoring exec "{{ am_pod.stdout }}" -c alertmanager -- \
          amtool --alertmanager.url=http://localhost:9093 silence expire "$SILID"
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
      when: silence_id_b64.content is defined

    - name: Remove silence-id file
      ansible.builtin.file:
        path: "{{ silence_id_file }}"
        state: absent

    - name: Emit node_exporter textfile metric
      ansible.builtin.copy:
        dest: "{{ metrics_file }}"
        mode: '0644'
        content: |
          # HELP node_maintenance_last_run_unixtime Unix time of last successful run
          # TYPE node_maintenance_last_run_unixtime gauge
          node_maintenance_last_run_unixtime {{ ansible_facts['date_time'].epoch }}

    - name: Read updated packages summary
      ansible.builtin.slurp:
        src: "{{ updated_packages_log }}"
      register: pkg_log_b64
      failed_when: false

    - name: Build Telegram summary message
      ansible.builtin.set_fact:
        tg_summary: |
          ✅ *Node maintenance complete*
          Nodes: CP, worker-node, worker-node-2
          Alerts still firing: {{ firing_alerts_count | default(0) }}
          Log: /var/log/node-maintenance/phase2-{{ '%d-%m-%Y' | strftime(ansible_facts['date_time'].epoch | int) }}.log

    - name: Telegram — success summary
      ansible.builtin.include_tasks: tasks/telegram.yml
      vars:
        tg_message: "{{ tg_summary }}"

    - name: Remove phase2-pending flag (success)
      ansible.builtin.file:
        path: "{{ flag_file }}"
        state: absent

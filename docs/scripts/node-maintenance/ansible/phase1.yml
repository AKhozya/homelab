---
- name: Node maintenance — Phase 1 (control-plane self-update)
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  tasks:

    # ── PREFLIGHT ──────────────────────────────────────────────
    - name: Preflight — no active backup/replication job
      ansible.builtin.shell: |
        set -o pipefail
        kubectl --kubeconfig={{ kubeconfig_path }} get jobs -A -o json \
          | jq -r '[.items[] | select(.metadata.name | test("backup|replication")) | select(.status.active == 1)] | length'
      args:
        executable: /bin/bash
      register: active_backups
      changed_when: false
      check_mode: false
      failed_when: (active_backups.stdout | int) > 0

    - name: Preflight — collect / and /var disk space (df-based, avoids ansible_mounts conditional quirks)
      ansible.builtin.shell: |
        set -o pipefail
        root_gb=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
        var_gb=$(df -BG --output=avail /var 2>/dev/null | tail -1 | tr -dc '0-9')
        echo "root_gb=$root_gb var_gb=${var_gb:-$root_gb}"
      args:
        executable: /bin/bash
      register: disk_check
      changed_when: false
      check_mode: false

    - name: Preflight — assert disk space thresholds
      ansible.builtin.assert:
        that:
          - "(disk_check.stdout | regex_search('root_gb=(\\d+)', '\\\\1') | first | int) >= (min_free_root_gb | int)"
          - "(disk_check.stdout | regex_search('var_gb=(\\d+)', '\\\\1') | first | int) >= (min_free_var_gb | int)"
        fail_msg: "Disk preflight failed: {{ disk_check.stdout }}"

    - name: Preflight — Flux kustomizations all Ready
      ansible.builtin.shell: |
        set -o pipefail
        kubectl --kubeconfig={{ kubeconfig_path }} get kustomization -n flux-system -o json \
          | jq -e '[.items[] | select(.status.conditions[]? | select(.type=="Ready") | .status != "True")] | length == 0'
      args:
        executable: /bin/bash
      changed_when: false
      check_mode: false

    - name: Preflight — workers reachable
      ansible.builtin.command: >-
        ssh -o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=/etc/node-maintenance/known_hosts
            -p 65300 -i {{ state_dir }}/.ssh/id_ed25519
            node-maintenance@{{ item }} true
      loop:
        - 192.168.1.129
        - 192.168.1.126
      changed_when: false
      check_mode: false

    # ── NOTIFY START ──────────────────────────────────────────
    - name: Telegram — run starting
      ansible.builtin.include_tasks: tasks/telegram.yml
      vars:
        tg_message: "🔧 Node maintenance phase 1 starting on {{ ansible_facts['hostname'] }}. Log: /var/log/node-maintenance/phase1-{{ '%d-%m-%Y' | strftime(ansible_facts['date_time'].epoch | int) }}.log"

    # ── SILENCE TRANSIENT ALERTS (via kubectl exec into alertmanager pod — bypasses host→pod routing issues) ──
    - name: Find alertmanager pod
      ansible.builtin.shell: |
        kubectl --kubeconfig={{ kubeconfig_path }} -n monitoring \
          get pods -l app.kubernetes.io/name=alertmanager \
          -o jsonpath='{.items[0].metadata.name}'
      args:
        executable: /bin/bash
      register: am_pod
      changed_when: false
      check_mode: false

    - name: "Silence transient alerts, duration minutes: {{ silence_duration_seconds // 60 }}"
      ansible.builtin.shell: |
        BODY=$(cat <<'JSON'
        {"matchers":[{"name":"alertname","value":"{{ silence_alertnames }}","isRegex":true}],"startsAt":"{{ '%Y-%m-%dT%H:%M:%SZ' | strftime(ansible_facts['date_time'].epoch | int) }}","endsAt":"{{ '%Y-%m-%dT%H:%M:%SZ' | strftime((ansible_facts['date_time'].epoch | int) + silence_duration_seconds) }}","createdBy":"node-maintenance","comment":"Auto-silence during scheduled node update run"}
        JSON
        )
        kubectl --kubeconfig={{ kubeconfig_path }} -n monitoring exec "{{ am_pod.stdout }}" -c alertmanager -- \
          wget -qO- --header='Content-Type: application/json' --post-data="$BODY" \
            http://localhost:9093/api/v2/silences
      args:
        executable: /bin/bash
      register: silence_response
      changed_when: false

    - name: Persist silence ID
      ansible.builtin.copy:
        dest: "{{ silence_id_file }}"
        content: "{{ (silence_response.stdout | from_json).silenceID }}"
        mode: '0600'
        owner: root
        group: root
      when: silence_response.stdout | length > 0

    # ── UPGRADE ───────────────────────────────────────────────
    - name: Upgrade via yay (pacman + AUR)
      ansible.builtin.shell: "{{ yay_cmd }}"
      register: yay_result
      changed_when: "'there is nothing to do' not in yay_result.stdout"

    - name: Persist package update log
      ansible.builtin.copy:
        dest: "{{ updated_packages_log }}"
        content: "{{ yay_result.stdout }}"
        mode: '0644'
        owner: root
        group: root

    # ── STAGE PHASE 2 ─────────────────────────────────────────
    - name: Create phase2-pending flag
      ansible.builtin.file:
        path: "{{ flag_file }}"
        state: touch
        mode: '0600'
        owner: root
        group: root

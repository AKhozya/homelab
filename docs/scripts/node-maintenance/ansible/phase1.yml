---
- name: Node maintenance — Phase 1 (control-plane self-update)
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  tasks:

    # ── PREFLIGHT ──────────────────────────────────────────────
    - name: Preflight — no active backup/replication job
      ansible.builtin.shell: |
        set -o pipefail
        kubectl --kubeconfig={{ kubeconfig_path }} get jobs -A -o json \
          | jq -r '[.items[] | select(.metadata.name | test("backup|replication")) | select(.status.active == 1)] | length'
      args:
        executable: /bin/bash
      register: active_backups
      changed_when: false
      check_mode: false
      failed_when: (active_backups.stdout | int) > 0

    - name: Preflight — collect / and /var disk space (df-based, avoids ansible_mounts conditional quirks)
      ansible.builtin.shell: |
        set -o pipefail
        root_gb=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
        var_gb=$(df -BG --output=avail /var 2>/dev/null | tail -1 | tr -dc '0-9')
        echo "root_gb=$root_gb var_gb=${var_gb:-$root_gb}"
      args:
        executable: /bin/bash
      register: disk_check
      changed_when: false
      check_mode: false

    - name: Preflight — assert disk space thresholds
      ansible.builtin.assert:
        that:
          - "(disk_check.stdout | regex_search('root_gb=(\\d+)', '\\\\1') | first | int) >= (min_free_root_gb | int)"
          - "(disk_check.stdout | regex_search('var_gb=(\\d+)', '\\\\1') | first | int) >= (min_free_var_gb | int)"
        fail_msg: "Disk preflight failed: {{ disk_check.stdout }}"

    - name: Preflight — Flux kustomizations all Ready
      ansible.builtin.shell: |
        set -o pipefail
        kubectl --kubeconfig={{ kubeconfig_path }} get kustomization -n flux-system -o json \
          | jq -e '[.items[] | select(.status.conditions[]? | select(.type=="Ready") | .status != "True")] | length == 0'
      args:
        executable: /bin/bash
      changed_when: false
      check_mode: false

    - name: Preflight — workers reachable
      ansible.builtin.command: >-
        ssh -o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=/etc/node-maintenance/known_hosts
            -p 65300 -i {{ state_dir }}/.ssh/id_ed25519
            node-maintenance@{{ item }} true
      loop:
        - 192.168.1.129
        - 192.168.1.126
      changed_when: false
      check_mode: false

    # ── NOTIFY START ──────────────────────────────────────────
    - name: Telegram — run starting
      ansible.builtin.include_tasks: tasks/telegram.yml
      vars:
        tg_message: "🔧 Node maintenance phase 1 starting on {{ ansible_hostname }}. Log: /var/log/node-maintenance/phase1-{{ '%d-%m-%Y' | strftime(ansible_date_time.epoch | int) }}.log"

    # ── SILENCE TRANSIENT ALERTS (via kubectl proxy) ──────────
    - name: Start kubectl proxy via systemd-run (transient unit, survives ansible task exit)
      ansible.builtin.shell: |
        systemctl stop node-maintenance-kubectl-proxy 2>/dev/null || true
        pkill -f 'kubectl.*proxy.*--port=8001' 2>/dev/null || true
        systemd-run --unit=node-maintenance-kubectl-proxy --quiet \
          kubectl --kubeconfig={{ kubeconfig_path }} proxy --port=8001
        for i in {1..10}; do
          curl -sf -m 2 http://127.0.0.1:8001/api > /dev/null && exit 0
          sleep 1
        done
        echo "kubectl proxy did not come up" >&2
        exit 1
      args:
        executable: /bin/bash
      changed_when: false

    - name: "Silence transient alerts, duration minutes: {{ silence_duration_seconds // 60 }}"
      ansible.builtin.uri:
        url: "{{ alertmanager_url }}/api/v2/silences"
        method: POST
        body_format: json
        body:
          matchers:
            - { name: "alertname", value: "{{ silence_alertnames }}", isRegex: true }
          startsAt: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime(ansible_date_time.epoch | int) }}"
          endsAt: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime((ansible_date_time.epoch | int) + silence_duration_seconds) }}"
          createdBy: "node-maintenance"
          comment: "Auto-silence during scheduled node update run"
        status_code: 200
      register: silence_response

    - name: Persist silence ID
      ansible.builtin.copy:
        dest: "{{ silence_id_file }}"
        content: "{{ silence_response.json.silenceID }}"
        mode: '0600'
        owner: root
        group: root
      when: silence_response.json is defined and silence_response.json.silenceID is defined

    - name: Stop kubectl proxy (systemd-managed)
      ansible.builtin.shell: |
        systemctl stop node-maintenance-kubectl-proxy 2>/dev/null || true
      changed_when: false

    # ── UPGRADE ───────────────────────────────────────────────
    - name: Upgrade via yay (pacman + AUR)
      ansible.builtin.shell: "{{ yay_cmd }}"
      register: yay_result
      changed_when: "'there is nothing to do' not in yay_result.stdout"

    - name: Persist package update log
      ansible.builtin.copy:
        dest: "{{ updated_packages_log }}"
        content: "{{ yay_result.stdout }}"
        mode: '0644'
        owner: root
        group: root

    # ── STAGE PHASE 2 ─────────────────────────────────────────
    - name: Create phase2-pending flag
      ansible.builtin.file:
        path: "{{ flag_file }}"
        state: touch
        mode: '0600'
        owner: root
        group: root

---
all:
  vars:
    ansible_ssh_common_args: '-o UserKnownHostsFile=/etc/node-maintenance/known_hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=10'
    ansible_ssh_private_key_file: /var/lib/node-maintenance/.ssh/id_ed25519
    ansible_user: node-maintenance
    ansible_port: 65300
    ansible_python_interpreter: /usr/bin/python3
  children:
    control_plane:
      hosts:
        gmk-k3s-control-plane:
          ansible_connection: local
          ansible_host: 127.0.0.1
          ansible_user: root
          k3s_service: k3s.service
    workers:
      hosts:
        worker-node:
          ansible_host: 192.168.1.129
          k3s_service: k3s-agent.service
        worker-node-2:
          ansible_host: 192.168.1.126
          k3s_service: k3s-agent.service
        # Immich GPU node (Arch VM on the zettOS NAS). In `workers` for k3s-agent +
        # clusterip_heal; also in `virtual` (below) which scopes the immich_gpu_node role,
        # gates OFF node_isolation_heal, and carves it out of the phase2 in-guest reboot
        # (a passthrough-VM in-guest reboot wedges the iGPU → NAS host crash). See host_vars.
        immich-vm:
          ansible_host: 192.168.1.231
          k3s_service: k3s-agent.service
    # `virtual` = VMs that must never in-guest reboot (GPU-passthrough reset-bug). Scopes the
    # immich_gpu_node role and every reboot-path carve-out (node-config, phase2).
    virtual:
      hosts:
        immich-vm: {}

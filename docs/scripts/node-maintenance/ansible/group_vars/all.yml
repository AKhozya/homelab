---
# Paths
state_dir: /var/lib/node-maintenance
flag_file: "{{ state_dir }}/phase2-pending"
log_dir: /var/log/node-maintenance
silence_id_file: "{{ state_dir }}/silence-id"
updated_packages_log: "{{ state_dir }}/updated-packages.log"
metrics_file: /var/lib/node_exporter/textfile/node_maintenance.prom

# Credentials (populated by install.sh)
telegram_token_file: /etc/node-maintenance/telegram-token
telegram_chat_id_file: /etc/node-maintenance/telegram-chat-id

# Kubernetes
kubeconfig_path: /etc/rancher/k3s/k3s.yaml

# Alertmanager — accessed via `kubectl exec` + amtool in the alertmanager pod.
# (CP host can't reach pod CIDR; API-server-proxy 502's on pod dial. Earlier
# approach used kubectl proxy + wget, now obsolete — kubectl-proxy.service kept
# installed for potential rollback but not used by playbooks.)
silence_duration_seconds: 5400   # 90 minutes (covers phase1 + CP reboot + phase2 typical runtime)
silence_alertnames: "KubeletDown|KubernetesAPIServerDown|DeploymentReplicasMismatch|StatefulSetReplicasMismatch|CloudflareTunnelDown|CloudflareTunnelPodNotRunning|CloudflareTunnelNoConnections|CouchDBDown|CouchDBPodNotRunning|FluxReconciliationFailure|FluxSourceNotReady|KyvernoAdmissionControllerDown|LokiDown|LokiCompactorNotRunning|MySQLDown|MySQLHAProxyNotRunning|MySQLOrchestratorNotRunning|RedisDown|RedisPodNotRunning|AlertmanagerFailedToSendAlerts|AlloyDown|AlloyLogDeliveryFailing|DaemonSetNotScheduled|TraefikDown|PrometheusTargetDown|KubePodCrashLooping|KubePodNotReady|PodRunningNotReady|PodPhaseNotRunning|TargetDown|TooManyPodsPending|JobFailed"

# Preflight thresholds
min_free_root_gb: 5
min_free_var_gb: 3

# Reboot / stabilization
reboot_timeout_sec: 400
post_reboot_delay_sec: 30
node_ready_retries: 40
node_ready_delay_sec: 10
cp_stabilize_minutes: 4
per_node_stabilize_minutes: 4
final_stabilize_minutes: 5

# Flux kustomizations to reconcile
flux_kustomizations:
  - flux-system
  - infrastructure-controllers
  - infrastructure-configs
  - apps
  - monitoring-configs
  - monitoring-controllers

# yay command (used in both phases)
# -Syyu (double y) forces re-download of mirror DB even if cache appears fresh —
# catches mirror-staleness where DB lists package files that have rotated.
yay_cmd: "sudo -u node-maintenance yay -Syyu --noconfirm --answerdiff=None --answerclean=None --removemake"

# Phase2 post-rollout Failed-pod GC scope. Limited to system + infra namespaces;
# user-app namespaces (immich, paperless, n8n, mealie, etc.) are skipped so
# operator-investigated Failed pods aren't silently nuked. Add new infra ns here.
# Expected kernel cmdline params, universal across all nodes. Set by
# bootloader (systemd-boot) at install via setup-node.sh — bootstrap-only,
# never re-applied. base_config asserts presence in /proc/cmdline; drift =
# missing param → fail task → telegram alert. Reading is read-only — operator
# investigates by editing /boot/loader/entries/*.conf and rebooting.
expected_kernel_params:
  - pcie_aspm=off
  - efi_pstore.pstore_disable=0
  - printk.always_kmsg_dump=Y
  - panic=10

phase2_pod_gc_namespaces:
  - kube-system
  - kube-public
  - flux-system
  - kyverno
  - monitoring
  - traefik
  - cert-manager
  - databases
  - cloudflare-tunnel
  - backup-replication
  - node-maintenance

# ---- UFW firewall ----
# Policies: default-deny incoming/routed, allow outgoing. Logging low = user.log noise-free.
ufw_policy_incoming: deny
ufw_policy_outgoing: allow
ufw_policy_routed: deny
ufw_logging: low

# ---- Packages ----
# Applied by `packages` role. AUR pkgs out of scope (setup-node.sh bootstrap).
pacman_packages_base:
  # arch-audit: CVE scan of the installed package set; companion to the security_scan role.
  - arch-audit
  - base-devel
  - bash-completion
  # Modern CLI viewing/diff/lint — parity with Mac dev env, useful when SSH'd in
  - bat
  - bc
  - btop
  - chezmoi
  - duf
  - dust
  - efibootmgr
  - ethtool
  - eza
  - fail2ban
  - fd
  - fwupd
  - fzf
  - git
  - git-delta
  - github-cli
  - go
  - gron
  - inetutils
  - jc
  - jq
  # kernel-modules-hook KEEPS /usr/lib/modules/<running> populated when pacman upgrades the
  # kernel package. Without it, a mid-session `pacman -Syu` lets 60-mkinitcpio-remove.hook delete
  # the RUNNING kernel's modules dir → every subsequent modprobe FATALs → the 2026-05-02 W1
  # cascade (ufw silent-disable → INPUT chain DROP).
  # Declared here rather than in setup-node.sh's AUR_PKGS: it lives in `extra`, NOT the AUR. The
  # old "(AUR)" labelling routed it through a bootstrap-only best-effort install that failed
  # silently on immich-vm, and the cascade went live there 2026-07-18 (kernel 6.18.38-2 → -4).
  # Declarative here = every node, every node-config run, with the role's retries.
  - kernel-modules-hook
  # k8s-adjacent (most useful on control plane; small on workers)
  - kubectl
  - kubectx
  - kubeconform
  - helm
  - linux-lts
  - linux-lts-headers
  - lvm2
  - lynis
  - neovim
  - nvme-cli
  - openssh
  - pacman-contrib
  - reflector
  - rkhunter
  - rsync
  - shellcheck
  - shfmt
  - smartmontools
  - sops
  - stern
  - sysstat
  - tree
  - ufw
  - ufw-extras
  - vim
  - xclip
  - yamllint
  - yq
  - zoxide
# Note: `yay` deliberately NOT here — AUR-only, pacman cannot install it.
# Bootstrapped manually once per node (makepkg). setup-node.sh Section 1 uses it for firmware AUR pkgs.
# Note: `taplo` (TOML lint) intentionally not on nodes — not in extra or AUR.
# Mac-only via Homebrew. Nodes have ~no TOML files; cost > benefit to track GH releases.
# Note: 2026-07-18 fleet-parity audit (immich-vm vs W1/W2) found 19 packages hand-installed on
# both workers but never declared. The repo-installable ones are now listed above. Deliberately
# still excluded:
#   flux-bin, viddy, zsh-you-should-use — AUR-only; this list is pacman-only by design.
#   packagekit, pkgstats, udisks2      — dependency leftovers on W1/W2, not deliberate installs.
# Node-local extras beyond this list are tolerated drift; the list is a floor, not a whitelist.

# Base rules common to all 3 nodes.
# Order preserved as UFW orders rules internally by insertion; module idempotency
# compares rule match (not comment), so minor comment drift is tolerated as no-op.
# Duplicate-looking entries (e.g. port 80 vs 80/tcp) are intentional — UFW treats
# them as distinct rules and live state has both.
ufw_rules_base:
  - { comment: "SSH from LAN", rule: allow, from_ip: 192.168.1.0/24, to_port: 65300, proto: tcp }
  - { comment: "K3s control-plane", rule: allow, from_ip: 192.168.1.127 }
  - { comment: "K3s worker-node", rule: allow, from_ip: 192.168.1.129 }
  - { comment: "K3s worker-node-2", rule: allow, from_ip: 192.168.1.126 }
  - { rule: allow, from_ip: 192.168.1.0/24, to_port: 80 }
  - { comment: "K3s pod network", rule: allow, from_ip: 10.42.0.0/16 }
  - { comment: "K3s service network", rule: allow, from_ip: 10.43.0.0/16 }
  - { comment: "Flannel VXLAN overlay", rule: allow, to_port: 8472, proto: udp }
  - { comment: "Kubelet API", rule: allow, to_port: 10250, proto: tcp }
  - { comment: "HTTP from LAN", rule: allow, from_ip: 192.168.1.0/24, to_port: 80, proto: tcp }
  - { comment: "HTTPS from LAN", rule: allow, from_ip: 192.168.1.0/24, to_port: 443, proto: tcp }
  - { rule: allow, from_ip: 10.42.0.0/16, to_port: 8000, proto: tcp }

# Base route rules common to all 3 nodes.
ufw_route_rules_base:
  - { comment: "K3s pod-to-pod traffic", rule: allow, from_ip: 10.42.0.0/16, to_ip: 10.42.0.0/16 }

# Per-group / per-host overrides (fill ufw_rules_group/host + ufw_route_rules_group/host).
ufw_rules_group: []
ufw_rules_host: []
ufw_route_rules_group: []
ufw_route_rules_host: []

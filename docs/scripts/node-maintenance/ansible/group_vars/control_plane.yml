---
# control_plane group overrides (CP = gmk-k3s-control-plane, 192.168.1.127).

# ---- K3s config (Step 5 — §A) ----
# Drift-alert only, no auto-restart. Restart via: sudo systemctl restart k3s.
k3s_default_storage_path: /mnt/k8s-storage
k3s_disable_helm_controller: true
k3s_disable:
  - traefik
k3s_node_taints:
  - "node-role.kubernetes.io/control-plane:NoSchedule"
k3s_node_labels:
  - "svccontroller.k3s.cattle.io/enablelb=false"
k3s_terminated_pod_gc_threshold: 20
k3s_secrets_encryption: true


# UFW rules specific to CP.
# Extras vs base: 6443 LAN dup, 9090 LAN (legacy Prometheus), 6443 anywhere
# (Kubernetes API server), 10.42.2.0/24 (W2 pod subnet — redundant vs base
# 10.42.0.0/16 but preserved as live state).
ufw_rules_group:
  - { rule: allow, from_ip: 192.168.1.0/24, to_port: 6443, proto: tcp }
  - { rule: allow, from_ip: 192.168.1.0/24, to_port: 9090, proto: tcp }
  - { comment: "K8s pod network worker-node-2", rule: allow, from_ip: 10.42.2.0/24 }
  - { comment: "Kubernetes API server", rule: allow, to_port: 6443, proto: tcp }

# UFW route rules specific to CP (pod-to-node + node-to-pod).
ufw_route_rules_group:
  - { comment: "K3s pod-to-node traffic (API server)", rule: allow, from_ip: 10.42.0.0/16, to_ip: 192.168.1.0/24 }
  - { comment: "K3s node-to-pod traffic", rule: allow, from_ip: 192.168.1.0/24, to_ip: 10.42.0.0/16 }

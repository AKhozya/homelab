---
# control_plane group overrides (CP = gmk-k3s-control-plane, 192.168.1.127).

# ---- K3s config (Step 5 — §A) ----
# Drift-alert only, no auto-restart. Restart via: sudo systemctl restart k3s.
k3s_default_storage_path: /mnt/k8s-storage
k3s_disable_helm_controller: true
k3s_disable:
  - traefik
  # coredns disabled: CoreDNS is self-managed via Flux (infrastructure/coredns/ — coredns-ha
  # Deployment + Flux-adopted kube-dns Service/CM/RBAC, commit ce8262f8). Activates on CP k3s
  # restart: k3s deletes the addon copies by owner-label, Flux recreates the Service (clusterIP
  # 10.43.0.10, freed by the delete) + CM, coredns-ha serves. Expect a MULTI-MINUTE cluster-wide DNS
  # gap during the CP reboot (Service absent until Flux reconciles after the apiserver is back).
  # Mitigations: `cache 30` in the Corefile serves stale answers; force `flux reconcile kustomization
  # coredns` as soon as the CP is back to cut the gap. See docs/plans/2026-05-31-reboot-wedge-prevention.md.
  - coredns
k3s_node_taints:
  - "node-role.kubernetes.io/control-plane:NoSchedule"
k3s_node_labels:
  - "svccontroller.k3s.cattle.io/enablelb=false"
k3s_terminated_pod_gc_threshold: 20
k3s_secrets_encryption: true

# CoreDNS HA: k3s ships CoreDNS as an Addon with replicas unset (defaults to 1 =
# single point of failure for cluster DNS). The k3s_config role inserts this into
# the addon source manifest (CP only). topologySpreadConstraints already in the
# shipped manifest spread the replicas across nodes.
coredns_replicas: 2

# kube-controller-manager node-lease tuning. Lockstep with kubelet
# nodeLeaseDurationSeconds=60 in roles/hardening/files/k3s-kubelet.yaml.
# Rule: grace_period >= lease_duration + one_renewal (60s + 15s = 75s).
# Bump rationale: tolerate brief network blips (UFW reload race during
# drift-heal, kube-proxy/flannel iptables churn). 2026-05-02 W2 NotReady
# incident motivated the change.
k3s_node_monitor_period: 5s
k3s_node_monitor_grace_period: 75s

# API-server cert SANs. Restart K3s after change to regenerate cert.
# Cert lifetime: K3s rotates internally, but SAN list is set once at install.
# This block makes SANs declarative; drift-heal alerts on diff.
k3s_tls_san:
  - 127.0.0.1
  - localhost
  - gmk-k3s-control-plane
  - 192.168.1.127


# UFW rules specific to CP.
# Extras vs base: 6443 LAN dup, 9090 LAN (legacy Prometheus), 6443 anywhere
# (Kubernetes API server), 10.42.2.0/24 (W2 pod subnet — redundant vs base
# 10.42.0.0/16 but preserved as live state).
ufw_rules_group:
  - { rule: allow, from_ip: 192.168.1.0/24, to_port: 6443, proto: tcp }
  - { rule: allow, from_ip: 192.168.1.0/24, to_port: 9090, proto: tcp }
  - { comment: "K8s pod network worker-node-2", rule: allow, from_ip: 10.42.2.0/24 }
  - { comment: "Kubernetes API server", rule: allow, to_port: 6443, proto: tcp }

# UFW route rules specific to CP (pod-to-node + node-to-pod).
ufw_route_rules_group:
  - { comment: "K3s pod-to-node traffic (API server)", rule: allow, from_ip: 10.42.0.0/16, to_ip: 192.168.1.0/24 }
  - { comment: "K3s node-to-pod traffic", rule: allow, from_ip: 192.168.1.0/24, to_ip: 10.42.0.0/16 }

[Journal]
# Cap systemd-journal disk usage. Default (Arch) = 10% of disk or 4G whichever smaller
# → workers hit ~480M organically without bound. With these caps journal stays
# under 500M AND logs >30d are pruned. Node-maintenance history for audit stays
# in Loki (F2 follow-up) with longer retention.
SystemMaxUse=500M
SystemKeepFree=2G
MaxRetentionSec=30d
MaxFileSec=1week
Compress=yes

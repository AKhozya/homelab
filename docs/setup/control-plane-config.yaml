# K3s Control Plane Configuration
# Location: /etc/rancher/k3s/config.yaml
#
# This file configures the K3s control plane node with custom settings.
# After modifying, restart K3s: sudo systemctl restart k3s

# Storage Configuration
# Use the 4.09TB LVM storage on worker node for all PVCs
default-local-storage-path: /mnt/k8s-storage

# Components
# Disable Helm controller (using Flux for GitOps instead)
disable-helm-controller: true

# Node Configuration
# Set explicit node name for the control plane
node-name: gmk-k3s-control-plane

# Prevent workload scheduling on control plane
# Only allow system pods (kube-system, flux-system, cert-manager, etc.)
node-taint:
  - "node-role.kubernetes.io/control-plane:NoSchedule"

# Node Labels
# Exclude control plane from ServiceLB (LoadBalancer) traffic
node-label:
  - "svccontroller.k3s.cattle.io/enablelb=false"

# Kubelet Configuration
# References external kubelet config file for eviction, log rotation, graceful shutdown
kubelet-arg:
  - "config=/etc/rancher/k3s/kubelet.yaml"

# Secrets Encryption
# Encrypts Kubernetes secrets at rest using AES-CBC
# Enable procedure: k3s secrets-encrypt enable → add this flag → restart → rotate-keys → restart
secrets-encryption: true

# K3s Worker Node Configuration
# Location: /etc/rancher/k3s/config.yaml
#
# This file configures the K3s worker node.
# After modifying, restart K3s: sudo systemctl restart k3s-agent

# Node Configuration
# Set explicit node name for the worker
node-name: worker-node

# Node Labels
# Enable worker node for ServiceLB (LoadBalancer) traffic
node-label:
  - "svccontroller.k3s.cattle.io/enablelb=true"

# Note: The K3s server URL and token are typically provided during installation
# and are stored in /etc/systemd/system/k3s-agent.service.env
# If you need to rejoin the cluster, use:
# curl -sfL https://get.k3s.io | K3S_URL=https://192.168.1.127:6443 K3S_TOKEN=<token> sh -

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pricebuddy-network-policy
  namespace: pricebuddy
spec:
  podSelector:
    matchLabels:
      app: pricebuddy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Internal access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 80
    # Uptime-kuma probes
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
      ports:
        - protocol: TCP
          port: 3306
    # Scraping external product pages
    - ports:
        - protocol: TCP
          port: 443

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pricebuddy-network-policy
  namespace: pricebuddy
spec:
  podSelector:
    matchLabels:
      app: pricebuddy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from traefik namespace for internal access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 80
    # Allow ingress from uptime-kuma for monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
      ports:
        - protocol: TCP
          port: 80
  egress:
    # Allow MySQL HAProxy access (Percona)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
      ports:
        - protocol: TCP
          port: 3306
    # Allow HTTPS for scraping external product pages (e-commerce sites use HTTPS)
    - ports:
        - protocol: TCP
          port: 443

apiVersion: v1
kind: ConfigMap
metadata:
  name: pricebuddy-apprise-init
  namespace: pricebuddy
data:
  # Script to generate Apprise config from Telegram secrets
  init.sh: |
    #!/bin/sh
    set -e

    echo "Generating Apprise configuration..."

    # Create config directory
    mkdir -p /config

    # Generate Apprise config file with Telegram URL
    # Token name: pricebuddy
    cat > /config/pricebuddy.cfg << EOF
    # PriceBuddy Telegram notifications via Apprise
    # Generated by init container
    tgram://${TELEGRAM_BOT_TOKEN}/${TELEGRAM_CHAT_ID}/
    EOF

    # Never echo the file — it embeds the bot token, and init-container stdout
    # is shipped to Loki (720h retention).
    echo "Apprise config created at /config/pricebuddy.cfg"

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pricebuddy-tls
  namespace: pricebuddy
spec:
  secretName: pricebuddy-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - pricebuddy.h0melab.work
  renewBefore: 720h  # 30 days
  duration: 2160h  # 90 days

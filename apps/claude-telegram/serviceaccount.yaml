apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-telegram
  namespace: claude-telegram
# Pod-level automountServiceAccountToken: true overrides this (deployment.yaml).
# SA-level default kept false so other hypothetical pods using this SA don't auto-mount.
automountServiceAccountToken: false
# Authenticated ghcr pull. The bot image is ~742MB; an anonymous pull of a fresh
# tag gets rate-limited by ghcr and can hang init for 20+ min (bit us on 1.27.16).
# read:packages-only PAT. The SA admission controller injects this into the pod.
imagePullSecrets:
  - name: claude-telegram-ghcr

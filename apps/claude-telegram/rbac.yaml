apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-telegram-ops
  labels:
    app: claude-telegram
# Cluster-wide READ, plus two low-damage cleanup verbs (`pods delete`, `replicasets delete`) —
# enough to restart a wedged workload without being able to rewrite what it runs.
# The verbs that amount to code execution are bound per namespace, never cluster-wide:
# `pods/exec` in `claude-telegram-exec`, Job creation in `claude-telegram-jobs`, both below.
# Workload patch is granted nowhere at all since 2026-08-06 — see that role's header.
#
# This split replaces the previous posture ("EFFECTIVE PRIVILEGE = CLUSTER-ADMIN-EQUIVALENT …
# treat a bot compromise as a cluster compromise", ultrareview 2026-07-03). Two findings on
# 2026-08-02 moved it:
#   - `patch` on the Flux CRDs was cluster-wide, and all 7 Kustomizations live in flux-system
#     alongside `sops-age`, the key that decrypts every SOPS secret in the repo. One patch
#     repointing a Kustomization's sourceRef/path makes kustomize-controller apply arbitrary
#     manifests. It also contradicted the old header, which named GitOps drift-heal as a real
#     control while leaving the bot able to suspend it. Flux is now read-only here.
#   - `pods/exec create` cluster-wide reached any pod's mounted Secrets and SA token, which made
#     the `secrets` exclusion below cosmetic rather than a boundary.
#
# Still NOT a hard boundary: the pod runs with BASH_SANDBOX_ENABLED=false and ships an
# authenticated `codex` binary configured `sandbox_mode = "danger-full-access"`, so anything
# reachable from this pod's own filesystem and network is reachable by an injected prompt. What
# this split bounds is reach into OTHER namespaces. See SECURITY.md in the bot repo.
rules:
  # Read core resources — secrets excluded.
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - configmaps
      - nodes
      - namespaces
      - events
      - persistentvolumeclaims
      - persistentvolumes
      - replicationcontrollers
      - serviceaccounts
      - limitranges
      - resourcequotas
    verbs: ["get", "list", "watch"]
  # Read apps/batch/networking (no secrets in these API groups)
  - apiGroups: ["apps", "batch", "networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Flux: READ ONLY. `patch` is what `flux reconcile` needs, and it is also what repoints a
  # Kustomization at arbitrary manifests — RBAC cannot restrict patch to one annotation. Forcing a
  # reconcile is a release-time action from a workstation, not phone-driven alert triage; the
  # controllers reconcile on their own interval regardless.
  - apiGroups:
      ["kustomize.toolkit.fluxcd.io", "helm.toolkit.fluxcd.io", "source.toolkit.fluxcd.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Deleting a pod is the commonest "fix a stuck app" action and the least damaging: a Deployment,
  # StatefulSet or operator recreates it from the spec in git. Left cluster-wide deliberately.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["delete"]
  # CNPG + Percona (database status)
  - apiGroups: ["postgresql.cnpg.io", "pxc.percona.com", "ps.percona.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Monitoring (VictoriaMetrics + Prometheus CRDs — dry-run + status)
  - apiGroups: ["operator.victoriametrics.com", "monitoring.coreos.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Cert-manager (dry-run certificates/issuers)
  - apiGroups: ["cert-manager.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Traefik CRDs (dry-run middleware/ingressroute)
  - apiGroups: ["traefik.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Flux notifications (dry-run alert/provider)
  - apiGroups: ["notification.toolkit.fluxcd.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Redis operator (dry-run redis CR)
  - apiGroups: ["redis.redis.opstreelabs.in"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Kyverno policies + reports (read-only)
  - apiGroups: ["kyverno.io", "policies.kyverno.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["policyreports", "clusterpolicyreports"]
    verbs: ["get", "list", "delete"]
  # Scheduling + policy (dry-run PriorityClass, PDB)
  - apiGroups: ["scheduling.k8s.io", "policy"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # RBAC (dry-run own role changes)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Events API (kubectl events)
  - apiGroups: ["events.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Kyverno background scan reports
  - apiGroups: ["reports.kyverno.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Storage (StorageClass, CSI)
  - apiGroups: ["storage.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Autoscaling (HPA — future-proofing)
  - apiGroups: ["autoscaling"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # MySQL InnoDB operator CRDs
  - apiGroups: ["mysql.oracle.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # `kubectl top` — the metrics API is a separate aggregated APIService, so the core-group `nodes`
  # and `pods` read above does NOT cover it. Without this the bot reports "RBAC blocks kubectl top"
  # and falls back to hand-rolled VictoriaMetrics queries for what is a one-line command.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # Kyverno/webhook diagnostics — reading webhook configs is how an admission rejection gets traced
  # to the policy that caused it.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-telegram-ops
  labels:
    app: claude-telegram
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-telegram-ops
subjects:
  - kind: ServiceAccount
    name: claude-telegram
    namespace: claude-telegram
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-telegram-exec
  labels:
    app: claude-telegram
# `kubectl exec` is code execution by another name. Defined once as a ClusterRole, then bound with
# a RoleBinding per namespace below — a ClusterRoleBinding here would restore exactly what this
# change removes.
#
# Two verbs that used to sit in this role are gone (2026-08-06):
#   apps patch   RBAC cannot express "only the restartedAt annotation", so the grant was really
#                "rewrite the whole pod template" — command, image, serviceAccountName, mounts.
#                That reaches the init container which sanitizes this bot's own git config, i.e.
#                the control was patchable by the thing it constrains. Flux reverts within its 1m
#                interval, which bounds the spec's lifetime but not what ran in the meantime.
#                30 days of bot transcripts contain zero `rollout restart` calls. The dotfiles
#                skills DO prescribe it in 32 places, so those bot-facing paths must move to
#                `kubectl delete pod` — which claude-telegram-ops grants cluster-wide and which
#                restarts a Deployment-managed pod without rewriting what it runs.
#   batch jobs   moved to claude-telegram-jobs below, bound only in popeye — the one workflow the
#                rule was ever written for. A Job creates a fresh Pod with any ServiceAccount and
#                any mounts, so leaving it bound everywhere made the apps-patch removal pointless.
#
# Namespaces deliberately WITHOUT these bindings, and why:
#   claude-telegram     its own namespace — self-restart kills the session, and exec into itself is
#                       meaningless from inside the pod
#   kube-system         cluster control plane
#   flux-system         sops-age (decrypts every secret in the repo) + the git deploy key
#   kyverno             exec into it reaches the admission controller's own process
#   cert-manager        TLS private keys
#   cloudflare-tunnel   the tunnel credential, i.e. the public ingress path
#   authentik           SSO — owning it means owning everything behind it
#   databases           Postgres/CouchDB data and credentials
#   percona-mysql       MySQL data and credentials
#   obsidian            CouchDB data (LiveSync)
#   traefik             the ingress controller; exec into it reaches everything routed through
#                       ingress, plus its mounted TLS credentials
# The bot keeps full READ on all of them, plus `pods delete`, so alert triage still works there —
# it just cannot execute inside them. Add a binding back if a real workflow needs it; that is a
# one-line change and a deliberate one.
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-telegram-jobs
  labels:
    app: claude-telegram
# Manual Popeye scans, and nothing else — bound in `popeye` alone. Not backups: every backup
# CronJob lives in databases, backup-replication or kube-system, none of which is bound.
# Creating a Job is creating a Pod, so this is the same class of grant as exec: it picks its own
# ServiceAccount and mounts. Kept separate from claude-telegram-exec precisely so widening the
# namespace list is a deliberate edit rather than a side effect of wanting exec somewhere.
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete"]

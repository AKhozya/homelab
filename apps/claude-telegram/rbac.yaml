apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-telegram-ops
  labels:
    app: claude-telegram
# Cluster-wide READ (core resources EXCEPT secrets) + limited write (flux patch, pod exec,
# rollout restart, job create). Required for ops via Telegram. Destructive operations
# (delete namespace, modify RBAC/secrets/NetworkPolicies) are NOT permitted — those
# go through GitOps. Mitigations: Telegram allowlist, safety hook, permission relay.
rules:
  # Read core resources — secrets DELIBERATELY EXCLUDED (UR2 P3-7): an ops/diagnostics bot must not
  # be able to read every secret in the cluster. The old resources:["*"] in the core group granted that.
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - configmaps
      - nodes
      - namespaces
      - events
      - persistentvolumeclaims
      - persistentvolumes
      - replicationcontrollers
      - serviceaccounts
      - limitranges
      - resourcequotas
    verbs: ["get", "list", "watch"]
  # Read apps/batch/networking (no secrets in these API groups)
  - apiGroups: ["apps", "batch", "networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Flux operations (reconcile = patch)
  - apiGroups: ["kustomize.toolkit.fluxcd.io", "helm.toolkit.fluxcd.io", "source.toolkit.fluxcd.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "patch"]
  # Pod logs
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Pod exec (kubectl exec diagnostics)
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Rollout restart (patch deployments/statefulsets/daemonsets)
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["patch"]
  # Jobs (manual Popeye scans, backup triggers)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete"]
  # Cleanup completed pods and stale replicasets
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["delete"]
  # CNPG + Percona (database status)
  - apiGroups: ["postgresql.cnpg.io", "pxc.percona.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Kyverno policies + reports (read-only)
  - apiGroups: ["kyverno.io"]
    resources: ["clusterpolicies", "policies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["policyreports", "clusterpolicyreports"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-telegram-ops
  labels:
    app: claude-telegram
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-telegram-ops
subjects:
  - kind: ServiceAccount
    name: claude-telegram
    namespace: claude-telegram

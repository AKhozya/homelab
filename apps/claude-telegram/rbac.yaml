apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-telegram-ops
  labels:
    app: claude-telegram
# EFFECTIVE PRIVILEGE = CLUSTER-ADMIN-EQUIVALENT. The `secrets` exclusion below is defence-in-depth,
# NOT a security boundary: cluster-wide `pods/exec create` lets this bot exec into any pod (e.g. a
# flux-system controller) and read that pod's ServiceAccount token, and cluster-wide `deployments patch`
# lets it alter privileged workloads — either path reaches full cluster control. Treat a bot compromise
# as a cluster compromise. Real controls: Telegram sender allowlist, the safety hook, image supply chain
# (SHA-pinned build + SOPS), and GitOps drift-heal reverting out-of-band changes. Do NOT rely on the
# secrets exclusion to bound blast radius. (Ultrareview 2026-07-03; supersedes the UR2 P3-7 framing.)
rules:
  # Read core resources — secrets excluded so casual `get secret` fails, but see the header: exec+patch
  # make this cosmetic, not a boundary. The old resources:["*"] in the core group also granted secrets.
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - configmaps
      - nodes
      - namespaces
      - events
      - persistentvolumeclaims
      - persistentvolumes
      - replicationcontrollers
      - serviceaccounts
      - limitranges
      - resourcequotas
    verbs: ["get", "list", "watch"]
  # Read apps/batch/networking (no secrets in these API groups)
  - apiGroups: ["apps", "batch", "networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Flux operations (reconcile = patch)
  - apiGroups: ["kustomize.toolkit.fluxcd.io", "helm.toolkit.fluxcd.io", "source.toolkit.fluxcd.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "patch"]
  # Pod logs
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Pod exec (kubectl exec diagnostics)
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Rollout restart (patch deployments/statefulsets/daemonsets)
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["patch"]
  # Jobs (manual Popeye scans, backup triggers)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete"]
  # Cleanup completed pods and stale replicasets
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["delete"]
  # CNPG + Percona (database status)
  - apiGroups: ["postgresql.cnpg.io", "pxc.percona.com", "ps.percona.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Monitoring (VictoriaMetrics + Prometheus CRDs — dry-run + status)
  - apiGroups: ["operator.victoriametrics.com", "monitoring.coreos.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Cert-manager (dry-run certificates/issuers)
  - apiGroups: ["cert-manager.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Traefik CRDs (dry-run middleware/ingressroute)
  - apiGroups: ["traefik.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Flux notifications (dry-run alert/provider)
  - apiGroups: ["notification.toolkit.fluxcd.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Redis operator (dry-run redis CR)
  - apiGroups: ["redis.redis.opstreelabs.in"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Kyverno policies + reports (read-only)
  - apiGroups: ["kyverno.io", "policies.kyverno.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["policyreports", "clusterpolicyreports"]
    verbs: ["get", "list", "delete"]
  # Scheduling + policy (dry-run PriorityClass, PDB)
  - apiGroups: ["scheduling.k8s.io", "policy"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # RBAC (dry-run own role changes)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Events API (kubectl events)
  - apiGroups: ["events.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Kyverno background scan reports
  - apiGroups: ["reports.kyverno.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Storage (StorageClass, CSI)
  - apiGroups: ["storage.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Autoscaling (HPA — future-proofing)
  - apiGroups: ["autoscaling"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # MySQL InnoDB operator CRDs
  - apiGroups: ["mysql.oracle.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-telegram-ops
  labels:
    app: claude-telegram
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-telegram-ops
subjects:
  - kind: ServiceAccount
    name: claude-telegram
    namespace: claude-telegram

apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-telegram
  namespace: claude-telegram
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: claude-telegram
  template:
    metadata:
      labels:
        app: claude-telegram
    spec:
      serviceAccountName: claude-telegram
      automountServiceAccountToken: true
      priorityClassName: homelab-standard
      hostAliases:
        - ip: "192.168.1.127"
          hostnames: ["gmk-k3s-control-plane", "master-node"]
        - ip: "192.168.1.129"
          hostnames: ["worker-node"]
        - ip: "192.168.1.126"
          hostnames: ["worker-node-2"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: chezmoi-init
          image: ghcr.io/akhozya/claude-telegram-bot:1.27.1
          command:
            - /bin/bash
            - -c
            - |
              set -e
              export HOME=/home/akhozya

              # Copy SSH keys from Secret staging mount to writable PVC
              # (Secret mounts are read-only; SSH needs writable known_hosts)
              rm -rf ~/.ssh
              install -d -m 700 ~/.ssh
              cp /etc/ssh-keys/* ~/.ssh/
              chmod 600 ~/.ssh/id_ed25519 ~/.ssh/config
              chmod 644 ~/.ssh/id_ed25519.pub ~/.ssh/known_hosts 2>/dev/null || true

              # Scan node SSH fingerprints into writable known_hosts
              echo "Scanning node SSH fingerprints..."
              ssh-keyscan -p 65300 gmk-k3s-control-plane worker-node worker-node-2 >> ~/.ssh/known_hosts 2>/dev/null || true

              # Setup chezmoi config
              mkdir -p ~/.config/chezmoi
              cp /etc/chezmoi-config/chezmoi.toml ~/.config/chezmoi/chezmoi.toml

              # Clone or update dotfiles
              if [ -d ~/.local/share/chezmoi/.git ]; then
                echo "Dotfiles exist, syncing (hard reset — survives force-push/rewrite)..."
                git -C ~/.local/share/chezmoi fetch --quiet || true
                git -C ~/.local/share/chezmoi reset --hard "@{u}" || true
              else
                echo "Cloning dotfiles..."
                git clone git@github.com:AKhozya/dotfiles.git ~/.local/share/chezmoi
              fi

              # Apply chezmoi (.chezmoiignore handles .ssh exclusion)
              chezmoi apply --force --no-tty || true

              # Refresh plugins (PVC-cached; .chezmoiignore excludes them, seeded-once -> stale).
              # Guarded so any marketplace/plugin hiccup never wedges bot init. node (not jq) parses keys.
              CC="npx --yes @anthropic-ai/claude-code"
              $CC plugin marketplace update 2>&1 | tail -3 || true
              for p in $(node -e 'try{process.stdout.write(Object.keys(require(`${process.env.HOME}/.claude/plugins/installed_plugins.json`).plugins).join("\n"))}catch(e){}' 2>/dev/null || true); do
                $CC plugin update "$p" 2>&1 | tail -1 || true
              done
              # ponytail for the monthly-audit over-engineering lens (install if absent)
              $CC plugin marketplace add DietrichGebert/ponytail 2>&1 | tail -2 || true
              $CC plugin install ponytail@ponytail 2>&1 | tail -2 || true

              # Fix CLAUDE_PLUGIN_ROOT paths for this environment
              for f in ~/.claude/plugins/cache/*/*/hooks/hooks.json; do
                [ -f "$f" ] || continue
                plugin_root="$(cd "$(dirname "$f")/.." && pwd)"
                sed -i "s|\${CLAUDE_PLUGIN_ROOT}|$plugin_root|g" "$f" 2>/dev/null
              done

              # Clone or update homelab repo
              if [ -d ~/source-code/homelab/.git ]; then
                echo "Homelab repo exists, syncing to origin/main (hard reset — survives force-push/rewrite)..."
                git -C ~/source-code/homelab fetch --quiet origin main || true
                git -C ~/source-code/homelab reset --hard origin/main || true
              else
                echo "Cloning homelab repo..."
                mkdir -p ~/source-code
                git clone git@github.com:AKhozya/homelab.git ~/source-code/homelab
              fi

              # Create data dir for session persistence
              mkdir -p ~/data

              # CLI + SDK pinned at image build (bi-weekly GHA rebuild Mon+Thu 23:00 UTC).
              # Runtime self-update removed — /app is image-baked, updates didn't persist
              # to main container. Renovate bumps image tag in deployment.yaml.
              CLI=$(npx @anthropic-ai/claude-code --version 2>/dev/null || echo "unknown")
              SDK=$(node -e "console.log(require('/app/node_modules/@anthropic-ai/claude-agent-sdk/package.json').version)" 2>/dev/null || echo "unknown")

              MSG=$(printf '## 🤖 Claude Bot Restarted\n\n| Component | Version |\n|---|---|\n| CLI | `%s` |\n| SDK | `%s` |' "$CLI" "$SDK")

              if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
                # Bot API 10.1 rich message (Markdown). node fetch has the keys via env to dodge quoting.
                TG_TOKEN="$TELEGRAM_BOT_TOKEN" TG_CHAT="$TELEGRAM_CHAT_ID" TG_MSG="$MSG" \
                  node -e 'fetch(`https://api.telegram.org/bot${process.env.TG_TOKEN}/sendRichMessage`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({chat_id:process.env.TG_CHAT,rich_message:{markdown:process.env.TG_MSG,skip_entity_detection:true}}),signal:AbortSignal.timeout(8000)}).then(r=>r.text()).catch(()=>{})' \
                  >/dev/null 2>&1 || true
              fi

              echo "Init complete."
          env:
            - name: HOME
              value: /home/akhozya
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-telegram-env
                  key: telegram-bot-token
            - name: TELEGRAM_CHAT_ID
              value: "113452686"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: home
              mountPath: /home/akhozya
            - name: ssh-keys
              mountPath: /etc/ssh-keys
              readOnly: true
            - name: chezmoi-config
              mountPath: /etc/chezmoi-config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: claude-telegram
          image: ghcr.io/akhozya/claude-telegram-bot:1.27.1
          env:
            - name: HOME
              value: /home/akhozya
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-telegram-env
                  key: claude-oauth-token
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-telegram-env
                  key: telegram-bot-token
            - name: TELEGRAM_ALLOWED_USERS
              value: "113452686"
            - name: CLAUDE_WORKING_DIR
              value: /home/akhozya/source-code/homelab
            - name: ALLOWED_PATHS
              value: "/home/akhozya"
            - name: SESSION_FILE_PATH
              value: /home/akhozya/data/session.json
            - name: RESTART_FILE_PATH
              value: /home/akhozya/data/restart.json
            - name: AUDIT_LOG_PATH
              value: /home/akhozya/data/audit.log
            - name: CLAUDE_CODE_DEFAULT_MODEL
              value: "claude-opus-4-7"
            - name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
              value: "1"
            - name: DISABLE_AUTO_UPDATES
              value: "1"
            - name: TRIGGER_SECRET
              valueFrom:
                secretKeyRef:
                  name: claude-telegram-env
                  key: trigger-secret
            - name: TRIGGER_HOST
              value: "127.0.0.1"
            - name: TRIGGER_PORT
              value: "8080"
          ports:
            - name: trigger
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "bun"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          # Trigger server binds 127.0.0.1 — exec probe required (kubelet can't reach localhost)
          readinessProbe:
            exec:
              command: ["curl", "-sf", "--max-time", "2", "http://127.0.0.1:8080/healthz"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: home
              mountPath: /home/akhozya
            - name: tmp
              mountPath: /tmp
        - name: sync
          image: ghcr.io/akhozya/claude-telegram-bot:1.27.1
          command:
            - /bin/bash
            - -c
            - |
              export HOME=/home/akhozya
              echo "Sync sidecar started (30m interval)"

              run_pull() {
                local label="$1" dir="$2"
                local before after
                before=$(git -C "$dir" rev-parse HEAD 2>/dev/null || echo "?")
                if ! git -C "$dir" fetch --quiet 2>&1; then
                  echo "[$label] FETCH FAILED"
                  return 1
                fi
                after=$(git -C "$dir" rev-parse "@{u}" 2>/dev/null || echo "?")
                if [ "$before" = "$after" ]; then
                  echo "[$label] up-to-date $after"
                  return 0
                fi
                # upstream moved (incl. force-push / history rewrite -> non-ff). Hard-reset
                # ONLY when the tree is clean, so in-flight bot work is never clobbered.
                if [ -n "$(git -C "$dir" status --porcelain 2>/dev/null)" ]; then
                  echo "[$label] upstream moved $before -> $after but tree DIRTY — skip reset (in-flight work)"
                  return 0
                fi
                if git -C "$dir" reset --hard "@{u}" --quiet; then
                  echo "[$label] reset $before -> $after"
                else
                  echo "[$label] RESET FAILED"
                fi
                return 0
              }

              while true; do
                sleep 1800
                echo "--- Sync $(date -Iseconds) ---"
                run_pull chezmoi ~/.local/share/chezmoi || true
                chezmoi apply --force --no-tty 2>&1 || echo "[chezmoi] apply FAILED"
                for f in ~/.claude/plugins/cache/*/*/hooks/hooks.json; do
                  [ -f "$f" ] || continue
                  plugin_root="$(cd "$(dirname "$f")/.." && pwd)"
                  sed -i "s|\${CLAUDE_PLUGIN_ROOT}|$plugin_root|g" "$f" 2>/dev/null
                done
                run_pull homelab ~/source-code/homelab || true
                echo "Sync done"
              done
          env:
            - name: HOME
              value: /home/akhozya
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: home
              mountPath: /home/akhozya
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: claude-telegram-home-pvc
        - name: ssh-keys
          secret:
            secretName: claude-telegram-ssh
            defaultMode: 0600
        - name: chezmoi-config
          secret:
            secretName: claude-telegram-chezmoi
        - name: tmp
          emptyDir: {}

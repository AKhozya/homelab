apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-telegram
  namespace: claude-telegram
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: claude-telegram
  template:
    metadata:
      labels:
        app: claude-telegram
    spec:
      serviceAccountName: claude-telegram
      # Bot uses kubectl for cluster diagnostics. Cluster-wide READ via claude-telegram-ops; the
      # write-ish verbs are scoped per namespace — see the rbac.yaml header for the full list and
      # the reason behind each exclusion.
      # Blast radius, stated honestly: `pods/exec` in 14 namespaces is still code execution inside
      # those pods, and that is the ceiling. It is no longer cluster-admin-equivalent — node SSH
      # runs under the agent-diag forced command (read-only diagnostics, path-allowlisted), the
      # bot holds no exec or Job binding in its own namespace (cluster-wide READ still applies
      # there via claude-telegram-ops), and Job creation is popeye-only.
      automountServiceAccountToken: true
      priorityClassName: homelab-standard
      hostAliases:
        - ip: "192.168.1.127"
          hostnames: ["gmk-k3s-control-plane", "master-node"]
        - ip: "192.168.1.129"
          hostnames: ["worker-node"]
        - ip: "192.168.1.126"
          hostnames: ["worker-node-2"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: chezmoi-init
          image: ghcr.io/akhozya/claude-telegram-bot:1.32.1
          command:
            - /bin/bash
            - -c
            - |
              set -e
              export HOME=/home/akhozya

              # Repo metadata is a code-execution surface nothing else heals. Every key below names
              # a program git runs, or points at another config that can; .git/info/attributes is
              # what arms a filter driver, and a hook may be a symlink (hence `! -type d`, not
              # `-type f`). The sync sidecar calls `git status` in both checkouts every 30 min, so
              # a planted value executes on a timer. A hard reset never touches .git/config,
              # .git/hooks or .git/info, and chezmoi manages none of them on Linux — nothing else
              # here removes them. Must run before any other git command; `git config` does not
              # refresh the index, so it cannot fire fsmonitor itself. Matched by regex rather than
              # a fixed key list because includeIf/filter/diff/merge keys carry a caller-chosen
              # subsection name.
              # The pattern itself lives in the claude-telegram-git-exec ConfigMap so that this
              # container and the sync sidecar use the identical one; see that file for what is in
              # it and why. Guarded, never defaulted: an empty pattern makes every sweep below
              # match nothing and report success, which is the exact failure this block exists to
              # prevent.
              [ -n "${GIT_EXEC_RE:-}" ] || { echo "FATAL: GIT_EXEC_RE empty or unset" >&2; exit 1; }
              # Per FILE, not per scope: `--global` reads ~/.gitconfig AND ~/.config/git/config but
              # writes only one, so a key planted in the other survives a --global --unset-all.
              # Same for worktree scope, which --local does not reach.
              # Fail CLOSED at both ends — a sweep that silently removes nothing is worse than none.
              # An unparseable file aborts init, and so does a failed unset: a planted config.lock
              # makes every write fail, which a `|| true` would hide while the key stays live.
              # The loop reads from a process substitution, not a pipe, so `exit` leaves the script
              # rather than a subshell.
              scrub_git_config() {
                [ -f "$1" ] || return 0
                local keys k
                keys=$(git config --file "$1" --name-only --list) || { echo "FATAL: git config read failed while scrubbing $1 — see git error above for the offending file" >&2; exit 1; }
                while IFS= read -r k; do
                  [ -n "$k" ] || continue
                  git config --file "$1" --unset-all "$k" || { echo "FATAL: cannot unset $k in $1" >&2; exit 1; }
                done < <(printf '%s\n' "$keys" | grep -iE "$GIT_EXEC_RE" | sort -u)
              }
              rm -f ~/.gitconfig.lock ~/.config/git/config.lock
              scrub_git_config ~/.gitconfig
              scrub_git_config ~/.config/git/config
              for r in ~/.local/share/chezmoi ~/source-code/homelab ~/source-code/claude-telegram-bot; do
                [ -d "$r/.git" ] || continue
                # Nothing else holds these repos at init — the bot and the sync sidecar start after
                # this container exits — so any lock here is stale, or planted to block the sweep.
                rm -f "$r/.git/config.lock" "$r/.git/config.worktree.lock" "$r"/.git/worktrees/*/config.worktree.lock
                for c in "$r/.git/config" "$r"/.git/config.worktree "$r"/.git/worktrees/*/config.worktree; do
                  scrub_git_config "$c"
                done
                # The whole directory, not its contents: removing it needs write permission on
                # .git rather than on hooks/, so it still succeeds when an attacker has chmodded
                # hooks/ shut — and fails loudly (set -e) when .git itself is blocked. Verified
                # both ways in-pod. git needs no hooks directory; the .sample files go with it.
                rm -rf "$r/.git/hooks"
                rm -rf "$r/.git/info/attributes" # -rf: a directory planted here would fail rm -f and abort init
              done

              # Remotes are drift-healed here rather than left to whatever a clone or a hand edit
              # set, because init only clones when a checkout is ABSENT — an existing PVC checkout
              # would otherwise keep its old remote for ever.
              #
              # This runs BEFORE the first fetch, not after it. A remote URL is PVC state the
              # sweep above cannot judge: it is not a program name, so stripping it by regex would
              # take the legitimate one with it. Fetching first would mean fetching from whatever
              # the URL happens to say, and the run_* scripts in an attacker's repo are TRACKED —
              # past the reset, past the clean, straight into `chezmoi apply`.
              #
              # The aliases are per-repo deploy keys (ssh config lives in the secret); only
              # gh-homelab carries write. Roll back by pointing these AND the two clone URLs below
              # back at git@github.com: — a plain revert would strip the aliases from the ssh config
              # while the checkouts still referenced them, breaking every fetch.
              set_remote() {
                [ -d "$1/.git" ] || return 0   # the fork checkout is unmanaged PVC state, may be absent
                git -C "$1" remote set-url origin "$2"
              }
              set_remote ~/source-code/homelab             git@gh-homelab:AKhozya/homelab.git
              set_remote ~/.local/share/chezmoi            git@gh-dotfiles:AKhozya/dotfiles.git
              set_remote ~/source-code/claude-telegram-bot git@gh-fork:AKhozya/claude-telegram-bot.git

              # Secret mounts are read-only; SSH needs writable known_hosts — stage keys onto PVC
              rm -rf ~/.ssh
              install -d -m 700 ~/.ssh
              cp /etc/ssh-keys/* ~/.ssh/
              chmod 600 ~/.ssh/id_ed25519 ~/.ssh/config
              chmod 600 ~/.ssh/gh-homelab ~/.ssh/gh-dotfiles ~/.ssh/gh-fork
              chmod 644 ~/.ssh/id_ed25519.pub ~/.ssh/known_hosts 2>/dev/null || true

              echo "Scanning node SSH fingerprints..."
              ssh-keyscan -p 65300 gmk-k3s-control-plane worker-node worker-node-2 >> ~/.ssh/known_hosts 2>/dev/null || true

              mkdir -p ~/.config/chezmoi
              cp /etc/chezmoi-config/chezmoi.toml ~/.config/chezmoi/chezmoi.toml

              # Never a bare `fetch`, never `@{u}`: both resolve through branch.<name>.remote and
              # branch.<name>.merge, which are ordinary config no regex can strip without breaking
              # the legitimate case. Pointing branch.master.remote at a second, attacker-added
              # remote redirects the fetch even though origin itself is pinned — and the run_*
              # scripts in that repo would be TRACKED, so neither the reset nor the clean below
              # touches them.
              # The refspec carries an explicit DESTINATION for the same reason. A source-only
              # `fetch origin master` leaves the remote-tracking ref to remote.origin.fetch, so
              # tampering with that mapping lets a pre-forged refs/remotes/origin/master survive
              # the fetch and be exactly what the reset below lands on. Spelling the destination
              # out overrides the config. The dotfiles repo is on master, not main.
              dotfiles_synced=0
              if [ -d ~/.local/share/chezmoi/.git ]; then
                echo "Dotfiles exist, syncing (hard reset — survives force-push/rewrite)..."
                if git -C ~/.local/share/chezmoi fetch --quiet origin '+refs/heads/master:refs/remotes/origin/master' &&
                   git -C ~/.local/share/chezmoi reset --hard origin/master; then
                  dotfiles_synced=1
                else
                  echo "WARN: dotfiles fetch/reset failed — skipping chezmoi apply, source is whatever the PVC holds" >&2
                fi
                # chezmoi's source state is the DIRECTORY, not the git index, so `chezmoi apply`
                # executes any run_* script sitting here whether or not git tracks it — and a hard
                # reset leaves untracked files by definition. -x as well: .gitignore already covers
                # names an attacker could pick (*.local, *secret*.txt). Not `|| true` — this is
                # local, so a failure means something is holding the tree, which is the case the
                # sweep exists for.
                git -C ~/.local/share/chezmoi clean -ffdx
              else
                echo "Cloning dotfiles..."
                git clone git@gh-dotfiles:AKhozya/dotfiles.git ~/.local/share/chezmoi
                dotfiles_synced=1
              fi

              # .chezmoiignore excludes .ssh
              if [ "$dotfiles_synced" = 1 ]; then
                chezmoi apply --force --no-tty || true
              else
                echo "Skipping chezmoi apply — the source was not verified against origin/master" >&2
              fi

              # dot_gitconfig.tmpl is not ignored on linux, so the apply above puts back every key
              # class the sweep removed — aliases, the lfs filter trio, core.editor/pager. Without
              # this second pass the sweep would be undone inside the same init, which is worse
              # than not sweeping: the guarantee reads as held. Nothing here needs those keys —
              # no .gitattributes in either checkout uses lfs, and there is no tty.
              scrub_git_config ~/.gitconfig
              scrub_git_config ~/.config/git/config

              # The hook scripts now ship in the image, where the read-only rootfs puts them
              # beyond anything the model runs. Assert before rewiring: without this a
              # packaging slip would delete the PVC copies below and leave nothing behind.
              for h in validate-safe-bash.sh flux-push-reminder.sh session-pull.sh context-mode-cache-heal.mjs; do
                [ -x "/app/hooks/$h" ] || { echo "FATAL: /app/hooks/$h missing or not executable" >&2; exit 1; }
              done

              # ~/.claude/settings.json is .chezmoiignore'd on linux (it carries macOS /Users paths),
              # so chezmoi never sets model/effort here — the PVC copy would drift forever otherwise.
              # ANTHROPIC_MODEL below also pins the model; this keeps the file honest if that env is lost.
              # Unguarded on purpose, unlike the || true below: only ENOENT is tolerated, so malformed
              # JSON aborts init rather than rewriting the PVC-only file (not in git) down to three keys.
              # hooks is REPLACED, never merged — a merge would keep an injected entry forever. The
              # Bash denylist is deliberately absent: SAFETY_HOOK runs it from bot code instead, so
              # deleting this key cannot disarm it. What is left denies nothing.
              # Temp file plus rename because an interrupted write leaves malformed JSON, which the
              # throw above then turns into a pod that never starts.
              # PARSEABLE is not the same as USABLE: `[]`, `5`, `"oops"` and `true` all parse, and
              # assigning a property to a primitive is a silent no-op in sloppy mode while
              # JSON.stringify drops properties added to an array — so each one wrote the junk back
              # with no hooks and exit 0. Anything that is not a plain object is discarded.
              node -e 'const fs=require("fs"),d=process.env.HOME+"/.claude",p=d+"/settings.json";let s={};try{s=JSON.parse(fs.readFileSync(p,"utf8"))}catch(e){if(e.code!=="ENOENT")throw e}if(typeof s!=="object"||s===null||Array.isArray(s))s={};s.model="claude-opus-5";s.effortLevel="xhigh";s.hooks={PostToolUse:[{matcher:"Bash",hooks:[{type:"command",command:"/app/hooks/flux-push-reminder.sh"}]}],SessionStart:[{hooks:[{type:"command",command:"/app/hooks/session-pull.sh"}]},{hooks:[{type:"command",command:"/app/hooks/context-mode-cache-heal.mjs"}]}]};fs.mkdirSync(d,{recursive:true});fs.writeFileSync(p+".tmp",JSON.stringify(s,null,2)+"\n");fs.renameSync(p+".tmp",p)'

              # Nothing references the PVC copies now. Left in place they invite an edit that
              # silently does nothing, and they stay writable while the image copies do not.
              rm -rf ~/.claude/hooks

              # Reconcile bot plugin state to the chezmoi SOURCE (fresh from git), NOT ~/.claude/plugins:
              # that tree is .chezmoiignore'd on linux, so the PVC seed never self-updates. PRUNE what
              # source no longer declares (handles renames like everything-claude-code -> ecc, whose stale
              # entry shadows the new name and blocks its install), THEN add marketplaces + install keys.
              # Guarded so any marketplace/plugin hiccup never wedges bot init. node (not jq) parses JSON.
              # CC = SDK-vendored engine binary; npx and image npm-global both resolve stale/PVC-shadowed copies.
              #
              # Gated on dotfiles_synced for the same reason `chezmoi apply` is: this reads
              # known_marketplaces.json and installed_plugins.json out of the same source tree and
              # turns them into `marketplace add` and `plugin install`, which fetch and run code.
              # Those files are TRACKED, so an unverified checkout keeps a tampered copy through
              # the clean — skipping the apply while still installing from it would close one door
              # and leave the other open.
              if [ "$dotfiles_synced" = 1 ]; then
                CC=/app/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64-musl/claude
                [ -x "$CC" ] || echo "WARN: vendored claude binary missing at $CC — plugin sync will no-op"
                export SRC="$HOME/.local/share/chezmoi/dot_claude/private_plugins"
                # Prune plugins, then marketplaces, not present in source (plugins first so marketplace removal isn't blocked).
                keepP=$(node -e 'const p=require(process.env.SRC+"/installed_plugins.json").plugins;console.log(Object.keys(p).join(" "))' 2>/dev/null || true)
                if [ -n "$keepP" ]; then for k in $(node -e 'try{const p=require(process.env.HOME+"/.claude/plugins/installed_plugins.json").plugins;console.log(Object.keys(p).join("\n"))}catch(e){}' 2>/dev/null || true); do
                  case " $keepP " in *" $k "*) : ;; *) $CC plugin uninstall "$k" 2>&1 | tail -1 || true ;; esac
                done; fi
                keepM=$(node -e 'const m=require(process.env.SRC+"/known_marketplaces.json");console.log(Object.keys(m.marketplaces||m).join(" "))' 2>/dev/null || true)
                if [ -n "$keepM" ]; then for mp in $(node -e 'try{const m=require(process.env.HOME+"/.claude/plugins/known_marketplaces.json");console.log(Object.keys(m.marketplaces||m).join("\n"))}catch(e){}' 2>/dev/null || true); do
                  case " $keepM " in *" $mp "*) : ;; *) $CC plugin marketplace remove "$mp" 2>&1 | tail -1 || true ;; esac
                done; fi
                for repo in $(node -e 'const m=require(process.env.SRC+"/known_marketplaces.json");const o=m.marketplaces||m;for(const v of Object.values(o)){const r=v&&(v.repo||(v.source&&v.source.repo));if(r)console.log(r)}' 2>/dev/null || true); do
                  $CC plugin marketplace add "$repo" 2>&1 | tail -1 || true
                done
                $CC plugin marketplace update 2>&1 | tail -1 || true
                for key in $(node -e 'const p=require(process.env.SRC+"/installed_plugins.json").plugins;for(const k of Object.keys(p))console.log(k)' 2>/dev/null || true); do
                  $CC plugin install "$key" 2>&1 | tail -1 || true
                done
              else
                echo "Skipping plugin reconciliation — the chezmoi source was not verified against origin/master" >&2
              fi

              # Plugin hooks ship with a literal ${CLAUDE_PLUGIN_ROOT}; resolve it to the
              # real cache path.
              for f in ~/.claude/plugins/cache/*/*/hooks/hooks.json; do
                [ -f "$f" ] || continue
                plugin_root="$(cd "$(dirname "$f")/.." && pwd)"
                sed -i "s|\${CLAUDE_PLUGIN_ROOT}|$plugin_root|g" "$f" 2>/dev/null
              done

              if [ -d ~/source-code/homelab/.git ]; then
                echo "Homelab repo exists, syncing to origin/main (hard reset — survives force-push/rewrite)..."
                # Explicit destination refspec — see the dotfiles fetch above for why.
                git -C ~/source-code/homelab fetch --quiet origin '+refs/heads/main:refs/remotes/origin/main' || true
                git -C ~/source-code/homelab reset --hard origin/main || true
              else
                echo "Cloning homelab repo..."
                mkdir -p ~/source-code
                git clone git@gh-homelab:AKhozya/homelab.git ~/source-code/homelab
              fi

              mkdir -p ~/data

              # Codex CLI state (~/.codex on PVC). config.toml rewritten every init — drift-heals
              # model/effort/trust (mirrors mac ~/.codex/config.toml for the review gate).
              # Auth = ChatGPT-plan tokens (auth.json copied from mac — the official codex
              # headless path). Seeded ONLY if absent: codex refreshes tokens in place on the
              # PVC; re-seeding the (stale) secret snapshot would clobber live tokens. If pod
              # auth ever dies: re-copy mac auth.json into the SOPS secret, rm the PVC copy,
              # restart pod.
              mkdir -p ~/.codex
              cat > ~/.codex/config.toml <<'CODEXCFG'
              model = "gpt-5.5"
              model_reasoning_effort = "xhigh"
              # Pod seccomp (RuntimeDefault) blocks unprivileged user namespaces -> codex's
              # bwrap sandbox cannot start (verified in-pod). The pod IS the sandbox:
              # non-root, readOnlyRootFilesystem, caps dropped, egress-restricted, own RBAC.
              sandbox_mode = "danger-full-access"

              [projects."/home/akhozya/source-code/homelab"]
              trust_level = "trusted"
              CODEXCFG
              if [ ! -f ~/.codex/auth.json ] && [ -f /etc/codex-auth/auth.json ]; then
                install -m 600 /etc/codex-auth/auth.json ~/.codex/auth.json
                echo "codex auth.json seeded from secret"
              fi

              # Versions pinned at image build (bi-weekly GHA rebuild); Renovate bumps the tag.
              CLI=$("$CC" --version 2>/dev/null || echo "unknown")
              SDK=$(node -e "console.log(require('/app/node_modules/@anthropic-ai/claude-agent-sdk/package.json').version)" 2>/dev/null || echo "unknown")
              CODEX=$(codex --version 2>/dev/null || echo "missing")
              # The seed above is only-if-absent, so a stale PVC copy shadows a rotated secret
              # and no restart ever repairs it — auth was dead from ~Jul 6 to Jul 31 in silence.
              # `codex login status` writes its answer to STDERR and leaves stdout empty, so
              # 2>&1 rather than 2>/dev/null — discarding stderr reports NOT LOGGED IN on a
              # perfectly good login. Capture first, then branch on emptiness: in
              # `cmd | head -1 || echo`, the status is head's, and head succeeds on empty
              # input, so the fallback never fires and a blank cell ships instead.
              CODEX_AUTH=$(codex login status 2>&1 | head -1)
              [ -n "$CODEX_AUTH" ] || CODEX_AUTH="NOT LOGGED IN"

              MSG=$(printf '## 🤖 Claude Bot Restarted\n\n| Component | Version |\n|---|---|\n| CLI | `%s` |\n| SDK | `%s` |\n| Codex | `%s` |\n| Codex auth | `%s` |' \
                "$CLI" "$SDK" "$CODEX" "$CODEX_AUTH")

              if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
                # Bot API 10.1 rich message (Markdown). node fetch has the keys via env to dodge quoting.
                TG_TOKEN="$TELEGRAM_BOT_TOKEN" TG_CHAT="$TELEGRAM_CHAT_ID" TG_MSG="$MSG" \
                  node -e 'fetch(`https://api.telegram.org/bot${process.env.TG_TOKEN}/sendRichMessage`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({chat_id:process.env.TG_CHAT,rich_message:{markdown:process.env.TG_MSG,skip_entity_detection:true}}),signal:AbortSignal.timeout(8000)}).then(r=>r.text()).catch(()=>{})' \
                  >/dev/null 2>&1 || true
              fi

              echo "Init complete."
          env:
            - name: GIT_EXEC_RE
              valueFrom:
                configMapKeyRef:
                  name: claude-telegram-git-exec
                  key: GIT_EXEC_RE
            - name: HOME
              value: /home/akhozya
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-telegram-env
                  key: telegram-bot-token
            - name: TELEGRAM_CHAT_ID
              value: "113452686"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: home
              mountPath: /home/akhozya
            - name: ssh-keys
              mountPath: /etc/ssh-keys
              readOnly: true
            - name: chezmoi-config
              mountPath: /etc/chezmoi-config
              readOnly: true
            - name: codex-auth
              mountPath: /etc/codex-auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: claude-telegram
          image: ghcr.io/akhozya/claude-telegram-bot:1.32.1
          env:
            - name: HOME
              value: /home/akhozya
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-telegram-env
                  key: claude-oauth-token
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-telegram-env
                  key: telegram-bot-token
            - name: TELEGRAM_ALLOWED_USERS
              value: "113452686"
            - name: CLAUDE_WORKING_DIR
              value: /home/akhozya/source-code/homelab
            - name: ALLOWED_PATHS
              value: "/home/akhozya"
            # OS-level Bash sandbox off in-pod: its Linux backend is bubblewrap, which needs
            # unprivileged user namespaces. Blocked by seccompProfile RuntimeDefault COMBINED WITH
            # capabilities.drop ALL — containerd builds its default profile from the bounding
            # capability set and allowlists unshare/mount/clone3 only under CAP_SYS_ADMIN, while
            # pivot_root is absent from that profile entirely, so bwrap fails even with the
            # capability. Same reason codex runs danger-full-access above — true for codex >= 0.115,
            # which moved the Linux backend from Landlock to bwrap, so re-verify on a major bump.
            # Running codex danger-full-access inside a container is OpenAI's own documented
            # guidance when the container is the intended boundary. The pod IS the sandbox —
            # readOnlyRootFilesystem confines writes to the mounted paths, caps dropped, egress
            # NetworkPolicy. env-secret scrub, strictMcpConfig, and the native-tool gates stay on.
            - name: BASH_SANDBOX_ENABLED
              value: "false"
            # Arms the external Bash denylist. Unset would silently switch that layer off,
            # so the init assertion above fails the pod rather than let the path go stale.
            - name: SAFETY_HOOK
              value: /app/hooks/validate-safe-bash.sh
            - name: SESSION_FILE_PATH
              value: /home/akhozya/data/session.json
            - name: RESTART_FILE_PATH
              value: /home/akhozya/data/restart.json
            # Coupled to the livenessProbe below — both must name the same path.
            - name: POLL_HEARTBEAT_PATH
              value: /tmp/claude-telegram-poll-heartbeat
            - name: AUDIT_LOG_PATH
              value: /home/akhozya/data/audit.log
            # Pinned here rather than left on the code defaults so the cadence is
            # tunable without rebuilding the image.
            - name: TEMP_REAP_INTERVAL_MS
              value: "3600000"
            - name: TEMP_RETENTION_HOURS
              value: "24" # an ask_user pause holds a download open; a longer pause loses it
            # Tracks the CPU limit below. nproc reports the node's 16 cores inside a capped
            # pod, so whisper.cpp cannot derive this itself; left at its default of 2 the
            # extra core would go unused. Matching threads to the cap beats oversubscribing —
            # measured at the old 2-core cap, where -t 2 beat -t 4 by 44%.
            - name: WHISPER_THREADS
              value: "3"
            # Use ANTHROPIC_MODEL, not CLAUDE_CODE_DEFAULT_MODEL: the latter has no consumer
            # in the CLI, SDK or bot. ANTHROPIC_MODEL overrides ~/.claude/settings.json
            # (verified against CLI 2.1.220).
            - name: ANTHROPIC_MODEL
              value: "claude-opus-5"
            - name: CLAUDE_CODE_EFFORT_LEVEL
              value: "xhigh"
            - name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
              value: "1"
            - name: DISABLE_AUTO_UPDATES
              value: "1"
            - name: TRIGGER_SECRET
              valueFrom:
                secretKeyRef:
                  name: claude-telegram-env
                  key: trigger-secret
            - name: TRIGGER_HOST
              value: "127.0.0.1"
            - name: TRIGGER_PORT
              value: "8080"
          ports:
            - name: trigger
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Poll-heartbeat freshness (the bot touches the file on every successful
          # getUpdates), not process-aliveness: on 2026-08-07 the poller slept out an
          # hours-long retry backoff after a network outage while a pgrep-style check
          # stayed green and 7 updates queued server-side. 10min staleness + 3 failures
          # restarts ~13min after polling dies; polling continues during long Claude
          # queries, so a busy bot is not a stale bot.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - find /tmp/claude-telegram-poll-heartbeat -mmin -10 | grep -q .
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          # Trigger server binds 127.0.0.1 — exec probe required (kubelet can't reach localhost)
          readinessProbe:
            exec:
              command: ["curl", "-sf", "--max-time", "2", "http://127.0.0.1:8080/healthz"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 3000m
              # 5Gi, not 3: whisper-small peaks at 1646MB, and index.ts only sequentializes
              # per chat — one allowed user posting from a private chat and a group can
              # transcribe concurrently, so two peaks land at once and 3Gi OOMKills. A limit
              # reserves nothing (requests stay at 256Mi), so the headroom is free.
              memory: 5Gi
          volumeMounts:
            - name: home
              mountPath: /home/akhozya
            - name: tmp
              mountPath: /tmp
        - name: sync
          image: ghcr.io/akhozya/claude-telegram-bot:1.32.1
          command:
            - /bin/bash
            - -c
            - |
              export HOME=/home/akhozya
              echo "Sync sidecar started (30m interval)"

              # The init container's sweep is a point-in-time guarantee, and everything it removes
              # is PVC state the bot can write back the moment init exits. This loop then runs git
              # and `chezmoi apply` against that state every 30 minutes, so a key planted at 00:01
              # executes at 00:30 — the sweep would be a control that holds only until the pod
              # finishes starting. Re-run it here before every cycle, and skip the cycle rather
              # than sync unhardened.
              #
              # Same pattern as the init container, from the same ConfigMap — that is the point;
              # two inline literals would drift apart silently.
              [ -n "${GIT_EXEC_RE:-}" ] || { echo "[harden] FATAL: GIT_EXEC_RE empty or unset — not sweeping"; exit 1; }

              scrub_git_config() {
                [ -f "$1" ] || return 0
                local keys k
                keys=$(git config --file "$1" --name-only --list) || return 1
                while IFS= read -r k; do
                  [ -n "$k" ] || continue
                  git config --file "$1" --unset-all "$k" || return 1
                done < <(printf '%s\n' "$keys" | grep -iE "$GIT_EXEC_RE" | sort -u)
              }

              set_remote() {
                [ -d "$1/.git" ] || return 0
                git -C "$1" remote set-url origin "$2"
              }

              # Remotes are re-pinned BEFORE the fetch below for the same reason init does it:
              # a redirected origin serves TRACKED run_* scripts, which survive both the reset and
              # any cleaning of the working tree.
              harden() {
                rm -f ~/.gitconfig.lock ~/.config/git/config.lock || return 1
                scrub_git_config ~/.gitconfig || return 1
                scrub_git_config ~/.config/git/config || return 1
                for r in ~/.local/share/chezmoi ~/source-code/homelab ~/source-code/claude-telegram-bot; do
                  [ -d "$r/.git" ] || continue
                  rm -f "$r/.git/config.lock" "$r/.git/config.worktree.lock" || return 1
                  for c in "$r/.git/config" "$r"/.git/config.worktree; do
                    scrub_git_config "$c" || return 1
                  done
                  rm -rf "$r/.git/hooks" "$r/.git/info/attributes" || return 1
                done
                set_remote ~/source-code/homelab             git@gh-homelab:AKhozya/homelab.git || return 1
                set_remote ~/.local/share/chezmoi            git@gh-dotfiles:AKhozya/dotfiles.git || return 1
                set_remote ~/source-code/claude-telegram-bot git@gh-fork:AKhozya/claude-telegram-bot.git || return 1
              }

              # Remote, branch AND destination ref all spelled out: a bare `fetch` and `@{u}`
              # resolve through branch.<name>.remote / .merge, and a source-only refspec leaves
              # the remote-tracking destination to remote.origin.fetch — each one a config key an
              # attacker can repoint without touching the pinned origin URL.
              # dotfiles is on master, homelab on main.
              run_pull() {
                local label="$1" dir="$2" branch="$3"
                local before after
                before=$(git -C "$dir" rev-parse HEAD 2>/dev/null || echo "?")
                if ! git -C "$dir" fetch --quiet origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2>&1; then
                  echo "[$label] FETCH FAILED"
                  return 1
                fi
                after=$(git -C "$dir" rev-parse "origin/$branch" 2>/dev/null || echo "?")
                if [ "$before" = "$after" ]; then
                  echo "[$label] up-to-date $after"
                  return 0
                fi
                # upstream moved (incl. force-push / history rewrite -> non-ff). Hard-reset
                # ONLY when the tree is clean, so in-flight bot work is never clobbered.
                if [ -n "$(git -C "$dir" status --porcelain 2>/dev/null)" ]; then
                  echo "[$label] upstream moved $before -> $after but tree DIRTY — skip reset (in-flight work)"
                  return 0
                fi
                if git -C "$dir" reset --hard "origin/$branch" --quiet; then
                  echo "[$label] reset $before -> $after"
                else
                  echo "[$label] RESET FAILED"
                  return 1
                fi
                return 0
              }

              while true; do
                sleep 1800
                echo "--- Sync $(date -Iseconds) ---"
                if ! harden; then
                  echo "[harden] FAILED — skipping this sync cycle rather than running git against unswept config"
                  continue
                fi
                if run_pull chezmoi ~/.local/share/chezmoi master; then
                  chezmoi apply --force --no-tty 2>&1 || echo "[chezmoi] apply FAILED"
                  # dot_gitconfig.tmpl puts the whole exec-capable key set back on every apply, so
                  # without this the sweep above is undone before the next line runs.
                  scrub_git_config ~/.gitconfig || echo "[harden] post-apply scrub FAILED"
                  scrub_git_config ~/.config/git/config || echo "[harden] post-apply scrub FAILED"
                else
                  echo "[chezmoi] pull failed — skipping apply rather than executing an unverified source"
                fi
                for f in ~/.claude/plugins/cache/*/*/hooks/hooks.json; do
                  [ -f "$f" ] || continue
                  plugin_root="$(cd "$(dirname "$f")/.." && pwd)"
                  sed -i "s|\${CLAUDE_PLUGIN_ROOT}|$plugin_root|g" "$f" 2>/dev/null
                done
                run_pull homelab ~/source-code/homelab main || true
                echo "Sync done"
              done
          env:
            - name: GIT_EXEC_RE
              valueFrom:
                configMapKeyRef:
                  name: claude-telegram-git-exec
                  key: GIT_EXEC_RE
            - name: HOME
              value: /home/akhozya
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: home
              mountPath: /home/akhozya
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: claude-telegram-home-pvc
        - name: ssh-keys
          secret:
            secretName: claude-telegram-ssh
            defaultMode: 0600
        - name: chezmoi-config
          secret:
            secretName: claude-telegram-chezmoi
        - name: codex-auth
          secret:
            secretName: claude-telegram-codex
            defaultMode: 0400
        - name: tmp
          # Circuit breaker, not a quota: breaching this evicts the Pod, it never prunes.
          # Routine cleanup is the app's reaper (TEMP_REAP_INTERVAL_MS and
          # TEMP_RETENTION_HOURS above) — this only stops a runaway from filling node
          # ephemeral storage and evicting its neighbours too.
          # 4Gi holds many concurrent downloads at the Telegram per-file ceiling, so
          # lowering it means lowering the retention window with it. Only in-flight media
          # is lost; state lives on the PVC.
          emptyDir:
            sizeLimit: 4Gi

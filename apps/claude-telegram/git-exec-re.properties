# The set of git config keys that name a program git will run. The init container strips them at
# boot; the sync sidecar strips them again before every 30-minute cycle. Both containers read this
# one value, because two inline literals drifted apart silently is a hole, not a style problem.
#
# Generated via configMapGenerator WITH the name-suffix hash (the repo's other two generators
# disable it). Deliberate: those mount ConfigMaps as files, which kubelet updates in a running pod,
# so a stale value self-heals. This one is consumed as an env var, which Kubernetes resolves once
# at pod start — without the hash, editing the pattern would leave both sweeps silently using the
# old one. The hash changes the ConfigMap name, which changes the pod spec, which rolls the pod.
#
# Three entries are not program names: protocol.ext.allow arms ext:: remote URLs that run an
# arbitrary command on fetch; uploadpack keys fire when this side SERVES a fetch; url.*.insteadOf
# silently redirects a fetch to an attacker's repo whose TRACKED run_* scripts chezmoi would then
# execute. gpg.ssh.defaultKeyCommand is inert until gpg.format=ssh and commit.gpgSign=true, then
# the next commit runs it.
GIT_EXEC_RE=^(core\.(fsmonitor|hooksPath|sshCommand|pager|editor|askPass|gitProxy|alternateRefsCommand)|include\.path|includeIf\..+\.path|alias\..+|filter\..+\.(clean|smudge|process)|diff\.external|diff\..+\.(textconv|command)|merge\..+\.driver|(difftool|mergetool)\..+\.(cmd|path)|credential\.(.+\.)?helper|sequence\.editor|gpg\.(.+\.)?(program|defaultKeyCommand)|remote\..+\.(uploadpack|receivepack)|url\..+\.(insteadOf|pushInsteadOf)|submodule\..+\.update|uploadpack\.packObjectsHook|protocol\.ext\.allow|pager\..+|interactive\.diffFilter)$

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-https@kubernetescrd,traefik-security-headers@kubernetescrd,traefik-rate-limit-standard@kubernetescrd,traefik-csp@kubernetescrd,traefik-csp-inline@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - audiobooks.h0melab.work
      secretName: audiobookshelf-tls-secret
  rules:
    - host: audiobooks.h0melab.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: audiobookshelf
                port:
                  number: 3005

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audiobookshelf-network-policy
  namespace: audiobookshelf
spec:
  podSelector:
    matchLabels:
      app: audiobookshelf
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Init Job (same namespace)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3005
    # Internal access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3005
    # External access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 3005
    # Uptime-kuma probes
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
      ports:
        - protocol: TCP
          port: 3005
  egress:
    # Metadata fetch: Audible, Google Books, OpenLibrary
    - ports:
        - protocol: TCP
          port: 443

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audiobookshelf-network-policy
  namespace: audiobookshelf
spec:
  podSelector:
    matchLabels:
      app: audiobookshelf
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from same namespace (init job, etc.)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3005
    # Allow ingress from traefik namespace for local access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3005
    # Allow ingress from cloudflare-tunnel namespace for external access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 3005
    # Allow ingress from uptime-kuma namespace for monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
      ports:
        - protocol: TCP
          port: 3005
  egress:
    # Allow HTTPS for metadata fetching (Audible, Google Books, OpenLibrary use HTTPS)
    - ports:
        - protocol: TCP
          port: 443

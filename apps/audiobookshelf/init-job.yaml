apiVersion: batch/v1
kind: Job
metadata:
  name: audiobookshelf-init
  namespace: audiobookshelf
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: audiobookshelf-init
    spec:
      serviceAccountName: audiobookshelf
      automountServiceAccountToken: false
      priorityClassName: homelab-standard
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: curlimages/curl:8.22.0
          command:
            - /bin/sh
            - -c
            - |
              set -e

              BASE=http://audiobookshelf.audiobookshelf.svc.cluster.local:3005/audiobookshelf

              # Check /status before calling /init: /init returns HTTP 500 both for an initialized
              # server and for a real failure, while /status reports isInit without auth. If the
              # server does not answer, the Job fails and restartPolicy retries it.
              echo "Checking Audiobookshelf init status..."
              STATUS=$(curl -sf --retry 10 --retry-delay 6 --retry-all-errors "$BASE/status")
              echo "Status: $STATUS"

              if echo "$STATUS" | grep -q '"isInit":true'; then
                echo "Server already initialized, nothing to do"
                exit 0
              fi
              if ! echo "$STATUS" | grep -q '"isInit":false'; then
                echo "Unexpected /status response, not initializing"
                exit 1
              fi

              echo "Attempting to initialize Audiobookshelf with root user..."
              RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$BASE/init" \
                -H "Content-Type: application/json" \
                -d "{\"newRoot\":{\"username\":\"$AUDIOBOOKSHELF_USERNAME\",\"password\":\"$AUDIOBOOKSHELF_PASSWORD\"}}")

              HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
              BODY=$(echo "$RESPONSE" | head -n-1)

              echo "Response: $BODY"
              echo "HTTP Code: $HTTP_CODE"

              if [ "$HTTP_CODE" = "200" ]; then
                echo "Audiobookshelf initialized with root user"
                exit 0
              fi
              echo "Initialization failed with HTTP $HTTP_CODE"
              exit 1
          env:
            - name: AUDIOBOOKSHELF_USERNAME
              valueFrom:
                secretKeyRef:
                  name: audiobookshelf-admin
                  key: username
            - name: AUDIOBOOKSHELF_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audiobookshelf-admin
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]

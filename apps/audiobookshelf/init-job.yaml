apiVersion: batch/v1
kind: Job
metadata:
  name: audiobookshelf-init
  namespace: audiobookshelf
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: audiobookshelf-init
    spec:
      serviceAccountName: audiobookshelf
      automountServiceAccountToken: false
      priorityClassName: homelab-standard
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: curlimages/curl:8.22.0
          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "Waiting 15 seconds for Audiobookshelf to be ready..."
              sleep 15

              echo "Attempting to initialize Audiobookshelf with root user..."

              RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
                http://audiobookshelf.audiobookshelf.svc.cluster.local:3005/audiobookshelf/init \
                -H "Content-Type: application/json" \
                -d "{\"newRoot\":{\"username\":\"$AUDIOBOOKSHELF_USERNAME\",\"password\":\"$AUDIOBOOKSHELF_PASSWORD\"}}")

              HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
              BODY=$(echo "$RESPONSE" | head -n-1)

              echo "Response: $BODY"
              echo "HTTP Code: $HTTP_CODE"

              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Audiobookshelf initialized successfully with root user!"
                exit 0
              elif [ "$HTTP_CODE" = "500" ]; then
                echo "⏭️  Server already initialized (this is expected after first run)"
                exit 0
              else
                echo "❌ Initialization failed with HTTP $HTTP_CODE"
                exit 1
              fi
          env:
            - name: AUDIOBOOKSHELF_USERNAME
              valueFrom:
                secretKeyRef:
                  name: audiobookshelf-admin
                  key: username
            - name: AUDIOBOOKSHELF_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audiobookshelf-admin
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]

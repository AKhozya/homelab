apiVersion: v1
kind: Service
metadata:
  name: blocky-dns
  namespace: blocky
  annotations:
    # K3s servicelb assigns 1 LB IP per worker node where matching pod runs.
    # With anti-affinity ensuring 1 pod per worker (W1+W2), this Service exposes
    # 192.168.1.129 (W1) AND 192.168.1.126 (W2) — single Service, 2 external IPs.
    # externalTrafficPolicy: Local preserves client source IP for query log.
    description: "DNS Service. servicelb assigns 1 LB IP per worker (.129 + .126). ETP=Local preserves source IP."
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - { port: 53, targetPort: 53, protocol: TCP, name: dns-tcp }
    - { port: 53, targetPort: 53, protocol: UDP, name: dns-udp }
  selector:
    app: blocky

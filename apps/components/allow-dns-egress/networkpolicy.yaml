apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  podSelector:
    matchExpressions:
      - key: batch.kubernetes.io/job-name
        operator: DoesNotExist
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        # TCP fallback: responses over the UDP payload limit set the TC bit
        # and resolvers retry over TCP/53 — without this, large answers
        # (long CNAME chains, big CDN rotations) hang instead of resolving.
        - protocol: TCP
          port: 53

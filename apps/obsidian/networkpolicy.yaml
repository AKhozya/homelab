apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: obsidian-network-policy
  namespace: obsidian
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # CouchDB, scoped to the couchdb pods and not the whole databases namespace.
    # podSelector under the SAME list item as namespaceSelector means AND. As a separate
    # `-` item it would mean OR and grant 5984 to every pod anywhere.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              app: couchdb
      ports:
        - protocol: TCP
          port: 5984

apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      serviceAccountName: n8n
      automountServiceAccountToken: false
      priorityClassName: homelab-standard
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-database-crd
          image: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
          envFrom:
            - secretRef:
                name: n8n-env
          env:
            # Override DB_HOST for init check - use direct connection for consistency
            - name: DB_POSTGRESDB_HOST
              value: main-postgres-rw.databases.svc.cluster.local
          command:
            - sh
            - -c
            - |
              echo "Waiting for Database CRD to create ${DB_POSTGRESDB_DATABASE}..."
              MAX_RETRIES=60
              RETRY_COUNT=0

              # Wait for database to be accessible (created by Database CRD)
              until pg_isready -h "$DB_POSTGRESDB_HOST" -p "$DB_POSTGRESDB_PORT" -U "$DB_POSTGRESDB_USER" -d "$DB_POSTGRESDB_DATABASE" > /dev/null 2>&1; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                  echo "ERROR: Database not created by CRD after ${MAX_RETRIES} attempts"
                  exit 1
                fi
                echo "Waiting for Database CRD (attempt $RETRY_COUNT/$MAX_RETRIES)..."
                sleep 2
              done

              echo "Database ${DB_POSTGRESDB_DATABASE} is ready!"
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
      containers:
        - name: n8n
          image: n8nio/n8n:2.22.5
          ports:
            - containerPort: 5678
              name: http
          envFrom:
            - secretRef:
                name: n8n-env
          env:
            # Disable statement_timeout in startup message - incompatible with PgBouncer transaction mode
            # https://github.com/n8n-io/n8n/issues/25705
            - name: DB_POSTGRESDB_STATEMENT_TIMEOUT
              value: "0"
            # Pre-migrate storage path before n8n v3 renames binaryData → storage
            - name: N8N_MIGRATE_FS_STORAGE_PATH
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/node/.cache
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data-pvc
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}

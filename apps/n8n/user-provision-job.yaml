apiVersion: batch/v1
kind: Job
metadata:
  name: n8n-user-provision
  namespace: n8n
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: n8n-user-provision  # require-labels (Kyverno); distinct from app=n8n so app-scoped NetworkPolicies don't match this Job
    spec:
      serviceAccountName: n8n
      restartPolicy: OnFailure
      priorityClassName: homelab-standard
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: user-provision
          image: curlimages/curl:8.21.0
          command: ["/bin/sh", "/scripts/provision-user.sh"]
          env:
            - name: N8N_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: n8n-user-credentials
                  key: email
            - name: N8N_USER_FIRSTNAME
              valueFrom:
                secretKeyRef:
                  name: n8n-user-credentials
                  key: firstname
            - name: N8N_USER_LASTNAME
              valueFrom:
                secretKeyRef:
                  name: n8n-user-credentials
                  key: lastname
            - name: N8N_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-user-credentials
                  key: password
          volumeMounts:
            - name: provision-script
              mountPath: /scripts
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: provision-script
          configMap:
            name: n8n-user-provision-script
            defaultMode: 0755

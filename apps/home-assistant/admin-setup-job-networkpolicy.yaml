apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: home-assistant-admin-setup-egress
  namespace: home-assistant
spec:
  # Selects the admin-setup Job pod only (canonical label, auto-set on K3s >=1.27).
  # The shared allow-dns-egress baseline EXCLUDES Jobs, so DNS is supplied here.
  podSelector:
    matchLabels:
      batch.kubernetes.io/job-name: home-assistant-admin-setup
  policyTypes:
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # home-assistant API (same namespace), container port
    - to:
        - podSelector:
            matchLabels:
              app: home-assistant
      ports:
        - protocol: TCP
          port: 8123

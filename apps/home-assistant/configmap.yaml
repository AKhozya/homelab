apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
data:
  configuration.yaml: |
    # Loads default set of integrations. Do not remove.
    default_config:

    # Load frontend themes from the themes folder
    frontend:
      themes: !include_dir_merge_named themes

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    # HTTP configuration for reverse proxy (Traefik ingress)
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.42.0.0/16  # Kubernetes pod CIDR
        - 10.43.0.0/16  # Kubernetes service CIDR

    # OIDC disabled — hass-oidc-auth community component incompatible with HA 2026.4.0
    # Re-enable when upstream fixes the login flow issue
    # https://github.com/christiaangoossens/hass-oidc-auth

    # MySQL Recorder Configuration
    # Single instance - relies on daily backups for DR
    recorder:
      db_url: !secret db_url
      commit_interval: 5
      purge_keep_days: 30

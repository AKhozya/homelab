apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-assistant
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - storage.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - admin-credentials-secret.yaml
  - admin-setup-job-networkpolicy.yaml
  - admin-setup-job.yaml
  - certificate.yaml
  - secrets.yaml
  # OIDC config is embedded in secrets.yaml (oidc_client_secret key)

components:
  - ../components/allow-dns-egress

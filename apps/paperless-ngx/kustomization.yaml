apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paperless-ngx
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - storage.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - certificate.yaml
  - paperless-env-secret.yaml
  # OIDC config is embedded in paperless-env-secret.yaml (PAPERLESS_SOCIALACCOUNT_PROVIDERS)

components:
  - ../components/allow-dns-egress

apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: paperless-ngx
  template:
    metadata:
      labels:
        app: paperless-ngx
    spec:
      serviceAccountName: paperless-ngx
      automountServiceAccountToken: false
      priorityClassName: homelab-standard
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - |
              chown -R 1000:1000 /run && chmod 755 /run
              chown 1000:1000 /data /media /export /consume
          volumeMounts:
            - name: run
              mountPath: /run
            - name: paperless-storage
              mountPath: /data
              subPath: data
            - name: paperless-storage
              mountPath: /media
              subPath: media
            - name: paperless-storage
              mountPath: /export
              subPath: export
            - name: paperless-storage
              mountPath: /consume
              subPath: consume
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: paperless-ngx
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.2
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: paperless-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            # The probe covers migrations, dependency waits, tesseract setup, and search indexing.
            # If a node reboot leaves a cold page cache, init runs past 290s, so allow 600s of
            # probing after the 60s delay.
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "704Mi"
            limits:
              # If the limit is 500m, CFS counters show throttling in every period
              # (nr_throttled == nr_periods, 2026-08-09). Three 5s liveness timeouts then restart the pod.
              cpu: "1000m"
              memory: "1536Mi"
          volumeMounts:
            - name: paperless-storage
              mountPath: /usr/src/paperless/data
              subPath: data
            - name: paperless-storage
              mountPath: /usr/src/paperless/media
              subPath: media
            - name: paperless-storage
              mountPath: /usr/src/paperless/export
              subPath: export
            - name: paperless-storage
              mountPath: /usr/src/paperless/consume
              subPath: consume
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
      volumes:
        - name: paperless-storage
          persistentVolumeClaim:
            claimName: paperless-data-pvc
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: uptime-kuma-network-policy
  namespace: uptime-kuma
spec:
  podSelector:
    matchLabels:
      app: uptime-kuma
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Internal access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3001
    # Setup Job (same namespace)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3001
  egress:
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: TCP
          port: 80
    # DB probes
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
      ports:
        - protocol: TCP
          port: 3306        # MySQL direct
        - protocol: TCP
          port: 5432        # PostgreSQL
        - protocol: TCP
          port: 6379        # Redis
        - protocol: TCP
          port: 26379       # Redis Sentinel HA
    # App probes, any namespace
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 2000        # Cloudflare Tunnel metrics
        - protocol: TCP
          port: 3000        # Grafana
        - protocol: TCP
          port: 3001        # Uptime Kuma
        - protocol: TCP
          port: 3005        # Audiobookshelf
        - protocol: TCP
          port: 5000        # HomeHub
        - protocol: TCP
          port: 5678        # N8N
        - protocol: TCP
          port: 5984        # CouchDB (Obsidian)
        - protocol: TCP
          port: 53          # DNS TCP (Blocky probes)
        - protocol: UDP
          port: 53          # DNS UDP (Blocky probes)
        - protocol: TCP
          port: 8000        # Paperless-NGX
        - protocol: TCP
          port: 2283        # Immich
        - protocol: TCP
          port: 8080        # Stirling PDF
        - protocol: TCP
          port: 8123        # Home Assistant
        - protocol: TCP
          port: 9000        # Mealie, Authentik
        - protocol: TCP
          port: 8429        # VictoriaMetrics VMSingle (HTTP API + /health)
        - protocol: TCP
          port: 9093        # Alertmanager
    # Node infrastructure on host network
    - to:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - protocol: TCP
          port: 65300       # SSH (custom port)
        - protocol: TCP
          port: 10250       # Kubelet API
        - protocol: TCP
          port: 53          # Blocky DNS LB (TCP) on node IPs .129/.126
        - protocol: UDP
          port: 53          # Blocky DNS LB (UDP) on node IPs .129/.126
    # NAS rsyncd health probe (only non-node LAN monitor as of 2026-07-03).
    - to:
        - ipBlock:
            cidr: 192.168.1.136/32
      ports:
        - protocol: TCP
          port: 50555       # NAS rsync daemon
    # There is deliberately no all-ports 192.168.1.0/24 rule. Every monitor is
    # http/port/dns and the scoped ports above cover them, and NetworkPolicy cannot
    # express ICMP. Add a ping-type monitor only with a /32 target and explicit ports.

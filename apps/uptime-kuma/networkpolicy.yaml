apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: uptime-kuma-network-policy
  namespace: uptime-kuma
spec:
  podSelector:
    matchLabels:
      app: uptime-kuma
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from traefik namespace for internal access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3001
    # Allow ingress from same namespace (for setup job)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3001
  egress:
    # Allow HTTPS for monitoring external services
    - ports:
        - protocol: TCP
          port: 443
    # Allow HTTP for monitoring services
    - ports:
        - protocol: TCP
          port: 80
    # Allow DB probes restricted to databases namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
      ports:
        - protocol: TCP
          port: 3306        # MySQL direct
        - protocol: TCP
          port: 5432        # PostgreSQL
        - protocol: TCP
          port: 6379        # Redis
        - protocol: TCP
          port: 26379       # Redis Sentinel HA
    # Allow monitoring services in other namespaces (non-DB ports)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 2000        # Cloudflare Tunnel metrics
        - protocol: TCP
          port: 3000        # Grafana
        - protocol: TCP
          port: 3001        # Uptime Kuma
        - protocol: TCP
          port: 3005        # Audiobookshelf
        - protocol: TCP
          port: 5000        # HomeHub
        - protocol: TCP
          port: 6446        # MySQL Router
        - protocol: TCP
          port: 5678        # N8N
        - protocol: TCP
          port: 5984        # CouchDB (Obsidian)
        - protocol: TCP
          port: 53          # DNS TCP (Blocky probes)
        - protocol: UDP
          port: 53          # DNS UDP (Blocky probes)
        - protocol: TCP
          port: 8000        # Paperless-NGX
        - protocol: TCP
          port: 2283        # Immich
        - protocol: TCP
          port: 8080        # Stirling PDF
        - protocol: TCP
          port: 8123        # Home Assistant
        - protocol: TCP
          port: 9000        # Mealie, Authentik
        - protocol: TCP
          port: 8428        # VictoriaMetrics VMSingle (insert)
        - protocol: TCP
          port: 8429        # VictoriaMetrics VMSingle (HTTP API + /health)
        - protocol: TCP
          port: 9090        # Prometheus, Linkding
        - protocol: TCP
          port: 9093        # Alertmanager
    # Allow monitoring K8s node infrastructure (host network)
    # Nodes: control-plane (.127), worker-node (.129), worker-node-2 (.126)
    - to:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - protocol: TCP
          port: 65300       # SSH (custom port)
        - protocol: TCP
          port: 10250       # Kubelet API
        - protocol: TCP
          port: 53          # Blocky DNS LB (TCP) on node IPs .129/.126
        - protocol: UDP
          port: 53          # Blocky DNS LB (UDP) on node IPs .129/.126
    # NAS rsyncd health probe (only non-node LAN monitor as of 2026-07-03).
    - to:
        - ipBlock:
            cidr: 192.168.1.136/32
      ports:
        - protocol: TCP
          port: 50555       # NAS rsync daemon
    # NOTE: the old all-ports `192.168.1.0/24` egress rule (nominally for ICMP
    # ping) was removed 2026-07-03 — there are zero `ping`-type monitors; every
    # active monitor is http/port/dns and covered by the scoped ports above.
    # NetworkPolicy can't express ICMP anyway; re-add a scoped rule ONLY if a
    # real ping monitor is added, and prefer /32 targets + explicit ports.

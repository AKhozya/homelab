apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
  labels:
    # The uptime-kuma VMServiceScrape in monitoring selects this Service by this label.
    app: uptime-kuma
spec:
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
      name: http
  selector:
    app: uptime-kuma
  type: ClusterIP

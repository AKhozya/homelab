apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      priorityClassName: homelab-standard
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # NOTE: InitContainer copies ConfigMap to writable emptyDir
      #
      # WHY: Homepage needs to both:
      # 1. Read custom config from ConfigMap (services, widgets, etc.)
      # 2. Write dynamic files (docker.yaml, logs) to /app/config
      #
      # A ConfigMap mount is read-only, so the init container copies it to a writable emptyDir.
      initContainers:
        - name: copy-config
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - |
              set -eu
              echo "Copying ConfigMap files to writable config directory..."
              # An unmounted volume is a failure, not "no config": the ls below discards
              # its own error, so without this the pod would start with default config.
              if [ ! -d /tmp/configmap ]; then
                echo "ERROR: /tmp/configmap is not mounted" >&2
                exit 1
              fi

              # Plain `ls`, not `ls -A`: a projected ConfigMap always carries a `..data`
              # symlink, so -A reports non-empty even with zero keys — while `*` would
              # match nothing and hand cp a literal glob. This mirrors what `*` sees, so
              # an empty ConfigMap is distinguished from a copy that genuinely failed.
              # Capture the status separately: an unreadable directory also lists empty,
              # and swallowing that would start the app on defaults.
              if ! CONFIG_FILES=$(ls /tmp/configmap 2>&1); then
                echo "ERROR: cannot list /tmp/configmap: $CONFIG_FILES" >&2
                exit 1
              fi

              if [ -z "$CONFIG_FILES" ]; then
                echo "No ConfigMap files to copy (using defaults)"
              else
                cp -v /tmp/configmap/* /app/config/
              fi
              echo "Config directory ready"
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: configmap
              mountPath: /tmp/configmap
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.4.0
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "home.h0melab.work"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          # homepage v2 validates the Host header against HOMEPAGE_ALLOWED_HOSTS.
          # Kubelet probes default to the pod IP, which can never be allowlisted
          # (it changes every restart), so send the ingress host instead.
          livenessProbe:
            httpGet:
              path: /
              port: 3000
              httpHeaders:
                - name: Host
                  value: home.h0melab.work
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
              httpHeaders:
                - name: Host
                  value: home.h0melab.work
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "192Mi"
            limits:
              cpu: "200m"
              memory: "384Mi"
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: configmap
          configMap:
            name: homepage-config

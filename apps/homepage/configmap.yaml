apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    # Disable automatic service discovery to prevent API errors
    # We manually configure services in services.yaml instead
    ingress: false
    traefik: false
    gateway: false

  settings.yaml: |
    title: Homelab Dashboard
    theme: dark
    color: slate
    headerStyle: boxed
    # Suppress built-in GitHub releases check — causes latency alerts when
    # api.github.com is unreachable (ECONNREFUSED → p99 >2s → TraefikHighLatency)
    hideVersion: true
    layout:
      - Productivity:
          style: row
          columns: 3
      - Media & Automation:
          style: row
          columns: 2
      - Infrastructure:
          style: row
          columns: 3
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      hideVisitURL: true

  bookmarks.yaml: |
    - Developer:
        - Homelab Repo:
            - icon: github-light
              href: https://github.com/AKhozya/homelab
        - Awesome Self-hosted:
            - icon: si-awesome-#FC60A8
              href: https://github.com/awesome-selfhosted/awesome-selfhosted
        - Kubernetes Docs:
            - icon: kubernetes
              href: https://kubernetes.io/docs

    - Media:
        - Spotify:
            - icon: spotify
              href: https://open.spotify.com

  services.yaml: |
    - Productivity:
        - LinkWarden:
            icon: si-linkfire
            href: https://linkwarden.h0melab.work
            description: Bookmark manager & read-it-later (2-in-1)
            namespace: linkwarden
            app: linkwarden
            podSelector: "app=linkwarden"
        - Mealie:
            icon: mealie.png
            href: https://mealie.h0melab.work
            description: Recipe manager
            namespace: mealie
            app: mealie
            podSelector: "app=mealie"
        - Paperless-NGX:
            icon: paperless.png
            href: https://paperless.h0melab.work
            description: Document management
            namespace: paperless-ngx
            app: paperless-ngx
            podSelector: "app=paperless-ngx"
        - Immich:
            icon: immich.png
            href: https://immich.h0melab.work
            description: Photo management
            namespace: immich
            app: immich-server
            podSelector: "app.kubernetes.io/instance=immich,app.kubernetes.io/name=server"
        - Stirling PDF:
            icon: si-adobeacrobatreader
            href: https://stirling.h0melab.work
            description: PDF toolkit with OIDC
            namespace: stirling-pdf
            app: stirling-pdf
            podSelector: "app=stirling-pdf"
        - PriceBuddy:
            icon: si-amazon
            href: https://pricebuddy.h0melab.work
            description: Price tracking & comparison
            namespace: pricebuddy
            app: pricebuddy
            podSelector: "app=pricebuddy"

    - Media & Automation:
        - Audiobookshelf:
            icon: audiobookshelf.png
            href: https://audiobooks.h0melab.work
            description: Audiobook & podcast server
            namespace: audiobookshelf
            app: audiobookshelf
            podSelector: "app=audiobookshelf"
        - N8N:
            icon: n8n.png
            href: https://n8n.h0melab.work
            description: Workflow automation
            namespace: n8n
            app: n8n
            podSelector: "app=n8n"

    - Infrastructure:
        - Home Assistant:
            icon: home-assistant.png
            href: https://ha.h0melab.work
            description: Home automation
            namespace: home-assistant
            app: home-assistant
            podSelector: "app=home-assistant"
        - Authentik:
            icon: authentik.png
            href: https://authentik.h0melab.work
            description: Identity provider & SSO
            namespace: authentik
            app: authentik
            podSelector: "app=authentik,component=server"
        - Blocky:
            icon: mdi-dns
            href: https://grafana.h0melab.work/d/blocky
            description: Network-wide ad blocking & DNS
            namespace: blocky
            app: blocky
            podSelector: "app=blocky"
        - Uptime Kuma:
            icon: uptime-kuma.png
            href: https://uptime.h0melab.work
            description: Uptime monitoring
            namespace: uptime-kuma
            app: uptime-kuma
            podSelector: "app=uptime-kuma"
        - Grafana:
            icon: grafana.png
            href: https://grafana.h0melab.work
            description: Monitoring & dashboards
            namespace: monitoring
            app: grafana
        - Alert Manager:
            icon: alertmanager.png
            href: https://am.h0melab.work
            description: Alert management
            namespace: monitoring
            app: alertmanager
        - HomeHub:
            icon: si-homeassistantcommunitystore
            href: http://hh.h0melab.work
            description: Family utility dashboard (local only)
            namespace: homehub
            app: homehub
            podSelector: "app=homehub"

  widgets.yaml: |
    # NOTE: Kubernetes widget disabled due to "NaN undefined undefined" errors in v1.5.0
    # See: https://github.com/gethomepage/homepage/discussions/3935
    # The widget fails to parse metrics API responses, causing constant errors.
    # Re-enable when fixed in a future version or when using a working workaround.
    # - kubernetes:
    #     cluster:
    #       show: true
    #       cpu: true
    #       memory: true
    #       showLabel: true
    #       label: "cluster"
    #     nodes:
    #       show: false

    - resources:
        cpu: true
        memory: true
        disk: /

    - search:
        provider: google
        target: _blank

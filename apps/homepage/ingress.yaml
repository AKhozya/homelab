apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
  annotations:
    # authentik-forward-auth sits AFTER rate-limit: an unauthenticated request is answered
    # by the auth middleware and the chain short-circuits there, so auth placed earlier
    # would leave the login path unthrottled.
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-https@kubernetescrd,traefik-security-headers@kubernetescrd,traefik-rate-limit-standard@kubernetescrd,traefik-authentik-forward-auth@kubernetescrd,traefik-csp-inline-enforced@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - home.h0melab.work
      secretName: homepage-tls-secret
  rules:
    - host: home.h0melab.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000

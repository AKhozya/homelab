apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
# Cluster-wide READ of discovery resources (namespaces/pods/nodes/services/ingresses/metrics) for
# Homepage's Kubernetes service-discovery widgets. Per-namespace Roles would mean 16+ Roles.
# `secrets` was REMOVED (UR2 P3-6): Homepage reads no secrets via the K8s API — widgets are
# pod-status + static links, the kubernetes widget is disabled, and the Deployment mounts no secret
# env. No write access anywhere. Mitigations: NetworkPolicy, non-root, readOnlyRootFilesystem.
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
      - nodes
      - services
    verbs:
      - get
      - list
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage

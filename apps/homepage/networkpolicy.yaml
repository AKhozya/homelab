apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homepage-network-policy
  namespace: homepage
spec:
  podSelector:
    matchLabels:
      app: homepage
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Internal access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3000
    # Uptime-kuma probes
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # K8s API for service discovery (homepage cluster mode). The CIDR is the
    # control-plane node.
    - to:
        - ipBlock:
            cidr: 192.168.1.127/32
      ports:
        - protocol: TCP
          port: 6443
    # App status checks
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443

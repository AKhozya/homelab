apiVersion: v1
kind: Namespace
metadata:
  name: immich
  labels:
    # Privileged only because immich-server mounts the photo library as a hostPath
    # (/var/lib/immich-library, NAS virtiofs), which PSS baseline and restricted forbid. The GPU
    # comes from the Intel device-plugin, with no /dev/dri hostPath and no privileged container.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline

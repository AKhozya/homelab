apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 6h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: immich
      version: 0.13.4
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: immich
  timeout: 15m
  install:
    remediation:
      retries: 3
  maxHistory: 3
  # Never roll immich back: its DB migrations are irreversible, so the old chart on the migrated
  # schema corrupts data. The default strategy, RemediateOnFailure, rolls back between remediation
  # retries. RetryOnFailure re-runs the same upgrade instead and never remediates, so a failed
  # upgrade retries every 10m until it succeeds or an operator fixes the cause. Do not add
  # upgrade.remediation: this strategy ignores it.
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 10m
  # The chart has no per-component serviceAccount, so these patches set it and the token automount.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: immich-server
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-standard
              - op: add
                path: /spec/revisionHistoryLimit
                value: 2
              # Recreate strategy: avoids quota doubling and advisory lock contention during upgrades
              - op: replace
                path: /spec/strategy
                value:
                  type: Recreate
              - op: replace
                path: /spec/template/spec/serviceAccountName
                value: immich
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
              # Library: swap the chart's PVC library volume (index 0, name=data) for the
              # NAS virtiofs hostPath. Mount path /data is unchanged (DB asset paths are
              # relative to it). virtiofs accessmode=passthrough → pod uid/gid 1000 maps 1:1
              # to NAS akhozya/zettos-admins. volumes[0]=data is render-verified: it is the
              # server's only volume, since the GPU comes from the Intel device-plugin, not a
              # /dev/dri hostPath.
              # Guard: if a future chart bump shifts the volume order, this `test` fails the
              # whole patch (reconcile errors, release stays last-good) rather than silently
              # replacing the wrong volume.
              - op: test
                path: /spec/template/spec/volumes/0/name
                value: data
              - op: replace
                path: /spec/template/spec/volumes/0
                value:
                  name: data
                  hostPath:
                    path: /var/lib/immich-library
                    type: Directory
          - target:
              kind: Deployment
              name: immich-machine-learning
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-standard
              - op: add
                path: /spec/revisionHistoryLimit
                value: 2
              - op: replace
                path: /spec/strategy
                value:
                  type: Recreate
              - op: replace
                path: /spec/template/spec/serviceAccountName
                value: immich
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: rapidocr-models
                  emptyDir: {}
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: rapidocr-models
                  # This path must match the image variant's Python minor: the -openvino image builds
                  # on python:3.13, the CPU image on 3.11. Bump it with the tag. A version-independent
                  # symlink does not work: root owns /opt/venv and the container runs as uid 1000.
                  mountPath: /opt/venv/lib/python3.13/site-packages/rapidocr/models
          # A JSON patch op in
          # the block above failed silently: Kustomize treats a multi-doc JSON-patch array as a
          # strategic merge patch if the target has no explicit patch type.
          - target:
              kind: Deployment
              name: immich-machine-learning
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: immich-machine-learning
              spec:
                template:
                  spec:
                    containers:
                      - name: main
                        readinessProbe:
                          timeoutSeconds: 5
  values:
    controllers:
      main:
        containers:
          main:
            env:
              # Not the PgBouncer pooler: Immich's startup advisory lock needs one session, and
              # transaction pooling does not keep it ("you don't own a lock of type ExclusiveLock").
              DB_HOSTNAME: main-postgres-rw.databases.svc.cluster.local
              DB_PORT: "5432"
              DB_DATABASE_NAME: immich
              DB_USERNAME: immich
              # Immich prefers vchord if the CNPG image exposes it in pg_available_extensions.
              # The immich role cannot create that superuser-only extension, so startup fails.
              # Pin pgvector so a CNPG image update cannot switch extensions.
              DB_VECTOR_EXTENSION: pgvector
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-password
                    key: password
              # REDIS_URL=ioredis://<base64(json)>, held in the SOPS secret immich-redis-url. The
              # JSON is a plain ioredis client pointed at the opstree operator's master-following
              # Service redis-replication-master (selector redis-role=master). On failover the
              # operator repoints that Service to the promoted master, so ioredis reconnects to the
              # same ClusterIP. Same pattern as paperless.
              # Rejected: client-side Sentinel discovery held a stale master and needed a manual
              # rollout restart (2026-06-28). ioredis failoverDetector:true also recovers, but leaks
              # sentinel connections on every failover (known ioredis bug).
              REDIS_URL:
                valueFrom:
                  secretKeyRef:
                    name: immich-redis-url
                    key: redis-url
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003

    immich:
      metrics:
        enabled: true
      persistence:
        library:
          # existingClaim is schema-required (the chart won't auto-create the library
          # volume) but the postRenderer replaces volume[0] with the NAS hostPath
          # (/var/lib/immich-library) — so this claim is never created or mounted.
          # Keep it: dropping it changes the persistence shape, and the postRenderer
          # patches volume[0] by index.
          existingClaim: immich-library

    # External Redis replaces the chart's bundled Valkey.
    valkey:
      enabled: false

    server:
      enabled: true
      serviceMonitor:
        main:
          labels:
            release: kube-prometheus-stack
      controllers:
        main:
          pod:
            # Pin the server to the immich-vm GPU node (Intel iGPU + NAS virtiofs library).
            nodeSelector:
              homelab/gpu: intel
            tolerations:
              - key: homelab/dedicated
                operator: Equal
                value: immich
                effect: NoSchedule
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              # The injected /dev/dri nodes are root:video (card*) and root:render (renderD*) on
              # immich-vm; these GIDs let the non-root pod open them.
              supplementalGroups:
                - 983  # video group on immich-vm
                - 987  # render group on immich-vm
              # Pod-level RuntimeDefault, so it also covers the main container, whose own
              # securityContext sets only allowPrivilegeEscalation and drop-ALL.
              seccompProfile:
                type: RuntimeDefault
          initContainers:
            wait-for-database:
              image:
                repository: ghcr.io/cloudnative-pg/postgresql
                tag: 18.7-standard-trixie
                pullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  echo "Waiting for Database CRD to create ${DB_DATABASE_NAME}..."
                  MAX_RETRIES=60
                  RETRY_COUNT=0

                  until pg_isready -h "$DB_HOSTNAME" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_DATABASE_NAME" > /dev/null 2>&1; do
                    RETRY_COUNT=$((RETRY_COUNT + 1))
                    if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                      echo "ERROR: Database not ready after ${MAX_RETRIES} attempts"
                      exit 1
                    fi
                    echo "Waiting for Database CRD (attempt $RETRY_COUNT/$MAX_RETRIES)..."
                    sleep 2
                  done

                  echo "Database ${DB_DATABASE_NAME} is ready!"
              env:
                - name: DB_HOSTNAME
                  value: main-postgres-rw.databases.svc.cluster.local
                - name: DB_PORT
                  value: "5432"
                - name: DB_DATABASE_NAME
                  value: immich
                - name: DB_USERNAME
                  value: immich
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-password
                      key: password
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop:
                    - ALL
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v3.4.1
                pullPolicy: IfNotPresent
              env:
                # iHD is the Intel media driver. The QSV accel setting lives in the admin UI
                # ffmpeg settings, not here. A spike ran hevc_qsv at 25.3x, non-privileged.
                LIBVA_DRIVER_NAME: iHD
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                  gpu.intel.com/i915: "1"   # Intel device-plugin injects /dev/dri (non-privileged)
                limits:
                  # 3000m (of the 4-vCPU immich-vm): headroom for QSV transcode + thumbnail
                  # bursts — pod was hitting ~82% of the old 1500m while the VM sat at ~41%.
                  # Leaves ~1 core for k3s/system on the node. Raised 2026-07-12.
                  cpu: "3000m"
                  memory: 5Gi
                  gpu.intel.com/i915: "1"
              # The chart default timeoutSeconds is 1. After a reboot a CPU-starved /api/server/ping
              # can take longer, and the failed probe can SIGTERM a healthy pod (same cause as
              # machine-learning below).
              probes:
                startup:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /api/server/ping
                      port: http
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 30
                liveness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /api/server/ping
                      port: http
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 5
              # readOnlyRootFilesystem is unset: the server writes to /data, and the Kyverno
              # readOnlyRootFilesystem policy excludes the immich namespace. Non-root comes from
              # the pod-level runAsUser 1000.
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL

    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                # -openvino: ONNX Runtime with the OpenVINO execution provider on the VM's Meteor Lake
                # iGPU. The version part must match the server tag; Renovate keeps the suffix on bumps.
                # This variant runs Python 3.13, which the rapidocr mountPath in the postRenderer follows.
                tag: v3.4.1-openvino
                pullPolicy: IfNotPresent
              env:
                TRANSFORMERS_CACHE: /cache
                # gunicorn 25.1.0 added a control socket at the relative path "gunicorn.ctl". In the
                # read-only cwd the write fails with Errno 30, and that failure intermittently hangs
                # the worker fork: about half the restarts deadlocked at boot in the 2026-05-31
                # reboot recovery. immich does not use gunicorn's control CLI, so turn it off.
                GUNICORN_CMD_ARGS: "--no-control-socket"
              # gpu.intel.com/i915: the Intel device plugin injects /dev/dri (10 shares per node, the
              # server holds one). OpenVINO keeps model buffers in system RAM charged to this cgroup.
              # This container serves all three model families and caches each for 300s, so size it
              # for their sum, not for CLIP alone. Measured 2026-09-07 on the OpenVINO path: CLIP both
              # towers ~3450Mi, OCR detection+recognition ~1151Mi, buffalo_l face ~1088Mi — ~5.9Gi
              # together, which does not fit 5Gi. Exceeding the limit kills the gunicorn worker rather
              # than the container, so gunicorn respawns it and restart-count monitoring misses the
              # failure. The CPU image fits all three in 2355Mi; OpenVINO's GPU buffers inflate them.
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                  gpu.intel.com/i915: "1"
                limits:
                  cpu: 4000m
                  memory: 7Gi
                  gpu.intel.com/i915: "1"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop:
                    - ALL
              # The chart default timeoutSeconds of 1 is too tight. In the 2026-05-31 reboot
              # recovery the CPU-starved single ML worker could not answer /ping within 1s, so every
              # probe failed, startup used up its 600s budget and the pod got SIGTERM (2 restarts).
              # Readiness is set in the postRenderer, because bjw-s ignores a custom readiness
              # probe in values.
              probes:
                startup:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /ping
                      port: http
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 60
                liveness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /ping
                      port: http
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 5
          pod:
            # Follows the server onto immich-vm (dedicated node); inference runs on its iGPU.
            nodeSelector:
              homelab/gpu: intel
            tolerations:
              - key: homelab/dedicated
                operator: Equal
                value: immich
                effect: NoSchedule
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              # Same GIDs as the server, for the same /dev/dri nodes.
              supplementalGroups:
                - 983  # video group on immich-vm
                - 987  # render group on immich-vm
              seccompProfile:
                type: RuntimeDefault
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          # existingClaim excludes size/storageClass/accessMode (chart schema oneOf). The claim is
          # apps/immich/ml-cache-pvc.yaml.
          existingClaim: immich-ml-cache
        tmp:
          enabled: true
          type: emptyDir
          globalMounts:
            - path: /tmp
        run:
          enabled: true
          type: emptyDir
          globalMounts:
            - path: /run

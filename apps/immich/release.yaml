apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 6h
  driftDetection:
    mode: enabled
  rollback:
    cleanupOnFail: true
  chart:
    spec:
      chart: immich
      version: 0.12.0
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: immich
  timeout: 15m
  install:
    remediation:
      retries: 3
  maxHistory: 3
  upgrade:
    remediation:
      retries: 3
      # NEVER rollback immich — migrations are irreversible, rollback corrupts DB
      remediateLastFailure: false
  # Post-renderer to patch service accounts (Helm chart doesn't support per-component serviceAccount)
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: immich-server
            patch: |-
              # standard-tier
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-standard
              # Limit old ReplicaSets to prevent buildup
              - op: add
                path: /spec/revisionHistoryLimit
                value: 2
              # Recreate strategy: avoids quota doubling and advisory lock contention during upgrades
              - op: replace
                path: /spec/strategy
                value:
                  type: Recreate
              - op: replace
                path: /spec/template/spec/serviceAccountName
                value: immich
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
              # GPU transcoding: Replace main container securityContext with privileged mode
              - op: replace
                path: /spec/template/spec/containers/0/securityContext
                value:
                  privileged: true
              # GPU transcoding: Add /dev/dri hostPath volume
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: dri
                  hostPath:
                    path: /dev/dri
                    type: Directory
              # GPU transcoding: Mount /dev/dri to main container
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: dri
                  mountPath: /dev/dri
          - target:
              kind: Deployment
              name: immich-machine-learning
            patch: |-
              # standard-tier
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-standard
              - op: add
                path: /spec/revisionHistoryLimit
                value: 2
              - op: replace
                path: /spec/strategy
                value:
                  type: Recreate
              - op: replace
                path: /spec/template/spec/serviceAccountName
                value: immich
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: rapidocr-models
                  emptyDir: {}
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: rapidocr-models
                  # Hardcoded Python version - update when Immich ML updates Python
                  # Attempted version-independent symlink approach but failed due to permission issues
                  # (can't create symlink in root-owned /opt/venv as user 1000)
                  # Manual update needed ~annually when Python minor version changes
                  mountPath: /opt/venv/lib/python3.11/site-packages/rapidocr/models
          # Strategic merge patch: bump readiness timeoutSeconds 1→5.
          # JSON patch op in the block above silently failed (Kustomize
          # treats multi-doc JSON-patch arrays as SMP when target lacks
          # explicit patch type). SMP on named container works reliably.
          - target:
              kind: Deployment
              name: immich-machine-learning
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: immich-machine-learning
              spec:
                template:
                  spec:
                    containers:
                      - name: main
                        readinessProbe:
                          timeoutSeconds: 5
  # Hardware acceleration (VAAPI) enabled for GPU transcoding on AMD Radeon
  # Requires: privileged container, /dev/dri hostPath, PSS privileged namespace
  values:
    # Service Account configuration (created via separate manifest)
    # Applied globally to all Immich components
    serviceAccount:
      create: false
      name: immich

    # Global image configuration for Renovate/Dependabot tracking
    # See: https://github.com/immich-app/immich-charts/issues/68
    # Kept in sync with the per-component server/machine-learning tags below.
    image:
      tag: v2.7.5

    # Shared configuration for all Immich components
    controllers:
      main:
        containers:
          main:
            env:
              # Database configuration (using PgBouncer pooler for runtime connections)
              DB_HOSTNAME: main-postgres-rw-pooler.databases.svc.cluster.local
              DB_PORT: "5432"
              DB_DATABASE_NAME: immich
              DB_USERNAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-password
                    key: password
              # Redis Sentinel via REDIS_URL=ioredis://<base64(json)>.
              # JSON carries failoverDetector:true (2026-06-28) — ioredis subscribes to the
              # sentinels' +switch-master channel so a node-reboot failover is detected even
              # when the dead-master TCP connection half-opens (ioredis#1314). Without it the
              # client held the stale master and needed a manual rollout restart. Config lives
              # in the SOPS secret immich-redis-url (not visible here).
              REDIS_URL:
                valueFrom:
                  secretKeyRef:
                    name: immich-redis-url
                    key: redis-url
              # Immich-specific settings
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
              IMMICH_METRICS: "true"

    # Immich shared configuration
    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-library

    # Disable built-in Valkey (using external Redis)
    valkey:
      enabled: false

    # Immich Server component
    server:
      enabled: true
      serviceMonitor:
        main:
          labels:
            release: kube-prometheus-stack
      controllers:
        main:
          pod:
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              # Video (985) and render (989) groups for GPU device access
              supplementalGroups:
                - 985  # video group on worker-node
                - 989  # render group on worker-node
              # Pod-level RuntimeDefault (UR2-4 seccomp soak). Pod-level because the main container's
              # securityContext is replaced with privileged:true (GPU) via the postRenderer above.
              seccompProfile:
                type: RuntimeDefault
          initContainers:
            wait-for-database:
              image:
                repository: ghcr.io/cloudnative-pg/postgresql
                tag: 18.4-standard-trixie
                pullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  echo "Waiting for Database CRD to create ${DB_DATABASE_NAME}..."
                  MAX_RETRIES=60
                  RETRY_COUNT=0

                  # Wait for database to be accessible with correct password
                  until pg_isready -h "$DB_HOSTNAME" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_DATABASE_NAME" > /dev/null 2>&1; do
                    RETRY_COUNT=$((RETRY_COUNT + 1))
                    if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                      echo "ERROR: Database not ready after ${MAX_RETRIES} attempts"
                      exit 1
                    fi
                    echo "Waiting for Database CRD (attempt $RETRY_COUNT/$MAX_RETRIES)..."
                    sleep 2
                  done

                  echo "Database ${DB_DATABASE_NAME} is ready!"
              env:
                - name: DB_HOSTNAME
                  value: main-postgres-rw.databases.svc.cluster.local
                - name: DB_PORT
                  value: "5432"
                - name: DB_DATABASE_NAME
                  value: immich
                - name: DB_USERNAME
                  value: immich
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-password
                      key: password
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop:
                    - ALL
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v2.7.5
                pullPolicy: IfNotPresent
              env:
                # Hardware acceleration via VAAPI on AMD Radeon GPU
                # Tested: 27x faster than CPU encoding (privileged container required)
                IMMICH_MEDIA_FFMPEG_ACCEL: vaapi
                LIBVA_DRIVER_NAME: radeonsi
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: "1500m"
                  memory: 5Gi
              # Probe timeout hardened (chart/bjw-s default timeoutSeconds:1) — same reboot-recovery
              # fragility as machine-learning: a CPU-starved /api/server/ping answering in >1s reads
              # as a probe failure and can SIGTERM a healthy pod. timeout 5s + liveness headroom.
              probes:
                startup:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /api/server/ping
                      port: http
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 30
                liveness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /api/server/ping
                      port: http
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 5
              # securityContext overridden via postRenderer patch (privileged: true for GPU)
      # GPU /dev/dri added via postRenderer patches (above)
      # Service port: uses chart default (2283) — no override needed

    # Immich Machine Learning component
    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v2.7.5  # CPU-only (ROCm gfx1036 not supported)
                pullPolicy: IfNotPresent
              env:
                TRANSFORMERS_CACHE: /cache
                # gunicorn 25.1.0 added a "control socket" (default relative path "gunicorn.ctl",
                # joined to the read-only cwd → Errno 30 "Read-only file system"). That failed
                # write intermittently hangs the gunicorn worker fork → ~50% of restarts deadlock
                # at boot (observed 2026-05-31 reboot recovery). immich doesn't use gunicorn's
                # control CLI, so disable it — eliminates the error while keeping readOnlyRootFilesystem.
                GUNICORN_CMD_ARGS: "--no-control-socket"
              # ML resources bumped 2026-06-28: CPU limit 2x (2000m→4000m) for inference throughput;
              # RAM limit +15% (2Gi→2355Mi) — 7d peak hit ~78% of 2Gi, too close to OOM headroom.
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: 4000m
                  memory: 2355Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop:
                    - ALL
              # Probe timeout hardened (chart/bjw-s default timeoutSeconds:1 is too tight). During
              # 2026-05-31 reboot recovery the CPU-starved single ML worker couldn't answer /ping
              # within 1s → every probe "failed" → startup burned its 600s budget then SIGTERM
              # (2 restarts). timeout 5s tolerates slow /ping under load; liveness gets headroom
              # so it can't kill a momentarily-busy worker. Readiness bumped via postRenderer
              # (bjw-s ignores readiness custom probe override in values).
              probes:
                startup:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /ping
                      port: http
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 60
                liveness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /ping
                      port: http
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 5
          pod:
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          size: 10Gi
          storageClass: local-path
          accessMode: ReadWriteOnce
        tmp:
          enabled: true
          type: emptyDir
          globalMounts:
            - path: /tmp
        run:
          enabled: true
          type: emptyDir
          globalMounts:
            - path: /run

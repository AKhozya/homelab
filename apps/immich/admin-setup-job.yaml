apiVersion: batch/v1
kind: Job
metadata:
  name: immich-admin-setup
  namespace: immich
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: immich-admin-setup
    spec:
      serviceAccountName: immich
      automountServiceAccountToken: false
      priorityClassName: homelab-standard
      # Immich-only node. Trade-off accepted 2026-09-06: a scrub-class stall on the VM holds this
      # Job too; it is idempotent and the daily force re-run retries it.
      nodeSelector:
        homelab/gpu: intel
      tolerations:
        - key: homelab/dedicated
          operator: Equal
          value: immich
          effect: NoSchedule
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-migrations
          image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for Immich database migrations to complete..."

              max_attempts=60
              attempt=0

              while [ $attempt -lt $max_attempts ]; do
                attempt=$((attempt + 1))
                echo "Attempt $attempt/$max_attempts: Checking if migrations completed..."

                # Check if the 'user' table exists (created by initial migration)
                # This confirms migrations have run successfully
                if psql -h "$DB_HOSTNAME" -U "$DB_USERNAME" -d "$DB_DATABASE_NAME" \
                  -tAc "SELECT 1 FROM information_schema.tables WHERE table_name='user'" 2>/dev/null | grep -q 1; then
                  echo "✅ Database migrations completed! 'user' table exists."

                  # Double-check server is responding
                  if command -v curl >/dev/null 2>&1; then
                    if curl -sf -m 5 http://immich-server.immich.svc.cluster.local:2283/ > /dev/null 2>&1; then
                      echo "✅ Immich server is also responding!"
                    fi
                  fi

                  exit 0
                fi

                echo "Migrations not complete yet (user table doesn't exist), waiting..."
                sleep 5
              done

              echo "❌ Timeout waiting for database migrations to complete"
              exit 1
          env:
            - name: DB_HOSTNAME
              value: main-postgres-rw.databases.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_USERNAME
              value: immich
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db-password
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: setup
          image: curlimages/curl:8.22.0
          command:
            - /bin/sh
            - -c
            - |
              set -e

              API="http://immich-server.immich.svc.cluster.local:2283"

              # Read isInitialized, never the sign-up error prose: v3.2.0 renamed "The server
              # already has an admin" to "Admin setup is not available", and the prose grep then
              # failed this Job on every daily re-run.
              # `|| config=""` keeps set -e from aborting with no message of its own.
              config=$(curl -sf -m 30 "$API/api/server/config") || config=""
              if [ -z "$config" ]; then
                # Distinct from the missing-field branch below: this one is a retryable outage.
                echo "❌ Could not read $API/api/server/config"
                exit 1
              fi

              # BusyBox grep matches within one line.
              init_true='"isInitialized"[[:space:]]*:[[:space:]]*true'
              init_false='"isInitialized"[[:space:]]*:[[:space:]]*false'

              if echo "$config" | grep -q "$init_true"; then
                echo "⏭️  Admin user already exists, skipping creation"
                exit 0
              elif ! echo "$config" | grep -q "$init_false"; then
                # Fail loudly instead of signing up: a POST at an initialised server returns prose
                # this script must not read, which is the failure mode being removed here.
                echo "❌ No isInitialized in $API/api/server/config"
                echo "$config"
                exit 1
              fi

              echo "Attempting to create admin user..."

              response=$(curl -s -w "\n%{http_code}" -m 30 -X POST \
                "$API/api/auth/admin-sign-up" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                -d "{
                  \"email\": \"${IMMICH_ADMIN_EMAIL}\",
                  \"password\": \"${IMMICH_ADMIN_PASSWORD}\",
                  \"name\": \"${IMMICH_ADMIN_NAME}\"
                }")

              http_code=$(echo "$response" | tail -n1)
              body=$(echo "$response" | sed '$d')

              if [ "$http_code" != "201" ]; then
                echo "❌ Failed to create admin user. HTTP $http_code"
                echo "$body"
                exit 1
              fi

              echo "✅ Admin user created successfully!"
              echo "$body"
          env:
            - name: IMMICH_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: immich-admin-credentials
                  key: email
            - name: IMMICH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-admin-credentials
                  key: password
            - name: IMMICH_ADMIN_NAME
              value: "akhozya"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi

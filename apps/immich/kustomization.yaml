apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - repository.yaml
  - library-pvc.yaml
  - release.yaml
  - admin-setup-job-networkpolicy.yaml
  - admin-setup-job.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - certificate.yaml
  - immich-db-password-secret.yaml
  - immich-redis-url-secret.yaml
  - admin-secret.yaml
  # OIDC config is stored in immich's DB (configured via admin web UI)

components:
  - ../components/allow-dns-egress

apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-vm-heal
  namespace: immich
spec:
  # Every 5 min: on a NAS reboot the VM does NOT auto-start (UI autostart is OFF by
  # design), so this watchdog IS the autostart. The schedule sets how often a stopped
  # VM gets a start attempt. It does not bound VM-down time: if the NAS library is not
  # mounted, the script skips the start, and the next scheduled run tries again.
  schedule: "*/5 * * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 200
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0          # one attempt per tick; the next tick is the retry
      # ssh -o ConnectTimeout bounds the CONNECT only — a session that connects and then
      # hangs (NAS mid-maintenance, 2026-08-15) runs forever and pins a pod, because
      # nothing else caps a Job's runtime. Kept under the 5-min tick so a killed run
      # cannot overlap the next; a healthy run is ~5-20s, so it fires only on a real hang.
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: immich-vm-heal
        spec:
          serviceAccountName: immich-vm-heal
          automountServiceAccountToken: false
          restartPolicy: Never
          priorityClassName: homelab-batch
          # Must run OFF the GPU node so it can heal that node when it is down.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: homelab/gpu
                        operator: NotIn
                        values: ["intel"]
          securityContext:
            runAsNonRoot: true
            # 65534 = nobody, which EXISTS in the alpine/git image's /etc/passwd.
            # ssh calls getpwuid(uid) at startup and aborts ("No user exists for uid")
            # if the uid has no passwd entry — so an arbitrary uid (e.g. distroless
            # 65532) breaks ssh before it connects. nobody resolves cleanly.
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534        # makes the /tmp + /home emptyDirs writable by non-root
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: heal
              # alpine/git bundles the openssh client, so the pod needs no runtime apk
              # install and its egress stays limited to the NAS and DNS.
              image: alpine/git:2.54.0
              command: ["sh", "/heal/immich-vm-heal.sh"]
              env:
                - name: HOME
                  value: /home/heal
                - name: SSH_PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: immich-vm-heal-nas-ssh-key
                      key: ssh-private-key
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "25m"
                  memory: "32Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"
              volumeMounts:
                - name: heal-script
                  mountPath: /heal
                  readOnly: true
                - name: canonical-xml
                  mountPath: /canonical
                  readOnly: true
                - name: known-hosts
                  mountPath: /ssh-known-hosts
                  readOnly: true
                - name: home
                  mountPath: /home/heal
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: heal-script
              configMap:
                name: immich-vm-heal-script
            - name: canonical-xml
              configMap:
                name: immich-vm-domain-xml
            - name: known-hosts
              configMap:
                name: immich-vm-heal-known-hosts
            - name: home
              emptyDir: {}
            - name: tmp
              emptyDir: {}

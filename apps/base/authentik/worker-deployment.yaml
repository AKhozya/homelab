apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
  namespace: authentik
spec:
  replicas: 2
  revisionHistoryLimit: 2
  # Rolling update strategy: delete old pod before creating new
  # Required with 2 replicas + required anti-affinity on 2 worker nodes
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: authentik
      component: worker
  template:
    metadata:
      labels:
        app: authentik
        component: worker
    spec:
      serviceAccountName: authentik
      automountServiceAccountToken: false
      # Allow scheduling on control plane for HA (rolling updates need 3 nodes)
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # Distribute across nodes for HA
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: authentik
                  component: worker
              topologyKey: kubernetes.io/hostname
      # NOTE: Worker waits for server to be ready before starting
      #
      # WHY: Both server and worker run Django migrations on startup. To avoid
      # race conditions ("table already exists" errors), the worker waits for
      # the server's readiness probe to succeed, ensuring migrations are complete
      # before the worker starts. This simple approach eliminates the need for a
      # separate migration Job or complex Flux Kustomization dependencies.
      initContainers:
        - name: wait-for-server
          image: curlimages/curl:8.20.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for Authentik server to be ready..."
              until curl -sf http://authentik-server:9000/-/health/ready/ > /dev/null; do
                echo "Server not ready yet, retrying in 5 seconds..."
                sleep 5
              done
              echo "Server is ready! Worker can start."
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/goauthentik/server:2026.5.0
          # Always pull to prevent digest mismatch across nodes
          # (Authentik re-publishes tags with different builds)
          imagePullPolicy: Always
          command:
            - ak
            - worker
          envFrom:
            - secretRef:
                name: authentik
          # Override PgBouncer host with direct CNPG connection
          # Worker uses server-side cursors (DECLARE CURSOR) for chunked
          # queries like clean_expired_models. PgBouncer transaction pooling
          # breaks these — cursor disappears between fetches, causing
          # InvalidCursorName errors and memory growth from retries.
          # Direct connection preserves cursors across the session.
          env:
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: main-postgres-rw.databases.svc.cluster.local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "600Mi"
            limits:
              cpu: "500m"
              memory: "800Mi"
          volumeMounts:
            - name: media
              mountPath: /data/media
            - name: tmp
              mountPath: /tmp
            - name: certs
              mountPath: /certs
            - name: blueprints-custom
              mountPath: /blueprints/custom
              readOnly: true
      volumes:
        - name: media
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: certs
          emptyDir: {}
        - name: blueprints-custom
          configMap:
            name: authentik-blueprints-custom

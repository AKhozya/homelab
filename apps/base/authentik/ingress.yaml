apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik
  namespace: authentik
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: authentik-redirect-https@kubernetescrd
    external-dns.alpha.kubernetes.io/hostname: authentik.h0melab.work
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - authentik.h0melab.work
      secretName: authentik-tls-secret
  rules:
    - host: authentik.h0melab.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  number: 9000

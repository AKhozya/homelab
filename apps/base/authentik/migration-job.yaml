apiVersion: batch/v1
kind: Job
metadata:
  name: authentik-migration
  namespace: authentik
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: authentik
        component: migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-database
          image: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
          envFrom:
            - secretRef:
                name: authentik
          command:
            - sh
            - -c
            - |
              echo "Waiting for Database CRD to create ${AUTHENTIK_POSTGRESQL__NAME}..."
              MAX_RETRIES=60
              RETRY_COUNT=0

              until pg_isready -h "$AUTHENTIK_POSTGRESQL__HOST" -p "$AUTHENTIK_POSTGRESQL__PORT" -U "$AUTHENTIK_POSTGRESQL__USER" -d "$AUTHENTIK_POSTGRESQL__NAME" > /dev/null 2>&1; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                  echo "ERROR: Database not created by CRD after ${MAX_RETRIES} attempts"
                  exit 1
                fi
                echo "Waiting for Database CRD (attempt $RETRY_COUNT/$MAX_RETRIES)..."
                sleep 2
              done

              echo "Database is ready!"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: migration
          image: ghcr.io/goauthentik/server:2025.8.4
          command:
            - ak
            - migrate
          envFrom:
            - secretRef:
                name: authentik
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

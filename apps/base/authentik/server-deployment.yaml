apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: authentik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik
      component: server
  template:
    metadata:
      labels:
        app: authentik
        component: server
    spec:
      # NOTE: No init containers for database wait or migrations!
      #
      # WHY: Authentik has a migration race condition where both server and worker
      # pods try to run Django migrations on startup, causing "table already exists"
      # errors. To fix this, migrations are run by a separate Job managed by the
      # authentik-migrations Flux Kustomization, which completes BEFORE this
      # deployment is created.
      #
      # See: apps/base/authentik-migrations/migration-job.yaml
      #      clusters/staging/authentik-migrations-kustomization.yaml
      #      clusters/staging/authentik-apps-kustomization.yaml
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/goauthentik/server:2025.8.4
          command:
            - ak
            - server
          ports:
            - containerPort: 9000
              name: http
            - containerPort: 9443
              name: https
          envFrom:
            - secretRef:
                name: authentik
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /-/health/live/
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/health/ready/
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: media
              mountPath: /media
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: media
          emptyDir: {}
        - name: tmp
          emptyDir: {}

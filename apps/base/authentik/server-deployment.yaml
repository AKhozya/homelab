apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: authentik
spec:
  replicas: 2
  revisionHistoryLimit: 2
  # Rolling update strategy: delete old pod before creating new
  # Required with 2 replicas + required anti-affinity on 2 worker nodes
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: authentik
      component: server
  template:
    metadata:
      labels:
        app: authentik
        component: server
    spec:
      serviceAccountName: authentik
      automountServiceAccountToken: false
      # Allow scheduling on control plane for HA (rolling updates need 3 nodes)
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # Distribute across nodes for HA
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: authentik
                  component: server
              topologyKey: kubernetes.io/hostname
      # NOTE: Server pod runs migrations on startup
      #
      # WHY: Both server and worker run Django migrations automatically. To prevent
      # race conditions, the worker has an init container that waits for this server
      # to be ready before starting. This ensures migrations complete before the
      # worker attempts to run them (idempotent, no conflict).
      #
      # See: apps/base/authentik/worker-deployment.yaml (wait-for-server init container)
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/goauthentik/server:2026.5.2
          # Always pull to prevent digest mismatch across nodes
          # (Authentik re-publishes tags with different builds)
          imagePullPolicy: Always
          command:
            - ak
            - server
          ports:
            - containerPort: 9000
              name: http
            - containerPort: 9443
              name: https
          envFrom:
            - secretRef:
                name: authentik
          # Override PgBouncer host with direct CNPG connection.
          # Since v2026.5.0 the server runs the Postgres-backed channel
          # layer (django_channels_postgres), which holds a persistent
          # LISTEN/NOTIFY connection. PgBouncer transaction pooling drops
          # the LISTEN context when it recycles the connection, so flow
          # WebSocket events stop delivering — login hangs at
          # "Authenticating...". Direct connection keeps LISTEN alive.
          # (Worker already does this for server-side cursors — 8c58c6af.)
          env:
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: main-postgres-rw.databases.svc.cluster.local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /-/health/live/
              port: 9000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /-/health/live/
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /-/health/ready/
              port: 9000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "800Mi"
            limits:
              cpu: "1000m"
              memory: "1500Mi"
          volumeMounts:
            - name: media
              mountPath: /data/media
            - name: tmp
              mountPath: /tmp
            - name: blueprints-custom
              mountPath: /blueprints/custom
              readOnly: true
      volumes:
        - name: media
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: blueprints-custom
          configMap:
            name: authentik-blueprints-custom

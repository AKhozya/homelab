apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-network-policy
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      app: authentik
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from traefik namespace for internal access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9443
    # Allow ingress from Cloudflare Tunnel for external access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9443
    # Allow communication between server and worker
    - from:
        - podSelector:
            matchLabels:
              app: authentik
      ports:
        - protocol: TCP
          port: 9000
  egress:
    # Allow PostgreSQL access
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
      ports:
        - protocol: TCP
          port: 5432
    # Allow HTTPS for external auth providers and updates
    - ports:
        - protocol: TCP
          port: 443
    # Allow SMTP for email notifications (Gmail: smtp.gmail.com:587)
    - ports:
        - protocol: TCP
          port: 587

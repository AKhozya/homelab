apiVersion: batch/v1
kind: Job
metadata:
  name: mealie-admin-init
  namespace: mealie
spec:
  ttlSecondsAfterFinished: 86400  # Clean up after 24 hours
  template:
    metadata:
      labels:
        app: mealie-admin-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init-admin
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              export HOME=/tmp/home && \
              pip install --user --no-cache-dir psycopg2-binary bcrypt && \
              python3 /scripts/init-admin.py
          env:
            - name: HOME
              value: "/tmp/home"
          envFrom:
            - secretRef:
                name: mealie-admin-init-secret
          env:
            - name: POSTGRES_SERVER
              value: "main-postgres-pooler.databases.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "mealie"
            - name: POSTGRES_USER
              value: "mealie"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-env
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /tmp/home
      volumes:
        - name: script
          configMap:
            name: mealie-admin-init
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}

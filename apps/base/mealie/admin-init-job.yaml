apiVersion: batch/v1
kind: Job
metadata:
  name: mealie-admin-init
  namespace: mealie
spec:
  ttlSecondsAfterFinished: 86400  # Clean up after 24 hours
  template:
    metadata:
      labels:
        app: mealie-admin-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init-admin
          image: postgres:16-alpine
          command: ["/bin/sh", "/scripts/init-admin.sh"]
          envFrom:
            - secretRef:
                name: mealie-admin-init-secret
          env:
            - name: POSTGRES_SERVER
              value: "main-postgres-pooler.databases.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "mealie"
            - name: POSTGRES_USER
              value: "mealie"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-env
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: mealie-admin-init
            defaultMode: 0555
        - name: tmp
          emptyDir: {}

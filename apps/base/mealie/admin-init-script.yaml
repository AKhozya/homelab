apiVersion: v1
kind: ConfigMap
metadata:
  name: mealie-admin-init
  namespace: mealie
data:
  init-admin.sh: |
    #!/bin/sh
    set -e

    echo "⏳ Waiting for database to be ready..."
    until PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_SERVER" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c '\q' 2>/dev/null; do
      sleep 2
    done
    echo "✓ Database is ready"

    # Check if user exists
    USER_EXISTS=$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_SERVER" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT COUNT(*) FROM users WHERE username = '$ADMIN_USERNAME';")

    if [ "$USER_EXISTS" -gt 0 ]; then
      echo "✓ Admin user '$ADMIN_USERNAME' already exists, skipping creation"
      exit 0
    fi

    echo "Creating admin user '$ADMIN_USERNAME'..."

    # Generate bcrypt hash using htpasswd
    PASSWORD_HASH=$(echo "$ADMIN_PASSWORD" | htpasswd -niBC 12 dummy | cut -d: -f2)

    # Create admin user
    PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_SERVER" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "INSERT INTO users (id, full_name, username, email, password, admin, advanced, group_id, cache_key, can_manage, can_invite, can_organize, login_attemps, auth_method, household_id, can_manage_household, created_at, update_at) VALUES (gen_random_uuid(), '$ADMIN_FULLNAME', '$ADMIN_USERNAME', '$ADMIN_EMAIL', '$PASSWORD_HASH', true, true, '$GROUP_ID', '1234', true, true, true, 0, 'MEALIE', '$HOUSEHOLD_ID', true, NOW(), NOW());"

    echo "✓ Admin user '$ADMIN_USERNAME' created successfully"

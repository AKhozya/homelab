apiVersion: v1
kind: ConfigMap
metadata:
  name: mealie-user-provision-script
  namespace: mealie
data:
  provision-user.sh: |
    #!/bin/sh
    set -e

    echo "Starting mealie user provisioning..."

    # Wait for mealie to be ready
    echo "Waiting for mealie to be available..."
    MAX_RETRIES=60
    RETRY_COUNT=0
    while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
      if curl -sf http://mealie:9000/api/app/about > /dev/null 2>&1; then
        echo "mealie is ready!"
        break
      fi
      echo "mealie not ready yet, waiting... (attempt $((RETRY_COUNT+1))/$MAX_RETRIES)"
      sleep 5
      RETRY_COUNT=$((RETRY_COUNT+1))
    done

    if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
      echo "Error: mealie did not become ready in time"
      exit 1
    fi

    # Check if user already exists by trying to login
    echo "Checking if user already exists..."
    LOGIN_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST http://mealie:9000/api/auth/token \
      -H "Content-Type: application/x-www-form-urlencoded" \
      -d "username=${MEALIE_USER_EMAIL}&password=${MEALIE_USER_PASSWORD}" 2>&1 || true)

    HTTP_CODE=$(echo "$LOGIN_RESPONSE" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2 || echo "0")

    if [ "$HTTP_CODE" = "200" ]; then
      echo "User already exists and can login successfully"
      exit 0
    fi

    # Try to authenticate with default credentials to get admin token
    echo "Authenticating with default credentials..."
    DEFAULT_AUTH=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST http://mealie:9000/api/auth/token \
      -H "Content-Type: application/x-www-form-urlencoded" \
      -d "username=changeme@example.com&password=MyPassword" 2>&1 || true)

    DEFAULT_HTTP_CODE=$(echo "$DEFAULT_AUTH" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2 || echo "0")

    if [ "$DEFAULT_HTTP_CODE" != "200" ]; then
      echo "Error: Cannot authenticate with default credentials. Default user may not exist or credentials changed."
      echo "Please create the first user manually or check default credentials."
      exit 1
    fi

    # Extract access token from response
    ACCESS_TOKEN=$(echo "$DEFAULT_AUTH" | sed 's/HTTP_CODE:.*//' | grep -o '"access_token":"[^"]*"' | cut -d'"' -f4)

    if [ -z "$ACCESS_TOKEN" ]; then
      echo "Error: Failed to extract access token"
      exit 1
    fi

    echo "Successfully authenticated, creating new user..."

    # Create user via API using admin endpoint (v3.0.0+)
    echo "Creating mealie user: $MEALIE_USER_EMAIL"
    RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST http://mealie:9000/api/admin/users \
      -H "Content-Type: application/json" \
      -H "Authorization: Bearer $ACCESS_TOKEN" \
      -d "{
        \"email\": \"$MEALIE_USER_EMAIL\",
        \"username\": \"$MEALIE_USER_USERNAME\",
        \"fullName\": \"$MEALIE_USER_FULLNAME\",
        \"password\": \"$MEALIE_USER_PASSWORD\",
        \"admin\": true,
        \"group\": \"Home\",
        \"advanced\": true
      }" 2>&1)

    HTTP_CODE=$(echo "$RESPONSE" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2)
    BODY=$(echo "$RESPONSE" | sed 's/HTTP_CODE:.*//')

    echo "HTTP Status: $HTTP_CODE"
    echo "Response: $BODY"

    if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
      echo "mealie user created successfully!"
    else
      echo "Error: Failed to create user"
      exit 1
    fi

    # Delete the default insecure user
    echo "Fetching list of users to find default user..."
    USERS_RESPONSE=$(curl -s -X GET http://mealie:9000/api/admin/users \
      -H "Authorization: Bearer $ACCESS_TOKEN" 2>&1)

    # Extract the ID of the default user (changeme@example.com)
    # Looking for pattern: "id":"<uuid>","username":"changeme" or "email":"changeme@example.com"
    DEFAULT_USER_ID=$(echo "$USERS_RESPONSE" | grep -o '"email":"changeme@example.com"[^}]*"id":"[^"]*"' | grep -o '"id":"[^"]*"' | cut -d'"' -f4 | head -1)

    if [ -n "$DEFAULT_USER_ID" ]; then
      echo "Found default user with ID: $DEFAULT_USER_ID"
      echo "Deleting default insecure user..."

      DELETE_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X DELETE "http://mealie:9000/api/admin/users/$DEFAULT_USER_ID" \
        -H "Authorization: Bearer $ACCESS_TOKEN" 2>&1)

      DELETE_HTTP_CODE=$(echo "$DELETE_RESPONSE" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2)

      if [ "$DELETE_HTTP_CODE" = "200" ] || [ "$DELETE_HTTP_CODE" = "204" ]; then
        echo "Default user deleted successfully!"
      else
        echo "Warning: Failed to delete default user (HTTP $DELETE_HTTP_CODE)"
        echo "You may need to delete it manually"
      fi
    else
      echo "Default user not found - may have been deleted already"
    fi

    echo "User provisioning complete!"

apiVersion: v1
kind: ConfigMap
metadata:
  name: mealie-user-provision-script
  namespace: mealie
data:
  provision-user.sh: |
    #!/bin/sh
    set -e

    echo "Starting mealie user provisioning..."

    # Wait for mealie to be ready
    echo "Waiting for mealie to be available..."
    MAX_RETRIES=60
    RETRY_COUNT=0
    while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
      if curl -sf http://mealie:9000/api/app/about > /dev/null 2>&1; then
        echo "mealie is ready!"
        break
      fi
      echo "mealie not ready yet, waiting... (attempt $((RETRY_COUNT+1))/$MAX_RETRIES)"
      sleep 5
      RETRY_COUNT=$((RETRY_COUNT+1))
    done

    if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
      echo "Error: mealie did not become ready in time"
      exit 1
    fi

    # Try to authenticate with default credentials to update them
    echo "Authenticating with default credentials to update them..."
    DEFAULT_AUTH=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST http://mealie:9000/api/auth/token \
      -H "Content-Type: application/x-www-form-urlencoded" \
      -d "username=changeme@example.com&password=MyPassword" 2>&1 || true)

    DEFAULT_HTTP_CODE=$(echo "$DEFAULT_AUTH" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2 || echo "0")

    if [ "$DEFAULT_HTTP_CODE" != "200" ]; then
      echo "Default credentials don't work - checking if they were already updated..."

      # Try logging in with target credentials
      LOGIN_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST http://mealie:9000/api/auth/token \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "username=${MEALIE_USER_EMAIL}&password=${MEALIE_USER_PASSWORD}" 2>&1 || true)

      HTTP_CODE=$(echo "$LOGIN_RESPONSE" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2 || echo "0")

      if [ "$HTTP_CODE" = "200" ]; then
        echo "User credentials already updated successfully"
        exit 0
      else
        echo "Error: Cannot authenticate with either default or target credentials."
        exit 1
      fi
    fi

    # Extract access token and user ID from response
    ACCESS_TOKEN=$(echo "$DEFAULT_AUTH" | sed 's/HTTP_CODE:.*//' | grep -o '"access_token":"[^"]*"' | cut -d'"' -f4)

    if [ -z "$ACCESS_TOKEN" ]; then
      echo "Error: Failed to extract access token"
      exit 1
    fi

    echo "Successfully authenticated, fetching default user details..."

    # Get the current user's details to find their ID
    USER_RESPONSE=$(curl -s -X GET http://mealie:9000/api/users/self \
      -H "Authorization: Bearer $ACCESS_TOKEN" 2>&1)

    USER_ID=$(echo "$USER_RESPONSE" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

    if [ -z "$USER_ID" ]; then
      echo "Error: Failed to extract user ID"
      echo "Response: $USER_RESPONSE"
      exit 1
    fi

    echo "Found default user ID: $USER_ID"
    echo "Updating user credentials to: $MEALIE_USER_EMAIL"

    # Update the user's credentials
    UPDATE_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X PUT "http://mealie:9000/api/users/$USER_ID" \
      -H "Content-Type: application/json" \
      -H "Authorization: Bearer $ACCESS_TOKEN" \
      -d "{
        \"email\": \"$MEALIE_USER_EMAIL\",
        \"username\": \"$MEALIE_USER_USERNAME\",
        \"fullName\": \"$MEALIE_USER_FULLNAME\",
        \"password\": \"$MEALIE_USER_PASSWORD\",
        \"admin\": true,
        \"group\": \"Home\",
        \"advanced\": true
      }" 2>&1)

    HTTP_CODE=$(echo "$UPDATE_RESPONSE" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2)
    BODY=$(echo "$UPDATE_RESPONSE" | sed 's/HTTP_CODE:.*//')

    echo "HTTP Status: $HTTP_CODE"
    echo "Response: $BODY"

    if [ "$HTTP_CODE" = "200" ]; then
      echo "User credentials updated successfully!"
    else
      echo "Error: Failed to update user credentials"
      exit 1
    fi

    echo "User provisioning complete!"

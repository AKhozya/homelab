apiVersion: v1
kind: ConfigMap
metadata:
  name: mealie-user-provision-script
  namespace: mealie
data:
  provision-user.sh: |
    #!/bin/sh
    set -e

    echo "Starting mealie user provisioning..."

    # Wait for mealie to be ready
    echo "Waiting for mealie to be available..."
    MAX_RETRIES=60
    RETRY_COUNT=0
    while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
      if curl -sf http://mealie:9000/api/app/about > /dev/null 2>&1; then
        echo "mealie is ready!"
        break
      fi
      echo "mealie not ready yet, waiting... (attempt $((RETRY_COUNT+1))/$MAX_RETRIES)"
      sleep 5
      RETRY_COUNT=$((RETRY_COUNT+1))
    done

    if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
      echo "Error: mealie did not become ready in time"
      exit 1
    fi

    # Check if user already exists by trying to login
    echo "Checking if user already exists..."
    LOGIN_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST http://mealie:9000/api/auth/token \
      -H "Content-Type: application/x-www-form-urlencoded" \
      -d "username=${MEALIE_USER_EMAIL}&password=${MEALIE_USER_PASSWORD}" 2>&1 || true)

    HTTP_CODE=$(echo "$LOGIN_RESPONSE" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2 || echo "0")

    if [ "$HTTP_CODE" = "200" ]; then
      echo "User already exists and can login successfully"
      exit 0
    fi

    # Create user via API
    echo "Creating mealie user: $MEALIE_USER_EMAIL"
    RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST http://mealie:9000/api/users \
      -H "Content-Type: application/json" \
      -d "{
        \"email\": \"$MEALIE_USER_EMAIL\",
        \"username\": \"$MEALIE_USER_USERNAME\",
        \"fullName\": \"$MEALIE_USER_FULLNAME\",
        \"password\": \"$MEALIE_USER_PASSWORD\",
        \"admin\": true,
        \"group\": \"Home\",
        \"advanced\": true
      }" 2>&1)

    HTTP_CODE=$(echo "$RESPONSE" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2)
    BODY=$(echo "$RESPONSE" | sed 's/HTTP_CODE:.*//')

    echo "HTTP Status: $HTTP_CODE"
    echo "Response: $BODY"

    if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
      echo "mealie user created successfully!"
    else
      echo "Warning: API returned unexpected status"
      # Don't fail completely - user might exist
      exit 0
    fi

    echo "User provisioning complete!"

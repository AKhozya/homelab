apiVersion: v1
kind: ConfigMap
metadata:
  name: mealie-user-provision-script
  namespace: mealie
data:
  provision-user.sh: |
    #!/bin/sh
    set -e

    echo "Starting mealie user provisioning..."

    # Wait for mealie to be ready
    echo "Waiting for mealie to be available..."
    MAX_RETRIES=60
    RETRY_COUNT=0
    while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
      if curl -sf http://mealie:9000/api/app/about > /dev/null 2>&1; then
        echo "mealie is ready!"
        break
      fi
      echo "mealie not ready yet, waiting... (attempt $((RETRY_COUNT+1))/$MAX_RETRIES)"
      sleep 5
      RETRY_COUNT=$((RETRY_COUNT+1))
    done

    if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
      echo "Error: mealie did not become ready in time"
      exit 1
    fi

    # Try to authenticate with default credentials to update them
    echo "Authenticating with default credentials to update them..."
    DEFAULT_AUTH=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST http://mealie:9000/api/auth/token \
      -H "Content-Type: application/x-www-form-urlencoded" \
      -d "username=changeme@example.com&password=MyPassword" 2>&1 || true)

    DEFAULT_HTTP_CODE=$(echo "$DEFAULT_AUTH" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2 || echo "0")

    if [ "$DEFAULT_HTTP_CODE" != "200" ]; then
      echo "Default credentials don't work - checking if they were already updated..."

      # Try logging in with target credentials
      LOGIN_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST http://mealie:9000/api/auth/token \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "username=${MEALIE_USER_EMAIL}&password=${MEALIE_USER_PASSWORD}" 2>&1 || true)

      HTTP_CODE=$(echo "$LOGIN_RESPONSE" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2 || echo "0")

      if [ "$HTTP_CODE" = "200" ]; then
        echo "User credentials already updated successfully"
        exit 0
      else
        echo "Error: Cannot authenticate with either default or target credentials."
        exit 1
      fi
    fi

    # Extract access token and user ID from response
    ACCESS_TOKEN=$(echo "$DEFAULT_AUTH" | sed 's/HTTP_CODE:.*//' | grep -o '"access_token":"[^"]*"' | cut -d'"' -f4)

    if [ -z "$ACCESS_TOKEN" ]; then
      echo "Error: Failed to extract access token"
      exit 1
    fi

    echo "Successfully authenticated, fetching default user details..."

    # Get the current user's details to find their ID
    USER_RESPONSE=$(curl -s -X GET http://mealie:9000/api/users/self \
      -H "Authorization: Bearer $ACCESS_TOKEN" 2>&1)

    USER_ID=$(echo "$USER_RESPONSE" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

    if [ -z "$USER_ID" ]; then
      echo "Error: Failed to extract user ID"
      echo "Response: $USER_RESPONSE"
      exit 1
    fi

    echo "Found default user ID: $USER_ID"
    echo "Updating user credentials to: $MEALIE_USER_EMAIL"

    # First, get the full user object to preserve all required fields
    echo "Fetching full user details..."
    USER_DETAIL_RESPONSE=$(curl -s -X GET "http://mealie:9000/api/admin/users/$USER_ID" \
      -H "Authorization: Bearer $ACCESS_TOKEN" 2>&1)

    # Extract all required fields
    AUTH_METHOD=$(echo "$USER_DETAIL_RESPONSE" | grep -o '"authMethod":"[^"]*"' | cut -d'"' -f4)
    GROUP=$(echo "$USER_DETAIL_RESPONSE" | grep -o '"group":"[^"]*"' | cut -d'"' -f4)
    HOUSEHOLD=$(echo "$USER_DETAIL_RESPONSE" | grep -o '"household":"[^"]*"' | cut -d'"' -f4)
    GROUP_ID=$(echo "$USER_DETAIL_RESPONSE" | grep -o '"groupId":"[^"]*"' | cut -d'"' -f4)
    GROUP_SLUG=$(echo "$USER_DETAIL_RESPONSE" | grep -o '"groupSlug":"[^"]*"' | cut -d'"' -f4)
    HOUSEHOLD_ID=$(echo "$USER_DETAIL_RESPONSE" | grep -o '"householdId":"[^"]*"' | cut -d'"' -f4)
    HOUSEHOLD_SLUG=$(echo "$USER_DETAIL_RESPONSE" | grep -o '"householdSlug":"[^"]*"' | cut -d'"' -f4)
    CACHE_KEY=$(echo "$USER_DETAIL_RESPONSE" | grep -o '"cacheKey":"[^"]*"' | cut -d'"' -f4)

    # Update profile via admin endpoint (without password first)
    echo "Updating user profile via admin endpoint..."
    UPDATE_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X PUT "http://mealie:9000/api/admin/users/$USER_ID" \
      -H "Content-Type: application/json" \
      -H "Authorization: Bearer $ACCESS_TOKEN" \
      -d "{
        \"id\": \"$USER_ID\",
        \"email\": \"$MEALIE_USER_EMAIL\",
        \"username\": \"$MEALIE_USER_USERNAME\",
        \"fullName\": \"$MEALIE_USER_FULLNAME\",
        \"authMethod\": \"$AUTH_METHOD\",
        \"admin\": true,
        \"canManage\": true,
        \"canInvite\": true,
        \"canOrganize\": true,
        \"canManageHousehold\": true,
        \"advanced\": true,
        \"group\": \"$GROUP\",
        \"household\": \"$HOUSEHOLD\",
        \"groupId\": \"$GROUP_ID\",
        \"groupSlug\": \"$GROUP_SLUG\",
        \"householdId\": \"$HOUSEHOLD_ID\",
        \"householdSlug\": \"$HOUSEHOLD_SLUG\",
        \"cacheKey\": \"$CACHE_KEY\"
      }" 2>&1)

    HTTP_CODE=$(echo "$UPDATE_RESPONSE" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2)
    BODY=$(echo "$UPDATE_RESPONSE" | sed 's/HTTP_CODE:.*//')

    echo "HTTP Status: $HTTP_CODE"
    echo "Response: $BODY"

    if [ "$HTTP_CODE" != "200" ]; then
      echo "Error: Failed to update user profile"
      exit 1
    fi

    echo "User profile updated successfully!"

    # Now update the password using password change endpoint
    echo "Updating password..."
    PASSWORD_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X PUT "http://mealie:9000/api/users/$USER_ID/password" \
      -H "Content-Type: application/json" \
      -H "Authorization: Bearer $ACCESS_TOKEN" \
      -d "{
        \"currentPassword\": \"MyPassword\",
        \"newPassword\": \"$MEALIE_USER_PASSWORD\"
      }" 2>&1)

    PASS_HTTP_CODE=$(echo "$PASSWORD_RESPONSE" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2)
    PASS_BODY=$(echo "$PASSWORD_RESPONSE" | sed 's/HTTP_CODE:.*//')

    echo "Password update HTTP Status: $PASS_HTTP_CODE"
    echo "Password update Response: $PASS_BODY"

    if [ "$PASS_HTTP_CODE" = "200" ]; then
      echo "Password updated successfully!"
    else
      echo "Warning: Failed to update password via API (HTTP $PASS_HTTP_CODE)"
      echo "You may need to change it manually"
    fi

    echo "User provisioning complete!"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-ngx
  template:
    metadata:
      labels:
        app: paperless-ngx
    spec:
      # securityContext temporarily removed for testing
      # fsGroup: 1000
      # runAsUser: 1000
      # runAsGroup: 1000
      # runAsNonRoot: true
      # seccompProfile:
      #   type: RuntimeDefault
      # initContainers temporarily removed for testing
      # - name: wait-for-database-crd
      #   image: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
      containers:
        - name: paperless-ngx
          image: ghcr.io/paperless-ngx/paperless-ngx:2.18.4
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: paperless-env
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: paperless-data
              mountPath: /usr/src/paperless/data
            - name: paperless-media
              mountPath: /usr/src/paperless/media
            - name: paperless-export
              mountPath: /usr/src/paperless/export
            - name: paperless-consume
              mountPath: /usr/src/paperless/consume
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: paperless-data
          persistentVolumeClaim:
            claimName: paperless-data-pvc
        - name: paperless-media
          persistentVolumeClaim:
            claimName: paperless-data-pvc
        - name: paperless-export
          persistentVolumeClaim:
            claimName: paperless-data-pvc
        - name: paperless-consume
          persistentVolumeClaim:
            claimName: paperless-data-pvc
        - name: tmp
          emptyDir: {}

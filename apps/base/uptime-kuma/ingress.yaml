apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: uptime-kuma-redirect-https@kubernetescrd
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - uptime.h0melab.work
      secretName: uptime-kuma-tls-secret
  rules:
    - host: uptime.h0melab.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  number: 3001

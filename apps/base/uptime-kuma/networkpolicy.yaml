apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: uptime-kuma-network-policy
  namespace: uptime-kuma
spec:
  podSelector:
    matchLabels:
      app: uptime-kuma
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from traefik namespace for internal access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3001
    # Allow ingress from same namespace (for setup job)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3001
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow HTTPS for monitoring external services
    - ports:
        - protocol: TCP
          port: 443
    # Allow HTTP for monitoring services
    - ports:
        - protocol: TCP
          port: 80
    # Allow monitoring services in other namespaces
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 9000

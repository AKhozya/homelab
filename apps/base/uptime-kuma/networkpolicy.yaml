apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: uptime-kuma-network-policy
  namespace: uptime-kuma
spec:
  podSelector:
    matchLabels:
      app: uptime-kuma
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from traefik namespace for internal access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3001
    # Allow ingress from same namespace (for setup job)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3001
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow HTTPS for monitoring external services
    - ports:
        - protocol: TCP
          port: 443
    # Allow HTTP for monitoring services
    - ports:
        - protocol: TCP
          port: 80
    # Allow monitoring services in other namespaces
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 2000        # Cloudflare Tunnel metrics
        - protocol: TCP
          port: 3000        # Grafana
        - protocol: TCP
          port: 3001        # Uptime Kuma
        - protocol: TCP
          port: 3005        # Audiobookshelf
        - protocol: TCP
          port: 5000        # HomeHub
        - protocol: TCP
          port: 3306        # MySQL direct
        - protocol: TCP
          port: 6446        # MySQL Router
        - protocol: TCP
          port: 5432        # PostgreSQL
        - protocol: TCP
          port: 5678        # N8N
        - protocol: TCP
          port: 5984        # CouchDB (Obsidian)
        - protocol: TCP
          port: 6379        # Redis
        - protocol: TCP
          port: 8000        # Paperless-NGX
        - protocol: TCP
          port: 8080        # Various apps (Immich, Stirling PDF)
        - protocol: TCP
          port: 8123        # Home Assistant
        - protocol: TCP
          port: 9000        # Mealie, Authentik
        - protocol: TCP
          port: 8428        # VictoriaMetrics VMSingle
        - protocol: TCP
          port: 9090        # Prometheus, Linkding
        - protocol: TCP
          port: 9093        # Alertmanager
    # Allow monitoring K8s node infrastructure (host network)
    # Nodes: control-plane (.127), worker-node (.129), worker-node-2 (.126)
    - to:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - protocol: TCP
          port: 65300       # SSH (custom port)
        - protocol: TCP
          port: 10250       # Kubelet API
    # Allow ICMP (ping) to nodes - rule without ports allows all protocols
    - to:
        - ipBlock:
            cidr: 192.168.1.0/24

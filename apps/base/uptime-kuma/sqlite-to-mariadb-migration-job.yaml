apiVersion: batch/v1
kind: Job
metadata:
  name: uptime-kuma-sqlite-to-mariadb-migration
  namespace: uptime-kuma
spec:
  ttlSecondsAfterFinished: 3600  # Keep job for 1 hour after completion
  template:
    metadata:
      labels:
        app: uptime-kuma-migration
    spec:
      serviceAccountName: uptime-kuma
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate-data
          image: python:3.12-alpine
          command:
            - sh
            - -c
            - |
              set -e
              echo "=== Starting SQLite to MariaDB Migration ==="

              # Install pymysql (pure Python, no root needed)
              echo "Installing pymysql..."
              pip install --user --no-cache-dir pymysql
              export PATH=$HOME/.local/bin:$PATH

              # Verify SQLite database exists
              if [ ! -f "/data/kuma.db" ]; then
                echo "ERROR: SQLite database not found at /data/kuma.db"
                exit 1
              fi

              echo "SQLite database found: $(ls -lh /data/kuma.db)"

              # Create backup of SQLite database
              echo "Creating backup of SQLite database..."
              cp /data/kuma.db /data/kuma.db.backup-$(date +%Y%m%d_%H%M%S)
              echo "Backup created successfully"

              # Run Python migration script
              python3 << 'PYTHON_SCRIPT'
              import sqlite3
              import pymysql
              import os
              import sys
              from datetime import datetime

              # Configuration
              SQLITE_DB = "/data/kuma.db"
              MARIADB_HOST = "main-mariadb-primary.databases.svc.cluster.local"
              MARIADB_PORT = 3306
              MARIADB_USER = "uptimekuma"
              MARIADB_PASSWORD = os.environ.get("MARIADB_PASSWORD")
              MARIADB_DB = "uptimekuma"

              # Tables to migrate (user priorities: user, monitors, 2FA, settings)
              # EXCLUDE: heartbeat, stat_daily, stat_hourly, stat_minutely, notification_sent_history
              TABLES_TO_MIGRATE = [
                  "user",
                  "monitor",
                  "notification",
                  "setting",
                  "group",
                  "monitor_group",
                  "monitor_notification",
                  "monitor_tag",
                  "tag",
                  "api_key",
                  "docker_host",
                  "proxy",
                  "status_page",
                  "status_page_cname",
                  "incident",
                  "maintenance",
                  "maintenance_status_page",
                  "monitor_maintenance",
                  "monitor_tls_info",
                  "remote_browser",
                  "knex_migrations",
                  "knex_migrations_lock"
              ]

              print("\n=== Connecting to databases ===")

              # Connect to SQLite
              try:
                  sqlite_conn = sqlite3.connect(SQLITE_DB)
                  sqlite_conn.row_factory = sqlite3.Row
                  sqlite_cursor = sqlite_conn.cursor()
                  print(f"✓ Connected to SQLite: {SQLITE_DB}")
              except Exception as e:
                  print(f"✗ Failed to connect to SQLite: {e}")
                  sys.exit(1)

              # Connect to MariaDB
              try:
                  mariadb_conn = pymysql.connect(
                      host=MARIADB_HOST,
                      port=MARIADB_PORT,
                      user=MARIADB_USER,
                      password=MARIADB_PASSWORD,
                      database=MARIADB_DB,
                      charset='utf8mb4'
                  )
                  mariadb_cursor = mariadb_conn.cursor()
                  print(f"✓ Connected to MariaDB: {MARIADB_HOST}:{MARIADB_PORT}/{MARIADB_DB}")
              except Exception as e:
                  print(f"✗ Failed to connect to MariaDB: {e}")
                  sys.exit(1)

              print("\n=== Starting table migration ===")
              print(f"Migrating {len(TABLES_TO_MIGRATE)} tables (excluding heartbeat and stat_* tables)")

              total_rows = 0
              for table in TABLES_TO_MIGRATE:
                  try:
                      # Get row count from SQLite
                      sqlite_cursor.execute(f"SELECT COUNT(*) FROM {table}")
                      row_count = sqlite_cursor.fetchone()[0]

                      if row_count == 0:
                          print(f"  {table}: 0 rows (skipping)")
                          continue

                      # Get all data from SQLite
                      sqlite_cursor.execute(f"SELECT * FROM {table}")
                      rows = sqlite_cursor.fetchall()

                      if len(rows) == 0:
                          print(f"  {table}: 0 rows (skipping)")
                          continue

                      # Get column names
                      columns = [description[0] for description in sqlite_cursor.description]

                      # Insert data into MariaDB
                      placeholders = ', '.join(['%s'] * len(columns))
                      column_names = ', '.join([f"`{col}`" for col in columns])
                      insert_sql = f"INSERT IGNORE INTO `{table}` ({column_names}) VALUES ({placeholders})"

                      # Convert rows to tuples
                      data = [tuple(row) for row in rows]

                      # Execute batch insert
                      mariadb_cursor.executemany(insert_sql, data)
                      mariadb_conn.commit()

                      inserted = mariadb_cursor.rowcount
                      total_rows += inserted
                      print(f"  {table}: {inserted}/{row_count} rows migrated")

                  except Exception as e:
                      print(f"  {table}: ERROR - {e}")
                      # Continue with other tables
                      continue

              print(f"\n=== Migration Summary ===")
              print(f"Total rows migrated: {total_rows}")
              print(f"Tables processed: {len(TABLES_TO_MIGRATE)}")
              print(f"\nExcluded tables (as requested):")
              print(f"  - heartbeat")
              print(f"  - stat_daily")
              print(f"  - stat_hourly")
              print(f"  - stat_minutely")
              print(f"  - notification_sent_history")

              # Verify critical tables
              print(f"\n=== Verifying Critical Tables ===")
              critical_tables = ["user", "monitor", "notification", "setting"]
              for table in critical_tables:
                  mariadb_cursor.execute(f"SELECT COUNT(*) FROM `{table}`")
                  count = mariadb_cursor.fetchone()[0]
                  print(f"  {table}: {count} rows")

              # Close connections
              sqlite_conn.close()
              mariadb_conn.close()

              print(f"\n=== Migration Complete ===")
              print(f"SQLite backup: /data/kuma.db.backup-*")
              print(f"Original SQLite: /data/kuma.db (kept for rollback)")
              PYTHON_SCRIPT

              echo ""
              echo "Migration job finished successfully"
          env:
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uptime-kuma-mariadb-credentials
                  key: password
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data-pvc

apiVersion: batch/v1
kind: Job
metadata:
  name: uptime-kuma-fix-permissions
  namespace: uptime-kuma
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: uptime-kuma
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsUser: 0  # Need root for chown
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: fix-permissions
        image: busybox:1.37.0
        command: ['sh', '-c', 'chown -R 1000:1000 /app/data && echo "Ownership fixed to 1000:1000"']
        volumeMounts:
        - name: data
          mountPath: /app/data
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          runAsUser: 0
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "DAC_OVERRIDE"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: uptime-kuma-data-pvc

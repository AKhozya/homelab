apiVersion: batch/v1
kind: Job
metadata:
  name: uptime-kuma-setup
  namespace: uptime-kuma
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  template:
    metadata:
      labels:
        app: uptime-kuma-setup
    spec:
      serviceAccountName: uptime-kuma
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: python:3.14.4-slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              export HOME=/tmp
              echo "Installing uptime-kuma-api..."
              pip install --quiet --user uptime-kuma-api

              echo "Waiting for Uptime Kuma to be ready..."
              max_attempts=30
              attempt=0
              while [ $attempt -lt $max_attempts ]; do
                attempt=$((attempt + 1))
                if python3 -c "import urllib.request; urllib.request.urlopen('http://uptime-kuma.uptime-kuma.svc.cluster.local:3001', timeout=5)" 2>/dev/null; then
                  echo "Uptime Kuma is ready."
                  break
                fi
                echo "Attempt $attempt/$max_attempts: not ready, retrying in 2s..."
                sleep 2
              done

              if [ $attempt -ge $max_attempts ]; then
                echo "Uptime Kuma not ready after $max_attempts attempts"
                exit 1
              fi

              echo "Setting up admin user..."

              python3 << 'PYEOF'
              from uptime_kuma_api import UptimeKumaApi
              import os, time

              max_retries = 5
              for i in range(max_retries):
                  try:
                      api = UptimeKumaApi('http://uptime-kuma.uptime-kuma.svc.cluster.local:3001')
                      break
                  except Exception as e:
                      if i == max_retries - 1:
                          raise
                      print(f"WebSocket connect attempt {i+1}/{max_retries} failed: {e}, retrying in 3s...")
                      time.sleep(3)

              if api.need_setup():
                  print("Setting up admin user...")
                  api.setup(
                      username=os.environ['UPTIME_KUMA_USERNAME'],
                      password=os.environ['UPTIME_KUMA_PASSWORD']
                  )
                  print("Admin user created successfully!")
              else:
                  print("Uptime Kuma is already set up. Skipping setup.")

              # Login for monitor management
              api.login(os.environ['UPTIME_KUMA_USERNAME'], os.environ['UPTIME_KUMA_PASSWORD'])

              from uptime_kuma_api import MonitorType

              # Desired monitors (name → spec). add_monitor signature varies
              # between uptime-kuma-api versions; we pass kwargs the lib accepts.
              desired = [
                  {
                      "name": "Redis HA Master",
                      "type": MonitorType.PORT,
                      "hostname": "redis-replication-master.databases.svc.cluster.local",
                      "port": 6379,
                      "interval": 60,
                  },
                  {
                      "name": "Redis HA Sentinel",
                      "type": MonitorType.PORT,
                      "hostname": "redis-sentinel-sentinel.databases.svc.cluster.local",
                      "port": 26379,
                      "interval": 60,
                  },
                  {
                      "name": "Blocky DNS (worker-node .129)",
                      "type": MonitorType.DNS,
                      "hostname": "h0melab.work",
                      "port": 53,
                      "dns_resolve_type": "A",
                      "dns_resolve_server": "192.168.1.129",
                      "interval": 60,
                  },
                  {
                      "name": "Blocky DNS (worker-node-2 .126)",
                      "type": MonitorType.DNS,
                      "hostname": "h0melab.work",
                      "port": 53,
                      "dns_resolve_type": "A",
                      "dns_resolve_server": "192.168.1.126",
                      "interval": 60,
                  },
              ]
              desired_names = {m["name"] for m in desired}

              # Names to retire — stale monitors pointing at removed/decommissioned services
              retire_names = {
                  "Redis",          # old standalone — superseded by Redis HA Master + Sentinel
                  "Redis Master",
                  "redis-master",
                  "redis",
                  "Prometheus",     # Prometheus pod removed — VMSingle replaces (no Service exists)
                  "AdGuard",        # AdGuard retired (Blocky DNS replaces)
                  "Discounts",      # discount-bandit ns removed
              }

              raw_monitors = api.get_monitors()
              print(f"DEBUG: get_monitors returned type={type(raw_monitors).__name__} len={len(raw_monitors) if hasattr(raw_monitors, '__len__') else '?'}")
              if isinstance(raw_monitors, dict):
                  monitor_iter = list(raw_monitors.values())
              else:
                  monitor_iter = list(raw_monitors)
              print(f"DEBUG: monitor names: {[m.get('name','?') for m in monitor_iter]}")
              existing = {m["name"]: m for m in monitor_iter}

              # Delete retired monitors
              for name in retire_names:
                  if name in existing:
                      print(f"Deleting retired monitor: {name} (id={existing[name]['id']})")
                      api.delete_monitor(existing[name]["id"])

              # Create missing desired monitors (idempotent on name)
              for spec in desired:
                  if spec["name"] in existing:
                      print(f"Monitor exists: {spec['name']} (skipping)")
                      continue
                  print(f"Creating monitor: {spec['name']}")
                  api.add_monitor(**spec)

              api.disconnect()
              PYEOF

              echo "Setup complete!"
          env:
            - name: UPTIME_KUMA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: uptime-kuma-admin
                  key: username
            - name: UPTIME_KUMA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uptime-kuma-admin
                  key: password
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}

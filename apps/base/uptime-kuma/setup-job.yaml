apiVersion: batch/v1
kind: Job
metadata:
  name: uptime-kuma-setup
  namespace: uptime-kuma
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: uptime-kuma-setup
    spec:
      serviceAccountName: uptime-kuma
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: python:3.14-slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              export HOME=/tmp
              echo "Installing uptime-kuma-api..."
              pip install --quiet --user uptime-kuma-api

              echo "Waiting 10 seconds for Uptime Kuma to be ready..."
              sleep 10

              echo "Setting up admin user..."

              python3 << 'PYEOF'
              from uptime_kuma_api import UptimeKumaApi
              import os

              api = UptimeKumaApi('http://uptime-kuma.uptime-kuma.svc.cluster.local:3001')

              # Check if setup is needed
              if api.need_setup():
                  print("Setting up admin user...")
                  api.setup(
                      username=os.environ['UPTIME_KUMA_USERNAME'],
                      password=os.environ['UPTIME_KUMA_PASSWORD']
                  )
                  print("Admin user created successfully!")
              else:
                  print("Uptime Kuma is already set up.")

              # Login to create monitors
              print("Logging in to create monitors...")
              api.login(
                  username=os.environ['UPTIME_KUMA_USERNAME'],
                  password=os.environ['UPTIME_KUMA_PASSWORD']
              )

              # Define monitors to create
              monitors = [
                  {"name": "Discount Bandit", "url": "https://discounts.h0melab.work"},
              ]

              # Get existing monitors
              existing_monitors = {m['name']: m for m in api.get_monitors()}

              # Create or update monitors
              for monitor_config in monitors:
                  if monitor_config['name'] in existing_monitors:
                      print(f"Monitor '{monitor_config['name']}' already exists. Skipping.")
                  else:
                      print(f"Creating monitor '{monitor_config['name']}'...")
                      api.add_monitor(
                          type="http",
                          name=monitor_config['name'],
                          url=monitor_config['url'],
                          interval=60,
                          retryInterval=60,
                          maxretries=3,
                          accepted_statuscodes=["200-299", "302"]
                      )
                      print(f"Monitor '{monitor_config['name']}' created successfully!")

              api.disconnect()
              PYEOF

              echo "Setup complete!"
          env:
            - name: UPTIME_KUMA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: uptime-kuma-admin
                  key: username
            - name: UPTIME_KUMA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uptime-kuma-admin
                  key: password
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}

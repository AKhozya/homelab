apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich
  namespace: immich
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: immich
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: immich
      ports:
        - protocol: TCP
          port: 3003
        - protocol: TCP
          port: 6379
    - from:
        - podSelector:
            matchLabels:
              app: immich-admin-setup
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow PostgreSQL database access
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              cnpg.io/cluster: main-postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow Redis access
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow inter-pod communication (ML <-> Server)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: immich
      ports:
        - protocol: TCP
          port: 3003
        - protocol: TCP
          port: 8080
    # Allow HTTPS for ML model downloads (modelscope.cn, huggingface.co)
    # No 'to' selector = allow to any destination (including internet)
    - ports:
        - protocol: TCP
          port: 443

apiVersion: batch/v1
kind: Job
metadata:
  name: immich-admin-setup
  namespace: immich
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: immich-admin-setup
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-server
          image: curlimages/curl:8.16.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for Immich server to be ready..."

              max_attempts=60
              attempt=0

              while [ $attempt -lt $max_attempts ]; do
                attempt=$((attempt + 1))
                echo "Attempt $attempt/$max_attempts: Checking server health..."

                # Try to connect to the server (any endpoint)
                if curl -sf -m 5 http://immich-server.immich.svc.cluster.local:8080/ > /dev/null 2>&1; then
                  echo "✅ Immich server is responding!"
                  sleep 5  # Give it a few more seconds to fully initialize
                  exit 0
                fi

                echo "Server not ready yet, waiting..."
                sleep 5
              done

              echo "❌ Timeout waiting for Immich server to be ready"
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
      containers:
        - name: setup
          image: curlimages/curl:8.16.0
          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "Attempting to create admin user..."

              # Try to sign up admin user
              response=$(curl -s -w "\n%{http_code}" -m 30 -X POST \
                "http://immich-server.immich.svc.cluster.local:8080/api/auth/admin-sign-up" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                -d "{
                  \"email\": \"${IMMICH_ADMIN_EMAIL}\",
                  \"password\": \"${IMMICH_ADMIN_PASSWORD}\",
                  \"name\": \"${IMMICH_ADMIN_NAME}\"
                }")

              http_code=$(echo "$response" | tail -n1)
              body=$(echo "$response" | sed '$d')

              if [ "$http_code" = "201" ]; then
                echo "✅ Admin user created successfully!"
                echo "$body"
              elif echo "$body" | grep -q "already has an admin"; then
                echo "⏭️  Admin user already exists, skipping creation"
              else
                echo "❌ Failed to create admin user. HTTP $http_code"
                echo "$body"
                exit 1
              fi

              echo "Admin user setup complete!"
          env:
            - name: IMMICH_ADMIN_EMAIL
              value: "alexander.khozya@gmail.com"
            - name: IMMICH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-admin-credentials
                  key: password
            - name: IMMICH_ADMIN_NAME
              value: "akhozya"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]

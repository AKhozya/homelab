apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 6h
  chart:
    spec:
      chart: immich
      version: 0.10.x
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: immich
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  values:
    # Global image configuration - upgrade to v2.1.0 for localhost binding fix
    image:
      tag: v2.1.0

    # Shared configuration for all Immich components
    controllers:
      main:
        containers:
          main:
            env:
              # Known issue: Immich v2.0.0 binds to localhost only despite HOST env var
              # See: https://github.com/immich-app/immich/issues/13501
              # Attempted fix with pod IP via downward API - HOST var sets correctly but
              # Immich still binds to [::1]:2283. Likely requires upgrade to v2.1.0+
              HOST:
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              # Database configuration
              DB_HOSTNAME: main-postgres-rw.databases.svc.cluster.local
              DB_PORT: "5432"
              DB_DATABASE_NAME: immich
              DB_USERNAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-password
                    key: password
              # Redis configuration
              REDIS_HOSTNAME: redis.databases.svc.cluster.local
              REDIS_PORT: "6379"
              REDIS_USERNAME: immich
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-redis-password
                    key: password
              # Immich-specific settings
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
              PUBLIC_IMMICH_SERVER_URL: https://immich.h0melab.work
              IMMICH_METRICS: "true"

    # Immich shared configuration
    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-library

    # Disable built-in Valkey (using external Redis)
    valkey:
      enabled: false

    # Immich Server component
    server:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v2.1.0
                pullPolicy: IfNotPresent
              env:
                # Server binding fix for localhost-only binding issue
                # See: https://github.com/immich-app/immich/issues/13501
                HOST:
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: 2000m
                  memory: 4Gi

    # Immich Machine Learning component
    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v2.1.0
                pullPolicy: IfNotPresent
              env:
                TRANSFORMERS_CACHE: /cache
              resources:
                requests:
                  cpu: 200m
                  memory: 1Gi
                limits:
                  cpu: 2000m
                  memory: 4Gi
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          size: 10Gi
          storageClass: local-path
          accessMode: ReadWriteOnce

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 6h
  chart:
    spec:
      chart: immich
      version: 0.10.x
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: immich
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  postRenderers:
    - kustomize:
        patches:
          # Server: /dev/dri device mount (kept for future VAAPI re-enabling, currently disabled)
          - target:
              kind: Deployment
              name: immich-server
            patch: |
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: dri-devices
                  hostPath:
                    path: /dev/dri
                    type: Directory
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: dri-devices
                  mountPath: /dev/dri
  values:
    # Global image configuration for Renovate/Dependabot tracking
    # See: https://github.com/immich-app/immich-charts/issues/68
    image:
      tag: v2.1.0

    # Shared configuration for all Immich components
    controllers:
      main:
        containers:
          main:
            env:
              # Database configuration
              DB_HOSTNAME: main-postgres-rw.databases.svc.cluster.local
              DB_PORT: "5432"
              DB_DATABASE_NAME: immich
              DB_USERNAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-password
                    key: password
              # Redis configuration
              REDIS_HOSTNAME: redis.databases.svc.cluster.local
              REDIS_PORT: "6379"
              REDIS_USERNAME: immich
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-redis-password
                    key: password
              # Immich-specific settings
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
              PUBLIC_IMMICH_SERVER_URL: https://immich.h0melab.work
              IMMICH_METRICS: "true"

    # Immich shared configuration
    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-library

    # Disable built-in Valkey (using external Redis)
    valkey:
      enabled: false

    # Immich Server component
    server:
      enabled: true
      controllers:
        main:
          initContainers:
            wait-for-database:
              image:
                repository: ghcr.io/cloudnative-pg/postgresql
                tag: 18-minimal-trixie
                pullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  echo "Waiting for Database CRD to create ${DB_DATABASE_NAME}..."
                  MAX_RETRIES=60
                  RETRY_COUNT=0

                  # Wait for database to be accessible with correct password
                  until pg_isready -h "$DB_HOSTNAME" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_DATABASE_NAME" > /dev/null 2>&1; do
                    RETRY_COUNT=$((RETRY_COUNT + 1))
                    if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                      echo "ERROR: Database not ready after ${MAX_RETRIES} attempts"
                      exit 1
                    fi
                    echo "Waiting for Database CRD (attempt $RETRY_COUNT/$MAX_RETRIES)..."
                    sleep 2
                  done

                  echo "Database ${DB_DATABASE_NAME} is ready!"
              env:
                - name: DB_HOSTNAME
                  value: main-postgres-rw.databases.svc.cluster.local
                - name: DB_PORT
                  value: "5432"
                - name: DB_DATABASE_NAME
                  value: immich
                - name: DB_USERNAME
                  value: immich
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-password
                      key: password
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v2.1.0
                pullPolicy: IfNotPresent
              env:
                # Hardware acceleration disabled due to buggy Mesa VAAPI encoding on Radeon 610M
                # CPU-only encoding is faster than VAAPI (which fails and retries before CPU fallback)
                # Settings like CRF, preset, codec are configured via UI
                IMMICH_MEDIA_FFMPEG_ACCEL: disabled
              resources:
                requests:
                  cpu: 200m
                  memory: 1Gi
                limits:
                  cpu: 16000m  # Temporarily increased for bulk photo import (CPU transcoding)
                  memory: 8Gi  # Temporarily increased for bulk photo import
              securityContext:
                # No privileged access needed for CPU-only encoding
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                runAsNonRoot: false
            # Socat sidecar to forward traffic from 0.0.0.0:8080 to [::1]:2283
            # Workaround for Immich localhost-only binding issue
            proxy:
              image:
                repository: alpine/socat
                tag: 1.8.0.3
                pullPolicy: IfNotPresent
              args:
                - "TCP4-LISTEN:8080,fork,reuseaddr,bind=0.0.0.0"
                - "TCP:[::1]:2283"
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
      # Service configuration - point to socat proxy port
      service:
        main:
          ports:
            http:
              port: 8080
              targetPort: 8080
      # /dev/dri device mount via Kustomize patch (kept for future use, currently disabled)
      # Hardware acceleration disabled - buggy Mesa VAAPI encoding on Radeon 610M

    # Immich Machine Learning component
    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v2.1.0  # CPU-only (ROCm gfx1036 not supported)
                pullPolicy: IfNotPresent
              env:
                TRANSFORMERS_CACHE: /cache
              resources:
                requests:
                  cpu: 200m
                  memory: 2Gi
                limits:
                  cpu: 4000m  # Temporarily increased for bulk photo import
                  memory: 8Gi  # Temporarily increased for bulk photo import
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          size: 10Gi
          storageClass: local-path
          accessMode: ReadWriteOnce

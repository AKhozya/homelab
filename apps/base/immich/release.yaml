apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 6h
  chart:
    spec:
      chart: immich
      version: 0.11.1
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: immich
  timeout: 10m
  install:
    remediation:
      retries: 3
  maxHistory: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  # Post-renderer to patch service accounts (Helm chart doesn't support per-component serviceAccount)
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: immich-server
            patch: |-
              # Limit old ReplicaSets to prevent buildup
              - op: add
                path: /spec/revisionHistoryLimit
                value: 2
              # Recreate strategy: avoids quota doubling and advisory lock contention during upgrades
              - op: replace
                path: /spec/strategy
                value:
                  type: Recreate
              - op: replace
                path: /spec/template/spec/serviceAccountName
                value: immich
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
              # GPU transcoding: Replace main container securityContext with privileged mode
              - op: replace
                path: /spec/template/spec/containers/0/securityContext
                value:
                  privileged: true
              # GPU transcoding: Add /dev/dri hostPath volume
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: dri
                  hostPath:
                    path: /dev/dri
                    type: Directory
              # GPU transcoding: Mount /dev/dri to main container
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: dri
                  mountPath: /dev/dri
          - target:
              kind: Deployment
              name: immich-machine-learning
            patch: |-
              - op: add
                path: /spec/revisionHistoryLimit
                value: 2
              - op: replace
                path: /spec/strategy
                value:
                  type: Recreate
              - op: replace
                path: /spec/template/spec/serviceAccountName
                value: immich
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: rapidocr-models
                  emptyDir: {}
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: rapidocr-models
                  # Hardcoded Python version - update when Immich ML updates Python
                  # Attempted version-independent symlink approach but failed due to permission issues
                  # (can't create symlink in root-owned /opt/venv as user 1000)
                  # Manual update needed ~annually when Python minor version changes
                  mountPath: /opt/venv/lib/python3.11/site-packages/rapidocr/models
  # Hardware acceleration (VAAPI) enabled for GPU transcoding on AMD Radeon
  # Requires: privileged container, /dev/dri hostPath, PSS privileged namespace
  values:
    # Service Account configuration (created via separate manifest)
    # Applied globally to all Immich components
    serviceAccount:
      create: false
      name: immich

    # Global image configuration for Renovate/Dependabot tracking
    # See: https://github.com/immich-app/immich-charts/issues/68
    image:
      tag: v2.1.0

    # Shared configuration for all Immich components
    controllers:
      main:
        containers:
          main:
            env:
              # Database configuration (using PgBouncer pooler for runtime connections)
              DB_HOSTNAME: main-postgres-rw-pooler.databases.svc.cluster.local
              DB_PORT: "5432"
              DB_DATABASE_NAME: immich
              DB_USERNAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-password
                    key: password
              # Redis configuration
              REDIS_HOSTNAME: redis.databases.svc.cluster.local
              REDIS_PORT: "6379"
              REDIS_USERNAME: immich
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-redis-password
                    key: password
              # Immich-specific settings
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
              IMMICH_METRICS: "true"

    # Immich shared configuration
    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-library

    # Disable built-in Valkey (using external Redis)
    valkey:
      enabled: false

    # Immich Server component
    server:
      enabled: true
      serviceMonitor:
        main:
          labels:
            release: kube-prometheus-stack
      controllers:
        main:
          pod:
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              # Video (985) and render (989) groups for GPU device access
              supplementalGroups:
                - 985  # video group on worker-node
                - 989  # render group on worker-node
          initContainers:
            wait-for-database:
              image:
                repository: ghcr.io/cloudnative-pg/postgresql
                tag: 18.3-standard-trixie
                pullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  echo "Waiting for Database CRD to create ${DB_DATABASE_NAME}..."
                  MAX_RETRIES=60
                  RETRY_COUNT=0

                  # Wait for database to be accessible with correct password
                  until pg_isready -h "$DB_HOSTNAME" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_DATABASE_NAME" > /dev/null 2>&1; do
                    RETRY_COUNT=$((RETRY_COUNT + 1))
                    if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                      echo "ERROR: Database not ready after ${MAX_RETRIES} attempts"
                      exit 1
                    fi
                    echo "Waiting for Database CRD (attempt $RETRY_COUNT/$MAX_RETRIES)..."
                    sleep 2
                  done

                  echo "Database ${DB_DATABASE_NAME} is ready!"
              env:
                - name: DB_HOSTNAME
                  value: main-postgres-rw.databases.svc.cluster.local
                - name: DB_PORT
                  value: "5432"
                - name: DB_DATABASE_NAME
                  value: immich
                - name: DB_USERNAME
                  value: immich
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-password
                      key: password
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop:
                    - ALL
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v2.6.3
                pullPolicy: IfNotPresent
              env:
                # Hardware acceleration via VAAPI on AMD Radeon GPU
                # Tested: 27x faster than CPU encoding (privileged container required)
                IMMICH_MEDIA_FFMPEG_ACCEL: vaapi
                LIBVA_DRIVER_NAME: radeonsi
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: "1500m"
                  memory: 5Gi
              # securityContext overridden via postRenderer patch (privileged: true for GPU)
      # GPU /dev/dri added via postRenderer patches (above)
      # Service port: uses chart default (2283) — no override needed

    # Immich Machine Learning component
    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v2.6.3  # CPU-only (ROCm gfx1036 not supported)
                pullPolicy: IfNotPresent
              env:
                TRANSFORMERS_CACHE: /cache
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: 2000m
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop:
                    - ALL
          pod:
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          size: 10Gi
          storageClass: local-path
          accessMode: ReadWriteOnce
        tmp:
          enabled: true
          type: emptyDir
          globalMounts:
            - path: /tmp
        run:
          enabled: true
          type: emptyDir
          globalMounts:
            - path: /run

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 6h
  chart:
    spec:
      chart: immich
      version: 0.10.2
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: immich
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  # Post-renderer to patch service accounts (Helm chart doesn't support per-component serviceAccount)
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: immich-server
            patch: |-
              - op: replace
                path: /spec/template/spec/serviceAccountName
                value: immich
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
          - target:
              kind: Deployment
              name: immich-machine-learning
            patch: |-
              - op: replace
                path: /spec/template/spec/serviceAccountName
                value: immich
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: rapidocr-models
                  emptyDir: {}
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: rapidocr-models
                  # Hardcoded Python version - update when Immich ML updates Python
                  # Attempted version-independent symlink approach but failed due to permission issues
                  # (can't create symlink in root-owned /opt/venv as user 1000)
                  # Manual update needed ~annually when Python minor version changes
                  mountPath: /opt/venv/lib/python3.11/site-packages/rapidocr/models
  # Note: Hardware acceleration (VAAPI) is disabled via IMMICH_MEDIA_FFMPEG_ACCEL=disabled
  # /dev/dri hostPath mount removed for Pod Security Standards (restricted) compliance
  # hostPath volumes violate PSS restricted policy
  values:
    # Service Account configuration (created via separate manifest)
    # Applied globally to all Immich components
    serviceAccount:
      create: false
      name: immich

    # Global image configuration for Renovate/Dependabot tracking
    # See: https://github.com/immich-app/immich-charts/issues/68
    image:
      tag: v2.1.0

    # Shared configuration for all Immich components
    controllers:
      main:
        containers:
          main:
            env:
              # Database configuration (using PgBouncer pooler for runtime connections)
              DB_HOSTNAME: main-postgres-rw-pooler.databases.svc.cluster.local
              DB_PORT: "5432"
              DB_DATABASE_NAME: immich
              DB_USERNAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-password
                    key: password
              # Redis configuration
              REDIS_HOSTNAME: redis.databases.svc.cluster.local
              REDIS_PORT: "6379"
              REDIS_USERNAME: immich
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-redis-password
                    key: password
              # Immich-specific settings
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
              PUBLIC_IMMICH_SERVER_URL: https://immich.h0melab.work
              IMMICH_METRICS: "true"

    # Immich shared configuration
    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-library

    # Disable built-in Valkey (using external Redis)
    valkey:
      enabled: false

    # Immich Server component
    server:
      enabled: true
      controllers:
        main:
          pod:
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
          initContainers:
            wait-for-database:
              image:
                repository: ghcr.io/cloudnative-pg/postgresql
                tag: 18-minimal-trixie
                pullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  echo "Waiting for Database CRD to create ${DB_DATABASE_NAME}..."
                  MAX_RETRIES=60
                  RETRY_COUNT=0

                  # Wait for database to be accessible with correct password
                  until pg_isready -h "$DB_HOSTNAME" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_DATABASE_NAME" > /dev/null 2>&1; do
                    RETRY_COUNT=$((RETRY_COUNT + 1))
                    if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                      echo "ERROR: Database not ready after ${MAX_RETRIES} attempts"
                      exit 1
                    fi
                    echo "Waiting for Database CRD (attempt $RETRY_COUNT/$MAX_RETRIES)..."
                    sleep 2
                  done

                  echo "Database ${DB_DATABASE_NAME} is ready!"
              env:
                - name: DB_HOSTNAME
                  value: main-postgres-rw.databases.svc.cluster.local
                - name: DB_PORT
                  value: "5432"
                - name: DB_DATABASE_NAME
                  value: immich
                - name: DB_USERNAME
                  value: immich
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-password
                      key: password
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop:
                    - ALL
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v2.2.3
                pullPolicy: IfNotPresent
              env:
                # Hardware acceleration disabled due to buggy Mesa VAAPI encoding on Radeon 610M
                # CPU-only encoding is faster than VAAPI (which fails and retries before CPU fallback)
                # Settings like CRF, preset, codec are configured via UI
                IMMICH_MEDIA_FFMPEG_ACCEL: disabled
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: 3000m
                  memory: 4Gi
              securityContext:
                # No privileged access needed for CPU-only encoding
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop:
                    - ALL
            # Nginx sidecar to forward traffic from 0.0.0.0:8080 to 127.0.0.1:2283
            # Workaround for Immich localhost-only binding issue
            # Nginx handles video streaming better than socat (buffering, keep-alive)
            proxy:
              image:
                repository: nginx
                tag: 1.29-alpine
                pullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  cat > /tmp/nginx.conf <<'EOF'
                  # Run nginx without privilege
                  pid /tmp/nginx.pid;

                  events {
                    worker_connections 1024;
                  }
                  http {
                    # Use /tmp for writable directories (read-only root filesystem)
                    client_body_temp_path /tmp/client_temp;
                    proxy_temp_path /tmp/proxy_temp;
                    fastcgi_temp_path /tmp/fastcgi_temp;
                    uwsgi_temp_path /tmp/uwsgi_temp;
                    scgi_temp_path /tmp/scgi_temp;

                    # Optimize for video streaming
                    sendfile on;
                    tcp_nopush on;
                    tcp_nodelay on;
                    keepalive_timeout 65;
                    keepalive_requests 100;

                    # Increase buffer sizes for large video files
                    proxy_buffering on;
                    proxy_buffer_size 128k;
                    proxy_buffers 8 128k;
                    proxy_busy_buffers_size 256k;
                    proxy_max_temp_file_size 2048m;

                    # Increase timeouts for video streaming
                    proxy_connect_timeout 300s;
                    proxy_send_timeout 300s;
                    proxy_read_timeout 300s;
                    send_timeout 300s;

                    # Disable request size limits
                    client_max_body_size 0;

                    # WebSocket upgrade header map
                    map $http_upgrade $connection_upgrade {
                      default upgrade;
                      '' close;
                    }

                    upstream immich {
                      server 127.0.0.1:2283;
                      keepalive 32;
                    }

                    server {
                      listen 8080;

                      location / {
                        proxy_pass http://immich;
                        proxy_http_version 1.1;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;

                        # WebSocket support for socket.io
                        proxy_set_header Upgrade $http_upgrade;
                        proxy_set_header Connection $connection_upgrade;
                      }
                    }
                  }
                  EOF
                  exec nginx -c /tmp/nginx.conf -g 'daemon off;'
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false  # nginx requires writable /tmp, /var/cache, /var/run
                runAsNonRoot: true
                runAsUser: 101  # nginx user
                capabilities:
                  drop:
                    - ALL
              readinessProbe:
                httpGet:
                  path: /
                  port: 8080
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /
                  port: 8080
                initialDelaySeconds: 60
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 3
      # Service configuration - point to nginx proxy port
      service:
        main:
          ports:
            http:
              port: 8080
              targetPort: 8080
      # Hardware acceleration disabled: IMMICH_MEDIA_FFMPEG_ACCEL=disabled
      # Reason: Buggy Mesa VAAPI encoding on Radeon 610M (CPU encoding is faster)

    # Immich Machine Learning component
    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v2.2.3  # CPU-only (ROCm gfx1036 not supported)
                pullPolicy: IfNotPresent
              env:
                TRANSFORMERS_CACHE: /cache
                # Fix HuggingFace XET storage permission issues (https://github.com/immich-app/immich-charts/commit/5e2e396)
                HF_XET_CACHE: /cache/huggingface-xet
                MPLCONFIGDIR: /cache/matplotlib-config
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: 2000m
                  memory: 3Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop:
                    - ALL
          pod:
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          size: 10Gi
          storageClass: local-path
          accessMode: ReadWriteOnce

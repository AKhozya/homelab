apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 6h
  chart:
    spec:
      chart: immich
      version: 0.10.x
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: immich
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  values:
    # Shared configuration for all Immich components
    controllers:
      main:
        containers:
          main:
            env:
              # Database configuration
              DB_HOSTNAME: main-postgres-rw.databases.svc.cluster.local
              DB_PORT: "5432"
              DB_DATABASE_NAME: immich
              DB_USERNAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-password
                    key: password
              # Redis configuration
              REDIS_HOSTNAME: redis.databases.svc.cluster.local
              REDIS_PORT: "6379"
              REDIS_USERNAME: immich
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-redis-password
                    key: password
              # Immich-specific settings
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
              PUBLIC_IMMICH_SERVER_URL: https://immich.h0melab.work
              IMMICH_METRICS: "true"

    # Immich shared configuration
    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-library

    # Disable built-in Valkey (using external Redis)
    valkey:
      enabled: false

    # Immich Server component
    server:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                pullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: 2000m
                  memory: 4Gi
            # Socat sidecar to forward traffic from 0.0.0.0:8080 to [::1]:2283
            # Workaround for Immich localhost-only binding issue
            proxy:
              image:
                repository: alpine/socat
                tag: 1.8.0.3
                pullPolicy: IfNotPresent
              args:
                - "TCP4-LISTEN:8080,fork,reuseaddr,bind=0.0.0.0"
                - "TCP:[::1]:2283"
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
      # Service configuration - point to socat proxy port
      service:
        main:
          ports:
            http:
              port: 8080
              targetPort: 8080

    # Immich Machine Learning component
    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                pullPolicy: IfNotPresent
              env:
                TRANSFORMERS_CACHE: /cache
              resources:
                requests:
                  cpu: 200m
                  memory: 1Gi
                limits:
                  cpu: 2000m
                  memory: 4Gi
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          size: 10Gi
          storageClass: local-path
          accessMode: ReadWriteOnce

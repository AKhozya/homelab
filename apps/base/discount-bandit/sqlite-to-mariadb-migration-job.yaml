apiVersion: batch/v1
kind: Job
metadata:
  name: discount-bandit-sqlite-to-mariadb-migration
  namespace: discount-bandit
spec:
  ttlSecondsAfterFinished: 3600  # Keep job for 1 hour after completion
  template:
    metadata:
      labels:
        app: discount-bandit-migration
    spec:
      serviceAccountName: discount-bandit
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Install dependencies first (composer install)
        - name: install-dependencies
          image: cybrarist/discount-bandit:v4
          command:
            - sh
            - -c
            - |
              echo "Running composer install..."
              cd /app
              composer install --optimize-autoloader --no-interaction
              echo "Composer install completed successfully"
          volumeMounts:
            - name: vendor
              mountPath: /app/vendor
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: migrate-data
          image: cybrarist/discount-bandit:v4
          command:
            - sh
            - -c
            - |
              set -e
              echo "=== Starting SQLite to MariaDB Migration ==="
              cd /app

              # Verify SQLite database exists
              if [ ! -f "/data/database/database.sqlite" ]; then
                echo "ERROR: SQLite database not found at /data/database/database.sqlite"
                exit 1
              fi

              echo "SQLite database found: $(ls -lh /data/database/database.sqlite)"

              # Test MariaDB connectivity and create schema
              echo "Testing MariaDB connectivity and running migrations..."
              php artisan migrate --database=mysql --force || {
                echo "ERROR: Cannot connect to MariaDB or migration failed"
                exit 1
              }

              echo "MariaDB connection successful and schema created"

              # Migrate data from SQLite to MariaDB using PHP/Laravel
              echo "Migrating data from SQLite to MariaDB using PHP..."
              php artisan tinker --execute="
                // Configure SQLite database path
                config(['database.connections.sqlite.database' => '/data/database/database.sqlite']);

                // Get all tables from SQLite except migrations
                \$sqlitePdo = DB::connection('sqlite')->getPdo();
                \$tables = \$sqlitePdo->query(\"SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name != 'migrations'\")->fetchAll(PDO::FETCH_COLUMN);

                foreach (\$tables as \$table) {
                    echo \"Migrating table: \$table\\n\";

                    try {
                        // Get row count from SQLite
                        \$sqliteCount = DB::connection('sqlite')->table(\$table)->count();

                        if (\$sqliteCount > 0) {
                            // Fetch all data from SQLite
                            \$rows = DB::connection('sqlite')->table(\$table)->get();

                            // Insert into MariaDB in chunks of 100
                            foreach (\$rows->chunk(100) as \$chunk) {
                                DB::connection('mysql')->table(\$table)->insert(\$chunk->map(fn(\$row) => (array)\$row)->toArray());
                            }
                        }

                        // Verify row count
                        \$mariadbCount = DB::connection('mysql')->table(\$table)->count();
                        echo \"  SQLite rows: \$sqliteCount\\n\";
                        echo \"  MariaDB rows: \$mariadbCount\\n\";

                        if (\$sqliteCount != \$mariadbCount) {
                            echo \"  ERROR: Row count mismatch for table \$table\\n\";
                            exit(1);
                        }
                    } catch (Exception \$e) {
                        echo \"  ERROR: Failed to migrate table \$table: \" . \$e->getMessage() . \"\\n\";
                        exit(1);
                    }
                }

                echo \"=== Migration Complete ===\\n\";
                echo \"SQLite database remains at /data/database/database.sqlite (kept as backup)\\n\";
              " || {
                echo "ERROR: Data migration failed"
                exit 1
              }
          env:
            # MariaDB connection (destination)
            - name: DB_CONNECTION
              value: "mysql"
            - name: DB_HOST
              value: "main-mariadb-primary.databases.svc.cluster.local"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "discountbandit"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: discount-bandit-mariadb-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: discount-bandit-mariadb-credentials
                  key: password
            # Application config (required for Laravel)
            - name: APP_NAME
              value: "Discount Bandit Migration"
            - name: APP_ENV
              value: "production"
            - name: APP_DEBUG
              value: "false"
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: discount-bandit-secret
                  key: app-key
            - name: APP_TIMEZONE
              value: "America/Los_Angeles"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: vendor
              mountPath: /app/vendor
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: discount-bandit-data  # Mount existing PVC with SQLite database
        - name: vendor
          emptyDir: {}

apiVersion: batch/v1
kind: Job
metadata:
  name: discount-bandit-admin-setup
  namespace: discount-bandit
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: discount-bandit-admin-setup
    spec:
      serviceAccountName: discount-bandit
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 0  # Must run as root to access database created by main deployment
        runAsGroup: 0
        fsGroup: 82  # Match PVC GID
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: cybrarist/discount-bandit:v4
          command:
            - /bin/bash
            - -c
            - |
              set -e

              echo "Waiting 15 seconds for Discount Bandit to be ready..."
              sleep 15

              echo "Creating admin user..."
              if php artisan make:filament-user \
                --name="${ADMIN_NAME}" \
                --email="${ADMIN_EMAIL}" \
                --password="${ADMIN_PASSWORD}" 2>&1 | tee /tmp/user-creation.log; then
                echo "Admin user created successfully!"
              else
                if grep -q "already" /tmp/user-creation.log || grep -q "duplicate" /tmp/user-creation.log; then
                  echo "Admin user already exists. Skipping creation."
                  exit 0
                else
                  echo "Failed to create admin user. Check logs above."
                  exit 1
                fi
              fi

              echo "Setup complete!"
          env:
            - name: ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: discount-bandit-admin
                  key: name
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: discount-bandit-admin
                  key: email
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: discount-bandit-admin
                  key: password
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: discount-bandit-secret
                  key: app-key
            - name: DB_CONNECTION
              value: "sqlite"
            - name: DB_DATABASE
              value: "/data/database.sqlite"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: database
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: discount-bandit-data

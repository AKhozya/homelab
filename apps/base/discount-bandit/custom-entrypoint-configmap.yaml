apiVersion: v1
kind: ConfigMap
metadata:
  name: discount-bandit-entrypoint
  namespace: discount-bandit
data:
  entrypoint.sh: |
    #!/bin/sh
    # Simplified entrypoint - Laravel reads config from environment variables

    php artisan storage:link

    # Make env vars available to supervisord/FrankenPHP
    printenv > /etc/environment

    # Run database migrations
    php artisan migrate --force

    # Seed database (ensures fresh deploys work from scratch)
    php artisan db:seed --force

    # Create admin user (idempotent - skips if user already exists)
    echo "Creating admin user..."
    if php artisan make:filament-user \
      --name="${ADMIN_NAME}" \
      --email="${ADMIN_EMAIL}" \
      --password="${ADMIN_PASSWORD}" 2>&1 | tee /tmp/user-creation.log; then
      echo "Admin user created successfully!"
    else
      if grep -qi "already\|duplicate\|UNIQUE constraint" /tmp/user-creation.log; then
        echo "Admin user already exists. Skipping."
      else
        echo "WARNING: Failed to create admin user. Check logs above."
        # Don't fail the entire startup - app can still run
      fi
    fi

    # Cache config from environment variables (route cache issue is non-blocking)
    php artisan config:cache

    php artisan octane:install --server=frankenphp

    # App-specific setup
    php artisan discount:fill-supervisor-workers
    php artisan discount:exchange-rate

    # Start virtual display for browser automation
    Xvfb :99 -screen 0 2000x2000x24 & export DISPLAY=:99

    # Start application
    supervisord -c /etc/supervisor/conf.d/supervisord.conf

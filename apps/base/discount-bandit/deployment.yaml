apiVersion: apps/v1
kind: Deployment
metadata:
  name: discount-bandit
  namespace: discount-bandit
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO PVC requires Recreate strategy
  selector:
    matchLabels:
      app: discount-bandit
  template:
    metadata:
      labels:
        app: discount-bandit
    spec:
      serviceAccountName: discount-bandit
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-dependencies
          image: cybrarist/discount-bandit:v4
          command:
            - sh
            - -c
            - |
              echo "Running composer install..."
              cd /app
              composer install --optimize-autoloader --no-interaction
              echo "Composer install completed successfully"
          volumeMounts:
            - name: vendor
              mountPath: /app/vendor
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 0  # Need root to install git via apk
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: discount-bandit
          image: cybrarist/discount-bandit:v4
          command: ["/custom-entrypoint.sh"]  # Runs migrations, caches config from env vars, skips route cache (upstream bug)
          ports:
            - containerPort: 80
              name: http
          env:
            - name: APP_NAME
              value: "Discount Bandit"
            - name: APP_ENV
              value: "production"
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: "https://discounts.h0melab.work"
            - name: ASSET_URL
              value: "https://discounts.h0melab.work"
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: discount-bandit-secret
                  key: app-key
            - name: EXCHANGE_RATE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: discount-bandit-secret
                  key: exchange-rate-api-key
            - name: DB_CONNECTION
              value: "mysql"
            - name: DB_HOST
              value: "main-mariadb-primary.databases.svc.cluster.local"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "discountbandit"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: discount-bandit-mariadb-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: discount-bandit-mariadb-credentials
                  key: password
            - name: APP_TIMEZONE
              value: "America/Los_Angeles"
            - name: THEME_COLOR
              value: "Blue"
            - name: CRON
              value: "*/5 * * * *"  # Every 5 minutes (default, ensures scraping happens before scheduler timeout)
            - name: LOG_CHANNEL
              value: "daily"
            - name: SESSION_LIFETIME
              value: "120"
            - name: SESSION_DRIVER
              value: "database"
            - name: SESSION_DOMAIN
              value: ".h0melab.work"
            - name: SESSION_SECURE_COOKIE
              value: "true"
            - name: ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: discount-bandit-admin
                  key: name
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: discount-bandit-admin
                  key: email
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: discount-bandit-admin
                  key: password
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: database
            - name: data
              mountPath: /logs
              subPath: logs
            - name: vendor
              mountPath: /app/vendor
            - name: custom-entrypoint
              mountPath: /custom-entrypoint.sh
              subPath: entrypoint.sh
          resources:
            requests:
              cpu: 100m
              memory: 650Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Laravel needs writable storage/cache
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE  # FrankenPHP needs this to bind to port 80
          livenessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: discount-bandit-data
        - name: vendor
          emptyDir: {}
        - name: custom-entrypoint
          configMap:
            name: discount-bandit-entrypoint
            defaultMode: 0755

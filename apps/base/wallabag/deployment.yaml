apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallabag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallabag
  template:
    metadata:
      labels:
        app: wallabag
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: create-database
          image: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
          envFrom:
            - secretRef:
                name: wallabag-env
          command:
            - sh
            - -c
            - |
              echo "Creating database ${SYMFONY__ENV__DATABASE_NAME} if it doesn't exist..."
              export PGPASSWORD="$SYMFONY__ENV__DATABASE_PASSWORD"

              # Wait for PostgreSQL to be ready
              until pg_isready -h "$SYMFONY__ENV__DATABASE_HOST" -p "$SYMFONY__ENV__DATABASE_PORT" -U "$SYMFONY__ENV__DATABASE_USER" -d postgres > /dev/null 2>&1; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done

              # Wait for user role to be created by CloudNativePG (retry authentication)
              echo "Waiting for user role $SYMFONY__ENV__DATABASE_USER to be available..."
              MAX_RETRIES=30
              RETRY_COUNT=0
              while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                if psql -h "$SYMFONY__ENV__DATABASE_HOST" -p "$SYMFONY__ENV__DATABASE_PORT" -U "$SYMFONY__ENV__DATABASE_USER" -d postgres -c "SELECT 1" > /dev/null 2>&1; then
                  echo "User role is available!"
                  break
                fi
                RETRY_COUNT=$((RETRY_COUNT + 1))
                echo "Waiting for role (attempt $RETRY_COUNT/$MAX_RETRIES)..."
                sleep 2
              done

              if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                echo "ERROR: User role $SYMFONY__ENV__DATABASE_USER not available after ${MAX_RETRIES} attempts"
                exit 1
              fi

              # Check if database exists
              DB_EXISTS=$(psql -h "$SYMFONY__ENV__DATABASE_HOST" -p "$SYMFONY__ENV__DATABASE_PORT" -U "$SYMFONY__ENV__DATABASE_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$SYMFONY__ENV__DATABASE_NAME'")

              if [ "$DB_EXISTS" = "1" ]; then
                echo "Database ${SYMFONY__ENV__DATABASE_NAME} already exists"
              else
                echo "Creating database ${SYMFONY__ENV__DATABASE_NAME}..."
                if psql -h "$SYMFONY__ENV__DATABASE_HOST" -p "$SYMFONY__ENV__DATABASE_PORT" -U "$SYMFONY__ENV__DATABASE_USER" -d postgres -c "CREATE DATABASE \"$SYMFONY__ENV__DATABASE_NAME\" OWNER \"$SYMFONY__ENV__DATABASE_USER\""; then
                  echo "Database ${SYMFONY__ENV__DATABASE_NAME} created successfully"
                else
                  echo "ERROR: Failed to create database ${SYMFONY__ENV__DATABASE_NAME}"
                  exit 1
                fi
              fi
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
        - name: wait-for-db
          image: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
          envFrom:
            - secretRef:
                name: wallabag-env
          command:
            - sh
            - -c
            - |
              echo "Waiting for database ${SYMFONY__ENV__DATABASE_NAME} to be ready on ${SYMFONY__ENV__DATABASE_HOST}:${SYMFONY__ENV__DATABASE_PORT}..."
              MAX_RETRIES=60
              RETRY_COUNT=0

              until pg_isready -h "$SYMFONY__ENV__DATABASE_HOST" -p "$SYMFONY__ENV__DATABASE_PORT" -U "$SYMFONY__ENV__DATABASE_USER" -d "$SYMFONY__ENV__DATABASE_NAME" > /dev/null 2>&1; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                  echo "ERROR: Database not ready after ${MAX_RETRIES} attempts ($(($MAX_RETRIES * 2))s)"
                  exit 1
                fi
                echo "Database not ready (attempt $RETRY_COUNT/$MAX_RETRIES), waiting 2s..."
                sleep 2
              done

              echo "Database is ready! Starting application..."
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
      containers:
        - name: wallabag
          image: wallabag/wallabag:2.6.14
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - secretRef:
                name: wallabag-env
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: ["SETUID", "SETGID", "CHOWN", "DAC_OVERRIDE"]
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: wallabag-data
              mountPath: /var/www/wallabag/data
            - name: wallabag-images
              mountPath: /var/www/wallabag/web/assets/images
      volumes:
        - name: wallabag-data
          persistentVolumeClaim:
            claimName: wallabag-data-pvc
        - name: wallabag-images
          persistentVolumeClaim:
            claimName: wallabag-images-pvc

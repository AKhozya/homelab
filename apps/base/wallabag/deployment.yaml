apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallabag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallabag
  template:
    metadata:
      labels:
        app: wallabag
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wallabag
          image: wallabag/wallabag:2.6.9
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - secretRef:
                name: wallabag-env
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: ["SETUID", "SETGID", "CHOWN", "DAC_OVERRIDE"]
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: wallabag-data
              mountPath: /var/www/wallabag/data
            - name: wallabag-images
              mountPath: /var/www/wallabag/web/assets/images
            - name: wallabag-config
              mountPath: /var/www/wallabag/app/config
            - name: wallabag-var
              mountPath: /var/www/wallabag/var
      volumes:
        - name: wallabag-data
          persistentVolumeClaim:
            claimName: wallabag-data-pvc
        - name: wallabag-images
          persistentVolumeClaim:
            claimName: wallabag-images-pvc
        - name: wallabag-config
          emptyDir: {}
        - name: wallabag-var
          emptyDir: {}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallabag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallabag
  template:
    metadata:
      labels:
        app: wallabag
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-database-crd
          image: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
          envFrom:
            - secretRef:
                name: wallabag-env
          command:
            - sh
            - -c
            - |
              echo "Waiting for Database CRD to create ${SYMFONY__ENV__DATABASE_NAME}..."
              MAX_RETRIES=60
              RETRY_COUNT=0

              # Wait for database to be accessible (created by Database CRD)
              until pg_isready -h "$SYMFONY__ENV__DATABASE_HOST" -p "$SYMFONY__ENV__DATABASE_PORT" -U "$SYMFONY__ENV__DATABASE_USER" -d "$SYMFONY__ENV__DATABASE_NAME" > /dev/null 2>&1; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                  echo "ERROR: Database not created by CRD after ${MAX_RETRIES} attempts"
                  exit 1
                fi
                echo "Waiting for Database CRD (attempt $RETRY_COUNT/$MAX_RETRIES)..."
                sleep 2
              done

              echo "Database ${SYMFONY__ENV__DATABASE_NAME} is ready!"
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
        - name: install-wallabag
          image: wallabag/wallabag:2.6.14
          envFrom:
            - secretRef:
                name: wallabag-env
          command:
            - sh
            - -c
            - |
              cd /var/www/wallabag
              echo "Checking if wallabag database is initialized..."

              # Build parameters.yml from environment variables
              echo "Building parameters.yml from environment variables..."
              envsubst < /etc/wallabag/parameters.template.yml > app/config/parameters.yml

              # Check if tables exist by querying for the user table
              export PGPASSWORD="$SYMFONY__ENV__DATABASE_PASSWORD"
              TABLE_COUNT=$(psql -h "$SYMFONY__ENV__DATABASE_HOST" -p "$SYMFONY__ENV__DATABASE_PORT" -U "$SYMFONY__ENV__DATABASE_USER" -d "$SYMFONY__ENV__DATABASE_NAME" -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'wallabag_user';" 2>/dev/null || echo "0")

              if [ "$TABLE_COUNT" = "0" ]; then
                echo "Database tables not found. Running wallabag:install..."
                if ! su -c "php bin/console wallabag:install --env=prod --no-interaction" -s /bin/sh nobody; then
                  echo "ERROR: wallabag:install command failed!"
                  exit 1
                fi
                echo "Wallabag installation completed successfully!"

                # Create custom admin user from environment variables
                echo "Creating custom admin user ${WALLABAG_ADMIN_USER}..."
                if ! su -c "php bin/console fos:user:create '${WALLABAG_ADMIN_USER}' '${WALLABAG_ADMIN_EMAIL}' '${WALLABAG_ADMIN_PASSWORD}' --env=prod" -s /bin/sh nobody; then
                  echo "ERROR: Failed to create admin user!"
                  exit 1
                fi

                # Promote to super admin
                echo "Promoting ${WALLABAG_ADMIN_USER} to ROLE_SUPER_ADMIN..."
                su -c "php bin/console fos:user:promote '${WALLABAG_ADMIN_USER}' ROLE_SUPER_ADMIN --env=prod" -s /bin/sh nobody

                # Disable the default wallabag user for security
                echo "Disabling default wallabag user..."
                su -c "php bin/console fos:user:deactivate wallabag --env=prod" -s /bin/sh nobody || echo "Default user already removed"

                echo "User setup completed!"
              else
                echo "Database already initialized, skipping installation."
              fi
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: ["SETUID", "SETGID", "CHOWN", "DAC_OVERRIDE"]
              drop: ["ALL"]
          volumeMounts:
            - name: wallabag-data
              mountPath: /var/www/wallabag/data
            - name: wallabag-images
              mountPath: /var/www/wallabag/web/assets/images
      containers:
        - name: wallabag
          image: wallabag/wallabag:2.6.14
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - secretRef:
                name: wallabag-env
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: ["SETUID", "SETGID", "CHOWN", "DAC_OVERRIDE"]
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: wallabag-data
              mountPath: /var/www/wallabag/data
            - name: wallabag-images
              mountPath: /var/www/wallabag/web/assets/images
      volumes:
        - name: wallabag-data
          persistentVolumeClaim:
            claimName: wallabag-data-pvc
        - name: wallabag-images
          persistentVolumeClaim:
            claimName: wallabag-images-pvc

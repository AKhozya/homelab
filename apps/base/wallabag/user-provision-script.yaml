apiVersion: v1
kind: ConfigMap
metadata:
  name: wallabag-user-provision-script
  namespace: wallabag
data:
  provision-user.sh: |
    #!/bin/bash
    set -e

    echo "Starting wallabag user provisioning..."

    # Wait for wallabag service to be available
    echo "Waiting for wallabag to be available..."
    MAX_RETRIES=60
    RETRY_COUNT=0
    while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
      if curl -sf http://wallabag/login > /dev/null 2>&1; then
        echo "wallabag is ready!"
        break
      fi
      echo "wallabag not ready yet, waiting... (attempt $((RETRY_COUNT+1))/$MAX_RETRIES)"
      sleep 5
      RETRY_COUNT=$((RETRY_COUNT+1))
    done

    if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
      echo "ERROR: wallabag did not become ready in time"
      exit 1
    fi

    # Wait for database tables to be fully initialized
    echo "Waiting for database tables to be ready..."
    sleep 10

    # Check if user already exists by querying database
    echo "Checking if user ${WALLABAG_ADMIN_USER} exists..."
    export PGPASSWORD="${SYMFONY__ENV__DATABASE_PASSWORD}"
    USER_COUNT=$(psql -h "${SYMFONY__ENV__DATABASE_HOST}" \
      -p "${SYMFONY__ENV__DATABASE_PORT}" \
      -U "${SYMFONY__ENV__DATABASE_USER}" \
      -d "${SYMFONY__ENV__DATABASE_NAME}" \
      -tAc "SELECT COUNT(*) FROM wallabag_user WHERE username='${WALLABAG_ADMIN_USER}'")

    if [ "$USER_COUNT" -gt 0 ]; then
      echo "User ${WALLABAG_ADMIN_USER} already exists"
      exit 0
    fi

    # Create the admin user using wallabag console
    cd /var/www/wallabag

    echo "Creating admin user ${WALLABAG_ADMIN_USER}..."
    php bin/console fos:user:create \
      "${WALLABAG_ADMIN_USER}" \
      "${WALLABAG_ADMIN_EMAIL}" \
      "${WALLABAG_ADMIN_PASSWORD}" \
      --env=prod

    echo "Promoting ${WALLABAG_ADMIN_USER} to ROLE_SUPER_ADMIN..."
    php bin/console fos:user:promote \
      "${WALLABAG_ADMIN_USER}" \
      ROLE_SUPER_ADMIN \
      --env=prod

    echo "User provisioning complete!"

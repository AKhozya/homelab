apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wallabag-network-policy
  namespace: wallabag
spec:
  podSelector:
    matchLabels:
      app: wallabag
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from cloudflare-tunnel namespace for external access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 80
    # Allow ingress from uptime-kuma namespace for monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
      ports:
        - protocol: TCP
          port: 80
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow PostgreSQL database access
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
        - podSelector:
            matchLabels:
              cnpg.io/cluster: main-postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow HTTPS for article fetching and external integrations
    - ports:
        - protocol: TCP
          port: 443
    # Allow HTTP for article fetching
    - ports:
        - protocol: TCP
          port: 80

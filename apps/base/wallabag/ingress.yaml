apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wallabag
  namespace: wallabag
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: wallabag-redirect-https@kubernetescrd
    external-dns.alpha.kubernetes.io/hostname: wallabag.h0melab.work
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - wallabag.h0melab.work
      secretName: wallabag-tls-secret
  rules:
    - host: wallabag.h0melab.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wallabag
                port:
                  number: 80

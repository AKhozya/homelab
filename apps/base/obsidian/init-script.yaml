apiVersion: v1
kind: ConfigMap
metadata:
  name: couchdb-init-script
  namespace: obsidian
data:
  init.sh: |
    #!/bin/sh
    set -e

    echo "Starting CouchDB database initialization..."

    # Wait for CouchDB to be ready
    echo "Waiting for CouchDB to be available..."
    until curl -sf -u "$ADMIN_USER:$ADMIN_PASSWORD" "$COUCHDB_URL/_up" > /dev/null 2>&1; do
      echo "CouchDB not ready yet, waiting..."
      sleep 2
    done
    echo "CouchDB is ready!"

    # Ensure _users database exists (required for authentication)
    echo "Checking if _users database exists..."
    if curl -sf -u "$ADMIN_USER:$ADMIN_PASSWORD" "$COUCHDB_URL/_users" > /dev/null 2>&1; then
      echo "_users database already exists"
    else
      echo "Creating _users database..."
      curl -sf -X PUT -u "$ADMIN_USER:$ADMIN_PASSWORD" "$COUCHDB_URL/_users"
      echo "_users database created successfully"
    fi

    # Check if database exists
    echo "Checking if database '$DB_NAME' exists..."
    if curl -sf -u "$ADMIN_USER:$ADMIN_PASSWORD" "$COUCHDB_URL/$DB_NAME" > /dev/null 2>&1; then
      echo "Database '$DB_NAME' already exists, skipping creation"
    else
      echo "Creating database '$DB_NAME'..."
      curl -sf -X PUT -u "$ADMIN_USER:$ADMIN_PASSWORD" "$COUCHDB_URL/$DB_NAME"
      echo "Database '$DB_NAME' created successfully"
    fi

    # Check if user exists
    echo "Checking if user '$DB_USER' exists..."
    if curl -sf -u "$ADMIN_USER:$ADMIN_PASSWORD" "$COUCHDB_URL/_users/org.couchdb.user:$DB_USER" > /dev/null 2>&1; then
      echo "User '$DB_USER' already exists, skipping creation"
    else
      echo "Creating user '$DB_USER'..."
      curl -sf -X PUT -u "$ADMIN_USER:$ADMIN_PASSWORD" \
        "$COUCHDB_URL/_users/org.couchdb.user:$DB_USER" \
        -H "Content-Type: application/json" \
        -d "{\"name\":\"$DB_USER\",\"password\":\"$DB_PASSWORD\",\"type\":\"user\",\"roles\":[]}"
      echo "User '$DB_USER' created successfully"
    fi

    # Set database permissions (user as DB admin for LiveSync operations)
    echo "Setting DB admin permissions for user '$DB_USER' on database '$DB_NAME'..."
    curl -sf -X PUT -u "$ADMIN_USER:$ADMIN_PASSWORD" \
      "$COUCHDB_URL/$DB_NAME/_security" \
      -H "Content-Type: application/json" \
      -d "{\"admins\":{\"names\":[\"$DB_USER\"],\"roles\":[]},\"members\":{\"names\":[\"$DB_USER\"],\"roles\":[]}}"
    echo "DB admin permissions set successfully"

    # Apply LiveSync recommended CouchDB settings
    echo "Applying LiveSync recommended settings..."
    curl -sf -X PUT -u "$ADMIN_USER:$ADMIN_PASSWORD" \
      "$COUCHDB_URL/_node/_local/_config/chttpd/require_valid_user" -d '"true"'
    curl -sf -X PUT -u "$ADMIN_USER:$ADMIN_PASSWORD" \
      "$COUCHDB_URL/_node/_local/_config/chttpd_auth/require_valid_user" -d '"true"'
    curl -sf -X PUT -u "$ADMIN_USER:$ADMIN_PASSWORD" \
      "$COUCHDB_URL/_node/_local/_config/httpd/WWW-Authenticate" -d '"Basic realm=\"couchdb\""'
    curl -sf -X PUT -u "$ADMIN_USER:$ADMIN_PASSWORD" \
      "$COUCHDB_URL/_node/_local/_config/httpd/enable_cors" -d '"true"'
    curl -sf -X PUT -u "$ADMIN_USER:$ADMIN_PASSWORD" \
      "$COUCHDB_URL/_node/_local/_config/chttpd/enable_cors" -d '"true"'
    curl -sf -X PUT -u "$ADMIN_USER:$ADMIN_PASSWORD" \
      "$COUCHDB_URL/_node/_local/_config/chttpd/max_http_request_size" -d '"134217728"'
    curl -sf -X PUT -u "$ADMIN_USER:$ADMIN_PASSWORD" \
      "$COUCHDB_URL/_node/_local/_config/couchdb/max_document_size" -d '"50000000"'
    curl -sf -X PUT -u "$ADMIN_USER:$ADMIN_PASSWORD" \
      "$COUCHDB_URL/_node/_local/_config/cors/credentials" -d '"true"'
    curl -sf -X PUT -u "$ADMIN_USER:$ADMIN_PASSWORD" \
      "$COUCHDB_URL/_node/_local/_config/cors/origins" \
      -d '"app://obsidian.md,capacitor://localhost,http://localhost"'
    curl -sf -X PUT -u "$ADMIN_USER:$ADMIN_PASSWORD" \
      "$COUCHDB_URL/_node/_local/_config/cors/headers" \
      -d '"accept,authorization,content-type,origin,referer"'
    curl -sf -X PUT -u "$ADMIN_USER:$ADMIN_PASSWORD" \
      "$COUCHDB_URL/_node/_local/_config/cors/methods" \
      -d '"GET,PUT,POST,HEAD,DELETE"'
    echo "LiveSync settings applied successfully"

    echo "Database initialization complete!"

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: obsidian-network-policy
  namespace: obsidian
spec:
  podSelector:
    matchLabels:
      app: obsidian
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from within the same namespace (for init jobs)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5984
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow access to CouchDB
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: couchdb
      ports:
        - protocol: TCP
          port: 5984
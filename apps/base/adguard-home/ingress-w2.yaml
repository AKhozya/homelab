apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adguard-home-w2
  namespace: adguard-home
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-https@kubernetescrd,traefik-security-headers@kubernetescrd,traefik-rate-limit-standard@kubernetescrd,traefik-csp@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - adguard-w2.h0melab.work
      secretName: adguard-home-w2-tls-secret
  rules:
    - host: adguard-w2.h0melab.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adguard-home-w2
                port:
                  number: 80

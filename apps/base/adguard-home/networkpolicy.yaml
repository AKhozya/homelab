apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adguard-home-network-policy
  namespace: adguard-home
spec:
  podSelector:
    matchLabels:
      app: adguard-home
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from traefik namespace for web UI
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 80
    # Allow ingress from uptime-kuma namespace for monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
      ports:
        - protocol: TCP
          port: 80
    # Allow DNS queries from anywhere (internal network)
    - ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
  egress:
    # Cloudflare malware-blocking DNS (1.1.1.2 / 1.0.0.2 + IPv6)
    - to:
        - ipBlock:
            cidr: 1.1.1.2/32
        - ipBlock:
            cidr: 1.0.0.2/32
        - ipBlock:
            cidr: 2606:4700:4700::1112/128
        - ipBlock:
            cidr: 2606:4700:4700::1002/128
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 853  # DoT
    # Quad9 DNS (9.9.9.9 / 149.112.112.112 + IPv6)
    - to:
        - ipBlock:
            cidr: 9.9.9.9/32
        - ipBlock:
            cidr: 149.112.112.112/32
        - ipBlock:
            cidr: 2620:fe::fe/128
        - ipBlock:
            cidr: 2620:fe::9/128
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 853  # DoT
    # In-cluster CoreDNS for *.cluster.local split DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS for DoH upstreams + blocklist updates (GitHub, HaGeZi, OISD)
    # DoH uses port 443 to security.cloudflare-dns.com / dns.quad9.net
    # Also covers HTTP/3 (QUIC) on UDP 443
    - ports:
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 443

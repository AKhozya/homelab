apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adguard-home-network-policy
  namespace: adguard-home
spec:
  podSelector:
    matchLabels:
      app: adguard-home
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from traefik namespace for web UI
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 80
    # Allow ingress from uptime-kuma namespace for monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
      ports:
        - protocol: TCP
          port: 80
    # Allow DNS queries from anywhere (internal network)
    - ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
  egress:
    # Allow DNS resolution to trusted upstream servers only
    # Cloudflare DNS (1.1.1.1, 1.0.0.1)
    - to:
        - ipBlock:
            cidr: 1.1.1.1/32
        - ipBlock:
            cidr: 1.0.0.1/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 853  # DoT
    # Google DNS (8.8.8.8, 8.8.4.4)
    - to:
        - ipBlock:
            cidr: 8.8.8.8/32
        - ipBlock:
            cidr: 8.8.4.4/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 853  # DoT
    # Quad9 DNS (9.9.9.9)
    - to:
        - ipBlock:
            cidr: 9.9.9.9/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 853  # DoT
    # Allow HTTPS for blocklist updates (GitHub, community lists, etc.)
    # Modern blocklists use HTTPS (2024-2025): GitHub-hosted, HaGeZi, OISD
    # Legacy HTTP sources (someonewhocares.org, pgl.yoyo.org) have HTTPS support
    - ports:
        - protocol: TCP
          port: 443

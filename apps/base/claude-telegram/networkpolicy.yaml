apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claude-telegram-network-policy
  namespace: claude-telegram
spec:
  podSelector:
    matchLabels:
      app: claude-telegram
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # HTTPS (Telegram API, Anthropic API, GitHub, external lookups)
    - ports:
        - protocol: TCP
          port: 443
    # HTTP (some package managers, MCP servers)
    - ports:
        - protocol: TCP
          port: 80
    # SSH to homelab nodes (port 65300)
    - to:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - protocol: TCP
          port: 65300
    # K8s API server
    - to:
        - ipBlock:
            cidr: 192.168.1.127/32
      ports:
        - protocol: TCP
          port: 6443

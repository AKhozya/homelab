apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-telegram
  namespace: claude-telegram
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: claude-telegram
  template:
    metadata:
      labels:
        app: claude-telegram
    spec:
      serviceAccountName: claude-telegram
      automountServiceAccountToken: true
      hostAliases:
        - ip: "192.168.1.127"
          hostnames: ["gmk-k3s-control-plane", "master-node"]
        - ip: "192.168.1.129"
          hostnames: ["worker-node"]
        - ip: "192.168.1.126"
          hostnames: ["worker-node-2"]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: chezmoi-init
          image: ghcr.io/akhozya/claude-telegram:1.7
          command:
            - /bin/bash
            - -c
            - |
              set -e
              export HOME=/home/akhozya

              # Setup chezmoi config (template data for SSH config)
              mkdir -p ~/.config/chezmoi
              cp /etc/chezmoi-config/chezmoi.toml ~/.config/chezmoi/chezmoi.toml

              # Clone or update dotfiles
              if [ -d ~/.local/share/chezmoi/.git ]; then
                echo "Dotfiles exist, pulling latest..."
                git -C ~/.local/share/chezmoi pull --quiet || true
              else
                echo "Cloning dotfiles..."
                git clone git@github.com:AKhozya/dotfiles.git ~/.local/share/chezmoi
              fi

              # Apply chezmoi — skip .ssh (read-only K8s Secret) and macOS-only scripts
              echo -e '.ssh/**\nrun_once_*' >> ~/.local/share/chezmoi/.chezmoiignore
              chezmoi apply --force --no-tty || true

              # Clone or update homelab repo
              if [ -d ~/source-code/homelab/.git ]; then
                echo "Homelab repo exists, pulling latest..."
                git -C ~/source-code/homelab pull --quiet || true
              else
                echo "Cloning homelab repo..."
                mkdir -p ~/source-code
                git clone git@github.com:AKhozya/homelab.git ~/source-code/homelab
              fi

              # Copy OAuth credentials into PVC (full OAuth, not setup-token)
              cp /etc/oauth-credentials/credentials.json ~/.claude/.credentials.json
              chmod 600 ~/.claude/.credentials.json

              # Fix Mac paths → container paths in all config JSON files
              echo "Fixing Mac paths..."
              find ~/.claude -name "*.json" -exec sed -i 's|/Users/akhozya|/home/akhozya|g' {} \; 2>/dev/null || true

              # Fix telegram plugin dot-files (chezmoi strips dot_ prefix)
              PLUGIN_DIR=~/.claude/plugins/cache/claude-plugins-official/telegram/0.0.5
              if [ -d "$PLUGIN_DIR" ] && [ ! -f "$PLUGIN_DIR/.mcp.json" ]; then
                echo "Fixing telegram plugin dot-files..."
                mkdir -p "$PLUGIN_DIR/.claude-plugin"
                echo '{"name":"telegram","version":"0.0.5","description":"Connect Claude Code to Telegram"}' > "$PLUGIN_DIR/.claude-plugin/plugin.json"
                echo '{"mcpServers":{"telegram":{"command":"bun","args":["run","--cwd","${CLAUDE_PLUGIN_ROOT}","--shell=bun","--silent","start"]}}}' > "$PLUGIN_DIR/.mcp.json"
                echo 'registry=https://registry.npmjs.org/' > "$PLUGIN_DIR/.npmrc"
              fi

              # Copy .claude.json into CLAUDE_CONFIG_DIR (Claude reads from there)
              cp ~/.claude.json ~/.claude/.claude.json 2>/dev/null || true

              # Patch .claude.json for headless container environment
              CLAUDE_VERSION=$(claude --version 2>/dev/null | head -1 | awk '{print $1}')
              jq --arg v "$CLAUDE_VERSION" '
                .projects["/home/akhozya"] = (.projects["/home/akhozya"] // {}) +
                  {"hasTrustDialogAccepted": true, "projectOnboardingSeenCount": 99, "allowedTools": [], "mcpServers": {}} |
                .projects["/home/akhozya/source-code/homelab"] = (.projects["/home/akhozya/source-code/homelab"] // {}) +
                  {"hasTrustDialogAccepted": true, "projectOnboardingSeenCount": 99, "allowedTools": [], "mcpServers": {}} |
                .lastOnboardingVersion = $v |
                .hasCompletedOnboarding = true |
                .cachedGrowthBookFeatures.tengu_harbor = true |
                .cachedGrowthBookFeatures.tengu_harbor_ledger = ["telegram","discord","fakechat","imessage"]
              ' ~/.claude/.claude.json > /tmp/claude.json.tmp && mv /tmp/claude.json.tmp ~/.claude/.claude.json
              echo "Patched .claude.json (version=$CLAUDE_VERSION)"

              # Setup telegram access control
              mkdir -p ~/.claude/channels/telegram
              echo '{"dmPolicy":"allowlist","allowFrom":["113452686"],"groups":{},"pending":{}}' > ~/.claude/channels/telegram/access.json

              echo "Init complete."
          env:
            - name: HOME
              value: /home/akhozya
            - name: GIT_SSH_COMMAND
              value: "ssh -o StrictHostKeyChecking=accept-new"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: home
              mountPath: /home/akhozya
            - name: ssh-keys
              mountPath: /home/akhozya/.ssh
              readOnly: true
            - name: chezmoi-config
              mountPath: /etc/chezmoi-config
              readOnly: true
            - name: oauth-credentials
              mountPath: /etc/oauth-credentials
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: claude-telegram
          image: ghcr.io/akhozya/claude-telegram:1.7
          env:
            - name: HOME
              value: /home/akhozya
            - name: CLAUDE_CONFIG_DIR
              value: /home/akhozya/.claude
            # Full OAuth credentials from K8s Secret (mounted as file by init container)
            # CLAUDE_CODE_OAUTH_TOKEN (setup-token) doesn't support Channels — need full OAuth
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-telegram-env
                  key: telegram-bot-token
            - name: TELEGRAM_ACCESS_MODE
              value: "static"
            - name: TELEGRAM_STATE_DIR
              value: /home/akhozya/.claude/channels/telegram
            - name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
              value: "1"
            - name: DISABLE_AUTO_UPDATES
              value: "1"
            - name: TERM
              value: "xterm-256color"
            - name: COLORTERM
              value: "truecolor"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "claude"]
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pgrep", "-f", "claude"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: home
              mountPath: /home/akhozya
            - name: ssh-keys
              mountPath: /home/akhozya/.ssh
              readOnly: true
            - name: telegram-access
              mountPath: /home/akhozya/.claude/channels/telegram/access.json
              subPath: access.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: claude-telegram-home-pvc
        - name: ssh-keys
          secret:
            secretName: claude-telegram-ssh
            defaultMode: 0600
        - name: chezmoi-config
          secret:
            secretName: claude-telegram-chezmoi
        - name: oauth-credentials
          secret:
            secretName: claude-telegram-oauth
        - name: telegram-access
          configMap:
            name: claude-telegram-access
        - name: tmp
          emptyDir: {}

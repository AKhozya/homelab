apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-telegram
  namespace: claude-telegram
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: claude-telegram
  template:
    metadata:
      labels:
        app: claude-telegram
    spec:
      serviceAccountName: claude-telegram
      automountServiceAccountToken: true
      hostAliases:
        - ip: "192.168.1.127"
          hostnames: ["gmk-k3s-control-plane", "master-node"]
        - ip: "192.168.1.129"
          hostnames: ["worker-node"]
        - ip: "192.168.1.126"
          hostnames: ["worker-node-2"]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: chezmoi-init
          image: ghcr.io/akhozya/claude-telegram-bot:1.9
          command:
            - /bin/bash
            - -c
            - |
              set -e
              export HOME=/home/akhozya

              # Copy SSH keys from Secret staging mount to writable PVC
              # (Secret mounts are read-only; SSH needs writable known_hosts)
              rm -rf ~/.ssh
              install -d -m 700 ~/.ssh
              cp /etc/ssh-keys/* ~/.ssh/
              chmod 600 ~/.ssh/id_ed25519 ~/.ssh/config
              chmod 644 ~/.ssh/id_ed25519.pub ~/.ssh/known_hosts 2>/dev/null || true

              # Scan node SSH fingerprints into writable known_hosts
              echo "Scanning node SSH fingerprints..."
              ssh-keyscan -p 65300 gmk-k3s-control-plane worker-node worker-node-2 >> ~/.ssh/known_hosts 2>/dev/null || true

              # Setup chezmoi config
              mkdir -p ~/.config/chezmoi
              cp /etc/chezmoi-config/chezmoi.toml ~/.config/chezmoi/chezmoi.toml

              # Clone or update dotfiles
              if [ -d ~/.local/share/chezmoi/.git ]; then
                echo "Dotfiles exist, pulling latest..."
                git -C ~/.local/share/chezmoi pull --quiet || true
              else
                echo "Cloning dotfiles..."
                git clone git@github.com:AKhozya/dotfiles.git ~/.local/share/chezmoi
              fi

              # Apply chezmoi (.chezmoiignore handles .ssh exclusion)
              chezmoi apply --force --no-tty || true

              # Fix CLAUDE_PLUGIN_ROOT paths for this environment
              for f in ~/.claude/plugins/cache/*/*/hooks/hooks.json; do
                [ -f "$f" ] || continue
                plugin_root="$(cd "$(dirname "$f")/.." && pwd)"
                sed -i "s|\${CLAUDE_PLUGIN_ROOT}|$plugin_root|g" "$f" 2>/dev/null
              done

              # Clone or update homelab repo
              if [ -d ~/source-code/homelab/.git ]; then
                echo "Homelab repo exists, pulling latest..."
                git -C ~/source-code/homelab pull --quiet || true
              else
                echo "Cloning homelab repo..."
                mkdir -p ~/source-code
                git clone git@github.com:AKhozya/homelab.git ~/source-code/homelab
              fi

              # Create data dir for session persistence
              mkdir -p ~/data

              # Update Claude Code CLI + Agent SDK on every restart
              echo "Updating Claude Code CLI..."
              npm update -g @anthropic-ai/claude-code 2>&1 || true
              echo "Updating Agent SDK..."
              cd /app && bun update @anthropic-ai/claude-agent-sdk 2>&1 || true

              echo "Init complete."
          env:
            - name: HOME
              value: /home/akhozya
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: home
              mountPath: /home/akhozya
            - name: ssh-keys
              mountPath: /etc/ssh-keys
              readOnly: true
            - name: chezmoi-config
              mountPath: /etc/chezmoi-config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: claude-telegram
          image: ghcr.io/akhozya/claude-telegram-bot:1.9
          env:
            - name: HOME
              value: /home/akhozya
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-telegram-env
                  key: claude-oauth-token
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-telegram-env
                  key: telegram-bot-token
            - name: TELEGRAM_ALLOWED_USERS
              value: "113452686"
            - name: CLAUDE_WORKING_DIR
              value: /home/akhozya/source-code/homelab
            - name: ALLOWED_PATHS
              value: "/home/akhozya"
            - name: SESSION_FILE_PATH
              value: /home/akhozya/data/session.json
            - name: RESTART_FILE_PATH
              value: /home/akhozya/data/restart.json
            - name: AUDIT_LOG_PATH
              value: /home/akhozya/data/audit.log
            - name: CLAUDE_CODE_DEFAULT_MODEL
              value: "claude-opus-4-7"
            - name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
              value: "1"
            - name: DISABLE_AUTO_UPDATES
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "bun"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: home
              mountPath: /home/akhozya
            - name: tmp
              mountPath: /tmp
        - name: sync
          image: ghcr.io/akhozya/claude-telegram-bot:1.9
          command:
            - /bin/bash
            - -c
            - |
              export HOME=/home/akhozya
              echo "Sync sidecar started (1h interval)"
              while true; do
                sleep 3600
                echo "--- Sync $(date -Iseconds) ---"
                git -C ~/.local/share/chezmoi pull --quiet 2>&1 || true
                chezmoi apply --force --no-tty 2>&1 || true
                # Fix CLAUDE_PLUGIN_ROOT paths for this environment
                for f in ~/.claude/plugins/cache/*/*/hooks/hooks.json; do
                  [ -f "$f" ] || continue
                  plugin_root="$(cd "$(dirname "$f")/.." && pwd)"
                  sed -i "s|\${CLAUDE_PLUGIN_ROOT}|$plugin_root|g" "$f" 2>/dev/null
                done
                git -C ~/source-code/homelab pull --quiet 2>&1 || true
                echo "Sync done"
              done
          env:
            - name: HOME
              value: /home/akhozya
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: home
              mountPath: /home/akhozya
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: claude-telegram-home-pvc
        - name: ssh-keys
          secret:
            secretName: claude-telegram-ssh
            defaultMode: 0600
        - name: chezmoi-config
          secret:
            secretName: claude-telegram-chezmoi
        - name: tmp
          emptyDir: {}

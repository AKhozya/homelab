apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-telegram
  namespace: claude-telegram
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: claude-telegram
  template:
    metadata:
      labels:
        app: claude-telegram
    spec:
      serviceAccountName: claude-telegram
      automountServiceAccountToken: true
      hostAliases:
        - ip: "192.168.1.127"
          hostnames: ["gmk-k3s-control-plane", "master-node"]
        - ip: "192.168.1.129"
          hostnames: ["worker-node"]
        - ip: "192.168.1.126"
          hostnames: ["worker-node-2"]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: chezmoi-init
          image: ghcr.io/akhozya/claude-telegram-bot:1.8
          command:
            - /bin/bash
            - -c
            - |
              set -e
              export HOME=/home/akhozya

              # Copy SSH keys from Secret staging mount to writable PVC
              # (Secret mounts are read-only; SSH needs writable known_hosts)
              rm -rf ~/.ssh
              install -d -m 700 ~/.ssh
              cp /etc/ssh-keys/* ~/.ssh/
              chmod 600 ~/.ssh/id_ed25519 ~/.ssh/config
              chmod 644 ~/.ssh/id_ed25519.pub ~/.ssh/known_hosts 2>/dev/null || true

              # Scan node SSH fingerprints into writable known_hosts
              echo "Scanning node SSH fingerprints..."
              ssh-keyscan -p 65300 gmk-k3s-control-plane worker-node worker-node-2 >> ~/.ssh/known_hosts 2>/dev/null || true

              # Setup chezmoi config
              mkdir -p ~/.config/chezmoi
              cp /etc/chezmoi-config/chezmoi.toml ~/.config/chezmoi/chezmoi.toml

              # Clone or update dotfiles
              if [ -d ~/.local/share/chezmoi/.git ]; then
                echo "Dotfiles exist, pulling latest..."
                git -C ~/.local/share/chezmoi pull --quiet || true
              else
                echo "Cloning dotfiles..."
                git clone git@github.com:AKhozya/dotfiles.git ~/.local/share/chezmoi
              fi

              # Apply chezmoi — skip .ssh (managed above via Secret copy)
              grep -q '.ssh/\*\*' ~/.local/share/chezmoi/.chezmoiignore 2>/dev/null || echo '.ssh/**' >> ~/.local/share/chezmoi/.chezmoiignore
              chezmoi apply --force --no-tty || true

              # Clone or update homelab repo
              if [ -d ~/source-code/homelab/.git ]; then
                echo "Homelab repo exists, pulling latest..."
                git -C ~/source-code/homelab pull --quiet || true
              else
                echo "Cloning homelab repo..."
                mkdir -p ~/source-code
                git clone git@github.com:AKhozya/homelab.git ~/source-code/homelab
              fi

              # Copy OAuth credentials for Claude Code CLI (Agent SDK subprocess)
              mkdir -p ~/.claude
              cp /etc/oauth-credentials/credentials.json ~/.claude/.credentials.json
              chmod 600 ~/.claude/.credentials.json

              # Create data dir for session persistence
              mkdir -p ~/data

              echo "Init complete."
          env:
            - name: HOME
              value: /home/akhozya
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: home
              mountPath: /home/akhozya
            - name: ssh-keys
              mountPath: /etc/ssh-keys
              readOnly: true
            - name: chezmoi-config
              mountPath: /etc/chezmoi-config
              readOnly: true
            - name: oauth-credentials
              mountPath: /etc/oauth-credentials
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: claude-telegram
          image: ghcr.io/akhozya/claude-telegram-bot:1.8
          env:
            - name: HOME
              value: /home/akhozya
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-telegram-env
                  key: telegram-bot-token
            - name: TELEGRAM_ALLOWED_USERS
              value: "113452686"
            - name: CLAUDE_WORKING_DIR
              value: /home/akhozya/source-code/homelab
            - name: ALLOWED_PATHS
              value: "/home/akhozya"
            - name: SESSION_FILE_PATH
              value: /home/akhozya/data/session.json
            - name: RESTART_FILE_PATH
              value: /home/akhozya/data/restart.json
            - name: AUDIT_LOG_PATH
              value: /home/akhozya/data/audit.log
            - name: CLAUDE_CODE_DEFAULT_MODEL
              value: "claude-opus-4-6"
            - name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
              value: "1"
            - name: DISABLE_AUTO_UPDATES
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "bun"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: home
              mountPath: /home/akhozya
            - name: tmp
              mountPath: /tmp
        - name: sync
          image: ghcr.io/akhozya/claude-telegram-bot:1.8
          command:
            - /bin/bash
            - -c
            - |
              export HOME=/home/akhozya
              CREDS="$HOME/.claude/.credentials.json"
              CLIENT_ID="9d1c250a-e61b-44d9-88ed-5944d1962f5e"
              TOKEN_URL="https://platform.claude.com/v1/oauth/token"

              refresh_oauth() {
                if [ ! -f "$CREDS" ]; then
                  echo "  No credentials file, skipping refresh"
                  return
                fi

                EXPIRES_AT=$(python3 -c "import json; d=json.load(open('$CREDS')); print(d.get('claudeAiOauth',{}).get('expiresAt',0))" 2>/dev/null || echo 0)
                NOW_MS=$(python3 -c "import time; print(int(time.time()*1000))")
                # Refresh if token expires within 30 minutes
                THRESHOLD=$((NOW_MS + 1800000))

                if [ "$EXPIRES_AT" -gt "$THRESHOLD" ] 2>/dev/null; then
                  echo "  Token valid for >30min, skipping refresh"
                  return
                fi

                echo "  Token expired or expiring soon, refreshing..."
                REFRESH_TOKEN=$(python3 -c "import json; print(json.load(open('$CREDS'))['claudeAiOauth']['refreshToken'])" 2>/dev/null)
                if [ -z "$REFRESH_TOKEN" ]; then
                  echo "  ERROR: No refresh token found"
                  return
                fi

                RESPONSE=$(curl -s -m 15 -X POST "$TOKEN_URL" \
                  -H 'Content-Type: application/json' \
                  -d "{
                    \"grant_type\": \"refresh_token\",
                    \"refresh_token\": \"$REFRESH_TOKEN\",
                    \"client_id\": \"$CLIENT_ID\",
                    \"scope\": \"user:profile user:inference user:sessions:claude_code user:mcp_servers user:file_upload\"
                  }" 2>/dev/null)

                NEW_ACCESS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null)
                if [ -z "$NEW_ACCESS" ]; then
                  echo "  ERROR: Refresh failed: $RESPONSE"
                  return
                fi

                # Update credentials.json with new tokens
                python3 -c "
              import json, sys
              resp = json.loads('''$RESPONSE''')
              with open('$CREDS') as f:
                  creds = json.load(f)
              oauth = creds.get('claudeAiOauth', {})
              oauth['accessToken'] = resp['access_token']
              if 'refresh_token' in resp:
                  oauth['refreshToken'] = resp['refresh_token']
              if 'expires_in' in resp:
                  import time
                  oauth['expiresAt'] = int(time.time() * 1000) + resp['expires_in'] * 1000
              creds['claudeAiOauth'] = oauth
              with open('$CREDS', 'w') as f:
                  json.dump(creds, f)
              print('  Token refreshed, new expiry:', oauth.get('expiresAt'))
              " 2>/dev/null || echo "  ERROR: Failed to write credentials"
              }

              echo "Sync sidecar started (30min interval)"
              # Refresh immediately on startup
              echo "--- Initial token refresh ---"
              refresh_oauth
              SYNC_COUNTER=0
              while true; do
                sleep 1800
                SYNC_COUNTER=$((SYNC_COUNTER + 1))
                echo "--- Tick $SYNC_COUNTER $(date -Iseconds) ---"
                echo "OAuth refresh:"
                refresh_oauth
                # Full git sync every other tick (1h)
                if [ $((SYNC_COUNTER % 2)) -eq 0 ]; then
                  echo "Git sync:"
                  git -C ~/.local/share/chezmoi pull --quiet 2>&1 || true
                  grep -q '.ssh/\*\*' ~/.local/share/chezmoi/.chezmoiignore 2>/dev/null || echo '.ssh/**' >> ~/.local/share/chezmoi/.chezmoiignore
                  chezmoi apply --force --no-tty 2>&1 || true
                  git -C ~/source-code/homelab pull --quiet 2>&1 || true
                  echo "Git sync done"
                fi
              done
          env:
            - name: HOME
              value: /home/akhozya
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: home
              mountPath: /home/akhozya
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: claude-telegram-home-pvc
        - name: ssh-keys
          secret:
            secretName: claude-telegram-ssh
            defaultMode: 0600
        - name: chezmoi-config
          secret:
            secretName: claude-telegram-chezmoi
        - name: oauth-credentials
          secret:
            secretName: claude-telegram-oauth
        - name: tmp
          emptyDir: {}

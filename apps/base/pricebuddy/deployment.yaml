apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricebuddy
  namespace: pricebuddy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pricebuddy
  template:
    metadata:
      labels:
        app: pricebuddy
    spec:
      serviceAccountName: pricebuddy
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: apprise-init
          image: alpine:3.23
          command: ["/bin/sh", "/scripts/init.sh"]
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pricebuddy-telegram
                  key: bot_token
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: pricebuddy-telegram
                  key: chat_id
          volumeMounts:
            - name: apprise-init-script
              mountPath: /scripts
            - name: apprise-config
              mountPath: /config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "32Mi"
      containers:
        - name: pricebuddy
          image: jez500/pricebuddy:v1.0.42
          ports:
            - containerPort: 80
              name: http
          env:
            - name: APP_ENV
              value: "production"
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: "https://pricebuddy.h0melab.work"
            - name: ASSET_URL
              value: "https://pricebuddy.h0melab.work"
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: pricebuddy-secrets
                  key: app-key
            - name: DB_CONNECTION
              value: "mysql"
            - name: DB_HOST
              value: "main-mariadb.databases.svc.cluster.local"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "pricebuddy"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pricebuddy-mariadb-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pricebuddy-mariadb-credentials
                  key: password
            - name: SCRAPER_BASE_URL
              value: "http://localhost:4444"
            - name: APP_USER_EMAIL
              value: "alexander.khozya@gmail.com"
            - name: APP_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pricebuddy-secrets
                  key: app-user-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "540Mi"
          volumeMounts:
            - name: storage
              mountPath: /app/storage
        - name: scraper
          image: jez500/seleniumbase-scrapper:v1.0
          ports:
            - containerPort: 4444
              name: scraper
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
        - name: apprise
          image: caronc/apprise:1.2.6
          ports:
            - containerPort: 8000
              name: apprise
          env:
            - name: APPRISE_STATEFUL_MODE
              value: "simple"
            - name: APPRISE_WORKER_COUNT
              value: "1"
          volumeMounts:
            - name: apprise-config
              mountPath: /config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE", "FOWNER"]
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "210Mi"
          livenessProbe:
            httpGet:
              path: /status
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /status
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: pricebuddy-storage
        - name: apprise-config
          emptyDir: {}
        - name: apprise-init-script
          configMap:
            name: pricebuddy-apprise-init
            defaultMode: 0755

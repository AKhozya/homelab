apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricebuddy
  namespace: pricebuddy
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pricebuddy
  template:
    metadata:
      labels:
        app: pricebuddy
    spec:
      serviceAccountName: pricebuddy
      automountServiceAccountToken: false
      priorityClassName: homelab-standard
      securityContext:
        fsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: apprise-init
          image: alpine:3.23.4
          command: ["/bin/sh", "/scripts/init.sh"]
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pricebuddy-telegram
                  key: bot_token
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: pricebuddy-telegram
                  key: chat_id
          volumeMounts:
            - name: apprise-init-script
              mountPath: /scripts
            - name: apprise-config
              mountPath: /config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1000
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "32Mi"
      containers:
        - name: pricebuddy
          image: jez500/pricebuddy:v1.0.46
          ports:
            - containerPort: 80
              name: http
          env:
            - name: APP_ENV
              value: "production"
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: "https://pricebuddy.h0melab.work"
            - name: ASSET_URL
              value: "https://pricebuddy.h0melab.work"
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: pricebuddy-secrets
                  key: app-key
            - name: DB_CONNECTION
              value: "mysql"
            - name: DB_HOST
              value: "main-mysql-haproxy.databases.svc.cluster.local"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "pricebuddy"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pricebuddy-mysql-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pricebuddy-mysql-credentials
                  key: password
            - name: SCRAPER_BASE_URL
              value: "http://localhost:3000"
            - name: APP_USER_EMAIL
              value: "alexander.khozya@gmail.com"
            - name: APP_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pricebuddy-secrets
                  key: app-user-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          # Use /up endpoint to avoid session creation (Laravel 11 health route)
          # See: https://github.com/jez500/pricebuddy/issues/103
          startupProbe:
            httpGet:
              path: /up
              port: 80
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /up
              port: 80
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /up
              port: 80
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              # Increased to 1000m to eliminate CPU throttling alerts
              # PHP/Laravel has bursty CPU patterns during request handling
              cpu: "1000m"
              # Increased from 540Mi to 700Mi (2025-12-30) - 82% usage triggered alert
              memory: "700Mi"
          volumeMounts:
            - name: storage
              mountPath: /app/storage
        - name: scraper
          image: jez500/seleniumbase-scrapper:v1.0
          ports:
            - containerPort: 3000
              name: scraper
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
        - name: apprise
          image: caronc/apprise:v1.4.1
          ports:
            - containerPort: 8000
              name: apprise
          env:
            - name: APPRISE_STATEFUL_MODE
              value: "simple"
            - name: APPRISE_WORKER_COUNT
              value: "1"
          volumeMounts:
            - name: apprise-config
              mountPath: /config
            - name: apprise-plugin
              mountPath: /plugin
            - name: apprise-attach
              mountPath: /attach
            - name: apprise-tmp
              mountPath: /tmp
          # F-24: post-#273 (v1.4.x) runs non-root natively — no chown caps needed.
          # nginx/gunicorn/supervisord write only to /tmp under RoRFS (upstream README
          # hardened pattern). runAsUser 1000 + fsGroup 33 (pod) → writes the
          # group-writable /config emptyDir via supplemental group.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1000
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "150Mi"
            limits:
              cpu: "200m"
              memory: "300Mi"
          # gunicorn+gevent cold-start: socket appears ~15s in, first /status
          # request blocks >3s on worker import. timeoutSeconds:3 timed out each
          # probe → startup/liveness SIGTERM mid-boot → CrashLoopBackOff on exit 0
          # (2026-05-28, post-reboot under load). timeout 10s + wide startup window.
          startupProbe:
            httpGet:
              path: /status
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /status
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /status
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: pricebuddy-storage
        - name: apprise-config
          emptyDir: {}
        - name: apprise-plugin
          emptyDir: {}
        - name: apprise-attach
          emptyDir: {}
        - name: apprise-tmp
          emptyDir:
            medium: Memory
        - name: apprise-init-script
          configMap:
            name: pricebuddy-apprise-init
            defaultMode: 0755

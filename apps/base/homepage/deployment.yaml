apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # NOTE: InitContainer copies ConfigMap to writable emptyDir
      #
      # WHY: Homepage needs to both:
      # 1. Read custom config from ConfigMap (services, widgets, etc.)
      # 2. Write dynamic files (docker.yaml, logs) to /app/config
      #
      # ConfigMaps are read-only, so we copy to emptyDir which is writable.
      initContainers:
        - name: copy-config
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              echo "Copying ConfigMap files to writable config directory..."
              cp -v /tmp/configmap/* /app/config/ 2>/dev/null || echo "No ConfigMap files to copy (using defaults)"
              echo "Config directory ready"
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: configmap
              mountPath: /tmp/configmap
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.5.0
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "*"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "192Mi"
            limits:
              cpu: "200m"
              memory: "384Mi"
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          emptyDir: {}
        - name: configmap
          configMap:
            name: homepage-config

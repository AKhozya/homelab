apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: homepage-redirect-https@kubernetescrd
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - home.h0melab.work
      secretName: homepage-tls-secret
  rules:
    - host: home.h0melab.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000

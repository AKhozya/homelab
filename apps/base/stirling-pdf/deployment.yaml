apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stirling-pdf
  template:
    metadata:
      labels:
        app: stirling-pdf
    spec:
      serviceAccountName: stirling-pdf
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stirling-pdf
          image: frooodle/s-pdf:2.0.1-fat
          ports:
            - containerPort: 8080
          env:
            - name: HOME
              value: "/tmp"
          envFrom:
            - secretRef:
                name: stirling-pdf-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Stirling PDF needs to write temp files
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: temp-dir
              mountPath: /tmp
            - name: config-dir
              mountPath: /configs
            - name: logs-dir
              mountPath: /logs
            - name: custom-files-dir
              mountPath: /customFiles
            - name: pipeline-dir
              mountPath: /pipeline
            - name: fontconfig-cache
              mountPath: /var/cache/fontconfig
            - name: tessdata-dir
              mountPath: /usr/share/tessdata
      volumes:
        - name: temp-dir
          emptyDir: {}
        - name: config-dir
          persistentVolumeClaim:
            claimName: stirling-pdf-configs-pvc
        - name: logs-dir
          emptyDir: {}
        - name: custom-files-dir
          emptyDir: {}
        - name: pipeline-dir
          persistentVolumeClaim:
            claimName: stirling-pdf-pipeline-pvc
        - name: fontconfig-cache
          emptyDir: {}
        - name: tessdata-dir
          persistentVolumeClaim:
            claimName: stirling-pdf-tessdata-pvc

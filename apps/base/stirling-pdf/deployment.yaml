apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stirling-pdf
  template:
    metadata:
      labels:
        app: stirling-pdf
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-directories
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              echo "Creating required directory structure..."
              mkdir -p /pipeline/watchedFolders
              mkdir -p /pipeline/defaultWebUIConfigs
              mkdir -p /logs
              mkdir -p /customFiles
              mkdir -p /tmp/stirling-pdf
              echo "Setting ownership to UID 1000..."
              chown -R 1000:1000 /pipeline
              chown -R 1000:1000 /configs
              chown -R 1000:1000 /logs
              chown -R 1000:1000 /customFiles
              chown -R 1000:1000 /tmp
              echo "Directory preparation complete"
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: temp-dir
              mountPath: /tmp
            - name: config-dir
              mountPath: /configs
            - name: logs-dir
              mountPath: /logs
            - name: custom-files-dir
              mountPath: /customFiles
            - name: pipeline-dir
              mountPath: /pipeline
      containers:
        - name: stirling-pdf
          image: frooodle/s-pdf:1.5.0-fat
          ports:
            - containerPort: 8080
          env:
            - name: HOME
              value: "/tmp"
          envFrom:
            - secretRef:
                name: stirling-pdf-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Stirling PDF needs to write temp files
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: temp-dir
              mountPath: /tmp
            - name: config-dir
              mountPath: /configs
            - name: logs-dir
              mountPath: /logs
            - name: custom-files-dir
              mountPath: /customFiles
            - name: pipeline-dir
              mountPath: /pipeline
            - name: fontconfig-cache
              mountPath: /var/cache/fontconfig
            - name: tessdata-dir
              mountPath: /usr/share/tessdata
      volumes:
        - name: temp-dir
          emptyDir: {}
        - name: config-dir
          persistentVolumeClaim:
            claimName: stirling-pdf-configs-pvc
        - name: logs-dir
          emptyDir: {}
        - name: custom-files-dir
          emptyDir: {}
        - name: pipeline-dir
          persistentVolumeClaim:
            claimName: stirling-pdf-pipeline-pvc
        - name: fontconfig-cache
          emptyDir: {}
        - name: tessdata-dir
          persistentVolumeClaim:
            claimName: stirling-pdf-tessdata-pvc

apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stirling-pdf
  template:
    metadata:
      labels:
        app: stirling-pdf
    spec:
      serviceAccountName: stirling-pdf
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stirling-pdf
          image: frooodle/s-pdf:2.11.0-fat
          ports:
            - containerPort: 8080
          env:
            - name: HOME
              value: "/tmp"
            - name: JAVA_CUSTOM_OPTS
              value: "-XX:MaxRAMPercentage=45"
          envFrom:
            - secretRef:
                name: stirling-pdf-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Stirling PDF v2.0 needs to write temp files and modify system configs
            capabilities:
              drop: ["ALL"]
              add: ["SETGID", "SETUID", "CHOWN", "DAC_OVERRIDE"] # Required for su-exec privilege dropping, directory ownership, and nginx file access
          # v2.0.3 requires authentication on / - use /api/v1/info/status for health checks
          # startupProbe allows 300s for slow cold start (30 * 10s) — 2.11.0-fat
          # Spring Boot 4 + license check + H2 init exceeds 90s on a cold node
          startupProbe:
            httpGet:
              path: /api/v1/info/status
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/info/status
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/v1/info/status
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "768Mi"
            limits:
              cpu: "1000m"
              memory: "1280Mi"
          volumeMounts:
            - name: temp-dir
              mountPath: /tmp
            - name: config-dir
              mountPath: /configs
            - name: logs-dir
              mountPath: /logs
            - name: custom-files-dir
              mountPath: /customFiles
            - name: pipeline-dir
              mountPath: /pipeline
            - name: fontconfig-cache
              mountPath: /var/cache/fontconfig
            - name: tessdata-dir
              mountPath: /usr/share/tessdata
            - name: nginx-logs-dir
              mountPath: /var/lib/nginx/logs
            - name: nginx-tmp-dir
              mountPath: /var/lib/nginx/tmp
            - name: custom-settings
              mountPath: /configs/custom_settings.yml
              subPath: custom_settings.yml
      volumes:
        - name: temp-dir
          emptyDir: {}
        - name: config-dir
          persistentVolumeClaim:
            claimName: stirling-pdf-configs-pvc
        - name: logs-dir
          emptyDir: {}
        - name: custom-files-dir
          emptyDir: {}
        - name: pipeline-dir
          persistentVolumeClaim:
            claimName: stirling-pdf-pipeline-pvc
        - name: fontconfig-cache
          emptyDir: {}
        - name: tessdata-dir
          persistentVolumeClaim:
            claimName: stirling-pdf-tessdata-pvc
        - name: nginx-logs-dir
          emptyDir: {}
        - name: nginx-tmp-dir
          emptyDir: {}
        - name: custom-settings
          secret:
            secretName: stirling-pdf-custom-settings

apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stirling-pdf
  template:
    metadata:
      labels:
        app: stirling-pdf
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stirling-pdf
          image: frooodle/s-pdf:0.36.5
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: stirling-pdf-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Stirling PDF needs to write temp files
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: temp-dir
              mountPath: /tmp
            - name: config-dir
              mountPath: /configs
      volumes:
        - name: temp-dir
          emptyDir: {}
        - name: config-dir
          emptyDir: {}

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: csp
  namespace: stirling-pdf
spec:
  headers:
    customResponseHeaders:
      # Stirling PDF-specific CSP - extends base policy with blob: for PDF.js web workers
      # PDF.js creates workers from blob: URLs for off-main-thread PDF rendering
      Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://authentik.h0melab.work; report-uri http://csp-reporter.csp-reporter.svc.cluster.local/report"

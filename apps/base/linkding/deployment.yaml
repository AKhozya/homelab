apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      securityContext:
        fsGroup: 33 # www-data group ID
        runAsUser: 33 # www-data user ID
        runAsGroup: 33 # www-data group ID
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: create-database
          image: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
          envFrom:
            - secretRef:
                name: linkding-container-env
          command:
            - sh
            - -c
            - |
              echo "Creating database ${LD_DB_DATABASE} if it doesn't exist..."
              export PGPASSWORD="$LD_DB_PASSWORD"

              # Wait for PostgreSQL to be ready
              until pg_isready -h "$LD_DB_HOST" -p "$LD_DB_PORT" -U "$LD_DB_USER" -d postgres > /dev/null 2>&1; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done

              # Check if database exists
              DB_EXISTS=$(psql -h "$LD_DB_HOST" -p "$LD_DB_PORT" -U "$LD_DB_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$LD_DB_DATABASE'")

              if [ "$DB_EXISTS" = "1" ]; then
                echo "Database ${LD_DB_DATABASE} already exists"
              else
                echo "Creating database ${LD_DB_DATABASE}..."
                psql -h "$LD_DB_HOST" -p "$LD_DB_PORT" -U "$LD_DB_USER" -d postgres -c "CREATE DATABASE \"$LD_DB_DATABASE\" OWNER \"$LD_DB_USER\""
                echo "Database ${LD_DB_DATABASE} created successfully"
              fi
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
        - name: wait-for-db
          image: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
          envFrom:
            - secretRef:
                name: linkding-container-env
          command:
            - sh
            - -c
            - |
              echo "Waiting for database ${LD_DB_DATABASE} to be ready on ${LD_DB_HOST}:${LD_DB_PORT}..."
              MAX_RETRIES=60
              RETRY_COUNT=0

              until pg_isready -h "$LD_DB_HOST" -p "$LD_DB_PORT" -U "$LD_DB_USER" -d "$LD_DB_DATABASE" > /dev/null 2>&1; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                  echo "ERROR: Database not ready after ${MAX_RETRIES} attempts ($(($MAX_RETRIES * 2))s)"
                  exit 1
                fi
                echo "Database not ready (attempt $RETRY_COUNT/$MAX_RETRIES), waiting 2s..."
                sleep 2
              done

              echo "Database is ready! Starting application..."
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
        - name: run-migrations
          image: sissbruecker/linkding:1.44.0
          envFrom:
            - secretRef:
                name: linkding-container-env
          command:
            - sh
            - -c
            - |
              echo "Running Django migrations..."
              python manage.py migrate --noinput
              echo "Migrations completed successfully!"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: linkding-data
              mountPath: /etc/linkding/data
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache
      containers:
        - name: linkding
          image: sissbruecker/linkding:1.44.0
          ports:
            - containerPort: 9090
          envFrom:
            - secretRef:
                name: linkding-container-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          volumeMounts:
            - name: linkding-data
              mountPath: /etc/linkding/data
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache
      volumes:
        - name: linkding-data
          persistentVolumeClaim:
            claimName: linkding-data-pvc
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}

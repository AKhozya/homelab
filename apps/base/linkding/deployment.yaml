apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      securityContext:
        fsGroup: 33 # www-data group ID
        runAsUser: 33 # www-data user ID
        runAsGroup: 33 # www-data group ID
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-database-crd
          image: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
          envFrom:
            - secretRef:
                name: linkding-container-env
          env:
            # Override DB_HOST for init check - use direct connection for consistency
            - name: LD_DB_HOST
              value: main-postgres-rw.databases.svc.cluster.local
          command:
            - sh
            - -c
            - |
              echo "Waiting for Database CRD to create ${LD_DB_DATABASE}..."
              MAX_RETRIES=60
              RETRY_COUNT=0

              # Wait for database to be accessible (created by Database CRD)
              until pg_isready -h "$LD_DB_HOST" -p "$LD_DB_PORT" -U "$LD_DB_USER" -d "$LD_DB_DATABASE" > /dev/null 2>&1; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                  echo "ERROR: Database not created by CRD after ${MAX_RETRIES} attempts"
                  exit 1
                fi
                echo "Waiting for Database CRD (attempt $RETRY_COUNT/$MAX_RETRIES)..."
                sleep 2
              done

              echo "Database ${LD_DB_DATABASE} is ready!"
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
        - name: run-migrations
          image: sissbruecker/linkding:1.44.1
          envFrom:
            - secretRef:
                name: linkding-container-env
          env:
            # Override DB_HOST for migrations - must use direct connection, not pooler
            - name: LD_DB_HOST
              value: main-postgres-rw.databases.svc.cluster.local
          command:
            - sh
            - -c
            - |
              echo "Running Django migrations..."
              python manage.py migrate --noinput
              echo "Migrations completed successfully!"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: linkding-data
              mountPath: /etc/linkding/data
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache
      containers:
        - name: linkding
          image: sissbruecker/linkding:1.44.1
          ports:
            - containerPort: 9090
          envFrom:
            - secretRef:
                name: linkding-container-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          volumeMounts:
            - name: linkding-data
              mountPath: /etc/linkding/data
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache
      volumes:
        - name: linkding-data
          persistentVolumeClaim:
            claimName: linkding-data-pvc
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}

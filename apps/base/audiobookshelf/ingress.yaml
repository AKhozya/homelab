apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: audiobookshelf-redirect-https@kubernetescrd
    external-dns.alpha.kubernetes.io/hostname: audiobooks.h0melab.work
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - audiobooks.h0melab.work
      secretName: audiobookshelf-tls-secret
  rules:
    - host: audiobooks.h0melab.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: audiobookshelf
                port:
                  number: 3005

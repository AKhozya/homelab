apiVersion: apps/v1
kind: Deployment
metadata:
  name: homehub
  namespace: homehub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homehub
  template:
    metadata:
      labels:
        app: homehub
    spec:
      serviceAccountName: homehub
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: setup-config
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              # Read password from secret
              PASSWORD=$(cat /tmp/secret/password)
              # Substitute placeholder with actual password in config
              sed "s/PLACEHOLDER_PASSWORD/$PASSWORD/g" /tmp/config/config.yml > /app/config/config.yml
              echo "Config file prepared with password from secret"
          volumeMounts:
            - name: config-template
              mountPath: /tmp/config
            - name: secret
              mountPath: /tmp/secret
            - name: runtime-config
              mountPath: /app/config
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: homehub
          image: ghcr.io/surajverma/homehub:0.2.2
          ports:
            - containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # HomeHub needs to write to data directory
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: homehub-data
              mountPath: /app/data
            - name: homehub-data
              mountPath: /app/uploads
              subPath: uploads
            - name: homehub-data
              mountPath: /app/media
              subPath: media
            - name: homehub-data
              mountPath: /app/pdfs
              subPath: pdfs
            - name: runtime-config
              mountPath: /app/config.yml
              subPath: config.yml
              readOnly: true
      volumes:
        - name: homehub-data
          persistentVolumeClaim:
            claimName: homehub-data-pvc
        - name: config-template
          configMap:
            name: homehub-config
        - name: secret
          secret:
            secretName: homehub-password
        - name: runtime-config
          emptyDir: {}

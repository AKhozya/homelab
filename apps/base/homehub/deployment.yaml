apiVersion: apps/v1
kind: Deployment
metadata:
  name: homehub
  namespace: homehub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homehub
  template:
    metadata:
      labels:
        app: homehub
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: homehub
          image: ghcr.io/surajverma/homehub:latest
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # HomeHub needs to write to data directory
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: homehub-data
              mountPath: /app/data
            - name: homehub-data
              mountPath: /app/uploads
              subPath: uploads
            - name: homehub-data
              mountPath: /app/media
              subPath: media
            - name: homehub-data
              mountPath: /app/pdfs
              subPath: pdfs
            - name: config
              mountPath: /app/config.yml
              subPath: config.yml
              readOnly: true
      volumes:
        - name: homehub-data
          persistentVolumeClaim:
            claimName: homehub-data-pvc
        - name: config
          configMap:
            name: homehub-config

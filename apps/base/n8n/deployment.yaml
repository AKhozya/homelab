apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: create-database
          image: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
          envFrom:
            - secretRef:
                name: n8n-env
          command:
            - sh
            - -c
            - |
              echo "Creating database ${DB_POSTGRESDB_DATABASE} if it doesn't exist..."
              export PGPASSWORD="$DB_POSTGRESDB_PASSWORD"

              # Wait for PostgreSQL to be ready
              until pg_isready -h "$DB_POSTGRESDB_HOST" -p "$DB_POSTGRESDB_PORT" -U "$DB_POSTGRESDB_USER" -d postgres > /dev/null 2>&1; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done

              # Wait for user role to be created by CloudNativePG (retry authentication)
              echo "Waiting for user role $DB_POSTGRESDB_USER to be available..."
              MAX_RETRIES=30
              RETRY_COUNT=0
              while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                if psql -h "$DB_POSTGRESDB_HOST" -p "$DB_POSTGRESDB_PORT" -U "$DB_POSTGRESDB_USER" -d postgres -c "SELECT 1" > /dev/null 2>&1; then
                  echo "User role is available!"
                  break
                fi
                RETRY_COUNT=$((RETRY_COUNT + 1))
                echo "Waiting for role (attempt $RETRY_COUNT/$MAX_RETRIES)..."
                sleep 2
              done

              if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                echo "ERROR: User role $DB_POSTGRESDB_USER not available after ${MAX_RETRIES} attempts"
                exit 1
              fi

              # Check if database exists
              DB_EXISTS=$(psql -h "$DB_POSTGRESDB_HOST" -p "$DB_POSTGRESDB_PORT" -U "$DB_POSTGRESDB_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$DB_POSTGRESDB_DATABASE'")

              if [ "$DB_EXISTS" = "1" ]; then
                echo "Database ${DB_POSTGRESDB_DATABASE} already exists"
              else
                echo "Creating database ${DB_POSTGRESDB_DATABASE}..."
                if psql -h "$DB_POSTGRESDB_HOST" -p "$DB_POSTGRESDB_PORT" -U "$DB_POSTGRESDB_USER" -d postgres -c "CREATE DATABASE \"$DB_POSTGRESDB_DATABASE\" OWNER \"$DB_POSTGRESDB_USER\""; then
                  echo "Database ${DB_POSTGRESDB_DATABASE} created successfully"
                else
                  echo "ERROR: Failed to create database ${DB_POSTGRESDB_DATABASE}"
                  exit 1
                fi
              fi
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
        - name: wait-for-db
          image: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
          envFrom:
            - secretRef:
                name: n8n-env
          command:
            - sh
            - -c
            - |
              echo "Waiting for database ${DB_POSTGRESDB_DATABASE} to be ready on ${DB_POSTGRESDB_HOST}:${DB_POSTGRESDB_PORT}..."
              MAX_RETRIES=60
              RETRY_COUNT=0

              until pg_isready -h "$DB_POSTGRESDB_HOST" -p "$DB_POSTGRESDB_PORT" -U "$DB_POSTGRESDB_USER" -d "$DB_POSTGRESDB_DATABASE" > /dev/null 2>&1; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                  echo "ERROR: Database not ready after ${MAX_RETRIES} attempts ($(($MAX_RETRIES * 2))s)"
                  exit 1
                fi
                echo "Database not ready (attempt $RETRY_COUNT/$MAX_RETRIES), waiting 2s..."
                sleep 2
              done

              echo "Database is ready! Starting application..."
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
      containers:
        - name: n8n
          image: n8nio/n8n:1.115.1
          ports:
            - containerPort: 5678
              name: http
          envFrom:
            - secretRef:
                name: n8n-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/node/.cache
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data-pvc
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}

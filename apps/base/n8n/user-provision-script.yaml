apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-user-provision-script
  namespace: n8n
data:
  provision-user.sh: |
    #!/bin/sh
    set -e

    echo "Starting n8n user provisioning..."

    # Wait for n8n to be ready
    echo "Waiting for n8n to be available..."
    MAX_RETRIES=60
    RETRY_COUNT=0
    while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
      if curl -sf http://n8n-service:5678/healthz > /dev/null 2>&1; then
        echo "n8n is ready!"
        break
      fi
      echo "n8n not ready yet, waiting... (attempt $((RETRY_COUNT+1))/$MAX_RETRIES)"
      sleep 5
      RETRY_COUNT=$((RETRY_COUNT+1))
    done

    if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
      echo "Error: n8n did not become ready in time"
      exit 1
    fi

    # Check if owner already exists (n8n will return 400 if owner exists)
    echo "Checking if n8n owner already exists..."
    OWNER_EXISTS=$(curl -sf http://n8n-service:5678/api/v1/owner 2>/dev/null || echo "not_found")

    if echo "$OWNER_EXISTS" | grep -q "id"; then
      echo "Owner already exists, skipping provisioning"
      exit 0
    fi

    # Create owner user via API
    echo "Creating n8n owner user: $N8N_USER_EMAIL"
    RESPONSE=$(curl -sf -X POST http://n8n-service:5678/api/v1/owner/setup \
      -H "Content-Type: application/json" \
      -d "{
        \"email\": \"$N8N_USER_EMAIL\",
        \"firstName\": \"$N8N_USER_FIRSTNAME\",
        \"lastName\": \"$N8N_USER_LASTNAME\",
        \"password\": \"$N8N_USER_PASSWORD\"
      }" 2>&1)

    if [ $? -eq 0 ]; then
      echo "n8n owner user created successfully!"
    else
      echo "Note: Owner might already exist or endpoint unavailable"
      echo "Response: $RESPONSE"
      # Don't fail - owner might already exist
      exit 0
    fi

    echo "User provisioning complete!"

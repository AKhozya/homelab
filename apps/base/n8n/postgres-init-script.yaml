apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: n8n
data:
  init.sh: |
    #!/bin/sh
    set -e

    echo "Starting PostgreSQL database initialization for n8n..."

    # Wait for PostgreSQL to be ready
    echo "Waiting for PostgreSQL to be available..."
    until PGPASSWORD="$ADMIN_PASSWORD" psql -h "$PG_HOST" -p "$PG_PORT" -U "$ADMIN_USER" -d postgres -c '\q' 2>/dev/null; do
      echo "PostgreSQL not ready yet, waiting..."
      sleep 2
    done
    echo "PostgreSQL is ready!"

    # Check if database exists
    echo "Checking if database '$DB_NAME' exists..."
    DB_EXISTS=$(PGPASSWORD="$ADMIN_PASSWORD" psql -h "$PG_HOST" -p "$PG_PORT" -U "$ADMIN_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$DB_NAME'")
    if [ "$DB_EXISTS" = "1" ]; then
      echo "Database '$DB_NAME' already exists, skipping creation"
    else
      echo "Creating database '$DB_NAME'..."
      PGPASSWORD="$ADMIN_PASSWORD" psql -h "$PG_HOST" -p "$PG_PORT" -U "$ADMIN_USER" -d postgres -c "CREATE DATABASE $DB_NAME"
      echo "Database '$DB_NAME' created successfully"
    fi

    # Check if user exists
    echo "Checking if user '$DB_USER' exists..."
    USER_EXISTS=$(PGPASSWORD="$ADMIN_PASSWORD" psql -h "$PG_HOST" -p "$PG_PORT" -U "$ADMIN_USER" -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='$DB_USER'")
    if [ "$USER_EXISTS" = "1" ]; then
      echo "User '$DB_USER' already exists, updating password..."
      PGPASSWORD="$ADMIN_PASSWORD" psql -h "$PG_HOST" -p "$PG_PORT" -U "$ADMIN_USER" -d postgres -c "ALTER USER $DB_USER WITH PASSWORD '$DB_PASSWORD'"
      echo "User '$DB_USER' password updated"
    else
      echo "Creating user '$DB_USER'..."
      PGPASSWORD="$ADMIN_PASSWORD" psql -h "$PG_HOST" -p "$PG_PORT" -U "$ADMIN_USER" -d postgres -c "CREATE USER $DB_USER WITH PASSWORD '$DB_PASSWORD'"
      echo "User '$DB_USER' created successfully"
    fi

    # Grant database permissions
    echo "Granting permissions for user '$DB_USER' on database '$DB_NAME'..."
    PGPASSWORD="$ADMIN_PASSWORD" psql -h "$PG_HOST" -p "$PG_PORT" -U "$ADMIN_USER" -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE $DB_NAME TO $DB_USER"

    # Connect to the database and grant schema permissions
    PGPASSWORD="$ADMIN_PASSWORD" psql -h "$PG_HOST" -p "$PG_PORT" -U "$ADMIN_USER" -d "$DB_NAME" -c "GRANT ALL ON SCHEMA public TO $DB_USER"
    PGPASSWORD="$ADMIN_PASSWORD" psql -h "$PG_HOST" -p "$PG_PORT" -U "$ADMIN_USER" -d "$DB_NAME" -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO $DB_USER"
    PGPASSWORD="$ADMIN_PASSWORD" psql -h "$PG_HOST" -p "$PG_PORT" -U "$ADMIN_USER" -d "$DB_NAME" -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO $DB_USER"

    echo "Permissions granted successfully"
    echo "Database initialization complete!"

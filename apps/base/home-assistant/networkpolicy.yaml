apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: home-assistant-network-policy
  namespace: home-assistant
spec:
  podSelector:
    matchLabels:
      app: home-assistant
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from all namespaces (internal cluster access only)
    # This allows accessing Home Assistant from any pod in the cluster
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8123
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow HTTPS for internet access (integrations, updates, etc.)
    - ports:
        - protocol: TCP
          port: 443
    # Allow HTTP for internet access
    - ports:
        - protocol: TCP
          port: 80
    # Allow mDNS for local device discovery (broadcast)
    - ports:
        - protocol: UDP
          port: 5353
    # Allow access to common IoT device ports on local network
    - ports:
        - protocol: TCP
          port: 1883  # MQTT
        - protocol: TCP
          port: 8883  # MQTT over TLS
    # Allow MySQL HAProxy access (Percona)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
      ports:
        - protocol: TCP
          port: 3306
    # Allow access to local network devices (for integrations)
    # Home Assistant needs to discover and communicate with local IoT devices
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16

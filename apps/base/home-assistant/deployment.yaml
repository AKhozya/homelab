apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      serviceAccountName: home-assistant
      automountServiceAccountToken: false
      securityContext:
        # Home Assistant runs as root but we add security constraints
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: config-setup
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -c
            - |
              # Copy configuration.yaml from ConfigMap to PVC if it doesn't exist or is different
              if [ ! -f /config/configuration.yaml ] || ! cmp -s /config-template/configuration.yaml /config/configuration.yaml; then
                echo "Updating configuration.yaml from ConfigMap..."
                cp /config-template/configuration.yaml /config/configuration.yaml
                echo "Configuration updated successfully"
              else
                echo "Configuration.yaml is up to date"
              fi

              # Create empty YAML files if they don't exist (required by configuration.yaml)
              for file in automations.yaml scripts.yaml scenes.yaml; do
                if [ ! -f /config/$file ]; then
                  echo "Creating empty $file..."
                  echo "[]" > /config/$file
                fi
              done
          volumeMounts:
            - name: home-assistant-data
              mountPath: /config
            - name: config-template
              mountPath: /config-template
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: hacs-install
          image: alpine:3.23.4
          command:
            - /bin/sh
            - -c
            - |
              set -e

              HACS_DIR="/config/custom_components/hacs"

              # Check if HACS is already installed
              if [ -d "$HACS_DIR" ]; then
                echo "✓ HACS already installed at $HACS_DIR"
                exit 0
              fi

              echo "Installing HACS (Home Assistant Community Store)..."

              # Install required packages
              apk add --no-cache wget unzip

              # Create HACS directory
              mkdir -p "$HACS_DIR"

              # Download latest HACS release
              echo "Downloading HACS..."
              wget -q https://github.com/hacs/integration/releases/latest/download/hacs.zip -O /tmp/hacs.zip

              # Extract to hacs directory (force overwrite without prompting)
              echo "Extracting HACS..."
              unzip -o -q /tmp/hacs.zip -d "$HACS_DIR"

              # Cleanup
              rm /tmp/hacs.zip

              # Ensure filesystem sync
              sync

              # Verify installation
              if [ ! -d "$HACS_DIR" ]; then
                echo "❌ ERROR: HACS installation verification failed"
                echo "   Expected directory at: $HACS_DIR"
                exit 1
              fi

              echo "✓ HACS installed successfully at $HACS_DIR"
              echo "  You can now configure HACS via Settings → Devices & Services"
          volumeMounts:
            - name: home-assistant-data
              mountPath: /config
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        # OIDC init container removed — hass-oidc-auth incompatible with HA 2026.4.0
        # Re-add when upstream fixes the login flow issue
        # https://github.com/christiaangoossens/hass-oidc-auth
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.5.2
          ports:
            - containerPort: 8123
              name: http
              protocol: TCP
          env:
            - name: TZ
              value: "Europe/London"
          securityContext:
            # Allow specific capabilities needed for Home Assistant
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                # NOTE: Running as root is required by Home Assistant (official limitation)
                # See SECURITY.md for full security assessment and rationale
                - NET_BIND_SERVICE  # Bind to ports < 1024
                - NET_RAW          # Raw socket access for Ping integration, Bluetooth
                - NET_ADMIN        # Network administration for Bluetooth, device discovery
                - CHOWN            # Change file ownership in /config
                - SETGID           # Set group ID (internal process management)
                - SETUID           # Set user ID (internal process management)
                - DAC_OVERRIDE     # Bypass file permission checks for config files
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: 8123
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /manifest.json
              port: 8123
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: home-assistant-data
              mountPath: /config
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /config/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
      volumes:
        - name: home-assistant-data
          persistentVolumeClaim:
            claimName: home-assistant-data-pvc
        - name: tmp
          emptyDir: {}
        - name: config-template
          configMap:
            name: home-assistant-config
        - name: secrets
          secret:
            secretName: home-assistant-secrets

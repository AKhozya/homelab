apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
data:
  configuration.yaml: |
    # Loads default set of integrations. Do not remove.
    default_config:

    # Load frontend themes from the themes folder
    frontend:
      themes: !include_dir_merge_named themes

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    # HTTP configuration for reverse proxy (Traefik ingress)
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.42.0.0/16  # Kubernetes pod CIDR
        - 10.43.0.0/16  # Kubernetes service CIDR

    # OIDC Authentication with Authentik
    # Requires hass-oidc-auth custom component (install via HACS)
    # https://github.com/christiaangoossens/hass-oidc-auth
    auth_oidc:
      issuer: https://authentik.h0melab.work/application/o/home-assistant/
      client_id: home-assistant
      client_secret: !secret oidc_client_secret
      # Auto-create users on first OIDC login
      auto_create_users: true
      # Use email from OIDC as username in Home Assistant
      username_claim: email

apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: searxng
data:
  settings.yml: |
    use_default_settings: true
    server:
      secret_key: ""  # Overridden by SEARXNG_SECRET env var at runtime
      bind_address: "0.0.0.0"
      port: 8080
      base_url: "https://search.h0melab.work"
      image_proxy: true
    search:
      formats:
        - html
        - json

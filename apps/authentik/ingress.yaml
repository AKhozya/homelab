apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik
  namespace: authentik
  annotations:
    # No rate-limit middleware: rate-limiting the SSO entry point throttles auth flows
    # (all external auth shares the cloudflared pod IP under sourceCriterion depth:0).
    # Per .claude/review-invariants.md: "authentik gets NO rate-limit (breaks auth flow)".
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-https@kubernetescrd,traefik-security-headers@kubernetescrd,traefik-csp-permissive-enforced@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - authentik.h0melab.work
      secretName: authentik-tls-secret
  rules:
    - host: authentik.h0melab.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  number: 9000

apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
  namespace: authentik
spec:
  replicas: 2
  revisionHistoryLimit: 2
  # maxSurge 0: the old pod goes before the new one starts, so a rollout never needs a
  # node beyond the two that the required anti-affinity below already holds.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: authentik
      component: worker
  template:
    metadata:
      labels:
        app: authentik
        component: worker
    spec:
      serviceAccountName: authentik
      automountServiceAccountToken: false
      priorityClassName: homelab-critical  # critical tier (SSO worker)
      # Tolerate the control-plane taint so the anti-affine replicas below can also use the CP node.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: authentik
                  component: worker
              topologyKey: kubernetes.io/hostname
      # Server and worker both run Django migrations on startup. If both run at once, the
      # worker can fail with "table already exists". So this init container waits until the
      # server's /-/health/ready/ endpoint answers, which happens once migrations are complete.
      # That avoids a separate migration Job or a Flux dependsOn.
      initContainers:
        - name: wait-for-server
          image: curlimages/curl:8.22.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for Authentik server to be ready..."
              until curl -sf http://authentik-server:9000/-/health/ready/ > /dev/null; do
                echo "Server not ready yet, retrying in 5 seconds..."
                sleep 5
              done
              echo "Server is ready! Worker can start."
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/goauthentik/server:2026.8.3
          # Always pull to prevent digest mismatch across nodes
          # (Authentik re-publishes tags with different builds)
          imagePullPolicy: Always
          command:
            - ak
            - worker
          envFrom:
            - secretRef:
                name: authentik
          # Override PgBouncer host with direct CNPG connection
          # Worker uses server-side cursors (DECLARE CURSOR) for chunked
          # queries like clean_expired_models. PgBouncer transaction pooling
          # breaks these — cursor disappears between fetches, causing
          # InvalidCursorName errors and memory growth from retries.
          # Direct connection preserves cursors across the session.
          env:
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: main-postgres-rw.databases.svc.cluster.local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          # `ak healthcheck` checks worker health and DB connectivity
          startupProbe:
            exec:
              command: ["ak", "healthcheck"]
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["ak", "healthcheck"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["ak", "healthcheck"]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "600Mi"
            limits:
              # 500m throttled ~40% of CFS periods at ~110m average use — the
              # task workers burst well above their mean inside a 100ms slice.
              cpu: "1000m"
              memory: "800Mi"
          volumeMounts:
            - name: media
              mountPath: /data/media
            - name: tmp
              mountPath: /tmp
            - name: certs
              mountPath: /certs
            - name: blueprints-custom
              mountPath: /blueprints/custom
              readOnly: true
      volumes:
        - name: media
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: certs
          emptyDir: {}
        - name: blueprints-custom
          configMap:
            name: authentik-blueprints-custom

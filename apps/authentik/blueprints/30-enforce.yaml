version: 1
metadata:
  name: homelab-enforce-passkey-mfa
  labels:
    blueprints.goauthentik.io/description: "Tighten default-authentication-mfa-validation: device_classes=[webauthn, totp] (passkey-first with TOTP as fallback 2FA method for device-loss recovery), not_configured_action=configure (force inline enrollment of WebAuthn only — configuration_stages binds only the WebAuthn setup stage, so new users still enroll passkey). webauthn_user_verification=required."
entries:
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    state: present
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      not_configured_action: configure
      device_classes:
        - webauthn
        - totp
      webauthn_user_verification: required
      last_auth_threshold: "seconds=0"
      configuration_stages:
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]

version: 1
metadata:
  name: homelab-remove-password-binding
  labels:
    blueprints.goauthentik.io/description: "Remove default-authentication-password binding (order 20) from default-authentication-flow — passkey-only main flow after 6+ weeks clean passkey ops (decided 2026-06-05 monthly review). Recovery path: TOTP via mfa-validate device_classes (username + TOTP code → re-enroll passkey), or email recovery flow if TOTP lost too. Tradeoff: TOTP alone becomes the weakest login path (phishable vs passkey) — accepted to keep device-loss recovery. Rollback: delete this blueprint entry; binding is re-creatable via authentik default blueprint or manually (FlowStageBinding flow=default-authentication-flow stage=default-authentication-password order=20)."
entries:
  - model: authentik_flows.flowstagebinding
    state: absent
    identifiers:
      target:
        !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage:
        !Find [
          authentik_stages_password.passwordstage,
          [name, default-authentication-password],
        ]
      order: 20

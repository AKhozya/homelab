apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-network-policy
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      app: authentik
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Internal access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9443
    # External access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9443
    # Server ↔ worker (both carry app: authentik)
    - from:
        - podSelector:
            matchLabels:
              app: authentik
      ports:
        - protocol: TCP
          port: 9000
  egress:
    # Allow PostgreSQL access — scoped to the postgres pods, not the whole namespace.
    # podSelector sits under the SAME list item as namespaceSelector, which means AND;
    # as a separate `-` item it would mean OR and grant 5432 to every pod anywhere.
    # cnpg.io/cluster covers both the instances and the rw-pooler pods.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              cnpg.io/cluster: main-postgres
      ports:
        - protocol: TCP
          port: 5432
    # External auth providers and updates
    - ports:
        - protocol: TCP
          port: 443
    # Email notifications (Gmail: smtp.gmail.com:587)
    - ports:
        - protocol: TCP
          port: 587

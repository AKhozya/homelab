apiVersion: v1
kind: ConfigMap
metadata:
  name: mealie-user-provision-script
  namespace: mealie
data:
  provision-user.sh: |
    #!/bin/bash
    set -e

    echo "Starting mealie user provisioning..."

    echo "Installing dependencies (curl, postgresql-client, bcrypt)..."
    apt-get update -qq > /dev/null 2>&1
    apt-get install -y curl postgresql-client > /dev/null 2>&1
    pip install bcrypt > /dev/null 2>&1

    echo "Waiting for mealie to be available..."
    MAX_RETRIES=60
    RETRY_COUNT=0
    while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
      if curl -sf http://mealie:9000/api/app/about > /dev/null 2>&1; then
        echo "mealie is ready!"
        break
      fi
      echo "mealie not ready yet, waiting... (attempt $((RETRY_COUNT+1))/$MAX_RETRIES)"
      sleep 5
      RETRY_COUNT=$((RETRY_COUNT+1))
    done

    if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
      echo "Error: mealie did not become ready in time"
      exit 1
    fi

    # Idempotency gate: if the target credentials already work, there is nothing to do.
    echo "Checking if credentials are already updated..."
    LOGIN_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST http://mealie:9000/api/auth/token \
      -H "Content-Type: application/x-www-form-urlencoded" \
      --data-urlencode "username=${MEALIE_USER_EMAIL}" --data-urlencode "password=${MEALIE_USER_PASSWORD}" 2>&1 || true)

    HTTP_CODE=$(echo "$LOGIN_RESPONSE" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2 || echo "0")

    if [ "$HTTP_CODE" = "200" ]; then
      echo "User credentials already updated successfully - nothing to do"
      exit 0
    fi

    echo "Credentials not yet updated, proceeding with database update..."

    echo "Verifying default user exists..."
    DEFAULT_AUTH=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST http://mealie:9000/api/auth/token \
      -H "Content-Type: application/x-www-form-urlencoded" \
      -d "username=changeme@example.com&password=MyPassword" 2>&1 || true)

    DEFAULT_HTTP_CODE=$(echo "$DEFAULT_AUTH" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2 || echo "0")

    if [ "$DEFAULT_HTTP_CODE" != "200" ]; then
      echo "Error: Default credentials don't work and target credentials don't work either."
      echo "Manual intervention required."
      exit 1
    fi

    echo "Default user verified, proceeding with credential update..."

    echo "Generating bcrypt hash for new password..."
    # Values reach Python and SQL as data, never as code: a quote in the password or the name
    # would otherwise end the literal it was pasted into.
    BCRYPT_HASH=$(python3 -c "import bcrypt, os; print(bcrypt.hashpw(os.environ['MEALIE_USER_PASSWORD'].encode(), bcrypt.gensalt()).decode())")

    if [ -z "$BCRYPT_HASH" ]; then
      echo "Error: Failed to generate bcrypt hash"
      exit 1
    fi

    echo "Bcrypt hash generated successfully"

    echo "Updating user credentials in database..."
    export PGPASSWORD="${POSTGRES_PASSWORD}"

    # psql expands :'var' only in input it reads, not in -c, hence the here-document.
    # The hash travels by environment and \getenv, not -v, so it stays out of psql's argv, which
    # node users and hostPID pods can read. \getenv needs psql 15 or later; the image's Debian
    # trixie ships psql 17.
    export BCRYPT_HASH
    UPDATE_RESULT=$(psql -h "${POSTGRES_SERVER}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -t \
      -v ON_ERROR_STOP=1 \
      -v username="${MEALIE_USER_USERNAME}" -v email="${MEALIE_USER_EMAIL}" \
      -v full_name="${MEALIE_USER_FULLNAME}" 2>&1 <<'SQL'
    \getenv password_hash BCRYPT_HASH
    UPDATE users
       SET username = :'username',
           email = :'email',
           full_name = :'full_name',
           password = :'password_hash'
     WHERE email = 'changeme@example.com';
    SQL
    )

    if echo "$UPDATE_RESULT" | grep -q "UPDATE 1"; then
      echo "Database update successful!"
    else
      echo "Error: Database update failed"
      echo "Result: $UPDATE_RESULT"
      exit 1
    fi

    echo "Verifying new credentials work..."
    VERIFY_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST http://mealie:9000/api/auth/token \
      -H "Content-Type: application/x-www-form-urlencoded" \
      --data-urlencode "username=${MEALIE_USER_EMAIL}" --data-urlencode "password=${MEALIE_USER_PASSWORD}" 2>&1 || true)

    VERIFY_HTTP_CODE=$(echo "$VERIFY_RESPONSE" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2 || echo "0")

    if [ "$VERIFY_HTTP_CODE" = "200" ]; then
      echo "SUCCESS! User credentials updated and verified!"
    else
      echo "Error: Database updated but login verification failed (HTTP $VERIFY_HTTP_CODE)"
      echo "You may need to restart mealie pod for changes to take effect"
      exit 1
    fi

    echo "User provisioning complete!"

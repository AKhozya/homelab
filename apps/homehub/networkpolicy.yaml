apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homehub-network-policy
  namespace: homehub
spec:
  podSelector:
    matchLabels:
      app: homehub
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Internal access only. HomeHub has no cloudflare-tunnel rule by design.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 5000
    # Uptime-kuma probes
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
      ports:
        - protocol: TCP
          port: 5000
  egress: []

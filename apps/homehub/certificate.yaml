apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homehub-tls
  namespace: homehub
spec:
  secretName: homehub-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - hh.h0melab.work
  # Auto-renew 30 days before expiration
  renewBefore: 720h  # 30 days
  # Certificate valid for 90 days (Let's Encrypt default)
  duration: 2160h  # 90 days

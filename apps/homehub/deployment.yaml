apiVersion: apps/v1
kind: Deployment
metadata:
  name: homehub
  namespace: homehub
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: homehub
  template:
    metadata:
      labels:
        app: homehub
    spec:
      serviceAccountName: homehub
      automountServiceAccountToken: false
      priorityClassName: homelab-standard
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: setup-config
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - |
              set -eu
              PASSWORD=$(cat /tmp/secret/password)

              # Fail loudly rather than shipping a config the app would read literally.
              if ! grep -q PLACEHOLDER_PASSWORD /tmp/config/config.yml; then
                echo "ERROR: PLACEHOLDER_PASSWORD not found in config template" >&2
                exit 1
              fi

              # index/substr, not sed: a password containing / or & is a sed metacharacter
              # and would corrupt the substitution. ENVIRON keeps it off the argv too.
              PASSWORD="$PASSWORD" awk '
                BEGIN { k = "PLACEHOLDER_PASSWORD"; v = ENVIRON["PASSWORD"] }
                {
                  out = ""
                  while ((i = index($0, k)) > 0) {
                    out = out substr($0, 1, i - 1) v
                    $0 = substr($0, i + length(k))
                  }
                  print out $0
                }
              ' /tmp/config/config.yml > /app/config/config.yml
              echo "Config file prepared with password from secret"
          volumeMounts:
            - name: config-template
              mountPath: /tmp/config
            - name: secret
              mountPath: /tmp/secret
            - name: runtime-config
              mountPath: /app/config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      containers:
        - name: homehub
          image: ghcr.io/surajverma/homehub:0.2.3
          ports:
            - containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: homehub-data
              mountPath: /app/data
            - name: homehub-data
              mountPath: /app/uploads
              subPath: uploads
            - name: homehub-data
              mountPath: /app/media
              subPath: media
            - name: homehub-data
              mountPath: /app/pdfs
              subPath: pdfs
            - name: runtime-config
              mountPath: /app/config.yml
              subPath: config.yml
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: homehub-data
          persistentVolumeClaim:
            claimName: homehub-data-pvc
        - name: config-template
          configMap:
            name: homehub-config
        - name: secret
          secret:
            secretName: homehub-password
        - name: runtime-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}

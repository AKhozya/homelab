apiVersion: v1
kind: ConfigMap
metadata:
  name: homehub-config
  namespace: homehub
data:
  config.yml: |
    instance_name: "Family Hub"
    password: "PLACEHOLDER_PASSWORD"
    admin_name: "Admin"

    feature_toggles:
      shopping_list: true
      media_downloader: true
      pdf_compressor: true
      qr_generator: true
      notes: true
      shared_cloud: true
      who_is_home: true
      personal_status: true
      chores: true
      recipes: true
      expiry_tracker: true
      url_shortener: true
      expense_tracker: true

    family_members:
      - "Family"

    reminders:
      time_format: "24h"
      calendar_start_day: "monday"
      categories:
        - key: personal
          label: "Personal"
          color: "#3B82F6"
        - key: work
          label: "Work"
          color: "#EF4444"
        - key: family
          label: "Family"
          color: "#10B981"
        - key: bills
          label: "Bills"
          color: "#F59E0B"

    theme:
      primary_color: "#1d4ed8"
      secondary_color: "#a0aec0"
      background_color: "#f7fafc"
      card_background_color: "#fff"
      text_color: "#333"
      sidebar_background_color: "#2563eb"
      sidebar_text_color: "#ffffff"
      sidebar_link_color: "rgba(255,255,255,0.95)"
      sidebar_link_border_color: "rgba(255,255,255,0.18)"
      sidebar_active_color: "#3b82f6"

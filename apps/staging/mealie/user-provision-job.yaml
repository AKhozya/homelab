apiVersion: batch/v1
kind: Job
metadata:
  name: mealie-user-provision
  namespace: mealie
spec:
  ttlSecondsAfterFinished: 86400  # Clean up after 24 hours
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: user-provision
          image: python:3.14-slim
          command: ["/bin/bash", "/scripts/provision-user.sh"]
          env:
            # User credentials to provision
            - name: MEALIE_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: mealie-user-credentials
                  key: email
            - name: MEALIE_USER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mealie-user-credentials
                  key: username
            - name: MEALIE_USER_FULLNAME
              valueFrom:
                secretKeyRef:
                  name: mealie-user-credentials
                  key: fullname
            - name: MEALIE_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-user-credentials
                  key: password
            # Database connection details
            - name: POSTGRES_SERVER
              valueFrom:
                secretKeyRef:
                  name: mealie-env
                  key: POSTGRES_SERVER
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: mealie-env
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mealie-env
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-env
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: mealie-env
                  key: POSTGRES_DB
          volumeMounts:
            - name: provision-script
              mountPath: /scripts
      volumes:
        - name: provision-script
          configMap:
            name: mealie-user-provision-script
            defaultMode: 0755

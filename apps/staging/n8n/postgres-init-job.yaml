apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init
  namespace: n8n
spec:
  ttlSecondsAfterFinished: 86400 # Keep job for 24h for debugging
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
          command: ["/bin/sh", "/scripts/init.sh"]
          env:
            # PostgreSQL admin credentials
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-admin-credentials
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin-credentials
                  key: password
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: postgres-admin-credentials
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: postgres-admin-credentials
                  key: port

            # Target database configuration (from n8n env secret)
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: n8n-env
                  key: DB_POSTGRESDB_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: n8n-env
                  key: DB_POSTGRESDB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-env
                  key: DB_POSTGRESDB_PASSWORD
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: postgres-init-script
            defaultMode: 0755

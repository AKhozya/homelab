apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  template:
    spec:
      containers:
      - name: main
        volumeMounts:
        - name: render-device
          mountPath: /dev/dri/renderD128
      volumes:
      - name: render-device
        hostPath:
          path: /dev/dri/renderD128
          type: CharDevice

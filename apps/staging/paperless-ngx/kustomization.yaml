apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paperless-ngx
resources:
  - ../../base/paperless-ngx
  - paperless-env-secret.yaml
  # OIDC config is embedded in paperless-env-secret.yaml (PAPERLESS_SOCIALACCOUNT_PROVIDERS)
  # No separate OIDC secret needed — paperless reads it from env vars only

apiVersion: batch/v1
kind: Job
metadata:
  name: couchdb-init
  namespace: obsidian
spec:
  template:
    spec:
      serviceAccountName: obsidian
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: curlimages/curl:8.19.0
          command: ["/bin/sh", "/scripts/init.sh"]
          env:
            # CouchDB admin credentials
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: couchdb-admin-credentials
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb-admin-credentials
                  key: password

            # Target database configuration
            - name: COUCHDB_URL
              valueFrom:
                secretKeyRef:
                  name: couchdb-credentials
                  key: database_url
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: couchdb-credentials
                  key: database_name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: couchdb-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb-credentials
                  key: password
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: scripts
          configMap:
            name: couchdb-init-script
            defaultMode: 0755

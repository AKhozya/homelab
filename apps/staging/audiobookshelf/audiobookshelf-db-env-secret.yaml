apiVersion: v1
kind: Secret
metadata:
  name: audiobookshelf-db-env
  namespace: audiobookshelf
  annotations:
    "sops.io/encrypted": "true"
type: Opaque
data:
  POSTGRES_DB: <base64-encoded>
  POSTGRES_USER: <base64-encoded>
  POSTGRES_PASSWORD: <base64-encoded>
  POSTGRES_HOST: <base64-encoded>

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: audiobookshelf
resources:
  - ../../base/audiobookshelf/
  - secret.yaml
  # OIDC config is stored in audiobookshelf's SQLite DB (configured via web UI)
  # No K8s secret needed — app doesn't read OIDC from env or mounted secrets

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rustdesk-network-policy
  namespace: rustdesk
spec:
  podSelector:
    matchLabels:
      app: rustdesk
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # RustDesk clients from anywhere (LAN via servicelb, ETP=Local preserves source IP)
    - ports:
        - { protocol: TCP, port: 21115 }  # hbbs NAT-type test
        - { protocol: TCP, port: 21116 }  # hbbs TCP hole punch / connection
        - { protocol: UDP, port: 21116 }  # hbbs ID registration + heartbeat
        - { protocol: TCP, port: 21117 }  # hbbr relay
  # No egress rules = default-deny egress. Both binaries verified to run fully offline.
  # Defense-in-depth for CVE-2026-30784 (rustdesk-server#670 UDP reflection): a
  # PunchHoleResponse to an address with no active conntrack tuple is a NEW egress
  # connection -> dropped. Primary mitigation is LAN-only reachability; residual =
  # LAN attacker reflecting at currently-registered peers only (x2-3 amplification).

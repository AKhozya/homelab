apiVersion: v1
kind: ConfigMap
metadata:
  name: warp-beacon-config
  namespace: rustdesk
data:
  # 10-year self-signed cert (public half; key in warp-beacon-key SOPS Secret).
  # SHA-256 fingerprint is pinned in the Cloudflare Zero Trust "Managed networks"
  # entry — replacing this cert requires updating that fingerprint or every WARP
  # device silently stops detecting the home network (5s probe timeout = away).
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 64; }
    http {
      access_log off;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server {
        listen 8443 ssl;
        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        location / { return 200; }
      }
    }
  cert.pem: |

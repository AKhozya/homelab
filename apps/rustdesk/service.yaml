apiVersion: v1
kind: Service
metadata:
  name: rustdesk
  namespace: rustdesk
  annotations:
    # servicelb advertises every pool-node IP (.129 W1 + .126 W2); with the pod
    # pinned to W1 and ETP=Local, only 192.168.1.129 carries traffic - clients
    # must be configured with .129. ETP=Local also preserves client source IP.
    description: "RustDesk hbbs+hbbr. Client-facing IP = 192.168.1.129 (W1 pin); .126 is advertised but blackholes by design."
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - { port: 21115, targetPort: 21115, protocol: TCP, name: hbbs-nat }
    - { port: 21116, targetPort: 21116, protocol: TCP, name: hbbs-tcp }
    - { port: 21116, targetPort: 21116, protocol: UDP, name: hbbs-udp }
    - { port: 21117, targetPort: 21117, protocol: TCP, name: hbbr-relay }
  selector:
    app: rustdesk

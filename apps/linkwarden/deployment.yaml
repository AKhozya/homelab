apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkwarden
  namespace: linkwarden
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate  # RWO PVC requires Recreate strategy
  selector:
    matchLabels:
      app: linkwarden
  template:
    metadata:
      labels:
        app: linkwarden
    spec:
      serviceAccountName: linkwarden
      automountServiceAccountToken: false
      priorityClassName: homelab-standard
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-database
          image: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
          command:
            - sh
            - -c
            - |
              echo "Waiting for LinkWarden database..."
              MAX_RETRIES=60
              RETRY_COUNT=0

              until pg_isready -h main-postgres-rw-pooler.databases.svc.cluster.local -p 5432 -U linkwarden -d linkwarden > /dev/null 2>&1; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                  echo "ERROR: Database not ready after ${MAX_RETRIES} attempts"
                  exit 1
                fi
                echo "Waiting for database (attempt $RETRY_COUNT/$MAX_RETRIES)..."
                sleep 2
              done

              echo "Database is ready!"
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
        - name: wait-for-meilisearch
          image: curlimages/curl:8.21.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for Meilisearch..."
              MAX_RETRIES=60
              RETRY_COUNT=0

              until curl -sf http://meilisearch.linkwarden.svc.cluster.local:7700/health > /dev/null 2>&1; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                  echo "ERROR: Meilisearch not ready after ${MAX_RETRIES} attempts"
                  exit 1
                fi
                echo "Waiting for Meilisearch (attempt $RETRY_COUNT/$MAX_RETRIES)..."
                sleep 2
              done

              echo "Meilisearch is ready!"
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
        - name: install-playwright-browsers
          image: ghcr.io/linkwarden/linkwarden:v2.16.0
          command:
            - sh
            - -c
            - |
              set -e
              echo "Installing Playwright Chromium browser..."
              npx playwright install chromium
              if ls -d "${PLAYWRIGHT_BROWSERS_PATH}"/chromium_headless_shell-* >/dev/null 2>&1; then
                echo "Playwright browsers installed successfully!"
              else
                echo "ERROR: Playwright browser not found after install"
                exit 1
              fi
          env:
            - name: PLAYWRIGHT_BROWSERS_PATH
              value: /home/node/.cache/ms-playwright
          volumeMounts:
            - name: playwright-cache
              mountPath: /home/node/.cache
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: linkwarden
          image: ghcr.io/linkwarden/linkwarden:v2.16.0
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: PLAYWRIGHT_BROWSERS_PATH
              value: /home/node/.cache/ms-playwright
          envFrom:
            - secretRef:
                name: linkwarden
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          # /api/v1/config: 210 bytes, unauthenticated, confirms API + DB backend
          startupProbe:
            httpGet:
              path: /api/v1/config
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/config
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/config
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /data/data
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /data/apps/web/.next/cache
            - name: playwright-cache
              mountPath: /home/node/.cache
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: linkwarden-data
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
        - name: playwright-cache
          emptyDir: {}

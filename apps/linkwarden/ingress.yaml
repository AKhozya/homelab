apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkwarden
  namespace: linkwarden
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-https@kubernetescrd,traefik-security-headers@kubernetescrd,traefik-rate-limit-standard@kubernetescrd,traefik-csp@kubernetescrd,traefik-csp-inline@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - linkwarden.h0melab.work
      secretName: linkwarden-tls-secret
  rules:
    - host: linkwarden.h0melab.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linkwarden
                port:
                  number: 3000

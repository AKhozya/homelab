rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  # The only success is at minute 0. Its age first exceeds 8100s at minute 136, so after
  # `for: 15m` the alert fires at minute 151.
  - name: no-recent-success fires at minute 151
    interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="cloudflare-tunnel",cronjob="cloudflared-route-sync"}'
        values: '946684800x200'
      - series: 'kube_cronjob_info{namespace="cloudflare-tunnel",cronjob="cloudflared-route-sync",schedule="7 * * * *"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 150m
        alertname: CloudflareRouteSyncNoRecentSuccess
        exp_alerts: []
        groupname: cloudflare-tunnel-alerts
      - eval_time: 151m
        alertname: CloudflareRouteSyncNoRecentSuccess
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: cloudflare-tunnel
              cronjob: cloudflared-route-sync
            exp_annotations:
              summary: "Cloudflare route sync has not succeeded for over 2 hours"
              description: >-
                CronJob cloudflare-tunnel/cloudflared-route-sync has no successful run in over 2h15m, so nothing compares git with Cloudflare's stored routes.
                Read its logs in Loki: {namespace="cloudflare-tunnel", container="route-sync"}.
        groupname: cloudflare-tunnel-alerts
      - eval_time: 155m
        alertname: CloudflareRouteSyncNeverSucceeded
        exp_alerts: []
        groupname: cloudflare-tunnel-alerts
      - eval_time: 155m
        alertname: CloudflareRouteSyncMetricMissing
        exp_alerts: []
        groupname: cloudflare-tunnel-alerts
  # A success every hour keeps the age under 3600s.
  - name: hourly success stays silent
    interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="cloudflare-tunnel",cronjob="cloudflared-route-sync"}'
        values: '946684800x59 946688400x59 946692000x59 946695600x59 946699200x59'
      - series: 'kube_cronjob_info{namespace="cloudflare-tunnel",cronjob="cloudflared-route-sync",schedule="7 * * * *"}'
        values: '1x300'
    alert_rule_test:
      - eval_time: 290m
        alertname: CloudflareRouteSyncNoRecentSuccess
        exp_alerts: []
        groupname: cloudflare-tunnel-alerts
  # One missed run (success age reaches ~2h) must not fire.
  - name: one missed run stays silent
    interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="cloudflare-tunnel",cronjob="cloudflared-route-sync"}'
        values: '946684800x119 946692000x119'
      - series: 'kube_cronjob_info{namespace="cloudflare-tunnel",cronjob="cloudflared-route-sync",schedule="7 * * * *"}'
        values: '1x240'
    alert_rule_test:
      - eval_time: 119m
        alertname: CloudflareRouteSyncNoRecentSuccess
        exp_alerts: []
        groupname: cloudflare-tunnel-alerts
  # CronJob exists, no success series yet.
  - name: never-succeeded fires after 70m
    interval: 1m
    input_series:
      - series: 'kube_cronjob_info{namespace="cloudflare-tunnel",cronjob="cloudflared-route-sync",schedule="7 * * * *"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 65m
        alertname: CloudflareRouteSyncNeverSucceeded
        exp_alerts: []
        groupname: cloudflare-tunnel-alerts
      - eval_time: 75m
        alertname: CloudflareRouteSyncNeverSucceeded
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: cloudflare-tunnel
              cronjob: cloudflared-route-sync
              schedule: '7 * * * *'
            exp_annotations:
              summary: "Cloudflare route sync has never succeeded"
              description: "CronJob cloudflare-tunnel/cloudflared-route-sync exists but has no successful run after 70 minutes. Read its logs in Loki and the namespace's admission events."
        groupname: cloudflare-tunnel-alerts
      - eval_time: 75m
        alertname: CloudflareRouteSyncNoRecentSuccess
        exp_alerts: []
        groupname: cloudflare-tunnel-alerts
  # The alert fires at minute 70; the first success series appears at minute 80.
  - name: first success clears a firing never-succeeded
    interval: 1m
    input_series:
      - series: 'kube_cronjob_info{namespace="cloudflare-tunnel",cronjob="cloudflared-route-sync",schedule="7 * * * *"}'
        values: '1x120'
      - series: 'kube_cronjob_status_last_successful_time{namespace="cloudflare-tunnel",cronjob="cloudflared-route-sync"}'
        values: '_x79 946689600x40'
    alert_rule_test:
      - eval_time: 75m
        alertname: CloudflareRouteSyncNeverSucceeded
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: cloudflare-tunnel
              cronjob: cloudflared-route-sync
              schedule: '7 * * * *'
            exp_annotations:
              summary: "Cloudflare route sync has never succeeded"
              description: "CronJob cloudflare-tunnel/cloudflared-route-sync exists but has no successful run after 70 minutes. Read its logs in Loki and the namespace's admission events."
        groupname: cloudflare-tunnel-alerts
      - eval_time: 100m
        alertname: CloudflareRouteSyncNeverSucceeded
        exp_alerts: []
        groupname: cloudflare-tunnel-alerts
  # A success series for another CronJob must not hide this one's missing success.
  - name: never-succeeded ignores other cronjobs
    interval: 1m
    input_series:
      - series: 'kube_cronjob_info{namespace="cloudflare-tunnel",cronjob="cloudflared-route-sync",schedule="7 * * * *"}'
        values: '1x120'
      - series: 'kube_cronjob_status_last_successful_time{namespace="cloudflare-tunnel",cronjob="other"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 75m
        alertname: CloudflareRouteSyncNeverSucceeded
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: cloudflare-tunnel
              cronjob: cloudflared-route-sync
              schedule: '7 * * * *'
            exp_annotations:
              summary: "Cloudflare route sync has never succeeded"
              description: "CronJob cloudflare-tunnel/cloudflared-route-sync exists but has no successful run after 70 minutes. Read its logs in Loki and the namespace's admission events."
        groupname: cloudflare-tunnel-alerts
  # Another CronJob reports kube_cronjob_info; route-sync's series is missing.
  - name: metric-missing fires after 30m
    interval: 1m
    input_series:
      - series: 'kube_cronjob_info{namespace="cloudflare-tunnel",cronjob="other"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: CloudflareRouteSyncMetricMissing
        exp_alerts: []
        groupname: cloudflare-tunnel-alerts
      - eval_time: 35m
        alertname: CloudflareRouteSyncMetricMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: cloudflare-tunnel
              cronjob: cloudflared-route-sync
            exp_annotations:
              summary: "Cloudflare route sync CronJob metric is missing"
              description: "No kube_cronjob_info series for cloudflare-tunnel/cloudflared-route-sync for 30 minutes. Check that the CronJob exists and that kube-state-metrics is healthy."
        groupname: cloudflare-tunnel-alerts
      - eval_time: 35m
        alertname: CloudflareRouteSyncNeverSucceeded
        exp_alerts: []
        groupname: cloudflare-tunnel-alerts

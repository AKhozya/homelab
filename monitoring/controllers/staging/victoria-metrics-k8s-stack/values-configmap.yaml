apiVersion: v1
kind: ConfigMap
metadata:
  name: victoria-metrics-k8s-stack-values
  namespace: monitoring
data:
  values.yaml: |
    # VictoriaMetrics K8s Stack - Side-by-side with Prometheus
    # Migration period: 7 days
    # Expected memory: 300-500Mi (vs Prometheus 2.5Gi)

    # VMSingle - Time-series database
    victoria-metrics-single:
      enabled: true
      server:
        name: vmsingle
        retentionPeriod: "7d"  # Match Prometheus

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi  # 80% less than Prometheus!

        storageSpec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: local-path
          resources:
            requests:
              storage: 50Gi  # Match Prometheus

        # Expose metrics for monitoring
        serviceMonitor:
          enabled: true

    # VMAgent - Metrics scraper
    vmagent:
      enabled: true
      spec:
        scrapeInterval: 30s  # Match optimized Prometheus config
        externalLabels:
          cluster: homelab

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

        # ServiceMonitor scraping
        serviceScrapeNamespaceSelector: {}
        serviceScrapeSelector: {}
        podScrapeNamespaceSelector: {}
        podScrapeSelector: {}

        # Auto-discover converted ServiceMonitors/PodMonitors
        selectAllByDefault: true

    # VMAlert - Alert evaluation
    vmalert:
      enabled: true
      spec:
        evaluationInterval: 30s

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

        # Point to existing AlertManager
        notifiers:
          - url: http://kube-prometheus-stack-alertmanager.monitoring.svc:9093

        # Datasource (VMSingle)
        datasource:
          url: http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc:8429

        # Auto-discover converted PrometheusRules
        ruleNamespaceSelector: {}
        ruleSelector: {}
        selectAllByDefault: true

    # Disable bundled components (reuse existing)
    grafana:
      enabled: false  # Reuse existing Grafana

    alertmanager:
      enabled: false  # Reuse existing AlertManager

    prometheus-node-exporter:
      enabled: false  # Already running from kube-prometheus-stack

    kube-state-metrics:
      enabled: false  # Already running from kube-prometheus-stack

    # VictoriaMetrics Operator config
    victoria-metrics-operator:
      enabled: false  # Already installed in Phase 2

    # Kubelet scraping config - DROP high-cardinality API server metrics
    kubelet:
      vmScrape:
        spec:
          metricRelabelConfigs:
            # Default drops (from upstream chart)
            - action: labeldrop
              regex: (uid)
            - action: labeldrop
              regex: (id|name)
            - action: drop
              source_labels: [__name__]
              regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)

            # Custom API server histogram drops (match Prometheus config)
            - action: drop
              source_labels: [__name__]
              regex: 'apiserver_request_(duration|sli_duration|body_size)_seconds_bucket'
            - action: drop
              source_labels: [__name__]
              regex: 'apiserver_response_sizes_bucket'
            - action: drop
              source_labels: [__name__]
              regex: 'etcd_request_duration_seconds_bucket'
            - action: drop
              source_labels: [__name__]
              regex: 'apiserver_watch_(cache_read_wait_seconds|events_sizes)_bucket'

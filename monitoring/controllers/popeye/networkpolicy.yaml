apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: popeye-network-policy
  namespace: popeye
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # K8s API. The CIDR is the control-plane node.
    - to:
        - ipBlock:
            cidr: 192.168.1.127/32
      ports:
        - protocol: TCP
          port: 6443

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: popeye-network-policy
  namespace: popeye
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow access to Kubernetes API server
    # API server endpoint: 192.168.1.127:6443 (control plane node)
    - to:
        - ipBlock:
            cidr: 192.168.1.127/32
      ports:
        - protocol: TCP
          port: 6443

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 6h
  timeout: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "86.3.1"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  maxHistory: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  driftDetection:
    mode: enabled
  # standard-tier — postRenderers for chart-managed Deployments/DS; alertmanager STS
  # picks up priorityClassName via values.alertmanager.alertmanagerSpec.priorityClassName below
  # (Prometheus Operator propagates Alertmanager CR field to the generated STS).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: kube-prometheus-stack-operator
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-standard
          - target:
              kind: Deployment
              name: kube-prometheus-stack-grafana
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-standard
          - target:
              kind: Deployment
              name: kube-prometheus-stack-kube-state-metrics
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-standard
          - target:
              kind: DaemonSet
              name: kube-prometheus-stack-prometheus-node-exporter
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-standard
          # seccomp RuntimeDefault (UR2-4 soak) — node-exporter uses hostNetwork/hostPID + /proc,/sys
          # file reads, none of which RuntimeDefault blocks. Strategic-merge preserves chart securityContext.
          - target:
              kind: DaemonSet
              name: kube-prometheus-stack-prometheus-node-exporter
            patch: |-
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: kube-prometheus-stack-prometheus-node-exporter
              spec:
                template:
                  spec:
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
  values:
    grafana:
      replicas: 1
      revisionHistoryLimit: 2
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1200Mi
      # RBAC permissions for dashboard sidecar to list/watch ConfigMaps
      rbac:
        extraPermissions:
          - apiGroups: [""]
            resources: ["configmaps"]
            verbs: ["get", "list", "watch"]
      sidecar:
        # Resources apply to all sidecar containers (dashboards + datasources)
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        dashboards:
          enabled: true
        datasources:
          enabled: true
          # Disable auto-created Prometheus datasource (Prometheus server disabled)
          defaultDatasourceEnabled: false
      # Datasources: VictoriaMetrics (default) + Loki
      additionalDataSources:
        - name: VictoriaMetrics
          type: prometheus
          url: http://vmsingle-vmsingle.monitoring.svc:8429
          access: proxy
          isDefault: true
          editable: false
          jsonData:
            timeInterval: "60s"
        - name: Loki
          type: loki
          url: http://loki.loki.svc.cluster.local:3100
          jsonData:
            maxLines: 1000
            derivedFields:
              - datasourceUid: VictoriaMetrics
                matcherRegex: "traceID=(\\w+)"
                name: TraceID
                url: "$${__value.raw}"
          isDefault: false
          editable: false
      admin:
        existingSecret: grafana-admin-secret
        userKey: admin-user
        passwordKey: admin-password
      # Authentik SSO configuration
      extraSecretMounts:
        - name: grafana-oidc
          secretName: grafana-oidc
          defaultMode: 0440
          mountPath: /etc/secrets/grafana-oidc
          readOnly: true
      grafana.ini:
        server:
          root_url: https://grafana.h0melab.work
        auth:
          disable_login_form: true
        auth.basic:
          enabled: false
        auth.anonymous:
          enabled: false
        auth.generic_oauth:
          enabled: true
          name: Authentik
          client_id: $__file{/etc/secrets/grafana-oidc/client-id}
          client_secret: $__file{/etc/secrets/grafana-oidc/client-secret}
          scopes: openid profile email
          auth_url: $__file{/etc/secrets/grafana-oidc/authorization-url}
          token_url: $__file{/etc/secrets/grafana-oidc/token-url}
          api_url: $__file{/etc/secrets/grafana-oidc/userinfo-url}
          role_attribute_path: contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'
          allow_sign_up: true
      # Ingress enabled for internal network access via grafana.h0melab.work
      # DNS points to internal IPs only (192.168.1.127, 192.168.1.129)
      # NOT exposed to the internet - NetworkPolicy restricts external access
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: monitoring-redirect-https@kubernetescrd,monitoring-security-headers@kubernetescrd,monitoring-rate-limit-standard@kubernetescrd,monitoring-csp@kubernetescrd
        hosts:
          - grafana.h0melab.work
        tls:
          - secretName: grafana-tls-secret
            hosts:
            - grafana.h0melab.work

    # Prometheus server disabled — replaced by VictoriaMetrics (VMSingle + VMAgent + VMAlert)
    prometheus:
      enabled: false

    alertmanager:
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ['alertname', 'cluster', 'service', 'instance', 'device']
          group_wait: 10s
          group_interval: 5m
          repeat_interval: 12h
          receiver: 'telegram'
          routes:
          - matchers:
              - alertname = Watchdog
            receiver: 'null'
          - matchers:
              - alertname = InfoInhibitor
            receiver: 'null'
          - matchers:
              - alertname = KubeCPUOvercommit
            receiver: 'null'
          - matchers:
              - alertname = KubeMemoryOvercommit
            receiver: 'null'
          - matchers:
              - alertname = KubeAPIErrorBudgetBurn
            receiver: 'null'
          - matchers:
              - alertname =~ "^(BackupJobFailed|BackupCronJobMissedSchedule|BackupJobRunningTooLong|NoRecentBackups)$"
            receiver: 'telegram-backup'
            continue: false
          # K3s component alerts disabled in defaultRules (embedded architecture)
        inhibit_rules:
          # Suppress pod/container alerts when their node is down
          - source_matchers:
              - alertname = NodeDown
            target_matchers:
              - severity =~ "warning|info"
            equal: [instance]
          # Suppress warning alerts when a critical alert fires for same namespace/pod
          - source_matchers:
              - severity = critical
            target_matchers:
              - severity = warning
            equal: [namespace, alertname]
          # Suppress info alerts when warning or critical fires
          - source_matchers:
              - alertname = InfoInhibitor
            target_matchers:
              - severity = info
        receivers:
        - name: 'null'
        - name: 'telegram'
          telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot_token
            # chat_id is an integer field (no _file variant available in Alertmanager)
            # Not a secret by itself — cannot send messages without bot_token
            chat_id: 113452686
            parse_mode: 'HTML'
            # Limit to 5 alerts max to avoid Telegram 4096 char limit truncation
            message: |
              {{ if eq .Status "firing" }}🔥 <b>FIRING</b>{{ else }}✅ <b>RESOLVED</b>{{ end }} · {{ len .Alerts }} alert{{ if gt (len .Alerts) 1 }}s{{ end }}
              {{ range $i, $a := .Alerts }}{{ if lt $i 5 }}
              <b>{{ $a.Labels.alertname }}</b>{{ if $a.Labels.severity }} · <i>{{ $a.Labels.severity }}</i>{{ end }}{{ if or $a.Labels.namespace $a.Labels.instance }}
              <code>{{ if $a.Labels.namespace }}{{ $a.Labels.namespace }}{{ end }}{{ if $a.Labels.instance }}{{ if $a.Labels.namespace }} · {{ end }}{{ $a.Labels.instance }}{{ end }}</code>{{ end }}
              {{ $a.Annotations.summary }}{{ end }}{{ end }}{{ if gt (len .Alerts) 5 }}
              <i>…and more ({{ len .Alerts }} total)</i>{{ end }}
        - name: 'telegram-backup'
          telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot_token
            # chat_id is an integer field (no _file variant available in Alertmanager)
            # Not a secret by itself — cannot send messages without bot_token
            chat_id: 113452686
            parse_mode: 'HTML'
            # Limit to 5 alerts max to avoid Telegram 4096 char limit truncation
            message: |
              💾 {{ if eq .Status "firing" }}🔥 <b>BACKUP FIRING</b>{{ else }}✅ <b>BACKUP RESOLVED</b>{{ end }} · {{ len .Alerts }} alert{{ if gt (len .Alerts) 1 }}s{{ end }}
              {{ range $i, $a := .Alerts }}{{ if lt $i 5 }}
              <b>{{ $a.Labels.alertname }}</b>{{ if $a.Labels.severity }} · <i>{{ $a.Labels.severity }}</i>{{ end }}{{ if or $a.Labels.namespace $a.Labels.instance }}
              <code>{{ if $a.Labels.namespace }}{{ $a.Labels.namespace }}{{ end }}{{ if $a.Labels.instance }}{{ if $a.Labels.namespace }} · {{ end }}{{ $a.Labels.instance }}{{ end }}</code>{{ end }}
              {{ $a.Annotations.summary }}{{ end }}{{ end }}{{ if gt (len .Alerts) 5 }}
              <i>…and more ({{ len .Alerts }} total)</i>{{ end }}
      # Ingress enabled for internal network access via am.h0melab.work
      # DNS points to internal IPs only (192.168.1.127, 192.168.1.129)
      # NOT exposed to the internet - NetworkPolicy restricts external access
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: monitoring-redirect-https@kubernetescrd,monitoring-security-headers@kubernetescrd,monitoring-rate-limit-standard@kubernetescrd,monitoring-csp@kubernetescrd
        hosts:
          - am.h0melab.work
        tls:
          - secretName: alertmanager-tls-secret
            hosts:
            - am.h0melab.work
      alertmanagerSpec:
        # standard-tier — Prometheus Operator propagates to the generated STS.
        priorityClassName: homelab-standard
        # HA configuration - 2 replicas with anti-affinity
        replicas: 2
        podAntiAffinity: "hard"
        # Configure external URL so Alert Manager generates HTTPS links
        # This prevents mixed content warnings in browsers
        externalUrl: https://am.h0melab.work
        secrets:
          - alertmanager-telegram
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
    # Default PrometheusRules disabled — all alerting rules are VMRules evaluated by VMAlert
    defaultRules:
      create: false

    prometheusOperator:
      revisionHistoryLimit: 2
      # Note: Prometheus Operator runs as single instance by design (uses leader election)
      # The replicas field is hardcoded to 1 in the chart
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 192Mi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    prometheus-node-exporter:
      extraArgs:
        - --collector.textfile.directory=/var/lib/node_exporter/textfile
      extraHostVolumeMounts:
        - name: textfile
          mountPath: /var/lib/node_exporter/textfile
          hostPath: /var/lib/node_exporter/textfile
          type: DirectoryOrCreate
          readOnly: true
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 128Mi

    # kubeApiServer and kubelet metricRelabelings removed — VMAgent handles scraping
    # with equivalent metric drops in VMServiceScrape configs

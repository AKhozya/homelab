apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 6h
  timeout: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.1.0"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  maxHistory: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  driftDetection:
    mode: enabled
  # standard-tier — postRenderers for chart-managed Deployments/DS; alertmanager STS
  # picks up priorityClassName via values.alertmanager.alertmanagerSpec.priorityClassName below
  # (Prometheus Operator propagates Alertmanager CR field to the generated STS).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: kube-prometheus-stack-operator
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-standard
          - target:
              kind: Deployment
              name: kube-prometheus-stack-grafana
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-standard
          - target:
              kind: Deployment
              name: kube-prometheus-stack-kube-state-metrics
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-standard
          - target:
              kind: DaemonSet
              name: kube-prometheus-stack-prometheus-node-exporter
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-standard
          # seccomp RuntimeDefault: node-exporter uses hostNetwork/hostPID and reads
          # /proc,/sys. RuntimeDefault blocks none of that. Strategic-merge keeps the chart's
          # own securityContext; a JSON6902 replace would clobber it.
          - target:
              kind: DaemonSet
              name: kube-prometheus-stack-prometheus-node-exporter
            patch: |-
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: kube-prometheus-stack-prometheus-node-exporter
              spec:
                template:
                  spec:
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
  values:
    grafana:
      replicas: 1
      revisionHistoryLimit: 2
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1200Mi
      sidecar:
        # Resources apply to all sidecar containers (dashboards + datasources)
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        dashboards:
          enabled: true
        datasources:
          enabled: true
          # No Prometheus server runs here for the auto-created datasource to point at.
          defaultDatasourceEnabled: false
      additionalDataSources:
        - name: VictoriaMetrics
          type: prometheus
          url: http://vmsingle-vmsingle.monitoring.svc:8429
          access: proxy
          isDefault: true
          editable: false
          jsonData:
            timeInterval: "60s"
        - name: Loki
          type: loki
          url: http://loki.loki.svc.cluster.local:3100
          jsonData:
            maxLines: 1000
            derivedFields:
              - datasourceUid: VictoriaMetrics
                matcherRegex: "traceID=(\\w+)"
                name: TraceID
                url: "$${__value.raw}"
          isDefault: false
          editable: false
      admin:
        existingSecret: grafana-admin-secret
        userKey: admin-user
        passwordKey: admin-password
      extraSecretMounts:
        - name: grafana-oidc
          secretName: grafana-oidc
          defaultMode: 0440
          mountPath: /etc/secrets/grafana-oidc
          readOnly: true
      grafana.ini:
        server:
          root_url: https://grafana.h0melab.work
        auth:
          disable_login_form: true
        auth.basic:
          enabled: false
        auth.anonymous:
          enabled: false
        auth.generic_oauth:
          enabled: true
          name: Authentik
          client_id: $__file{/etc/secrets/grafana-oidc/client-id}
          client_secret: $__file{/etc/secrets/grafana-oidc/client-secret}
          scopes: openid profile email
          auth_url: $__file{/etc/secrets/grafana-oidc/authorization-url}
          token_url: $__file{/etc/secrets/grafana-oidc/token-url}
          api_url: $__file{/etc/secrets/grafana-oidc/userinfo-url}
          role_attribute_path: contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'
          allow_sign_up: true
      # LAN only. h0melab.work resolves to 192.168.1.127 / .129, and no Cloudflare
      # Tunnel route carries this host.
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: monitoring-redirect-https@kubernetescrd,monitoring-security-headers@kubernetescrd,monitoring-rate-limit-standard@kubernetescrd,monitoring-csp@kubernetescrd
        hosts:
          - grafana.h0melab.work
        tls:
          - secretName: grafana-tls-secret
            hosts:
            - grafana.h0melab.work

    # Prometheus server disabled — replaced by VictoriaMetrics (VMSingle + VMAgent + VMAlert)
    prometheus:
      enabled: false

    # Chart 90.0.0 fails the render if an enabled control-plane component keeps its
    # default serviceMonitor.authorization: prometheus.enabled: false above stops the
    # chart rendering the Secret that field points at.
    # Nothing consumes these ServiceMonitors — vmagent scrapes through the hand-written
    # VMServiceScrapes in monitoring/configs/ and every VM prometheus-converter is off.
    # So the kubelet and API server metric drops live in those VMServiceScrapes, and a
    # metricRelabelings entry here would change nothing.
    # Clearing authorization rather than disabling the component keeps each Grafana
    # dashboard, which the chart gates on the same enabled flag.
    kubelet:
      serviceMonitor:
        authorization: null

    kubeApiServer:
      serviceMonitor:
        authorization: null

    coreDns:
      serviceMonitor:
        authorization: null

    # No scrape path reaches these four — no VMServiceScrape, VMPodScrape,
    # VMStaticScrape, VMScrapeConfig or vmagent additionalScrapeConfigs selects them —
    # so their Services, ServiceMonitors and dashboards carry no data.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false

    alertmanager:
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ['alertname', 'cluster', 'service', 'instance', 'device']
          group_wait: 10s
          group_interval: 5m
          repeat_interval: 12h
          receiver: 'telegram'
          routes:
          - matchers:
              - alertname = Watchdog
            # Dead-man switch: Watchdog always fires, so alertmanager re-notifies
            # every repeat_interval → one heartbeat ping to healthchecks.io per
            # interval. If the monitoring stack dies (e.g. W2 loss takes VMSingle),
            # Watchdog stops, pings stop, healthchecks.io alerts EXTERNALLY — the
            # one alert path that survives cluster-internal monitoring death.
            # 10m cadence: keep the healthchecks.io period+grace comfortably above it.
            receiver: 'deadman'
            group_wait: 0s
            repeat_interval: 10m
          - matchers:
              - alertname = InfoInhibitor
            receiver: 'null'
          - matchers:
              - alertname = KubeCPUOvercommit
            receiver: 'null'
          - matchers:
              - alertname = KubeMemoryOvercommit
            receiver: 'null'
          - matchers:
              - alertname = KubeAPIErrorBudgetBurn
            receiver: 'null'
          - matchers:
              - alertname =~ "^(BackupJobFailed|BackupCronJobMissedSchedule|BackupJobRunningTooLong|NoRecentBackups|NoRecentImmichBackup)$"
            receiver: 'telegram-backup'
            continue: false
        inhibit_rules:
          # No NodeDown inhibit (cut 2026-07-25): equal:[instance] never matches.
          # NodeDown's instance is the node IP and port (192.168.1.x:9100).
          # The pod alerts carry the kube-state-metrics pod IP and port (10.42.x.x:8080).
          # NodeDown also has no node label (live up{} series, 2026-10-04).
          - source_matchers:
              - severity = critical
            target_matchers:
              - severity = warning
            equal: [namespace, alertname]
          - source_matchers:
              - alertname = InfoInhibitor
            target_matchers:
              - severity = info
        receivers:
        - name: 'null'
        - name: 'deadman'
          webhook_configs:
          # url_file keeps the secret UUID out of the plaintext HelmRelease config;
          # mounted from the alertmanager-deadman secret (alertmanagerSpec.secrets).
          - url_file: /etc/alertmanager/secrets/alertmanager-deadman/ping_url
            send_resolved: false
        - name: 'telegram'
          telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot_token
            # Alertmanager reads this file when it sends, not on config reload. If the
            # value is not an integer, every Telegram send fails. That failure shows only
            # in alertmanager_notifications_failed_total and the Alertmanager log.
            # Needs Alertmanager >= 0.31.
            chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat_id
            parse_mode: 'HTML'
            # Limit to 5 alerts max to avoid Telegram 4096 char limit truncation
            message: |
              {{ if eq .Status "firing" }}🔥 <b>FIRING</b>{{ else }}✅ <b>RESOLVED</b>{{ end }} · {{ len .Alerts }} alert{{ if gt (len .Alerts) 1 }}s{{ end }}
              {{ range $i, $a := .Alerts }}{{ if lt $i 5 }}
              <b>{{ $a.Labels.alertname }}</b>{{ if $a.Labels.severity }} · <i>{{ $a.Labels.severity }}</i>{{ end }}{{ if or $a.Labels.namespace $a.Labels.instance }}
              <code>{{ if $a.Labels.namespace }}{{ $a.Labels.namespace }}{{ end }}{{ if $a.Labels.instance }}{{ if $a.Labels.namespace }} · {{ end }}{{ $a.Labels.instance }}{{ end }}</code>{{ end }}
              {{ $a.Annotations.summary }}{{ end }}{{ end }}{{ if gt (len .Alerts) 5 }}
              <i>…and more ({{ len .Alerts }} total)</i>{{ end }}
        - name: 'telegram-backup'
          telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot_token
            chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat_id
            parse_mode: 'HTML'
            # Same 5-alert cap as the telegram receiver above.
            message: |
              💾 {{ if eq .Status "firing" }}🔥 <b>BACKUP FIRING</b>{{ else }}✅ <b>BACKUP RESOLVED</b>{{ end }} · {{ len .Alerts }} alert{{ if gt (len .Alerts) 1 }}s{{ end }}
              {{ range $i, $a := .Alerts }}{{ if lt $i 5 }}
              <b>{{ $a.Labels.alertname }}</b>{{ if $a.Labels.severity }} · <i>{{ $a.Labels.severity }}</i>{{ end }}{{ if or $a.Labels.namespace $a.Labels.instance }}
              <code>{{ if $a.Labels.namespace }}{{ $a.Labels.namespace }}{{ end }}{{ if $a.Labels.instance }}{{ if $a.Labels.namespace }} · {{ end }}{{ $a.Labels.instance }}{{ end }}</code>{{ end }}
              {{ $a.Annotations.summary }}{{ end }}{{ end }}{{ if gt (len .Alerts) 5 }}
              <i>…and more ({{ len .Alerts }} total)</i>{{ end }}
      # LAN only. h0melab.work resolves to 192.168.1.127 / .129, and no Cloudflare
      # Tunnel route carries this host.
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          # basic-auth sits AFTER rate-limit deliberately: a 401 short-circuits the
          # chain, so auth placed earlier would leave brute-force attempts unthrottled.
          traefik.ingress.kubernetes.io/router.middlewares: monitoring-redirect-https@kubernetescrd,monitoring-security-headers@kubernetescrd,monitoring-rate-limit-standard@kubernetescrd,monitoring-alertmanager-basic-auth@kubernetescrd,monitoring-csp@kubernetescrd
        hosts:
          - am.h0melab.work
        tls:
          - secretName: alertmanager-tls-secret
            hosts:
            - am.h0melab.work
      alertmanagerSpec:
        # standard-tier — Prometheus Operator propagates to the generated STS.
        priorityClassName: homelab-standard
        replicas: 2
        podAntiAffinity: "hard"
        # Alertmanager builds its silence and alert links from this. Without it they
        # point at the pod address, which no browser outside the cluster can reach.
        externalUrl: https://am.h0melab.work
        secrets:
          - alertmanager-telegram
          - alertmanager-deadman
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
    # Default PrometheusRules disabled — all alerting rules are VMRules evaluated by VMAlert
    defaultRules:
      create: false

    prometheusOperator:
      revisionHistoryLimit: 2
      # The chart's pre-upgrade admission-webhook cert patch Jobs (job-createSecret /
      # job-patchWebhook) ship with no resource limits. Kyverno require-resource-limits denies
      # them at admission, so the chart upgrade stalls (87.15.2 and 87.16.0 both stalled after
      # 4 attempts and rolled back to 87.15.1). Helm hook Jobs pass admission like any workload,
      # so their limits must come from values.
      admissionWebhooks:
        patch:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 192Mi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    kube-state-metrics:
      revisionHistoryLimit: 2
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      # Publishes each Flux object's Ready condition as gotk_resource_info for the
      # FluxResourceNotReady rule. Flux 2.8 dropped its own readiness metric, and a failed
      # Kustomization reconcile never reaches controller_runtime_reconcile_errors_total
      # (kustomize-controller v1.9.6 returns a nil error after a failed reconcile).
      # Flux's reference config also sets `collectors: []` and --custom-resource-state-only.
      # Leave both unset: they switch off every kube_* metric the other rules read.
      rbac:
        extraRules:
          - apiGroups: [source.toolkit.fluxcd.io, kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io]
            resources: [gitrepositories, helmrepositories, helmcharts, kustomizations, helmreleases]
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind: {group: kustomize.toolkit.fluxcd.io, version: v1, kind: Kustomization}
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux Kustomization.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
              - groupVersionKind: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease}
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRelease.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
              - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: GitRepository}
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux GitRepository.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
              - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: HelmRepository}
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRepository.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
              - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: HelmChart}
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmChart.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]

    prometheus-node-exporter:
      extraArgs:
        - --collector.textfile.directory=/var/lib/node_exporter/textfile
        - --collector.systemd
      # The systemd collector reads the host's system bus. The chart already mounts the host root
      # read-only at /host/root, so pointing godbus there needs no extra hostPath (Kyverno
      # disallow-host-path). The socket is mode 0666, and systemd lets any user call ListUnits.
      env:
        DBUS_SYSTEM_BUS_ADDRESS: unix:path=/host/root/run/dbus/system_bus_socket
      extraHostVolumeMounts:
        - name: textfile
          mountPath: /var/lib/node_exporter/textfile
          hostPath: /var/lib/node_exporter/textfile
          type: DirectoryOrCreate
          readOnly: true
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 128Mi

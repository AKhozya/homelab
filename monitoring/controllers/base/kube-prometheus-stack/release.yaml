apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 6h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "80.7.0"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    grafana:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1200Mi
      # RBAC permissions for dashboard sidecar to list/watch ConfigMaps
      rbac:
        pspEnabled: false
        extraPermissions:
          - apiGroups: [""]
            resources: ["configmaps"]
            verbs: ["get", "list", "watch"]
      sidecar:
        dashboards:
          enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
        datasources:
          enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      # Additional datasources
      additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki.loki.svc.cluster.local:3100
          jsonData:
            maxLines: 1000
            derivedFields:
              - datasourceUid: prometheus
                matcherRegex: "traceID=(\\w+)"
                name: TraceID
                url: "$${__value.raw}"
          isDefault: false
          editable: false
      admin:
        existingSecret: grafana-admin-secret
        userKey: admin-user
        passwordKey: admin-password
      # Authentik SSO configuration
      extraSecretMounts:
        - name: grafana-oidc
          secretName: grafana-oidc
          defaultMode: 0440
          mountPath: /etc/secrets/grafana-oidc
          readOnly: true
      grafana.ini:
        server:
          root_url: https://grafana.h0melab.work
        auth:
          disable_login_form: true
        auth.basic:
          enabled: false
        auth.anonymous:
          enabled: false
        auth.generic_oauth:
          enabled: true
          name: Authentik
          client_id: $__file{/etc/secrets/grafana-oidc/client-id}
          client_secret: $__file{/etc/secrets/grafana-oidc/client-secret}
          scopes: openid profile email
          auth_url: $__file{/etc/secrets/grafana-oidc/authorization-url}
          token_url: $__file{/etc/secrets/grafana-oidc/token-url}
          api_url: $__file{/etc/secrets/grafana-oidc/userinfo-url}
          role_attribute_path: contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'
          allow_sign_up: true
      # Ingress enabled for internal network access via grafana.h0melab.work
      # DNS points to internal IPs only (192.168.1.127, 192.168.1.129)
      # NOT exposed to the internet - NetworkPolicy restricts external access
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: monitoring-redirect-https@kubernetescrd,monitoring-security-headers@kubernetescrd,monitoring-rate-limit-standard@kubernetescrd,monitoring-csp@kubernetescrd
        hosts:
          - grafana.h0melab.work
        tls:
          - secretName: grafana-tls-secret
            hosts:
            - grafana.h0melab.work
    
    prometheus:
      prometheusSpec:
        # HA configuration - 2 replicas with anti-affinity
        replicas: 2
        podAntiAffinity: "hard"
        # Global scrape interval increased from 30s to 60s for memory optimization
        scrapeInterval: 60s
        # Retention increased to 90 days for historical analysis
        retention: 90d
        retentionSize: 50GB
        resources:
          requests:
            cpu: 200m
            memory: 1000Mi
          limits:
            cpu: 500m
            memory: 1500Mi
        # Config reloader sidecar resources
        configReloaderCpu: "50m"
        configReloaderMemory: "64Mi"
        configReloaderCpuLimit: "200m"
        configReloaderMemoryLimit: "192Mi"
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
    
    alertmanager:
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ['alertname', 'cluster', 'service']
          group_wait: 10s
          group_interval: 10s
          repeat_interval: 12h
          receiver: 'telegram'
          routes:
          - match:
              alertname: Watchdog
            receiver: 'null'
          - match:
              alertname: InfoInhibitor
            receiver: 'null'
          - match:
              alertname: KubeCPUOvercommit
            receiver: 'null'
          - match:
              alertname: KubeMemoryOvercommit
            receiver: 'null'
          - match:
              alertname: KubeAPIErrorBudgetBurn
            receiver: 'null'
          - match_re:
              alertname: ^(BackupJobFailed|BackupCronJobMissedSchedule|BackupJobRunningTooLong|NoRecentBackups)$
            receiver: 'telegram-backup'
            continue: false
          # K3s component alerts disabled in defaultRules (embedded architecture)
        receivers:
        - name: 'null'
        - name: 'telegram'
          telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot_token
            chat_id: 113452686
            parse_mode: 'HTML'
            message: |
              <b>{{ .Status | toUpper }}</b>
              {{ range .Alerts }}
              <b>Alert:</b> {{ .Labels.alertname }}
              <b>Severity:</b> {{ .Labels.severity }}
              <b>Summary:</b> {{ .Annotations.summary }}
              <b>Description:</b> {{ .Annotations.description }}
              {{ if .Labels.namespace }}<b>Namespace:</b> {{ .Labels.namespace }}{{ end }}
              {{ if .Labels.pod }}<b>Pod:</b> {{ .Labels.pod }}{{ end }}
              {{ end }}
        - name: 'telegram-backup'
          telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot_token
            chat_id: 113452686
            parse_mode: 'HTML'
            message: |
              💾 <b>BACKUP {{ .Status | toUpper }}</b>
              {{ range .Alerts }}
              <b>Alert:</b> {{ .Labels.alertname }}
              <b>Severity:</b> {{ .Labels.severity }}
              <b>Summary:</b> {{ .Annotations.summary }}
              <b>Description:</b> {{ .Annotations.description }}
              {{ if .Labels.namespace }}<b>Namespace:</b> {{ .Labels.namespace }}{{ end }}
              {{ if .Labels.pod }}<b>Pod:</b> {{ .Labels.pod }}{{ end }}
              {{ if .Labels.container }}<b>Container:</b> {{ .Labels.container }}{{ end }}
              {{ end }}
      # Ingress enabled for internal network access via am.h0melab.work
      # DNS points to internal IPs only (192.168.1.127, 192.168.1.129)
      # NOT exposed to the internet - NetworkPolicy restricts external access
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: monitoring-redirect-https@kubernetescrd,monitoring-security-headers@kubernetescrd,monitoring-rate-limit-standard@kubernetescrd,monitoring-csp@kubernetescrd
        hosts:
          - am.h0melab.work
        tls:
          - secretName: alertmanager-tls-secret
            hosts:
            - am.h0melab.work
      alertmanagerSpec:
        # HA configuration - 2 replicas with anti-affinity
        replicas: 2
        podAntiAffinity: "hard"
        # Configure external URL so Alert Manager generates HTTPS links
        # This prevents mixed content warnings in browsers
        externalUrl: https://am.h0melab.work
        secrets:
          - alertmanager-telegram
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        # Config reloader sidecar resources
        configReloaderCpu: "50m"
        configReloaderMemory: "64Mi"
        configReloaderCpuLimit: "200m"
        configReloaderMemoryLimit: "128Mi"
    
    # Disable K3s-specific component alerts (embedded architecture)
    # Disable CPU overcommit alert (homelab - intentional overcommit for burst capacity)
    # Disable API server error budget alerts (homelab - SLI/SLO tracking not needed)
    defaultRules:
      rules:
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeControllerManager: false
        kubeScheduler: false  # Disable all scheduler rules
        kubeCPUOvercommit: false  # Disable CPU overcommit warning (homelab uses intentional overcommit)
        kubeAPIServer: false  # Disable API error budget burn alerts (overkill for homelab)

    prometheusOperator:
      # Note: Prometheus Operator runs as single instance by design (uses leader election)
      # The replicas field is hardcoded to 1 in the chart
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    
    kube-state-metrics:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 128Mi

    # Drop high-cardinality histogram metrics and low-utility container metrics
    # Reduces ~21k series (apiserver_request_* + workqueue_* + scheduler_plugin_* + prober_probe_* + container_* + kubelet_* buckets)
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
          - sourceLabels: [__name__]
            regex: 'apiserver_request_(duration|sli_duration)_seconds_bucket'
            action: drop
          # Fixed: apiserver_request_body_size uses _bytes_bucket not _seconds_bucket (11k series)
          - sourceLabels: [__name__]
            regex: 'apiserver_request_body_size_bytes_bucket'
            action: drop
          - sourceLabels: [__name__]
            regex: 'apiserver_response_sizes_bucket'
            action: drop
          - sourceLabels: [__name__]
            regex: 'etcd_request_duration_seconds_bucket'
            action: drop
          - sourceLabels: [__name__]
            regex: 'apiserver_watch_(cache_read_wait_seconds|events_sizes)_bucket'
            action: drop
          # Drop workqueue metrics from apiserver (4.5k series)
          - sourceLabels: [__name__]
            regex: 'workqueue_(work|queue)_duration_seconds_bucket'
            action: drop
          # Drop scheduler plugin metrics from apiserver (1.2k series)
          - sourceLabels: [__name__]
            regex: 'scheduler_plugin_execution_duration_seconds_bucket'
            action: drop
          # Drop storage operation histograms (980 series)
          - sourceLabels: [__name__]
            regex: 'storage_operation_duration_seconds_bucket'
            action: drop
          # Drop kubernetes feature flags (832 series, informational only)
          - sourceLabels: [__name__]
            regex: 'kubernetes_feature_enabled'
            action: drop
          # Drop admission controller histograms (756 series)
          - sourceLabels: [__name__]
            regex: 'apiserver_admission_controller_admission_duration_seconds_bucket'
            action: drop
          # Drop rest client histograms (1.4k series total)
          - sourceLabels: [__name__]
            regex: 'rest_client_(request_duration|request_size|response_size)_bytes?_bucket'
            action: drop
          # Drop histogram count/sum for already-dropped buckets (~4.6k series cumulative)
          - sourceLabels: [__name__]
            regex: 'apiserver_request_sli_duration_seconds_(count|sum)'
            action: drop
          - sourceLabels: [__name__]
            regex: 'apiserver_response_sizes_(count|sum)'
            action: drop
          - sourceLabels: [__name__]
            regex: 'etcd_request_duration_seconds_(count|sum)'
            action: drop
          # Drop workqueue histogram count/sum (768 series - buckets already dropped)
          - sourceLabels: [__name__]
            regex: 'workqueue_(work|queue)_duration_seconds_(count|sum)'
            action: drop
          # Drop Go runtime histogram buckets (~1.3k series - internal GC/scheduler timing)
          - sourceLabels: [__name__]
            regex: 'go_(gc_heap_|sched_).*_bucket'
            action: drop
          - sourceLabels: [__name__]
            regex: 'go_gc_pauses_seconds_bucket'
            action: drop

    # K3s-specific fix for cadvisor metrics
    # K3s exports container='' (empty) with actual name in 'name' label
    # Copy 'name' → 'container' for dashboard compatibility
    kubelet:
      serviceMonitor:
        # Reduce scrape interval from 10s to 60s for memory optimization
        # Reduces kubelet/cadvisor series by 83% (134k → 22k series)
        interval: 60s
        # Drop high-cardinality API server histogram metrics from kubelet scrapes
        # Kubelet exposes apiserver metrics which create ~95k series
        metricRelabelings:
          - sourceLabels: [__name__]
            regex: 'apiserver_request_(duration|sli_duration)_seconds_bucket'
            action: drop
          # Fixed: apiserver_request_body_size uses _bytes_bucket not _seconds_bucket (11k series)
          - sourceLabels: [__name__]
            regex: 'apiserver_request_body_size_bytes_bucket'
            action: drop
          - sourceLabels: [__name__]
            regex: 'apiserver_response_sizes_bucket'
            action: drop
          - sourceLabels: [__name__]
            regex: 'etcd_request_duration_seconds_bucket'
            action: drop
          - sourceLabels: [__name__]
            regex: 'apiserver_watch_(cache_read_wait_seconds|events_sizes)_bucket'
            action: drop
          # Drop workqueue metrics from kubelet (4.5k series)
          - sourceLabels: [__name__]
            regex: 'workqueue_(work|queue)_duration_seconds_bucket'
            action: drop
          # Drop scheduler plugin metrics from kubelet (1.2k series)
          - sourceLabels: [__name__]
            regex: 'scheduler_plugin_execution_duration_seconds_bucket'
            action: drop
          # Drop storage operation histograms (980 series)
          - sourceLabels: [__name__]
            regex: 'storage_operation_duration_seconds_bucket'
            action: drop
          # Drop kubernetes feature flags (832 series, informational only)
          - sourceLabels: [__name__]
            regex: 'kubernetes_feature_enabled'
            action: drop
          # Drop admission controller histograms (756 series)
          - sourceLabels: [__name__]
            regex: 'apiserver_admission_controller_admission_duration_seconds_bucket'
            action: drop
          # Drop rest client histograms (1.4k series total)
          - sourceLabels: [__name__]
            regex: 'rest_client_(request_duration|request_size|response_size)_bytes?_bucket'
            action: drop
          # Drop all kubelet histogram buckets (~1.5k series - internal timing not useful)
          - sourceLabels: [__name__]
            regex: 'kubelet_.*_bucket'
            action: drop
          # Drop histogram count/sum for already-dropped buckets (~4.6k series cumulative)
          - sourceLabels: [__name__]
            regex: 'apiserver_request_sli_duration_seconds_(count|sum)'
            action: drop
          - sourceLabels: [__name__]
            regex: 'apiserver_response_sizes_(count|sum)'
            action: drop
          - sourceLabels: [__name__]
            regex: 'etcd_request_duration_seconds_(count|sum)'
            action: drop
          # Drop workqueue histogram count/sum (768 series - buckets already dropped)
          - sourceLabels: [__name__]
            regex: 'workqueue_(work|queue)_duration_seconds_(count|sum)'
            action: drop
          # Drop Go runtime histogram buckets (~1.3k series - internal GC/scheduler timing)
          - sourceLabels: [__name__]
            regex: 'go_(gc_heap_|sched_).*_bucket'
            action: drop
          - sourceLabels: [__name__]
            regex: 'go_gc_pauses_seconds_bucket'
            action: drop
        cAdvisorMetricRelabelings:
          - sourceLabels: [name]
            targetLabel: container
          # Drop low-utility container metrics (2.2k series reduction)
          - sourceLabels: [__name__]
            regex: 'container_tasks_state'
            action: drop
          - sourceLabels: [__name__]
            regex: 'container_memory_failures_total'
            action: drop
          - sourceLabels: [__name__]
            regex: 'container_blkio_device_usage_total'
            action: drop
        probesMetricRelabelings:
          # Drop prober probe duration buckets from kubelet /metrics/probes endpoint (1.4k series)
          - sourceLabels: [__name__]
            regex: 'prober_probe_duration_seconds_bucket'
            action: drop

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 6h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "78.3.2"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    grafana:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      sidecar:
        dashboards:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
        datasources:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      # Additional datasources
      additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki-gateway.loki.svc.cluster.local
          jsonData:
            maxLines: 1000
            derivedFields:
              - datasourceUid: prometheus
                matcherRegex: "traceID=(\\w+)"
                name: TraceID
                url: "$${__value.raw}"
          isDefault: false
          editable: false
      admin:
        existingSecret: grafana-admin-secret
        userKey: admin-user
        passwordKey: admin-password
      # Ingress enabled for internal network access via grafana.h0melab.work
      # DNS points to internal IPs only (192.168.1.127, 192.168.1.129)
      # NOT exposed to the internet - NetworkPolicy restricts external access
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: monitoring-redirect-https@kubernetescrd
        hosts:
          - grafana.h0melab.work
        tls:
          - secretName: grafana-tls-secret
            hosts:
            - grafana.h0melab.work
    
    prometheus:
      prometheusSpec:
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
    
    alertmanager:
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ['alertname', 'cluster', 'service']
          group_wait: 10s
          group_interval: 10s
          repeat_interval: 12h
          receiver: 'telegram'
          routes:
          - match:
              alertname: Watchdog
            receiver: 'null'
          # Silence K3s-specific false positives
          - match:
              alertname: KubeProxyDown
            receiver: 'null'
          - match:
              alertname: KubeSchedulerDown
            receiver: 'null'
          - match:
              alertname: KubeControllerManagerDown
            receiver: 'null'
        receivers:
        - name: 'null'
        - name: 'telegram'
          telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot_token
            chat_id: 113452686
            parse_mode: 'HTML'
            message: |
              <b>{{ .Status | toUpper }}</b>
              {{ range .Alerts }}
              <b>Alert:</b> {{ .Labels.alertname }}
              <b>Severity:</b> {{ .Labels.severity }}
              <b>Summary:</b> {{ .Annotations.summary }}
              <b>Description:</b> {{ .Annotations.description }}
              {{ if .Labels.namespace }}<b>Namespace:</b> {{ .Labels.namespace }}{{ end }}
              {{ if .Labels.pod }}<b>Pod:</b> {{ .Labels.pod }}{{ end }}
              {{ end }}
      # Ingress disabled for security - use kubectl port-forward instead
      # To access: kubectl port-forward -n monitoring svc/kube-prometheus-stack-alertmanager 9093:9093
      ingress:
        enabled: false
      alertmanagerSpec:
        secrets:
          - alertmanager-telegram
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
    
    prometheusOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    
    kube-state-metrics:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 128Mi

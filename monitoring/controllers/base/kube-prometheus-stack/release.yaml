apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 6h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "79.4.0"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    grafana:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
      # RBAC permissions for dashboard sidecar to list/watch ConfigMaps
      rbac:
        pspEnabled: false
        extraPermissions:
          - apiGroups: [""]
            resources: ["configmaps"]
            verbs: ["get", "list", "watch"]
      sidecar:
        dashboards:
          enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
        datasources:
          enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      # Additional datasources
      additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki.loki.svc.cluster.local:3100
          jsonData:
            maxLines: 1000
            derivedFields:
              - datasourceUid: prometheus
                matcherRegex: "traceID=(\\w+)"
                name: TraceID
                url: "$${__value.raw}"
          isDefault: false
          editable: false
      admin:
        existingSecret: grafana-admin-secret
        userKey: admin-user
        passwordKey: admin-password
      # Authentik SSO configuration
      extraSecretMounts:
        - name: grafana-oidc
          secretName: grafana-oidc
          defaultMode: 0440
          mountPath: /etc/secrets/grafana-oidc
          readOnly: true
      grafana.ini:
        server:
          root_url: https://grafana.h0melab.work
        auth:
          disable_login_form: true
        auth.basic:
          enabled: false
        auth.anonymous:
          enabled: false
        auth.generic_oauth:
          enabled: true
          name: Authentik
          client_id: $__file{/etc/secrets/grafana-oidc/client-id}
          client_secret: $__file{/etc/secrets/grafana-oidc/client-secret}
          scopes: openid profile email
          auth_url: $__file{/etc/secrets/grafana-oidc/authorization-url}
          token_url: $__file{/etc/secrets/grafana-oidc/token-url}
          api_url: $__file{/etc/secrets/grafana-oidc/userinfo-url}
          role_attribute_path: contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'
          allow_sign_up: true
      # Ingress enabled for internal network access via grafana.h0melab.work
      # DNS points to internal IPs only (192.168.1.127, 192.168.1.129)
      # NOT exposed to the internet - NetworkPolicy restricts external access
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: monitoring-redirect-https@kubernetescrd,monitoring-security-headers@kubernetescrd,monitoring-rate-limit-standard@kubernetescrd,monitoring-csp@kubernetescrd
        hosts:
          - grafana.h0melab.work
        tls:
          - secretName: grafana-tls-secret
            hosts:
            - grafana.h0melab.work
    
    prometheus:
      prometheusSpec:
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            cpu: 500m
            memory: 2.5Gi
        # Config reloader sidecar resources
        configReloaderCpu: "50m"
        configReloaderMemory: "64Mi"
        configReloaderCpuLimit: "200m"
        configReloaderMemoryLimit: "192Mi"
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
    
    alertmanager:
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ['alertname', 'cluster', 'service']
          group_wait: 10s
          group_interval: 10s
          repeat_interval: 12h
          receiver: 'telegram'
          routes:
          - match:
              alertname: Watchdog
            receiver: 'null'
          - match:
              alertname: InfoInhibitor
            receiver: 'null'
          - match:
              alertname: KubeCPUOvercommit
            receiver: 'null'
          - match:
              alertname: KubeMemoryOvercommit
            receiver: 'null'
          - match_re:
              alertname: ^(BackupJobFailed|BackupCronJobMissedSchedule|BackupJobRunningTooLong|NoRecentBackups)$
            receiver: 'telegram-backup'
            continue: false
          # K3s component alerts disabled in defaultRules (embedded architecture)
        receivers:
        - name: 'null'
        - name: 'telegram'
          telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot_token
            chat_id: 113452686
            parse_mode: 'HTML'
            message: |
              <b>{{ .Status | toUpper }}</b>
              {{ range .Alerts }}
              <b>Alert:</b> {{ .Labels.alertname }}
              <b>Severity:</b> {{ .Labels.severity }}
              <b>Summary:</b> {{ .Annotations.summary }}
              <b>Description:</b> {{ .Annotations.description }}
              {{ if .Labels.namespace }}<b>Namespace:</b> {{ .Labels.namespace }}{{ end }}
              {{ if .Labels.pod }}<b>Pod:</b> {{ .Labels.pod }}{{ end }}
              {{ end }}
        - name: 'telegram-backup'
          telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot_token
            chat_id: 113452686
            parse_mode: 'HTML'
            message: |
              💾 <b>BACKUP {{ .Status | toUpper }}</b>
              {{ range .Alerts }}
              <b>Alert:</b> {{ .Labels.alertname }}
              <b>Severity:</b> {{ .Labels.severity }}
              <b>Summary:</b> {{ .Annotations.summary }}
              <b>Description:</b> {{ .Annotations.description }}
              {{ if .Labels.namespace }}<b>Namespace:</b> {{ .Labels.namespace }}{{ end }}
              {{ if .Labels.pod }}<b>Pod:</b> {{ .Labels.pod }}{{ end }}
              {{ if .Labels.container }}<b>Container:</b> {{ .Labels.container }}{{ end }}
              {{ end }}
      # Ingress enabled for internal network access via am.h0melab.work
      # DNS points to internal IPs only (192.168.1.127, 192.168.1.129)
      # NOT exposed to the internet - NetworkPolicy restricts external access
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: monitoring-redirect-https@kubernetescrd,monitoring-security-headers@kubernetescrd,monitoring-rate-limit-standard@kubernetescrd,monitoring-csp@kubernetescrd
        hosts:
          - am.h0melab.work
        tls:
          - secretName: alertmanager-tls-secret
            hosts:
            - am.h0melab.work
      alertmanagerSpec:
        # Configure external URL so Alert Manager generates HTTPS links
        # This prevents mixed content warnings in browsers
        externalUrl: https://am.h0melab.work
        secrets:
          - alertmanager-telegram
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        # Config reloader sidecar resources
        configReloaderCpu: "50m"
        configReloaderMemory: "64Mi"
        configReloaderCpuLimit: "200m"
        configReloaderMemoryLimit: "128Mi"
    
    # Disable K3s-specific component alerts (embedded architecture)
    # Disable CPU overcommit alert (homelab - intentional overcommit for burst capacity)
    defaultRules:
      rules:
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeControllerManager: false
        kubeScheduler: false  # Disable all scheduler rules
        kubeCPUOvercommit: false  # Disable CPU overcommit warning (homelab uses intentional overcommit)

    prometheusOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    
    kube-state-metrics:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 128Mi

    # K3s-specific fix for cadvisor metrics
    # K3s exports container='' (empty) with actual name in 'name' label
    # Copy 'name' → 'container' for dashboard compatibility
    kubelet:
      serviceMonitor:
        cAdvisorMetricRelabelings:
          - sourceLabels: [name]
            targetLabel: container

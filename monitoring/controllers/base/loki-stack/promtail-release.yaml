apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
  namespace: loki
spec:
  interval: 6h
  chart:
    spec:
      chart: promtail
      version: 6.17.1
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: loki
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  values:
    # Promtail configuration
    config:
      clients:
        - url: http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push
      
      # Pipeline stages for log processing
      snippets:
        pipelineStages:
          - cri: {}
          - json:
              expressions:
                stream: stream
                timestamp: time
                message: log
          - labels:
              stream:
          - timestamp:
              source: timestamp
              format: RFC3339Nano
          - output:
              source: message
    
    # Resource limits
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    
    # ServiceMonitor for Prometheus
    serviceMonitor:
      enabled: true
    
    # Tolerations to run on all nodes including control plane
    tolerations:
      - effect: NoSchedule
        operator: Exists

apiVersion: v1
kind: Namespace
metadata:
  name: loki
  labels:
    name: loki
    toolkit.fluxcd.io/tenant: monitoring
    # enforce=privileged required for Alloy DaemonSet hostPath mount of
    # /var/log/journal (node-maintenance F2 follow-up). Baseline PSS
    # forbids all hostPath volumes. Other loki workloads (loki, gateway,
    # memcached, minio) don't use hostPath; warn/audit still restricted
    # so violations surface in admission logs.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

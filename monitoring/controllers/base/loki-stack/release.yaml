apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki
spec:
  interval: 6h
  chart:
    spec:
      chart: loki
      version: 6.52.0  # Pinned: 6.45.x has bug requiring bucketNames for filesystem storage
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: loki
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  values:
    # Loki configuration
    loki:
      auth_enabled: false
      
      commonConfig:
        replication_factor: 1
        path_prefix: /var/loki
      
      # Storage configuration
      storage:
        type: filesystem
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      
      # Schema configuration
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      
      # Retention configuration - keep logs for 30 days
      limits_config:
        retention_period: 720h  # 30 days
        ingestion_rate_mb: 10
        ingestion_burst_size_mb: 20
        max_query_series: 10000
        max_query_lookback: 720h
      
      # Compactor for log retention
      compactor:
        working_directory: /var/loki/compactor
        compaction_interval: 10m
        retention_enabled: true
        retention_delete_delay: 2h
        retention_delete_worker_count: 150
        delete_request_store: filesystem
    
    # Single binary mode for simplicity (v6.x chart format)
    deploymentMode: SingleBinary
    
    # Disable simple scalable mode components
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    
    singleBinary:
      replicas: 1
      
      # Resource limits
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
      
      # Persistent storage for logs
      persistence:
        enabled: true
        size: 10Gi
        storageClass: local-path
    
    # Gateway (nginx) configuration
    gateway:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
    
    # Sidecar containers configuration
    sidecar:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          cpu: 50m
          memory: 256Mi
      rules:
        enabled: true

    # Loki canary configuration
    lokiCanary:
      enabled: true
      resources:
        requests:
          cpu: 20m
          memory: 96Mi
        limits:
          cpu: 100m
          memory: 256Mi

    # Monitoring configuration
    monitoring:
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack  # Required for Prometheus discovery

      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false
    
    # Disable caching for single binary mode
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    
    # Test configuration
    test:
      enabled: false

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: loki
spec:
  interval: 6h
  chart:
    spec:
      chart: alloy
      version: 1.5.1
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: loki
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  values:
    # DaemonSet to run on all nodes (same as Promtail)
    controller:
      type: daemonset
      tolerations:
        - effect: NoSchedule
          operator: Exists

    alloy:
      # Resource limits
      # Alloy uses ~2x memory vs Promtail due to broader feature set
      # Promtail peak was 181Mi; Alloy expected peak ~300-350Mi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 200m
          memory: 512Mi

      # Mount host log directories for log collection
      mounts:
        varlog: true

      # Alloy configuration (River/HCL syntax)
      configMap:
        create: true
        content: |
          // Discover all pods on this node for metadata enrichment
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("HOSTNAME")
            }
          }

          // Relabel to add pod metadata as labels and set log file path
          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            // Set the log file path from pod metadata
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "__path__"
              replacement   = "/var/log/pods/*$1/$2/*.log"
            }

            // Keep namespace, pod, container, node as labels
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node_name"
            }

            // Add app label from standard k8s labels
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance"]
              target_label  = "instance"
            }
          }

          // Collect container logs using kubernetes-discovered targets
          loki.source.file "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.process.pipeline.receiver]
          }

          // Pipeline: CRI parse -> extract stream label -> push to Loki
          loki.process "pipeline" {
            stage.cri {}

            stage.labels {
              values = {
                stream = "",
              }
            }

            forward_to = [loki.write.default.receiver]
          }

          // Push to Loki
          loki.write "default" {
            endpoint {
              url = "http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push"
            }
          }

    # ServiceMonitor for Prometheus
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack

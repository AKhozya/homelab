apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: loki
spec:
  interval: 6h
  chart:
    spec:
      chart: alloy
      version: 1.6.2
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: loki
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  values:
    # DaemonSet to run on all nodes (same as Promtail)
    controller:
      type: daemonset
      tolerations:
        - effect: NoSchedule
          operator: Exists

    alloy:
      # Resource limits
      # Alloy uses ~2x memory vs Promtail due to broader feature set
      # Promtail peak was 181Mi; Alloy expected peak ~300-350Mi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 200m
          memory: 512Mi

      # Alloy configuration (River/HCL syntax)
      # Uses loki.source.kubernetes which tails logs via K8s API
      # (no hostPath mounts needed, automatic pod metadata labels)
      configMap:
        create: true
        content: |
          // Discover pods on this node
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
            }
          }

          // Add namespace, pod, container, app labels from pod metadata
          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node_name"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }
          }

          // Tail container logs via Kubernetes API
          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.process.pipeline.receiver]
          }

          // Pipeline: extract stream label -> push to Loki
          loki.process "pipeline" {
            stage.cri {}

            stage.labels {
              values = {
                stream = "",
              }
            }

            forward_to = [loki.write.default.receiver]
          }

          // Push to Loki
          loki.write "default" {
            endpoint {
              url = "http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push"
            }
          }

    # Config reloader sidecar resource limits
    # Actual usage: 0m CPU, 8-9Mi memory
    configReloader:
      resources:
        requests:
          cpu: 10m
          memory: 50Mi
        limits:
          cpu: 100m
          memory: 64Mi

    # ServiceMonitor for Prometheus
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack

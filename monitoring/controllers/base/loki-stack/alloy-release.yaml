apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: loki
spec:
  interval: 6h
  chart:
    spec:
      chart: alloy
      version: 1.5.1
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: loki
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  values:
    # DaemonSet to run on all nodes (same as Promtail)
    controller:
      type: daemonset
      tolerations:
        - effect: NoSchedule
          operator: Exists

    alloy:
      # Resource limits
      # Alloy uses ~2x memory vs Promtail due to broader feature set
      # Promtail peak was 181Mi; Alloy expected peak ~300-350Mi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 200m
          memory: 512Mi

      # Mount host log directories for log collection
      mounts:
        varlog: true

      # Alloy configuration (River/HCL syntax)
      configMap:
        create: true
        content: |
          // Discover all pods on this node
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("HOSTNAME")
            }
          }

          // Discover all nodes (for node-level log collection)
          discovery.kubernetes "nodes" {
            role = "node"
          }

          // Collect container logs from /var/log/pods
          local.file_match "pods" {
            path_targets = [{
              __path__ = "/var/log/pods/*/*/*.log",
            }]
          }

          loki.source.file "pods" {
            targets    = local.file_match.pods.targets
            forward_to = [loki.process.pipeline.receiver]
          }

          // Pipeline: CRI parse -> labels -> timestamp -> output
          loki.process "pipeline" {
            stage.cri {}

            stage.labels {
              values = {
                stream = "",
              }
            }

            forward_to = [loki.write.default.receiver]
          }

          // Push to Loki
          loki.write "default" {
            endpoint {
              url = "http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push"
            }
          }

    # ServiceMonitor for Prometheus
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack

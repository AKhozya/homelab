---
# Supplementary RBAC for victoria-metrics-operator.
#
# operator v0.74.0 (chart 0.67.0) reads NetworkPolicy on EVERY VM CR reconcile,
# not only when a CR sets the new `.spec.networkPolicy` field: the cleanup path
# takes the `== nil` branch and hands a NetworkPolicy to
# finalize.SafeDeleteWithFinalizer, whose cached Get makes controller-runtime
# start a NetworkPolicy informer. The chart's templates/role.yaml grants only
# `ingresses`/`ingresses/finalizers` under networking.k8s.io, so that informer
# can never sync. The operator repo's own config/rbac/role.yaml DOES grant
# `networkpolicies` — the chart never mirrored it; master still lacked it when
# checked on 2026-07-31.
#
# 2026-07-31: workers all started, then parked on the unsyncable informer —
# reconcile_total flat at 3 for 124 min while the pod held Ready 1/1, up=1,
# 0 restarts and a live leader lease. VMOperatorReconcileStalled was the only
# signal.
#
# Read-only on purpose: nothing here sets `.spec.networkPolicy`, so the operator
# only ever Gets (SafeDeleteWithFinalizer returns early on NotFound) and cannot
# author NetworkPolicies outside git. Adopting `.spec.networkPolicy` on any VM CR
# needs create/update/patch/delete added in the SAME change — the operator
# propagates the Forbidden up as a reconcile error rather than skipping quietly,
# so it fails loudly, but it does fail.
#
# Removing this is TWO commits, not one: kustomize-controller prunes this file
# the moment it applies, while the chart's own grant only lands when
# helm-controller finishes the upgrade. Bump the chart first, confirm
# `kubectl get clusterrole victoria-metrics-operator` lists networkpolicies,
# then delete this file.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoria-metrics-operator-networkpolicy-reader
  labels:
    app.kubernetes.io/name: victoria-metrics-operator
    app.kubernetes.io/component: rbac-workaround
rules:
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: victoria-metrics-operator-networkpolicy-reader
  labels:
    app.kubernetes.io/name: victoria-metrics-operator
    app.kubernetes.io/component: rbac-workaround
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: victoria-metrics-operator-networkpolicy-reader
subjects:
  - kind: ServiceAccount
    name: victoria-metrics-operator
    namespace: monitoring

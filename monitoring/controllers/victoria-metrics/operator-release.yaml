apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-operator
  namespace: monitoring
spec:
  interval: 6h
  driftDetection:
    mode: enabled
  rollback:
    cleanupOnFail: true
  # standard-tier — chart 0.63.1 has no top-level priorityClassName template hook.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: victoria-metrics-operator
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-standard
  chart:
    spec:
      chart: victoria-metrics-operator
      version: "0.66.3"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  maxHistory: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    operator:
      disable_prometheus_converter: true
      enable_converter_ownership: false
    resources:
      requests:
        cpu: 50m
        memory: 160Mi
      limits:
        cpu: 200m
        memory: 256Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

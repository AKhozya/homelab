apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki
spec:
  interval: 6h
  timeout: 10m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: loki
      version: 18.13.1  # Renovate-managed (grafana-community lineage — OSS fork of 6.55.0)
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: loki
      interval: 12h
  install:
    remediation:
      retries: 3
  maxHistory: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  # No postRenderer here: the chart reads priorityClassName from values and sets
  # seccompProfile RuntimeDefault on its workloads itself.
  values:
    loki:
      revisionHistoryLimit: 2
      auth_enabled: false

      commonConfig:
        replication_factor: 1
        path_prefix: /var/loki

      storage:
        type: filesystem
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules

      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      limits_config:
        retention_period: 720h  # 30 days
        # Chart default 168h equals the Sat 04:30 UTC reboot cadence exactly, so a
        # skipped reboot ages idle containers' replayed last log line out of the
        # window and Loki starts rejecting it. Match retention instead.
        reject_old_samples_max_age: 720h
        ingestion_rate_mb: 10
        ingestion_burst_size_mb: 20
        max_query_series: 10000
        max_query_lookback: 720h

      compactor:
        working_directory: /var/loki/compactor
        compaction_interval: 10m
        retention_enabled: true
        retention_delete_delay: 2h
        retention_delete_worker_count: 150
        delete_request_store: filesystem

      # Log-based alerting. The metrics path cannot see a worker-process OOM: the
      # kubelet scrape is 60s and a container can go from normal to OOM inside one
      # gap (immich ML on 2026-09-07 peaked at 74% in the samples either side of its
      # kill), so a threshold rule on working-set never sees the crossing.
      # storage.local.directory must be the sidecar's FOLDER (/rules), not the
      # common.storage.filesystem rules_directory (/var/loki/rules) the ruler would
      # otherwise inherit — that mismatch loads zero rules and reports no error.
      rulerConfig:
        alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
        enable_alertmanager_v2: true
        enable_api: true
        rule_path: /var/loki/ruler-tmp
        storage:
          type: local
          local:
            directory: /rules
        wal:
          dir: /var/loki/ruler-wal

    # 18.x spelling of single-binary mode; SingleBinary is the deprecated alias.
    deploymentMode: Monolithic

    # SSD components MUST be zeroed explicitly — chart validate.yaml rejects
    # Monolithic with non-zero (default) scalable-target replicas
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    singleBinary:
      replicas: 1

      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi

      persistence:
        enabled: true
        size: 10Gi
        storageClass: local-path

    gateway:
      enabled: true
      replicas: 1
      image:
        # chart default floats 1.31-alpine — image-pin invariant. repository must be
        # spelled out or Renovate cannot resolve a bare tag, which is how this drifted
        # a patch behind the same image in apps/rustdesk/beacon-deployment.yaml.
        repository: nginxinc/nginx-unprivileged
        tag: "1.31.5-alpine"
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
      # Default-on exporter sidecar renders with empty resources (Kyverno
      # enforce-limits blocks) + port 4040 not in NetworkPolicy. Enabling later =
      # deliberate change with resources + NP port.
      metrics:
        enabled: false

    sidecar:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          cpu: 50m
          memory: 256Mi
      rules:
        enabled: true
      # k8s-sidecar healthz binds dual-stack; on this IPv4-only cluster the health
      # thread dies (upstream kiwigrid/k8s-sidecar#531) → chart-18.x default probes
      # get connection-refused and liveness crash-loops the pod (2026-07-04 incident).
      # Chart 7.0.0 had no sidecar probes — same posture; rules watcher is a separate
      # thread and unaffected. Re-enable when #531 ships a HEALTH_HOST fix.
      readinessProbe:
        enabled: false
      livenessProbe:
        enabled: false

    lokiCanary:
      enabled: true
      resources:
        requests:
          cpu: 20m
          memory: 96Mi
        limits:
          cpu: 100m
          memory: 256Mi
      priorityClassName: homelab-standard  # global.priorityClassName does NOT reach canary

    monitoring:
      serviceMonitor:
        enabled: true
        labels:
          # Prometheus-Operator-era selector. VMAgent's serviceScrapeSelector is
          # empty, so the converted VMServiceScrape is picked up without it.
          release: kube-prometheus-stack

    # Disable caching for single binary mode
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    test:
      enabled: false

    # standard-tier priority for loki + gateway (canary has its own key above)
    global:
      priorityClassName: homelab-standard

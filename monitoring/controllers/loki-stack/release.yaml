apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki
spec:
  interval: 6h
  timeout: 10m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: loki
      version: 7.0.0  # Renovate-managed
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: loki
      interval: 12h
  install:
    remediation:
      retries: 3
  maxHistory: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  # standard-tier — loki chart 7.0.0 component priorityClassName paths vary; uniform patch.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: loki
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-standard
          - target:
              kind: Deployment
              name: loki-gateway
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-standard
          - target:
              kind: DaemonSet
              name: loki-canary
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-standard
          # seccomp RuntimeDefault (UR2-4 soak) — loki chart 7.0.0 has no uniform securityContext
          # hook; strategic-merge each pod spec (merges into the chart's existing securityContext,
          # preserving fsGroup/runAsUser).
          - target:
              kind: StatefulSet
              name: loki
            patch: |-
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: loki
              spec:
                template:
                  spec:
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
          - target:
              kind: Deployment
              name: loki-gateway
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: loki-gateway
              spec:
                template:
                  spec:
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
          - target:
              kind: DaemonSet
              name: loki-canary
            patch: |-
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: loki-canary
              spec:
                template:
                  spec:
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
  values:
    # Loki configuration
    loki:
      revisionHistoryLimit: 2
      auth_enabled: false

      commonConfig:
        replication_factor: 1
        path_prefix: /var/loki

      # Storage configuration
      storage:
        type: filesystem
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules

      # Schema configuration
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      # Retention configuration - keep logs for 30 days
      limits_config:
        retention_period: 720h  # 30 days
        ingestion_rate_mb: 10
        ingestion_burst_size_mb: 20
        max_query_series: 10000
        max_query_lookback: 720h

      # Compactor for log retention
      compactor:
        working_directory: /var/loki/compactor
        compaction_interval: 10m
        retention_enabled: true
        retention_delete_delay: 2h
        retention_delete_worker_count: 150
        delete_request_store: filesystem

    # Single binary mode for simplicity
    deploymentMode: SingleBinary

    # SSD components MUST be zeroed explicitly — chart validate.yaml rejects
    # SingleBinary with non-zero (default) scalable-target replicas
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    singleBinary:
      replicas: 1

      # Resource limits
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi

      # Persistent storage for logs
      persistence:
        enabled: true
        size: 10Gi
        storageClass: local-path

    # Gateway (nginx) configuration
    gateway:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi

    # Sidecar containers configuration
    sidecar:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          cpu: 50m
          memory: 256Mi
      rules:
        enabled: true

    # Loki canary configuration
    lokiCanary:
      enabled: true
      resources:
        requests:
          cpu: 20m
          memory: 96Mi
        limits:
          cpu: 100m
          memory: 256Mi

    # Monitoring configuration
    monitoring:
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack  # Required for Prometheus discovery

    # Disable caching for single binary mode
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    # Test configuration
    test:
      enabled: false

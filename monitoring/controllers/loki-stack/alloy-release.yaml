apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: loki
spec:
  interval: 6h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: alloy
      version: 1.13.1
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: loki
      interval: 12h
  install:
    remediation:
      retries: 3
  maxHistory: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  postRenderers:
    - kustomize:
        patches:
          # seccomp RuntimeDefault: alloy reads the host journal through file mounts, which
          # RuntimeDefault does not block. Strategic-merge keeps the chart's securityContext.
          - target:
              kind: DaemonSet
              name: alloy
            patch: |-
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: alloy
              spec:
                template:
                  spec:
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
  values:
    controller:
      type: daemonset
      priorityClassName: homelab-standard
      tolerations:
        - effect: NoSchedule
          operator: Exists
      # Host journal and machine-id for loki.source.journal below.
      volumes:
        extra:
          - name: journal
            hostPath:
              path: /var/log/journal
          - name: machine-id
            hostPath:
              path: /etc/machine-id
              type: File

    alloy:
      # 768Mi: working_set counts tailed-log page cache. On the busiest node
      # (W1, ~70 pods) anon is only ~200Mi but cache pins working_set at ~430Mi,
      # which flapped ContainerMemoryNearLimit at the old 512Mi limit.
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 200m
          memory: 768Mi

      # Read-only host journal mounts. The loki.source.journal matches below limit which
      # entries Alloy ships.
      mounts:
        extra:
          - name: journal
            mountPath: /var/log/journal
            readOnly: true
          - name: machine-id
            mountPath: /etc/machine-id
            readOnly: true

      # Alloy configuration (River/HCL syntax)
      # loki.source.kubernetes tails pod logs via K8s API (no hostPath).
      # loki.source.journal tails host systemd journal for node-maintenance services only.
      configMap:
        create: true
        # Wrapping a line of the block below would change the file.
        # yamllint disable rule:line-length
        content: |
          // Discover pods on this node
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
            }
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node_name"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }
          }

          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.process.pipeline.receiver]
          }

          // Pipeline: extract stream label -> push to Loki
          loki.process "pipeline" {
            stage.cri {}

            stage.labels {
              values = {
                stream = "",
              }
            }

            forward_to = [loki.write.default.receiver]
          }

          // ── node-maintenance host journal tail ──
          // loki.source.journal `matches` below keeps only node-maintenance units. This block only maps journal fields to labels.
          loki.relabel "nodemaint_journal" {
            forward_to = []
            rule {
              source_labels = ["__journal__systemd_unit"]
              target_label  = "unit"
            }
            rule {
              source_labels = ["__journal__hostname"]
              target_label  = "node_name"
            }
          }

          loki.source.journal "nodemaint" {
            max_age       = "12h"
            path          = "/var/log/journal"
            // No .timer entries: systemd logs timer events under _SYSTEMD_UNIT=init.scope,
            // so a .timer match returns nothing. If you add a node-maintenance service, add its
            // _SYSTEMD_UNIT match here.
            matches       = "_SYSTEMD_UNIT=node-maintenance-phase1.service _SYSTEMD_UNIT=node-maintenance-phase2.service _SYSTEMD_UNIT=node-maintenance-sync.service _SYSTEMD_UNIT=node-maintenance-config.service _SYSTEMD_UNIT=node-maintenance-rolling-restart.service _SYSTEMD_UNIT=node-maintenance-security-scan.service"
            relabel_rules = loki.relabel.nodemaint_journal.rules
            labels = {
              job = "node-maintenance",
            }
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push"
            }
          }

    # yamllint enable rule:line-length
    # Config-reloader sidecar. Measured usage: 0m CPU, 8-9Mi memory.
    configReloader:
      resources:
        requests:
          cpu: 10m
          memory: 50Mi
        limits:
          cpu: 100m
          memory: 64Mi

    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack

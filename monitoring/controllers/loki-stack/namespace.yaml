apiVersion: v1
kind: Namespace
metadata:
  name: loki
  labels:
    name: loki
    toolkit.fluxcd.io/tenant: monitoring
    # enforce=privileged: the Alloy DaemonSet mounts /var/log/journal and
    # /etc/machine-id through hostPath, and Baseline PSS forbids all hostPath
    # volumes. The other loki workloads (loki, gateway, canary) use no
    # hostPath. warn/audit stay restricted so violations surface in
    # admission logs.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

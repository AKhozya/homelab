---
# Flux Notification Provider for Telegram
# Reuses the existing alertmanager-telegram secret (bot_token key)
# Note: channel (chat_id) cannot be stored in secret - Flux Provider limitation
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: telegram
  namespace: monitoring
spec:
  type: telegram
  channel: "113452686"  # Telegram chat ID
  secretRef:
    name: alertmanager-telegram
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-gitops
  namespace: monitoring
spec:
  # spec.summary deprecated (removed at Alert v1 GA, Flux 2.10) — eventMetadata.summary replaces it
  eventMetadata:
    summary: "🔄 Flux GitOps Events"
  providerRef:
    name: telegram
  eventSeverity: error
  # These patterns drop three transient errors that cleared on the next reconcile.
  # 1. A webhook pod resets a kept-alive connection as the API server sends a request on it,
  #    and the call fails with EOF or a reset. The API server never retries an admission call,
  #    so one dry-run fails. Any webhook can do this, not only Kyverno.
  # 2. Kyverno logged a read timeout and the API server got a reply with no status (2026-09-29).
  # 3. The Flux 2.9.6 upgrade (aca65a08) replaced kustomize-controller during its health check.
  #    The pattern drops every cancelled health check, not only those from an upgrade.
  # Flux drops an event if any pattern matches its message. If a failure persists,
  # FluxResourceNotReady (15 min) and KyvernoAdmissionControllerDown still fire.
  # A webhook timeout, refused connection, policy denial or "timeout waiting for" still notifies.
  exclusionList:
    - 'failed calling webhook "[^"]+": failed to call webhook: Post "[^"]+": (EOF|read tcp [^"]*: connection reset by peer)'
    - 'failed calling webhook "vpol\.validate\.kyverno\.svc-[^"]*": failed to call webhook: the server rejected our request for an unknown reason'
    - 'health check failed after [^:]+: context canceled'
  eventSources:
    - kind: GitRepository
      name: '*'
      namespace: flux-system
    - kind: Kustomization
      name: '*'
      namespace: flux-system
    - kind: HelmRelease
      name: '*'
      namespace: '*'
    - kind: HelmRepository
      name: '*'
      namespace: '*'
    - kind: HelmChart
      name: '*'
      namespace: '*'

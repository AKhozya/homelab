---
# Flux Notification Provider for Telegram
# Reuses the existing alertmanager-telegram secret (bot_token key)
# Note: channel (chat_id) cannot be stored in secret - Flux Provider limitation
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: telegram
  namespace: monitoring
spec:
  type: telegram
  channel: "113452686"  # Telegram chat ID - cannot be in secret (Flux limitation)
  secretRef:
    name: alertmanager-telegram
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-gitops
  namespace: monitoring
spec:
  # spec.summary deprecated (removed at Alert v1 GA, Flux 2.10) — eventMetadata.summary replaces it
  eventMetadata:
    summary: "🔄 Flux GitOps Events"
  providerRef:
    name: telegram
  eventSeverity: error
  # The connection sometimes resets during the API server's call to a Kyverno vpol webhook (1 to 4 a day
  # since at least 2026-09-22, k3s journal "Proxy error ... connection reset by peer"). The
  # dry-run fails once and Flux retries 2 minutes later. If it persists, FluxControllerReconcileErrors
  # (15 min) fires; KyvernoAdmissionControllerDown covers Kyverno itself. The filter excludes only this
  # exact wording, so a webhook timeout or refused connection still notifies.
  exclusionList:
    - 'failed calling webhook "vpol\.validate\.kyverno\.svc-[^"]*": failed to call webhook: the server rejected our request for an unknown reason'
  eventSources:
    - kind: GitRepository
      name: '*'
      namespace: flux-system
    - kind: Kustomization
      name: '*'
      namespace: flux-system
    - kind: HelmRelease
      name: '*'
      namespace: '*'
    - kind: HelmRepository
      name: '*'
      namespace: '*'
    - kind: HelmChart
      name: '*'
      namespace: '*'

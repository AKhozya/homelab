# Traefik's basicAuth loader requires this Secret to contain EXACTLY ONE key. Adding a
# second key here makes the middleware fail to build, Traefik drops the router entirely,
# and the host answers 404 rather than 401 — a silent outage with nothing in the Traefik
# error log. The human-readable credential therefore lives in a SEPARATE Secret below.

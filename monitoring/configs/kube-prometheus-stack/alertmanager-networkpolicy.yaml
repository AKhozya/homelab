apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-network-policy
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 8080  # config-reloader metrics
    # The ingress enforces basic authentication. Direct access to port 9093 permits
    # unauthenticated alert silencing. So 9093 admits only the namespaces that hold its clients, and
    # every pod in them: monitoring (vmalert, vmagent scrape, grafana datasource), loki
    # (ruler, loki-stack release.yaml alertmanager_url), uptime-kuma (probe) and traefik
    # (am.h0melab.work ingress).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: loki
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 9093
    # The API server's service proxy dials from the control plane's flannel address, the network
    # address of its pod subnet 10.42.0.0/24.
    - from:
        - ipBlock:
            cidr: 10.42.0.0/32
      ports:
        - protocol: TCP
          port: 9093
    # Cluster gossip (HA mesh)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 9094
        - protocol: UDP
          port: 9094
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Cluster gossip (HA mesh)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 9094
        - protocol: UDP
          port: 9094
    # Webhook notifications (Telegram API)
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: TCP
          port: 80

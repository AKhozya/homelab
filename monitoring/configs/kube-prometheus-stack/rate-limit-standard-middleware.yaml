apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-standard
  namespace: monitoring
spec:
  rateLimit:
    # Monitoring hosts (Grafana, Alertmanager): 100 req/min per client IP, burst 150.
    # Lower than the 300/min apps tier on purpose — these hosts serve one operator.
    # `period` is load-bearing: rateLimit.average is per period and the default period is
    # 1s, so `average: 100` on its own would enforce 100 req/SECOND, 60x looser.
    average: 100
    period: 1m
    burst: 150
    # Rate limit based on client IP
    sourceCriterion:
      ipStrategy:
        depth: 0

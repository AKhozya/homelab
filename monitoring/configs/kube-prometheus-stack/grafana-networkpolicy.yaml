apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-network-policy
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Internal access, any namespace
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000  # Grafana default port
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # K8s API for the dashboard sidecar. The CIDR is the control-plane node.
    - to:
        - ipBlock:
            cidr: 192.168.1.127/32
      ports:
        - protocol: TCP
          port: 6443
    # VictoriaMetrics datasource
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmsingle
      ports:
        - protocol: TCP
          port: 8429
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 9093
    # Loki datasource
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: loki
      ports:
        - protocol: TCP
          port: 3100
    # Plugin downloads and updates
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: TCP
          port: 80

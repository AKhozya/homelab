apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: alertmanager-basic-auth
  namespace: monitoring
spec:
  basicAuth:
    # Credentials live in the SOPS-encrypted alertmanager-basic-auth Secret; Traefik
    # reads htpasswd lines from its `users` key.
    secret: alertmanager-basic-auth
    realm: Alertmanager
    # Do not pass the Authorization header through to Alertmanager — it has no use for
    # it, and forwarding credentials past the component that consumed them is needless
    # exposure.
    removeHeader: true

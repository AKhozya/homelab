apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-operator-network-policy
  namespace: monitoring
spec:
  # KPS prometheus-operator pod is labelled `app: kube-prometheus-stack-operator`
  # (matches the operator Service selector), NOT app.kubernetes.io/name.
  podSelector:
    matchLabels:
      app: kube-prometheus-stack-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Port 10250 (https) serves BOTH operator metrics (scraped by VMAgent) AND the
    # admission webhook (called by the API server, whose source IPs vary across
    # control-plane nodes). Allow all sources on this single port — same pattern as
    # cnpg-operator-policy's webhook rule.
    - ports:
        - protocol: TCP
          port: 10250
  egress:
    # DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Kubernetes API server — operator watches Prometheus/Alertmanager/*Monitor CRs
    - to:
        - ipBlock:
            cidr: 192.168.1.127/32  # control-plane node
      ports:
        - protocol: TCP
          port: 6443

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No namespace transform: every resource self-namespaces monitoring. (Config objects for the
# kube-prometheus-stack HelmRelease's grafana + alertmanager components + their NPs/ingress.)
resources:
  # Network policies + PDB (formerly base/)
  - grafana-networkpolicy.yaml
  - kube-state-metrics-networkpolicy.yaml
  - prometheus-operator-networkpolicy.yaml
  - alertmanager-networkpolicy.yaml
  - alertmanager-pdb.yaml
  # Grafana ingress TLS + auth
  - grafana-certificate.yaml  # Auto-renewing cert from Let's Encrypt
  - grafana-admin-secret.yaml
  - grafana-oidc-secret.yaml  # Authentik OIDC integration
  - https-redirect-middleware.yaml
  - security-headers-middleware.yaml
  - rate-limit-standard-middleware.yaml
  - csp-middleware.yaml
  # Alertmanager
  - alertmanager-basic-auth-secret.yaml
  - alertmanager-basic-auth-middleware.yaml
  - alertmanager-telegram-secret.yaml
  - alertmanager-deadman-secret.yaml
  - alertmanager-certificate.yaml

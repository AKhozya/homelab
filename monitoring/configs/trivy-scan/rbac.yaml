# Image inventory only: the scan job lists pod specs cluster-wide to collect
# unique images, then scans them registry-side. No other API access needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trivy-scan
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trivy-scan
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trivy-scan
subjects:
  - kind: ServiceAccount
    name: trivy-scan
    namespace: trivy-scan

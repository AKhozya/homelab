---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: node-cleanup
  namespace: kube-system
spec:
  # Run every Sunday at 2 AM
  schedule: "0 2 * * 0"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          hostNetwork: true
          hostPID: true
          hostIPC: true
          tolerations:
          - operator: Exists
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          containers:
          - name: cleanup
            image: alpine:latest@sha256:56b31e2dadc083b6b067d6cd4e97a9c6e5a953e6595830c60d9197589ff88ad4
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "=== Node Cleanup Starting ==="
              
              # Clean pacman cache
              echo "Cleaning pacman cache..."
              chroot /host pacman -Sc --noconfirm
              
              # Clean journal logs (keep last 7 days or 500MB)
              echo "Cleaning journal logs..."
              chroot /host journalctl --vacuum-time=7d --vacuum-size=500M
              
              # Show disk usage
              echo "Current disk usage:"
              chroot /host df -h /
              
              echo "=== Cleanup Complete ==="
            securityContext:
              privileged: true
            volumeMounts:
            - name: host
              mountPath: /host
          volumes:
          - name: host
            hostPath:
              path: /

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/kube-prometheus-stack  # Network policies
  - grafana-certificate.yaml  # Auto-renewing cert from Let's Encrypt
  - grafana-admin-secret.yaml
  - grafana-oidc-secret.yaml  # Authentik OIDC integration
  - https-redirect-middleware.yaml
  - security-headers-middleware.yaml
  - alertmanager-telegram-secret.yaml
  - alertmanager-certificate.yaml
  - prometheus-rules.yaml
  - cloudflared-servicemonitor.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmsingle-network-policy
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmsingle
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from Grafana for querying
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 8428
    # Allow ingress from VMAlert for querying alert data
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmalert
      ports:
        - protocol: TCP
          port: 8428
    # Allow ingress from Uptime Kuma for health checks
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
      ports:
        - protocol: TCP
          port: 8428
    # Allow ingress from VMAgent for metrics ingestion
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 8428
    # Allow ingress from within the cluster (for querying)
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8428
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53

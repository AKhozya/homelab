apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-network-policy
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from Prometheus
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 8080  # config-reloader metrics
    # Allow ingress from within the cluster (internal access only)
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 9093
    # Allow Alertmanager cluster gossip (HA mesh communication)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 9094
        - protocol: UDP
          port: 9094
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow Alertmanager cluster gossip (HA mesh communication)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 9094
        - protocol: UDP
          port: 9094
    # Allow HTTPS for webhook notifications (Telegram API, etc.)
    - ports:
        - protocol: TCP
          port: 443
    # Allow HTTP for webhook notifications
    - ports:
        - protocol: TCP
          port: 80

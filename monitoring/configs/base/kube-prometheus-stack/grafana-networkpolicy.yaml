apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-network-policy
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from within the cluster only (internal access)
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000  # Grafana default port
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow access to Kubernetes API server (for dashboard sidecar)
    # API server endpoint: 192.168.1.127:6443 (control plane node)
    - to:
        - ipBlock:
            cidr: 192.168.1.127/32
      ports:
        - protocol: TCP
          port: 6443
    # Allow access to Prometheus in the same namespace
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
    # Allow access to Alertmanager in the same namespace
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 9093
    # Allow access to Loki (if in different namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: loki
      ports:
        - protocol: TCP
          port: 3100
    # Allow HTTPS for plugin downloads and updates
    - ports:
        - protocol: TCP
          port: 443
    # Allow HTTP for plugin downloads
    - ports:
        - protocol: TCP
          port: 80

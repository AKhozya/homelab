apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: homelab-alerts
  namespace: monitoring

spec:
  groups:
  - name: node-alerts
    interval: 60s
    rules:
    - alert: NodeDown
      expr: up{job="node-exporter"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Node {{ $labels.instance }} is down"
        description: "Node exporter on {{ $labels.instance }} has been unreachable for more than 2 minutes. The node may be down or network is unreachable."
    
    - alert: KubeletDown
      expr: up{job="kubelet"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Kubelet on {{ $labels.node }} is down"
        description: "Kubelet on node {{ $labels.node }} ({{ $labels.instance }}) has been unreachable for more than 2 minutes. The node may be down or kubelet has crashed."
    
    - alert: NodeNotReady
      expr: kube_node_status_condition{condition="Ready",status="true"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Node {{ $labels.node }} is not ready"
        description: "Node {{ $labels.node }} has been in NotReady state for more than 5 minutes. Check node status and logs."
    
    - alert: NodeMemoryPressure
      expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Node {{ $labels.node }} has memory pressure"
        description: "Node {{ $labels.node }} is experiencing memory pressure. Pods may be evicted."
    
    - alert: NodeDiskPressure
      expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Node {{ $labels.node }} has disk pressure"
        description: "Node {{ $labels.node }} is experiencing disk pressure. Pods may be evicted."
    
    - alert: NodeHighCPU
      expr: (100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage on {{ $labels.instance }}"
        description: "CPU usage is above 80% (current value: {{ $value }}%)"
    
    - alert: NodeHighMemory
      expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage on {{ $labels.instance }}"
        description: "Memory usage is above 85% (current value: {{ $value }}%)"
    
    - alert: NodeDiskSpaceLow
      expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs"} * 100) < 15
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Low disk space on {{ $labels.instance }}"
        description: "Disk {{ $labels.mountpoint }} has less than 15% free space (current: {{ $value }}%)"
    
    - alert: NodeDiskSpaceCritical
      expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs"} * 100) < 5
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Critical disk space on {{ $labels.instance }}"
        description: "Disk {{ $labels.mountpoint }} has less than 5% free space (current: {{ $value }}%)"
    
    - alert: NodeHighIOWait
      # Average I/O wait across all CPUs (node-wide, not per-core)
      expr: avg by(instance) (rate(node_cpu_seconds_total{mode="iowait"}[5m])) * 100 > 10
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High I/O wait on {{ $labels.instance }}"
        description: "Node-wide CPU I/O wait is {{ printf \"%.1f\" $value }}%. Disk may be bottleneck. Check with iostat -x."
    
    - alert: NodeNetworkErrors
      expr: rate(node_network_receive_errs_total[5m]) + rate(node_network_transmit_errs_total[5m]) > 10
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Network errors on {{ $labels.instance }}"
        description: "Network interface {{ $labels.device }} is experiencing errors ({{ printf \"%.0f\" $value }}/s). Check network hardware and cables."

  - name: storage-alerts
    interval: 60s
    rules:
    - alert: PVCUsageHigh
      expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} is almost full"
        description: "PVC {{ $labels.persistentvolumeclaim }} is {{ printf \"%.1f\" $value }}% full. Consider expanding the volume or cleaning up data."
    
    - alert: PVCUsageCritical
      expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 90
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} is critically full"
        description: "PVC {{ $labels.persistentvolumeclaim }} is {{ printf \"%.1f\" $value }}% full. Immediate action required - expand volume or free up space."
    
    - alert: PVCInodeLow
      expr: (kubelet_volume_stats_inodes_used / kubelet_volume_stats_inodes) * 100 > 85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "PVC {{ $labels.persistentvolumeclaim }} has low inodes available"
        description: "PVC {{ $labels.persistentvolumeclaim }} has used {{ printf \"%.1f\" $value }}% of available inodes. This may cause issues creating new files."
    
    - alert: PVCLowAbsoluteSpace
      expr: kubelet_volume_stats_available_bytes < 1073741824
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "PVC {{ $labels.persistentvolumeclaim }} has less than 1GB free"
        description: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} has only {{ $value | humanize1024 }}B available. Writes may fail soon!"
    
    - alert: PersistentVolumeError
      expr: kube_persistentvolume_status_phase{phase=~"Failed|Pending"} > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "PersistentVolume {{ $labels.persistentvolume }} is in {{ $labels.phase }} state"
        description: "PV has been in error state for more than 5 minutes. Check PV and PVC bindings."

  - name: pod-alerts
    interval: 60s
    rules:
    - alert: PodCrashLooping
      expr: increase(kube_pod_container_status_restarts_total[15m]) > 2
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
        description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted {{ printf \"%.0f\" $value }} times in the last 15 minutes"
    
    - alert: PodNotReady
      expr: kube_pod_status_phase{phase!~"Running|Succeeded"} > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"
        description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in {{ $labels.phase }} state for more than 10 minutes"
    
    - alert: ContainerOOMKilled
      expr: increase(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[5m]) > 0
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} was OOM killed"
        description: "Container ran out of memory and was killed. Consider increasing memory limits."
    
    - alert: ContainerMemoryNearLimit
      expr: (container_memory_working_set_bytes / container_spec_memory_limit_bytes) * 100 > 80 and container_spec_memory_limit_bytes > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} near memory limit"
        description: "Container is using {{ printf \"%.1f\" $value }}% of its memory limit. May be OOM killed soon."
    
    - alert: ContainerCPUThrottling
      expr: rate(container_cpu_cfs_throttled_seconds_total[5m]) * 100 > 25
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} is being CPU throttled"
        description: "Container is being CPU throttled {{ printf \"%.1f\" $value }}% of the time for over 10 minutes. Performance may be degraded. Consider increasing CPU limits."

    - alert: ContainerCPUNearLimit
      expr: (rate(container_cpu_usage_seconds_total{container!=""}[5m]) / container_spec_cpu_limit{container!=""}) * 100 > 80 and container_spec_cpu_limit{container!=""} > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} near CPU limit"
        description: "Container is using {{ printf \"%.1f\" $value }}% of its CPU limit. May be throttled soon, affecting performance."

    - alert: ContainerNoResourceLimits
      expr: kube_pod_container_resource_limits{resource="memory"} == 0 and kube_pod_info{namespace!~"kube-system|monitoring|flux-system"}
      for: 30m
      labels:
        severity: info
      annotations:
        summary: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} has no resource limits"
        description: "Container running without memory limits. Can potentially exhaust node resources. Consider adding resource limits for better stability."

    - alert: ContainerNoResourceRequests
      expr: kube_pod_container_resource_requests{resource="memory"} == 0 and kube_pod_info{namespace!~"kube-system|monitoring|flux-system"}
      for: 30m
      labels:
        severity: info
      annotations:
        summary: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} has no resource requests"
        description: "Container running without memory requests. Scheduling may be suboptimal. Consider adding resource requests for better placement."

    - alert: ContainerMemoryCritical
      expr: (container_memory_working_set_bytes / container_spec_memory_limit_bytes) * 100 > 95 and container_spec_memory_limit_bytes > 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} critically low on memory"
        description: "Container is using {{ printf \"%.1f\" $value }}% of its memory limit. OOMKill imminent! Immediate action required."

    - alert: PodImagePullError
      expr: kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull"} > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} cannot pull image"
        description: "Container {{ $labels.container }} has been failing to pull image for more than 5 minutes. Check image name, registry access, and credentials."

  - name: cloudflare-tunnel-alerts
    interval: 60s
    rules:
    - alert: CloudflareTunnelDown
      expr: up{job="cloudflared-metrics"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Cloudflare tunnel {{ $labels.namespace }}/{{ $labels.pod }} is down"
        description: "Cloudflare tunnel in {{ $labels.namespace }} has been unreachable for more than 2 minutes. Public access may be unavailable."
    
    - alert: CloudflareTunnelPodNotRunning
      expr: kube_pod_status_phase{pod=~"cloudflared.*", phase!="Running"} > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Cloudflare tunnel pod {{ $labels.namespace }}/{{ $labels.pod }} is not running"
        description: "Cloudflare tunnel pod is in {{ $labels.phase }} state. Public access to {{ $labels.namespace }} may be down."
    
    - alert: CloudflareTunnelNoConnections
      expr: cloudflared_tunnel_total_requests == 0
      for: 30m
      labels:
        severity: info
      annotations:
        summary: "Cloudflare tunnel {{ $labels.namespace }} has no traffic"
        description: "No requests received through Cloudflare tunnel in {{ $labels.namespace }} for 30 minutes. This may be normal if not actively used."
    
    - alert: CloudflareTunnelHighLatency
      expr: histogram_quantile(0.99, rate(cloudflared_tunnel_request_duration_seconds_bucket[5m])) > 5
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High latency on Cloudflare tunnel {{ $labels.namespace }}"
        description: "P99 latency is {{ $value }}s on Cloudflare tunnel in {{ $labels.namespace }}. Users may experience slow response times."

  - name: certificate-alerts
    interval: 60s
    rules:
    - alert: CertificateExpiringSoon
      expr: certmanager_certificate_expiration_timestamp_seconds - time() < 604800
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "Certificate {{ $labels.name }} in {{ $labels.namespace }} expiring soon"
        description: "Certificate {{ $labels.name }} will expire in less than 7 days. Remaining time: {{ $value | humanizeDuration }}"
    
    - alert: CertificateExpiringCritical
      expr: certmanager_certificate_expiration_timestamp_seconds - time() < 172800
      for: 1h
      labels:
        severity: critical
      annotations:
        summary: "Certificate {{ $labels.name }} in {{ $labels.namespace }} expiring very soon"
        description: "Certificate {{ $labels.name }} will expire in less than 2 days! Remaining time: {{ $value | humanizeDuration }}"
    
    - alert: CertificateNotReady
      expr: certmanager_certificate_ready_status{condition="False"} > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Certificate {{ $labels.name }} in {{ $labels.namespace }} not ready"
        description: "Certificate has been in NotReady state for more than 10 minutes. Check cert-manager logs and issuer status."
    
    - alert: CertificateRenewalFailed
      expr: increase(certmanager_certificate_renewal_failure_count[1h]) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Certificate {{ $labels.name }} renewal failed"
        description: "Certificate renewal has failed {{ $value }} times in the last hour. Check cert-manager logs immediately!"

  - name: kubernetes-alerts
    interval: 60s
    rules:
    - alert: DeploymentReplicasMismatch
      expr: kube_deployment_spec_replicas - kube_deployment_status_replicas_available != 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has mismatched replicas"
        description: "Deployment has replica mismatch. Check pod status and resource availability. Difference: {{ printf \"%.0f\" $value }}"
    
    - alert: StatefulSetReplicasMismatch
      expr: kube_statefulset_status_replicas_ready != kube_statefulset_status_replicas
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has mismatched replicas"
        description: "StatefulSet has {{ $labels.replicas }} desired but only {{ $labels.ready_replicas }} ready"
    
    - alert: DaemonSetNotScheduled
      expr: kube_daemonset_status_desired_number_scheduled - kube_daemonset_status_current_number_scheduled > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} not fully scheduled"
        description: "DaemonSet has {{ $labels.desired }} desired but only {{ $labels.current }} scheduled"
    
    - alert: PodsPending
      expr: kube_pod_status_phase{phase="Pending"} > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} stuck in Pending"
        description: "Pod has been in Pending state for more than 10 minutes. Check for resource constraints or scheduling issues."
    
    - alert: KubernetesAPIServerDown
      expr: up{job="apiserver"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Kubernetes API server is down"
        description: "The Kubernetes API server is unreachable. Cluster management is unavailable!"
    
    - alert: JobFailed
      expr: kube_job_status_failed > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed"
        description: "Job has failed. Check logs: kubectl logs -n {{ $labels.namespace }} job/{{ $labels.job_name }}"
    
    - alert: CronJobNotScheduled
      expr: time() - kube_cronjob_next_schedule_time > 600
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} missed schedule"
        description: "CronJob hasn't been scheduled for more than 10 minutes past its schedule time. Check if suspended or configuration issues."

  - name: flux-alerts
    interval: 60s
    rules:
    - alert: FluxReconciliationFailure
      expr: max(gotk_reconcile_condition{type="Ready",status="False"}) by (namespace,name,kind) > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Flux {{ $labels.kind }} {{ $labels.name }} reconciliation failed"
        description: "GitOps reconciliation has been failing for more than 10 minutes in {{ $labels.namespace }}. Your Git changes may not be applied! Check: kubectl describe {{ $labels.kind }} {{ $labels.name }} -n {{ $labels.namespace }}"
    
    - alert: FluxSourceNotReady
      expr: gotk_reconcile_condition{type="Ready",status="False",kind=~"GitRepository|HelmRepository"} > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Flux source {{ $labels.name }} not ready"
        description: "Flux can't access the {{ $labels.kind }} {{ $labels.name }} in {{ $labels.namespace }}. Check credentials and connectivity."
    
    - alert: FluxSuspended
      expr: gotk_suspend_status == 1
      for: 5m
      labels:
        severity: info
      annotations:
        summary: "Flux {{ $labels.kind }} {{ $labels.name }} is suspended"
        description: "Resource {{ $labels.namespace }}/{{ $labels.name }} is suspended and will not reconcile automatically. Resume with: flux resume {{ $labels.kind }} {{ $labels.name }} -n {{ $labels.namespace }}"

  - name: backup-alerts
    interval: 60s
    rules:
    - alert: BackupJobFailed
      expr: kube_job_status_failed{job_name=~".*backup.*"} > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Backup job {{ $labels.namespace }}/{{ $labels.job_name }} failed"
        description: "Critical backup job has failed. Data protection may be compromised! Check logs: kubectl logs -n {{ $labels.namespace }} job/{{ $labels.job_name }}"

    - alert: BackupCronJobMissedSchedule
      expr: (time() - kube_cronjob_next_schedule_time{cronjob=~".*backup.*"}) > 3600
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "Backup CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} missed schedule"
        description: "Backup CronJob hasn't run for more than 1 hour past its schedule time. Backups may not be running! Check: kubectl get cronjob {{ $labels.cronjob }} -n {{ $labels.namespace }}"

    - alert: BackupJobRunningTooLong
      expr: (time() - kube_job_status_start_time{job_name=~".*backup.*"} > 7200) and (kube_job_complete{job_name=~".*backup.*"} == 0)
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Backup job {{ $labels.namespace }}/{{ $labels.job_name }} running too long"
        description: "Backup job has been running for more than 2 hours. May be stuck or encountering issues. Check: kubectl logs -n {{ $labels.namespace }} job/{{ $labels.job_name }}"

    - alert: NoRecentBackups
      expr: time() - max(kube_job_status_completion_time{job_name=~".*backup.*"}) by (namespace) > 172800
      for: 1h
      labels:
        severity: critical
      annotations:
        summary: "No successful backup in {{ $labels.namespace }} for 48 hours"
        description: "Most recent backup in {{ $labels.namespace }} is older than 48 hours. Data protection is at risk! Check backup CronJobs and recent job logs."

  - name: database-alerts
    interval: 60s
    rules:
    - alert: PostgreSQLDown
      expr: pg_up == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "PostgreSQL instance {{ $labels.namespace }}/{{ $labels.pod }} is down"
        description: "PostgreSQL database is unreachable. Applications using this database will fail!"

    - alert: PostgreSQLPodNotRunning
      expr: kube_pod_status_phase{namespace="databases",pod=~"main-postgres.*",phase!="Running"} > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "PostgreSQL pod {{ $labels.pod }} not running"
        description: "PostgreSQL pod is in {{ $labels.phase }} state. Database may be unavailable!"

    - alert: PostgreSQLConnectionFailure
      expr: sum(rate(pg_stat_database_xact_commit[5m])) by (namespace, pod) == 0 and sum(kube_pod_status_phase{namespace="databases",pod=~"main-postgres.*",phase="Running"}) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "PostgreSQL {{ $labels.pod }} may have connection issues"
        description: "No transactions detected while pod is running. Database may not be accepting connections."

    - alert: PostgreSQLTooManyConnections
      expr: sum by (namespace, pod) (pg_stat_activity_count) / sum by (namespace, pod) (pg_settings_max_connections) * 100 > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "PostgreSQL {{ $labels.namespace }}/{{ $labels.pod }} has too many connections"
        description: "PostgreSQL is using {{ printf \"%.1f\" $value }}% of max connections. May start refusing connections soon."

    - alert: PostgreSQLReplicationLag
      expr: pg_replication_lag > 30
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "PostgreSQL replication lag on {{ $labels.namespace }}/{{ $labels.pod }}"
        description: "Replication is lagging {{ $value }}s behind primary. Data may be out of sync."

    - alert: PostgreSQLDeadlocks
      expr: increase(pg_stat_database_deadlocks[5m]) > 5
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "PostgreSQL {{ $labels.namespace }}/{{ $labels.datname }} experiencing deadlocks"
        description: "{{ $value }} deadlocks detected in the last 5 minutes. May indicate application issues."

    - alert: PostgreSQLHighRollbackRate
      expr: rate(pg_stat_database_xact_rollback[5m]) / rate(pg_stat_database_xact_commit[5m]) > 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High rollback rate on PostgreSQL {{ $labels.namespace }}/{{ $labels.datname }}"
        description: "{{ printf \"%.1f\" $value }}% of transactions are rolling back. May indicate application errors."

  - name: redis-alerts
    interval: 60s
    rules:
    - alert: RedisDown
      expr: redis_up == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Redis instance {{ $labels.namespace }}/{{ $labels.pod }} is down"
        description: "Redis is unreachable. Applications using Redis cache/session storage will fail!"

    - alert: RedisPodNotRunning
      expr: kube_pod_status_phase{namespace="databases",pod=~"redis.*", phase!="Running"} > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Redis pod {{ $labels.namespace }}/{{ $labels.pod }} is not running"
        description: "Redis pod is in {{ $labels.phase }} state. Cache and session storage unavailable!"

    - alert: RedisHighMemoryUsage
      expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Redis {{ $labels.namespace }}/{{ $labels.pod }} high memory usage"
        description: "Redis is using {{ printf \"%.1f\" $value }}% of max memory. May start evicting keys soon."

    - alert: RedisRejectedConnections
      expr: increase(redis_rejected_connections_total[5m]) > 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "Redis {{ $labels.namespace }}/{{ $labels.pod }} rejecting connections"
        description: "Redis rejected {{ $value }} connections in the last 5 minutes. Reached maxclients limit."

    - alert: RedisTooManyConnections
      expr: redis_connected_clients / redis_config_maxclients * 100 > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Redis {{ $labels.namespace }}/{{ $labels.pod }} has too many connections"
        description: "Redis is using {{ printf \"%.1f\" $value }}% of max client connections."

    - alert: RedisSlowQueries
      expr: redis_slowlog_length > 50
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Redis {{ $labels.namespace }}/{{ $labels.pod }} has slow queries"
        description: "{{ $value }} slow queries detected. Performance may be degraded."

    - alert: RedisConnectionFailure
      expr: redis_connected_clients == 0 and kube_pod_status_phase{namespace="databases",pod=~"redis.*",phase="Running"} > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Redis {{ $labels.namespace }}/{{ $labels.pod }} has no connected clients"
        description: "No clients connected to Redis for 10 minutes while pod is running. May indicate connection issues."

  - name: couchdb-alerts
    interval: 60s
    rules:
    - alert: CouchDBDown
      expr: up{job="couchdb"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "CouchDB instance {{ $labels.namespace }}/{{ $labels.pod }} is down"
        description: "CouchDB is unreachable. Sync functionality may be unavailable!"

    - alert: CouchDBPodNotRunning
      expr: kube_pod_status_phase{namespace="databases",pod=~"couchdb-couchdb.*",phase!="Running"} > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "CouchDB pod {{ $labels.pod }} not running"
        description: "CouchDB pod is in {{ $labels.phase }} state. Database may be unavailable!"

  - name: mysql-alerts
    interval: 60s
    rules:
    - alert: MySQLDown
      expr: mysql_up{job="mysql-exporter"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "MySQL exporter cannot connect to database"
        description: "MySQL exporter is unable to connect to the database. Check MySQL cluster health and HAProxy status."

    - alert: MySQLPodNotRunning
      expr: kube_pod_status_phase{namespace="databases",pod=~"main-mysql-mysql-.*",phase!="Running"} > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "MySQL pod {{ $labels.pod }} not running"
        description: "MySQL pod is in {{ $labels.phase }} state. Database cluster may be degraded!"

    - alert: MySQLHAProxyNotRunning
      expr: kube_pod_status_phase{namespace="databases",pod=~"main-mysql-haproxy-.*",phase!="Running"} > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "MySQL HAProxy pod {{ $labels.pod }} not running"
        description: "HAProxy pod is in {{ $labels.phase }} state. Application database connectivity may be affected!"

    - alert: MySQLOrchestratorNotRunning
      expr: count(kube_pod_status_phase{namespace="databases",pod=~"main-mysql-orc-.*",phase="Running"}) < 2
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "MySQL Orchestrator quorum at risk"
        description: "Only {{ $value }} Orchestrator pods running. Need at least 2 for failover quorum. Check Orchestrator pods."

    - alert: MySQLTooManyConnections
      expr: mysql_global_status_threads_connected / mysql_global_variables_max_connections * 100 > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "MySQL connection usage high"
        description: "MySQL is using {{ printf \"%.1f\" $value }}% of max connections. May reject new connections soon."

    - alert: MySQLReplicationNotRunning
      expr: mysql_slave_status_slave_io_running == 0 or mysql_slave_status_slave_sql_running == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "MySQL replication is not running"
        description: "MySQL replica IO or SQL thread is not running. Replication is broken! Check SHOW REPLICA STATUS."

    - alert: MySQLReplicationLag
      expr: mysql_slave_status_seconds_behind_master > 60
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "MySQL replication lag detected"
        description: "MySQL replica is {{ $value }}s behind primary. Data may be out of sync."

    - alert: MySQLSlowQueries
      expr: rate(mysql_global_status_slow_queries[5m]) > 0.1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "MySQL slow queries detected"
        description: "{{ printf \"%.2f\" $value }} slow queries/sec detected. Check slow query log for optimization opportunities."

    - alert: MySQLHighAbortedConnections
      expr: rate(mysql_global_status_aborted_connects[5m]) > 0.5
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High rate of aborted MySQL connections"
        description: "{{ printf \"%.2f\" $value }} aborted connections/sec. May indicate network issues or authentication failures."

    - alert: MySQLInnoDBBufferPoolHitRateLow
      expr: (mysql_global_status_innodb_buffer_pool_read_requests - mysql_global_status_innodb_buffer_pool_reads) / mysql_global_status_innodb_buffer_pool_read_requests * 100 < 95
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "MySQL InnoDB buffer pool hit rate low"
        description: "Buffer pool hit rate is {{ printf \"%.1f\" $value }}%. Consider increasing innodb_buffer_pool_size."

  # service-alerts group - ServiceDown alert removed, replaced by Uptime Kuma
  # See docs/UPTIME_KUMA_TELEGRAM_REPORT.md for details
  - name: service-alerts
    interval: 60s
    rules:
    - alert: HighErrorRate
      expr: rate(vm_http_requests_total{code=~"5.."}[5m]) > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High error rate detected"
        description: "HTTP 5xx error rate is above 5% for {{ $labels.job }}"

  - name: monitoring-health-alerts
    interval: 60s
    rules:
    - alert: ScrapeTargetDown
      expr: up == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Target {{ $labels.job }} ({{ $labels.instance }}) is down"
        description: "Cannot scrape {{ $labels.job }} on {{ $labels.instance }}. Monitoring data may be incomplete."

    - alert: VMTooManyRestarts
      expr: changes(process_start_time_seconds{job=~".*(vmsingle|vmagent|vmalert).*"}[15m]) > 2
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "VictoriaMetrics component has restarted multiple times"
        description: "VM component has restarted {{ $value }} times in the last 15 minutes. Check for crashes or OOM issues."
    
    - alert: AlertmanagerConfigInvalid
      expr: alertmanager_config_last_reload_successful == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Alertmanager configuration is invalid"
        description: "Alertmanager failed to reload its configuration. Alerts may not be sent! Check configuration syntax."
    
  - name: alertmanager-overrides
    interval: 60s
    rules:
    - alert: AlertmanagerFailedToSendAlerts
      annotations:
        summary: An Alertmanager instance failed to send notifications.
        description: Alertmanager {{ $labels.namespace }}/{{ $labels.pod}} failed to send {{ $value | humanizePercentage }} of notifications to {{ $labels.integration }}.
      expr: |-
        (
          rate(alertmanager_notifications_failed_total{job="kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring"}[15m])
        /
          ignoring (reason) group_left rate(alertmanager_notifications_total{job="kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring"}[15m])
        )
        > 0.01
        and
        rate(alertmanager_notifications_total{job="kube-prometheus-stack-alertmanager",container="alertmanager",namespace="monitoring"}[15m]) > 0
      for: 5m
      labels:
        severity: warning

  - name: kyverno-policy-alerts
    interval: 1h
    rules:
    - alert: KyvernoPolicyViolationsDailySummary
      expr: sum(kyverno_policy_rule_results_total{rule_result="fail"}) > 50
      for: 24h
      labels:
        severity: info
      annotations:
        summary: "Daily Kyverno policy violations summary"
        description: "Total policy violations: {{ $value }}. This is a daily summary. Review violations with: kubectl get policyreports -A"

    - alert: KyvernoHighSeverityViolationsDaily
      expr: sum(kyverno_policy_rule_results_total{rule_result="fail",policy_severity="high"}) > 10
      for: 24h
      labels:
        severity: info
      annotations:
        summary: "Daily high severity policy violations summary"
        description: "{{ $value }} high-severity policy violations found. Review with: kubectl get policyreports -A -o json | jq '.items[] | select(.summary.fail > 0)'"

    - alert: KyvernoAdmissionControllerDown
      expr: up{job="kyverno"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Kyverno admission controller is down"
        description: "Kyverno is unreachable. Policy enforcement may not be working!"

  - name: rate-limiting-alerts
    interval: 1m
    rules:
    - alert: RateLimitHighRejectionRate
      expr: sum(rate(traefik_service_requests_total{code="429"}[5m])) by (exported_service) > 0.5
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High rate of rate-limited requests on {{ $labels.exported_service }}"
        description: "{{ $labels.exported_service }} is rejecting {{ printf \"%.1f\" $value }} requests/sec due to rate limiting. This may indicate: (1) an attack in progress, or (2) rate limits are too strict for legitimate use. Current limits: Standard apps (100 req/min + 150 burst), High-frequency apps (200 req/min + 300 burst)."

    - alert: RateLimitPossibleBruteForce
      expr: sum(rate(traefik_service_requests_total{code="429",exported_service=~".*authentik.*"}[2m])) > 1
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: "Possible brute force attack on Authentik SSO"
        description: "Authentik is rejecting {{ printf \"%.1f\" $value }} requests/sec due to rate limiting for more than 3 minutes. This strongly indicates a brute force login attempt. Investigate immediately!"

    - alert: RateLimitCouchDBSyncBlocked
      expr: sum(rate(traefik_service_requests_total{code="429",exported_service=~".*couchdb.*"}[5m])) > 0.1
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "CouchDB sync may be blocked by rate limiting"
        description: "CouchDB is experiencing {{ printf \"%.1f\" $value }} rate-limited requests/sec. This may block Obsidian vault syncing. If this persists during normal sync operations, consider increasing CouchDB rate limit (current: 200 req/min + 300 burst)."

    - alert: RateLimitAPIClientsBlocked
      expr: sum(rate(traefik_service_requests_total{code="429",exported_service=~".*n8n.*|.*immich.*"}[5m])) by (exported_service) > 0.3
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "API service {{ $labels.exported_service }} rate limiting clients"
        description: "{{ $labels.exported_service }} is rejecting {{ printf \"%.1f\" $value }} requests/sec. This may block API clients, webhooks, or automation. Check if limits need adjustment (current: 200 req/min + 300 burst)."

    - alert: RateLimitSuddenSpike
      expr: (sum(rate(traefik_service_requests_total{code="429"}[1m])) - sum(rate(traefik_service_requests_total{code="429"}[30m]))) > 5
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Sudden spike in rate-limited requests detected"
        description: "Rate limit rejections increased by {{ printf \"%.1f\" $value }} requests/sec compared to 30min average. This likely indicates an ongoing attack or service misconfiguration."

    - alert: RateLimitPersistentRejections
      expr: sum(increase(traefik_service_requests_total{code="429"}[1h])) by (exported_service) > 500
      for: 10m
      labels:
        severity: info
      annotations:
        summary: "{{ $labels.exported_service }} has persistent rate limiting"
        description: "{{ $labels.exported_service }} rejected {{ $value }} requests in the last hour due to rate limiting. If this is not an attack, rate limits may need to be relaxed. Current limits: Standard (100 req/min), High-frequency (200 req/min)."

    # NOTE: These alerts depend on Traefik metrics being properly collected by Prometheus
    # If alerts don't fire despite rate limiting occurring, check:
    # 1. Traefik ServiceMonitor configuration
    # 2. Prometheus scraping Traefik metrics endpoint
    # 3. Query: traefik_service_requests_total{code="429"} should return data

  - name: resource-exhaustion-alerts
    interval: 1m
    rules:
    - alert: ClusterCPUPressure
      expr: (sum(rate(container_cpu_usage_seconds_total[5m])) / sum(machine_cpu_cores)) * 100 > 80
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Cluster-wide CPU usage is high"
        description: "Cluster CPU usage is {{ printf \"%.1f\" $value }}% across all nodes. Consider scaling up or optimizing workloads."

    - alert: ClusterMemoryPressure
      expr: (1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)) * 100 > 80
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Cluster-wide memory usage is high"
        description: "Cluster memory usage is {{ printf \"%.1f\" $value }}% across all nodes. Consider scaling up or adding memory."

    - alert: ClusterCPUExhaustion
      expr: (sum(rate(container_cpu_usage_seconds_total[5m])) / sum(machine_cpu_cores)) * 100 > 90
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Cluster CPU resources nearly exhausted"
        description: "Cluster CPU usage is {{ printf \"%.1f\" $value }}%. Pod scheduling may fail. Immediate action required!"

    - alert: ClusterMemoryExhaustion
      expr: (1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)) * 100 > 90
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Cluster memory resources nearly exhausted"
        description: "Cluster memory usage is {{ printf \"%.1f\" $value }}%. Pods may be OOM killed. Immediate action required!"

    - alert: NodeAllocatableCPULow
      expr: (kube_node_status_allocatable{resource="cpu"} - on(node) group_left sum by (node) (kube_pod_container_resource_requests{resource="cpu"})) / kube_node_status_allocatable{resource="cpu"} * 100 < 20
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Node {{ $labels.node }} has low allocatable CPU"
        description: "Only {{ printf \"%.1f\" $value }}% CPU allocatable on {{ $labels.node }}. New pods may not schedule."

    - alert: NodeAllocatableMemoryLow
      expr: (kube_node_status_allocatable{resource="memory"} - on(node) group_left sum by (node) (kube_pod_container_resource_requests{resource="memory"})) / kube_node_status_allocatable{resource="memory"} * 100 < 20
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Node {{ $labels.node }} has low allocatable memory"
        description: "Only {{ printf \"%.1f\" $value }}% memory allocatable on {{ $labels.node }}. New pods may not schedule."

    - alert: TooManyPodsPending
      expr: sum(kube_pod_status_phase{phase="Pending"}) > 5
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Multiple pods stuck in Pending state"
        description: "{{ $value }} pods are stuck in Pending state. Likely resource exhaustion or scheduling constraints."

    - alert: NamespaceMemoryQuotaExceeded
      expr: kube_resourcequota{resource="requests.memory",type="used"} / kube_resourcequota{resource="requests.memory",type="hard"} * 100 > 90
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Namespace {{ $labels.namespace }} approaching memory quota"
        description: "Namespace {{ $labels.namespace }} is using {{ printf \"%.1f\" $value }}% of its memory quota. May not be able to schedule new pods."

    - alert: NamespaceCPUQuotaExceeded
      expr: kube_resourcequota{resource="requests.cpu",type="used"} / kube_resourcequota{resource="requests.cpu",type="hard"} * 100 > 90
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Namespace {{ $labels.namespace }} approaching CPU quota"
        description: "Namespace {{ $labels.namespace }} is using {{ printf \"%.1f\" $value }}% of its CPU quota. May not be able to schedule new pods."

  # ==========================================================================
  # LOKI ALERTS - Log aggregation health monitoring
  # ==========================================================================
  - name: loki-alerts
    interval: 1m
    rules:
    - alert: LokiDown
      expr: up{job=~"loki.*"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Loki is down"
        description: "Loki instance {{ $labels.instance }} has been down for more than 2 minutes. Log ingestion is affected."

    - alert: LokiHighIngestionRate
      expr: sum(rate(loki_distributor_bytes_received_total[5m])) > 10485760
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Loki ingestion rate is high"
        description: "Loki is ingesting {{ printf \"%.2f\" $value | humanize1024 }}B/s (>10MB/s). Consider increasing resources or reducing log volume."

    - alert: LokiIngestionErrors
      expr: sum(rate(loki_distributor_ingester_appends_total{status="fail"}[5m])) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Loki has ingestion errors"
        description: "Loki is experiencing {{ printf \"%.2f\" $value }} failed append operations per second. Check Loki logs for details."

    - alert: LokiCompactorNotRunning
      expr: sum(loki_compactor_running) == 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Loki compactor is not running"
        description: "Loki compactor has not been running for 10 minutes. Log retention/cleanup may not be working."

    - alert: AlloyDown
      expr: up{job=~".*alloy.*"} == 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "Alloy is down on {{ $labels.instance }}"
        description: "Alloy on {{ $labels.instance }} has been down for more than 2 minutes. Logs from this node are not being collected."

    - alert: AlloyLogDeliveryFailing
      expr: rate(loki_write_dropped_entries_total[5m]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Alloy is dropping log entries on {{ $labels.instance }}"
        description: "Alloy on {{ $labels.instance }} is failing to deliver logs to Loki. Check Alloy and Loki connectivity."

  # ==========================================================================
  # TRAEFIK ALERTS - Ingress controller health monitoring
  # ==========================================================================
  - name: traefik-alerts
    interval: 1m
    rules:
    - alert: TraefikDown
      expr: up{job=~".*traefik.*"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Traefik is down"
        description: "Traefik instance {{ $labels.instance }} has been down for more than 2 minutes. Ingress routing is affected."

    # NOTE: traefik_service_server_up metric not exposed by Traefik in this configuration.
    # Backend health is covered by TraefikHighErrorRate (5xx detection) and app-level pod alerts.

    - alert: TraefikHighErrorRate
      expr: sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) by (exported_service) / sum(rate(traefik_service_requests_total[5m])) by (exported_service) * 100 > 10
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High error rate on {{ $labels.exported_service }}"
        description: "Service {{ $labels.exported_service }} has {{ printf \"%.1f\" $value }}% error rate (5xx responses) over the last 5 minutes."

    - alert: TraefikHighLatency
      # Exclude WebSocket connections (code="0") as they are long-lived by design
      expr: histogram_quantile(0.99, sum(rate(traefik_service_request_duration_seconds_bucket{code=~"[1-5].."}[5m])) by (le, exported_service)) > 2
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High latency on {{ $labels.exported_service }}"
        description: "Service {{ $labels.exported_service }} has p99 latency of {{ printf \"%.2f\" $value }}s (>2s threshold)."

    - alert: TraefikCertificateExpiringSoon
      expr: (traefik_tls_certs_not_after - time()) / 86400 < 14
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "TLS certificate expiring soon"
        description: "Certificate for {{ $labels.cn }} expires in {{ printf \"%.0f\" $value }} days."

    - alert: TraefikCertificateExpired
      expr: (traefik_tls_certs_not_after - time()) < 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "TLS certificate has expired"
        description: "Certificate for {{ $labels.cn }} has expired! HTTPS connections will fail."

  # ==========================================================================
  # REBUILDERD ALERTS - Arch Linux reproducible build worker health
  # Metrics from node-exporter textfile collector (5-min update interval)
  # ==========================================================================
  - name: rebuilderd-alerts
    interval: 5m
    rules:
    - alert: RebuilderdWorkerDown
      expr: rebuilderd_worker_active == 0
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "Rebuilderd worker on {{ $labels.node }} is down"
        description: "Rebuilderd worker on {{ $labels.node }} has been inactive for more than 10 minutes. Check systemd service: ssh <node> systemctl status rebuilderd-worker@1"

    - alert: RebuilderdHighFailureRate
      expr: (rebuilderd_builds_bad_total / rebuilderd_builds_total) > 0.8 and rebuilderd_builds_total >= 20
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "High rebuilderd failure rate on {{ $labels.node }}"
        description: "{{ $labels.node }} has >80% BAD builds in the last 2 hours ({{ $value | humanizePercentage }}). {{ $labels.node }} may have build environment issues."

  # NOTE: No etcd alerts needed - K3s single-master uses embedded SQLite, not etcd

  # ==========================================================================
  # OVERRIDES - Previously in kube-prometheus-stack additionalPrometheusRulesMap
  # Adjusted thresholds for homelab workloads (rebuilderd workers)
  # ==========================================================================
  - name: node-overrides
    rules:
      # Exclude rebuilderd worker nodes where CPU contention is expected
      - alert: CPUThrottlingHigh
        expr: |
          sum without (id, metrics_path, name, image, endpoint, job, node) (
            topk by (cluster, namespace, pod, container, instance) (1,
              increase(container_cpu_cfs_throttled_periods_total{container!="", job="kubelet", metrics_path="/metrics/cadvisor", node!~"worker-node|worker-node-2"}[5m])
            )
          )
          / on (cluster, namespace, pod, container, instance) group_left
          sum without (id, metrics_path, name, image, endpoint, job, node) (
            topk by (cluster, namespace, pod, container, instance) (1,
              increase(container_cpu_cfs_periods_total{job="kubelet", metrics_path="/metrics/cadvisor", node!~"worker-node|worker-node-2"}[5m])
            )
          )
          > ( 25 / 100 )
        for: 15m
        labels:
          severity: info
        annotations:
          summary: Processes experience elevated CPU throttling.
          description: >-
            {{ $value | humanizePercentage }} throttling of CPU in namespace {{ $labels.namespace }} for container {{ $labels.container }} in pod {{ $labels.pod }}.
      # Exclude rebuilderd worker nodes (swap spillover causes expected page faults)
      - alert: NodeMemoryMajorPagesFaults
        expr: |
          rate(node_vmstat_pgmajfault{job="node-exporter"}[5m])
            * on(instance) group_left()
            node_uname_info{nodename!~"worker-node|worker-node2"}
          > 500
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Memory major page faults are occurring at very high rate.
          description: |
            Memory major pages are occurring at very high rate at {{ $labels.instance }}, 500 major page faults per second for the last 30 minutes, is currently at {{ printf "%.2f" $value }}.
      # Increase threshold from 10 to 20 and duration from 30m to 1h for rebuilderd
      - alert: NodeDiskIOSaturation
        expr: rate(node_disk_io_time_weighted_seconds_total{job="node-exporter", device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)"}[5m]) > 20
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Disk IO queue is high.
          description: |
            Disk IO queue (aqu-sq) is high on {{ $labels.device }} at {{ $labels.instance }}, has been above 20 for the last 1 hour, is currently at {{ printf "%.2f" $value }}.


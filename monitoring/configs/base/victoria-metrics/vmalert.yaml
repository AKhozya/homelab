apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  name: vmalert
  namespace: monitoring
spec:
  image:
    repository: victoriametrics/vmalert
    tag: v1.140.0
  # Query metrics from VMSingle
  datasource:
    url: "http://vmsingle-vmsingle.monitoring.svc:8429"
  # Write recording rule results to VMSingle
  remoteWrite:
    url: "http://vmsingle-vmsingle.monitoring.svc:8429"
  # Send alerts to existing Alertmanager
  notifier:
    url: "http://alertmanager-operated.monitoring.svc:9093"
  # Select all VMRules from all namespaces
  ruleNamespaceSelector: {}
  ruleSelector: {}
  evaluationInterval: "60s"
  replicaCount: 1
  containers:
    - name: config-reloader
      resources:
        requests:
          cpu: 10m
          memory: 25Mi
        limits:
          cpu: 50m
          memory: 64Mi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

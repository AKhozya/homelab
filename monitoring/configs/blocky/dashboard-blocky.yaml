apiVersion: v1
kind: ConfigMap
metadata:
  name: blocky-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  blocky.json: |
    {"uid":"blocky","title":"Blocky DNS","tags":["blocky","dns"],"timezone":"browser","schemaVersion":39,"version":1,"refresh":"30s","time":{"from":"now-3h","to":"now"},"templating":{"list":[]},"annotations":{"list":[]},"panels":[{"id":1,"type":"stat","title":"Blocking enabled","gridPos":{"x":0,"y":0,"w":4,"h":4},"targets":[{"expr":"max(blocky_blocking_enabled)","refId":"A"}],"fieldConfig":{"defaults":{"mappings":[{"type":"value","options":{"0":{"text":"OFF","color":"red"},"1":{"text":"ON","color":"green"}}}],"color":{"mode":"thresholds"},"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"red"},{"value":1,"color":"green"}]}}}},{"id":2,"type":"stat","title":"Pods up","gridPos":{"x":4,"y":0,"w":4,"h":4},"targets":[{"expr":"sum(up{job=\"blocky-metrics\"})","refId":"A"}],"fieldConfig":{"defaults":{"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"red"},{"value":1,"color":"yellow"},{"value":2,"color":"green"}]}}}},{"id":3,"type":"stat","title":"QPS (5m)","gridPos":{"x":8,"y":0,"w":4,"h":4},"targets":[{"expr":"sum(rate(blocky_query_total[5m]))","refId":"A"}],"fieldConfig":{"defaults":{"unit":"reqps","decimals":1}}},{"id":4,"type":"stat","title":"Cache hit ratio","gridPos":{"x":12,"y":0,"w":4,"h":4},"targets":[{"expr":"sum(rate(blocky_cache_hits_total[5m])) / (sum(rate(blocky_cache_hits_total[5m])) + sum(rate(blocky_cache_misses_total[5m])))","refId":"A"}],"fieldConfig":{"defaults":{"unit":"percentunit","decimals":1,"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"red"},{"value":0.5,"color":"yellow"},{"value":0.7,"color":"green"}]}}}},{"id":5,"type":"stat","title":"Failed downloads (1h)","gridPos":{"x":16,"y":0,"w":4,"h":4},"targets":[{"expr":"sum(increase(blocky_failed_downloads_total[1h]))","refId":"A"}],"fieldConfig":{"defaults":{"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"green"},{"value":1,"color":"yellow"},{"value":10,"color":"red"}]}}}},{"id":6,"type":"stat","title":"Query p95 (s)","gridPos":{"x":20,"y":0,"w":4,"h":4},"targets":[{"expr":"histogram_quantile(0.95, sum(rate(blocky_request_duration_seconds_bucket[5m])) by (le))","refId":"A"}],"fieldConfig":{"defaults":{"unit":"s","decimals":3,"thresholds":{"mode":"absolute","steps":[{"value":null,"color":"green"},{"value":0.05,"color":"yellow"},{"value":0.1,"color":"red"}]}}}},{"id":10,"type":"timeseries","title":"Query rate by response type","gridPos":{"x":0,"y":4,"w":12,"h":8},"targets":[{"expr":"sum by (response_type) (rate(blocky_response_total[5m]))","refId":"A","legendFormat":"{{response_type}}"}],"fieldConfig":{"defaults":{"unit":"reqps"}}},{"id":11,"type":"timeseries","title":"Cache hits / misses","gridPos":{"x":12,"y":4,"w":12,"h":8},"targets":[{"expr":"sum(rate(blocky_cache_hits_total[5m]))","refId":"A","legendFormat":"hits"},{"expr":"sum(rate(blocky_cache_misses_total[5m]))","refId":"B","legendFormat":"misses"}],"fieldConfig":{"defaults":{"unit":"reqps"}}},{"id":12,"type":"timeseries","title":"Query duration percentiles","gridPos":{"x":0,"y":12,"w":12,"h":8},"targets":[{"expr":"histogram_quantile(0.50, sum(rate(blocky_request_duration_seconds_bucket[5m])) by (le))","refId":"A","legendFormat":"p50"},{"expr":"histogram_quantile(0.95, sum(rate(blocky_request_duration_seconds_bucket[5m])) by (le))","refId":"B","legendFormat":"p95"},{"expr":"histogram_quantile(0.99, sum(rate(blocky_request_duration_seconds_bucket[5m])) by (le))","refId":"C","legendFormat":"p99"}],"fieldConfig":{"defaults":{"unit":"s"}}},{"id":13,"type":"timeseries","title":"Top blocked clients (5m rate)","gridPos":{"x":12,"y":12,"w":12,"h":8},"targets":[{"expr":"topk(10, sum by (client) (rate(blocky_response_total{response_type=\"BLOCKED\"}[5m])))","refId":"A","legendFormat":"{{client}}"}],"fieldConfig":{"defaults":{"unit":"reqps"}}},{"id":14,"type":"timeseries","title":"Cache + denylist entries","gridPos":{"x":0,"y":20,"w":12,"h":8},"targets":[{"expr":"sum by (pod) (blocky_cache_entries)","refId":"A","legendFormat":"{{pod}} cache"},{"expr":"sum by (pod) (blocky_denylist_cache_entries)","refId":"B","legendFormat":"{{pod}} denylist"}],"fieldConfig":{"defaults":{"unit":"short"}}},{"id":15,"type":"timeseries","title":"Memory (RSS)","gridPos":{"x":12,"y":20,"w":12,"h":8},"targets":[{"expr":"process_resident_memory_bytes{job=\"blocky-metrics\"}","refId":"A","legendFormat":"{{pod}}"}],"fieldConfig":{"defaults":{"unit":"bytes"}}}]}

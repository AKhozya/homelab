apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: ps-operator
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - percona-mysql
  selector:
    matchLabels:
      app.kubernetes.io/name: ps-operator
  podMetricsEndpoints:
    # The chart declares no container port. port, portNumber and targetPort each keep only declared
    # ports, so they drop this pod; the relabel sets the address instead.
    - interval: "60s"
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_pod_ip]
          targetLabel: __address__
          replacement: "$1:8080"

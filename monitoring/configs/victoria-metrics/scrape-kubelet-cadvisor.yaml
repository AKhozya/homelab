apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: kubelet-cadvisor
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: kubelet
  endpoints:
    - port: https-metrics
      interval: "60s"
      path: /metrics/cadvisor
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
        caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      honorLabels: true
      metricRelabelConfigs:
        # No `name` -> `container` rewrite here. kubelet already sets `container` to the
        # container NAME ("POD" for the pause container); under containerd its `name` label
        # is the container ID. Overwriting one with the other broke every
        # `on (pod, container)` join against kube-state-metrics — the Loki/Alloy dashboard
        # panels returned 0 series — and put a hex ID in every container alert summary.
        - sourceLabels: [__name__]
          regex: 'container_tasks_state'
          action: drop
        - sourceLabels: [__name__]
          regex: 'container_memory_failures_total'
          action: drop
        - sourceLabels: [__name__]
          regex: 'container_blkio_device_usage_total'
          action: drop

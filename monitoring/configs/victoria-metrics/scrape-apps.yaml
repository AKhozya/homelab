# metadata:
#   name: immich
#   namespace: monitoring
# spec:
#   namespaceSelector:
#     matchNames:
#       - immich
#   selector:
#     matchLabels:
#       app.kubernetes.io/name: server
#       app.kubernetes.io/instance: immich
#   endpoints:
#     - port: metrics-api
#       interval: "60s"
#     - port: metrics-ms
#       interval: "60s"

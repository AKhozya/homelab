apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - uptime-kuma
  selector:
    matchLabels:
      app: uptime-kuma
  endpoints:
    - port: http
      path: /metrics
      # Kuma rate-limits API-key auth to 60 requests a minute.
      interval: "60s"
      # Kuma checks only the password, against its API keys. Kuma ignores the username.
      basicAuth:
        username:
          name: uptime-kuma-metrics
          key: username
        password:
          name: uptime-kuma-metrics
          key: password

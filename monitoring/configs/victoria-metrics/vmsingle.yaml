apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: vmsingle
  namespace: monitoring
spec:
  priorityClassName: homelab-critical
  retentionPeriod: "90d"
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 50Gi
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      cpu: 500m
      memory: 1500Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  # The operator mounts each listed Secret at /etc/vm/secrets/<name>/. vmsingle reads the key
  # from that file, so the value stays out of the pod spec. If deleteAuthKey is unset,
  # delete_series accepts deletions from any caller the NetworkPolicy admits, even on a GET.
  secrets:
    - vmsingle-auth
  extraArgs:
    dedup.minScrapeInterval: "60s"
    deleteAuthKey: "file:///etc/vm/secrets/vmsingle-auth/deleteAuthKey"

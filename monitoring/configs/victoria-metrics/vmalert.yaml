apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  name: vmalert
  namespace: monitoring
spec:
  priorityClassName: homelab-critical
  datasource:
    url: "http://vmsingle-vmsingle.monitoring.svc:8429"
  # The repo has no recording rules, but vmalert still writes its ALERTS and
  # ALERTS_FOR_STATE series here. If remoteWrite is unset, ALERTS{} queries return nothing.
  remoteWrite:
    url: "http://vmsingle-vmsingle.monitoring.svc:8429"
  # Send alerts to both Alertmanager replicas by pod FQDN. A single Service URL keeps one
  # kept-alive connection, which kube-proxy routes to one pod, so the other replica holds
  # no alerts (seen 2026-07-04: alertmanager-0 had none). Alertmanager gossip removes
  # duplicate notifications.
  notifiers:
    - url: "http://alertmanager-kube-prometheus-stack-alertmanager-0.alertmanager-operated.monitoring.svc:9093"
    - url: "http://alertmanager-kube-prometheus-stack-alertmanager-1.alertmanager-operated.monitoring.svc:9093"
  # {} matches every VMRule in every namespace. If both selectors are unset, the operator
  # selects no VMRules (selectAllByDefault is unset here).
  ruleNamespaceSelector: {}
  ruleSelector: {}
  evaluationInterval: "60s"
  replicaCount: 1
  containers:
    - name: config-reloader
      resources:
        requests:
          cpu: 10m
          memory: 25Mi
        limits:
          cpu: 50m
          memory: 64Mi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-node-exporter
  endpoints:
    - port: http-metrics
      interval: "60s"
      # The systemd collector exports 5 states for each of ~270 units per node (~1.4k series). Only the
      # failed state feeds an alert, so the scrape drops the other 4 states and the socket counters.
      metricRelabelConfigs:
        - sourceLabels: [__name__, state]
          regex: 'node_systemd_unit_state;(active|activating|deactivating|inactive)'
          action: drop
        - sourceLabels: [__name__]
          regex: 'node_systemd_socket_.+'
          action: drop

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudflare-tunnel
resources:
  - namespace.yaml
  - cloudflared.yaml
  - tunnel-credentials.yaml
  - cloudflared-config-secret.yaml
  - tunnel-mgmt-token.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - route-sync/cronjob.yaml
  - route-sync/networkpolicy.yaml
configMapGenerator:
  - name: cloudflared-route-sync-script
    files:
      - route-sync/sync.py

apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflare-tunnel
  namespace: cloudflare-tunnel
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare-tunnel
spec:
  replicas: 2
  revisionHistoryLimit: 2
  # Rolling update strategy compatible with required anti-affinity on 2 nodes
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      serviceAccountName: cloudflare-tunnel
      automountServiceAccountToken: false
      priorityClassName: homelab-critical  # critical tier (external ingress tunnel)
      # Pod anti-affinity: require distribution across worker nodes for HA
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: cloudflared
              topologyKey: kubernetes.io/hostname
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: sync-tunnel-config
        image: curlimages/curl:8.20.0
        env:
        # CF_ACCOUNT_ID + CF_TUNNEL_UUID sourced from SOPS-encrypted Secret
        # (previously hardcoded in command field, which .sops.yaml regex does not cover).
        - name: CF_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: cloudflare-tunnel-mgmt-token
              key: CF_ACCOUNT_ID
        - name: CF_TUNNEL_UUID
          valueFrom:
            secretKeyRef:
              name: cloudflare-tunnel-mgmt-token
              key: CF_TUNNEL_UUID
        command:
        - /bin/sh
        - -c
        - |
          set -e
          CONFIG="/etc/cloudflared/config/config.yaml"
          TOKEN=$(cat /etc/cloudflared/api-token/api-token)
          ACCOUNT="${CF_ACCOUNT_ID}"
          TUNNEL="${CF_TUNNEL_UUID}"
          API="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/cfd_tunnel/${TUNNEL}/configurations"

          # Parse ingress rules from YAML config into CF API JSON
          RULES=""
          SEP=""
          HOST=""
          SVC=""
          IN=0
          while IFS= read -r line; do
            case "$line" in "  #"*|"#"*) continue ;; esac
            case "$line" in "ingress:"*) IN=1; continue ;; esac
            [ "$IN" -ne 1 ] && continue
            case "$line" in
              "  - "*)
                if [ -n "$SVC" ]; then
                  if [ -n "$HOST" ]; then
                    RULES="${RULES}${SEP}{\"hostname\":\"${HOST}\",\"service\":\"${SVC}\"}"
                  else
                    RULES="${RULES}${SEP}{\"service\":\"${SVC}\"}"
                  fi
                  SEP=","
                fi
                HOST=""; SVC=""
                case "$line" in *"hostname: "*) HOST="${line##*hostname: }" ;; esac
                case "$line" in *"service: "*) SVC="${line##*service: }" ;; esac
                ;;
              *"hostname: "*) HOST="${line##*hostname: }" ;;
              *"service: "*) SVC="${line##*service: }" ;;
            esac
          done < "$CONFIG"
          if [ -n "$SVC" ]; then
            if [ -n "$HOST" ]; then
              RULES="${RULES}${SEP}{\"hostname\":\"${HOST}\",\"service\":\"${SVC}\"}"
            else
              RULES="${RULES}${SEP}{\"service\":\"${SVC}\"}"
            fi
          fi

          PAYLOAD="{\"config\":{\"ingress\":[${RULES}]}}"
          COUNT=$(printf '%s' "$RULES" | grep -o '{"' | wc -l | tr -d ' ')
          echo "Syncing ${COUNT} ingress rules to Cloudflare API..."

          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X PUT "$API" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "Config synced successfully (HTTP ${HTTP_CODE})"
          else
            echo "Config sync FAILED (HTTP ${HTTP_CODE})"
            cat /tmp/response.json
            exit 1
          fi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        - name: api-token
          mountPath: /etc/cloudflared/api-token
          readOnly: true
        - name: sync-tmp
          mountPath: /tmp
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.6.1
        args:
        - tunnel
        - --config
        - /etc/cloudflared/config/config.yaml
        - run
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: 2000
          failureThreshold: 1
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        - name: creds
          mountPath: /etc/cloudflared/creds
          readOnly: true
      volumes:
      - name: creds
        secret:
          secretName: tunnel-credentials
      - name: config
        secret:
          secretName: cloudflared-config
          items:
          - key: config.yaml
            path: config.yaml
      - name: api-token
        secret:
          secretName: cloudflare-tunnel-mgmt-token
      - name: sync-tmp
        emptyDir:
          sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cloudflared-metrics
  namespace: cloudflare-tunnel
  labels:
    app: cloudflared
spec:
  selector:
    app: cloudflared
  ports:
  - name: metrics
    port: 2000
    targetPort: 2000

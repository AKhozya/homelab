apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflare-tunnel-network-policy
  namespace: cloudflare-tunnel
spec:
  podSelector:
    matchLabels:
      app: cloudflared
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Metrics scrape
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 2000
    # Uptime-kuma probes
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
      ports:
        - protocol: TCP
          port: 2000
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Tunnel to the Cloudflare edge. Port 7844 is required.
    # See: https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/configure-tunnels/tunnel-with-firewall/
    - ports:
        - protocol: UDP
          port: 7844  # QUIC (preferred)
        - protocol: TCP
          port: 7844  # HTTP/2 fallback
    # Cloudflare updates, JWT validation, error reporting
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: audiobookshelf
      ports:
        - protocol: TCP
          port: 3005
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkwarden
      ports:
        - protocol: TCP
          port: 3000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: stirling-pdf
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mealie
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: paperless-ngx
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: immich
      ports:
        - protocol: TCP
          port: 2283
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: n8n
      ports:
        - protocol: TCP
          port: 5678
    # CouchDB (Obsidian sync)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
      ports:
        - protocol: TCP
          port: 5984
    # WARP-routed access to RustDesk (hbbs/hbbr). Clients reach it at the
    # servicelb LB IP 192.168.1.129 (single address, LAN + WARP). Two rules cover
    # both CNI egress-eval points: ipBlock matches pre-DNAT (LB IP), the
    # namespaceSelector matches post-DNAT (rustdesk pod IP). Ports = container ports.
    - to:
        - ipBlock:
            cidr: 192.168.1.129/32
      ports:
        - { protocol: TCP, port: 21115 }
        - { protocol: TCP, port: 21116 }
        - { protocol: UDP, port: 21116 }
        - { protocol: TCP, port: 21117 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rustdesk
      ports:
        - { protocol: TCP, port: 21115 }
        - { protocol: TCP, port: 21116 }
        - { protocol: UDP, port: 21116 }
        - { protocol: TCP, port: 21117 }

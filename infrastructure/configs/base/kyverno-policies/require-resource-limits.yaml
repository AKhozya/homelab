apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers should have resource limits (CPU and memory) to prevent resource
      exhaustion and ensure fair resource distribution across the cluster.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-cpu-limit
      match:
        any:
          - resources:
              kinds:
                - Pod
      # Operator-managed init containers (we cannot edit upstream):
      # - CNPG pooler (PgBouncer) — owned by cloudnative-pg
      # - VMAgent — owned by victoria-metrics-operator
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - kyverno
          - resources:
              selector:
                matchLabels:
                  cnpg.io/podRole: pooler
          - resources:
              selector:
                matchLabels:
                  managed-by: vm-operator
      validate:
        message: "CPU limit is required for all containers"
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    cpu: "?*"
            =(initContainers):
              - resources:
                  limits:
                    cpu: "?*"
    - name: require-memory-limit
      match:
        any:
          - resources:
              kinds:
                - Pod
      # Operator-managed init containers (we cannot edit upstream):
      # - CNPG pooler (PgBouncer) — owned by cloudnative-pg
      # - VMAgent — owned by victoria-metrics-operator
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - kyverno
          - resources:
              selector:
                matchLabels:
                  cnpg.io/podRole: pooler
          - resources:
              selector:
                matchLabels:
                  managed-by: vm-operator
      validate:
        message: "Memory limit is required for all containers"
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    memory: "?*"
            =(initContainers):
              - resources:
                  limits:
                    memory: "?*"

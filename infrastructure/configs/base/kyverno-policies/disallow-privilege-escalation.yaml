apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Privilege escalation should be disallowed to prevent containers from gaining
      more privileges than their parent process. This is part of Pod Security Standards.
spec:
  validationFailureAction: Audit  # F-4: mandatory-pattern soak; promote to Enforce after ≥24h clean scan
  background: true
  rules:
    - name: disallow-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - kyverno
                - databases       # operator/CRD/Helm pods (redis-operator, redis CRD, couchdb, Percona main-mysql) — spec not editable
                - immich          # deliberately privileged (GPU passthrough), PSS baseline not restricted
                - percona-mysql   # Percona operator (ps-operator) — operator-managed spec
          # alloy DaemonSet (host log reader) — Helm-managed; keep rest of loki ns covered
          - resources:
              namespaces:
                - loki
              selector:
                matchLabels:
                  app.kubernetes.io/name: alloy
          # node-exporter mounts host paths — Helm-managed; keep rest of monitoring ns covered
          - resources:
              namespaces:
                - monitoring
              selector:
                matchLabels:
                  app.kubernetes.io/name: prometheus-node-exporter
      validate:
        message: "Privilege escalation must be disabled (allowPrivilegeEscalation: false) on every container"
        pattern:
          spec:
            =(ephemeralContainers):
              - securityContext:
                  allowPrivilegeEscalation: false
            =(initContainers):
              - securityContext:
                  allowPrivilegeEscalation: false
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false

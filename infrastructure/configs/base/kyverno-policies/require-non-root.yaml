apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
  annotations:
    policies.kyverno.io/title: Require Non-Root Containers
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers should not run as root (UID 0). This reduces the impact of container
      compromise by limiting the privileges available inside the container.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-non-root-user
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - kyverno
                - databases
          # Exclude specific apps that require root
          - resources:
              namespaces:
                - mealie
                - home-assistant
                - adguard-home      # DNS binding requires root for port 53
                - pricebuddy        # apprise sidecar requires root for config
                - stirling-pdf      # PDF processing with user switching capabilities
                - loki              # promtail requires root to read host logs
      validate:
        message: "Containers must not run as root (runAsNonRoot: true or runAsUser != 0)"
        anyPattern:
          - spec:
              =(initContainers):
                - =(securityContext):
                    runAsNonRoot: true
              containers:
                - =(securityContext):
                    runAsNonRoot: true
          - spec:
              =(initContainers):
                - =(securityContext):
                    runAsUser: ">0"
              containers:
                - =(securityContext):
                    runAsUser: ">0"
          - spec:
              securityContext:
                runAsNonRoot: true
          - spec:
              securityContext:
                runAsUser: ">0"

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require Common Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Labels are essential for organization, filtering, and tooling integration.
      This policy requires all pods to have common labels for better resource management.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-app-label
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - kyverno
      validate:
        message: "The 'app' or 'app.kubernetes.io/name' label is required"
        pattern:
          metadata:
            =(labels):
              =(app | app.kubernetes.io/name): "?*"

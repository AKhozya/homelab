apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-readonly-rootfs
  annotations:
    policies.kyverno.io/title: Require Read-Only Root Filesystem
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers should run with a read-only root filesystem to prevent runtime
      tampering of the image. Homelab invariant: readOnlyRootFilesystem requires a
      /tmp emptyDir volume for any path the process needs to write.
spec:
  validationFailureAction: Audit  # F-6: soak; promote to Enforce after >=24h scan + per-app triage
  background: true
  rules:
    - name: require-readonly-rootfs
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - kyverno
                - databases          # operator/CRD/Helm: couchdb, Percona main-mysql, redis CRD, in-ns backup CronJobs
                - percona-mysql      # Percona operator (ps-operator)
                - immich             # privileged GPU app, writes model/transcode cache to root fs
                - home-assistant     # hardware integration, privileged ns
                - paperless-ngx      # s6-overlay rewrites /run perms at boot (RoRFS not viable — F-40)
                - backup-replication # rsync stages backup files to writable root
                - claude-telegram    # F-39: RoRFS gated on live write-audit, primary bot — not flipped unattended
                - pricebuddy         # Laravel bootstrap/cache + selenium chrome temp + apprise root writes
                - stirling-pdf       # su-exec privilege drop + nginx/system-config writes (RoRFS:false by design)
          # alloy DaemonSet (host log reader) — Helm-managed; keep rest of loki ns covered
          - resources:
              namespaces:
                - loki
              selector:
                matchLabels:
                  app.kubernetes.io/name: alloy
          # grafana — Helm-managed (kube-prometheus-stack); keep rest of monitoring ns covered
          - resources:
              namespaces:
                - monitoring
              selector:
                matchLabels:
                  app.kubernetes.io/name: grafana
          # mealie-user-provision Job installs apt packages at runtime → writable /var,/etc; keep mealie app covered
          - resources:
              namespaces:
                - mealie
              selector:
                matchLabels:
                  job-name: mealie-user-provision
          # uptime-kuma-setup Job is a transient one-shot bootstrap; keep uptime-kuma app covered
          - resources:
              namespaces:
                - uptime-kuma
              selector:
                matchLabels:
                  job-name: uptime-kuma-setup
      validate:
        message: "Every container must set securityContext.readOnlyRootFilesystem: true (mount a /tmp emptyDir for writable paths)"
        pattern:
          spec:
            =(ephemeralContainers):
              - securityContext:
                  readOnlyRootFilesystem: true
            =(initContainers):
              - securityContext:
                  readOnlyRootFilesystem: true
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-drop-all-capabilities
  annotations:
    policies.kyverno.io/title: Require Drop All Capabilities
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers should drop all Linux capabilities and only add back
      specific ones if needed. This reduces the attack surface.
spec:
  validationFailureAction: Audit  # F-4: mandatory-pattern soak; promote to Enforce after ≥24h clean scan
  background: true
  rules:
    - name: require-drop-all
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - kyverno
                - databases       # operator/CRD/Helm pods (redis-operator, redis CRD, couchdb, Percona main-mysql) — spec not editable
                - immich          # deliberately privileged (GPU passthrough), PSS baseline not restricted
                - percona-mysql   # Percona operator (ps-operator) — operator-managed spec
          # alloy DaemonSet (host log reader) — Helm-managed; keep rest of loki ns covered
          - resources:
              namespaces:
                - loki
              selector:
                matchLabels:
                  app.kubernetes.io/name: alloy
          # node-exporter mounts host paths — Helm-managed; keep rest of monitoring ns covered
          - resources:
              namespaces:
                - monitoring
              selector:
                matchLabels:
                  app.kubernetes.io/name: prometheus-node-exporter
      validate:
        message: "Every container must drop all capabilities (capabilities.drop: [ALL])"
        pattern:
          spec:
            =(ephemeralContainers):
              - securityContext:
                  capabilities:
                    drop:
                      - ALL
            =(initContainers):
              - securityContext:
                  capabilities:
                    drop:
                      - ALL
            containers:
              - securityContext:
                  capabilities:
                    drop:
                      - ALL

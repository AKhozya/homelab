apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-default-serviceaccount
  annotations:
    policies.kyverno.io/title: Require Non-Default Service Account
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The default service account has unnecessary cluster-wide permissions.
      This policy requires pods to use a non-default service account following
      the principle of least privilege.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: non-default-serviceaccount
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - kyverno
      validate:
        message: "Pods must use a non-default service account. Create a dedicated service account for your application."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.serviceAccountName || 'default' }}"
                operator: Equals
                value: "default"

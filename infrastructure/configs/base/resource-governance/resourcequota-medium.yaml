# ResourceQuota for medium applications
# Limits total resource consumption per namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
spec:
  hard:
    # Total resource limits across all pods in namespace
    requests.cpu: "1500m"      # 1.5 CPUs total requests
    requests.memory: 4Gi       # 4GB total memory requests
    limits.cpu: "5"            # 5 CPUs total limits
    limits.memory: 8Gi         # 8GB total memory limits

    # Object count limits
    pods: "30"                 # Max 30 pods
    services: "15"             # Max 15 services
    persistentvolumeclaims: "10" # Max 10 PVCs

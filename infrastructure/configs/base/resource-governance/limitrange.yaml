# LimitRange sets default resource requests/limits for containers
# Prevents unbounded resource consumption and ensures all pods have defined limits
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
spec:
  limits:
    # Container-level limits
    - type: Container
      default:
        # Default limits (applied if not specified)
        cpu: 1000m      # 1 CPU
        memory: 1Gi     # 1GB RAM
      defaultRequest:
        # Default requests (applied if not specified)
        cpu: 100m       # 100 millicores
        memory: 128Mi   # 128MB RAM
      max:
        # Maximum allowed per container
        cpu: 8000m      # 8 CPUs
        memory: 16Gi    # 16GB RAM
      min:
        # Minimum required per container
        cpu: 10m        # 10 millicores
        memory: 16Mi    # 16MB RAM

    # Pod-level limits (sum of all containers)
    - type: Pod
      max:
        cpu: 16000m     # 16 CPUs
        memory: 32Gi    # 32GB RAM

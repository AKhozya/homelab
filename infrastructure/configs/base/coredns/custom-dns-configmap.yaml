apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  # Forward all h0melab.work queries to AdGuard Home
  # AdGuard Home has DNS rewrites to resolve *.h0melab.work to Traefik LoadBalancer (192.168.1.129)
  h0melab.server: |
    h0melab.work:53 {
      errors
      cache 30
      forward . 10.43.26.232
    }

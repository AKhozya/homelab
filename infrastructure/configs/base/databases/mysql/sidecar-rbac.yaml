# RBAC for MySQL sidecar to enable kopf framework functionality
# The sidecar uses kopf which requires cluster-scope permissions to:
# - List namespaces (to watch for cluster-wide changes)
# - List CRDs (to watch for resource definitions)
# Without these, the sidecar cannot properly manage cluster recovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mysql-sidecar-cluster-role
  labels:
    app.kubernetes.io/name: mysql-innodbcluster
    app.kubernetes.io/component: sidecar
rules:
  # Required by kopf framework for namespace discovery
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "watch"]
  # Required by kopf framework for CRD discovery
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mysql-sidecar-cluster-rolebinding
  labels:
    app.kubernetes.io/name: mysql-innodbcluster
    app.kubernetes.io/component: sidecar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mysql-sidecar-cluster-role
subjects:
  - kind: ServiceAccount
    name: main-mysql-sidecar-sa
    namespace: databases

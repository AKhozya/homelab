apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-cluster
  namespace: databases
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: main-mysql
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # MySQL port from app namespaces
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: home-assistant
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pricebuddy
      ports:
        - protocol: TCP
          port: 3306
    # Backup job (same namespace)
    - from:
        - podSelector:
            matchLabels:
              app: mysql-backup
      ports:
        - protocol: TCP
          port: 3306
    # Cluster internal communication (MySQL + HAProxy + Orchestrator)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: main-mysql
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 33060  # X Protocol
        - protocol: TCP
          port: 33062  # Admin port (HAProxy health checks)
        - protocol: TCP
          port: 3000   # Orchestrator HTTP API
        - protocol: TCP
          port: 10008  # Orchestrator Raft
    # Operator access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: percona-mysql
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 33060
        - protocol: TCP
          port: 33062
    # Monitoring from Prometheus
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9104  # MySQL exporter
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Cluster internal communication (MySQL + HAProxy + Orchestrator)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: main-mysql
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 33060  # X Protocol
        - protocol: TCP
          port: 33062  # Admin port
        - protocol: TCP
          port: 3000   # Orchestrator HTTP API
        - protocol: TCP
          port: 10008  # Orchestrator Raft
    # Kubernetes API for operator/cluster communication
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 443
    # Operator namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: percona-mysql
      ports:
        - protocol: TCP
          port: 443

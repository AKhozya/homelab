apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: main-mysql
  namespace: databases
  finalizers:
    - percona.com/delete-mysql-pods-in-order
spec:
  crVersion: "1.0.0"

  # Secrets for credentials
  secretsName: mysql-cluster-secrets

  # Update strategy
  updateStrategy: SmartUpdate
  upgradeOptions:
    apply: disabled

  # MySQL cluster configuration
  mysql:
    clusterType: group-replication
    autoRecovery: true
    size: 2
    image: percona/percona-server:8.4.6-6.1
    imagePullPolicy: IfNotPresent

    # Resources
    resources:
      requests:
        cpu: "250m"
        memory: "768Mi"
      limits:
        cpu: "1000m"
        memory: "1536Mi"

    # Anti-affinity for HA
    affinity:
      antiAffinityTopologyKey: kubernetes.io/hostname

    # Expose primary service
    exposePrimary:
      enabled: true
      type: ClusterIP

    # Storage
    volumeSpec:
      persistentVolumeClaim:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
        storageClassName: local-path

    # MySQL configuration
    configuration: |
      [mysqld]
      max_connections=250

  # MySQL Router for connection routing
  proxy:
    router:
      enabled: true
      size: 2
      image: percona/percona-mysql-router:8.4.6
      imagePullPolicy: IfNotPresent

      # Resources for router
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"

    # HAProxy disabled (using Router)
    haproxy:
      enabled: false
      size: 0
      image: percona/haproxy:2.8.15

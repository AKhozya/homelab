apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: main-mysql
  namespace: databases
  finalizers:
    - percona.com/delete-mysql-pods-in-order
spec:
  crVersion: "1.0.0"

  # Allow 2 replicas and simplified orchestrator (homelab setup)
  unsafeFlags:
    mysqlSize: true
    orchestrator: true
    orchestratorSize: true

  # Secrets for credentials
  secretsName: mysql-cluster-secrets

  # Update strategy (OnDelete for async without full orchestrator)
  updateStrategy: OnDelete
  upgradeOptions:
    apply: disabled

  # Orchestrator for async replication failover
  orchestrator:
    enabled: true
    size: 2
    image: percona/percona-server-mysql-operator:1.0.0-orchestrator
    imagePullPolicy: IfNotPresent
    serviceAccountName: main-mysql
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
    # Distribute across all nodes including control plane
    affinity:
      antiAffinityTopologyKey: kubernetes.io/hostname
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  # Backup configuration (required even if not using backups)
  backup:
    enabled: false
    image: percona/percona-xtrabackup:8.4.0-4.1
    imagePullPolicy: IfNotPresent

  # MySQL cluster configuration
  mysql:
    clusterType: async
    autoRecovery: true
    size: 2
    image: percona/percona-server:8.4.6-6.1
    imagePullPolicy: IfNotPresent
    serviceAccountName: main-mysql

    # Resources
    resources:
      requests:
        cpu: "250m"
        memory: "768Mi"
      limits:
        cpu: "1000m"
        memory: "1536Mi"

    # Anti-affinity for HA
    affinity:
      antiAffinityTopologyKey: kubernetes.io/hostname

    # Expose primary service
    exposePrimary:
      enabled: true
      type: ClusterIP

    # Storage
    volumeSpec:
      persistentVolumeClaim:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
        storageClassName: local-path

    # MySQL configuration
    configuration: |
      [mysqld]
      max_connections=250

  # HAProxy for connection routing (required for async replication)
  proxy:
    haproxy:
      enabled: true
      size: 2
      image: percona/haproxy:2.8.15
      imagePullPolicy: IfNotPresent
      serviceAccountName: main-mysql

      # Resources for HAProxy
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"

    # Router disabled (only works with group-replication)
    router:
      enabled: false
      size: 0
      image: percona/percona-mysql-router:8.4.6

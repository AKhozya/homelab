apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: couchdb
  namespace: databases
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: couchdb
  endpoints:
    - port: couchdb
      interval: 60s
      path: /_node/_local/_prometheus
      scrapeTimeout: 10s
      basicAuth:
        username:
          name: couchdb-couchdb
          key: adminUsername
        password:
          name: couchdb-couchdb
          key: adminPassword
      # Drop high-cardinality erlang metrics (860 series, not actionable)
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'couchdb_erlang_message_queue_size'
          action: drop

apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: main-postgres-cluster
  namespace: databases
  labels:
    release: kube-prometheus-stack  # Required for Prometheus operator to discover
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: main-postgres
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s

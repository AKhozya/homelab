apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: main-postgres-pooler
  namespace: databases
spec:
  cluster:
    name: main-postgres
  instances: 1
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "100"
      default_pool_size: "25"
      server_login_retry: "1"

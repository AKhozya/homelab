apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: main-postgres
  namespace: databases
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  storage:
    size: 10Gi
    storageClass: "local-path"
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: postgres
      owner: postgres
      postInitTemplateSQL:
        - |
          -- Create common extensions in template1 so all new databases inherit them
          CREATE EXTENSION IF NOT EXISTS vector CASCADE;
          CREATE EXTENSION IF NOT EXISTS cube CASCADE;
          CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
          CREATE EXTENSION IF NOT EXISTS pg_trgm CASCADE;
          CREATE EXTENSION IF NOT EXISTS unaccent CASCADE;
          CREATE EXTENSION IF NOT EXISTS uuid-ossp CASCADE;
  managed:
    roles:
      - name: postgres-admin
        ensure: present
        comment: PostgreSQL admin user for maintenance tasks (extensions, backups)
        login: true
        superuser: true
        passwordSecret:
          name: postgres-admin-user
      - name: linkding
        ensure: present
        comment: Linkding application user
        login: true
        createdb: true
        passwordSecret:
          name: linkding-db-app-user
      - name: n8n
        ensure: present
        comment: n8n application user
        login: true
        createdb: true
        passwordSecret:
          name: n8n-db-user
      - name: mealie
        ensure: present
        comment: Mealie application user
        login: true
        createdb: true
        passwordSecret:
          name: mealie-db-user
      - name: wallabag
        ensure: present
        comment: Wallabag application user
        login: true
        createdb: true
        passwordSecret:
          name: wallabag-db-user
      - name: authentik
        ensure: present
        comment: Authentik application user
        login: true
        createdb: true
        passwordSecret:
          name: authentik-db-user
      - name: paperless
        ensure: present
        comment: Paperless-NGX application user
        login: true
        createdb: true
        passwordSecret:
          name: paperless-db-user
      - name: immich
        ensure: present
        comment: Immich application user
        login: true
        createdb: true
        passwordSecret:
          name: immich-db-user

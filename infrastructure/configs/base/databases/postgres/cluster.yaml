apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: main-postgres
  namespace: databases
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  storage:
    size: 10Gi
    storageClass: "local-path"
  superuserSecret:
    name: main-postgres-superuser
  monitoring:
    enablePodMonitor: true
  managed:
    roles:
      - name: linkding
        ensure: present
        comment: Linkding application user
        login: true
        passwordSecret:
          name: linkding-db-app-user
      - name: n8n
        ensure: present
        comment: n8n application user
        login: true
        passwordSecret:
          name: n8n-db-user
      - name: mealie
        ensure: present
        comment: Mealie application user
        login: true
        passwordSecret:
          name: mealie-db-user

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-operator-network-policy
  namespace: databases
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow webhook access from API server
    - ports:
        - protocol: TCP
          port: 9443
    # Allow access from within the same namespace
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9443
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow HTTPS for certificate validation and API calls
    - ports:
        - protocol: TCP
          port: 443
    # Allow access to PostgreSQL instances
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: main-postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-cluster-network-policy
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: main-postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow PostgreSQL client connections
    - from:
        - namespaceSelector: {}  # Allow from all namespaces
      ports:
        - protocol: TCP
          port: 5432
    # Allow cluster internal communication
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: main-postgres
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow cluster internal communication
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: main-postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-pooler-network-policy
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/podRole: pooler
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow PostgreSQL client connections through pooler
    - from:
        - namespaceSelector: {}  # Allow from all namespaces
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow connections to PostgreSQL instances
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: main-postgres
      ports:
        - protocol: TCP
          port: 5432
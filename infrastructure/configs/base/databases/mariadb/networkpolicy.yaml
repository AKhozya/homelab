apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-allow-apps
  namespace: databases
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mariadb
      app.kubernetes.io/instance: main-mariadb
  policyTypes:
    - Ingress
  ingress:
    # Allow from app namespaces (home-assistant, discount-bandit, uptime-kuma)
    - from:
      - namespaceSelector:
          matchLabels:
            kustomize.toolkit.fluxcd.io/name: apps
      ports:
      - protocol: TCP
        port: 3306  # MariaDB port

    # Allow from monitoring namespace (Prometheus metrics scraping)
    - from:
      - namespaceSelector:
          matchLabels:
            kustomize.toolkit.fluxcd.io/name: monitoring-controllers
      ports:
      - protocol: TCP
        port: 9104  # mysqld-exporter metrics port

    # Allow from same namespace (maintenance jobs)
    - from:
      - podSelector: {}
      ports:
      - protocol: TCP
        port: 3306

    # Allow Galera intra-cluster communication
    - from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: mariadb
            app.kubernetes.io/instance: main-mariadb
      ports:
      - protocol: TCP
        port: 3306  # MariaDB port
      - protocol: TCP
        port: 4567  # Galera cluster communication
      - protocol: TCP
        port: 4568  # Galera IST (Incremental State Transfer)
      - protocol: TCP
        port: 4444  # Galera SST (State Snapshot Transfer)

    # Allow mariadb-operator to access agent API for health monitoring
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: mariadb-operator
      ports:
      - protocol: TCP
        port: 5555  # Galera agent API

apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: discount-bandit
  namespace: databases
spec:
  mariaDbRef:
    name: main-mariadb
    waitForIt: true
  name: discountbandit
  passwordSecretKeyRef:
    name: discount-bandit-mariadb-password
    key: password
  maxUserConnections: 10
  retryInterval: 5s

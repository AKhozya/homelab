apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: main-mariadb
  namespace: databases
spec:
  # Single instance (no HA) - relies on daily + hourly binlog backups for DR
  replicas: 1

  # Explicitly disable Galera (operator enables by default)
  galera:
    enabled: false

  # Explicitly disable replication (single instance mode)
  replication:
    enabled: false

  # MariaDB version
  image: mariadb:12.1.2  # Latest LTS version
  imagePullPolicy: IfNotPresent

  # Service account for pods
  serviceAccountName: mariadb

  # Root credentials
  rootPasswordSecretKeyRef:
    name: mariadb-root
    key: password

  # Storage configuration
  storage:
    size: 20Gi
    storageClassName: local-path
    resizeInUseVolumes: true
    waitForVolumeResize: true

  # Resource allocation - optimized based on actual usage (~420Mi peak)
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  # MariaDB configuration with binary logging for PITR backups
  myCnf: |
    [mariadb]
    bind-address=*
    default_storage_engine=InnoDB
    innodb_buffer_pool_size=512M
    max_allowed_packet=256M

    # Binary logging (for PITR backups)
    log_bin=mariadb-bin
    binlog_format=ROW
    sync_binlog=1
    expire_logs_days=3
    max_binlog_size=100M

    # Performance settings
    innodb_flush_log_at_trx_commit=1

  # Metrics for Prometheus
  metrics:
    enabled: true
    exporter:
      image: prom/mysqld-exporter:v0.18.0
      port: 9104
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 300m
          memory: 512Mi
    serviceMonitor:
      prometheusRelease: kube-prometheus-stack
      interval: 60s
      scrapeTimeout: 10s

  # Service configuration
  service:
    type: ClusterIP
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9104"

  # Update strategy - OnDelete for single instance (brief downtime during updates)
  updateStrategy:
    type: OnDelete

  # Security context
  podSecurityContext:
    runAsUser: 999  # MariaDB user
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

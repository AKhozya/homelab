apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: main-mariadb
  namespace: databases
spec:
  # Galera HA cluster with 2 replicas across worker nodes
  replicas: 2
  replicasAllowEvenNumber: true  # Allow 2 replicas (normally Galera prefers odd)

  # Galera multi-master synchronous replication
  galera:
    enabled: true
    primary:
      podIndex: 0
      autoFailover: true
    sst: mariabackup  # State Snapshot Transfer method
    replicaThreads: 1
    agent:
      port: 5555
      kubernetesAuth:
        enabled: true
      gracefulShutdownTimeout: 5s
    recovery:
      enabled: true
      minClusterSize: 1
      clusterMonitorInterval: 10s
      clusterHealthyTimeout: 5m
      clusterBootstrapTimeout: 10m
      podRecoveryTimeout: 5m
      podSyncTimeout: 5m

  # Disable async replication (using Galera sync replication instead)
  replication:
    enabled: false

  # Pod anti-affinity to spread across worker nodes
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/instance: main-mariadb
          topologyKey: kubernetes.io/hostname

  # MariaDB version
  image: mariadb:12.1.2  # Latest LTS version
  imagePullPolicy: IfNotPresent

  # Service account for pods
  serviceAccountName: mariadb

  # Root credentials
  rootPasswordSecretKeyRef:
    name: mariadb-root
    key: password

  # Storage configuration
  storage:
    size: 20Gi
    storageClassName: local-path
    resizeInUseVolumes: true
    waitForVolumeResize: true

  # Resource allocation - optimized based on actual usage (~420Mi peak)
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  # MariaDB configuration with binary logging for PITR backups
  myCnf: |
    [mariadb]
    bind-address=*
    default_storage_engine=InnoDB
    innodb_buffer_pool_size=512M
    max_allowed_packet=256M

    # Binary logging (for PITR backups)
    log_bin=mariadb-bin
    binlog_format=ROW
    sync_binlog=1
    expire_logs_days=3
    max_binlog_size=100M

    # Performance settings
    innodb_flush_log_at_trx_commit=1

  # Metrics for Prometheus
  metrics:
    enabled: true
    exporter:
      image: prom/mysqld-exporter:v0.18.0
      port: 9104
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 300m
          memory: 512Mi
    serviceMonitor:
      prometheusRelease: kube-prometheus-stack
      interval: 60s
      scrapeTimeout: 10s

  # Service configuration
  service:
    type: ClusterIP
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9104"

  # Update strategy - RollingUpdate for Galera HA (zero downtime updates)
  updateStrategy:
    type: RollingUpdate

  # Security context
  podSecurityContext:
    runAsUser: 999  # MariaDB user
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # TLS disabled - Galera has certificate EKU compatibility issues
  # Internal cluster communication is on private network
  tls:
    enabled: false

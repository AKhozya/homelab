apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: main-mariadb
  namespace: databases
spec:
  # HA with Galera multi-master replication (3 nodes for proper quorum)
  replicas: 3

  # Enable Galera for synchronous multi-master replication
  galera:
    enabled: true
    primary:
      podIndex: 0          # main-mariadb-0 is primary bootstrap node
      autoFailover: true   # Automatic primary failover
    sst: mariabackup       # State Snapshot Transfer method
    replicaThreads: 1      # Parallel replication threads
    agent:
      image: ghcr.io/mariadb-operator/mariadb-operator:v0.37.1
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
    recovery:
      enabled: true
      clusterHealthyTimeout: 5m
      clusterBootstrapTimeout: 10m
      podRecoveryTimeout: 5m
      podSyncTimeout: 5m
    config:
      reuseStorageVolume: false
      volumeClaimTemplate:
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
        accessModes:
          - ReadWriteOnce

  # Allow scheduling on control plane (3 nodes needed for quorum)
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  # Distribute across all nodes for HA (1 replica per node)
  affinity:
    antiAffinityEnabled: true
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: mariadb
              app.kubernetes.io/instance: main-mariadb
          topologyKey: kubernetes.io/hostname

  # Explicitly disable async replication (using Galera instead)
  replication:
    enabled: false

  # MariaDB version
  image: mariadb:12.1.2  # Latest LTS version
  imagePullPolicy: IfNotPresent

  # Service account for pods
  serviceAccountName: mariadb

  # Root credentials
  rootPasswordSecretKeyRef:
    name: mariadb-root
    key: password

  # Storage configuration
  storage:
    size: 20Gi
    storageClassName: local-path
    resizeInUseVolumes: true
    waitForVolumeResize: true

  # Resource allocation - optimized based on actual usage (~420Mi peak)
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  # MariaDB configuration with binary logging for PITR backups
  myCnf: |
    [mariadb]
    bind-address=*
    default_storage_engine=InnoDB
    innodb_buffer_pool_size=512M
    max_allowed_packet=256M

    # Binary logging (for PITR backups)
    log_bin=mariadb-bin
    binlog_format=ROW
    sync_binlog=1
    expire_logs_days=3
    max_binlog_size=100M

    # Performance settings
    innodb_flush_log_at_trx_commit=1

  # Metrics for Prometheus
  metrics:
    enabled: true
    exporter:
      image: prom/mysqld-exporter:v0.18.0
      port: 9104
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 300m
          memory: 512Mi
    serviceMonitor:
      prometheusRelease: kube-prometheus-stack
      interval: 60s
      scrapeTimeout: 10s

  # Service configuration
  service:
    type: ClusterIP
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9104"

  # Update strategy - RollingUpdate for Galera (zero-downtime rolling updates)
  updateStrategy:
    type: RollingUpdate

  # Security context
  podSecurityContext:
    runAsUser: 999  # MariaDB user
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: main-mariadb
  namespace: databases
spec:
  # Primary-Replica replication for HA (like PostgreSQL)
  replicas: 2

  # MariaDB version
  image: mariadb:12.1.2  # Latest LTS version
  imagePullPolicy: IfNotPresent

  # Service account for pods
  serviceAccountName: mariadb

  # Root credentials
  rootPasswordSecretKeyRef:
    name: mariadb-root
    key: password

  # Storage configuration (per replica)
  storage:
    size: 20Gi
    storageClassName: local-path
    resizeInUseVolumes: true
    waitForVolumeResize: true

  # Resource allocation - optimized based on actual usage (~420Mi peak)
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  # Replication configuration (primary-replica like PostgreSQL)
  replication:
    enabled: true
    primary:
      podIndex: 0  # main-mariadb-0 is initial primary
      autoFailover: true  # Automatic failover if primary fails
    replica:
      gtid: CurrentPos  # Use GTID for position tracking
      syncTimeout: 10s  # Timeout for replica sync during switchover
    semiSyncWaitPoint: AfterCommit  # Wait for transaction commit before ack
    agent:
      port: 5555
      kubernetesAuth:
        enabled: true
      gracefulShutdownTimeout: 5s
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"

  # MariaDB configuration with binary logging for replication
  myCnf: |
    [mariadb]
    bind-address=*
    default_storage_engine=InnoDB
    innodb_buffer_pool_size=512M
    max_allowed_packet=256M

    # Binary logging (required for replication)
    log_bin=mariadb-bin
    binlog_format=ROW
    sync_binlog=1
    expire_logs_days=3
    max_binlog_size=100M

    # Replication settings
    gtid_strict_mode=ON
    log_slave_updates=ON

    # Performance settings
    innodb_flush_log_at_trx_commit=1

  # Metrics for Prometheus
  metrics:
    enabled: true
    exporter:
      image: prom/mysqld-exporter:v0.18.0
      port: 9104
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 300m
          memory: 512Mi
    serviceMonitor:
      prometheusRelease: kube-prometheus-stack
      interval: 30s
      scrapeTimeout: 10s

  # Service configuration
  service:
    type: ClusterIP
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9104"

  # Update strategy - ReplicasFirstPrimaryLast for zero-downtime updates
  updateStrategy:
    type: ReplicasFirstPrimaryLast

  # Spread replicas across nodes if possible
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: mariadb
                app.kubernetes.io/instance: main-mariadb
            topologyKey: kubernetes.io/hostname

  # Security context
  podSecurityContext:
    runAsUser: 999  # MariaDB user
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

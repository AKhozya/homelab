# Intel GPU device-plugin — advertises the Meteor Lake iGPU as gpu.intel.com/i915 so pods can request
# it with NO privileged / NO hostPath on the app pod (PSS-clean). Vendored from upstream
# intel-device-plugins-for-kubernetes v0.36.0 (deployments/gpu_plugin/base/intel-gpu-plugin.yaml).
#
# Placement = standalone DaemonSet in kube-system (NOT the operator — the operator overrides pinned
# images, violating the image-pin invariant). kube-system is already EXCLUDED from disallow-host-path
# + require-non-root (CP + VP twins), and the plugin natively satisfies the other PSS policies
# (drop ALL caps, allowPrivilegeEscalation:false, readOnlyRootFilesystem:true, no host namespaces) →
# ZERO Kyverno edits. The DaemonSet itself needs hostPath (/dev/dri, /sys/class/drm, the kubelet
# device-plugin socket, CDI) + runs as root — that is why it lives in an excluded ns.
#
# Deltas vs upstream base: image pinned to 0.36.0; arg -shared-dev-num=10 (Immich server + ML
# time-share the single iGPU); nodeSelector binds it to the GPU node via the homelab/gpu=intel label
# (set in host_vars/immich-vm.yml at the k3s join) + amd64.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-gpu-plugin
  namespace: kube-system
  labels:
    app: intel-gpu-plugin
spec:
  selector:
    matchLabels:
      app: intel-gpu-plugin
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: intel-gpu-plugin
    spec:
      containers:
      - name: intel-gpu-plugin
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: HOST_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
        image: docker.io/intel/intel-gpu-plugin:0.36.0
        imagePullPolicy: IfNotPresent
        args:
          - "-shared-dev-num=10"
        securityContext:
          seLinuxOptions:
            type: "container_device_plugin_t"
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            memory: "45Mi"
            cpu: 40m
          limits:
            memory: "90Mi"
            cpu: 100m
        volumeMounts:
        - name: devfs
          mountPath: /dev/dri
          readOnly: true
        - name: sysfsdrm
          mountPath: /sys/class/drm
          readOnly: true
        - name: kubeletsockets
          mountPath: /var/lib/kubelet/device-plugins
        - name: cdipath
          mountPath: /var/run/cdi
      volumes:
      - name: devfs
        hostPath:
          path: /dev/dri
      - name: sysfsdrm
        hostPath:
          path: /sys/class/drm
      - name: kubeletsockets
        hostPath:
          path: /var/lib/kubelet/device-plugins
      - name: cdipath
        hostPath:
          path: /var/run/cdi
          type: DirectoryOrCreate
      nodeSelector:
        kubernetes.io/arch: amd64
        homelab/gpu: intel
      tolerations:
        - key: homelab/dedicated
          operator: Equal
          value: immich
          effect: NoSchedule

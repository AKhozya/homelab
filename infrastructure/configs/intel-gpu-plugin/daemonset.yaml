# Intel GPU device-plugin — advertises the Meteor Lake iGPU as gpu.intel.com/i915 so pods can request
# it with NO privileged / NO hostPath on the app pod (PSS-clean). Vendored from upstream
# intel-device-plugins-for-kubernetes (deployments/gpu_plugin/base/intel-gpu-plugin.yaml).
#
# Standalone DaemonSet in kube-system, not the operator: the operator overrides pinned images,
# which breaks the image-pin rule. The DaemonSet needs hostPath (/dev/dri, /sys/class/drm, the
# kubelet device-plugin socket, CDI) and runs as root. kube-system is excluded from
# disallow-host-path and require-non-root, and the plugin meets the other pod-security policies
# as shipped (drop ALL, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, no host
# namespaces).
#
# Deltas vs upstream base: image pinned (Renovate bumps the tag); arg -shared-dev-num=10 (Immich server + ML
# time-share the single iGPU); nodeSelector binds it to the GPU node via the homelab/gpu=intel label
# (set in host_vars/immich-vm.yml at the k3s join) + amd64.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-gpu-plugin
  namespace: kube-system
  labels:
    app: intel-gpu-plugin
spec:
  selector:
    matchLabels:
      app: intel-gpu-plugin
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: intel-gpu-plugin
    spec:
      containers:
      - name: intel-gpu-plugin
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: HOST_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
        image: docker.io/intel/intel-gpu-plugin:0.37.1
        imagePullPolicy: IfNotPresent
        args:
          - "-shared-dev-num=10"
        securityContext:
          seLinuxOptions:
            type: "container_device_plugin_t"
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            memory: "45Mi"
            cpu: 40m
          limits:
            memory: "90Mi"
            cpu: 100m
        volumeMounts:
        - name: devfs
          mountPath: /dev/dri
          readOnly: true
        - name: sysfsdrm
          mountPath: /sys/class/drm
          readOnly: true
        - name: kubeletsockets
          mountPath: /var/lib/kubelet/device-plugins
        - name: cdipath
          mountPath: /var/run/cdi
      volumes:
      - name: devfs
        hostPath:
          path: /dev/dri
      - name: sysfsdrm
        hostPath:
          path: /sys/class/drm
      - name: kubeletsockets
        hostPath:
          path: /var/lib/kubelet/device-plugins
      - name: cdipath
        hostPath:
          path: /var/run/cdi
          type: DirectoryOrCreate
      nodeSelector:
        kubernetes.io/arch: amd64
        homelab/gpu: intel
      tolerations:
        - key: homelab/dedicated
          operator: Equal
          value: immich
          effect: NoSchedule

apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-replication
  namespace: backup-replication
spec:
  # 03:30 UTC, after the source backups finish between 03:00 and 03:16.
  schedule: "30 3 * * *"
  timeZone: "UTC"
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: backup-replication
        spec:
          serviceAccountName: backup-replication
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          priorityClassName: homelab-batch
          # worker-node holds the source backups.
          nodeSelector:
            kubernetes.io/hostname: worker-node
          securityContext:
            # Run as root to install rsync and access backup files
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rsync
              image: alpine:3.24.2
              env:
                - name: NAS_RSYNC_USER
                  valueFrom:
                    secretKeyRef:
                      name: nas-rsync-credentials
                      key: rsync-user
                - name: NAS_RSYNC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nas-rsync-credentials
                      key: rsync-password
                - name: TELEGRAM_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: backup-telegram
                      key: bot_token
                - name: TELEGRAM_CHAT_ID
                  valueFrom:
                    secretKeyRef:
                      name: backup-telegram
                      key: chat_id
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  CURRENT_STEP="init"

                  # Send a rich Markdown message (Bot API 10.1 sendRichMessage); best-effort.
                  tg_rich() {
                    [ -n "$TELEGRAM_BOT_TOKEN" ] || return 0
                    command -v jq >/dev/null 2>&1 || return 0
                    command -v curl >/dev/null 2>&1 || return 0
                    jq -n --arg md "$1" --arg chat "$TELEGRAM_CHAT_ID" \
                      '{chat_id:$chat, rich_message:{markdown:$md, skip_entity_detection:true}}' \
                    | curl -s -X POST \
                        "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendRichMessage" \
                        -H 'content-type: application/json' --data-binary @- \
                        -o /dev/null 2>/dev/null || true
                  }

                  # Build + send the validation table from REPORT_FILE.
                  # Used by the early-abort path (Step 1) and the final report (Step 6).
                  send_report() {
                    MSG_FILE="/tmp/telegram-msg.txt"
                    printf '## ❌ Backup Validation FAILED (%s)\n\n| Backup | Status | Details |\n|---|---|---|\n' "$TODAY" > "$MSG_FILE"

                    while IFS='|' read -r status label details; do
                      if [ "$status" = "OK" ]; then
                        printf '| %s | ✅ | %s |\n' "$label" "$details" >> "$MSG_FILE"
                      else
                        printf '| %s | ❌ | %s |\n' "$label" "$details" >> "$MSG_FILE"
                      fi
                    done < "$REPORT_FILE"

                    printf '\n**%s**' "$NAS_STATUS" >> "$MSG_FILE"

                    cat "$MSG_FILE"
                    tg_rich "$(cat "$MSG_FILE")"
                  }

                  send_failure() {
                    MSG=$(printf '## ❌ Backup Replication FAILED\n\nFailed at step: `%s`\nDate: %s\n\nSource backups preserved (not cleaned).' "$CURRENT_STEP" "$(date +%Y-%m-%d)")
                    tg_rich "$MSG"
                  }
                  trap send_failure EXIT

                  echo "=== Backup Replication Started: $(date) ==="

                  CURRENT_STEP="Installing dependencies"
                  apk add --no-cache rsync curl jq

                  echo "=== Source Backups ==="
                  du -sh /source-backups/*/ 2>/dev/null || echo "No backups found"

                  # Step 1: Validate source backups BEFORE syncing — a corrupt/stale
                  # backup must not land on the NAS.
                  CURRENT_STEP="Step 1: Validating source backups"
                  echo ""
                  echo "=== Step 1: Validating source backups (before any sync) ==="
                  REPORT_FILE="/tmp/backup-report.txt"
                  : > "$REPORT_FILE"
                  # Artifacts that PASSED Step 1, as paths relative to /source-backups.
                  # Step 3 proves each one landed on the NAS before Step 4 deletes the source.
                  VALIDATED_LIST="/tmp/validated-artifacts.txt"
                  : > "$VALIDATED_LIST"
                  # Appended to NAS_STATUS at report time so a mid-run failure reason
                  # survives Step 5's unconditional rewrite of NAS_STATUS.
                  NAS_NOTE=""
                  # Counted in the shell, NOT re-derived from a file: the expectation must
                  # not share a failure mode with the list it audits, or two matched write
                  # failures cancel out and the check passes having proved nothing.
                  VALIDATED_EXPECTED=0
                  OVERALL_OK=true
                  TODAY=$(date +%Y-%m-%d)

                  validate_backup() {
                    local type="$1"
                    local dir="/source-backups/$type"
                    local min_size="$2"
                    local label="$3"
                    local failed=false
                    local checks=""

                    echo "--- Checking $label ---"

                    local latest
                    latest=$(find "$dir" -name "*.tar.gz" -type f 2>/dev/null | sort -r | head -1)

                    if [ -z "$latest" ]; then
                      echo "FAIL: No .tar.gz found in $dir"
                      printf "FAIL|%s|MISSING - no backup found!\n" "$label" >> "$REPORT_FILE"
                      OVERALL_OK=false
                      return 1
                    fi

                    local size
                    size=$(stat -c%s "$latest" 2>/dev/null || stat -f%z "$latest" 2>/dev/null)
                    local size_human
                    size_human=$(du -h "$latest" | cut -f1)

                    echo "  File: $(basename "$latest") ($size_human)"

                    local file_epoch
                    file_epoch=$(stat -c%Y "$latest" 2>/dev/null || stat -f%m "$latest" 2>/dev/null)
                    local now_epoch
                    now_epoch=$(date +%s)
                    local age_hours=$(( (now_epoch - file_epoch) / 3600 ))

                    if [ "$age_hours" -gt 25 ]; then
                      echo "  FAIL: Age ${age_hours}h (>25h)"
                      checks="age ${age_hours}h OLD"
                      failed=true
                    else
                      echo "  OK: Age ${age_hours}h"
                    fi

                    local sha_file="${latest}.sha256"
                    if [ -f "$sha_file" ]; then
                      local expected
                      expected=$(awk '{print $1}' "$sha_file")
                      local actual
                      actual=$(sha256sum "$latest" | awk '{print $1}')
                      if [ "$expected" = "$actual" ]; then
                        echo "  OK: SHA256 matches"
                        checks="${checks:+$checks, }SHA256 OK"
                      else
                        echo "  FAIL: SHA256 mismatch!"
                        checks="${checks:+$checks, }SHA256 FAIL"
                        failed=true
                      fi
                    else
                      echo "  SKIP: No .sha256 file"
                      checks="${checks:+$checks, }no checksum"
                    fi

                    if tar -tzf "$latest" >/dev/null 2>&1; then
                      echo "  OK: tar integrity"
                      checks="${checks:+$checks, }tar OK"
                    else
                      echo "  FAIL: tar integrity check failed!"
                      checks="${checks:+$checks, }tar FAIL"
                      failed=true
                    fi

                    if [ "$size" -lt "$min_size" ]; then
                      echo "  FAIL: Size ${size_human} below minimum"
                      checks="${checks:+$checks, }too small"
                      failed=true
                    else
                      echo "  OK: Size ${size_human}"
                    fi

                    if [ "$failed" = true ]; then
                      printf "FAIL|%s|%s, %s\n" "$label" "$size_human" "$checks" >> "$REPORT_FILE"
                      OVERALL_OK=false
                    else
                      printf "OK|%s|%s, %s\n" "$label" "$size_human" "$checks" >> "$REPORT_FILE"
                      # Path RELATIVE to /source-backups, because that is exactly how it
                      # appears in the recursive rsync listing of the NAS. Not
                      # "<type>/<basename>": pvc archives nest as
                      # pvc/<timestamp>/<namespace>/<file>, so a flattened name matches
                      # nothing and Step 3 would fail every run.
                      printf "%s\n" "${latest#/source-backups/}" >> "$VALIDATED_LIST"
                      VALIDATED_EXPECTED=$((VALIDATED_EXPECTED + 1))
                    fi
                  }

                  # CouchDB floor is 20KB, not 100KB, since 2026-08-08. Its only database is
                  # Obsidian LiveSync's obsidian-personal. A client-side "rebuild everything"
                  # on 2026-08-06 recreated it, and the nightly dump went from 15.8M to 88K.
                  # The 100KB floor then aborted the 08-07 and 08-08 runs at Step 1, so
                  # nothing reached the NAS for two nights. A floor catches a truncated dump; it
                  # cannot also track how much data the vault holds. The couchdb-backup job
                  # checks each database separately.
                  validate_backup "postgres" 1048576 "PostgreSQL" || true
                  validate_backup "couchdb" 20480 "CouchDB" || true
                  validate_backup "mysql" 102400 "MySQL" || true
                  validate_backup "pvc" 102400 "PVC" || true

                  # Abort before the sync on validation failure: source preserved for
                  # forensics, NAS history untouched.
                  if [ "$OVERALL_OK" != true ]; then
                    NAS_STATUS="NAS: not checked (aborted before sync)"
                    send_report
                    trap - EXIT
                    echo "Validation failed — source preserved, nothing synced."
                    exit 1
                  fi

                  # The NAS is the sole replication sink. There is no second copy on a worker.

                  # Step 2: Sync to NAS (no --delete, NAS accumulates full history)
                  CURRENT_STEP="Step 2: Syncing to NAS"
                  echo ""
                  echo "=== Step 2: Syncing to NAS ==="
                  # No -z: backups are .tar.gz (already compressed) and transfers are
                  # LAN — compression just burns CPU on both ends for ~0 size gain (2026-06-28).
                  #
                  # immich/ is EXCLUDED because immich-backup publishes to the same NAS path
                  # itself (its POOL=…/backups/homelab/immich) from a different source dir,
                  # /mnt/extra-storage/immich-backup. What lives under /source-backups/immich/
                  # here is 129G of stale generations from before that move, and Step 4 has
                  # never cleaned it. Without this exclude the two jobs fight nightly: Step 2
                  # uploads those stale dirs (129G — they really are absent on the NAS), then
                  # Step 4b's keep-2 prunes them again minutes later because the two newest
                  # are the ones immich-backup pushed directly. `speedup is 1.00` in the log
                  # was that, not an rsync tuning problem. Observed 2026-07-27.
                  #
                  # ANCHORED (`/immich/`, not `immich/`): an unanchored rsync pattern matches at
                  # ANY depth, so it would also silently drop a future `pvc/<ts>/immich/…` if
                  # that namespace ever gains a critical PVC. It has none today (the 10 backed-up
                  # namespaces are audiobookshelf, home-assistant, homehub, linkwarden, mealie,
                  # n8n, paperless-ngx, pricebuddy, rustdesk, stirling-pdf), which is exactly why
                  # the mistake would go unnoticed.
                  RSYNC_PASSWORD="$NAS_RSYNC_PASSWORD" rsync -av \
                    --exclude='*.tmp' \
                    --exclude='.*.swp' \
                    --exclude='/immich/' \
                    --port=50555 \
                    /source-backups/ \
                    "rsync://${NAS_RSYNC_USER}@192.168.1.136/akhozya-pool1/backups/homelab/"

                  # Single place that knows the NAS URL; writes the listing to stdout and
                  # returns rsync's own status so callers can branch on failure. The old
                  # inline forms buried this in `2>/dev/null | ...`, where the pipeline
                  # status is the last stage's and the script has set -e but NOT pipefail.
                  nas_list() {
                    RSYNC_PASSWORD="$NAS_RSYNC_PASSWORD" rsync --port=50555 -r --list-only \
                      "rsync://${NAS_RSYNC_USER}@192.168.1.136/akhozya-pool1/backups/homelab/" \
                      2>/tmp/nas-list.err
                  }

                  # Step 3: Verify NAS
                  CURRENT_STEP="Step 3: Verifying NAS"
                  echo ""
                  echo "=== Step 3: Verifying NAS ==="
                  # This MUST be able to fail — Step 4 deletes the only other copy right
                  # after it. The previous form (`... | head -20 || echo "failed"`) could
                  # not: head exits 0 regardless, and the || swallowed what was left.
                  NAS_VERIFY_LIST="/tmp/nas-verify.txt"
                  if ! nas_list > "$NAS_VERIFY_LIST"; then
                    echo "FAIL: could not list the NAS after sync"
                    cat /tmp/nas-list.err 2>/dev/null || true
                    NAS_STATUS="NAS: listing FAILED after sync — source NOT cleaned"
                    OVERALL_OK=false
                    send_report
                    trap - EXIT
                    exit 1
                  fi

                  # Guard against a VACUOUS pass: the appends inside validate_backup are
                  # its last command and every caller uses `|| true`, so a failed write
                  # would leave an empty list, an empty loop, and an unset MISSING —
                  # green-lighting the rm -rf below while proving nothing.
                  VALIDATED_COUNT=$(wc -l < "$VALIDATED_LIST" | tr -d ' ')
                  if [ "$VALIDATED_COUNT" -eq 0 ] || [ "$VALIDATED_COUNT" -ne "$VALIDATED_EXPECTED" ]; then
                    echo "FAIL: validated-artifact list incomplete ($VALIDATED_COUNT of $VALIDATED_EXPECTED expected)"
                    NAS_STATUS="NAS: verification list incomplete — source NOT cleaned"
                    OVERALL_OK=false
                    send_report
                    trap - EXIT
                    exit 1
                  fi

                  MISSING=""
                  while IFS= read -r artifact; do
                    if [ -z "$artifact" ]; then continue; fi
                    # EXACT match on the listing's path field, not a substring: plain grep
                    # for "postgres/x.tar.gz" is also satisfied by the line for
                    # "postgres/x.tar.gz.sha256", so a missing payload could be vouched
                    # for by its surviving checksum sidecar.
                    if ! awk -v want="$artifact" '$NF == want { found = 1 } END { exit !found }' \
                      "$NAS_VERIFY_LIST"; then
                      MISSING="${MISSING}${artifact} "
                    fi
                  done < "$VALIDATED_LIST"

                  if [ -n "$MISSING" ]; then
                    echo "FAIL: Step-1-validated artifacts absent from the NAS: $MISSING"
                    NAS_STATUS="NAS: missing after sync ($MISSING) — source NOT cleaned"
                    OVERALL_OK=false
                    send_report
                    trap - EXIT
                    exit 1
                  fi
                  echo "OK: all $(wc -l < "$VALIDATED_LIST" | tr -d ' ') validated artifact(s) present on NAS"

                  # Step 4: Clean source on worker-node — reachable only once Step 1
                  # validated the artifacts AND Step 3 confirmed each one is on the NAS.
                  echo ""
                  echo "=== Step 4: Cleaning source backups ==="
                  rm -rf /source-backups/postgres/* /source-backups/couchdb/* /source-backups/mysql/* /source-backups/pvc/*
                  echo "Source cleaned (data on NAS)"

                  # Step 4b: Enforce NAS retention — 30 days for daily backups, keep-2 for the
                  # weekly immich set. Pruning pushes an empty tree with --delete. Every prune
                  # soft-fails: if the rsync module config refuses delete, replication itself
                  # must still succeed.
                  CURRENT_STEP="Step 4b: Pruning NAS retention"
                  echo ""
                  echo "=== Step 4b: Pruning NAS retention (30d daily / keep-2 immich) ==="
                  mkdir -p /tmp/empty

                  # Two prune helpers — NAS layout is mixed:
                  #   - pvc/ + immich/ store DIRS named "<category>/YYYYMMDD_HHMMSS/..."
                  #   - postgres/ + mysql/ + couchdb/ store flat FILES named
                  #     "<category>_YYYYMMDD_HHMMSS.tar.gz" (+ matching .sha256).
                  prune_nas_dir() {
                    # $1 = "pvc/20260206_215032" (dir path) — delete the dated dir AND its shell.
                    # rsync syncing empty INTO the dir only clears contents (empty husk leaks), so
                    # operate at the PARENT and scope --delete to the target subtree via the same
                    # include/exclude idiom as prune_nas_file. Verified: removes /<name> + shell,
                    # siblings protected by --exclude='*'.
                    local subpath="$1"
                    local parent="${subpath%/*}"   # e.g. pvc
                    local name="${subpath##*/}"    # e.g. 20260206_215032
                    echo "  pruning dir: $subpath"
                    RSYNC_PASSWORD="$NAS_RSYNC_PASSWORD" rsync --port=50555 -r --delete \
                      --include="/${name}/***" --exclude='*' \
                      /tmp/empty/ \
                      "rsync://${NAS_RSYNC_USER}@192.168.1.136/akhozya-pool1/backups/homelab/${parent}/" \
                      2>&1 | tail -3 || echo "  (delete refused — manual prune via NAS UI)"
                  }
                  prune_nas_file() {
                    # $1 = "postgres/postgres_20260206_215030.tar.gz"
                    local subpath="$1"
                    local parent="${subpath%/*}"
                    local fname="${subpath##*/}"
                    echo "  pruning file: $subpath"
                    # rsync filter rules: keep ONLY the target file (+ .sha256 sibling) in
                    # the sync scope; everything else excluded. Empty source + --delete then
                    # removes the included files from dest, leaving the rest alone.
                    RSYNC_PASSWORD="$NAS_RSYNC_PASSWORD" rsync --port=50555 -r --delete \
                      --include="/${fname}" --include="/${fname}.sha256" --exclude='*' \
                      /tmp/empty/ \
                      "rsync://${NAS_RSYNC_USER}@192.168.1.136/akhozya-pool1/backups/homelab/${parent}/" \
                      2>&1 | tail -3 || echo "  (delete refused — manual prune via NAS UI)"
                  }

                  # The listing MUST be able to fail here. An empty NAS_LIST reads as "nothing
                  # matched retention", so a silent listing failure no-ops the sweep for ever.
                  if ! NAS_LIST=$(nas_list); then
                    echo "FAIL: could not list the NAS for the retention sweep"
                    cat /tmp/nas-list.err 2>/dev/null || true
                    # A note, not NAS_STATUS — Step 5 rewrites NAS_STATUS unconditionally,
                    # which would erase the reason and leave Telegram showing a normal
                    # size for a run that failed.
                    NAS_NOTE="${NAS_NOTE} | retention sweep SKIPPED (listing failed)"
                    OVERALL_OK=false
                    NAS_LIST=""
                  fi

                  NOW_EPOCH=$(date +%s)
                  THRESH=$((30*86400))

                  # 30d retention — DIR layout (pvc only; immich handled separately keep-2)
                  echo "$NAS_LIST" | awk -v now=$NOW_EPOCH -v thr=$THRESH '
                    $1 ~ /^d/ && $5 ~ /^pvc\/[0-9]{8}(_[0-9]+)?$/ {
                      split($5, p, "/"); d = p[2]
                      y = substr(d,1,4); m = substr(d,5,2); dd = substr(d,7,2)
                      ts = mktime(y" "m" "dd" 00 00 00")
                      if (ts > 0 && (now - ts) > thr) print $5
                    }' | while IFS= read -r dir; do
                    [ -n "$dir" ] && prune_nas_dir "$dir"
                  done

                  # 30d retention — FILE layout (postgres/mysql/couchdb top-level *.tar.gz)
                  echo "$NAS_LIST" | awk -v now=$NOW_EPOCH -v thr=$THRESH '
                    $1 ~ /^-/ && $5 ~ /^(postgres|mysql|couchdb)\/[a-z]+_[0-9]{8}_[0-9]+\.tar\.gz$/ {
                      n = split($5, p, "/"); fname = p[n]
                      split(fname, q, "_")  # q[1]=category, q[2]=YYYYMMDD, q[3]=HHMMSS.tar.gz
                      d = q[2]
                      y = substr(d,1,4); m = substr(d,5,2); dd = substr(d,7,2)
                      ts = mktime(y" "m" "dd" 00 00 00")
                      if (ts > 0 && (now - ts) > thr) print $5
                    }' | while IFS= read -r f; do
                    [ -n "$f" ] && prune_nas_file "$f"
                  done

                  # Immich: keep only 2 newest
                  echo "$NAS_LIST" | awk '
                    $1 ~ /^d/ && $5 ~ /^immich\/[0-9]{8}(_[0-9]+)?$/ {print $5}
                  ' | sort -r | tail -n +3 | while IFS= read -r dir; do
                    [ -n "$dir" ] && prune_nas_dir "$dir"
                  done
                  echo "Retention sweep complete"

                  # Step 5: Check NAS storage usage (500GB hard limit)
                  echo ""
                  echo "=== Step 5: Checking NAS storage ==="
                  # Capture the listing and check ITS status before measuring. The script sets
                  # -e but not pipefail, so a pipeline ending in awk hides a failed rsync as 0GB
                  # — indistinguishable from a healthy empty NAS, and the 400/450GB tiers below
                  # can then never fire.
                  NAS_SIZE_LIST="/tmp/nas-size.txt"
                  if nas_list > "$NAS_SIZE_LIST"; then
                    NAS_SIZE_GB=$(awk '/^-/{gsub(",", "", $2); sum+=$2} END{printf "%d", sum/1073741824}' "$NAS_SIZE_LIST")
                    echo "NAS backup size: ~${NAS_SIZE_GB}GB / 500GB limit"
                  else
                    echo "FAIL: could not list the NAS to measure usage"
                    cat /tmp/nas-list.err 2>/dev/null || true
                    NAS_SIZE_GB=-1
                  fi

                  NAS_STATUS="NAS: ${NAS_SIZE_GB}GB / 500GB"
                  if [ "$NAS_SIZE_GB" -lt 0 ]; then
                    NAS_STATUS="NAS: size UNKNOWN (listing failed)"
                    OVERALL_OK=false
                  elif [ "$NAS_SIZE_GB" -gt 450 ]; then
                    echo "CRITICAL: NAS backup size ~${NAS_SIZE_GB}GB exceeds 450GB! Manual pruning required via NAS web UI."
                    NAS_STATUS="NAS: ${NAS_SIZE_GB}GB / 500GB CRITICAL"
                    OVERALL_OK=false
                  elif [ "$NAS_SIZE_GB" -gt 400 ]; then
                    echo "WARNING: NAS backup size ~${NAS_SIZE_GB}GB exceeds 400GB. Consider pruning old backups via NAS web UI."
                    NAS_STATUS="NAS: ${NAS_SIZE_GB}GB / 500GB WARNING"
                  fi
                  NAS_STATUS="${NAS_STATUS}${NAS_NOTE}"

                  # Step 6: Send Telegram report (only on failure)
                  echo ""
                  if [ "$OVERALL_OK" = true ]; then
                    echo "=== Step 6: All validations passed, skipping Telegram ==="
                  else
                    echo "=== Step 6: Sending Telegram failure report ==="
                    send_report
                    # Exit non-zero so the Job records a failure. Reporting alone left
                    # kube_job_* green, so every alert keyed on job status stayed silent.
                    trap - EXIT
                    exit 1
                  fi

                  trap - EXIT

                  echo ""
                  echo "=== Backup Replication Completed: $(date) ==="
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
                  add: ["DAC_OVERRIDE", "CHOWN", "FOWNER"]
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
              volumeMounts:
                - name: source-backups
                  mountPath: /source-backups
          volumes:
            - name: source-backups
              hostPath:
                path: /mnt/k8s-storage/backups
                type: Directory

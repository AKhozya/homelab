apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-replication
  namespace: backup-replication
spec:
  # 03:30 UTC, after the source backups finish between 03:00 and 03:16.
  schedule: "30 3 * * *"
  timeZone: "UTC"
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      # No retry. If a run fails after Step 4 has emptied the sources, a retry finds
      # nothing to validate and reports every backup as MISSING. If a run fails
      # before Step 4, the sources stay and the next night's run syncs them.
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: backup-replication
        spec:
          serviceAccountName: backup-replication
          automountServiceAccountToken: false
          restartPolicy: Never
          priorityClassName: homelab-batch
          # worker-node holds the source backups.
          nodeSelector:
            kubernetes.io/hostname: worker-node
          securityContext:
            # Run as root to install rsync and access backup files
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rsync
              image: alpine:3.24.2
              env:
                - name: NAS_RSYNC_USER
                  valueFrom:
                    secretKeyRef:
                      name: nas-rsync-credentials
                      key: rsync-user
                - name: NAS_RSYNC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nas-rsync-credentials
                      key: rsync-password
                - name: TELEGRAM_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: backup-telegram
                      key: bot_token
                - name: TELEGRAM_CHAT_ID
                  valueFrom:
                    secretKeyRef:
                      name: backup-telegram
                      key: chat_id
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  CURRENT_STEP="init"

                  # Send a rich Markdown message (Bot API 10.1 sendRichMessage); best-effort.
                  tg_rich() {
                    [ -n "$TELEGRAM_BOT_TOKEN" ] || return 0
                    command -v jq >/dev/null 2>&1 || return 0
                    command -v curl >/dev/null 2>&1 || return 0
                    jq -n --arg md "$1" --arg chat "$TELEGRAM_CHAT_ID" \
                      '{chat_id:$chat, rich_message:{markdown:$md, skip_entity_detection:true}}' \
                    | curl -s -X POST \
                        "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendRichMessage" \
                        -H 'content-type: application/json' --data-binary @- \
                        -o /dev/null 2>/dev/null || true
                  }

                  # Builds the validation table from REPORT_FILE, prints it and sends it to
                  # Telegram. Step 1's abort, each Step 3 failure and Step 6 call it.
                  send_report() {
                    MSG_FILE="/tmp/telegram-msg.txt"
                    printf '## ❌ Backup Validation FAILED (%s)\n\n| Backup | Status | Details |\n|---|---|---|\n' "$TODAY" > "$MSG_FILE"

                    while IFS='|' read -r status label details; do
                      if [ "$status" = "OK" ]; then
                        printf '| %s | ✅ | %s |\n' "$label" "$details" >> "$MSG_FILE"
                      else
                        printf '| %s | ❌ | %s |\n' "$label" "$details" >> "$MSG_FILE"
                      fi
                    done < "$REPORT_FILE"

                    printf '\n**%s**' "$NAS_STATUS" >> "$MSG_FILE"

                    cat "$MSG_FILE"
                    tg_rich "$(cat "$MSG_FILE")"
                  }

                  send_failure() {
                    MSG=$(printf '## ❌ Backup Replication FAILED\n\nFailed at step: `%s`\nDate: %s\n\nSource backups preserved (not cleaned).' "$CURRENT_STEP" "$(date +%Y-%m-%d)")
                    tg_rich "$MSG"
                  }
                  trap send_failure EXIT

                  echo "=== Backup Replication Started: $(date) ==="

                  CURRENT_STEP="Installing dependencies"
                  apk add --no-cache rsync curl jq

                  echo "=== Source Backups ==="
                  du -sh /source-backups/*/ 2>/dev/null || echo "No backups found"

                  # Step 1: Validate source backups BEFORE syncing — a corrupt/stale
                  # backup must not land on the NAS.
                  CURRENT_STEP="Step 1: Validating source backups"
                  echo ""
                  echo "=== Step 1: Validating source backups (before any sync) ==="
                  REPORT_FILE="/tmp/backup-report.txt"
                  : > "$REPORT_FILE"
                  # Artifacts that PASSED Step 1, as paths relative to /source-backups.
                  # Step 3 proves each one landed on the NAS before Step 4 deletes the source.
                  VALIDATED_LIST="/tmp/validated-artifacts.txt"
                  : > "$VALIDATED_LIST"
                  # Appended to NAS_STATUS at report time so a mid-run failure reason
                  # survives Step 5's unconditional rewrite of NAS_STATUS.
                  NAS_NOTE=""
                  # Counted in the shell, NOT re-derived from a file: the expectation must
                  # not share a failure mode with the list it audits, or two matched write
                  # failures cancel out and the check passes having proved nothing.
                  VALIDATED_EXPECTED=0
                  # Types that failed Step 1. Step 2 excludes them and Step 4 keeps their
                  # local files; the other types still sync.
                  FAILED_TYPES=""
                  OVERALL_OK=true
                  TODAY=$(date +%Y-%m-%d)

                  # True only for a 64-character lowercase hex digest. Without this, a failed
                  # sha256sum and an empty sidecar both yield "", and "" = "" reads as a match.
                  is_sha256() {
                    case "$1" in
                      "" | *[!0-9a-f]*) return 1 ;;
                    esac
                    [ "${#1}" -eq 64 ]
                  }

                  # Runs every check on one archive. Sets CHECKS and SIZE_HUMAN, and returns 1
                  # if any check failed. If $3 is "sha-required", a missing .sha256 fails too.
                  check_archive() {
                    local f="$1"
                    local min_size="$2"
                    local sha_rule="$3"
                    local failed=false
                    CHECKS=""

                    local size
                    size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
                    SIZE_HUMAN=$(du -h "$f" | cut -f1)

                    echo "  File: ${f#/source-backups/} ($SIZE_HUMAN)"

                    local file_epoch
                    file_epoch=$(stat -c%Y "$f" 2>/dev/null || stat -f%m "$f" 2>/dev/null)
                    local now_epoch
                    now_epoch=$(date +%s)
                    local age_hours=$(( (now_epoch - file_epoch) / 3600 ))

                    if [ "$age_hours" -gt 25 ]; then
                      echo "  FAIL: Age ${age_hours}h (>25h)"
                      CHECKS="age ${age_hours}h OLD"
                      failed=true
                    else
                      echo "  OK: Age ${age_hours}h"
                    fi

                    local sha_file="${f}.sha256"
                    if [ -f "$sha_file" ]; then
                      local expected
                      expected=$(awk '{print $1; exit}' "$sha_file" 2>/dev/null) || expected=""
                      local actual
                      actual=$(sha256sum "$f" 2>/dev/null) || actual=""
                      actual="${actual%% *}"
                      if ! is_sha256 "$expected"; then
                        echo "  FAIL: .sha256 file empty, unreadable or malformed"
                        CHECKS="${CHECKS:+$CHECKS, }SHA256 sidecar bad"
                        failed=true
                      elif ! is_sha256 "$actual"; then
                        echo "  FAIL: could not compute SHA256 of the archive"
                        CHECKS="${CHECKS:+$CHECKS, }SHA256 unreadable"
                        failed=true
                      elif [ "$expected" = "$actual" ]; then
                        echo "  OK: SHA256 matches"
                        CHECKS="${CHECKS:+$CHECKS, }SHA256 OK"
                      else
                        echo "  FAIL: SHA256 mismatch!"
                        CHECKS="${CHECKS:+$CHECKS, }SHA256 FAIL"
                        failed=true
                      fi
                    elif [ "$sha_rule" = sha-required ]; then
                      echo "  FAIL: No .sha256 file"
                      CHECKS="${CHECKS:+$CHECKS, }no checksum"
                      failed=true
                    else
                      echo "  SKIP: No .sha256 file"
                      CHECKS="${CHECKS:+$CHECKS, }no checksum"
                    fi

                    # pvc-backup writes the two audiobookshelf media PVCs as plain .tar.
                    local tar_list="-tzf"
                    case "$f" in
                      *.tar) tar_list="-tf" ;;
                    esac
                    if tar "$tar_list" "$f" >/dev/null 2>&1; then
                      echo "  OK: tar integrity"
                      CHECKS="${CHECKS:+$CHECKS, }tar OK"
                    else
                      echo "  FAIL: tar integrity check failed!"
                      CHECKS="${CHECKS:+$CHECKS, }tar FAIL"
                      failed=true
                    fi

                    if [ "$size" -lt "$min_size" ]; then
                      echo "  FAIL: Size ${SIZE_HUMAN} below minimum"
                      CHECKS="${CHECKS:+$CHECKS, }too small"
                      failed=true
                    else
                      echo "  OK: Size ${SIZE_HUMAN}"
                    fi

                    [ "$failed" = false ]
                  }

                  # Paths go into VALIDATED_LIST RELATIVE to /source-backups, because that
                  # is exactly how they appear in the recursive rsync listing of the NAS.
                  # Not "<type>/<basename>": pvc archives nest as
                  # pvc/<timestamp>/<namespace>/<file>, so a flattened name matches nothing
                  # and Step 3 would fail every run.
                  validate_backup() {
                    local type="$1"
                    local dir="/source-backups/$type"
                    local min_size="$2"
                    local label="$3"

                    echo "--- Checking $label ---"

                    local latest
                    latest=$(find "$dir" -name "*.tar.gz" -type f 2>/dev/null | sort -r | head -1)

                    if [ -z "$latest" ]; then
                      echo "FAIL: No .tar.gz found in $dir"
                      printf "FAIL|%s|MISSING - no backup found!\n" "$label" >> "$REPORT_FILE"
                      OVERALL_OK=false
                      return 1
                    fi

                    if check_archive "$latest" "$min_size" sha-optional; then
                      printf "OK|%s|%s, %s\n" "$label" "$SIZE_HUMAN" "$CHECKS" >> "$REPORT_FILE"
                      printf "%s\n" "${latest#/source-backups/}" >> "$VALIDATED_LIST"
                      VALIDATED_EXPECTED=$((VALIDATED_EXPECTED + 1))
                    else
                      printf "FAIL|%s|%s, %s\n" "$label" "$SIZE_HUMAN" "$CHECKS" >> "$REPORT_FILE"
                      OVERALL_OK=false
                      return 1
                    fi
                  }

                  # pvc-backup writes one archive per CRITICAL_PVCS entry into
                  # pvc/<timestamp>/<namespace>/, and writes the .sha256 only after tar
                  # succeeds. So every archive in the newest timestamp dir needs its
                  # .sha256, and the archive count must equal PVC_EXPECTED.
                  # PVC_EXPECTED must equal the number of CRITICAL_PVCS entries in
                  # infrastructure/configs/backup/pvc-backup-cronjob.yaml.
                  # A single size floor does not fit these archives: a near-empty PVC such
                  # as audiobookshelf-podcasts gives a 4 KB archive. tar -t and the
                  # .sha256 catch truncation instead.
                  PVC_EXPECTED=14
                  validate_pvc() {
                    local label="PVC"
                    local newest
                    local f
                    local count=0
                    local bad=""
                    local archives="/tmp/pvc-archives.txt"
                    local passed="/tmp/pvc-passed.txt"

                    echo "--- Checking $label ---"

                    newest=$(find /source-backups/pvc -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -r | head -1)
                    if [ -z "$newest" ]; then
                      echo "FAIL: No timestamp dir in /source-backups/pvc"
                      printf "FAIL|%s|MISSING - no backup found!\n" "$label" >> "$REPORT_FILE"
                      OVERALL_OK=false
                      return 1
                    fi

                    find "$newest" -type f | grep -E '\.tar(\.gz)?$' | sort > "$archives"
                    : > "$passed"
                    # A redirect, not a pipe, so count and bad survive the loop.
                    while IFS= read -r f; do
                      count=$((count + 1))
                      if check_archive "$f" 1 sha-required; then
                        printf "%s\n" "${f#/source-backups/}" >> "$passed"
                      else
                        bad="${bad}$(basename "$f"): $CHECKS; "
                      fi
                    done < "$archives"

                    if [ "$count" -ne "$PVC_EXPECTED" ]; then
                      echo "  FAIL: $count archives in ${newest#/source-backups/}, expected $PVC_EXPECTED"
                      bad="${bad}$count of $PVC_EXPECTED archives"
                    fi

                    if [ -n "$bad" ]; then
                      printf "FAIL|%s|%s\n" "$label" "${bad%; }" >> "$REPORT_FILE"
                      OVERALL_OK=false
                      return 1
                    fi

                    printf "OK|%s|%s archives, SHA256 OK, tar OK\n" "$label" "$count" >> "$REPORT_FILE"
                    cat "$passed" >> "$VALIDATED_LIST"
                    VALIDATED_EXPECTED=$((VALIDATED_EXPECTED + count))
                  }

                  # CouchDB floor is 20KB, not 100KB, since 2026-08-08. Its only database is
                  # Obsidian LiveSync's obsidian-personal. A client-side rebuild on 2026-08-06
                  # shrank the nightly dump from 15.8M to 88K, so the 100KB floor aborted the
                  # 08-07 and 08-08 runs at Step 1. A size floor cannot tell a truncated dump from
                  # a valid small one. The couchdb-backup job checks each database separately.
                  validate_backup "postgres" 1048576 "PostgreSQL" || FAILED_TYPES="$FAILED_TYPES postgres"
                  validate_backup "couchdb" 20480 "CouchDB" || FAILED_TYPES="$FAILED_TYPES couchdb"
                  validate_backup "mysql" 102400 "MySQL" || FAILED_TYPES="$FAILED_TYPES mysql"
                  validate_pvc || FAILED_TYPES="$FAILED_TYPES pvc"

                  # If every type failed, abort before the sync: source preserved for
                  # forensics, NAS history untouched. If only some failed, the run goes on
                  # without them and still ends in Step 6's failure report and exit 1.
                  if [ "$VALIDATED_EXPECTED" -eq 0 ]; then
                    NAS_STATUS="NAS: not checked (aborted before sync)"
                    send_report
                    trap - EXIT
                    echo "Validation failed — source preserved, nothing synced."
                    exit 1
                  fi
                  if [ -n "$FAILED_TYPES" ]; then
                    echo "Not syncing or cleaning (failed Step 1):$FAILED_TYPES"
                    NAS_NOTE="${NAS_NOTE} | not synced, source kept:$FAILED_TYPES"
                  fi
                  # One --exclude per failed type, anchored like the immich one below.
                  set --
                  for t in $FAILED_TYPES; do
                    set -- "$@" "--exclude=/$t/"
                  done

                  # The NAS is the sole replication sink. There is no second copy on a worker.

                  # Step 2: Sync to NAS (no --delete, NAS accumulates full history)
                  CURRENT_STEP="Step 2: Syncing to NAS"
                  echo ""
                  echo "=== Step 2: Syncing to NAS ==="
                  # No -z: backups are .tar.gz (already compressed) and transfers are
                  # LAN — compression just burns CPU on both ends for ~0 size gain (2026-06-28).
                  #
                  # immich/ is excluded: immich-backup pushes its own sets to the same NAS path
                  # (its POOL=…/backups/homelab/immich) from /mnt/extra-storage/immich-backup.
                  # /source-backups/immich/ holds only stale sets from before that move (129G
                  # on 2026-07-27). If the exclude is removed, Step 2 uploads the stale sets each
                  # night and Step 4b's keep-2 prunes them again, because the two newest are
                  # the ones immich-backup pushed. On 2026-07-27 those stale uploads showed
                  # `speedup is 1.00` in the log; the cause was this, not rsync tuning.
                  #
                  # The pattern is anchored (`/immich/`, not `immich/`): an unanchored rsync
                  # pattern matches at any depth, so it would also drop a future
                  # `pvc/<ts>/immich/…` archive. pvc-backup's CRITICAL_PVCS has no immich
                  # entry today, so that loss would go unnoticed.
                  RSYNC_PASSWORD="$NAS_RSYNC_PASSWORD" rsync -av \
                    --exclude='*.tmp' \
                    --exclude='.*.swp' \
                    --exclude='/immich/' \
                    "$@" \
                    --port=50555 \
                    /source-backups/ \
                    "rsync://${NAS_RSYNC_USER}@192.168.1.136/akhozya-pool1/backups/homelab/"

                  # Writes the NAS listing to stdout and returns rsync's own status. Do not test it through a pipe: the script
                  # sets -e but not pipefail, so the status would be the last stage's.
                  nas_list() {
                    RSYNC_PASSWORD="$NAS_RSYNC_PASSWORD" rsync --port=50555 -r --list-only \
                      "rsync://${NAS_RSYNC_USER}@192.168.1.136/akhozya-pool1/backups/homelab/" \
                      2>/tmp/nas-list.err
                  }

                  # Step 3: Verify NAS
                  CURRENT_STEP="Step 3: Verifying NAS"
                  echo ""
                  echo "=== Step 3: Verifying NAS ==="
                  # This check must be able to fail: Step 4 deletes the only other copy right
                  # after it. Do not pipe the listing into head; head exits 0 whatever rsync
                  # returns.
                  NAS_VERIFY_LIST="/tmp/nas-verify.txt"
                  if ! nas_list > "$NAS_VERIFY_LIST"; then
                    echo "FAIL: could not list the NAS after sync"
                    cat /tmp/nas-list.err 2>/dev/null || true
                    NAS_STATUS="NAS: listing FAILED after sync — source NOT cleaned"
                    OVERALL_OK=false
                    send_report
                    trap - EXIT
                    exit 1
                  fi

                  # Guard against verification passing with an incomplete artifact list. Each
                  # validate call sits in an || list, which turns off set -e inside it, so a
                  # failed append to VALIDATED_LIST leaves the list short with no error.
                  # VALIDATED_EXPECTED is counted in the shell, so a short or empty list fails
                  # here instead of letting the loop below prove nothing before Step 4's rm -rf.
                  VALIDATED_COUNT=$(wc -l < "$VALIDATED_LIST" | tr -d ' ')
                  if [ "$VALIDATED_COUNT" -eq 0 ] || [ "$VALIDATED_COUNT" -ne "$VALIDATED_EXPECTED" ]; then
                    echo "FAIL: validated-artifact list incomplete ($VALIDATED_COUNT of $VALIDATED_EXPECTED expected)"
                    NAS_STATUS="NAS: verification list incomplete — source NOT cleaned"
                    OVERALL_OK=false
                    send_report
                    trap - EXIT
                    exit 1
                  fi

                  MISSING=""
                  while IFS= read -r artifact; do
                    if [ -z "$artifact" ]; then continue; fi
                    # EXACT match on the listing's path field, not a substring: plain grep
                    # for "postgres/x.tar.gz" is also satisfied by the line for
                    # "postgres/x.tar.gz.sha256", so a missing payload could be vouched
                    # for by its surviving checksum sidecar.
                    if ! awk -v want="$artifact" '$NF == want { found = 1 } END { exit !found }' \
                      "$NAS_VERIFY_LIST"; then
                      MISSING="${MISSING}${artifact} "
                    fi
                  done < "$VALIDATED_LIST"

                  if [ -n "$MISSING" ]; then
                    echo "FAIL: Step-1-validated artifacts absent from the NAS: $MISSING"
                    NAS_STATUS="NAS: missing after sync ($MISSING) — source NOT cleaned"
                    OVERALL_OK=false
                    send_report
                    trap - EXIT
                    exit 1
                  fi
                  echo "OK: all $(wc -l < "$VALIDATED_LIST" | tr -d ' ') validated artifact(s) present on NAS"

                  # Step 4: Clean source on worker-node — reachable only once Step 1
                  # validated the artifacts AND Step 3 confirmed each one is on the NAS.
                  echo ""
                  echo "=== Step 4: Cleaning source backups ==="
                  for t in postgres couchdb mysql pvc; do
                    case " $FAILED_TYPES " in
                      *" $t "*) echo "Kept /source-backups/$t (failed Step 1)" ;;
                      *) rm -rf "/source-backups/$t/"* ;;
                    esac
                  done
                  echo "Source cleaned for the types now on the NAS"

                  # Step 4b: Enforce NAS retention — 30 days for daily backups, keep-2 for the
                  # weekly immich set. Pruning pushes an empty tree with --delete. A refused
                  # prune does not stop the sweep, and the offsite copy has already succeeded.
                  # It still fails the run, as a failed listing does: otherwise retention stops
                  # with no report while the NAS fills towards its 500GB limit.
                  CURRENT_STEP="Step 4b: Pruning NAS retention"
                  echo ""
                  echo "=== Step 4b: Pruning NAS retention (30d daily / keep-2 immich) ==="
                  mkdir -p /tmp/empty
                  # The helpers run inside `| while` subshells, so they record refusals in a
                  # file. If a helper changes a variable, the parent shell cannot see the change.
                  PRUNE_REFUSED="/tmp/prune-refused.txt"
                  : > "$PRUNE_REFUSED"

                  # Two prune helpers — NAS layout is mixed:
                  #   - pvc/ + immich/ store DIRS named "<category>/YYYYMMDD_HHMMSS/..."
                  #   - postgres/ + mysql/ + couchdb/ store flat FILES named
                  #     "<category>_YYYYMMDD_HHMMSS.tar.gz" (+ matching .sha256).
                  prune_nas_dir() {
                    # $1 = "pvc/20260206_215032" (dir path) — delete the dated dir AND its shell.
                    # rsync syncing empty INTO the dir only clears contents (empty husk leaks), so
                    # operate at the PARENT and scope --delete to the target subtree via the same
                    # include/exclude idiom as prune_nas_file. Verified: removes /<name> + shell,
                    # siblings protected by --exclude='*'.
                    local subpath="$1"
                    local parent="${subpath%/*}"   # e.g. pvc
                    local name="${subpath##*/}"    # e.g. 20260206_215032
                    echo "  pruning dir: $subpath"
                    local rc=0
                    RSYNC_PASSWORD="$NAS_RSYNC_PASSWORD" rsync --port=50555 -r --delete \
                      --include="/${name}/***" --exclude='*' \
                      /tmp/empty/ \
                      "rsync://${NAS_RSYNC_USER}@192.168.1.136/akhozya-pool1/backups/homelab/${parent}/" \
                      > /tmp/prune.log 2>&1 || rc=$?
                    tail -3 /tmp/prune.log
                    if [ "$rc" -ne 0 ]; then
                      echo "  (delete refused, rsync exit $rc — manual prune via NAS UI)"
                      printf "%s\n" "$subpath" >> "$PRUNE_REFUSED"
                    fi
                  }
                  prune_nas_file() {
                    # $1 = "postgres/postgres_20260206_215030.tar.gz"
                    local subpath="$1"
                    local parent="${subpath%/*}"
                    local fname="${subpath##*/}"
                    echo "  pruning file: $subpath"
                    # rsync filter rules: keep ONLY the target file (+ .sha256 sibling) in
                    # the sync scope; everything else excluded. Empty source + --delete then
                    # removes the included files from dest, leaving the rest alone.
                    local rc=0
                    RSYNC_PASSWORD="$NAS_RSYNC_PASSWORD" rsync --port=50555 -r --delete \
                      --include="/${fname}" --include="/${fname}.sha256" --exclude='*' \
                      /tmp/empty/ \
                      "rsync://${NAS_RSYNC_USER}@192.168.1.136/akhozya-pool1/backups/homelab/${parent}/" \
                      > /tmp/prune.log 2>&1 || rc=$?
                    tail -3 /tmp/prune.log
                    if [ "$rc" -ne 0 ]; then
                      echo "  (delete refused, rsync exit $rc — manual prune via NAS UI)"
                      printf "%s\n" "$subpath" >> "$PRUNE_REFUSED"
                    fi
                  }

                  # The listing MUST be able to fail here. An empty NAS_LIST reads as "nothing
                  # matched retention", so a silent listing failure no-ops the sweep for ever.
                  if ! NAS_LIST=$(nas_list); then
                    echo "FAIL: could not list the NAS for the retention sweep"
                    cat /tmp/nas-list.err 2>/dev/null || true
                    # A note, not NAS_STATUS: Step 5 rewrites NAS_STATUS (see NAS_NOTE above).
                    NAS_NOTE="${NAS_NOTE} | retention sweep SKIPPED (listing failed)"
                    OVERALL_OK=false
                    NAS_LIST=""
                  fi

                  NOW_EPOCH=$(date +%s)
                  THRESH=$((30*86400))

                  # 30d retention — DIR layout (pvc only; immich handled separately keep-2)
                  echo "$NAS_LIST" | awk -v now=$NOW_EPOCH -v thr=$THRESH '
                    $1 ~ /^d/ && $5 ~ /^pvc\/[0-9]{8}(_[0-9]+)?$/ {
                      split($5, p, "/"); d = p[2]
                      y = substr(d,1,4); m = substr(d,5,2); dd = substr(d,7,2)
                      ts = mktime(y" "m" "dd" 00 00 00")
                      if (ts > 0 && (now - ts) > thr) print $5
                    }' | while IFS= read -r dir; do
                    [ -n "$dir" ] && prune_nas_dir "$dir"
                  done

                  # 30d retention — FILE layout (postgres/mysql/couchdb top-level *.tar.gz)
                  echo "$NAS_LIST" | awk -v now=$NOW_EPOCH -v thr=$THRESH '
                    $1 ~ /^-/ && $5 ~ /^(postgres|mysql|couchdb)\/[a-z]+_[0-9]{8}_[0-9]+\.tar\.gz$/ {
                      n = split($5, p, "/"); fname = p[n]
                      split(fname, q, "_")  # q[1]=category, q[2]=YYYYMMDD, q[3]=HHMMSS.tar.gz
                      d = q[2]
                      y = substr(d,1,4); m = substr(d,5,2); dd = substr(d,7,2)
                      ts = mktime(y" "m" "dd" 00 00 00")
                      if (ts > 0 && (now - ts) > thr) print $5
                    }' | while IFS= read -r f; do
                    [ -n "$f" ] && prune_nas_file "$f"
                  done

                  # Immich: keep only 2 newest. Coupling: this sweep must not run while
                  # immich-backup (Sunday 03:00, same namespace) still pushes a set, or a
                  # half-pushed set counts as one of the two. Only the namespace
                  # ResourceQuota prevents that: limits.cpu is 2 and immich-backup's pod
                  # takes all 2, so this Job's pod cannot start until that pod ends. If
                  # either limit changes, re-check this.
                  echo "$NAS_LIST" | awk '
                    $1 ~ /^d/ && $5 ~ /^immich\/[0-9]{8}(_[0-9]+)?$/ {print $5}
                  ' | sort -r | tail -n +3 | while IFS= read -r dir; do
                    [ -n "$dir" ] && prune_nas_dir "$dir"
                  done
                  echo "Retention sweep complete"
                  # The test is on the file, not on a count, so a failed count cannot hide
                  # a refusal.
                  if [ -s "$PRUNE_REFUSED" ]; then
                    REFUSED_COUNT=$(grep -c . "$PRUNE_REFUSED") || REFUSED_COUNT="some"
                    NAS_NOTE="${NAS_NOTE} | ${REFUSED_COUNT} NAS prune(s) refused"
                    OVERALL_OK=false
                  fi

                  # Step 5: Check NAS storage usage (500GB hard limit)
                  echo ""
                  echo "=== Step 5: Checking NAS storage ==="
                  # Capture the listing and check ITS status before measuring. The script sets
                  # -e but not pipefail, so a pipeline ending in awk hides a failed rsync as 0GB
                  # — indistinguishable from a healthy empty NAS, and the 400/450GB tiers below
                  # can then never fire.
                  NAS_SIZE_LIST="/tmp/nas-size.txt"
                  if nas_list > "$NAS_SIZE_LIST"; then
                    NAS_SIZE_GB=$(awk '/^-/{gsub(",", "", $2); sum+=$2} END{printf "%d", sum/1073741824}' "$NAS_SIZE_LIST")
                    echo "NAS backup size: ~${NAS_SIZE_GB}GB / 500GB limit"
                  else
                    echo "FAIL: could not list the NAS to measure usage"
                    cat /tmp/nas-list.err 2>/dev/null || true
                    NAS_SIZE_GB=-1
                  fi

                  NAS_STATUS="NAS: ${NAS_SIZE_GB}GB / 500GB"
                  if [ "$NAS_SIZE_GB" -lt 0 ]; then
                    NAS_STATUS="NAS: size UNKNOWN (listing failed)"
                    OVERALL_OK=false
                  elif [ "$NAS_SIZE_GB" -gt 450 ]; then
                    echo "CRITICAL: NAS backup size ~${NAS_SIZE_GB}GB exceeds 450GB! Manual pruning required via NAS web UI."
                    NAS_STATUS="NAS: ${NAS_SIZE_GB}GB / 500GB CRITICAL"
                    OVERALL_OK=false
                  elif [ "$NAS_SIZE_GB" -gt 400 ]; then
                    echo "WARNING: NAS backup size ~${NAS_SIZE_GB}GB exceeds 400GB. Consider pruning old backups via NAS web UI."
                    NAS_STATUS="NAS: ${NAS_SIZE_GB}GB / 500GB WARNING"
                  fi
                  NAS_STATUS="${NAS_STATUS}${NAS_NOTE}"

                  # Step 6: Send Telegram report (only on failure)
                  echo ""
                  if [ "$OVERALL_OK" = true ]; then
                    echo "=== Step 6: All validations passed, skipping Telegram ==="
                  else
                    echo "=== Step 6: Sending Telegram failure report ==="
                    send_report
                    # Exit non-zero so the Job records a failure. Reporting alone left
                    # kube_job_* green, so every alert keyed on job status stayed silent.
                    trap - EXIT
                    exit 1
                  fi

                  trap - EXIT

                  echo ""
                  echo "=== Backup Replication Completed: $(date) ==="
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
                  add: ["DAC_OVERRIDE", "CHOWN", "FOWNER"]
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
              volumeMounts:
                - name: source-backups
                  mountPath: /source-backups
          volumes:
            - name: source-backups
              hostPath:
                path: /mnt/k8s-storage/backups
                type: Directory

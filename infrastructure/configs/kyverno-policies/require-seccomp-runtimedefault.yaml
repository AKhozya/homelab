apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-seccomp-runtimedefault
  annotations:
    policies.kyverno.io/title: Require Seccomp RuntimeDefault Profile
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Seccomp (Secure Computing Mode) restricts the syscalls that a process can make.
      The RuntimeDefault profile provides a good balance of security and compatibility.
      This policy requires all pods to use the RuntimeDefault seccomp profile.
spec:
  background: true
  rules:
    - name: require-seccomp-runtimedefault
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - kyverno
      validate:
        # Enforce (promoted from Audit 2026-07-03; soak clean: 199 pass / 0 fail, 0 live violators). Operator/chart pods lacking seccompProfile remediated during soak; operator ns excluded above.
        failureAction: Enforce
        message: "Pods must set securityContext.seccompProfile.type to RuntimeDefault"
        anyPattern:
          - spec:
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
          - spec:
              =(initContainers):
                - securityContext:
                    seccompProfile:
                      type: RuntimeDefault
              containers:
                - securityContext:
                    seccompProfile:
                      type: RuntimeDefault

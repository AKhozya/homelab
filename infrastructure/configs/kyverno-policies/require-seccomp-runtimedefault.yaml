apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-seccomp-runtimedefault
  annotations:
    policies.kyverno.io/title: Require Seccomp RuntimeDefault Profile
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Seccomp (Secure Computing Mode) restricts the syscalls that a process can make.
      The RuntimeDefault profile provides a good balance of security and compatibility.
      This policy requires all pods to use the RuntimeDefault seccomp profile.
spec:
  # Audit (not Enforce): the prior =() soft anchors made this pass every pod, so it was
  # toothless-Enforce. With the hard anchors below it would correctly fail ~22 operator/chart
  # pods (databases, loki/alloy, node-exporter, percona/redis operators) that lack a
  # seccompProfile. Promote to Enforce only after those are remediated (per-workload chart
  # values / pod-spec patches), following the Audit -> fix-forward -> Enforce workflow.
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-seccomp-runtimedefault
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - kyverno
      validate:
        message: "Pods must set securityContext.seccompProfile.type to RuntimeDefault"
        anyPattern:
          - spec:
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
          - spec:
              =(initContainers):
                - securityContext:
                    seccompProfile:
                      type: RuntimeDefault
              containers:
                - securityContext:
                    seccompProfile:
                      type: RuntimeDefault

# Canary ValidatingPolicy — Deny from day one, matches ONLY pods labeled
# vp-canary-test=fail. Zero blast radius (no real workload carries the label).
# Purpose: Phase-3 Gate A proves the live VP Deny path end-to-end (webhook wiring,
# admission, CEL evaluation) with no ClusterPolicy masking possible:
#   kubectl run vp-canary --dry-run=server --image=busybox:1.37.0 \
#     --labels=vp-canary-test=fail  →  MUST be rejected with THIS message.
# Deleted in Phase 4 after the CP fleet is gone.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: vp-canary
  annotations:
    policies.kyverno.io/title: VP Deny-Path Canary
    policies.kyverno.io/category: Migration Tooling
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Proves the ValidatingPolicy (CEL) Deny path is live during the ClusterPolicy
      to ValidatingPolicy migration. Matches only explicitly labeled test pods.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: only-canary-labeled-pods
      expression: >-
        object.metadata.?labels[?'vp-canary-test'].orValue('') == 'fail'
  validations:
    - expression: "false"
      message: "vp-canary: ValidatingPolicy Deny path is live (intentional rejection of vp-canary-test=fail pod)"
  validationActions: [Deny]

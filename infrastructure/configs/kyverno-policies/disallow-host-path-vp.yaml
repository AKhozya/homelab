# CEL ValidatingPolicy — sole policy engine since 2026-07-12 (migrated from the disallow-host-path ClusterPolicy).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-path
  annotations:
    policies.kyverno.io/title: Disallow hostPath Volumes
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod,Volume
    policies.kyverno.io/description: >-
      HostPath volumes allow pods to access the host filesystem, which can be a security
      risk. This policy disallows hostPath volumes except for the named workloads that
      need them and the system namespaces.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: exclude-system-namespaces
      expression: >-
        !(request.namespace in ['kube-system', 'kube-public', 'kube-node-lease',
        'flux-system', 'kyverno'])
    # Replaces whole-namespace excludes for monitoring, loki, databases, immich and
    # backup-replication. All five enforce PSS `privileged` because their hostPath
    # workloads require it, so Pod Security Admission does not guard them either —
    # between the two, every pod in those namespaces could mount any host path.
    # Verified 2026-07-26 by server dry-run: an innocent pod plus an injected hostPath
    # was admitted in all five, and denied in home-assistant, which is also `privileged`
    # but was never excluded here.
    #
    # `couchdb` was in the old namespace list; that namespace no longer exists. CouchDB
    # runs in `databases`.
    #
    # These are POD labels. Autogen rewrites `object.metadata` to the pod-template path in
    # its controller clones (`object.spec.template.metadata.labels`, and
    # `object.spec.jobTemplate.spec.template.metadata.labels` for CronJobs) — matchConditions
    # included, not just validations — so one pod-level expression covers every kind.
    # `request.namespace` is never rewritten, which is why the namespace test above is safe.
    # Confirmed against the live `status.autogen` after this policy shipped.
    #
    # `couchrestore` is the one-shot DR Job in .backup/README.md. It is not running, so a
    # live pod scan does not reveal it; omitting it would break the restore path at the
    # moment it is needed.
    #
    # A pod label is spoofable by anyone who can create pods in these namespaces. This
    # narrows the blast radius from five whole namespaces to nine workload identities; it
    # does not seal it.
    - name: exclude-hostpath-workloads
      expression: >-
        !(has(object.metadata.labels) && (
        (request.namespace == 'monitoring' &&
        object.metadata.labels[?'app.kubernetes.io/name'].orValue('') == 'prometheus-node-exporter') ||
        (request.namespace == 'loki' &&
        object.metadata.labels[?'app.kubernetes.io/name'].orValue('') == 'alloy') ||
        (request.namespace == 'immich' &&
        object.metadata.labels[?'app.kubernetes.io/name'].orValue('') == 'server' &&
        object.metadata.labels[?'app.kubernetes.io/instance'].orValue('') == 'immich') ||
        (request.namespace == 'databases' &&
        object.metadata.labels[?'app'].orValue('') in
        ['couchdb-backup', 'mysql-backup', 'postgres-backup', 'couchrestore']) ||
        (request.namespace == 'backup-replication' &&
        object.metadata.labels[?'app'].orValue('') in
        ['backup-replication', 'immich-backup'])
        ))
  validations:
    # X(hostPath) parity: volumes list optional; any present volume must not be hostPath.
    - expression: >-
        object.spec.?volumes.orValue([]).all(v, !has(v.hostPath))
      message: "hostPath volumes are not allowed"
  validationActions: [Deny]

# CEL ValidatingPolicy — sole policy engine since 2026-07-12 (migrated from the disallow-host-path ClusterPolicy).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-path
  annotations:
    policies.kyverno.io/title: Disallow hostPath Volumes
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod,Volume
    policies.kyverno.io/description: >-
      HostPath volumes allow pods to access the host filesystem, which can be a security
      risk. This policy disallows hostPath volumes except in system namespaces.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    # immich: GPU hardware transcoding requires /dev/dri hostPath.
    # backup-replication: needs access to host backup directory.
    - name: exclude-namespaces
      expression: >-
        !(request.namespace in ['kube-system', 'kube-public', 'kube-node-lease',
        'flux-system', 'kyverno', 'monitoring', 'loki', 'databases', 'couchdb',
        'immich', 'backup-replication'])
  validations:
    # X(hostPath) parity: volumes list optional; any present volume must not be hostPath.
    - expression: >-
        object.spec.?volumes.orValue([]).all(v, !has(v.hostPath))
      message: "hostPath volumes are not allowed"
  validationActions: [Deny]

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require Common Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Labels are essential for organization, filtering, and tooling integration.
      This policy requires all pods to have common labels for better resource management.
spec:
  # Audit (was Enforce): the pattern below was hard-anchored (UR2 P3-3) — the old =() soft anchors
  # passed pods missing labels entirely. Audit-first surfaces real violators before re-Enforce (soak → ~2026-07).
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-app-label
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - kyverno
      validate:
        message: "The 'app' or 'app.kubernetes.io/name' label is required"
        anyPattern:
          - metadata:
              labels:
                app: "?*"
          - metadata:
              labels:
                app.kubernetes.io/name: "?*"

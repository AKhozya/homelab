apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-networkpolicy
  annotations:
    policies.kyverno.io/title: Require NetworkPolicy Per Namespace
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Namespace, NetworkPolicy
    policies.kyverno.io/description: >-
      Every namespace running workloads must declare at least one NetworkPolicy.
      Homelab invariant: every ingress = NetworkPolicy (container port, not service port).
      This policy backstops the manual NetworkPolicy curation (64 NP resources as of 2026-06).
spec:
  validationFailureAction: Enforce  # promoted Audit->Enforce 2026-05-25 after clean scan; 160 pass / 0 fail
  background: true
  rules:
    - name: require-netpol-present
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - default
      context:
        - name: netpolcount
          apiCall:
            urlPath: "/apis/networking.k8s.io/v1/namespaces/{{ request.namespace }}/networkpolicies"
            jmesPath: "items | length(@)"
      validate:
        message: "Namespace {{ request.namespace }} must declare at least one NetworkPolicy (homelab invariant: every ingress = NetworkPolicy)"
        deny:
          conditions:
            all:
              - key: "{{ netpolcount }}"
                operator: LessThan
                value: 1

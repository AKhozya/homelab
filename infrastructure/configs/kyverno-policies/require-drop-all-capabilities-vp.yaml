apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-drop-all-capabilities
  annotations:
    policies.kyverno.io/title: Require Drop All Capabilities
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers should drop all Linux capabilities and only add back
      specific ones if needed. This reduces the attack surface.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    # disallow-privilege-escalation's exclude set plus percona-mysql: ps-operator does not
    # drop ALL capabilities. That file gives the reason for databases.
    - name: exclude-namespaces
      expression: >-
        !(request.namespace in ['kube-system', 'kube-public', 'kube-node-lease',
        'flux-system', 'kyverno', 'databases', 'percona-mysql'])
    - name: exclude-loki-alloy
      expression: >-
        !(request.namespace == 'loki' &&
        object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') == 'alloy')
    - name: exclude-monitoring-node-exporter
      expression: >-
        !(request.namespace == 'monitoring' &&
        object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') == 'prometheus-node-exporter')
  validations:
    # Every entry in containers must drop ALL; initContainers and ephemeralContainers are
    # checked only if present. A missing capabilities.drop list fails.
    # The ephemeralContainers clause only reports, in PolicyReports. kubectl debug adds a
    # container through the pods/ephemeralcontainers subresource, which this pods-only
    # matchConstraints never receives. Adding that subresource would deny kubectl debug
    # during an incident.
    - expression: >-
        object.spec.containers.all(c,
        c.?securityContext.?capabilities.?drop.orValue([]).exists(x, x == 'ALL')) &&
        object.spec.?initContainers.orValue([]).all(c,
        c.?securityContext.?capabilities.?drop.orValue([]).exists(x, x == 'ALL')) &&
        object.spec.?ephemeralContainers.orValue([]).all(c,
        c.?securityContext.?capabilities.?drop.orValue([]).exists(x, x == 'ALL'))
      message: "Every container must drop all capabilities (capabilities.drop: [ALL])"
  validationActions: [Deny]

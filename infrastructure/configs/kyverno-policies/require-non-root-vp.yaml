# CEL ValidatingPolicy — sole policy engine since 2026-07-12 (migrated from the require-non-root ClusterPolicy).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-non-root
  annotations:
    policies.kyverno.io/title: Require Non-Root Containers
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers should not run as root (UID 0). This reduces the impact of container
      compromise by limiting the privileges available inside the container.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    # The per-namespace reasons are in the git history of the deleted ClusterPolicy
    # require-non-root.yaml (2026-07-12).
    - name: exclude-namespaces
      expression: >-
        !(request.namespace in ['kube-system', 'kube-public', 'kube-node-lease',
        'flux-system', 'kyverno', 'databases', 'mealie', 'home-assistant',
        'pricebuddy', 'stirling-pdf', 'loki', 'backup-replication', 'paperless-ngx'])
  validations:
    # If neither pod-level setting passes, every container and init container must pass the
    # same container-level branch: a pod where one container sets runAsNonRoot and another
    # sets runAsUser fails. A container with no securityContext fails both container-level
    # branches. If initContainers are absent, their checks pass.
    - expression: >-
        object.spec.?securityContext.?runAsNonRoot.orValue(false) == true ||
        object.spec.?securityContext.?runAsUser.orValue(0) > 0 ||
        (object.spec.containers.all(c,
        c.?securityContext.?runAsNonRoot.orValue(false) == true) &&
        object.spec.?initContainers.orValue([]).all(c,
        c.?securityContext.?runAsNonRoot.orValue(false) == true)) ||
        (object.spec.containers.all(c,
        c.?securityContext.?runAsUser.orValue(0) > 0) &&
        object.spec.?initContainers.orValue([]).all(c,
        c.?securityContext.?runAsUser.orValue(0) > 0))
      message: "Containers must not run as root (set runAsNonRoot: true or runAsUser > 0 at pod or container level)"
  validationActions: [Deny]

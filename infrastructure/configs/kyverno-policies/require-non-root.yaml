apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
  annotations:
    policies.kyverno.io/title: Require Non-Root Containers
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers should not run as root (UID 0). This reduces the impact of container
      compromise by limiting the privileges available inside the container.
spec:
  background: true
  rules:
    - name: require-non-root-user
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - kyverno
                - databases
          # Exclude specific apps that require root
          - resources:
              namespaces:
                - mealie
                - home-assistant
                - pricebuddy           # apprise sidecar requires root for config
                - stirling-pdf         # PDF processing with user switching capabilities
                - loki                 # alloy requires root to read host logs
                - backup-replication   # rsync needs root to access backup files
                - paperless-ngx        # s6-overlay /run permission init — restored 2026-05 (see HOMELAB_HISTORY)
      validate:
        # Enforce (promoted from Audit 2026-07-03; soak clean, 113 pass / 0 fail). securityContext hard-anchored (UR2 P3-4) — old =() passed containers lacking securityContext.
        failureAction: Enforce
        message: "Containers must not run as root (set runAsNonRoot: true or runAsUser > 0 at pod or container level)"
        anyPattern:
          # Pod-level securityContext covers every container
          - spec:
              securityContext:
                runAsNonRoot: true
          - spec:
              securityContext:
                runAsUser: ">0"
          # OR every container (and initContainer, if any) sets it explicitly. =(initContainers)
          # stays conditional (absence benign); the inner securityContext is now HARD-anchored so a
          # container without one fails — the old =(securityContext) let such containers pass.
          - spec:
              =(initContainers):
                - securityContext:
                    runAsNonRoot: true
              containers:
                - securityContext:
                    runAsNonRoot: true
          - spec:
              =(initContainers):
                - securityContext:
                    runAsUser: ">0"
              containers:
                - securityContext:
                    runAsUser: ">0"

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # All 12 policies Enforce. require-labels/-non-root/-seccomp promoted from Audit 2026-07-03
  # (clean soak); action moved to per-rule validate.failureAction (top-level validationFailureAction
  # deprecated since Kyverno 1.13).
  - require-labels.yaml
  - disallow-host-namespaces.yaml
  - require-resource-limits.yaml
  - require-non-root.yaml
  - disallow-host-path.yaml
  - disallow-latest-tag.yaml
  - require-non-default-serviceaccount.yaml
  - require-seccomp-runtimedefault.yaml
  - disallow-privilege-escalation.yaml   # mandatory pattern (no =() soft-anchor)
  - require-drop-all-capabilities.yaml    # mandatory pattern (no =() soft-anchor)
  - require-networkpolicy.yaml            # NP presence per namespace
  - require-readonly-rootfs.yaml          # readOnlyRootFilesystem
  # --- CEL ValidatingPolicy twins (Audit soak — kyverno.io/v1 removal migration Phase 1,
  # 2026-07-04). Same names as their CPs; PolicyReport `source` separates engines.
  # Deny flip + CP deletion = Phase 3 after ≥1-week parity soak.
  - require-labels-vp.yaml
  - disallow-host-namespaces-vp.yaml
  - require-resource-limits-vp.yaml
  - require-non-root-vp.yaml
  - disallow-host-path-vp.yaml
  - disallow-latest-tag-vp.yaml
  - require-non-default-serviceaccount-vp.yaml
  - require-seccomp-runtimedefault-vp.yaml
  - disallow-privilege-escalation-vp.yaml
  - require-drop-all-capabilities-vp.yaml
  - require-networkpolicy-vp.yaml
  - require-readonly-rootfs-vp.yaml
  - vp-canary.yaml                        # Deny-path live proof; deleted in Phase 4

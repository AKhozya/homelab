apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Write ValidatingPolicy (policies.kyverno.io/v1), not ClusterPolicy: Kyverno 1.20 removes
  # the ClusterPolicy kind.
  - require-labels-vp.yaml
  - disallow-host-namespaces-vp.yaml
  - require-resource-limits-vp.yaml
  - require-non-root-vp.yaml
  - disallow-host-path-vp.yaml
  - disallow-latest-tag-vp.yaml
  - require-non-default-serviceaccount-vp.yaml
  - require-seccomp-runtimedefault-vp.yaml
  - disallow-privilege-escalation-vp.yaml
  - require-drop-all-capabilities-vp.yaml
  - require-networkpolicy-vp.yaml
  - require-readonly-rootfs-vp.yaml

# CEL ValidatingPolicy — sole policy engine since 2026-07-12 (migrated from the require-non-default-serviceaccount ClusterPolicy).
# Matches controllers DIRECTLY (no pods, no autogen) — mirrors the CP.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-non-default-serviceaccount
  annotations:
    policies.kyverno.io/title: Require Non-Default Service Account
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The default service account has unnecessary cluster-wide permissions.
      This policy requires pods to use a non-default service account following
      the principle of least privilege.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
  # Explicit OFF (matchConstraints is non-pods so CanAutoGen would refuse anyway —
  # this documents intent).
  autogen:
    podControllers:
      controllers: []
  matchConditions:
    - name: exclude-system-namespaces
      expression: >-
        !(request.namespace in ['kube-system', 'kube-public', 'kube-node-lease',
        'flux-system', 'kyverno'])
  validations:
    # '' included: empty serviceAccountName resolves to the default SA at the API level
    # (JMESPath `|| 'default'` in the CP treated '' as falsy — same outcome).
    - expression: >-
        !(object.spec.template.spec.?serviceAccountName.orValue('') in ['', 'default'])
      message: >-
        Pods must use a non-default service account. Create a dedicated service
        account for your application.
  validationActions: [Deny]

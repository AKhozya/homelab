# CEL twin of the require-labels ClusterPolicy — Audit soak (Phase 1).
# autogen rewrites object.metadata to the pod TEMPLATE metadata in controller clones —
# exactly the desired check (controller template must carry the app label).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require Common Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Labels are essential for organization, filtering, and tooling integration.
      This policy requires all pods to have common labels for better resource management.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: exclude-system-namespaces
      expression: >-
        !(request.namespace in ['kube-system', 'kube-public', 'kube-node-lease',
        'flux-system', 'kyverno'])
  validations:
    # Hard-anchor parity (UR2 P3-3): label must exist AND be non-empty.
    - expression: >-
        object.metadata.?labels[?'app'].orValue('') != '' ||
        object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') != ''
      message: "The 'app' or 'app.kubernetes.io/name' label is required"
  validationActions: [Deny]

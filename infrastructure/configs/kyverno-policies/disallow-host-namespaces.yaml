apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-namespaces
  annotations:
    policies.kyverno.io/title: Disallow Host Namespaces
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Host namespaces (hostNetwork, hostPID, hostIPC) allow pods to access
      host resources and bypass Pod isolation. This policy blocks the use of
      host namespaces to prevent container escape.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: host-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - kyverno
          # node-exporter (DaemonSet) needs hostNetwork+hostPID for node metrics — Helm-managed; keep rest of monitoring ns covered.
          # databases ns dropped entirely: zero host-namespace pods there (verified 2026-05-25).
          - resources:
              namespaces:
                - monitoring
              selector:
                matchLabels:
                  app.kubernetes.io/name: prometheus-node-exporter
      validate:
        message: "Using host namespaces (hostNetwork, hostPID, hostIPC) is disallowed"
        pattern:
          spec:
            =(hostNetwork): false
            =(hostPID): false
            =(hostIPC): false

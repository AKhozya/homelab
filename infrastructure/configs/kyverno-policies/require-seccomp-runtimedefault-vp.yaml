# CEL twin of the require-seccomp-runtimedefault ClusterPolicy — Audit soak (Phase 1).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-seccomp-runtimedefault
  annotations:
    policies.kyverno.io/title: Require Seccomp RuntimeDefault Profile
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Seccomp (Secure Computing Mode) restricts the syscalls that a process can make.
      The RuntimeDefault profile provides a good balance of security and compatibility.
      This policy requires all pods to use the RuntimeDefault seccomp profile.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: exclude-system-namespaces
      expression: >-
        !(request.namespace in ['kube-system', 'kube-public', 'kube-node-lease',
        'flux-system', 'kyverno'])
  validations:
    # anyPattern parity: pod-level seccompProfile covers all, OR every container sets it
    # (initContainers soft at list level — if present, each must set it). No ephemeral in CP.
    - expression: >-
        object.spec.?securityContext.?seccompProfile.?type.orValue('') == 'RuntimeDefault' ||
        (object.spec.containers.all(c,
        c.?securityContext.?seccompProfile.?type.orValue('') == 'RuntimeDefault') &&
        object.spec.?initContainers.orValue([]).all(c,
        c.?securityContext.?seccompProfile.?type.orValue('') == 'RuntimeDefault'))
      message: "Pods must set securityContext.seccompProfile.type to RuntimeDefault"
  validationActions: [Deny]

# Sole enforcement since Phase 3 (2026-07-12) — CP twin deleted.
# Carries BOTH 2026-07-03 namespace-teardown wedge fixes: CREATE/UPDATE-only ops +
# deletionTimestamp skip (a "require NP present" deny during teardown deadlocks the
# namespace in Terminating — csp-reporter incident).
# Direct controller match, autogen OFF (2026-07-12, Codex catch): autogen clones rewrite
# object.metadata to pod-TEMPLATE metadata (live-verified: skip-terminating became
# object.spec.template.metadata.deletionTimestamp — vacuously true, never skips), so a
# terminating controller's finalizer UPDATE lost the CP's request.object protection.
# Matching controllers in the BASE policy means no rewrite: object.metadata is always the
# admission object's own metadata, so the skip works for every kind.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-networkpolicy
  annotations:
    policies.kyverno.io/title: Require NetworkPolicy Per Namespace
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Namespace, NetworkPolicy
    policies.kyverno.io/description: >-
      Every namespace running workloads must declare at least one NetworkPolicy.
      Homelab invariant: every ingress = NetworkPolicy (container port, not service port).
      This policy backstops the manual NetworkPolicy curation (64 NP resources as of 2026-06).
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "replicationcontrollers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  # Same kind set the old autogen covered ("defaults" + cronjobs), now matched directly.
  autogen:
    podControllers:
      controllers: []
  matchConditions:
    - name: exclude-namespaces
      expression: >-
        !(request.namespace in ['kube-system', 'kube-public', 'kube-node-lease', 'default'])
    - name: skip-terminating
      expression: "!has(object.metadata.deletionTimestamp)"
  variables:
    - name: npcount
      # request.namespace (not object.metadata.namespace) — populated in background
      # report mode too (live-verified via matchCondition skip rows) and mirrors the
      # CP-era {{ request.namespace }} apiCall.
      expression: >-
        resource.List("networking.k8s.io/v1", "networkpolicies",
        request.namespace).items.size()
  validations:
    - expression: "variables.npcount >= 1"
      message: >-
        Namespace must declare at least one NetworkPolicy
        (homelab invariant: every ingress = NetworkPolicy)
  auditAnnotations:
    - key: netpol-count
      valueExpression: "string(variables.npcount)"
  validationActions: [Deny]

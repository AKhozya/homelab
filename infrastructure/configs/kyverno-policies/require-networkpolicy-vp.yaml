# Two guards against a namespace teardown deadlock (2026-07-03): the policy matches CREATE
# and UPDATE only, and it skips objects with a deletionTimestamp. A "require NetworkPolicy"
# deny during teardown leaves the namespace stuck in Terminating.
# Autogen is off and the policy matches controllers directly (2026-07-12). Autogen clones
# rewrite object.metadata to the pod template's metadata, so skip-terminating read
# object.spec.template.metadata.deletionTimestamp and never fired (verified live). Matched
# directly, object.metadata is the admission object's own metadata, so the skip works for
# every kind.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-networkpolicy
  annotations:
    policies.kyverno.io/title: Require NetworkPolicy Per Namespace
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Namespace, NetworkPolicy
    policies.kyverno.io/description: >-
      Every namespace running workloads must declare at least one NetworkPolicy.
      Homelab invariant: every ingress = NetworkPolicy (container port, not service port).
      This policy backstops the manual NetworkPolicy curation (64 NP resources as of 2026-06).
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "replicationcontrollers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  # Same kind set the old autogen covered ("defaults" + cronjobs), now matched directly.
  autogen:
    podControllers:
      controllers: []
  matchConditions:
    - name: exclude-namespaces
      expression: >-
        !(request.namespace in ['kube-system', 'kube-public', 'kube-node-lease', 'default'])
    - name: skip-terminating
      expression: "!has(object.metadata.deletionTimestamp)"
  variables:
    - name: npcount
      # request.namespace, not object.metadata.namespace: it is set in background report mode
      # too (verified live via matchCondition skip rows).
      expression: >-
        resource.List("networking.k8s.io/v1", "networkpolicies",
        request.namespace).items.size()
  validations:
    - expression: "variables.npcount >= 1"
      message: >-
        Namespace must declare at least one NetworkPolicy
        (homelab invariant: every ingress = NetworkPolicy)
  auditAnnotations:
    - key: netpol-count
      valueExpression: "string(variables.npcount)"
  validationActions: [Deny]

# CEL twin of the require-networkpolicy ClusterPolicy — Audit soak (Phase 1).
# Carries BOTH 2026-07-03 namespace-teardown wedge fixes: CREATE/UPDATE-only ops +
# deletionTimestamp skip (a "require NP present" deny during teardown deadlocks the
# namespace in Terminating — csp-reporter incident).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-networkpolicy
  annotations:
    policies.kyverno.io/title: Require NetworkPolicy Per Namespace
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Namespace, NetworkPolicy
    policies.kyverno.io/description: >-
      Every namespace running workloads must declare at least one NetworkPolicy.
      Homelab invariant: every ingress = NetworkPolicy (container port, not service port).
      This policy backstops the manual NetworkPolicy curation (64 NP resources as of 2026-06).
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  # Autogen ON (default when unset) — the original "CP never had controller coverage"
  # assumption was wrong: the CP's namespaces-only exclude leaves Kyverno autogen ACTIVE
  # (live polr carries autogen-require-netpol-present rows on controllers). Twin must
  # mirror that, else parity shows 100+ CP-only controller rows (2026-07-04 soak day-0).
  matchConditions:
    - name: exclude-namespaces
      expression: >-
        !(request.namespace in ['kube-system', 'kube-public', 'kube-node-lease', 'default'])
    - name: skip-terminating
      expression: "!has(object.metadata.deletionTimestamp)"
  variables:
    - name: npcount
      # request.namespace, NOT object.metadata.namespace: autogen controller clones
      # rewrite object.metadata to pod-template metadata (namespace unset there), and
      # request.namespace is populated in background report mode too (live-verified via
      # matchCondition skip rows). Also mirrors the CP's {{ request.namespace }} apiCall.
      expression: >-
        resource.List("networking.k8s.io/v1", "networkpolicies",
        request.namespace).items.size()
  validations:
    - expression: "variables.npcount >= 1"
      message: >-
        Namespace must declare at least one NetworkPolicy
        (homelab invariant: every ingress = NetworkPolicy)
  auditAnnotations:
    - key: netpol-count
      valueExpression: "string(variables.npcount)"
  validationActions: [Deny]

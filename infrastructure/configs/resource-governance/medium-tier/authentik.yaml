apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: authentik
spec:
  limits:
    - type: Container
      default:
        cpu: 1000m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 8000m
        memory: 16Gi
      min:
        cpu: 10m
        memory: 16Mi
    - type: Pod
      max:
        cpu: 16000m
        memory: 32Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: authentik
spec:
  hard:
    # Increased for 2 replicas each of server + worker with rolling update headroom
    # Baseline: 400m/4Gi requests, 4000m/5400Mi limits
    # Headroom needed: simultaneous server + worker rollouts with init containers
    requests.cpu: "3"
    requests.memory: 8Gi
    limits.cpu: "12"
    limits.memory: 12Gi
    pods: "30"
    services: "15"
    persistentvolumeclaims: "10"

apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: percona-mysql
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      max:
        cpu: 4000m
        memory: 4Gi
      min:
        cpu: 10m
        memory: 16Mi
    - type: Pod
      max:
        cpu: 8000m
        memory: 8Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: percona-mysql
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "10"
    services: "5"
    persistentvolumeclaims: "2"

apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: claude-telegram
spec:
  limits:
    - type: Container
      default:
        cpu: 1000m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 8000m
        memory: 16Gi
      min:
        cpu: 10m
        memory: 16Mi
    - type: Pod
      max:
        cpu: 16000m
        memory: 32Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: claude-telegram
spec:
  hard:
    requests.cpu: 200m
    requests.memory: 512Mi
    limits.cpu: 3500m
    # 8Gi, not 4: the pod's own limit went to 5Gi to benchmark the larger whisper models, and
    # quota counts the whole pod — 5Gi main plus 128Mi sync — so a 4Gi ceiling rejected it
    # outright. Deployment strategy is Recreate, so that rejection took the bot down rather
    # than leaving the old pod running. Trim both together once a model is chosen.
    limits.memory: 8Gi
    pods: "4"
    services: "10"
    persistentvolumeclaims: "5"

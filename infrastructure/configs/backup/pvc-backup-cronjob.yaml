apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-backup
  namespace: kube-system
spec:
  schedule: "10 3 * * *"  # 3:10 AM UTC daily (10 min after PostgreSQL backups)
  timeZone: "UTC"
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # Don't run concurrent backups
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400  # Keep job for 24h for debugging
      template:
        metadata:
          labels:
            app: pvc-backup
        spec:
          restartPolicy: OnFailure
          priorityClassName: homelab-batch
          securityContext:
            runAsUser: 0  # Need root to access all PVC files
            runAsGroup: 0
            fsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: setup-permissions
              image: alpine:3.24.1
              command:
                - sh
                - -c
                - |
                  # Ensure backup directory exists with correct permissions
                  mkdir -p /backup
                  chmod 755 /backup
                  echo "Backup directory ready"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                  add: ["CHOWN", "DAC_OVERRIDE"]
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
          containers:
            - name: backup
              image: alpine:3.24.1
              command:
                - /bin/sh
                - -c
                - |
                  set -e

                  echo "=== PVC Backup Started ==="
                  echo "Timestamp: $(date)"

                  # No additional tools needed (tar and gzip built-in)

                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_ROOT="/backup/$TIMESTAMP"
                  mkdir -p "$BACKUP_ROOT"

                  echo "Backup location: $BACKUP_ROOT"
                  echo ""

                  # Define critical PVCs to backup (one per line)
                  # Format: namespace/pvc-name/source-pattern
                  # Excluded by design (do not add back without explicit reason):
                  #   - CouchDB / PostgreSQL / MySQL data dirs — DB-native dumps (separate CronJobs)
                  #   - immich/immich-library — weekly via immich-backup CronJob (63G, too big for daily)
                  #   - immich/immich-machine-learning — regenerable ML cache
                  #   - uptime-kuma — removed 2026-05-22 (UK switched to emptyDir, state lives in MySQL)
                  #   - claude-telegram/claude-telegram-home-pvc — expendable (session-only state,
                  #     bot self-rebuilds on restart, secrets live in SOPS)
                  #   - loki/storage-loki-0, monitoring/vmsingle-vmsingle — log/metric buffers, ephemeral
                  #   - stirling-pdf/stirling-pdf-{pipeline,tessdata}-pvc — regenerable runtime + downloadable model data
                  CRITICAL_PVCS="
                  home-assistant/home-assistant-data-pvc/*home-assistant-data-pvc*
                  paperless-ngx/paperless-data-pvc/*paperless-data-pvc*
                  audiobookshelf/audiobookshelf-audiobooks/*audiobookshelf-audiobooks*
                  audiobookshelf/audiobookshelf-podcasts/*audiobookshelf-podcasts*
                  audiobookshelf/audiobookshelf-config/*audiobookshelf-config*
                  audiobookshelf/audiobookshelf-metadata/*audiobookshelf-metadata*
                  homehub/homehub-data-pvc/*homehub-data-pvc*
                  stirling-pdf/stirling-pdf-configs-pvc/*stirling-pdf-configs-pvc*
                  linkwarden/linkwarden-data/*linkwarden-data*
                  linkwarden/meilisearch-data/*meilisearch-data*
                  pricebuddy/pricebuddy-storage/*pricebuddy-storage*
                  mealie/mealie-data-pvc/*mealie-data-pvc*
                  n8n/n8n-data-pvc/*n8n-data-pvc*
                  "

                  # PVCs containing already-compressed media files (audio)
                  # Skip compression for these - saves time with minimal space benefit
                  NO_COMPRESS_PVCS="
                  audiobookshelf-audiobooks
                  audiobookshelf-podcasts
                  "

                  total_size=0
                  success_count=0
                  failed_count=0

                  # Process each PVC entry (using for loop to avoid subshell)
                  for PVC_ENTRY in $CRITICAL_PVCS; do
                    # Skip empty lines
                    [ -z "$PVC_ENTRY" ] && continue

                    NAMESPACE=$(echo "$PVC_ENTRY" | cut -d/ -f1)
                    PVC_NAME=$(echo "$PVC_ENTRY" | cut -d/ -f2)
                    PATTERN=$(echo "$PVC_ENTRY" | cut -d/ -f3)

                    echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                    echo "📦 Backing up: $NAMESPACE/$PVC_NAME"
                    echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

                    # Find matching PVC directory
                    SOURCE_DIR=$(find /mnt/k8s-storage -maxdepth 1 -type d -name "$PATTERN" | head -1)

                    if [ -z "$SOURCE_DIR" ]; then
                      # A missing critical PVC is a FAILURE, not a skip: local-path PVs
                      # can rebind to another node on PVC recreate, silently dropping the
                      # app from coverage forever if this only warns.
                      echo "❌ FAIL: PVC not found matching pattern: $PATTERN"
                      echo "   (PV moved off worker-node, or PVC renamed — update CRITICAL_PVCS)"
                      echo ""
                      failed_count=$((failed_count + 1))
                      continue
                    fi

                    # Check if source has data
                    DATA_SIZE=$(du -sb "$SOURCE_DIR" 2>/dev/null | cut -f1 || echo "0")
                    if [ "$DATA_SIZE" -eq 0 ]; then
                      echo "ℹ️  INFO: PVC is empty, skipping"
                      echo ""
                      continue
                    fi

                    DEST_DIR="$BACKUP_ROOT/$NAMESPACE"
                    mkdir -p "$DEST_DIR"

                    echo "Source: $SOURCE_DIR"
                    echo "Size: $(du -sh "$SOURCE_DIR" | cut -f1)"

                    # Check if this PVC should skip compression
                    SKIP_COMPRESSION=false
                    for NO_COMPRESS_PVC in $NO_COMPRESS_PVCS; do
                      if echo "$PVC_NAME" | grep -q "$NO_COMPRESS_PVC"; then
                        SKIP_COMPRESSION=true
                        break
                      fi
                    done

                    START_TIME=$(date +%s)

                    if [ "$SKIP_COMPRESSION" = "true" ]; then
                      echo "Creating uncompressed archive (media files)..."
                      echo ""
                      BACKUP_FILE="$DEST_DIR/${PVC_NAME}.tar"

                      if tar -cf "$BACKUP_FILE" -C "$SOURCE_DIR" . ; then
                        END_TIME=$(date +%s)
                        DURATION=$((END_TIME - START_TIME))
                        BACKUP_SIZE=$(du -h "$BACKUP_FILE" | cut -f1)
                        ORIGINAL_SIZE=$(du -sh "$SOURCE_DIR" | cut -f1)

                        # Generate SHA256 checksum for backup integrity
                        echo "Generating SHA256 checksum..."
                        CHECKSUM_FILE="${BACKUP_FILE}.sha256"
                        (cd "$DEST_DIR" && sha256sum "$(basename "$BACKUP_FILE")" > "$(basename "$CHECKSUM_FILE")")

                        echo ""
                        echo "✅ Backup completed successfully"
                        echo "   Size:     $BACKUP_SIZE"
                        echo "   Duration: ${DURATION}s"
                        echo "   Checksum: $(basename $CHECKSUM_FILE)"
                        echo "   Note:     No compression (media files)"
                        echo ""

                        success_count=$((success_count + 1))
                      else
                        echo ""
                        echo "❌ Backup failed for $PVC_NAME"
                        echo ""
                        failed_count=$((failed_count + 1))
                      fi
                    else
                      echo "Compressing with gzip..."
                      echo ""
                      BACKUP_FILE="$DEST_DIR/${PVC_NAME}.tar.gz"

                      if tar -czf "$BACKUP_FILE" -C "$SOURCE_DIR" . ; then
                        END_TIME=$(date +%s)
                        DURATION=$((END_TIME - START_TIME))
                        COMPRESSED_SIZE=$(du -h "$BACKUP_FILE" | cut -f1)
                        ORIGINAL_SIZE=$(du -sh "$SOURCE_DIR" | cut -f1)

                        # Generate SHA256 checksum for backup integrity
                        echo "Generating SHA256 checksum..."
                        CHECKSUM_FILE="${BACKUP_FILE}.sha256"
                        (cd "$DEST_DIR" && sha256sum "$(basename "$BACKUP_FILE")" > "$(basename "$CHECKSUM_FILE")")

                        echo ""
                        echo "✅ Backup completed successfully"
                        echo "   Original:   $ORIGINAL_SIZE"
                        echo "   Compressed: $COMPRESSED_SIZE"
                        echo "   Duration:   ${DURATION}s"
                        echo "   Checksum:   $(basename $CHECKSUM_FILE)"
                        echo ""

                        success_count=$((success_count + 1))
                      else
                        echo ""
                        echo "❌ Backup failed for $PVC_NAME"
                        echo ""
                        failed_count=$((failed_count + 1))
                      fi
                    fi
                  done

                  # Calculate total size
                  total_size=$(du -sb "$BACKUP_ROOT" 2>/dev/null | cut -f1 || echo "0")

                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                  echo "📊 Backup Summary"
                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                  echo "✅ Successful: $success_count"
                  echo "❌ Failed:     $failed_count"
                  echo "📦 Total size: $(echo $total_size | awk '{print $1/1024/1024/1024 " GB"}')"
                  echo ""

                  # Create manifest
                  cat > "$BACKUP_ROOT/MANIFEST.txt" <<EOF
                  PVC Backup Manifest
                  Timestamp: $(date)
                  Backup ID: $TIMESTAMP
                  Compression: Mixed (gzip for text, none for media)

                  Backed up PVCs:
                  $(ls -lh $BACKUP_ROOT/*/*.tar* 2>/dev/null || echo "No backups created")

                  Total size:
                  $(du -sh $BACKUP_ROOT)

                  Summary:
                  - Successful: $success_count
                  - Failed:     $failed_count
                  EOF

                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                  echo "🧹 Cleanup: Removing backups older than 30 days"
                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

                  # Keep only last 30 days (matches NAS retention policy 2026-05-22)
                  find /backup -maxdepth 1 -type d -name "20*" -mtime +30 -exec echo "Deleting: {}" \; -exec rm -rf {} \;

                  echo ""
                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                  echo "📁 Current Backups"
                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                  ls -lh /backup/ | grep "^d" || echo "No backups found"
                  echo ""
                  du -sh /backup/* 2>/dev/null | tail -5 || echo "No backup sizes to show"

                  echo ""
                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                  if [ "$failed_count" -gt 0 ]; then
                    echo "❌ PVC Backup FAILED ($failed_count failure(s))"
                    echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                    # Non-zero exit fails the Job → BackupJobFailed alert fires.
                    # Successful PVCs above are already on disk and still replicate.
                    exit 1
                  fi
                  echo "✅ PVC Backup Complete"
                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                  echo "Backup ID: $TIMESTAMP"
                  echo "Location: /backup/$TIMESTAMP"
                  echo "Next backup: Tomorrow at 3 AM"
                  echo ""
              volumeMounts:
                - name: k8s-storage
                  mountPath: /mnt/k8s-storage
                  readOnly: true
                - name: backup-storage
                  mountPath: /backup
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                  add: ["DAC_READ_SEARCH", "DAC_OVERRIDE"]
              resources:
                requests:
                  cpu: "500m"
                  memory: "256Mi"  # Increased from 32Mi for 60GB+ backup operations
                limits:
                  cpu: "2000m"
                  memory: "512Mi"  # Increased from 64Mi to prevent OOMKills during tar/gzip
          volumes:
            - name: k8s-storage
              hostPath:
                path: /mnt/k8s-storage
                type: Directory
            - name: backup-storage
              hostPath:
                path: /mnt/k8s-storage/backups/pvc
                type: DirectoryOrCreate
          nodeSelector:
            kubernetes.io/hostname: worker-node  # Run on worker node with storage

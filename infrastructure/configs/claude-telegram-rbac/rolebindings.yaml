# Job creation, popeye only. Separate from the exec bindings above so that widening it is a
# deliberate edit; a Job picks its own ServiceAccount and mounts, so binding it beside exec
# everywhere would have made removing the apps-patch grant pointless.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-telegram-jobs
  namespace: popeye
  labels:
    app: claude-telegram
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-telegram-jobs
subjects:
  - kind: ServiceAccount
    name: claude-telegram
    namespace: claude-telegram

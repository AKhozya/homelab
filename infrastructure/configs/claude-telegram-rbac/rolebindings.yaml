# The one list of where the bot may execute code. rbac.yaml defines the two roles; this file
# binds them. Exec into a pod gives the bot that pod's network reach, so each namespace is listed
# with the egress its pods actually have (live NetworkPolicies, 2026-09-28). "Any address" means a
# rule with ports but no `to:`, which reaches the internet, the LAN and cluster pods alike.
#
# Bound to claude-telegram-exec:
# | Namespace      | Egress of its pods                                                        |
# |----------------|---------------------------------------------------------------------------|
# | audiobookshelf | TCP 443 to any address                                                    |
# | blocky         | TCP 443 to any address; DNS to four public resolvers                      |
# | homehub        | DNS only                                                                  |
# | homepage       | API server and DNS only                                                   |
# | immich         | TCP 443 to the internet, private ranges excepted                          |
# | linkwarden     | TCP 443 to any address                                                    |
# | loki           | in-cluster only                                                           |
# | mealie         | TCP 443 to any address                                                    |
# | monitoring     | node-exporter: hostNetwork + hostPID, so no NetworkPolicy applies (below); |
# |                | alertmanager, grafana: TCP 443/80 to any address; vmagent: TCP 443, 6443, |
# |                | 9100, 10250, 10255, 4194 to any address                                   |
# | paperless-ngx  | TCP 443, 465, 587 to any address                                          |
# | pricebuddy     | TCP 443 to any address                                                    |
# | rustdesk       | none                                                                      |
# | stirling-pdf   | TCP 443 to any address                                                    |
# | uptime-kuma    | TCP 443/80 to any address; 192.168.1.0/24 on 65300, 10250, 53             |
#
# monitoring is the one namespace with host-namespace pods. node-exporter runs on all four nodes,
# the control plane included, in the node's own network and PID namespaces. Exec into it
# therefore reaches every LAN host (the NAS, the router) on every port, and every service bound
# to that node's loopback. NetworkPolicies do not restrict this traffic. hostPID shows it every
# host process's command line. The image has no shell, but the host root filesystem is mounted
# read-only (not noexec) at /host/root. The known cluster-admin path through it was the unauthenticated kubectl
# proxy on the control plane's 127.0.0.1:8001; node-maintenance no longer runs that proxy. Any
# other unauthenticated service on a node's loopback or on the LAN stays in reach. The binding
# stays by operator decision (2026-09-28): exec is the bot's only way to query vmsingle and
# Alertmanager. The API server's service proxy returns 502 there, because it dials pods from the
# control plane's pod-network address and the vmsingle and Alertmanager NetworkPolicies do not
# admit it. If those policies admit it and the bot holds services/proxy on both services,
# remove this binding.
#
# Bound to claude-telegram-jobs: popeye only (manual scans). Its pods reach the API server and
# DNS. It has no exec binding: the scan creates a Job and reads the pod's logs.
#
# NOT bound, and why:
# | Namespace                          | Reason                                                  |
# |------------------------------------|---------------------------------------------------------|
# | claude-telegram                    | the bot's own pod and PVC; exec or a Job here reaches   |
# |                                    | the git state its init-time sanitization guards         |
# | kube-system                        | cluster control plane                                   |
# | flux-system                        | sops-age (decrypts every secret) and the git deploy key |
# | kyverno                            | the admission controller's own process                  |
# | cert-manager                       | TLS private keys                                        |
# | cloudflare-tunnel                  | the tunnel credential, the public ingress path          |
# | authentik                          | SSO credentials, and access to every app that uses it   |
# | traefik                            | the ingress controller and its TLS credentials          |
# | databases, percona-mysql, obsidian | database data and credentials                           |
# | backup-replication, n8n,           | zero exec calls in the bot's transcripts                |
# | trivy-scan, home-assistant         |                                                         |
# | default, kube-public,              | no workloads                                            |
# | kube-node-lease                    |                                                         |
#
# The zero-exec-calls row is not an egress boundary. backup-replication, n8n and trivy-scan allow
# TCP 443 to the internet with private ranges excepted, which is less than most bound namespaces
# allow. home-assistant allows every port to 192.168.0.0/16. Before binding any namespace, read
# its NetworkPolicies and its pods' hostNetwork/hostPID, and add its row above.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-telegram-exec
  namespace: audiobookshelf
  labels:
    app: claude-telegram
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-telegram-exec
subjects:
  - kind: ServiceAccount
    name: claude-telegram
    namespace: claude-telegram
---

# Exec is deliberately NOT bound in backup-replication, home-assistant, n8n and trivy-scan.
# Those four are the namespaces whose pods hold a 0.0.0.0/0 egress NetworkPolicy, so exec into
# one of them hands over unrestricted internet and routes around every egress control on the
# bot's own pod. The bot's transcripts show zero exec calls into any of the four, so removing
# them costs nothing measured. immich is the fifth such namespace and DOES stay — 55 recorded
# exec calls — which is the one accepted hole.
# Re-adding any of the four re-opens that bypass; check the namespace's NetworkPolicy first.
#
# claude-telegram is not bound either (removed 2026-08-06). Binding the bot in its own namespace
# let it patch the Deployment that carries its own init-time git sanitization — the control was
# editable by the thing it constrains. Exec into itself was never useful: the bot already runs
# there.
#
# popeye lost its exec binding the same day and keeps only claude-telegram-jobs: the manual scan
# creates a Job and reads the pod's logs, which needs no exec, and the transcript corpus has none.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-telegram-exec
  namespace: audiobookshelf
  labels:
    app: claude-telegram
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-telegram-exec
subjects:
  - kind: ServiceAccount
    name: claude-telegram
    namespace: claude-telegram
---

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cert-manager/clusterissuer.yaml
  - kyverno-policies
  - databases
  - cloudflare
  - backup
  - backup-replication
  - resource-governance
  # These RoleBindings each name their own namespace, so they stay out of apps/claude-telegram/:
  # that kustomization's `namespace: claude-telegram` would rewrite every one of them to the same
  # namespace, and kustomize would reject the build with an ID conflict.
  - claude-telegram-rbac/rolebindings.yaml
  - intel-gpu-plugin/daemonset.yaml
  - traefik-middlewares

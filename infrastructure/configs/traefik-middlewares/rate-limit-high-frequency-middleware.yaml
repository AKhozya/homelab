apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-high-frequency
  namespace: traefik
spec:
  rateLimit:
    # 600 req/min per client IP, for APIs and asset-heavy apps. `average` is
    # per `period`; if period is omitted, it defaults to 1s, so keep period set.
    # Calibrated 2026-07-03: immich 7d peak 200 req/min, so 3x headroom.
    average: 600
    period: 1m
    burst: 300
    # Rate limit based on client IP
    sourceCriterion:
      ipStrategy:
        depth: 0

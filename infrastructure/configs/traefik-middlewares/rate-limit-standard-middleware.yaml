apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-standard
  namespace: traefik
spec:
  rateLimit:
    # 300 req/min per client IP, for normal web apps. `average` is per
    # `period`; if period is omitted, it defaults to 1s, so keep period set.
    # Calibrated 2026-07-03: standard-tier 7d peak at most ~100/min, so 3x headroom.
    average: 300
    period: 1m
    burst: 150
    # Rate limit based on client IP
    sourceCriterion:
      ipStrategy:
        depth: 0

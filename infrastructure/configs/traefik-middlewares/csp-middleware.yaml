apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: csp
  namespace: traefik
spec:
  headers:
    customResponseHeaders:
      # Global default CSP: script-src 'self' 'unsafe-inline', no eval (since 2026-06-04).
      # A new app whose ingress chain lists `traefik-csp` gets this. An app that needs eval or wasm
      # must opt into `csp-permissive-enforced`; the stricter option is `csp-strict-enforced`.
      # The body matches `csp-inline-enforced` (paperless/homepage/mealie/homehub/audiobookshelf).
      # It stays a separate middleware so the default keeps the stable name `csp`.
      # No report-uri: csp-reporter is cluster-internal HTTP, which a browser cannot reach.
      Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self'
        blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'
        https://authentik.h0melab.work"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: csp-strict-enforced
  namespace: traefik
spec:
  headers:
    customResponseHeaders:
      # Strict enforced CSP — script-src 'self' only. Applied per-ingress to couchdb/Fauxton.
      # Browser test 2026-06-04 in report-only mode: zero inline-script or eval violations.
      Content-Security-Policy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'
        data: blob: https:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:; frame-src
        'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://authentik.h0melab.work"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: csp-inline-enforced
  namespace: traefik
spec:
  headers:
    customResponseHeaders:
      # This policy matches the default `csp`.
      # Applied to paperless-ngx, homepage, mealie, homehub and audiobookshelf. paperless-ngx's
      # Angular UI emits inline scripts (browser-verified 2026-06-04, no eval needed).
      Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self'
        blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'
        https://authentik.h0melab.work"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: csp-permissive-enforced
  namespace: traefik
spec:
  headers:
    customResponseHeaders:
      # Permissive enforced CSP: script-src 'self' 'unsafe-inline' 'unsafe-eval'. An app opts in explicitly.
      # Users: authentik, linkwarden, n8n (expression eval), stirling-pdf (PDF wasm), browser-confirmed
      # 2026-06-04; also immich, home-assistant, pricebuddy, uptime-kuma, which need eval or wasm.
      # The default `csp` dropped eval on 2026-06-04, so a new app cannot inherit it by accident.
      Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self'
        'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: data:;
        worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'
        https://authentik.h0melab.work"

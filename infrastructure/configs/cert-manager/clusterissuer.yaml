apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # This issuer has always used production ACME. Before 2026-07-03 it was misnamed
    # letsencrypt-staging.
    server: https://acme-v02.api.letsencrypt.org/directory
    email: acme@h0melab.work
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-token
      selector:
        dnsZones:
        - h0melab.work

apiVersion: batch/v1
kind: CronJob
metadata:
  name: couchdb-backup
  namespace: databases
spec:
  schedule: "5 3 * * *"  # 3:05 AM UTC daily (5 min after PostgreSQL backups)
  timeZone: "UTC"
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # Don't run concurrent backups
  jobTemplate:
    spec:
      backoffLimit: 6  # Retry up to 6 times before marking job as failed
      ttlSecondsAfterFinished: 86400  # Keep job for 24h for debugging
      template:
        metadata:
          labels:
            app: couchdb-backup
        spec:
          serviceAccountName: couchdb-jobs
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          priorityClassName: homelab-batch
          securityContext:
            runAsUser: 1000  # non-root user
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: setup-permissions
              image: alpine:3.24.1
              command:
                - sh
                - -c
                - |
                  mkdir -p /backup
                  chown -R 1000:1000 /backup
                  chmod 755 /backup
                  echo "Backup directory ready"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
              securityContext:
                runAsUser: 0  # Need root to chown
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                  add: ["CHOWN", "DAC_OVERRIDE"]
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
            - name: wait-for-couchdb
              image: alpine:3.24.1
              command:
                - sh
                - -c
                - |
                  echo "Waiting for CouchDB to be ready..."
                  COUCHDB_URL="http://$COUCHDB_USER:$COUCHDB_PASSWORD@couchdb-couchdb.databases.svc.cluster.local:5984"
                  MAX_RETRIES=30
                  RETRY_INTERVAL=2

                  for i in $(seq 1 $MAX_RETRIES); do
                    if wget -q --timeout=5 -O /dev/null "$COUCHDB_URL/_up"; then
                      echo "✅ CouchDB is ready (attempt $i)"
                      exit 0
                    fi
                    echo "Attempt $i/$MAX_RETRIES: CouchDB not ready, waiting ${RETRY_INTERVAL}s..."
                    sleep $RETRY_INTERVAL
                  done

                  echo "❌ CouchDB did not become ready after $MAX_RETRIES attempts"
                  exit 1
              env:
                - name: COUCHDB_USER
                  valueFrom:
                    secretKeyRef:
                      name: couchdb-couchdb
                      key: adminUsername
                - name: COUCHDB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: couchdb-couchdb
                      key: adminPassword
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: "10m"
                  memory: "32Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"
          containers:
            - name: backup
              image: node:24.21.0-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -eo pipefail

                  # Timing helper function
                  SCRIPT_START=$(date +%s)
                  elapsed() { echo "$(($(date +%s) - SCRIPT_START))s elapsed"; }

                  echo "=== CouchDB Backup Started ==="
                  echo "Timestamp: $(date)"

                  echo "[$(elapsed)] Cleaning orphaned backup directories..."
                  find /backup -maxdepth 1 -type d -name "2*" -mmin +60 -exec rm -rf {} \; 2>/dev/null || true

                  # Retry/timeout settings — the registry fetch below has failed on a slow link.
                  npm config set fetch-retries 3
                  npm config set fetch-retry-mintimeout 10000
                  npm config set fetch-retry-maxtimeout 60000
                  npm config set fetch-timeout 120000

                  echo "[$(elapsed)] Installing couchbackup..."
                  NPM_START=$(date +%s)
                  # Pinned: an unpinned install floats the tool that produces the DR
                  # artifact, and the completeness check below parses its log format.
                  # Renovate does not see npm specs inside shell — bump by hand.
                  npm install --prefix /tmp @cloudant/couchbackup@2.11.18 2>&1 | tail -3
                  echo "[$(elapsed)] npm install completed in $(($(date +%s) - NPM_START))s"
                  export PATH="/tmp/node_modules/.bin:$PATH"

                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_DIR="/backup/$TIMESTAMP"
                  mkdir -p "$BACKUP_DIR"

                  # CouchDB connection details
                  COUCHDB_URL="http://$COUCHDB_USER:$COUCHDB_PASSWORD@couchdb-couchdb.databases.svc.cluster.local:5984"

                  # Auto-discover databases (exclude system databases)
                  echo "[$(elapsed)] Discovering databases..."
                  DATABASES=$(wget -q --timeout=30 -O- "$COUCHDB_URL/_all_dbs" | \
                    sed 's/\[//g;s/\]//g;s/"//g;s/,/ /g' | \
                    tr ' ' '\n' | \
                    grep -v '^_' | \
                    grep -v '^$' || echo "")

                  echo "[$(elapsed)] Found databases: $DATABASES"

                  if [ -z "$DATABASES" ]; then
                    echo "❌ No databases found to backup!"
                    exit 1
                  fi

                  # Backup each database
                  for DB in $DATABASES; do
                    echo "[$(elapsed)] Backing up database: $DB"
                    DB_START=$(date +%s)

                    # stdout=JSON data, stderr=diagnostics — kept in SEPARATE files.
                    # Merging them (2>&1) put log lines into the stream a restore reads.
                    BACKUP_RC=0
                    # --parallelism 1 is REQUIRED, not tuning. At the default 5, some
                    # concurrent requests reach CouchDB with no credentials and get 401
                    # ("Access is denied due to invalid credentials"), so batches are
                    # spooled but never written. obsidian-personal failed this way on
                    # 2026-07-25 and 07-26 (exit=11, 3 batches lost); the small databases
                    # survive because they never open enough connections to race. The
                    # identical race is why the DR restore in .backup/README.md pins
                    # parallelism 1 — same library, same failure, opposite direction.
                    /tmp/node_modules/.bin/couchbackup \
                      --url "$COUCHDB_URL" \
                      --db "$DB" \
                      --log "$BACKUP_DIR/${DB}.log" \
                      --parallelism 1 \
                      --request-timeout 60000 \
                      > "$BACKUP_DIR/${DB}.raw" 2> "$BACKUP_DIR/${DB}.stderr" || BACKUP_RC=$?

                    # Completeness mirrors upstream includes/logfilesummary.js: whole only
                    # if :changes_complete was written AND every spooled ':t batchN' was
                    # cancelled by a ':d batchN'. Presence of '[' lines proves nothing —
                    # a mid-stream fatal still leaves earlier batches looking valid, which
                    # is how a truncated dump used to earn a good sha256 and pass replication.
                    INCOMPLETE=$(awk '
                      $1 == ":t" { todo[$2] = 1 }
                      $1 == ":d" { delete todo[$2] }
                      $1 == ":changes_complete" { complete = 1 }
                      END {
                        if (!complete) { print "spooling never completed"; exit }
                        n = 0
                        for (b in todo) n++
                        if (n > 0) printf "%d batch(es) spooled but never written\n", n
                      }
                    ' "$BACKUP_DIR/${DB}.log" 2>/dev/null) || INCOMPLETE="log file unreadable"

                    if [ "$BACKUP_RC" -ne 0 ] || [ -n "$INCOMPLETE" ]; then
                      echo "[$(elapsed)] ❌ $DB backup FAILED (exit=$BACKUP_RC${INCOMPLETE:+; $INCOMPLETE})"
                      echo "--- stderr ---"
                      cat "$BACKUP_DIR/${DB}.stderr" 2>/dev/null || echo "(empty)"
                      echo "--- log tail ---"
                      tail -20 "$BACKUP_DIR/${DB}.log" 2>/dev/null || echo "(empty)"
                      exit 1
                    fi

                    # A database with zero documents spools zero batches and so writes no
                    # JSON — legitimately. Only demand data when the log says batches
                    # existed, otherwise one empty database fails the whole nightly run.
                    # `|| true`, not `|| echo 0`: grep -c prints "0" AND exits 1 on no
                    # match, so `|| echo 0` captures BOTH and yields "0\n0", which busybox
                    # test rejects as a bad number — aborting the run under set -e.
                    BATCH_COUNT=$(grep -c "^:t " "$BACKUP_DIR/${DB}.log" 2>/dev/null || true)
                    [ -n "$BATCH_COUNT" ] || BATCH_COUNT=0
                    if [ "$BATCH_COUNT" -gt 0 ] && ! grep -q "^\[" "$BACKUP_DIR/${DB}.raw"; then
                      echo "[$(elapsed)] ❌ $DB logged $BATCH_COUNT batch(es) but produced no JSON"
                      cat "$BACKUP_DIR/${DB}.stderr" 2>/dev/null || true
                      exit 1
                    fi

                    # grep exits 1 on "no match" (legitimate for a zero-batch database)
                    # but >=2 on a real error. A blanket `|| true` would swallow the
                    # latter and package a truncated archive.
                    FILTER_RC=0
                    grep "^\[" "$BACKUP_DIR/${DB}.raw" > "$BACKUP_DIR/${DB}.couchbackup" || FILTER_RC=$?
                    if [ "$FILTER_RC" -gt 1 ]; then
                      echo "[$(elapsed)] ❌ $DB filter failed (grep exit $FILTER_RC) — not packaging"
                      exit 1
                    fi
                    rm -f "$BACKUP_DIR/${DB}.raw" "$BACKUP_DIR/${DB}.stderr"

                    DB_DURATION=$(($(date +%s) - DB_START))
                    SIZE=$(du -h "$BACKUP_DIR/${DB}.couchbackup" | cut -f1)
                    echo "[$(elapsed)] ✅ $DB completed ($SIZE, ${DB_DURATION}s)"
                  done

                  cat > "$BACKUP_DIR/MANIFEST.txt" <<EOF
                  CouchDB Backup Manifest
                  Timestamp: $(date)
                  Backup ID: $TIMESTAMP
                  Databases: $DATABASES
                  Host: couchdb-couchdb.databases.svc.cluster.local:5984

                  Backup Files:
                  $(ls -lh $BACKUP_DIR/*.couchbackup 2>/dev/null || echo "No backups created")

                  Total Size:
                  $(du -sh $BACKUP_DIR)
                  EOF

                  # Compress backup directory
                  echo "[$(elapsed)] Compressing backup archive..."
                  COMPRESS_START=$(date +%s)
                  cd /backup
                  tar -czf "couchdb_${TIMESTAMP}.tar.gz" "$TIMESTAMP"
                  COMPRESSED_SIZE=$(du -h "couchdb_${TIMESTAMP}.tar.gz" | cut -f1)
                  echo "[$(elapsed)] Compression completed in $(($(date +%s) - COMPRESS_START))s ($COMPRESSED_SIZE)"

                  sha256sum "couchdb_${TIMESTAMP}.tar.gz" > "couchdb_${TIMESTAMP}.tar.gz.sha256"

                  rm -rf "$TIMESTAMP"

                  # Keep only last 30 days of backups
                  find /backup -name "couchdb_*.tar.gz" -mtime +30 -delete
                  find /backup -name "couchdb_*.tar.gz.sha256" -mtime +30 -delete

                  echo ""
                  echo "=== Backup Complete ==="
                  echo "Total time: $(elapsed)"
                  echo "Backup: couchdb_${TIMESTAMP}.tar.gz ($COMPRESSED_SIZE)"
              env:
                - name: COUCHDB_USER
                  valueFrom:
                    secretKeyRef:
                      name: couchdb-couchdb
                      key: adminUsername
                - name: COUCHDB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: couchdb-couchdb
                      key: adminPassword
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: false  # Need to write to /tmp for npm
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
          volumes:
            - name: backup-storage
              hostPath:
                path: /mnt/k8s-storage/backups/couchdb
                type: DirectoryOrCreate
          nodeSelector:
            kubernetes.io/hostname: worker-node  # Run on worker node with storage

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: couchdb-network-policy
  namespace: databases
spec:
  podSelector:
    matchLabels:
      app: couchdb
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from Cloudflare tunnel
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 5984
    # Allow ingress from Traefik ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 5984
    # Allow ingress from within the same namespace (for backups, monitoring)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5984
    # Allow ingress from Obsidian namespace (for init jobs)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: obsidian
      ports:
        - protocol: TCP
          port: 5984
    # Allow ingress from Prometheus for monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 5984
    # Allow CouchDB cluster inter-node communication
    - from:
        - podSelector:
            matchLabels:
              app: couchdb
      ports:
        - protocol: TCP
          port: 5984
        - protocol: TCP
          port: 4369  # Erlang port mapper daemon
        - protocol: TCP
          port: 9100  # Erlang distribution
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow CouchDB cluster inter-node communication
    - to:
        - podSelector:
            matchLabels:
              app: couchdb
      ports:
        - protocol: TCP
          port: 5984
        - protocol: TCP
          port: 4369  # Erlang port mapper daemon
        - protocol: TCP
          port: 9100  # Erlang distribution

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: couchdb-network-policy
  namespace: databases
spec:
  podSelector:
    matchLabels:
      app: couchdb
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # External access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 5984
    # Internal access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 5984
    # Same namespace: backups, monitoring
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5984
    # Obsidian init Jobs
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: obsidian
      ports:
        - protocol: TCP
          port: 5984
    # Metrics scrape
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 5984
    # CouchDB inter-node
    - from:
        - podSelector:
            matchLabels:
              app: couchdb
      ports:
        - protocol: TCP
          port: 5984
        - protocol: TCP
          port: 4369  # Erlang port mapper daemon
        - protocol: TCP
          port: 9100  # Erlang distribution
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # CouchDB inter-node
    - to:
        - podSelector:
            matchLabels:
              app: couchdb
      ports:
        - protocol: TCP
          port: 5984
        - protocol: TCP
          port: 4369  # Erlang port mapper daemon
        - protocol: TCP
          port: 9100  # Erlang distribution

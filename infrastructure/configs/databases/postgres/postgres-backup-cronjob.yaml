apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: databases
spec:
  schedule: "0 3 * * *"  # 3:00 AM UTC daily
  timeZone: "UTC"
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # Don't run concurrent backups
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400  # Keep job for 24h for debugging
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          serviceAccountName: postgres-jobs
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          priorityClassName: homelab-batch
          securityContext:
            runAsUser: 999  # postgres user
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: setup-permissions
              image: alpine:3.24.1
              command:
                - sh
                - -c
                - |
                  mkdir -p /backup
                  chown -R 999:999 /backup
                  chmod 755 /backup
                  echo "Backup directory ready"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
              securityContext:
                runAsUser: 0  # Need root to chown
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                  add: ["CHOWN", "DAC_OVERRIDE"]
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
          containers:
            - name: backup
              image: postgres:18.6-alpine
              command:
                - /bin/bash
                - -c
                - |
                  set -eo pipefail

                  echo "=== PostgreSQL Backup Started ==="
                  echo "Timestamp: $(date)"

                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_DIR="/backup/$TIMESTAMP"
                  mkdir -p "$BACKUP_DIR"

                  # Auto-discover databases (exclude system databases)
                  echo "Discovering databases..."
                  DATABASES=$(PGPASSWORD="$POSTGRES_PASSWORD" psql \
                    -h main-postgres-rw.databases.svc.cluster.local \
                    -U postgres-admin \
                    -d postgres \
                    -t -A \
                    -c "SELECT datname FROM pg_database WHERE datistemplate = false AND datname NOT IN ('postgres');" \
                    | grep -v '^$')

                  echo "Found databases: $DATABASES"

                  # Backup each database. pipefail makes the pipeline status pg_dump's,
                  # not tee's; the if-condition keeps set -e from aborting mid-loop so
                  # remaining databases still get dumped before the job fails.
                  FAILED=0
                  for DB in $DATABASES; do
                    echo "Backing up database: $DB"
                    if PGPASSWORD="$POSTGRES_PASSWORD" pg_dump \
                      -h main-postgres-rw.databases.svc.cluster.local \
                      -U postgres-admin \
                      -d "$DB" \
                      -F c \
                      -f "$BACKUP_DIR/${DB}.dump" \
                      2>&1 | tee "$BACKUP_DIR/${DB}.log"; then
                      SIZE=$(du -h "$BACKUP_DIR/${DB}.dump" | cut -f1)
                      echo "✅ $DB backup completed ($SIZE)"
                    else
                      echo "❌ $DB backup failed!"
                      FAILED=1
                    fi
                  done

                  # Fail the Job before packaging: a partial dump must not become a
                  # "good" tarball. Yesterday's backup stays; BackupJobFailed fires.
                  if [ "$FAILED" -ne 0 ]; then
                    echo "❌ One or more database backups failed — aborting before packaging"
                    exit 1
                  fi

                  cat > "$BACKUP_DIR/MANIFEST.txt" <<EOF
                  PostgreSQL Backup Manifest
                  Timestamp: $(date)
                  Backup ID: $TIMESTAMP
                  Databases: $DATABASES
                  Host: main-postgres-rw.databases.svc.cluster.local

                  Backup Files:
                  $(ls -lh $BACKUP_DIR/*.dump)

                  Total Size:
                  $(du -sh $BACKUP_DIR)
                  EOF

                  # Compress backup directory with gzip
                  echo "Compressing backup with gzip..."
                  cd /backup
                  tar -czf "postgres_${TIMESTAMP}.tar.gz" "$TIMESTAMP"
                  COMPRESSED_SIZE=$(du -h "postgres_${TIMESTAMP}.tar.gz" | cut -f1)
                  echo "✅ Compressed backup: postgres_${TIMESTAMP}.tar.gz ($COMPRESSED_SIZE)"

                  echo "Generating SHA256 checksum for backup integrity..."
                  sha256sum "postgres_${TIMESTAMP}.tar.gz" > "postgres_${TIMESTAMP}.tar.gz.sha256"
                  echo "✅ Checksum saved: postgres_${TIMESTAMP}.tar.gz.sha256"
                  cat "postgres_${TIMESTAMP}.tar.gz.sha256"

                  rm -rf "$TIMESTAMP"

                  # Keep only last 30 days of backups (including checksums)
                  echo "Cleaning old backups (keeping last 30 days)..."
                  find /backup -name "postgres_*.tar.gz" -mtime +30 -delete
                  find /backup -name "postgres_*.tar.gz.sha256" -mtime +30 -delete

                  # List current backups
                  echo ""
                  echo "=== Current Backups ==="
                  ls -lh /backup/postgres_*.tar.gz 2>/dev/null || echo "No backups found"

                  echo ""
                  echo "=== Backup Complete ==="
                  echo "Backup ID: $TIMESTAMP"
                  echo "Location: /backup/postgres_${TIMESTAMP}.tar.gz"
                  echo "Size: $COMPRESSED_SIZE"
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-admin-user
                      key: password
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: false  # Need to write to /tmp for pg_dump
              resources:
                requests:
                  cpu: "200m"
                  memory: "512Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
          volumes:
            - name: backup-storage
              hostPath:
                path: /mnt/k8s-storage/backups/postgres
                type: DirectoryOrCreate
          nodeSelector:
            kubernetes.io/hostname: worker-node  # Run on worker node with storage

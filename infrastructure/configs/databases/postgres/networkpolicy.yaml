apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-apps
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: main-postgres
  policyTypes:
    - Ingress
    - Egress
  egress:
    # Allow access to Kubernetes API server (for cluster configuration)
    # API server runs on control-plane node, not as a pod, so we use ipBlock
    - to:
      - ipBlock:
          cidr: 192.168.1.127/32  # control-plane node
      ports:
      - protocol: TCP
        port: 6443  # Kubernetes API server port

    # DNS resolution
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53

    # Intra-cluster replication (PostgreSQL pods talking to each other)
    - to:
      - podSelector:
          matchLabels:
            cnpg.io/cluster: main-postgres
      ports:
      - protocol: TCP
        port: 5432
      - protocol: TCP
        port: 8000  # CNPG instance manager status API

    # CNPG operator communication (reports status, receives commands)
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: cloudnative-pg
      ports:
      - protocol: TCP
        port: 9443  # Webhook
      - protocol: TCP
        port: 8080  # Metrics

  ingress:
    # Allow from app namespaces (authentik, immich, paperless, etc.)
    - from:
      - namespaceSelector:
          matchLabels:
            kustomize.toolkit.fluxcd.io/name: apps
      ports:
      - protocol: TCP
        port: 5432

    # Allow from monitoring namespace (Prometheus metrics scraping)
    - from:
      - namespaceSelector:
          matchLabels:
            kustomize.toolkit.fluxcd.io/name: monitoring-controllers
      ports:
      - protocol: TCP
        port: 9187

    # Allow from same namespace (maintenance jobs like immich-init-extensions)
    - from:
      - podSelector: {}
      ports:
      - protocol: TCP
        port: 5432

    # Allow CNPG operator to access status API for health monitoring
    - from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: cloudnative-pg
      ports:
      - protocol: TCP
        port: 8000  # CNPG instance manager status API

    # Allow intra-cluster replication (PostgreSQL pods talking to each other)
    - from:
      - podSelector:
          matchLabels:
            cnpg.io/cluster: main-postgres
      ports:
      - protocol: TCP
        port: 5432
      - protocol: TCP
        port: 8000  # CNPG instance manager status API (for liveness checks)

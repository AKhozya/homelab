apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-apps
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: main-postgres
  policyTypes:
    - Ingress
    - Egress
  egress:
    # K8s API for cluster configuration. The API server runs on the control-plane node,
    # not as a pod, so this rule needs an ipBlock rather than a selector.
    - to:
      - ipBlock:
          cidr: 192.168.1.127/32  # control-plane node
      ports:
      - protocol: TCP
        port: 6443

    # DNS resolution
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53

    # Replication between instances
    - to:
      - podSelector:
          matchLabels:
            cnpg.io/cluster: main-postgres
      ports:
      - protocol: TCP
        port: 5432
      - protocol: TCP
        port: 8000  # CNPG instance manager status API

    # CNPG operator: status reports and commands
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: cloudnative-pg
      ports:
      - protocol: TCP
        port: 9443  # Webhook
      - protocol: TCP
        port: 8080  # Metrics

  ingress:
    # Any namespace owned by the `apps` Flux Kustomization
    - from:
      - namespaceSelector:
          matchLabels:
            kustomize.toolkit.fluxcd.io/name: apps
      ports:
      - protocol: TCP
        port: 5432

    # Metrics scrape from the `monitoring-controllers` Kustomization
    - from:
      - namespaceSelector:
          matchLabels:
            kustomize.toolkit.fluxcd.io/name: monitoring-controllers
      ports:
      - protocol: TCP
        port: 9187

    # Same namespace: maintenance Jobs such as immich-init-extensions
    - from:
      - podSelector: {}
      ports:
      - protocol: TCP
        port: 5432

    # CNPG operator health checks
    - from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: cloudnative-pg
      ports:
      - protocol: TCP
        port: 8000  # CNPG instance manager status API

    # Replication between instances
    - from:
      - podSelector:
          matchLabels:
            cnpg.io/cluster: main-postgres
      ports:
      - protocol: TCP
        port: 5432
      - protocol: TCP
        port: 8000  # CNPG instance manager status API (for liveness checks)

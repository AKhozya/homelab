apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: main-postgres
  namespace: databases
spec:
  priorityClassName: homelab-critical  # critical tier (DB outranks standard/batch under node pressure)
  instances: 2  # 1 primary + 1 replica on worker node only
  # Wait 30s before failover on a failed primary probe (default 0 = instant). On 2026-06-04
  # the operator leader on worker-node-2, whose VXLAN was flaky, failed over from a healthy
  # worker-node primary to worker-node-2 after one probe blip. 30s covers 1-10s blips and
  # adds 30s to recovery if the primary really dies. A longer delay cannot cover sustained
  # flakiness: see the operator nodeAffinity in
  # infrastructure/controllers/databases/postgres/release.yaml.
  failoverDelay: 30
  inheritedMetadata:
    labels:
      release: kube-prometheus-stack
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  # false: the PgBouncer Pooler does not need the postgres superuser. The operator creates
  # cnpg_pooler_pgbouncer through local instance-manager SQL, and PgBouncer authenticates
  # with an operator-issued TLS client cert (CNPG 1.30 connection_pooling docs).
  # If enableSuperuserAccess is false, CNPG blanks the postgres password and deletes its
  # Secret (SQL, no pod restart). Maintenance uses the managed postgres-admin role and
  # local peer auth via `kubectl exec`.
  enableSuperuserAccess: false

  # Worker nodes only - control-plane has NoSchedule taint
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: "required"  # Hard constraint - one instance per worker node (true HA)

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  storage:
    size: 10Gi
    storageClass: "local-path"
  monitoring: {}  # Scraped by VMPodScrape postgres in monitoring/configs/victoria-metrics/scrape-databases.yaml
  bootstrap:
    initdb:
      database: postgres
      owner: postgres  # CRITICAL: CNPG auto-generates <cluster-name>-app secret with this username
                        # Changing this after cluster creation causes reconciliation failure
                        # If change needed: delete cluster and recreate, or delete secret to force recreation
      postInitTemplateSQL:
        - |
          -- Create common extensions in template1 so all new databases inherit them
          CREATE EXTENSION IF NOT EXISTS vector CASCADE;
          CREATE EXTENSION IF NOT EXISTS cube CASCADE;
          CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
          CREATE EXTENSION IF NOT EXISTS pg_trgm CASCADE;
          CREATE EXTENSION IF NOT EXISTS unaccent CASCADE;
          CREATE EXTENSION IF NOT EXISTS uuid-ossp CASCADE;
  managed:
    roles:
      - name: postgres-admin
        ensure: present
        comment: PostgreSQL admin user for maintenance tasks (extensions, backups)
        login: true
        superuser: true
        passwordSecret:
          name: postgres-admin-user
      - name: n8n
        ensure: present
        comment: n8n application user
        login: true
        createdb: true
        passwordSecret:
          name: n8n-db-user
      - name: mealie
        ensure: present
        comment: Mealie application user
        login: true
        createdb: true
        passwordSecret:
          name: mealie-db-user
      - name: authentik
        ensure: present
        comment: Authentik application user
        login: true
        createdb: true
        passwordSecret:
          name: authentik-db-user
      - name: paperless
        ensure: present
        comment: Paperless-NGX application user
        login: true
        createdb: true
        passwordSecret:
          name: paperless-db-user
      - name: immich
        ensure: present
        comment: Immich application user
        login: true
        createdb: true
        passwordSecret:
          name: immich-db-user
      - name: linkwarden
        ensure: present
        comment: Linkwarden application user
        login: true
        createdb: true
        connectionLimit: -1
        inherit: true
        passwordSecret:
          name: linkwarden-db-app-user
      - name: blocky
        ensure: present
        comment: Blocky DNS query log
        login: true
        createdb: true
        passwordSecret:
          name: blocky-db-user

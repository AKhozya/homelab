apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: main-postgres
  namespace: databases
spec:
  priorityClassName: homelab-critical  # critical tier (DB outranks standard/batch under node pressure)
  instances: 2  # 1 primary + 1 replica on worker node only
  # Grace period before failover on a failed primary probe (default 0 = instant). Filters the
  # transient-blip class: 2026-06-04 the operator (leader on wn2, flaky VXLAN) shot the HEALTHY
  # W1 primary on a probe blip -> spurious failover into the broken node. 30s rides out 1-10s
  # blips; costs +30s RTO on genuine primary death (rare, acceptable). Sustained flakiness
  # exceeds any sane delay -> see operator nodeAffinity in controllers/databases/postgres.
  failoverDelay: 30
  inheritedMetadata:
    labels:
      release: kube-prometheus-stack
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
  # false: the PgBouncer Pooler does NOT need this — the operator creates
  # cnpg_pooler_pgbouncer via local instance-manager SQL and PgBouncer auths
  # with an operator-issued TLS client cert (CNPG 1.30 connection_pooling docs).
  # Leaving it true kept a live `postgres` superuser Secret that nothing
  # consumes and no rotation tracked. Disabling makes CNPG blank the postgres
  # password + delete the secret (SQL, no pod restart). Maintenance still uses
  # the managed postgres-admin role and local peer auth via `kubectl exec`.
  enableSuperuserAccess: false

  # Worker nodes only - control-plane has NoSchedule taint
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: "required"  # Hard constraint - one instance per worker node (true HA)

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  storage:
    size: 10Gi
    storageClass: "local-path"
  monitoring: {}  # Metrics handled by manually managed PodMonitor (see podmonitor.yaml)
  bootstrap:
    initdb:
      database: postgres
      owner: postgres  # CRITICAL: CNPG auto-generates <cluster-name>-app secret with this username
                        # Changing this after cluster creation causes reconciliation failure
                        # If change needed: delete cluster and recreate, or delete secret to force recreation
      postInitTemplateSQL:
        - |
          -- Create common extensions in template1 so all new databases inherit them
          CREATE EXTENSION IF NOT EXISTS vector CASCADE;
          CREATE EXTENSION IF NOT EXISTS cube CASCADE;
          CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
          CREATE EXTENSION IF NOT EXISTS pg_trgm CASCADE;
          CREATE EXTENSION IF NOT EXISTS unaccent CASCADE;
          CREATE EXTENSION IF NOT EXISTS uuid-ossp CASCADE;
  managed:
    roles:
      - name: postgres-admin
        ensure: present
        comment: PostgreSQL admin user for maintenance tasks (extensions, backups)
        login: true
        superuser: true
        passwordSecret:
          name: postgres-admin-user
      - name: n8n
        ensure: present
        comment: n8n application user
        login: true
        createdb: true
        passwordSecret:
          name: n8n-db-user
      - name: mealie
        ensure: present
        comment: Mealie application user
        login: true
        createdb: true
        passwordSecret:
          name: mealie-db-user
      - name: authentik
        ensure: present
        comment: Authentik application user
        login: true
        createdb: true
        passwordSecret:
          name: authentik-db-user
      - name: paperless
        ensure: present
        comment: Paperless-NGX application user
        login: true
        createdb: true
        passwordSecret:
          name: paperless-db-user
      - name: immich
        ensure: present
        comment: Immich application user
        login: true
        createdb: true
        passwordSecret:
          name: immich-db-user
      - name: linkwarden
        ensure: present
        comment: Linkwarden application user
        login: true
        createdb: true
        connectionLimit: -1
        inherit: true
        passwordSecret:
          name: linkwarden-db-app-user
      - name: blocky
        ensure: present
        comment: Blocky DNS query log
        login: true
        createdb: true
        passwordSecret:
          name: blocky-db-user

apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-update-extensions
  namespace: databases
  labels:
    app: postgres-update-extensions
spec:
  # If a CNPG rebuild provides a newer pgvector under an unchanged image tag, renovate has
  # nothing to bump and nothing re-creates immich-init-extensions, so only this CronJob
  # raises the installed version. Immich crashloops until it runs, and a weekly schedule can
  # leave it crashlooping for up to seven days.
  schedule: "0 6 * * *"
  timeZone: "UTC"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: postgres-update-extensions
        spec:
          serviceAccountName: postgres-jobs
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          priorityClassName: homelab-batch
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: update-extensions
              image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
              # immich-init-extensions mounts the same postgres-extension-update ConfigMap.
              # A ConfigMap volume is not executable, so `sh` runs the file by path.
              command:
                - /bin/sh
                - /scripts/update-extensions.sh
              env:
                # PGPASSWORD for postgres-admin superuser
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-admin-user
                      key: password
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 26
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir: {}
            - name: scripts
              configMap:
                name: postgres-extension-update

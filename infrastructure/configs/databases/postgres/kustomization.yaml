apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # CNPG cluster and its cluster-wide objects
  - cluster.yaml
  - pooler.yaml
  - networkpolicy.yaml
  - podmonitor.yaml
  - postgres-admin-user.yaml
  - pdb.yaml
  - serviceaccount.yaml
  - postgres-backup-cronjob.yaml
  # App-specific database users and databases
  - authentik-db-user.yaml
  - authentik-database.yaml
  - blocky-db-user.yaml
  - blocky-database.yaml
  - immich-db-user.yaml
  - immich-database.yaml
  - immich-init-extensions-job.yaml
  - linkwarden-app-user-secret.yaml
  - linkwarden-database.yaml
  - mealie-db-user.yaml
  - mealie-database.yaml
  - n8n-db-user.yaml
  - n8n-database.yaml
  - paperless-db-user.yaml
  - paperless-database.yaml
  - update-extensions-job.yaml

# Generated, not a static ConfigMap: the content hash renames it on every script edit, so
# kustomize rewrites both volume references and Flux re-creates the forced init Job. A fixed
# name leaves that Job holding the previous script.
# Accepted race: if the CronJob controller creates a Job from the old template in the seconds
# before Flux prunes the old ConfigMap, that Pod cannot mount it and the day's run stalls.
# The next daily run repairs it, so pinning the ConfigMap against pruning is not worth the
# manual cleanup it needs.
configMapGenerator:
  - name: postgres-extension-update
    namespace: databases
    files:
      - update-extensions.sh

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-exporter
  namespace: databases
  labels:
    app: mysql-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: mysql-exporter
  template:
    metadata:
      labels:
        app: mysql-exporter
    spec:
      serviceAccountName: mysql-jobs
      automountServiceAccountToken: false
      priorityClassName: homelab-standard
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: prom/mysqld-exporter:v0.19.0
          args:
            - --mysqld.address=main-mysql-haproxy.databases.svc.cluster.local:3306
            - --mysqld.username=monitor
          env:
            - name: MYSQLD_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-cluster-secrets
                  key: monitor
          ports:
            - containerPort: 9104
              name: metrics
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              # Increased from 200m to 300m (2026-01-11) - CPU throttling during rebuilderd load
              cpu: "300m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-exporter
  namespace: databases
  labels:
    app: mysql-exporter
spec:
  selector:
    app: mysql-exporter
  ports:
    - port: 9104
      targetPort: metrics
      name: metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-exporter
  namespace: databases
spec:
  podSelector:
    matchLabels:
      app: mysql-exporter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9104
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # MySQL via HAProxy
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: main-mysql
      ports:
        - protocol: TCP
          port: 3306
---
# Second exporter targeting the HAProxy reader backend (mysql-replicas, port 3307),
# which routes to the read-only replica. The primary-only mysql-exporter (3306/writer)
# returns an empty SHOW REPLICA STATUS, so replica health (SQL/IO threads, lag) was
# unmonitored — UR2 2026-06-06 removed the dead replication alerts. This restores them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-replica-exporter
  namespace: databases
  labels:
    app: mysql-replica-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: mysql-replica-exporter
  template:
    metadata:
      labels:
        app: mysql-replica-exporter
    spec:
      serviceAccountName: mysql-jobs
      automountServiceAccountToken: false
      priorityClassName: homelab-standard
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: prom/mysqld-exporter:v0.19.0
          args:
            # 3307 = HAProxy mysql-replicas (reader) backend → the read-only replica.
            - --mysqld.address=main-mysql-haproxy.databases.svc.cluster.local:3307
            - --mysqld.username=monitor
          env:
            - name: MYSQLD_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-cluster-secrets
                  key: monitor
          ports:
            - containerPort: 9104
              name: metrics
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "300m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-replica-exporter
  namespace: databases
  labels:
    app: mysql-replica-exporter
spec:
  selector:
    app: mysql-replica-exporter
  ports:
    - port: 9104
      targetPort: metrics
      name: metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-replica-exporter
  namespace: databases
spec:
  podSelector:
    matchLabels:
      app: mysql-replica-exporter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # VictoriaMetrics scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9104
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # MySQL replica via HAProxy reader backend (container port 3307)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: main-mysql
      ports:
        - protocol: TCP
          port: 3307

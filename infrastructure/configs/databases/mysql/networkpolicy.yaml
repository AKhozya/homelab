apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-cluster
  namespace: databases
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: main-mysql
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # MySQL port from app namespaces
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: home-assistant
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pricebuddy
      ports:
        - protocol: TCP
          port: 3306
    # Backup job (same namespace)
    - from:
        - podSelector:
            matchLabels:
              app: mysql-backup
      ports:
        - protocol: TCP
          port: 3306
    # Cluster internal communication (MySQL + HAProxy + Orchestrator)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: main-mysql
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 33060  # X Protocol
        - protocol: TCP
          port: 33062  # Admin port (HAProxy health checks)
        - protocol: TCP
          port: 3000   # Orchestrator HTTP API
        - protocol: TCP
          port: 10008  # Orchestrator Raft
    # Operator access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: percona-mysql
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 33060
        - protocol: TCP
          port: 33062
    # Monitoring from Prometheus (standalone mysql-exporter on port 9104)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9104  # MySQL exporter
    # MySQL exporter deployment access
    - from:
        - podSelector:
            matchLabels:
              app: mysql-exporter
      ports:
        - protocol: TCP
          port: 3306
    # Replica-side exporter → HAProxy reader backend (3307) for replication metrics
    - from:
        - podSelector:
            matchLabels:
              app: mysql-replica-exporter
      ports:
        - protocol: TCP
          port: 3307
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Cluster internal communication (MySQL + HAProxy + Orchestrator)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: main-mysql
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 33060  # X Protocol
        - protocol: TCP
          port: 33062  # Admin port
        - protocol: TCP
          port: 3000   # Orchestrator HTTP API
        - protocol: TCP
          port: 10008  # Orchestrator Raft
    # Kubernetes API — reached by ipBlock to the control-plane node on 6443, matching how
    # grafana, prometheus-operator and kube-state-metrics do it in this repo. NetworkPolicy
    # is evaluated after DNAT, so the Service ClusterIP 10.43.0.1:443 is not the address
    # that matches.
    # This REPLACES two rules that matched nothing: one selected namespace `default`
    # (which holds zero pods — the API is a Service, not a pod) and one selected namespace
    # `percona-mysql` on 443 (the ps-operator pod declares no container ports). Steady
    # state never needed them, but peer discovery during bootstrap or recovery can, and
    # "it works while running" is not evidence of restart safety.
    - to:
        - ipBlock:
            cidr: 192.168.1.127/32  # control-plane node
      ports:
        - protocol: TCP
          port: 6443

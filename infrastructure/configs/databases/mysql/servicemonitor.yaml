apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mysql-metrics
  namespace: databases
  labels:
    release: kube-prometheus-stack  # Required for Prometheus discovery
spec:
  selector:
    matchLabels:
      app: mysql-exporter
  namespaceSelector:
    matchNames:
      - databases
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 10s
      # Drop InnoDB compression metrics (~50 series, not using compressed tables)
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'mysql_info_schema_innodb_cmp.*'
          action: drop

apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
  namespace: databases
spec:
  schedule: "15 3 * * *"  # 3:15 AM UTC daily (after PostgreSQL backup at 3:00 AM)
  timeZone: "UTC"
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: mysql-backup
        spec:
          serviceAccountName: mysql-jobs
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          priorityClassName: homelab-batch
          securityContext:
            runAsUser: 999  # mysql user
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: setup-permissions
              image: alpine:3.24.2
              command:
                - sh
                - -c
                - |
                  mkdir -p /backup
                  chown -R 999:999 /backup
                  chmod 755 /backup
                  echo "Backup directory ready"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
              securityContext:
                runAsUser: 0  # Need root to chown
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                  add: ["CHOWN", "DAC_OVERRIDE"]
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
          containers:
            - name: backup
              # Keep the client on the server's 8.4 line (percona-server image in cluster.yaml):
              # a client older than the server can emit a dump the server won't reimport
              # cleanly. renovate.json limits this image to 8.4.x.
              image: mysql:8.4.11
              command:
                - /bin/bash
                - -c
                - |
                  set -eo pipefail

                  echo "=== MySQL Backup Started ==="
                  echo "Timestamp: $(date)"

                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_DIR="/backup/$TIMESTAMP"
                  mkdir -p "$BACKUP_DIR"
                  # backup-replication syncs every file under /backup. The NAS retention
                  # sweep matches dated mysql_*.tar.gz files by name and age, never a dump
                  # dir. A dump dir left by a failed run would stay on the NAS for ever, so the
                  # EXIT trap removes it. A SIGKILL (OOM kill, deadline) skips the trap and
                  # leaves the dir. The success path has already removed it by then.
                  trap 'rm -rf "$BACKUP_DIR"' EXIT

                  # MYSQL_PWD instead of -p<pass>: no password on the command line
                  # (visible in ps) and no "[Warning] Using a password..." on stderr.
                  export MYSQL_PWD="$MYSQL_PASSWORD"

                  # Auto-discover databases (exclude system databases)
                  echo "Discovering databases..."
                  DATABASES=$(mysql \
                    -h main-mysql-haproxy.databases.svc.cluster.local \
                    -P 3306 \
                    -u "$MYSQL_USER" \
                    -N -e "SHOW DATABASES" \
                    | grep -Ev "^(information_schema|mysql|performance_schema|sys)$")

                  echo "Found databases: $DATABASES"

                  # Backup each database. stderr goes to a sidecar .err file — NEVER
                  # into the .sql dump, where a single warning line breaks restore
                  # (`mysql db < dump.sql` chokes on line 1).
                  FAILED=0
                  for DB in $DATABASES; do
                    echo "Backing up database: $DB"
                    if mysqldump \
                      -h main-mysql-haproxy.databases.svc.cluster.local \
                      -P 3306 \
                      -u "$MYSQL_USER" \
                      --single-transaction \
                      --routines \
                      --triggers \
                      --events \
                      --set-gtid-purged=OFF \
                      "$DB" > "$BACKUP_DIR/${DB}.sql" 2> "$BACKUP_DIR/${DB}.err"; then
                      SIZE=$(du -h "$BACKUP_DIR/${DB}.sql" | cut -f1)
                      echo "✅ $DB backup completed ($SIZE)"
                      rm -f "$BACKUP_DIR/${DB}.err"
                    else
                      echo "❌ $DB backup failed!"
                      cat "$BACKUP_DIR/${DB}.err"
                      FAILED=1
                    fi
                  done

                  # Fail the Job before packaging: a partial dump must not become a
                  # "good" tarball. Yesterday's backup stays; BackupJobFailed fires.
                  if [ "$FAILED" -ne 0 ]; then
                    echo "❌ One or more database backups failed — aborting before packaging"
                    exit 1
                  fi

                  cat > "$BACKUP_DIR/MANIFEST.txt" <<EOF
                  MySQL Backup Manifest
                  Timestamp: $(date)
                  Backup ID: $TIMESTAMP
                  Databases: $DATABASES
                  Host: main-mysql-haproxy.databases.svc.cluster.local:3306

                  Backup Files:
                  $(ls -lh $BACKUP_DIR/*.sql 2>/dev/null || echo "No SQL files")

                  Total Size:
                  $(du -sh $BACKUP_DIR)
                  EOF

                  echo "Compressing backup with gzip..."
                  cd /backup
                  tar -czf "mysql_${TIMESTAMP}.tar.gz" "$TIMESTAMP"
                  COMPRESSED_SIZE=$(du -h "mysql_${TIMESTAMP}.tar.gz" | cut -f1)
                  echo "✅ Compressed backup: mysql_${TIMESTAMP}.tar.gz ($COMPRESSED_SIZE)"

                  echo "Generating SHA256 checksum for backup integrity..."
                  sha256sum "mysql_${TIMESTAMP}.tar.gz" > "mysql_${TIMESTAMP}.tar.gz.sha256"
                  echo "✅ Checksum saved: mysql_${TIMESTAMP}.tar.gz.sha256"
                  cat "mysql_${TIMESTAMP}.tar.gz.sha256"

                  rm -rf "$TIMESTAMP"

                  echo ""
                  echo "=== Current Backups ==="
                  ls -lh /backup/mysql_*.tar.gz 2>/dev/null || echo "No backups found"

                  echo ""
                  echo "=== Backup Complete ==="
                  echo "Backup ID: $TIMESTAMP"
                  echo "Location: /backup/mysql_${TIMESTAMP}.tar.gz"
                  echo "Size: $COMPRESSED_SIZE"
              env:
                - name: MYSQL_USER
                  value: "root"
                - name: MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mysql-cluster-secrets
                      key: root
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: false  # Need to write to /tmp for mysqldump
              resources:
                requests:
                  cpu: "200m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
          volumes:
            - name: backup-storage
              hostPath:
                path: /mnt/k8s-storage/backups/mysql
                type: DirectoryOrCreate
          nodeSelector:
            kubernetes.io/hostname: worker-node  # Run on worker node with storage

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Percona MySQL cluster config
  - serviceaccount.yaml          # main-mysql (cluster SA)
  - cluster-secrets.yaml
  - cluster.yaml
  - networkpolicy.yaml
  - exporter.yaml
  - pdb.yaml
  # Backup CronJob and the mysql-jobs ServiceAccount
  - jobs-serviceaccount.yaml     # mysql-jobs (backup CronJob and both exporters)
  - mysql-backup-cronjob.yaml

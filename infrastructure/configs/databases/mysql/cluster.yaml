apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: main-mysql
  namespace: databases
  finalizers:
    - percona.com/delete-mysql-pods-in-order
spec:
  # crVersion tracks the ps-operator chart minor. Renovate bumps the chart in
  # infrastructure/controllers/databases/mysql/helmrelease.yaml but not this value, so update
  # it manually with each chart minor. SmartUpdate rolls replicas first and the primary last.
  crVersion: "1.3.0"

  # Online volume expansion. The older spec.enableVolumeExpansion is deprecated.
  storageScaling:
    enableVolumeScaling: true

  # If operator backups are off, operator 1.3.0 rejects an async cluster that lacks this flag.
  # If operator backups are off, a failover cannot recover transactions left on the old primary.
  # mysql-backup-cronjob.yaml runs our backups. The other unsafe flags stay off: 2 MySQL pods,
  # 3 orchestrator pods and orchestrator.enabled all pass the CRD's checks without them.
  unsafeFlags:
    asyncFailoverWithPossibleDataLoss: true

  secretsName: mysql-cluster-secrets

  # SmartUpdate needs orchestrator.enabled=true for the async-replication failover.
  updateStrategy: SmartUpdate
  upgradeOptions:
    apply: disabled

  # Orchestrator drives async-replication failover. 3 pods so it keeps quorum at 2.
  orchestrator:
    enabled: true
    size: 3
    image: percona/percona-orchestrator:3.2.6-19
    imagePullPolicy: IfNotPresent
    serviceAccountName: main-mysql
    priorityClassName: homelab-critical
    # Pod-level seccomp baseline (require-seccomp-runtimedefault Kyverno policy)
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        # 7d p95 ~150m (2026-07-12); a 50m request left the node's CPU overcommitted.
        cpu: "160m"
        memory: "64Mi"
      limits:
        # A 500m limit throttled it on worker-node (2026-07-05).
        cpu: "750m"
        # 128Mi OOM-killed it during cluster recovery (2025-12-30).
        memory: "192Mi"
    # Distribute across all nodes including control plane
    affinity:
      antiAffinityTopologyKey: kubernetes.io/hostname
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    # orchestrator.configuration is not set. If you add it, it takes a JSON object string.
    # The operator merges it into the orchestrator ConfigMap but silently skips the keys it
    # owns (RaftNodes, TLS paths, failover hooks), and from crVersion 1.3.0 also the failover
    # gates such as FailMasterPromotionOnLagMinutes: reservedOrchestratorConfigKeys and
    # failoverConfigKeys in pkg/orchestrator/orchestrator.go, tag v1.3.0 of
    # https://github.com/percona/percona-server-mysql-operator

  # Backup configuration (required even if not using backups)
  backup:
    enabled: false
    # XtraBackup major must match the server's: a 9.x binary cannot back up 8.4.
    image: percona/percona-xtrabackup:8.4.0-7.1
    imagePullPolicy: IfNotPresent

  # Toolkit sidecar (required for MySQL pods)
  toolkit:
    image: percona/percona-toolkit:3.7.2
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "10m"
        memory: "32Mi"
      limits:
        cpu: "100m"
        # pt-heartbeat peaks at 52Mi, above ContainerMemoryNearLimit's 80% line at a 64Mi limit.
        memory: "96Mi"

  mysql:
    clusterType: async
    autoRecovery: true
    size: 2
    gracePeriod: 30
    # Stay on 8.4 LTS: a 9.x pod cannot clone from an 8.4 donor (error 3864), which caused the
    # 2026-08-05 crashloop. Operator 1.3.0 supports 9.7. The clone restriction still applies.
    image: percona/percona-server:8.4.11-11.1
    imagePullPolicy: IfNotPresent
    serviceAccountName: main-mysql
    priorityClassName: homelab-critical
    # Pod-level seccomp baseline (require-seccomp-runtimedefault Kyverno policy)
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault

    # These three do nothing from crVersion 1.3.0 (operator source, tag v1.3.0):
    # - the operator sets BOOTSTRAP_CLONE_STALL_TIMEOUT=900. If that variable is set, the bootstrap
    #   ignores BOOTSTRAP_CLONE_TIMEOUT, and a clone aborts only if it makes no progress for 900s.
    # - BOOTSTRAP_READ_TIMEOUT equals the default of 3600.
    # - nothing reads BOOTSTRAP_WRITE_TIMEOUT.
    # Removing them changes the pod template and restarts MySQL, so remove them together with
    # the next change that restarts MySQL anyway.
    env:
      - name: BOOTSTRAP_CLONE_TIMEOUT
        value: "7200"
      - name: BOOTSTRAP_READ_TIMEOUT
        value: "3600"
      - name: BOOTSTRAP_WRITE_TIMEOUT
        value: "3600"

    # The default failureThreshold of 3 restarts the pod mid-recovery, so readiness and
    # liveness both run at 6. The startupProbe buys its time from a very long timeout instead.
    startupProbe:
      failureThreshold: 1
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 43200  # 12 hours for clone operations
    readinessProbe:
      failureThreshold: 6
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
    livenessProbe:
      failureThreshold: 6
      initialDelaySeconds: 300  # 5 min - allow time for recovery
      periodSeconds: 10
      timeoutSeconds: 5

    podDisruptionBudget:
      minAvailable: 1

    # MySQL 8.4 base memory is about 400-500MB, plus the 256MB buffer pool set in
    # configuration below. The 1536Mi limit leaves headroom above that.
    resources:
      requests:
        cpu: "100m"
        memory: "896Mi"  # 7d p95 working set ~860Mi (2026-07-12)
      limits:
        cpu: "1000m"
        memory: "1536Mi"

    affinity:
      antiAffinityTopologyKey: kubernetes.io/hostname

    exposePrimary:
      enabled: true
      type: ClusterIP

    volumeSpec:
      persistentVolumeClaim:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
        storageClassName: local-path

    configuration: |
      [mysqld]
      max_connections=100
      # 79MB is cached; 256MB gives 3x headroom. 512MB triggers memory-pressure alerts.
      innodb_buffer_pool_size=256M
      innodb_buffer_pool_instances=1
      slow_query_log=ON
      long_query_time=2
      innodb_redo_log_capacity=64M
      # 7 days of binlog, several times the daily backup interval.
      binlog_expire_logs_seconds=604800
      # Prevent stale replication threads after node restart (operator bug workaround)
      # Without this, the primary retains replica config from PVC and starts SQL thread,
      # causing HAProxy health check to reject it as primary (<NOSRV>)
      # Orchestrator handles START REPLICA on the actual replica
      # Underscores and a value: from crVersion 1.3.0 the operator runs SET GLOBAL for every key, and a
      # dashed name fails every reconcile. If this read-only variable already holds ON, the operator
      # skips the restart.
      skip_replica_start=ON

  # HAProxy for connection routing (required for async replication)
  proxy:
    haproxy:
      enabled: true
      size: 2
      image: percona/haproxy:3.4.7
      imagePullPolicy: IfNotPresent
      serviceAccountName: main-mysql
      priorityClassName: homelab-critical
      # Pod-level seccomp baseline (require-seccomp-runtimedefault Kyverno policy)
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      gracePeriod: 30

      resources:
        requests:
          # 7d p95 ~150m under replication traffic (2026-07-12).
          cpu: "160m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "128Mi"

      # The operator's template gives mysql-monit no limits. Without these values it gets
      # the databases LimitRange defaults (1 CPU/1Gi) at admission, and
      # require-resource-limits flags the template. It is a light health-check loop, so
      # the values are small.
      sidecarResources:
        mysql-monit:
          requests:
            cpu: "20m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"

      affinity:
        antiAffinityTopologyKey: kubernetes.io/hostname

    # Router disabled (only works with group-replication)
    router:
      enabled: false
      size: 0
      image: percona/percona-mysql-router:8.4.11

apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: main-mysql
  namespace: databases
  finalizers:
    - percona.com/delete-mysql-pods-in-order
spec:
  # crVersion tracks the ps-operator chart minor (bumped from 1.0.0 on 2026-07-03).
  # SmartUpdate rolls replicas first and the primary last; the PDB (minAvailable: 1)
  # holds HA through the roll.
  crVersion: "1.2.0"

  # Online volume expansion. The older spec.enableVolumeExpansion was deprecated in
  # operator 1.2.0 and is removed in 1.5.0.
  storageScaling:
    enableVolumeScaling: true

  # unsafeFlags permit the 2-node MySQL cluster below, under the operator's 3-node
  # minimum. Deliberate for a homelab.
  unsafeFlags:
    mysqlSize: true
    orchestrator: true
    orchestratorSize: true

  secretsName: mysql-cluster-secrets

  # SmartUpdate needs orchestrator.enabled=true for the async-replication failover.
  updateStrategy: SmartUpdate
  upgradeOptions:
    apply: disabled

  # Orchestrator drives async-replication failover. 3 pods so it keeps quorum at 2.
  orchestrator:
    enabled: true
    size: 3
    image: percona/percona-orchestrator:3.2.6-19
    imagePullPolicy: IfNotPresent
    serviceAccountName: main-mysql
    priorityClassName: homelab-critical
    # Pod-level seccomp baseline (require-seccomp-runtimedefault Kyverno policy)
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        # Raised 50m->160m (2026-07-12) - 7d p95 ~150m, chronic CPU overcommit
        cpu: "160m"
        memory: "64Mi"
      limits:
        # Increased from 500m to 750m (2026-07-05) - CPU throttling on worker-node
        cpu: "750m"
        # Increased from 128Mi to 192Mi (2025-12-30) - OOM during cluster recovery
        memory: "192Mi"
    # Distribute across all nodes including control plane
    affinity:
      antiAffinityTopologyKey: kubernetes.io/hostname
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    # orchestrator.configuration exists in the CRD but the operator does not implement it
    # (last checked on operator 1.0.0), so custom orchestrator settings cannot be applied.
    # See: https://github.com/percona/percona-server-mysql-operator

  # Backup configuration (required even if not using backups)
  backup:
    enabled: false
    # XtraBackup major must match the server's: a 9.x binary cannot back up 8.4.
    # Inert while enabled=false, but wrong-by-default is a trap for whoever flips it.
    image: percona/percona-xtrabackup:8.4.0-6.1
    imagePullPolicy: IfNotPresent

  # Toolkit sidecar (required for MySQL pods)
  toolkit:
    image: percona/percona-toolkit:3.7.1
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "10m"
        memory: "32Mi"
      limits:
        cpu: "100m"
        memory: "64Mi"

  mysql:
    clusterType: async
    autoRecovery: true
    size: 2
    # Grace period for draining connections during rolling updates
    gracePeriod: 30
    # Stay on the 8.4 LTS line: ps-operator 1.2.0 supports 8.0/8.4 only, and a 9.x
    # pod cannot clone from an 8.4 donor (error 3864) — cause of the 2026-08-05 crashloop.
    image: percona/percona-server:8.4.10-10.1
    imagePullPolicy: IfNotPresent
    serviceAccountName: main-mysql
    priorityClassName: homelab-critical
    # Pod-level seccomp baseline (require-seccomp-runtimedefault Kyverno policy)
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault

    # Longer than the defaults: a large clone hits "query interrupted" at the stock timeouts.
    env:
      - name: BOOTSTRAP_CLONE_TIMEOUT
        value: "7200"  # 2 hours (default 3600s, increased for stability)
      - name: BOOTSTRAP_READ_TIMEOUT
        value: "3600"
      - name: BOOTSTRAP_WRITE_TIMEOUT
        value: "3600"

    # The default failureThreshold of 3 restarts the pod mid-recovery, so readiness and
    # liveness both run at 6. The startupProbe buys its time from a very long timeout instead.
    startupProbe:
      failureThreshold: 1
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 43200  # 12 hours for clone operations
    readinessProbe:
      failureThreshold: 6     # Increased from 3 - more tolerance during recovery
      initialDelaySeconds: 30
      periodSeconds: 10       # Increased from 5 - less aggressive probing
      timeoutSeconds: 5
    livenessProbe:
      failureThreshold: 6     # Increased from 3 - prevent premature kills
      initialDelaySeconds: 300  # 5 min - allow time for recovery
      periodSeconds: 10
      timeoutSeconds: 5

    podDisruptionBudget:
      minAvailable: 1

    # Resources - optimized for homelab (10MB actual data)
    # MySQL 8.4 base memory ~400-500MB + 512MB buffer pool = ~1GB typical
    # 1.5GB limit gives ~500MB headroom for growth
    resources:
      requests:
        cpu: "100m"
        memory: "896Mi"  # 7d p95 working set ~860Mi (2026-07-12)
      limits:
        cpu: "1000m"
        memory: "1536Mi"

    affinity:
      antiAffinityTopologyKey: kubernetes.io/hostname

    exposePrimary:
      enabled: true
      type: ClusterIP

    volumeSpec:
      persistentVolumeClaim:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
        storageClassName: local-path

    configuration: |
      [mysqld]
      max_connections=100
      # Buffer pool right-sized: only 79MB actually cached, 256MB is 3x headroom
      # Reduced from 512MB to eliminate memory pressure alerts
      innodb_buffer_pool_size=256M
      innodb_buffer_pool_instances=1
      # Slow query logging for performance debugging
      slow_query_log=ON
      long_query_time=2
      # Redo log - 64MB is sufficient for light workload
      innodb_redo_log_capacity=64M
      # Binlog retention - 7 days sufficient for homelab with daily backups
      binlog_expire_logs_seconds=604800
      # Prevent stale replication threads after node restart (operator bug workaround)
      # Without this, the primary retains replica config from PVC and starts SQL thread,
      # causing HAProxy health check to reject it as primary (<NOSRV>)
      # Orchestrator handles START REPLICA on the actual replica
      skip-replica-start

  # HAProxy for connection routing (required for async replication)
  proxy:
    haproxy:
      enabled: true
      size: 2
      image: percona/haproxy:2.8.26
      imagePullPolicy: IfNotPresent
      serviceAccountName: main-mysql
      priorityClassName: homelab-critical
      # Pod-level seccomp baseline (require-seccomp-runtimedefault Kyverno policy)
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      # Grace period for draining connections during rolling updates
      gracePeriod: 30

      resources:
        requests:
          # Raised 50m->160m (2026-07-12) - 7d p95 ~150m under replication traffic
          cpu: "160m"
          memory: "64Mi"
        limits:
          # Raised 300m->500m (2026-01-11); retained as burst headroom for MySQL
          cpu: "500m"
          memory: "128Mi"

      # mysql-monit sidecar previously ran on databases-ns LimitRange defaults (1 CPU/1Gi
      # injected at pod admission) — template itself had no limits, which the CEL
      # ValidatingPolicy flags at controller level (the retired ClusterPolicy never did:
      # selector-based excludes suppress Kyverno autogen). Explicit modest values; it is
      # a lightweight health-check loop (right-sizing pass 2026-07-06 may tune further).
      sidecarResources:
        mysql-monit:
          requests:
            cpu: "20m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"

      # Anti-affinity for HA - spread across nodes
      affinity:
        antiAffinityTopologyKey: kubernetes.io/hostname

    # Router disabled (only works with group-replication)
    router:
      enabled: false
      size: 0
      image: percona/percona-mysql-router:8.4.10

apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: main-mysql
  namespace: databases
  finalizers:
    - percona.com/delete-mysql-pods-in-order
spec:
  crVersion: "1.0.0"

  # Enable dynamic storage expansion without downtime
  enableVolumeExpansion: true

  # Allow 2 replicas and simplified orchestrator (homelab setup)
  unsafeFlags:
    mysqlSize: true
    orchestrator: true
    orchestratorSize: true

  # Secrets for credentials
  secretsName: mysql-cluster-secrets

  # Update strategy: SmartUpdate for zero-downtime (updates replicas first, primary last)
  # Requires orchestrator.enabled=true for async replication
  updateStrategy: SmartUpdate
  upgradeOptions:
    apply: disabled

  # Orchestrator for async replication failover (3 for quorum on all nodes)
  orchestrator:
    enabled: true
    size: 3
    image: percona/percona-orchestrator:3.2.6-19
    imagePullPolicy: IfNotPresent
    serviceAccountName: main-mysql
    priorityClassName: homelab-critical  # critical tier
    # Pod-level seccomp baseline (require-seccomp-runtimedefault Kyverno policy)
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        # Increased from 300m to 500m (2026-01-11) - CPU throttling during rebuilderd load
        cpu: "500m"
        # Increased from 128Mi to 192Mi (2025-12-30) - OOM during cluster recovery
        memory: "192Mi"
    # Distribute across all nodes including control plane
    affinity:
      antiAffinityTopologyKey: kubernetes.io/hostname
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    # NOTE: orchestrator.configuration field exists in CRD but is not implemented
    # by the operator (v1.0.0). Custom orchestrator settings cannot be applied.
    # See: https://github.com/percona/percona-server-mysql-operator

  # Backup configuration (required even if not using backups)
  backup:
    enabled: false
    image: percona/percona-xtrabackup:8.4.0-6.1
    imagePullPolicy: IfNotPresent

  # Toolkit sidecar (required for MySQL pods)
  toolkit:
    image: percona/percona-toolkit:3.7.1
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "10m"
        memory: "32Mi"
      limits:
        cpu: "100m"
        memory: "64Mi"

  # MySQL cluster configuration
  mysql:
    clusterType: async
    autoRecovery: true
    size: 2
    # Grace period for draining connections during rolling updates
    gracePeriod: 30
    image: percona/percona-server:8.4.10-10.1
    imagePullPolicy: IfNotPresent
    serviceAccountName: main-mysql
    priorityClassName: homelab-critical  # critical tier (primary DB)
    # Pod-level seccomp baseline (require-seccomp-runtimedefault Kyverno policy)
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault

    # Environment variables for longer timeouts during clone/recovery
    # These prevent "query interrupted" errors during large data transfers
    env:
      - name: BOOTSTRAP_CLONE_TIMEOUT
        value: "7200"  # 2 hours (default 3600s, increased for stability)
      - name: BOOTSTRAP_READ_TIMEOUT
        value: "3600"  # 1 hour (explicit setting)
      - name: BOOTSTRAP_WRITE_TIMEOUT
        value: "3600"  # 1 hour (explicit setting)

    # Probe configurations - more lenient to handle recovery scenarios
    # Default failureThreshold=3 causes premature restarts during recovery
    startupProbe:
      failureThreshold: 1
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 43200  # 12 hours for clone operations
    readinessProbe:
      failureThreshold: 6     # Increased from 3 - more tolerance during recovery
      initialDelaySeconds: 30
      periodSeconds: 10       # Increased from 5 - less aggressive probing
      timeoutSeconds: 5
    livenessProbe:
      failureThreshold: 6     # Increased from 3 - prevent premature kills
      initialDelaySeconds: 300  # 5 min - allow time for recovery
      periodSeconds: 10
      timeoutSeconds: 5

    # PodDisruptionBudget - ensure at least 1 replica during maintenance
    podDisruptionBudget:
      minAvailable: 1

    # Resources - optimized for homelab (10MB actual data)
    # MySQL 8.4 base memory ~400-500MB + 512MB buffer pool = ~1GB typical
    # 1.5GB limit gives ~500MB headroom for growth
    resources:
      requests:
        cpu: "100m"
        memory: "768Mi"
      limits:
        cpu: "1000m"
        memory: "1536Mi"

    # Anti-affinity for HA
    affinity:
      antiAffinityTopologyKey: kubernetes.io/hostname

    # Expose primary service
    exposePrimary:
      enabled: true
      type: ClusterIP

    # Storage
    volumeSpec:
      persistentVolumeClaim:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
        storageClassName: local-path

    # MySQL configuration
    configuration: |
      [mysqld]
      max_connections=100
      # Buffer pool right-sized: only 79MB actually cached, 256MB is 3x headroom
      # Reduced from 512MB to eliminate memory pressure alerts
      innodb_buffer_pool_size=256M
      innodb_buffer_pool_instances=1
      # Slow query logging for performance debugging
      slow_query_log=ON
      long_query_time=2
      # Redo log - 64MB is sufficient for light workload
      innodb_redo_log_capacity=64M
      # Binlog retention - 7 days sufficient for homelab with daily backups
      binlog_expire_logs_seconds=604800
      # Prevent stale replication threads after node restart (operator bug workaround)
      # Without this, the primary retains replica config from PVC and starts SQL thread,
      # causing HAProxy health check to reject it as primary (<NOSRV>)
      # Orchestrator handles START REPLICA on the actual replica
      skip-replica-start

  # HAProxy for connection routing (required for async replication)
  proxy:
    haproxy:
      enabled: true
      size: 2
      image: percona/haproxy:2.8.18
      imagePullPolicy: IfNotPresent
      serviceAccountName: main-mysql
      priorityClassName: homelab-critical  # critical tier (DB front)
      # Pod-level seccomp baseline (require-seccomp-runtimedefault Kyverno policy)
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      # Grace period for draining connections during rolling updates
      gracePeriod: 30

      # Resources for HAProxy (actual usage ~25-35m CPU, ~25-35Mi memory)
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          # Increased from 300m to 500m (2026-01-11) - CPU throttling during rebuilderd load
          cpu: "500m"
          memory: "128Mi"

      # Anti-affinity for HA - spread across nodes
      affinity:
        antiAffinityTopologyKey: kubernetes.io/hostname

    # Router disabled (only works with group-replication)
    router:
      enabled: false
      size: 0
      image: percona/percona-mysql-router:8.4.10

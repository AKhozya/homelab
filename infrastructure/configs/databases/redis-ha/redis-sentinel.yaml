apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: redis-sentinel
  namespace: databases
spec:
  clusterSize: 3
  serviceAccountName: redis-sentinel
  priorityClassName: homelab-critical  # critical tier (Redis failover quorum)
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    capabilities:
      drop: ["ALL"]
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: redis-sentinel-sentinel
  pdb:
    enabled: true
    minAvailable: 2
  redisSentinelConfig:
    redisReplicationName: redis-replication
    quorum: "2"
    parallelSyncs: "1"
    failoverTimeout: "10000"
    downAfterMilliseconds: "5000"
    redisReplicationPassword:
      secretKeyRef:
        name: redis-passwords
        key: admin-password
  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v8.10.1
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "10m"
        memory: "32Mi"
      limits:
        cpu: "300m"
        memory: "64Mi"

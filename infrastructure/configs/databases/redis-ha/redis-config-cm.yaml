apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-ha-config
  namespace: databases
data:
  redis-additional.conf: |
    save 60 1
    maxmemory 480mb
    maxmemory-policy noeviction
    loglevel warning
    protected-mode no
    # masterauth alone sends a one-argument AUTH, which binds replication to the `default` user.
    # masteruser makes the replica log in as `admin`, so the link does not depend on `default`.
    masteruser admin

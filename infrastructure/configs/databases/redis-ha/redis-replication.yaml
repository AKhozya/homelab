apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: redis-replication
  namespace: databases
spec:
  clusterSize: 2
  serviceAccountName: redis-replication
  priorityClassName: homelab-critical  # critical tier (in-memory DB)
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    capabilities:
      drop: ["ALL"]
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - worker-node
                  - worker-node-2
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: redis-replication
  kubernetesConfig:
    image: quay.io/opstree/redis:v8.10.1
    imagePullPolicy: IfNotPresent
    # The operator, its probe and the exporter log in to the ACL `default` user with this
    # password. Replicas send it as masterauth for the `admin` user (masteruser in
    # redis-ha-config). The `default` and `admin` lines in redis-acl-secret must hold the same
    # value: if they differ, the ACL file wins.
    redisSecret:
      name: redis-passwords
      key: admin-password
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "400m"
        memory: "512Mi"
  redisConfig:
    additionalRedisConfig: redis-ha-config
  acl:
    secret:
      secretName: redis-acl-secret
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.89.0
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "10m"
        memory: "32Mi"
      limits:
        cpu: "300m"
        memory: "64Mi"
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
  pdb:
    enabled: true
    minAvailable: 1

apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-replication
  namespace: backup-replication
spec:
  # Run at 4:00 AM daily (after all backups complete at 3:00-3:15 AM)
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200  # 2 hour timeout
      template:
        metadata:
          labels:
            app: backup-replication
        spec:
          serviceAccountName: backup-replication
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          # Run on worker-node (source of backups)
          nodeSelector:
            kubernetes.io/hostname: worker-node
          securityContext:
            # Run as root to install rsync/ssh and access backup files
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rsync
              image: alpine:3.23
              env:
                - name: NAS_RSYNC_USER
                  valueFrom:
                    secretKeyRef:
                      name: nas-rsync-credentials
                      key: rsync-user
                - name: NAS_RSYNC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nas-rsync-credentials
                      key: rsync-password
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "=== Backup Replication Started: $(date) ==="

                  # Install rsync and openssh
                  apk add --no-cache rsync openssh-client

                  # Setup SSH for worker-node-2
                  mkdir -p ~/.ssh
                  cp /ssh-key/ssh-private-key ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -p 65300 192.168.1.126 >> ~/.ssh/known_hosts 2>/dev/null

                  # Setup NAS rsync password file
                  printf '%s' "$NAS_RSYNC_PASSWORD" > /tmp/nas-rsync-pass
                  chmod 600 /tmp/nas-rsync-pass

                  # Check backup size against NAS 500GB limit and auto-prune at 370GB
                  BACKUP_SIZE_KB=$(du -sk /source-backups/ 2>/dev/null | cut -f1)
                  BACKUP_SIZE_GB=$((BACKUP_SIZE_KB / 1048576))
                  echo "=== Source Backups (${BACKUP_SIZE_GB}GB / 500GB NAS limit) ==="
                  du -sh /source-backups/*/ 2>/dev/null || echo "No backups found"

                  # Auto-prune oldest backups when >370GB (74% of 500GB)
                  PRUNE_THRESHOLD_KB=388070400  # 370GB in KB
                  if [ "$BACKUP_SIZE_KB" -gt "$PRUNE_THRESHOLD_KB" ]; then
                    echo ""
                    echo "=== Auto-pruning: ${BACKUP_SIZE_GB}GB exceeds 370GB threshold ==="
                    # Find and remove oldest date-stamped directories across all backup types
                    while [ "$BACKUP_SIZE_KB" -gt "$PRUNE_THRESHOLD_KB" ]; do
                      OLDEST=$(find /source-backups -maxdepth 2 -mindepth 2 -type d -name '[0-9]*_[0-9]*' | sort | head -1)
                      if [ -z "$OLDEST" ]; then
                        echo "No more directories to prune"
                        break
                      fi
                      OLDEST_SIZE=$(du -sh "$OLDEST" 2>/dev/null | cut -f1)
                      echo "Pruning: $OLDEST ($OLDEST_SIZE)"
                      rm -rf "$OLDEST"
                      # Also remove matching .tar.gz files (postgres/couchdb/mysql top-level archives)
                      BASENAME=$(basename "$OLDEST")
                      PARENT=$(dirname "$OLDEST")
                      PARENT_NAME=$(basename "$PARENT")
                      rm -f "${PARENT}/${PARENT_NAME}_${BASENAME}"*.tar.gz*
                      BACKUP_SIZE_KB=$(du -sk /source-backups/ 2>/dev/null | cut -f1)
                      BACKUP_SIZE_GB=$((BACKUP_SIZE_KB / 1048576))
                    done
                    echo "After pruning: ${BACKUP_SIZE_GB}GB"
                  fi

                  if [ "$BACKUP_SIZE_KB" -gt 461373440 ]; then
                    echo "CRITICAL: Backup size ${BACKUP_SIZE_GB}GB exceeds 440GB after pruning!"
                    echo "ACTION REQUIRED: Increase NAS quota or reduce backup scope."
                  elif [ "$BACKUP_SIZE_KB" -gt 419430400 ]; then
                    echo "WARNING: Backup size ${BACKUP_SIZE_GB}GB exceeds 400GB (80% of 500GB NAS limit)."
                  fi

                  # Rsync to worker-node-2
                  echo ""
                  echo "=== Starting rsync to worker-node-2 ==="
                  rsync -avz --delete \
                    --exclude='*.tmp' \
                    --exclude='.*.swp' \
                    -e "ssh -p 65300 -o StrictHostKeyChecking=no" \
                    /source-backups/ \
                    z3us@192.168.1.126:/mnt/extra-storage/backups/

                  echo ""
                  echo "=== Verifying worker-node-2 ==="
                  ssh -p 65300 z3us@192.168.1.126 "du -sh /mnt/extra-storage/backups/*/ 2>/dev/null || echo 'Verification failed'"

                  # Rsync to NAS (Zettlab 6 Ultra)
                  # TODO: Remove worker-node-2 replication after 1 week of successful NAS backups (~Feb 13, 2026)
                  echo ""
                  echo "=== Starting rsync to NAS ==="
                  rsync -avz --delete \
                    --exclude='*.tmp' \
                    --exclude='.*.swp' \
                    --port=50555 \
                    --password-file=/tmp/nas-rsync-pass \
                    /source-backups/ \
                    "rsync://${NAS_RSYNC_USER}@192.168.1.136/akhozya/backups/homelab/"

                  echo ""
                  echo "=== Verifying NAS ==="
                  RSYNC_PASSWORD="$NAS_RSYNC_PASSWORD" rsync --port=50555 -r --list-only \
                    "rsync://${NAS_RSYNC_USER}@192.168.1.136/akhozya/backups/homelab/" 2>/dev/null \
                    | head -20 || echo "NAS verification failed"

                  rm -f /tmp/nas-rsync-pass
                  echo ""
                  echo "=== Backup Replication Completed: $(date) ==="
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
              volumeMounts:
                - name: source-backups
                  mountPath: /source-backups
                - name: ssh-key
                  mountPath: /ssh-key
                  readOnly: true
          volumes:
            - name: source-backups
              hostPath:
                path: /mnt/k8s-storage/backups
                type: Directory
            - name: ssh-key
              secret:
                secretName: backup-replication-ssh-key
                defaultMode: 0400

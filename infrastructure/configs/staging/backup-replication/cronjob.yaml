apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-replication
  namespace: backup-replication
spec:
  # Run at 4:00 AM daily (after all backups complete at 3:00-3:15 AM)
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200  # 2 hour timeout
      template:
        metadata:
          labels:
            app: backup-replication
        spec:
          serviceAccountName: backup-replication
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          # Run on worker-node (source of backups)
          nodeSelector:
            kubernetes.io/hostname: worker-node
          securityContext:
            # Run as root to install rsync/ssh and access backup files
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rsync
              image: alpine:3.23
              env:
                - name: NAS_RSYNC_USER
                  valueFrom:
                    secretKeyRef:
                      name: nas-rsync-credentials
                      key: rsync-user
                - name: NAS_RSYNC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nas-rsync-credentials
                      key: rsync-password
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "=== Backup Replication Started: $(date) ==="

                  # Install rsync and openssh
                  apk add --no-cache rsync openssh-client

                  # Setup SSH for worker-node-2
                  mkdir -p ~/.ssh
                  cp /ssh-key/ssh-private-key ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -p 65300 192.168.1.126 >> ~/.ssh/known_hosts 2>/dev/null

                  SSH_CMD="ssh -p 65300 -o StrictHostKeyChecking=no z3us@192.168.1.126"

                  # Show source backup status
                  echo "=== Source Backups ==="
                  du -sh /source-backups/*/ 2>/dev/null || echo "No backups found"

                  # Step 1: Sync to worker-node-2 (no --delete, accumulate history)
                  echo ""
                  echo "=== Step 1: Syncing to worker-node-2 ==="
                  rsync -avz \
                    --exclude='*.tmp' \
                    --exclude='.*.swp' \
                    -e "ssh -p 65300 -o StrictHostKeyChecking=no" \
                    /source-backups/ \
                    z3us@192.168.1.126:/mnt/extra-storage/backups/

                  # Step 2: Prune worker-node-2 if approaching 500GB NAS hard limit
                  # Worker-node-2 is the backup accumulator; NAS mirrors it
                  echo ""
                  echo "=== Step 2: Checking backup size / pruning ==="
                  $SSH_CMD bash -s << 'PRUNE_SCRIPT'
                  BACKUP_DIR="/mnt/extra-storage/backups"
                  HARD_LIMIT_KB=524288000
                  WARN_KB=419430400
                  CRIT_KB=471859200
                  TOTAL_KB=$(du -sk "$BACKUP_DIR" 2>/dev/null | cut -f1)
                  TOTAL_GB=$((TOTAL_KB / 1048576))
                  echo "Backup size: ${TOTAL_GB}GB / 500GB NAS limit"
                  du -sh "$BACKUP_DIR"/*/ 2>/dev/null

                  while [ "$TOTAL_KB" -gt "$HARD_LIMIT_KB" ]; do
                    OLDEST_DATE=$(find "$BACKUP_DIR" -maxdepth 2 \( -type d -o -type f \) -name '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_*' 2>/dev/null | sed 's/.*\///' | grep -oE '^[0-9]{8}' | sort -u | head -1)
                    if [ -z "$OLDEST_DATE" ]; then
                      echo "ERROR: No more backups to prune but still over 500GB!"
                      break
                    fi
                    echo "Pruning backups from: $OLDEST_DATE"
                    find "$BACKUP_DIR" -maxdepth 2 -mindepth 2 -type d -name "${OLDEST_DATE}_*" -exec rm -rf {} + 2>/dev/null
                    find "$BACKUP_DIR" -maxdepth 2 -type f -name "*_${OLDEST_DATE}_*" -delete 2>/dev/null
                    TOTAL_KB=$(du -sk "$BACKUP_DIR" 2>/dev/null | cut -f1)
                    TOTAL_GB=$((TOTAL_KB / 1048576))
                    echo "After pruning: ${TOTAL_GB}GB"
                  done

                  if [ "$TOTAL_KB" -gt "$CRIT_KB" ]; then
                    echo "CRITICAL: Backup size ${TOTAL_GB}GB exceeds 450GB!"
                  elif [ "$TOTAL_KB" -gt "$WARN_KB" ]; then
                    echo "WARNING: Backup size ${TOTAL_GB}GB exceeds 400GB."
                  fi
                  PRUNE_SCRIPT

                  # Step 3: Sync worker-node-2 → NAS (with --delete, NAS mirrors pruned worker-node-2)
                  # TODO: Remove worker-node-2 step after 1 week of successful NAS backups (~Feb 13, 2026)
                  echo ""
                  echo "=== Step 3: Syncing worker-node-2 → NAS ==="
                  $SSH_CMD "RSYNC_PASSWORD='$NAS_RSYNC_PASSWORD' rsync -avz --delete \
                    --exclude='*.tmp' --exclude='.*.swp' \
                    --port=50555 \
                    /mnt/extra-storage/backups/ \
                    'rsync://$NAS_RSYNC_USER@192.168.1.136/akhozya/backups/homelab/'"

                  # Step 4: Verify NAS
                  echo ""
                  echo "=== Step 4: Verifying NAS ==="
                  RSYNC_PASSWORD="$NAS_RSYNC_PASSWORD" rsync --port=50555 -r --list-only \
                    "rsync://${NAS_RSYNC_USER}@192.168.1.136/akhozya/backups/homelab/" 2>/dev/null \
                    | head -20 || echo "NAS verification failed"

                  # Step 5: Clean source on worker-node (data is on worker-node-2 + NAS)
                  echo ""
                  echo "=== Step 5: Cleaning source backups ==="
                  rm -rf /source-backups/postgres/* /source-backups/couchdb/* /source-backups/mysql/* /source-backups/pvc/*
                  echo "Source cleaned (data on worker-node-2 + NAS)"

                  echo ""
                  echo "=== Backup Replication Completed: $(date) ==="
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
              volumeMounts:
                - name: source-backups
                  mountPath: /source-backups
                - name: ssh-key
                  mountPath: /ssh-key
                  readOnly: true
          volumes:
            - name: source-backups
              hostPath:
                path: /mnt/k8s-storage/backups
                type: Directory
            - name: ssh-key
              secret:
                secretName: backup-replication-ssh-key
                defaultMode: 0400

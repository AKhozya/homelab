apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-update-extensions
  namespace: databases
  labels:
    app: postgres-update-extensions
spec:
  # Run every Sunday at 6 AM UTC
  schedule: "0 6 * * 0"
  timeZone: "UTC"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: postgres-update-extensions
        spec:
          serviceAccountName: postgres-jobs
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: update-extensions
              image: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
              command:
                - /bin/sh
                - -c
                - |
                  set -e

                  echo "Updating PostgreSQL extensions in immich database..."

                  # Update all extensions in immich database using postgres-admin
                  psql -h main-postgres-rw -U postgres-admin -d immich <<-EOSQL
                      DO \$\$
                      DECLARE
                        ext RECORD;
                      BEGIN
                        FOR ext IN
                          SELECT extname, extversion
                          FROM pg_extension
                          WHERE extname != 'plpgsql'
                          ORDER BY extname
                        LOOP
                          BEGIN
                            EXECUTE format('ALTER EXTENSION %I UPDATE', ext.extname);
                            RAISE NOTICE 'Updated extension: % (was version: %)', ext.extname, ext.extversion;
                          EXCEPTION
                            WHEN OTHERS THEN
                              RAISE NOTICE 'Extension % already at latest version', ext.extname;
                          END;
                        END LOOP;
                      END
                      \$\$;

                      -- Show updated versions
                      SELECT extname, extversion
                      FROM pg_extension
                      WHERE extname != 'plpgsql'
                      ORDER BY extname;
                  EOSQL

                  echo "✅ Finished updating extensions in immich database!"
              env:
                # PGPASSWORD for postgres-admin superuser
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-admin-user
                      key: password
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 26
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}

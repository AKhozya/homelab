apiVersion: batch/v1
kind: Job
metadata:
  name: immich-init-extensions
  namespace: databases
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    metadata:
      labels:
        app: immich-init-extensions
    spec:
      serviceAccountName: postgres-jobs
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init-extensions
          image: ghcr.io/cloudnative-pg/postgresql:18.3-standard-trixie
          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "Waiting for PostgreSQL cluster to be ready..."
              MAX_RETRIES=60
              RETRY_COUNT=0

              # First wait for PostgreSQL cluster to be accessible
              until psql -h main-postgres-rw -U postgres-admin -d postgres -c '\q' 2>/dev/null; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                  echo "ERROR: PostgreSQL cluster not accessible after ${MAX_RETRIES} attempts"
                  exit 1
                fi
                echo "Waiting for PostgreSQL cluster (attempt $RETRY_COUNT/$MAX_RETRIES)..."
                sleep 2
              done

              echo "PostgreSQL cluster is accessible. Waiting for immich database..."
              RETRY_COUNT=0

              # Wait for immich database to exist (created by Database CRD)
              until psql -h main-postgres-rw -U postgres-admin -d postgres -c "SELECT 1 FROM pg_database WHERE datname='immich'" | grep -q 1 2>/dev/null; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                  echo "ERROR: Database 'immich' not created after ${MAX_RETRIES} attempts"
                  exit 1
                fi
                echo "Waiting for immich database (attempt $RETRY_COUNT/$MAX_RETRIES)..."
                sleep 2
              done

              echo "Database 'immich' exists. Creating extensions..."

              psql -h main-postgres-rw -U postgres-admin -d immich <<-EOSQL
                -- Create extensions if they don't exist
                CREATE EXTENSION IF NOT EXISTS vector CASCADE;
                CREATE EXTENSION IF NOT EXISTS cube CASCADE;
                CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;

                -- Verify extensions were created
                SELECT extname, extversion FROM pg_extension
                WHERE extname IN ('vector', 'cube', 'earthdistance')
                ORDER BY extname;
              EOSQL

              echo "✅ Extensions created successfully!"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin-user
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 26
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: homeassistant-grant
  namespace: databases
spec:
  mariaDbRef:
    name: main-mariadb
    waitForIt: true
  username: homeassistant
  database: homeassistant
  table: "*"
  privileges:
    - "ALL PRIVILEGES"
  grantOption: true
  retryInterval: 5s

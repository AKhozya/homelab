apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: uptime-kuma-grant
  namespace: databases
spec:
  mariaDbRef:
    name: main-mariadb
    waitForIt: true
  username: uptimekuma
  database: uptimekuma
  table: "*"
  privileges:
    - "ALL PRIVILEGES"
  grantOption: true
  retryInterval: 5s

apiVersion: batch/v1
kind: CronJob
metadata:
  name: couchdb-backup
  namespace: databases
spec:
  schedule: "5 3 * * *"  # 3:05 AM daily (5 min after PostgreSQL backups)
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # Don't run concurrent backups
  jobTemplate:
    spec:
      backoffLimit: 6  # Retry up to 6 times before marking job as failed
      ttlSecondsAfterFinished: 86400  # Keep job for 24h for debugging
      template:
        metadata:
          labels:
            app: couchdb-backup
        spec:
          serviceAccountName: couchdb-jobs
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000  # non-root user
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: setup-permissions
              image: alpine:3.23
              command:
                - sh
                - -c
                - |
                  # Ensure backup directory exists and has correct permissions
                  mkdir -p /backup
                  chown -R 1000:1000 /backup
                  chmod 755 /backup
                  echo "Backup directory ready"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
              securityContext:
                runAsUser: 0  # Need root to chown
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                  add: ["CHOWN", "DAC_OVERRIDE"]
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
            - name: wait-for-couchdb
              image: alpine:3.23
              command:
                - sh
                - -c
                - |
                  echo "Waiting for CouchDB to be ready..."
                  COUCHDB_URL="http://$COUCHDB_USER:$COUCHDB_PASSWORD@couchdb-couchdb.databases.svc.cluster.local:5984"
                  MAX_RETRIES=30
                  RETRY_INTERVAL=2

                  for i in $(seq 1 $MAX_RETRIES); do
                    if wget -q --timeout=5 -O /dev/null "$COUCHDB_URL/_up"; then
                      echo "✅ CouchDB is ready (attempt $i)"
                      exit 0
                    fi
                    echo "Attempt $i/$MAX_RETRIES: CouchDB not ready, waiting ${RETRY_INTERVAL}s..."
                    sleep $RETRY_INTERVAL
                  done

                  echo "❌ CouchDB did not become ready after $MAX_RETRIES attempts"
                  exit 1
              env:
                - name: COUCHDB_USER
                  valueFrom:
                    secretKeyRef:
                      name: couchdb-couchdb
                      key: adminUsername
                - name: COUCHDB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: couchdb-couchdb
                      key: adminPassword
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: "10m"
                  memory: "32Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"
          containers:
            - name: backup
              image: node:24-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -eo pipefail

                  echo "=== CouchDB Backup Started ==="
                  echo "Timestamp: $(date)"

                  # Clean up orphaned directories from failed previous attempts
                  echo "Cleaning orphaned backup directories..."
                  find /backup -maxdepth 1 -type d -name "2*" -mmin +60 -exec rm -rf {} \; 2>/dev/null || true

                  # Retry wrapper function with exponential backoff
                  retry_with_backoff() {
                    local max_attempts=$1
                    local delay=$2
                    local max_delay=$3
                    shift 3
                    local attempt=1

                    while [ $attempt -le $max_attempts ]; do
                      if "$@"; then
                        return 0
                      fi
                      if [ $attempt -lt $max_attempts ]; then
                        echo "Attempt $attempt failed, retrying in ${delay}s..."
                        sleep $delay
                        delay=$((delay * 2))
                        [ $delay -gt $max_delay ] && delay=$max_delay
                      fi
                      attempt=$((attempt + 1))
                    done
                    echo "All $max_attempts attempts failed"
                    return 1
                  }

                  # Configure npm for reliability
                  npm config set fetch-retries 3
                  npm config set fetch-retry-mintimeout 10000
                  npm config set fetch-retry-maxtimeout 60000
                  npm config set fetch-timeout 120000

                  # Install couchbackup with retry
                  echo "Installing couchbackup..."
                  retry_with_backoff 3 5 30 npm install --prefix /tmp @cloudant/couchbackup
                  export PATH="/tmp/node_modules/.bin:$PATH"

                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_DIR="/backup/$TIMESTAMP"
                  mkdir -p "$BACKUP_DIR"

                  # CouchDB connection details
                  COUCHDB_URL="http://$COUCHDB_USER:$COUCHDB_PASSWORD@couchdb-couchdb.databases.svc.cluster.local:5984"

                  # Auto-discover databases with retry (exclude system databases)
                  echo "Discovering databases..."
                  DATABASES=$(wget -q --timeout=30 -O- "$COUCHDB_URL/_all_dbs" | \
                    sed 's/\[//g;s/\]//g;s/"//g;s/,/ /g' | \
                    tr ' ' '\n' | \
                    grep -v '^_' | \
                    grep -v '^$' || echo "")

                  echo "Found databases: $DATABASES"

                  if [ -z "$DATABASES" ]; then
                    echo "❌ No databases found to backup!"
                    exit 1
                  fi

                  # Backup each database with retry
                  for DB in $DATABASES; do
                    echo "Backing up database: $DB"

                    START_TIME=$(date +%s)

                    # Run couchbackup with increased timeout
                    BACKUP_SUCCESS=false
                    for attempt in 1 2 3 4 5; do
                      echo "  Backup attempt $attempt/5..."
                      if /tmp/node_modules/.bin/couchbackup \
                        --url "$COUCHDB_URL" \
                        --db "$DB" \
                        --log "$BACKUP_DIR/${DB}.log" \
                        --request-timeout 180000 \
                        > "$BACKUP_DIR/${DB}.raw" 2>&1; then
                        BACKUP_SUCCESS=true
                        break
                      fi
                      if [ $attempt -lt 5 ]; then
                        DELAY=$((attempt * 15))
                        echo "  Attempt $attempt failed, waiting ${DELAY}s..."
                        sleep $DELAY
                      fi
                    done

                    if [ "$BACKUP_SUCCESS" = true ]; then
                      # Filter the output to keep only JSON array lines (actual data)
                      # This removes couchbackup header/metadata that breaks couchrestore
                      grep "^\[" "$BACKUP_DIR/${DB}.raw" > "$BACKUP_DIR/${DB}.couchbackup" 2>/dev/null || true
                      rm -f "$BACKUP_DIR/${DB}.raw"

                      END_TIME=$(date +%s)
                      DURATION=$((END_TIME - START_TIME))
                      SIZE=$(du -h "$BACKUP_DIR/${DB}.couchbackup" | cut -f1)

                      echo "✅ $DB backup completed ($SIZE, ${DURATION}s)"
                    else
                      rm -f "$BACKUP_DIR/${DB}.raw"
                      echo "❌ $DB backup failed after retries!"
                      exit 1
                    fi
                  done

                  # Create manifest
                  cat > "$BACKUP_DIR/MANIFEST.txt" <<EOF
                  CouchDB Backup Manifest
                  Timestamp: $(date)
                  Backup ID: $TIMESTAMP
                  Databases: $DATABASES
                  Host: couchdb-couchdb.databases.svc.cluster.local:5984

                  Backup Files:
                  $(ls -lh $BACKUP_DIR/*.couchbackup 2>/dev/null || echo "No backups created")

                  Total Size:
                  $(du -sh $BACKUP_DIR)
                  EOF

                  # Compress backup directory with gzip
                  echo "Compressing backup archive with gzip..."
                  cd /backup
                  tar -czf "couchdb_${TIMESTAMP}.tar.gz" "$TIMESTAMP"
                  COMPRESSED_SIZE=$(du -h "couchdb_${TIMESTAMP}.tar.gz" | cut -f1)
                  echo "✅ Compressed backup: couchdb_${TIMESTAMP}.tar.gz ($COMPRESSED_SIZE)"

                  # Generate SHA256 checksum for backup integrity
                  echo "Generating SHA256 checksum for backup integrity..."
                  sha256sum "couchdb_${TIMESTAMP}.tar.gz" > "couchdb_${TIMESTAMP}.tar.gz.sha256"
                  echo "✅ Checksum saved: couchdb_${TIMESTAMP}.tar.gz.sha256"
                  cat "couchdb_${TIMESTAMP}.tar.gz.sha256"

                  # Remove uncompressed directory
                  rm -rf "$TIMESTAMP"

                  # Keep only last 30 days of backups (including checksums)
                  echo "Cleaning old backups (keeping last 30 days)..."
                  find /backup -name "couchdb_*.tar.gz" -mtime +30 -delete
                  find /backup -name "couchdb_*.tar.gz.sha256" -mtime +30 -delete

                  # List current backups
                  echo ""
                  echo "=== Current Backups ==="
                  ls -lh /backup/couchdb_*.tar.gz 2>/dev/null || echo "No backups found"

                  echo ""
                  echo "=== Backup Complete ==="
                  echo "Backup ID: $TIMESTAMP"
                  echo "Location: /backup/couchdb_${TIMESTAMP}.tar.gz"
                  echo "Size: $COMPRESSED_SIZE"
              env:
                - name: COUCHDB_USER
                  valueFrom:
                    secretKeyRef:
                      name: couchdb-couchdb
                      key: adminUsername
                - name: COUCHDB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: couchdb-couchdb
                      key: adminPassword
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: false  # Need to write to /tmp for npm
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
          volumes:
            - name: backup-storage
              hostPath:
                path: /mnt/k8s-storage/backups/couchdb
                type: DirectoryOrCreate
          nodeSelector:
            kubernetes.io/hostname: worker-node  # Run on worker node with storage

apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
  namespace: databases
spec:
  schedule: "15 3 * * *"  # 3:15 AM daily (after PostgreSQL backup at 3:00 AM)
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # Don't run concurrent backups
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400  # Keep job for 24h for debugging
      template:
        metadata:
          labels:
            app: mysql-backup
        spec:
          serviceAccountName: mysql-jobs
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 999  # mysql user
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: setup-permissions
              image: alpine:3.23
              command:
                - sh
                - -c
                - |
                  # Ensure backup directory exists and has correct permissions
                  mkdir -p /backup
                  chown -R 999:999 /backup
                  chmod 755 /backup
                  echo "Backup directory ready"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
              securityContext:
                runAsUser: 0  # Need root to chown
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                  add: ["CHOWN", "DAC_OVERRIDE"]
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
          containers:
            - name: backup
              image: mysql:9.5
              command:
                - /bin/bash
                - -c
                - |
                  set -e

                  echo "=== MySQL Backup Started ==="
                  echo "Timestamp: $(date)"

                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_DIR="/backup/$TIMESTAMP"
                  mkdir -p "$BACKUP_DIR"

                  # Auto-discover databases (exclude system databases)
                  echo "Discovering databases..."
                  DATABASES=$(mysql \
                    -h main-mysql-haproxy.databases.svc.cluster.local \
                    -P 3306 \
                    -u "$MYSQL_USER" \
                    -p"$MYSQL_PASSWORD" \
                    -N -e "SHOW DATABASES" \
                    | grep -Ev "^(information_schema|mysql|performance_schema|sys)$")

                  echo "Found databases: $DATABASES"

                  # Backup each database
                  for DB in $DATABASES; do
                    echo "Backing up database: $DB"
                    mysqldump \
                      -h main-mysql-haproxy.databases.svc.cluster.local \
                      -P 3306 \
                      -u "$MYSQL_USER" \
                      -p"$MYSQL_PASSWORD" \
                      --single-transaction \
                      --routines \
                      --triggers \
                      --events \
                      "$DB" > "$BACKUP_DIR/${DB}.sql" 2>&1

                    if [ $? -eq 0 ]; then
                      SIZE=$(du -h "$BACKUP_DIR/${DB}.sql" | cut -f1)
                      echo "✅ $DB backup completed ($SIZE)"
                    else
                      echo "❌ $DB backup failed!"
                      cat "$BACKUP_DIR/${DB}.sql"
                    fi
                  done

                  # Create manifest
                  cat > "$BACKUP_DIR/MANIFEST.txt" <<EOF
                  MySQL Backup Manifest
                  Timestamp: $(date)
                  Backup ID: $TIMESTAMP
                  Databases: $DATABASES
                  Host: main-mysql-haproxy.databases.svc.cluster.local:3306

                  Backup Files:
                  $(ls -lh $BACKUP_DIR/*.sql 2>/dev/null || echo "No SQL files")

                  Total Size:
                  $(du -sh $BACKUP_DIR)
                  EOF

                  # Compress backup directory with gzip
                  echo "Compressing backup with gzip..."
                  cd /backup
                  tar -czf "mysql_${TIMESTAMP}.tar.gz" "$TIMESTAMP"
                  COMPRESSED_SIZE=$(du -h "mysql_${TIMESTAMP}.tar.gz" | cut -f1)
                  echo "✅ Compressed backup: mysql_${TIMESTAMP}.tar.gz ($COMPRESSED_SIZE)"

                  # Generate SHA256 checksum for backup integrity
                  echo "Generating SHA256 checksum for backup integrity..."
                  sha256sum "mysql_${TIMESTAMP}.tar.gz" > "mysql_${TIMESTAMP}.tar.gz.sha256"
                  echo "✅ Checksum saved: mysql_${TIMESTAMP}.tar.gz.sha256"
                  cat "mysql_${TIMESTAMP}.tar.gz.sha256"

                  # Remove uncompressed directory
                  rm -rf "$TIMESTAMP"

                  # Keep only last 30 days of backups (including checksums)
                  echo "Cleaning old backups (keeping last 30 days)..."
                  find /backup -name "mysql_*.tar.gz" -mtime +30 -delete
                  find /backup -name "mysql_*.tar.gz.sha256" -mtime +30 -delete

                  # List current backups
                  echo ""
                  echo "=== Current Backups ==="
                  ls -lh /backup/mysql_*.tar.gz 2>/dev/null || echo "No backups found"

                  echo ""
                  echo "=== Backup Complete ==="
                  echo "Backup ID: $TIMESTAMP"
                  echo "Location: /backup/mysql_${TIMESTAMP}.tar.gz"
                  echo "Size: $COMPRESSED_SIZE"
              env:
                - name: MYSQL_USER
                  value: "root"
                - name: MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mysql-cluster-secrets
                      key: root
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: false  # Need to write to /tmp for mysqldump
              resources:
                requests:
                  cpu: "200m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
          volumes:
            - name: backup-storage
              hostPath:
                path: /mnt/k8s-storage/backups/mysql
                type: DirectoryOrCreate
          nodeSelector:
            kubernetes.io/hostname: worker-node  # Run on worker node with storage

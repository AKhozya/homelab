apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2025.9.1
        args:
        - tunnel
        - --config
        - /etc/cloudflared/config/config.yaml
        - run
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          failureThreshold: 1
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        - name: creds
          mountPath: /etc/cloudflared/creds
          readOnly: true
      volumes:
      - name: creds
        secret:
          secretName: tunnel-credentials
      - name: config
        configMap:
          name: cloudflared
          items:
          - key: config.yaml
            path: config.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: cloudflare-tunnel
data:
  config.yaml: |
    tunnel: homelab
    credentials-file: /etc/cloudflared/creds/credentials.json

    metrics: 0.0.0.0:2000
    no-autoupdate: true

    # Connection settings for security and performance
    grace-period: 30s

    ingress:
    # CouchDB
    - hostname: couchdb.h0melab.work
      service: http://couchdb-svc-couchdb.couchdb.svc.cluster.local:5984
      originRequest:
        http2Origin: true
        connectTimeout: 10s
        noTLSVerify: false
        disableChunkedEncoding: false

    # Audiobookshelf
    - hostname: audiobooks.h0melab.work
      service: http://audiobookshelf.audiobookshelf.svc.cluster.local:3005
      originRequest:
        http2Origin: true
        connectTimeout: 10s
        noTLSVerify: false
        disableChunkedEncoding: false

    # n8n
    - hostname: n8n.h0melab.work
      service: http://n8n.n8n.svc.cluster.local:5678
      originRequest:
        http2Origin: true
        connectTimeout: 10s
        noTLSVerify: false
        disableChunkedEncoding: false

    # Linkding
    - hostname: linkding.h0melab.work
      service: http://linkding.linkding.svc.cluster.local:9090
      originRequest:
        http2Origin: true
        connectTimeout: 10s
        noTLSVerify: false
        disableChunkedEncoding: false

    # Mealie
    - hostname: mealie.h0melab.work
      service: http://mealie.mealie.svc.cluster.local:9000
      originRequest:
        http2Origin: true
        connectTimeout: 10s
        noTLSVerify: false
        disableChunkedEncoding: false

    # Wallabag
    - hostname: wallabag.h0melab.work
      service: http://wallabag.wallabag.svc.cluster.local:80
      originRequest:
        http2Origin: true
        connectTimeout: 10s
        noTLSVerify: false
        disableChunkedEncoding: false

    # Catch-all
    - service: http_status:404
---
apiVersion: v1
kind: Service
metadata:
  name: cloudflared-metrics
  namespace: cloudflare-tunnel
  labels:
    app: cloudflared
spec:
  selector:
    app: cloudflared
  ports:
  - name: metrics
    port: 2000
    targetPort: 2000

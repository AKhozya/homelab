apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: databases
spec:
  limits:
    - type: Container
      default:
        cpu: 1000m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 8000m
        memory: 16Gi
      min:
        cpu: 10m
        memory: 16Mi
    - type: Pod
      max:
        cpu: 16000m
        memory: 32Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: databases
spec:
  hard:
    requests.cpu: "5"  # Temporarily increased for MariaDB rollout (3 replicas × 250m = 750m + PostgreSQL 960m = 1.71 total)
    requests.memory: 8Gi  # Temporarily increased for MariaDB rollout (3 replicas × 512Mi = 1.5Gi + PostgreSQL 1.7Gi = 3.2Gi total)
    limits.cpu: "17"  # Increased for MySQL component CPU limits (HAProxy/Orchestrator 500m)
    limits.memory: 18Gi  # Temporarily increased for MariaDB rollout (3 replicas × 2Gi = 6Gi + PostgreSQL 8.3Gi = 14.3Gi total)
    pods: "50"
    services: "20"
    persistentvolumeclaims: "20"

apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: monitoring
spec:
  limits:
    - type: Container
      default:
        cpu: 1000m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 8000m
        memory: 16Gi
      min:
        cpu: 10m
        memory: 16Mi
    - type: Pod
      max:
        cpu: 16000m
        memory: 32Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: monitoring
spec:
  hard:
    requests.cpu: "4"      # Temporary increase for VM migration
    requests.memory: 8Gi   # Temporary increase for VM migration
    limits.cpu: "15"       # Temporary increase for VM migration (both Prom + VM)
    limits.memory: 16Gi    # Temporary increase for VM migration (both Prom + VM)
    pods: "50"
    services: "20"
    persistentvolumeclaims: "20"

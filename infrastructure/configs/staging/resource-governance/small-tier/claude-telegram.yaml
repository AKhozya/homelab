apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: claude-telegram
spec:
  limits:
    - type: Container
      default:
        cpu: 1000m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 8000m
        memory: 16Gi
      min:
        cpu: 10m
        memory: 16Mi
    - type: Pod
      max:
        cpu: 16000m
        memory: 32Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: claude-telegram
spec:
  hard:
    requests.cpu: 200m
    requests.memory: 512Mi
    limits.cpu: 3500m
    limits.memory: 4Gi
    pods: "4"
    services: "10"
    persistentvolumeclaims: "5"

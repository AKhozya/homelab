apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: backup-replication
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 2000m
        memory: 2Gi
      min:
        cpu: 10m
        memory: 16Mi
    - type: Pod
      max:
        cpu: 4000m
        memory: 4Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: backup-replication
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "5"
    services: "2"
    persistentvolumeclaims: "2"

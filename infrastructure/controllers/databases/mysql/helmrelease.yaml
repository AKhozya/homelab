apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ps-operator
  namespace: percona-mysql
spec:
  interval: 6h
  driftDetection:
    mode: enabled
  rollback:
    cleanupOnFail: true
  chart:
    spec:
      chart: ps-operator
      version: "1.2.0"
      sourceRef:
        kind: HelmRepository
        name: percona
        namespace: percona-mysql
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  maxHistory: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # critical-tier via postRenderers — chart 1.2.0 has no priorityClassName template hook.
  # Parity with cnpg-operator + redis-operator (DB control plane).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: ps-operator
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-critical
          # seccomp RuntimeDefault (UR2-4 soak) — chart 1.2.0 has no securityContext hook.
          - target:
              kind: Deployment
              name: ps-operator
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ps-operator
              spec:
                template:
                  spec:
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
  values:
    # Operator runs in percona-mysql namespace
    # Watches all namespaces for PerconaServerForMySQL CRs
    watchAllNamespaces: true

    # Resource limits for Kyverno compliance
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ps-operator
  namespace: percona-mysql
spec:
  interval: 6h
  driftDetection:
    mode: enabled
  rollback:
    cleanupOnFail: true
  chart:
    spec:
      chart: ps-operator
      version: "1.3.0"
      sourceRef:
        kind: HelmRepository
        name: percona
        namespace: percona-mysql
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  maxHistory: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # Chart 1.3.0 exposes no priorityClassName value, so this patch sets the critical tier, as
  # cnpg-operator and redis-operator have.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: ps-operator
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-critical
              # Cap retained zero-replica ReplicaSets — chart leaves the field
              # unset, so the K8s default of 10 applies.
              - op: add
                path: /spec/revisionHistoryLimit
                value: 2
          # Chart 1.3.0 exposes no pod securityContext value, so this patch sets seccomp RuntimeDefault.
          - target:
              kind: Deployment
              name: ps-operator
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ps-operator
              spec:
                template:
                  spec:
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
  values:
    # The operator runs in percona-mysql and watches all namespaces for PerconaServerMySQL CRs
    # (the cluster is in databases).
    watchAllNamespaces: true

    # Resource limits for Kyverno compliance
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
  namespace: databases
spec:
  interval: 6h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: redis-operator
      version: "0.26.1"
      sourceRef:
        kind: HelmRepository
        name: ot-helm
        namespace: databases
  install:
    crds: Create
    remediation:
      retries: 3
  maxHistory: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  # Cap retained zero-replica ReplicaSets — chart 0.26.1 has no revisionHistoryLimit
  # value and leaves the field unset, so the K8s default of 10 applies.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: redis-operator
            patch: |-
              - op: add
                path: /spec/revisionHistoryLimit
                value: 2
  values:
    # critical tier: operator coordinates Redis Sentinel + CR reconcile
    priorityClassName: homelab-critical

    # seccomp RuntimeDefault, set through the chart's podSecurityContext value on the
    # Deployment's pod-level securityContext.
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault

    redisOperator:
      # No imageTag: the chart defaults to v<appVersion>, so the pinned chart version
      # pins the image. A mirrored tag here is renovate-blind and silently skewed the
      # operator to v0.24.0 while the chart moved to 0.25.0.
      imagePullPolicy: IfNotPresent
      automountServiceAccountToken: true
      podAnnotations: {}
      # require-labels (Kyverno): chart merges podLabels into template labels only —
      # selector stays selectorLabels (name:), no immutable-selector break on upgrade
      podLabels:
        app.kubernetes.io/name: redis-operator
      env: []
      webhook: false
      pprof:
        enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
  namespace: databases
spec:
  interval: 6h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: redis-operator
      version: "0.25.0"
      sourceRef:
        kind: HelmRepository
        name: ot-helm
        namespace: databases
  # match cnpg-operator HR shape — auto-retry on install/upgrade failure +
  # remediate-last-failure on upgrade. Parity with other DB operators (cnpg + ps).
  install:
    crds: Create
    remediation:
      retries: 3
  maxHistory: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  # seccomp RuntimeDefault (UR2-4 soak) — chart 0.24.0 has no securityContext values hook; patch the
  # rendered Deployment pod spec (strategic merge preserves any chart-set securityContext fields).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: redis-operator
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: redis-operator
              spec:
                template:
                  spec:
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
  values:
    # critical tier: operator coordinates Redis Sentinel + CR reconcile
    priorityClassName: homelab-critical

    redisOperator:
      imageTag: "v0.24.0"
      imagePullPolicy: IfNotPresent
      automountServiceAccountToken: true
      podAnnotations: {}
      # require-labels (Kyverno): chart merges podLabels into template labels only —
      # selector stays selectorLabels (name:), no immutable-selector break on upgrade
      podLabels:
        app.kubernetes.io/name: redis-operator
      env: []
      webhook: false
      pprof:
        enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    serviceMonitor:
      enabled: true
    serviceAccount:
      create: true
      automountServiceAccountToken: true

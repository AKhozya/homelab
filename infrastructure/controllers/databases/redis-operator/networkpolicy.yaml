apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-operator-network-policy
  namespace: databases
spec:
  # ot-helm redis-operator pod is labelled `name: redis-operator` (no app.kubernetes.io/name)
  podSelector:
    matchLabels:
      name: redis-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Metrics scrape
    - from:
        - namespaceSelector:
            matchLabels:
              kustomize.toolkit.fluxcd.io/name: monitoring-controllers
      ports:
        - protocol: TCP
          port: 8080

  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53

    # K8s API. The API server runs on the control-plane node, not as a pod, so this
    # rule needs an ipBlock rather than a selector.
    - to:
        - ipBlock:
            cidr: 192.168.1.127/32  # control-plane node
      ports:
        - protocol: TCP
          port: 6443

    # Redis and Sentinel instances. The operator dials the pods directly
    # (checkRedisServerRole, role/sentinel coordination) and not through an API exec.
    # Without this rule kube-router rejects the egress — seen as TCP "connection
    # refused" to redis-replication-0:6379 during the first reconcile.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - redis-replication
                  - redis-sentinel-sentinel
      ports:
        - protocol: TCP
          port: 6379   # Redis
        - protocol: TCP
          port: 26379  # Sentinel

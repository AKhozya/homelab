apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-operator-network-policy
  namespace: databases
spec:
  # ot-helm redis-operator pod is labelled `name: redis-operator` (no app.kubernetes.io/name)
  podSelector:
    matchLabels:
      name: redis-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Prometheus metrics scraping from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kustomize.toolkit.fluxcd.io/name: monitoring-controllers
      ports:
        - protocol: TCP
          port: 8080  # Metrics endpoint

  egress:
    # Allow DNS resolution to kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53

    # Allow HTTPS access to Kubernetes API server
    # API server runs on control-plane node, not as a pod, so we use ipBlock.
    - to:
        - ipBlock:
            cidr: 192.168.1.127/32  # control-plane node
      ports:
        - protocol: TCP
          port: 6443  # Kubernetes API server port

    # Allow access to Redis + Sentinel instances. The operator dials pods directly
    # (checkRedisServerRole → role/sentinel coordination), NOT via API exec —
    # omitting this makes kube-router REJECT the egress (observed as TCP
    # "connection refused" to redis-replication-0:6379 during first reconcile).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - redis-replication
                  - redis-sentinel-sentinel
      ports:
        - protocol: TCP
          port: 6379   # Redis
        - protocol: TCP
          port: 26379  # Sentinel

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-operator-policy
  namespace: databases
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Webhook traffic from the API server. Its source IP varies, so this rule admits
    # any source on the webhook port.
    - ports:
        - protocol: TCP
          port: 9443

    # Metrics scrape
    - from:
        - namespaceSelector:
            matchLabels:
              kustomize.toolkit.fluxcd.io/name: monitoring-controllers
      ports:
        - protocol: TCP
          port: 8080  # Metrics endpoint

  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53

    # K8s API. The API server runs on the control-plane node, not as a pod, so this
    # rule needs an ipBlock rather than a selector.
    - to:
        - ipBlock:
            cidr: 192.168.1.127/32  # control-plane node
      ports:
        - protocol: TCP
          port: 6443  # Kubernetes API server port

    # CNPG instances
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: main-postgres
      ports:
        - protocol: TCP
          port: 5432  # PostgreSQL
        - protocol: TCP
          port: 8000  # CNPG instance manager status API

    # CNPG pooler
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/podRole: pooler
      ports:
        - protocol: TCP
          port: 5432

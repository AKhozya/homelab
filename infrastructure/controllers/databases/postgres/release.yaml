apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-operator
  namespace: databases
spec:
  interval: 6h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.0
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: databases
  install:
    crds: Create
    remediation:
      retries: 3
  maxHistory: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  values:
    # critical tier: operator controls CNPG failover/promotion — outage = no DB recovery
    priorityClassName: homelab-critical

    # HA: Run 2 replicas across different nodes for webhook availability during reboots
    replicaCount: 2

    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: cloudnative-pg
            topologyKey: kubernetes.io/hostname
      # Keep operator (esp. the leader) OFF worker-node-2: 2026-06-04 the leader replica on wn2
      # probed the healthy W1 primary across wn2's flaky VXLAN -> spurious failover. Soft pref
      # (weight 100) -> both replicas land CP+W1 in steady state; wn2 still usable if 2 nodes down.
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values: ["worker-node-2"]

    # CP toleration is REQUIRED for the nodeAffinity pref to be satisfiable: without it only
    # W1+wn2 are schedulable, and replicaCount 2 + hard anti-affinity FORCES one replica onto
    # wn2 (pref becomes dead config). With it the pair lands CP+W1. Operator is control-plane
    # logic only (100m/128Mi) — no data path on CP.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    # Update strategy: delete old pod before creating new (required with anti-affinity + 2 nodes)
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1

    # Resource limits for CNPG operator
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Enable monitoring
    monitoring:
      podMonitorEnabled: true
      podMonitorAdditionalLabels:
        release: kube-prometheus-stack

    # Webhook configuration
    webhook:
      port: 9443
      # Increase startup probe tolerance for node reboots
      # Gives operator 100s (20 * 5s) to start after reboot
      # Prevents crash when API server isn't immediately available
      startupProbe:
        failureThreshold: 20  # Default: 6 (30s total)
        periodSeconds: 5

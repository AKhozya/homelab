apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 6h
  timeout: 10m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: cert-manager
      version: v1.21.2
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: cert-manager
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  maxHistory: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  # standard-tier — chart 1.20.2 omits priorityClassName template hook for all 3 components.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: cert-manager
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-standard
          - target:
              kind: Deployment
              name: cert-manager-cainjector
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-standard
          - target:
              kind: Deployment
              name: cert-manager-webhook
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-standard
          # Cap retained zero-replica ReplicaSets — chart leaves the field unset, so
          # the K8s default of 10 applies. Nameless target = all 3 chart Deployments
          # (cert-manager, -cainjector, -webhook; startupapicheck is a Job).
          - target:
              kind: Deployment
            patch: |-
              - op: add
                path: /spec/revisionHistoryLimit
                value: 2
  values:
    # Uses new crds section (installCRDs deprecated since cert-manager v1.15.0)
    crds:
      enabled: true
      keep: true

    global:
      leaderElection:
        namespace: cert-manager

    # High availability: 2 replicas with pod anti-affinity
    replicaCount: 2

    # Chart default is false; upstream values say to enable it whenever replicaCount > 1.
    # Safe at 2 replicas: minAvailable 1 leaves disruptionsAllowed 1, so a drain still
    # proceeds. (A PDB whose minAvailable equals the replica count pins
    # disruptionsAllowed to 0 and blocks drain outright — main-postgres-primary sits
    # there by design.) Required anti-affinity plus serial:1 node maintenance already
    # keep one replica up; this makes that structural rather than incidental.
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    # Rolling update strategy: delete old pod before creating new
    # Required with 2 replicas + required anti-affinity on 2 worker nodes
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1

    # Tolerate the control-plane taint so the anti-affine replicas below can also use the CP node.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: cert-manager
                app.kubernetes.io/instance: cert-manager
                app.kubernetes.io/component: controller
            topologyKey: kubernetes.io/hostname

    # Resource limits for cert-manager controller
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    # Webhook settings
    # Note: Webhook deployment may be scaled to 0 replicas and webhook configurations
    # may be deleted if experiencing Kubernetes API server timeout issues (30s default).
    # The webhook provides admission validation but is not strictly required for cert-manager
    # operation, as the controllers also perform validation.
    webhook:
      replicaCount: 2
      # See the top-level podDisruptionBudget comment. Matters most here: the webhook
      # gates every cert-manager CR admission, so losing both replicas fails those calls.
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cert-manager
                  app.kubernetes.io/instance: cert-manager
                  app.kubernetes.io/component: webhook
              topologyKey: kubernetes.io/hostname
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      # Liveness probe settings
      livenessProbe:
        failureThreshold: 3
        initialDelaySeconds: 60
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 1
      # Readiness probe settings
      readinessProbe:
        failureThreshold: 3
        initialDelaySeconds: 5
        periodSeconds: 5
        successThreshold: 1
        timeoutSeconds: 1

    # CA Injector settings
    cainjector:
      replicaCount: 2
      # See the top-level podDisruptionBudget comment.
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cert-manager
                  app.kubernetes.io/instance: cert-manager
                  app.kubernetes.io/component: cainjector
              topologyKey: kubernetes.io/hostname
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
        prometheusInstance: default
        labels:
          release: kube-prometheus-stack

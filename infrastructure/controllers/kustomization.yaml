apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # PriorityClasses must exist before any priorityClassName-bearing pod is admitted.
  # Kept in infrastructure-controllers (not -configs) so a cold bootstrap/DR restore can't
  # deadlock: infrastructure-configs dependsOn infrastructure-controllers, whose healthCheck
  # pods (cert-manager-webhook, kyverno-admission-controller) reference homelab-standard.
  - priority-classes
  - cert-manager
  - traefik
  - kyverno
  - csp-reporter
  - databases/postgres
  - databases/couchdb
  - databases/redis-operator
  - databases/redis-ha
  - databases/mysql

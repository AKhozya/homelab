apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns-ha
  namespace: kube-system
  labels:
    app: coredns-ha
    k8s-app: kube-dns
    app.kubernetes.io/name: coredns-ha
spec:
  # Additive HA layer alongside the k3s packaged CoreDNS addon (left untouched — no --disable, no
  # gap, no addon fight). Pods carry k8s-app=kube-dns so the existing kube-dns Service (10.43.0.10)
  # load-balances across these 3 spread replicas + the addon's. Unique selector app=coredns-ha so
  # this Deployment never adopts/steals the addon's pods. Reuses the addon's `coredns` ConfigMap
  # (Corefile + NodeHosts) and `coredns` ServiceAccount — no Corefile/Service/RBAC duplication.
  # Goal: a single wedged/rebooting node can no longer take cluster DNS down. See
  # docs/plans/2026-05-31-reboot-wedge-prevention.md (Stage 3).
  replicas: 3
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 1
  selector:
    matchLabels:
      app: coredns-ha
  template:
    metadata:
      labels:
        app: coredns-ha
        k8s-app: kube-dns
        app.kubernetes.io/name: coredns-ha
    spec:
      priorityClassName: system-cluster-critical
      serviceAccountName: coredns
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 30
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # Best-effort one-per-node spread (ScheduleAnyway, NOT DoNotSchedule — never strand a Pending
      # replica on this 3-node cluster). Single mechanism by hostname; no redundant podAntiAffinity.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: coredns-ha
      containers:
        - name: coredns
          image: rancher/mirrored-coredns-coredns:1.14.2
          imagePullPolicy: IfNotPresent
          args: ["-conf", "/etc/coredns/Corefile"]
          resources:
            requests:
              cpu: 100m
              memory: 70Mi
            limits:
              memory: 170Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add: ["NET_BIND_SERVICE"]
              drop: ["all"]
          ports:
            - containerPort: 53
              name: dns
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 9153
              name: metrics
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
              scheme: HTTP
            periodSeconds: 2
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: config-volume
              mountPath: /etc/coredns
              readOnly: true
            - name: custom-config-volume
              mountPath: /etc/coredns/custom
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config-volume
          configMap:
            name: coredns
            defaultMode: 420
            items:
              - key: Corefile
                path: Corefile
              - key: NodeHosts
                path: NodeHosts
        - name: custom-config-volume
          configMap:
            name: coredns-custom
            optional: true
            defaultMode: 420

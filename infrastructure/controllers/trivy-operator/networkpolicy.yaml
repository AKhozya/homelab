# Default-deny + two pod classes: operator (API server + metrics) and scan jobs
# (registry/DB egress). Scan jobs run in THIS namespace (scanJobsInSameNamespace=false
# scatters them per-workload-ns and fights per-ns NetworkPolicies — keep default).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: trivy-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trivy-operator-network-policy
  namespace: trivy-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trivy-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # VMAgent metrics scrape (container port 8080)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server (CP node direct + in-cluster service VIP)
    - to:
        - ipBlock:
            cidr: 192.168.1.127/32
      ports:
        - protocol: TCP
          port: 6443
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trivy-scan-jobs-network-policy
  namespace: trivy-system
spec:
  podSelector:
    matchLabels:
      app: trivy-scan-job  # stamped via trivyOperator.scanJobPodTemplateLabels
  policyTypes:
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Image registries + trivy-db OCI pulls (mirror.gcr.io, ghcr.io, docker.io, quay.io):
    # destination set is open-ended by design — image scanning follows whatever registry
    # a workload pins. HTTPS only.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16    # pod CIDR
              - 10.43.0.0/16    # service CIDR
              - 192.168.1.0/24  # LAN
      ports:
        - protocol: TCP
          port: 443

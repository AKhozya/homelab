apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kyverno-network-policy
  namespace: kyverno
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Webhook admission requests from API server
    # API server connects via pod CIDR (flannel) to container ports
    - from:
        - ipBlock:
            cidr: 10.42.0.0/16
        - ipBlock:
            cidr: 192.168.1.127/32
        - ipBlock:
            cidr: 192.168.1.129/32
        - ipBlock:
            cidr: 192.168.1.126/32
      ports:
        - protocol: TCP
          port: 9443   # admission-controller webhook
        - protocol: TCP
          port: 443     # cleanup-controller webhook
    # Prometheus scraping metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Kubernetes API server
    - to:
        - ipBlock:
            cidr: 192.168.1.127/32
      ports:
        - protocol: TCP
          port: 6443

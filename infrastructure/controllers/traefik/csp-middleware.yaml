apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: csp
  namespace: traefik
spec:
  headers:
    customResponseHeaders:
      # GLOBAL DEFAULT CSP — INVERTED to the safe inline tier 2026-06-04 (was permissive with 'unsafe-eval').
      # A new app whose ingress chain lists `traefik-csp` inherits THIS: script-src 'self' 'unsafe-inline' — NO eval.
      # Apps that genuinely need eval/wasm must EXPLICITLY opt into `csp-permissive-enforced`; stricter = `csp-strict-enforced`.
      # Body is identical to `csp-inline-enforced` (the explicit-inline alias used by paperless/homepage/mealie/homehub/audiobookshelf) — collapse candidate, kept separate so the default has a stable `csp` name.
      # report-uri omitted: csp-reporter is cluster-internal HTTP, unreachable from a browser (was Mixed-Content noise).
      Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://authentik.h0melab.work"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: csp-strict-enforced
  namespace: traefik
spec:
  headers:
    customResponseHeaders:
      # Strict enforced CSP — script-src 'self' only. Applied per-ingress to couchdb/Fauxton.
      # Browser-verified clean 2026-06-04: zero inline-script/eval violations under report-only soak.
      # report-uri omitted: csp-reporter is cluster-internal HTTP, unreachable from a browser (Mixed-Content).
      Content-Security-Policy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://authentik.h0melab.work"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: csp-inline-enforced
  namespace: traefik
spec:
  headers:
    customResponseHeaders:
      # Inline enforced CSP — script-src 'self' 'unsafe-inline'; drops 'unsafe-eval' vs the global permissive csp.
      # Applied to paperless-ngx: Angular UI emits inline scripts (browser-verified 2026-06-04, no eval needed).
      # report-uri omitted: csp-reporter is cluster-internal HTTP, unreachable from a browser (Mixed-Content).
      Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://authentik.h0melab.work"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: csp-permissive-enforced
  namespace: traefik
spec:
  headers:
    customResponseHeaders:
      # Permissive enforced CSP — script-src 'self' 'unsafe-inline' 'unsafe-eval'. EXPLICIT eval/wasm opt-in.
      # For apps browser-confirmed (2026-06-04) to need eval/wasm: authentik, linkwarden, n8n (expression eval),
      # stirling-pdf (PDF wasm) + immich, home-assistant, pricebuddy, uptime-kuma (Tier-C, eval/wasm-needing).
      # This is the policy the global `csp` default carried until 2026-06-04, when `csp` was INVERTED to the safe
      # inline tier so a newly-added app can't silently inherit 'unsafe-eval'. Eval now requires opting into THIS.
      Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://authentik.h0melab.work"

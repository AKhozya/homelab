apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 6h
  driftDetection:
    mode: enabled
  rollback:
    cleanupOnFail: true
  chart:
    spec:
      chart: traefik
      version: 41.3.0
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  maxHistory: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Critical-tier: ingress data-plane must outrank standard/batch under node pressure
    priorityClassName: homelab-critical

    deployment:
      replicas: 2
      revisionHistoryLimit: 2

    # Tolerate the control-plane taint so the anti-affine replicas below can also use the CP node.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    # Preferred anti-affinity: the scheduler tries to spread the replicas one per node.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
                  app.kubernetes.io/instance: traefik-traefik
              topologyKey: kubernetes.io/hostname

    # Use Kubernetes Service ClusterIP for routing instead of direct pod IPs.
    # Prevents stale endpoint 502s during pod churn (Traefik default bypasses
    # kube-proxy and tracks pod IPs itself, which can go stale).
    providers:
      kubernetesCRD:
        nativeLBByDefault: true
      kubernetesIngress:
        nativeLBByDefault: true

    # Service settings (v40: service.type moved into service.spec)
    service:
      spec:
        type: LoadBalancer

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

    ports:
      web:
        port: 80
        exposedPort: 80
      websecure:
        port: 443
        exposedPort: 443
        # TLS enabled by default in v39+

    metrics:
      prometheus:
        service:
          enabled: true
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: kube-prometheus-stack

    # Enable access logs (v41: logs.access → accessLog)
    accessLog:
      enabled: true

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
  namespace: traefik
spec:
  forwardAuth:
    # Points at the cluster Service, NOT the ingress — the subrequest must not loop back
    # out through Traefik. Port 9000 is the embedded outpost inside the authentik server;
    # no separate outpost deployment exists or is needed.
    address: http://authentik-server.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    # Identity authentik hands back to the protected app. Nothing consumes these today —
    # homepage has no concept of a user — but they cost nothing and are what any future
    # consumer of this middleware will expect.
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-operator
  namespace: databases
spec:
  interval: 6h
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.21.x
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: databases
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  values:
    # Resource limits for CNPG operator
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Enable monitoring
    monitoring:
      podMonitorEnabled: true

    # Webhook configuration
    webhook:
      port: 9443

apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: pgbouncer
  namespace: databases
spec:
  releaseName: pgbouncer
  chart:
    spec:
      chart: pgbouncer
      version: "3.1.2"
      sourceRef:
        kind: HelmRepository
        name: pgbouncer
        namespace: databases
  interval: 10m
  values:
    databases:
        - name: main
          host: main-postgres.databases.svc.cluster.local
          port: 5432
          user: {{ .Values.adminUser }}
          password: {{ .Values.adminPassword }}
          pool_mode: transaction
          max_db_connections: 50
          max_user_connections: 20
    resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "250m"
          memory: "256Mi"

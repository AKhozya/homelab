apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator-crds
  namespace: mariadb-operator
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: mariadb-operator-crds
      version: "25.10.x"  # Match operator version
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
        namespace: mariadb-operator
      interval: 12h
  install:
    remediation:
      retries: 3
    crds: CreateReplace  # Create or replace CRDs
  upgrade:
    remediation:
      retries: 3
    crds: CreateReplace  # Update CRDs on upgrade

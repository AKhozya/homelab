apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
  namespace: databases
spec:
  interval: 6h
  driftDetection:
    mode: enabled
  rollback:
    cleanupOnFail: true
  chart:
    spec:
      chart: redis-operator
      version: "0.24.0"
      sourceRef:
        kind: HelmRepository
        name: ot-helm
        namespace: databases
  values:
    # F-30 critical tier: operator coordinates Redis Sentinel + CR reconcile
    priorityClassName: homelab-critical

    redisOperator:
      imageTag: "v0.24.0"
      imagePullPolicy: IfNotPresent
      automountServiceAccountToken: true
      podAnnotations: {}
      podLabels: {}
      env: []
      webhook: false
      pprof:
        enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    serviceMonitor:
      enabled: true
    serviceAccount:
      create: true
      automountServiceAccountToken: true

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-operator-network-policy
  namespace: databases
spec:
  # ot-helm redis-operator pod is labelled `name: redis-operator` (no app.kubernetes.io/name)
  podSelector:
    matchLabels:
      name: redis-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Prometheus metrics scraping from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kustomize.toolkit.fluxcd.io/name: monitoring-controllers
      ports:
        - protocol: TCP
          port: 8080  # Metrics endpoint

  egress:
    # Allow DNS resolution to kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53

    # Allow HTTPS access to Kubernetes API server
    # API server runs on control-plane node, not as a pod, so we use ipBlock.
    # Operator drives Redis/Sentinel reconcile + redis-cli via API exec (not direct
    # pod network), so no egress to Redis instances is required — unlike CNPG's
    # manager, which talks to instances on 8000 directly.
    - to:
        - ipBlock:
            cidr: 192.168.1.127/32  # control-plane node
      ports:
        - protocol: TCP
          port: 6443  # Kubernetes API server port

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: percona-operator-network-policy
  namespace: percona-mysql
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # No ingress needed - operator only makes outbound calls
  ingress: []
  egress:
    # DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Kubernetes API server
    - to:
        - ipBlock:
            cidr: 192.168.1.127/32
      ports:
        - protocol: TCP
          port: 6443
    # Manage MySQL pods in databases namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 33060
        - protocol: TCP
          port: 33062

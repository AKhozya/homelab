apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ps-operator
  namespace: percona-mysql
spec:
  interval: 30m
  chart:
    spec:
      chart: ps-operator
      version: "1.1.x"
      sourceRef:
        kind: HelmRepository
        name: percona
        namespace: percona-mysql
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  maxHistory: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Operator runs in percona-mysql namespace
    # Watches all namespaces for PerconaServerForMySQL CRs
    watchAllNamespaces: true

    # Resource limits for Kyverno compliance
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

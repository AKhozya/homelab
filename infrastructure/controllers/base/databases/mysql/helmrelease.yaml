apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mysql-operator
  namespace: mysql-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: mysql-operator
      version: "2.2.x"
      sourceRef:
        kind: HelmRepository
        name: mysql-operator
        namespace: mysql-operator
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Default values - operator runs in mysql-operator namespace
    {}

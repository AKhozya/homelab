apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-operator
  namespace: databases
spec:
  interval: 6h
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.28.x
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: databases
  install:
    crds: Create
    remediation:
      retries: 3
  maxHistory: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  values:
    # HA: Run 2 replicas across different nodes for webhook availability during reboots
    replicaCount: 2

    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: cloudnative-pg
            topologyKey: kubernetes.io/hostname

    # Update strategy: delete old pod before creating new (required with anti-affinity + 2 nodes)
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1

    # Resource limits for CNPG operator
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Enable monitoring
    monitoring:
      podMonitorEnabled: true
      podMonitorAdditionalLabels:
        release: kube-prometheus-stack

    # Webhook configuration
    webhook:
      port: 9443
      # Increase startup probe tolerance for node reboots
      # Gives operator 100s (20 * 5s) to start after reboot
      # Prevents crash when API server isn't immediately available
      startupProbe:
        failureThreshold: 20  # Default: 6 (30s total)
        periodSeconds: 5

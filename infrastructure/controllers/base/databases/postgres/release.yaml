apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-operator
  namespace: databases
spec:
  interval: 6h
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.26.x
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: databases
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  values:
    # Resource limits for CNPG operator
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Enable monitoring
    monitoring:
      podMonitorEnabled: true

    # Webhook configuration
    webhook:
      port: 9443

    # Init container to wait for API server availability
    # Prevents crash on node reboot when operator starts before networking is ready
    initContainers:
      - name: wait-for-api
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            echo "Waiting for Kubernetes API server at 10.43.0.1:443..."
            timeout=60
            elapsed=0
            until nc -z 10.43.0.1 443 2>/dev/null; do
              if [ $elapsed -ge $timeout ]; then
                echo "Timeout after ${timeout}s waiting for API server"
                exit 1
              fi
              echo "API server not ready, retrying in 2s... (${elapsed}s/${timeout}s)"
              sleep 2
              elapsed=$((elapsed + 2))
            done
            echo "API server is ready!"
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
          readOnlyRootFilesystem: true

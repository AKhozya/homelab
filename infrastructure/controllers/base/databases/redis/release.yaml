apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: databases
spec:
  interval: 6h
  chart:
    spec:
      chart: redis-stack-server
      version: 0.x
      sourceRef:
        kind: HelmRepository
        name: redis-stack
        namespace: databases
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  values:
    # Redis Stack Server configuration
    redis_stack_server:
      # Use latest stable version
      tag: "latest"

      # Resource limits matching our manual deployment
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    # Service configuration
    service:
      type: ClusterIP
      port: 6379

    # Storage - using emptyDir (no persistence for now)
    persistence:
      enabled: false

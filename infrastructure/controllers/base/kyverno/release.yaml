apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 6h
  chart:
    spec:
      chart: kyverno
      version: 3.8.0
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  maxHistory: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  values:
    # Admission controller configuration
    # HA: 2 replicas for webhook availability during node reboots
    admissionController:
      replicas: 2
      revisionHistoryLimit: 2

      # Allow scheduling on control plane for HA
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      # Rolling update strategy: delete old pod before creating new
      # Required with 2 replicas + required anti-affinity on 2 worker nodes
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1

      # Hard anti-affinity: one admission controller per node (true HA)
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - admission-controller
            topologyKey: kubernetes.io/hostname

      # Container resources and security context
      # NOTE: admissionController uses container.resources (not top-level resources)
      # unlike backgroundController/cleanupController/reportsController
      container:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault

      # Service monitor for Prometheus
      serviceMonitor:
        enabled: true
        interval: 60s
        additionalLabels:
          release: kube-prometheus-stack

    # Background controller for policy reports
    backgroundController:
      enabled: true
      replicas: 1
      revisionHistoryLimit: 2

      # Resource limits
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      serviceMonitor:
        enabled: true
        interval: 60s
        additionalLabels:
          release: kube-prometheus-stack

    # Cleanup controller
    cleanupController:
      enabled: true
      replicas: 1
      revisionHistoryLimit: 2

      # Resource limits
      # Peak usage: 120Mi (was hitting 93% of 128Mi limit)
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      serviceMonitor:
        enabled: true
        interval: 60s
        additionalLabels:
          release: kube-prometheus-stack

    # Reports controller
    reportsController:
      enabled: true
      replicas: 1
      revisionHistoryLimit: 2

      # Resource limits
      # Peak usage: 206Mi (was hitting 81% of 256Mi limit)
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          cpu: 300m
          memory: 384Mi

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      serviceMonitor:
        enabled: true
        interval: 60s
        additionalLabels:
          release: kube-prometheus-stack

    # Feature flags
    features:
      # Generate policy reports in background
      policyReports:
        enabled: true

      # Admission reports for real-time validation
      admissionReports:
        enabled: true

      # Validate existing resources in background
      backgroundScan:
        enabled: true
        interval: 1h

    # CRDs configuration
    crds:
      install: true

    # Global settings
    config:
      # Resource filters (exclude system namespaces)
      resourceFilters:
        - "[*/*,kube-system/*,kyverno/*]"
        - "[*/*,kube-public/*]"
        - "[*/*,kube-node-lease/*]"
        - "[*/*,flux-system/*]"

      # Webhook configuration
      webhookAnnotations: {}
      webhookMatchConditions: []

    # Metrics
    metricsService:
      create: true
      type: ClusterIP

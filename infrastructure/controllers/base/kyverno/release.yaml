apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 6h
  chart:
    spec:
      chart: kyverno
      version: 3.3.x
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  values:
    # Admission controller configuration
    admissionController:
      replicas: 1

      # Resource limits
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      # Service monitor for Prometheus
      serviceMonitor:
        enabled: true

      # Anti-affinity (none for single node)
      podAntiAffinity:
        enabled: false

    # Background controller for policy reports
    backgroundController:
      enabled: true
      replicas: 1

      # Resource limits
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      serviceMonitor:
        enabled: true

    # Cleanup controller
    cleanupController:
      enabled: true
      replicas: 1

      # Resource limits
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      serviceMonitor:
        enabled: true

    # Reports controller
    reportsController:
      enabled: true
      replicas: 1

      # Resource limits
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      serviceMonitor:
        enabled: true

    # Feature flags
    features:
      # Generate policy reports in background
      policyReports:
        enabled: true

      # Admission reports for real-time validation
      admissionReports:
        enabled: true

      # Validate existing resources in background
      backgroundScan:
        enabled: true
        interval: 1h

    # CRDs configuration
    crds:
      install: true

    # Global settings
    config:
      # Resource filters (exclude system namespaces)
      resourceFilters:
        - "[*/*,kube-system/*,kyverno/*]"
        - "[*/*,kube-public/*]"
        - "[*/*,kube-node-lease/*]"
        - "[*/*,flux-system/*]"

      # Webhook configuration
      webhooks:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values:
                  - kube-system
                  - kube-public
                  - kube-node-lease
                  - kyverno
                  - flux-system

    # Metrics
    metricsService:
      create: true
      type: ClusterIP

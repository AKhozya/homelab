apiVersion: apps/v1
kind: Deployment
metadata:
  name: csp-reporter
  namespace: csp-reporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: csp-reporter
  template:
    metadata:
      labels:
        app: csp-reporter
    spec:
      serviceAccountName: csp-reporter
      containers:
      - name: csp-reporter
        image: ghcr.io/jacobian/csp-reporter:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi

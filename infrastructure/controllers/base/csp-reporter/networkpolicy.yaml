apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: csp-reporter-network-policy
  namespace: csp-reporter
spec:
  podSelector:
    matchLabels:
      app: csp-reporter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow CSP reports from Traefik (internal access)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
    # Allow CSP reports from Cloudflare Tunnel (external access)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53

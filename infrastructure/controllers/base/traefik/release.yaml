apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 6h
  chart:
    spec:
      chart: traefik
      version: 32.x
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Deployment settings
    deployment:
      replicas: 1
    
    # Service settings
    service:
      type: LoadBalancer
    
    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    
    # Ports configuration
    ports:
      web:
        port: 80
        exposedPort: 80
      websecure:
        port: 443
        exposedPort: 443
        tls:
          enabled: true
    
    # Enable Prometheus metrics
    metrics:
      prometheus:
        service:
          enabled: true
        serviceMonitor:
          enabled: true
    
    # Enable access logs
    logs:
      access:
        enabled: true

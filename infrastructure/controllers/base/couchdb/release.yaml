apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: couchdb
  namespace: couchdb
spec:
  interval: 6h
  chart:
    spec:
      chart: couchdb
      version: 4.6.x
      sourceRef:
        kind: HelmRepository
        name: couchdb
        namespace: couchdb
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  values:
    # CouchDB cluster configuration
    clusterSize: 3

    # Cluster UUID (required for multi-node setup)
    couchdbConfig:
      couchdb:
        uuid: beb932d28abcf87163a94cf52f1a795e

    # Admin credentials from secret
    adminUsername: admin
    adminHash: "-pbkdf2-b1eb7a68b0778a529c68d30749954e9cffa7788f,b4c49f1aa5f10afc7c64959e1a05c5b7,10"
    adminPassword: gOozAaCDkKRA3j//ZsJjLyRtUbT5O1DFSjM+mBgf+5Y=
    createAdminSecret: false  # We manage it manually with SOPS

    # Use existing secret for admin credentials
    existingSecret: couchdb-admin

    # Persistent storage
    persistentVolume:
      enabled: true
      size: 10Gi
      storageClass: local-path
      accessModes:
        - ReadWriteOnce

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    # Service configuration
    service:
      type: ClusterIP
      externalPort: 5984

    # Enable clustering
    enableSearch: false

    # Monitoring
    prometheus:
      enabled: false

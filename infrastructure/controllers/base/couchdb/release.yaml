apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: couchdb
  namespace: couchdb
spec:
  interval: 6h
  chart:
    spec:
      chart: couchdb
      version: 4.6.x
      sourceRef:
        kind: HelmRepository
        name: couchdb
        namespace: couchdb
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  values:
    # CouchDB cluster configuration
    clusterSize: 3

    # Cluster UUID (required for multi-node setup)
    couchdbConfig:
      couchdb:
        uuid: beb932d28abcf87163a94cf52f1a795e

    # Admin credentials (chart will create secret)
    adminUsername: admin
    # adminHash removed so chart will generate a fresh hash from the plaintext password
    adminPassword: "Jz8r$kQ7vF2pN9yLw4sTqZ6uM1hVbX0cR5eG3nYpC0mBvL2x"
    createAdminSecret: true

    # Persistent storage
    persistentVolume:
      enabled: true
      size: 100Gi
      storageClass: local-path
      accessModes:
        - ReadWriteOnce

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 2Gi

    # Service configuration
    service:
      type: ClusterIP
      externalPort: 5984

    # Enable clustering
    enableSearch: false

    # Monitoring
    prometheus:
      enabled: false

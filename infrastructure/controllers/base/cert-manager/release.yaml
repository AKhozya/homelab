apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 6h
  chart:
    spec:
      chart: cert-manager
      version: 1.16.x
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: cert-manager
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    recreate: true
    cleanupOnFail: true
  values:
    # Install CRDs as part of the Helm release
    installCRDs: true
    
    # Global settings
    global:
      leaderElection:
        namespace: cert-manager
    
    # Resource limits for cert-manager controller
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    # Webhook settings
    # Note: Webhook deployment may be scaled to 0 replicas and webhook configurations
    # may be deleted if experiencing Kubernetes API server timeout issues (30s default).
    # The webhook provides admission validation but is not strictly required for cert-manager
    # operation, as the controllers also perform validation.
    webhook:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      # Increase webhook timeout for slow clusters
      timeoutSeconds: 30
      # Configure ValidatingWebhookConfiguration with higher timeout
      config:
        apiVersion: webhook.config.cert-manager.io/v1alpha1
        kind: WebhookConfiguration
        # Increase webhook timeout to 60 seconds for slow API server
        timeoutSeconds: 60
      # Liveness probe settings
      livenessProbe:
        failureThreshold: 3
        initialDelaySeconds: 60
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 1
      # Readiness probe settings  
      readinessProbe:
        failureThreshold: 3
        initialDelaySeconds: 5
        periodSeconds: 5
        successThreshold: 1
        timeoutSeconds: 1

    # CA Injector settings
    cainjector:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    # Enable Prometheus metrics
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
        prometheusInstance: default

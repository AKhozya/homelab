apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: coredns-ha
  namespace: kube-system
  labels:
    app: coredns-ha
    k8s-app: kube-dns
    app.kubernetes.io/name: coredns-ha
spec:
  # DaemonSet (was Deployment, 2026-06-05): exactly one CoreDNS per node. The Deployment's soft
  # topologySpread (ScheduleAnyway) repeatedly skewed under least-allocated scoring + rolling-update
  # double-counting (06-04: wn2 had ZERO local coredns -> flannel blackout on wn2 = total pod-DNS
  # loss there, JobFailed audiobookshelf-init + authentik crashloop x17). A node-local replica
  # bounds that blast radius; DaemonSet pods also auto-tolerate disk/memory-pressure taints.
  # Pods carry k8s-app=kube-dns so the kube-dns Service (10.43.0.10) load-balances across them.
  # Unique selector app=coredns-ha. Reuses the addon-named `coredns` ConfigMap (Corefile +
  # NodeHosts) and ServiceAccount — Flux owns these outright since `--disable=coredns`
  # (config.yaml.j2; addon deleted its copies on CP k3s restart, see clusters/coredns.yaml).
  # See docs/plans/2026-05-31-reboot-wedge-prevention.md (Stage 3).
  revisionHistoryLimit: 2
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: coredns-ha
  template:
    metadata:
      labels:
        app: coredns-ha
        k8s-app: kube-dns
        app.kubernetes.io/name: coredns-ha
    spec:
      priorityClassName: system-cluster-critical
      serviceAccountName: coredns
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 30
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: coredns
          image: rancher/mirrored-coredns-coredns:1.14.3
          imagePullPolicy: IfNotPresent
          args: ["-conf", "/etc/coredns/Corefile"]
          resources:
            requests:
              cpu: 100m
              memory: 70Mi
            limits:
              memory: 170Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add: ["NET_BIND_SERVICE"]
              drop: ["all"]
          ports:
            - containerPort: 53
              name: dns
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 9153
              name: metrics
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
              scheme: HTTP
            periodSeconds: 2
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: config-volume
              mountPath: /etc/coredns
              readOnly: true
            - name: custom-config-volume
              mountPath: /etc/coredns/custom
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config-volume
          configMap:
            name: coredns
            defaultMode: 420
            items:
              - key: Corefile
                path: Corefile
              - key: NodeHosts
                path: NodeHosts
        - name: custom-config-volume
          configMap:
            name: coredns-custom
            optional: true
            defaultMode: 420

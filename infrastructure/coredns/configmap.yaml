apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  # Byte-exact copy of the live k3s-addon coredns Corefile (captured 2026-05-31) so Flux can adopt
  # it without churn while the addon still co-owns it. After --disable, Flux owns it outright.
  Corefile: |
    .:53 {
        errors
        health
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
        }
        hosts /etc/coredns/NodeHosts {
          ttl 60
          reload 15s
          fallthrough
        }
        prometheus :9153
        cache 30
        loop
        reload
        loadbalance
        import /etc/coredns/custom/*.override
        forward . /etc/resolv.conf
    }
    import /etc/coredns/custom/*.server
  # NodeHosts: k3s auto-maintained these per node; under Flux they are STATIC. IPv4 entries are
  # DHCP-reserved (stable), and node-name resolution needs only them. Global IPv6 addresses stay
  # out: the ISP prefix plus an EUI-64 host part identify the home network and each NIC's MAC.
  # The ULA entry is not globally routable. If a node's IPv6 changes, refresh or drop it.
  NodeHosts: |
    192.168.1.126 worker-node-2
    192.168.1.127 gmk-k3s-control-plane
    192.168.1.129 worker-node
    fd00::3a05:25ff:fe34:1171 worker-node-2

apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  # Started as a byte-exact copy of the k3s-addon Corefile (captured 2026-05-31), so Flux adopted
  # it without churn. Since --disable=coredns, Flux owns it outright.
  Corefile: |
    .:53 {
        errors
        health
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
        }
        hosts /etc/coredns/NodeHosts {
          ttl 60
          reload 15s
          fallthrough
        }
        prometheus :9153
        cache 30
        loop
        reload
        loadbalance
        import /etc/coredns/custom/*.override
        forward . /etc/resolv.conf
    }
    import /etc/coredns/custom/*.server
  # NodeHosts: k3s auto-maintained these per node; under Flux they are STATIC. The IPv4 entries are
  # the nodes' static addresses, and node-name resolution needs only them. No IPv6 entry: an EUI-64
  # host part holds the NIC's MAC, and this repo is public.
  NodeHosts: |
    192.168.1.126 worker-node-2
    192.168.1.127 gmk-k3s-control-plane
    192.168.1.129 worker-node
    192.168.1.231 immich-vm

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coredns-ha
  namespace: kube-system
  labels:
    app: coredns-ha
spec:
  # DaemonSet pod per node (3), tolerate losing 2 to voluntary disruption (the reboot play only
  # cordons — never drains/evicts — so this never blocks a reboot; it guards manual drains).
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: coredns-ha

apiVersion: v1
kind: Service
metadata:
  name: kube-dns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
    kubernetes.io/name: CoreDNS
spec:
  type: ClusterIP
  # PINNED — pods' /etc/resolv.conf points at 10.43.0.10 (kubelet --cluster-dns). Must be reproduced
  # exactly so that after --disable deletes the addon Service, Flux recreates it on the SAME IP.
  clusterIP: 10.43.0.10
  selector:
    k8s-app: kube-dns
  ports:
    - name: dns
      port: 53
      protocol: UDP
      targetPort: 53
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
    - name: metrics
      port: 9153
      protocol: TCP
      targetPort: 9153

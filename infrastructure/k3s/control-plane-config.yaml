# K3s Control Plane Configuration
# Location: /etc/rancher/k3s/config.yaml
#
# This file configures the K3s control plane node with custom settings.
# After modifying, restart K3s: sudo systemctl restart k3s

# Storage Configuration
# Use the 4.09TB LVM storage on worker node for all PVCs
default-local-storage-path: /mnt/k8s-storage

# Components
# Disable Helm controller (using Flux for GitOps instead)
disable-helm-controller: true

# Node Configuration
# Set explicit node name for the control plane
node-name: gmk-k3s-control-plane

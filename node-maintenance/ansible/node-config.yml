---
# node-config.yml — idempotent node config drift-heal.
# Invoke from CP: ansible-playbook -D /etc/node-maintenance/ansible/node-config.yml -i /etc/node-maintenance/ansible/inventory.yml
# Role order: `packages` first so pkgs (ufw, logrotate, etc.) exist before config
# roles reference them. `ad_hoc` tasks tagged `never` — skipped by default daily
# timer, invoked explicitly via `-t <tag>`.
#
# Plays, in order:
#   non-disruptive (all, parallel): file copies, package state, firewall_preflight.
#   firewall (all, serial:1): UFW reload races with the k3s/flannel chain rebuild, so
#       heal one node at a time. Paired with the firewall role's drift fingerprint
#       gate, the rules block runs only when the role detects real drift.
#   post-firewall (all, parallel): hardening, nic_tuning, security_scan, ad_hoc.
#   Immich GPU node (virtual): immich_gpu_node.
#   workers only: firewall_preflight, clusterip_heal, node_isolation_heal.
#   control-plane only: clusterip_heal_cp, kubectl proxy removal.
#   report a firewall rescue or an unverified CNI heal (all).

- name: Node config drift-heal — non-disruptive (all hosts, parallel)
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: packages
    - role: base_config
    - role: k3s_config
    - role: k3s_image_gc
    # firewall_preflight runs BEFORE firewall so any drift-induced ip6tables
    # error gets healed (settle + modprobe + chain repair) before ufw tasks
    # touch the firewall.
    - role: firewall_preflight

- name: Node config drift-heal — firewall (serial, blast-radius limit)
  hosts: all
  become: true
  gather_facts: false
  serial: 1
  roles:
    - role: firewall

- name: Node config drift-heal — post-firewall (all hosts, parallel)
  hosts: all
  become: true
  gather_facts: false
  roles:
    - role: hardening
    - role: nic_tuning
    - role: security_scan
    - role: ad_hoc

# Immich GPU node (the `virtual` group = the Arch VM on the NAS). Runs the immich_gpu_node role:
# i915 render config, virtiofs library mount, guest heal watchdog, AND the reset-bug carve-outs
# (kernel.panic=0 + systemd RuntimeWatchdogSec=0 overrides) that keep a guest lockup from
# auto-rebooting in-guest → wedging the passed-through iGPU → crashing the NAS host. Runs AFTER
# `hardening` so its watchdog/panic sysctl + system.conf drop-ins are on disk to override.
- name: Node config drift-heal — Immich GPU node (i915 + virtiofs + guest-heal + reset-bug carve-outs)
  hosts: virtual
  become: true
  gather_facts: true
  # If a later task fails (the virtiofs mount, the AUR clone), force_handlers still runs the notified
  # handlers. The next run sees unchanged files and does not notify those handlers again.
  force_handlers: true
  roles:
    - role: immich_gpu_node

- name: Node config drift-heal (workers only)
  hosts: workers
  become: true
  gather_facts: false
  roles:
    # Defense: re-run preflight on workers. The play boundary resets state and a
    # cheap settle barrier guards against role additions that might touch ufw.
    - role: firewall_preflight
    # Node-local self-heal for the post-reboot kube-proxy ClusterIP DNAT wedge
    # (restart k3s-agent when 10.43.0.1 DNAT is missing). Workers here; the CP is
    # handled by clusterip_heal_cp below (pod-netns probe + k3s restart).
    - role: clusterip_heal
    # Node-local self-recovery for CP isolation (k3s-agent tunnel wedged, node NotReady, host still
    # alive): the 2026-07-10 W2 90-min isolation that no other watchdog caught. Ladder: restart
    # k3s-agent, then a staggered self-reboot. Active since 2026-07-23 after a clean 13-day dry-run;
    # node_isolation_dry_run switches it back to dry-run.
    # Excluded on the `virtual` group: its ladder ends in an in-guest `systemctl reboot`, which on the
    # GPU-passthrough VM wedges the iGPU and crashes the NAS host. clusterip_heal (above) still runs
    # there; its k3s-agent restart is the safe recovery.
    - role: node_isolation_heal
      when: "'virtual' not in group_names"

- name: Node config drift-heal (control-plane only)
  hosts: control_plane
  become: true
  gather_facts: false
  roles:
    # CP counterpart of clusterip_heal. The CP host-netns ClusterIP probe false-reads wedged, so this
    # uses a pod-netns probe (nsenter into coredns) and a timeout-guarded `systemctl restart k3s`. A CP
    # k3s restart took ~30-60s and reprogrammed the DNAT when tested 2026-06-29; the timeout turns any
    # future hang into a give-up alert. If ClusterIP DNAT stays broken after a reboot, a CP-pinned pod
    # (e.g. uptime-kuma) stays DNS-dead without this role.
    - role: clusterip_heal_cp
  tasks:
    # This unit serves `kubectl proxy` as root with the admin kubeconfig on 127.0.0.1:8001 and no
    # auth: any local process, hostNetwork pods included, gets cluster-admin. No playbook uses it.
    - name: Check for the node-maintenance-kubectl-proxy.service unit file
      ansible.builtin.stat:
        path: /etc/systemd/system/node-maintenance-kubectl-proxy.service
      register: kubectl_proxy_unit

    - name: Stop and disable node-maintenance-kubectl-proxy.service
      ansible.builtin.systemd_service:
        name: node-maintenance-kubectl-proxy.service
        enabled: false
        state: stopped
      when: kubectl_proxy_unit.stat.exists

    - name: Remove node-maintenance-kubectl-proxy.service unit file
      ansible.builtin.file:
        path: /etc/systemd/system/node-maintenance-kubectl-proxy.service
        state: absent
      notify: Reload systemd after removing the proxy unit
  handlers:
    - name: Reload systemd after removing the proxy unit
      ansible.builtin.systemd_service:
        daemon_reload: true

# The firewall role's rescue and firewall_preflight both record a problem and let the run go
# on. This play fails each such node after every other play has run, so the recap counts it
# and node-config-notify.sh alerts.
- name: Node config drift-heal — report a firewall rescue or an unverified CNI heal
  hosts: all
  gather_facts: false
  tags: [always]   # a --tags firewall run must still report these
  tasks:
    - name: Fail if firewall-preflight's flush-all recovery left the portmap CNI rules unverified
      ansible.builtin.fail:
        msg: >-
          firewall-preflight.sh re-enabled UFW with a flush-all, and ufw-heal-post-k3s.sh cannot
          verify the portmap CNI entry rules. hostPort traffic may have no DNAT or masquerade. See
          `journalctl -t firewall-preflight -t ufw-heal` on this node.
      when: firewall_cni_heal_failed | default(false)

    - name: Fail if the UFW rule batch needed the rescue on this node
      ansible.builtin.fail:
        msg: >-
          The UFW rule batch failed and the rescue ran ufw-heal-post-k3s.sh. The fingerprint
          stays uncached, so the next drift-heal re-applies the batch. Diag snapshots:
          /var/log/node-maintenance/ufw-diag-*.txt on this node.
      when: ufw_rescue_ran | default(false)

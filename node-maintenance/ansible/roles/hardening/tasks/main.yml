---
# hardening — SSH, sysctls, kubelet, systemd drop-ins, resolved, udev, tmpfiles, fail2ban.
# Applies to all hosts.
#
# Safety:
# - SSH drop-ins: `sshd -t` validate on every run, reload (not restart) only after a copy; a reload keeps sessions.
# - sysctls: `sysctl --system` handler, non-disruptive.
# - kubelet.yaml + k3s service.d drop-ins: no restart handler — apply on next k3s restart.
# - udev: reload + trigger handler, safe for existing devices.
# - fail2ban: jail.local drift-healed; LAN whitelisted in DEFAULT (no lockout risk).

# ---------- SSH ----------
- name: Deploy sshd hardening drop-in
  ansible.builtin.copy:
    src: sshd-99-hardening.conf
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  register: sshd_dropin
  tags: [hardening, ssh]

- name: Deploy sshd port drop-in
  # Only where the main sshd_config leaves Port commented out (host var sshd_port_dropin).
  # sshd adds up every Port line, so on a node whose main file already sets the port a
  # second line binds it twice and logs an error on each reload. Writing ansible_port keeps
  # the port this play connects on.
  ansible.builtin.copy:
    content: "Port {{ ansible_port }}\n"
    dest: /etc/ssh/sshd_config.d/10-port.conf
    owner: root
    group: root
    mode: "0644"
  when: sshd_port_dropin | default(false) | bool
  register: sshd_port
  tags: [hardening, ssh]

- name: Remove the hand-made x.conf drop-in
  # An unmanaged immich-vm leftover. Its only line, `UseDNS no`, is the OpenSSH default, so
  # removing it keeps sshd's behaviour.
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/x.conf
    state: absent
  register: sshd_stray
  tags: [hardening, ssh]

- name: Validate sshd config
  # In-task guard (not handler): validate must fire IMMEDIATELY after copy so a
  # bad config blocks subsequent reload. Handler fires end-of-play — too late.
  # Runs every time, not only after a copy: a failed validate leaves the copied file
  # in place, so a later unchanged run would pass and the fault would surface only
  # when sshd next starts, at a reboot.
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  tags: [hardening, ssh]

- name: Reload sshd  # noqa: no-handler
  # Paired with validate above — reload ONLY if validate passed (same play).
  ansible.builtin.systemd_service:
    name: sshd
    state: reloaded
  when: sshd_dropin.changed or sshd_port.changed or sshd_stray.changed
  tags: [hardening, ssh]

# ---------- sysctls ----------
- name: Deploy sysctl drop-ins
  ansible.builtin.copy:
    src: "sysctl-{{ item }}"
    dest: "/etc/sysctl.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - 99-unified-hardening.conf
    - 99-k8s-performance.conf
    - 99-watchdog.conf
  notify: Apply sysctls
  tags: [hardening, sysctl]

- name: Deploy the NMI watchdog sysctl on physical nodes
  ansible.builtin.copy:
    src: sysctl-99-nmi-watchdog.conf
    dest: /etc/sysctl.d/99-nmi-watchdog.conf
    owner: root
    group: root
    mode: "0644"
  when: "'virtual' not in group_names"
  notify: Apply sysctls
  tags: [hardening, sysctl]

- name: Remove the NMI watchdog sysctl from VMs
  ansible.builtin.file:
    path: /etc/sysctl.d/99-nmi-watchdog.conf
    state: absent
  when: "'virtual' in group_names"
  notify: Apply sysctls
  tags: [hardening, sysctl]

- name: Remove legacy sysctl files (superseded by unified-hardening)
  ansible.builtin.file:
    path: "/etc/sysctl.d/{{ item }}"
    state: absent
  loop:
    - 51-kptr-restrict.conf
    - 99-security-hardening.conf
  notify: Apply sysctls
  tags: [hardening, sysctl]

# ---------- systemd manager + k3s drop-ins ----------
- name: Ensure /etc/systemd/system.conf.d exists
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [hardening, systemd]

- name: Deploy systemd hardware watchdog drop-in
  ansible.builtin.copy:
    src: systemd-watchdog.conf
    dest: /etc/systemd/system.conf.d/watchdog.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [hardening, systemd]

- name: Ensure systemd default timeouts (main system.conf)
  ansible.builtin.lineinfile:
    path: /etc/systemd/system.conf
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    state: present
  loop:
    - { key: DefaultTimeoutStartSec, value: 120s }
    - { key: DefaultTimeoutStopSec, value: 120s }
  notify: Reload systemd
  tags: [hardening, systemd]

- name: Ensure k3s service.d drop-in directory exists
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ k3s_service }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [hardening, k3s-service]

- name: Deploy k3s service drop-ins
  ansible.builtin.copy:
    src: "k3s-{{ item }}"
    dest: "/etc/systemd/system/{{ k3s_service }}.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - shutdown-timeout.conf
    - conntrack-fix.conf
    - network-hardening.conf
  notify: Reload systemd
  tags: [hardening, k3s-service]

# ---------- resolved (LLMNR disable) ----------
- name: Ensure /etc/systemd/resolved.conf.d exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [hardening, resolved]

- name: Deploy resolved LLMNR disable drop-in
  ansible.builtin.copy:
    src: resolved-no-llmnr.conf
    dest: /etc/systemd/resolved.conf.d/no-llmnr.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-resolved
  tags: [hardening, resolved]

# ---------- DNS decoupling: cluster-independent upstream ----------
# Break the node→blocky→kube-proxy circular dependency. Nodes + CoreDNS
# (forward . /etc/resolv.conf, dnsPolicy: Default) must resolve external DNS
# without a cluster pod.
- name: Deploy resolved upstream-DNS drop-in (cluster-independent public DNS)
  ansible.builtin.copy:
    src: resolved-upstream-dns.conf
    dest: /etc/systemd/resolved.conf.d/upstream-dns.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-resolved
  tags: [hardening, resolved, networkd-dns]

- name: Ensure primary-NIC networkd drop-in dir exists
  ansible.builtin.file:
    path: "/etc/systemd/network/{{ primary_network_file }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [hardening, networkd-dns]

- name: Deploy networkd no-DHCP-DNS drop-in (drop blocky DNS from link)
  ansible.builtin.copy:
    src: networkd-no-dhcp-dns.conf
    dest: "/etc/systemd/network/{{ primary_network_file }}.d/10-no-dhcp-dns.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload networkd
  tags: [hardening, networkd-dns]

# Static IPv4 on the primary NIC, for each host that sets `static_ipv4` in host_vars.
# This play runs on every host at once. If one merge enables two hosts, both reconfigure
# together, so enable one host per merge: a CP link loss on 2026-09-12 left both MySQL
# nodes read-only.
- name: Switch the primary NIC to a static IPv4 address
  when: static_ipv4 is defined
  tags: [hardening, networkd-static]
  block:
    - name: Read the primary NIC's IPv4 addresses
      ansible.builtin.command: "ip -4 -j addr show dev {{ static_ipv4.interface }}"
      register: static_ipv4_addr
      changed_when: false

    - name: Read the default IPv4 routes
      ansible.builtin.command: ip -4 -j route show default
      register: static_ipv4_route
      changed_when: false

    # If host_vars name a different address, interface or gateway than the node uses now,
    # the reload below would move the node off its address. Refuse instead.
    - name: Refuse unless the NIC already holds exactly this address and default route
      ansible.builtin.assert:
        that:
          - static_ipv4_live_addrs | length == 1
          - (static_ipv4_live_addrs[0].local ~ '/' ~ static_ipv4_live_addrs[0].prefixlen) == static_ipv4.address
          - static_ipv4_live_gateways == [static_ipv4.gateway]
        fail_msg: >-
          {{ static_ipv4.interface }} holds {{ static_ipv4_live_addrs | map(attribute='local') | list }}
          with default gateways {{ static_ipv4_live_gateways }}; host_vars want {{ static_ipv4.address }}
          via {{ static_ipv4.gateway }}. Nothing written.
        quiet: true
      vars:
        static_ipv4_live_addrs: "{{ ((static_ipv4_addr.stdout | from_json) | first | default({})).addr_info | default([]) }}"
        static_ipv4_live_gateways: >-
          {{ static_ipv4_route.stdout | from_json | selectattr('dev', 'equalto', static_ipv4.interface)
             | map(attribute='gateway') | list }}

    - name: Write the static .network file for the primary NIC
      ansible.builtin.template:
        src: primary-static.network.j2
        dest: "/etc/systemd/network/{{ primary_network_file }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
      register: static_ipv4_file

    # Here, not through the Reload networkd handler: the check below must see the new config.
    - name: Reload networkd so the static config takes over  # noqa: no-handler
      ansible.builtin.command: networkctl reload
      when: static_ipv4_file is changed
      changed_when: true

    - name: Wait until networkd holds the address as static, with no DHCPv4 client
      ansible.builtin.command: "networkctl status --json=short {{ static_ipv4.interface }}"
      register: static_ipv4_status
      changed_when: false
      retries: 10
      delay: 3
      until: >-
        'DHCPv4Client' not in (static_ipv4_status.stdout | from_json)
        and ((static_ipv4_status.stdout | from_json).Addresses | default([])
             | selectattr('Family', 'equalto', 2) | selectattr('ConfigSource', 'equalto', 'static')
             | map(attribute='Address') | map('join', '.') | list) == [static_ipv4.address.split('/') | first]

# ---------- kubelet ----------
- name: Deploy kubelet config (applies on next k3s restart)
  ansible.builtin.copy:
    src: k3s-kubelet.yaml
    dest: /etc/rancher/k3s/kubelet.yaml
    owner: root
    group: root
    mode: "0644"
  tags: [hardening, kubelet]

# ---------- modprobe / udev / tmpfiles (power) ----------
- name: Deploy NVMe APST disable modprobe conf
  ansible.builtin.copy:
    src: modprobe-nvme-no-apst.conf
    dest: /etc/modprobe.d/nvme-no-apst.conf
    owner: root
    group: root
    mode: "0644"
  tags: [hardening, power]

- name: Deploy udev rules (PCI runtime PM + SATA ALPM)
  ansible.builtin.copy:
    src: "udev-{{ item }}"
    dest: "/etc/udev/rules.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - 60-pci-no-runtime-pm.rules
    - 60-sata-no-alpm.rules
  notify: Reload udev rules
  tags: [hardening, power]

- name: Remove legacy 60-nvme-no-pm.rules (superseded by 60-pci-no-runtime-pm.rules)
  ansible.builtin.file:
    path: /etc/udev/rules.d/60-nvme-no-pm.rules
    state: absent
  notify: Reload udev rules
  tags: [hardening, power]

- name: Deploy tmpfiles.d entries (CPU power + NVMe no-PM)
  ansible.builtin.copy:
    src: "tmpfiles-{{ item }}"
    dest: "/etc/tmpfiles.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - cpu-power-settings.conf
    - nvme-no-pm.conf
  notify: Apply tmpfiles
  tags: [hardening, power]

- name: Remove legacy cpu-governor tmpfile (superseded by cpu-power-settings)
  ansible.builtin.file:
    path: /etc/tmpfiles.d/cpu-governor.conf
    state: absent
  notify: Apply tmpfiles
  tags: [hardening, power]

# ---------- fail2ban ----------
# fail2ban is in `pacman_packages_base` (group_vars/all.yml). jail.local uses the systemd
# backend, which reads journald: Arch has no /var/log/auth.log without rsyslog.
- name: Deploy fail2ban jail.local
  ansible.builtin.copy:
    src: fail2ban-jail.local
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban
  tags: [hardening, fail2ban]

- name: Ensure fail2ban service enabled + active
  ansible.builtin.systemd_service:
    name: fail2ban.service
    enabled: true
    state: started
  tags: [hardening, fail2ban]

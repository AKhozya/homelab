---
- name: Apply sysctls
  ansible.builtin.command: /usr/bin/sysctl --system
  changed_when: false

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# Defined ABOVE Restart systemd-resolved so handler-run order drops the link's
# DHCP/RA DNS first, then resolved restarts and picks up the global drop-in.
- name: Reload networkd
  ansible.builtin.shell: |
    set -e
    networkctl reload
    resolvectl flush-caches
  changed_when: false

- name: Restart systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
  register: resolved_restart
  until: resolved_restart is not failed
  retries: 2
  delay: 5

- name: Reload udev rules
  ansible.builtin.shell: |
    udevadm control --reload-rules
    udevadm trigger --subsystem-match=pci --attr-match=class=0x010802 || true
  changed_when: false

- name: Apply tmpfiles
  ansible.builtin.command: /usr/bin/systemd-tmpfiles --create
  changed_when: false

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban.service
    state: restarted

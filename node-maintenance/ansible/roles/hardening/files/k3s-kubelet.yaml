apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
shutdownGracePeriod: 120s
shutdownGracePeriodCriticalPods: 30s
# Eviction: hard threshold at 10%, soft at 15% with 1m grace
evictionHard:
  imagefs.available: "10%"
  nodefs.available: "10%"
  memory.available: "100Mi"
evictionSoft:
  imagefs.available: "15%"
  nodefs.available: "15%"
  memory.available: "200Mi"
evictionSoftGracePeriod:
  imagefs.available: "1m"
  nodefs.available: "1m"
  memory.available: "1m"
# Log rotation
containerLogMaxSize: "50Mi"
containerLogMaxFiles: 5
# Streaming connection security (CIS benchmark)
streamingConnectionIdleTimeout: 5m
# The kubelet writes this duration (default 40s) into its Lease and renews every 25% of it, so ~15s here.
# It does not set the NotReady timeout. node-monitor-grace-period=75s in k3s_config's config.yaml.j2
# does: the node controller marks the node Unknown if it sees no lease renewal or status update for
# that long, and it ignores this value (upstream Kubernetes behaviour, not probed on this cluster).
# 086c33f9 raised both after the 2026-05-02 W2 NotReady incident, which the firewall role's UFW
# reload set off. Bare integer seconds, not a duration string.
nodeLeaseDurationSeconds: 60
# Force status post every 1m even when nothing changed (default 5m). Detects
# silent kubelet hangs faster than the lease alone.
nodeStatusReportFrequency: 1m

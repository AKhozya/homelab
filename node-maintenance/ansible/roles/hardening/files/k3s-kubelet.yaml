apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
shutdownGracePeriod: 120s
shutdownGracePeriodCriticalPods: 30s
# Eviction: hard threshold at 10%, soft at 15% with 1m grace
evictionHard:
  imagefs.available: "10%"
  nodefs.available: "10%"
  memory.available: "100Mi"
evictionSoft:
  imagefs.available: "15%"
  nodefs.available: "15%"
  memory.available: "200Mi"
evictionSoftGracePeriod:
  imagefs.available: "1m"
  nodefs.available: "1m"
  memory.available: "1m"
# Log rotation
containerLogMaxSize: "50Mi"
containerLogMaxFiles: 5
# Streaming connection security (CIS benchmark)
streamingConnectionIdleTimeout: 5m
# Node lease tolerance — widens window for brief network blips (UFW reload,
# kube-proxy reconcile, transient flannel iptables churn). Default 40s grace
# was insufficient during 2026-05-02 W2 NotReady incident triggered by
# firewall role's UFW reload cascade. Bumped to 60s + lockstep CM grace 75s
# in /etc/rancher/k3s/config.yaml (see k3s_config role on CP).
# Lease renewal happens every 25% of duration (60s → ~15s renewal cadence).
# Bare integer seconds (NOT a duration string).
nodeLeaseDurationSeconds: 60
# Force status post every 1m even when nothing changed (default 5m). Detects
# silent kubelet hangs faster than the lease alone.
nodeStatusReportFrequency: 1m

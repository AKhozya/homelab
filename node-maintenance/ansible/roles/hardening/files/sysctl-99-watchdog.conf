# Enable NMI watchdog for hard lockup detection. immich-vm (a VM) refuses this key with
# "Operation not permitted". The leading "-" makes sysctl ignore that failure, so
# `sysctl --system` in the drift-heal handler does not fail there.
-kernel.nmi_watchdog=1
# Panic on soft lockup (logs before crash)
kernel.softlockup_panic=1
# Panic on hard lockup (triggers reboot)
kernel.hardlockup_panic=1
# Log all lockups
kernel.softlockup_all_cpu_backtrace=1

# Auto-reboot 10 seconds after kernel panic
kernel.panic=10

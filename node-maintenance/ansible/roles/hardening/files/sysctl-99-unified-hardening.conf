# Unified K8s Node Hardening - sysctl settings
# Generated by unified-hardening.sh
# Last updated: 2025-12-17

# ===== KERNEL HARDENING =====
# Restrict kernel pointer exposure (prevent info leaks)
kernel.kptr_restrict = 2

# Restrict dmesg to root only
kernel.dmesg_restrict = 1

# Disable perf events for unprivileged users
kernel.perf_event_paranoid = 4

# Disable unprivileged BPF (prevent BPF exploits)
kernel.unprivileged_bpf_disabled = 1

# Harden BPF JIT compiler
net.core.bpf_jit_harden = 2

# Restrict ptrace (prevent process snooping)
kernel.yama.ptrace_scope = 1

# Disable core dumps to prevent info leaks
kernel.core_pattern = |/bin/false

# Reduce kernel log verbosity (prevent info leaks)
kernel.printk = 3 4 1 3

# Limited SysRq (176 = sync, remount-ro, reboot only)
# Use 0 to disable completely if not needed for debugging
kernel.sysrq = 176

# Disable unprivileged userfaultfd (prevent exploits)
vm.unprivileged_userfaultfd = 0

# Disable automatic TTY line discipline loading
dev.tty.ldisc_autoload = 0

# ===== FILESYSTEM HARDENING =====
# Protect FIFOs (prevent symlink attacks)
fs.protected_fifos = 2

# Protect regular files in world-writable dirs
fs.protected_regular = 2

# Disable SUID core dumps
fs.suid_dumpable = 0

# ===== NETWORK HARDENING =====
# Enable reverse path filtering (prevent IP spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Disable ICMP redirects (prevent MITM attacks)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Don't send ICMP redirects (we're not a router)
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Disable source routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Log suspicious packets (martians)
net.ipv4.conf.all.log_martians = 1

# Disable secure ICMP redirects (prevent MITM route injection)
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.default.log_martians = 1

# Disable secure ICMP redirects (prevent MITM route injection)
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# Protect against SYN flood attacks
net.ipv4.tcp_syncookies = 1

# Ignore ping broadcasts (prevent smurf attacks)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP error responses
net.ipv4.icmp_ignore_bogus_error_responses = 1

# ===== PERFORMANCE TUNING =====
# Use BBR congestion control (better for modern networks)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Increase TCP buffer sizes for high-throughput
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Reduce swappiness (prefer RAM over swap for K8s)
vm.swappiness = 10

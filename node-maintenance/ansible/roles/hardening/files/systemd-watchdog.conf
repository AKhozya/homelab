# Hardware watchdog — systemd pings /dev/watchdog0 (SP5100 TCO).
# RuntimeWatchdogSec: PID 1 freeze (kernel hang/deadlock) at runtime → hardware forces reboot.
# RebootWatchdogSec: arms the watchdog for the systemd-shutdown phase. If a reboot hangs in the
#   final unmount (/, /var, the multi-device LVM) or a device/dm quiesce, the kernel stays alive,
#   so the softlockup/hardlockup panic sysctls do not fire; the watchdog resets the node instead.
#   worker-node hung here during a maintenance reboot on 2026-06-20, and the old 10min default
#   meant the operator power-cycled first. 2min leaves ~20-40x margin over the normal
#   seconds-long final phase. journald has already stopped, so the final watchdog reset adds no
#   journal entry.
[Manager]
RuntimeWatchdogSec=30
RebootWatchdogSec=2min

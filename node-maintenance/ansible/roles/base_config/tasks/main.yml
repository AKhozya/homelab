---
# base-config — logrotate, journald caps, sudoers, node-maintenance user
# Applies to: all hosts (CP + workers). CP-only and worker-only tasks use `when: ... in group_names`.

- name: Ensure logrotate installed
  ansible.builtin.package:
    name: logrotate
    state: present
  register: pkg_logrotate
  until: pkg_logrotate is not failed
  retries: 3
  delay: 30
  tags: [base-config, logrotate]

- name: Deploy /etc/logrotate.d/pacman
  ansible.builtin.copy:
    src: logrotate-pacman
    dest: /etc/logrotate.d/pacman
    owner: root
    group: root
    mode: "0644"
  tags: [base-config, logrotate]

# The security scan runs on every node, so its logrotate config goes to every node.
- name: Deploy /etc/logrotate.d/security-tools
  ansible.builtin.copy:
    src: logrotate-security-tools
    dest: /etc/logrotate.d/security-tools
    owner: root
    group: root
    mode: "0644"
  tags: [base-config, logrotate]

- name: Deploy CP-only logrotate config (phase1/phase2/config logs)
  ansible.builtin.copy:
    src: logrotate-node-maintenance
    dest: /etc/logrotate.d/node-maintenance
    owner: root
    group: root
    mode: "0644"
  when: "'control_plane' in group_names"
  tags: [base-config, logrotate]

- name: Ensure logrotate.timer enabled + started
  ansible.builtin.systemd_service:
    name: logrotate.timer
    enabled: true
    state: started
  tags: [base-config, logrotate]

- name: Ensure fstrim + paccache timers enabled + started
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - fstrim.timer
    - paccache.timer
  tags: [base-config, timers]

# systemd-timesyncd: assert enabled + active. Single source of clock truth
# for all 4 nodes. Skew breaks certificate validity checks and the 75s node-lease
# grace; timesyncd holds ≪100ms in practice. NodeClockSkewDetected and
# NodeClockNotSynchronising in vmrules.yaml alert on node-exporter's node_timex_* metrics.
- name: Ensure systemd-timesyncd enabled + active
  ansible.builtin.systemd_service:
    name: systemd-timesyncd.service
    enabled: true
    state: started
  tags: [base-config, time-sync]

# kernel-modules-hook keeps /usr/lib/modules/<running> populated when pacman upgrades the
# kernel package. Without it, a mid-session `yay -Syyu` makes modprobe fail, ufw silently
# disables and the INPUT chain drops (W1 2026-05-02, immich-vm 2026-07-18).
# The package is in `extra` and in pacman_packages_base, so the `packages` role (first in
# node-config.yml) installs it on every run. This task only enables the boot-time cleanup service.
- name: Check kernel-modules-hook installed
  ansible.builtin.command: pacman -Q kernel-modules-hook
  register: kernel_modules_hook_check
  changed_when: false
  failed_when: false
  tags: [base-config, kernel-modules-hook]

- name: Ensure linux-modules-cleanup.service enabled (boot-time stale-modules sweep)
  ansible.builtin.systemd_service:
    name: linux-modules-cleanup.service
    enabled: true
  when: kernel_modules_hook_check.rc == 0
  tags: [base-config, kernel-modules-hook]

# Reaching here means the `packages` role should already have installed it and did not —
# a real failure, not a bootstrap gap. Fail loudly: node-config is a separate playbook from
# phase2, so this cannot wedge the phase2-pending interlock.
- name: Fail if kernel-modules-hook missing
  ansible.builtin.fail:
    msg: |
      kernel-modules-hook NOT installed on {{ inventory_hostname }} despite being declared in
      pacman_packages_base — the `packages` role did not converge. Investigate that first, then:
        sudo pacman -S --needed kernel-modules-hook
        sudo systemctl enable linux-modules-cleanup.service
      Without it, `pacman -Syu` mid-session wipes the running kernel's modules dir →
      modprobe failures → UFW silent-disable cascade (2026-05-02 W1, 2026-07-18 immich-vm).
  when: kernel_modules_hook_check.rc != 0
  tags: [base-config, kernel-modules-hook]

- name: Ensure /var/lib/node_exporter/textfile exists
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [base-config, time-sync, metrics]

# The heal watchdogs, firewall-preflight, k3s-wait-ready and ufw-heal-post-k3s source this file
# and exit 1 without it. base_config runs in the first play for every host, before any role that
# installs one of them. validate keeps a file with a syntax error from replacing a good copy.
# `always`: a tagged run (for example `-t firewall`) still installs the library first; a
# `--skip-tags base-config` run does not. A tagged run that does not skip base-config can update
# the library without the scripts outside its tags, so the library must stay compatible with
# scripts already on disk.
- name: Ensure the node-maintenance shell library directory exists
  ansible.builtin.file:
    path: /usr/local/lib/node-maintenance
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [base-config, node-script-lib, always]

- name: Deploy the node-maintenance shell library
  ansible.builtin.copy:
    src: node-script-lib.sh
    dest: /usr/local/lib/node-maintenance/node-script-lib.sh
    owner: root
    group: root
    mode: "0644"
    validate: bash -n %s
  tags: [base-config, node-script-lib, always]

# The node_timex_* metrics replace timesyncd-metric. If the timer is already gone, the
# stop fails, so failed_when is false.
- name: Stop + disable legacy timesyncd-metric.timer
  ansible.builtin.systemd_service:
    name: timesyncd-metric.timer
    enabled: false
    state: stopped
  failed_when: false
  tags: [base-config, time-sync, metrics]

# A run already in progress could write time_sync.prom again after the delete below.
- name: Stop legacy timesyncd-metric.service
  ansible.builtin.systemd_service:
    name: timesyncd-metric.service
    state: stopped
  failed_when: false
  tags: [base-config, time-sync, metrics]

# node-exporter serves every file in the textfile directory, so time_sync.prom must go too.
- name: Remove legacy timesyncd-metric files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/sbin/timesyncd-metric.sh
    - /etc/systemd/system/timesyncd-metric.service
    - /etc/systemd/system/timesyncd-metric.timer
    - /etc/systemd/system/timers.target.wants/timesyncd-metric.timer
    - /var/lib/node_exporter/textfile/time_sync.prom
  notify: Reload systemd
  tags: [base-config, time-sync, metrics]

- name: Ensure /etc/systemd/journald.conf.d exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [base-config, journald]

- name: Deploy journald 99-caps.conf
  ansible.builtin.copy:
    src: journald-99-caps.conf
    dest: /etc/systemd/journald.conf.d/99-caps.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
  tags: [base-config, journald]

- name: Remove stale journald 00-caps.conf (legacy filename)
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d/00-caps.conf
    state: absent
  notify: Restart journald
  tags: [base-config, journald]

- name: Deploy sudoers for node-maintenance
  ansible.builtin.copy:
    src: sudoers-node-maintenance
    dest: /etc/sudoers.d/node-maintenance
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -c -f %s
  tags: [base-config, sudoers]

# Admin user sudoers — pwd-required interactive sudo. File name `00_<user>`
# matches archinstall convention (00 prefix sorts before `node-maintenance`,
# alphabetical mostly cosmetic — sudoers.d files all read).
- name: Deploy sudoers for admin user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/00_{{ admin_user }}"
    content: "{{ admin_user }} ALL=(ALL) ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -c -f %s
  when: admin_user is defined
  tags: [base-config, sudoers]

- name: Ensure node-maintenance user shell is /bin/bash
  ansible.builtin.user:
    name: node-maintenance
    shell: /bin/bash
  tags: [base-config, user]

# HOME ships root:root 0750, so node-maintenance cannot create ~/.cache. If `yay -Syyu`
# (phase1 on CP, phase2 on workers) compiles an AUR package, Go puts GOCACHE in
# ~/.cache/go-build and the build fails with `mkdir .cache: permission denied`. On 2026-06-20
# this failed CP phase1 (yay 13.0.1 self-rebuild), so phase2 never ran on the workers.
# So on every host, node-maintenance owns HOME, .cache (go-build, yay clonedir) and .config (yay config). On workers
# ansible had already created .cache and .config root-owned as parents of the makepkg dirs.
- name: Own node-maintenance HOME + dotdirs (writable for AUR builds)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: node-maintenance
    group: node-maintenance
    mode: "{{ item.mode }}"
  loop:
    # HOME is 0751 (not 0750): the o+x lets the human SSH account stat (not list)
    # /var/lib/node-maintenance/phase2-pending WITHOUT sudo, so the no-sudo interlock in
    # cluster-reboot's watch-reboot.sh / trigger-reboot.sh reads it correctly. At 0750 the
    # human account can't traverse the dir → `[ -e phase2-pending ]` false-negatives to
    # "absent" always (masked a stuck flag ~1.7h on 2026-06-20). `.ssh` stays 0700 (set
    # below) so the SSH key is NOT exposed by the traversal bit.
    - {path: /var/lib/node-maintenance, mode: "0751"}
    - {path: /var/lib/node-maintenance/.cache, mode: "0755"}
    - {path: /var/lib/node-maintenance/.config, mode: "0755"}
  tags: [base-config, user, makepkg]

- name: Ensure /var/lib/node-maintenance/.ssh perms
  ansible.builtin.file:
    path: /var/lib/node-maintenance/.ssh
    state: directory
    owner: node-maintenance
    group: node-maintenance
    mode: "0700"
  tags: [base-config, user]

# Workers' authorized_keys = CP's node-maintenance pubkey ONLY (exclusive).
# Bootstrap path: install-worker.sh seeds via PUB_KEY substitution. Drift-heal
# below ensures any added/removed keys are reconciled. Source-of-truth = CP's
# /var/lib/node-maintenance/.ssh/id_ed25519.pub (derived once at install via
# `ssh-keygen -y` from SOPS-decrypted private key).
#
# NOTE: slurp runs unconditionally (run_once + delegate_to). Adding `when` here
# skips the task if the chosen run_once host fails the condition, leaving the
# registered var unset for every host — drift-heal then fails on workers.
- name: Read CP node-maintenance public key (source of truth)
  ansible.builtin.slurp:
    src: /var/lib/node-maintenance/.ssh/id_ed25519.pub
  register: cp_node_maintenance_pubkey
  delegate_to: "{{ groups['control_plane'][0] }}"
  run_once: true
  tags: [base-config, user, authorized-keys]

- name: Deploy node-maintenance authorized_keys (workers — CP pubkey only, exclusive)
  ansible.builtin.copy:
    dest: /var/lib/node-maintenance/.ssh/authorized_keys
    content: "{{ cp_node_maintenance_pubkey.content | b64decode | trim }}\n"
    owner: node-maintenance
    group: node-maintenance
    mode: "0600"
  when: "'workers' in group_names"
  tags: [base-config, user, authorized-keys]

# ---- claude-telegram bot: forced command on its SSH key ----
# The bot pod holds its own key on these accounts and uses it for the node-OS diagnostics the
# Kubernetes API cannot serve. Unrestricted that key is a full shell, which is a way around the
# pod's egress NetworkPolicy — curl from a node reaches the internet the pod may not. agent-diag
# allows a fixed set of read-only commands and nothing else.
#
# On immich-vm the immich_gpu_node role rewrites authorized_keys exclusively and writes this same
# line, byte for byte, so the two tasks agree.
#
# Drift-heal is the reason this lives here rather than in a one-off script: a `command=` entry
# edited by hand disappears silently the moment anything rewrites the file, and a security control
# that can vanish without a signal is the failure this is meant to prevent.
- name: Install agent-diag forced command wrapper
  ansible.builtin.copy:
    src: agent-diag
    dest: /usr/local/bin/agent-diag
    owner: root
    group: root
    mode: "0755"
  when: agent_diag_bot_pubkey | default('') | length > 0
  tags: [base-config, user, authorized-keys]

# authorized_key, not lineinfile: it matches a key by its key material. A regexp over the comment
# that misses would APPEND the restricted line and leave the unrestricted one in place — the
# restriction voids while the run reports changed. exclusive:false so the operator's own key on
# the same account is never touched; that key is the way back in if this entry is ever wrong.
- name: Restrict the claude-telegram bot key to agent-diag
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ agent_diag_bot_pubkey }}"
    key_options: 'command="/usr/local/bin/agent-diag",restrict'
    exclusive: false
    state: present
  when: agent_diag_bot_pubkey | default('') | length > 0
  tags: [base-config, user, authorized-keys]

# node-maintenance user-scoped makepkg override: phase2 AUR yay runs need a writable
# BUILDDIR/PKGDEST. A user-scope ~/.config/pacman/makepkg.conf wins over any
# system-wide /etc/makepkg.conf.d/ entry for this user (yay otherwise hits
# "Failed to create the directory $BUILDDIR" against a non-writable system path).
# SRCDEST is deliberately NOT set: `yay --cleanafter` only cleans its own per-package
# tree under .cache/yay/, so a redirected SRCDEST accumulates source tarballs it never
# touches. Left unset, sources land in the package dir and get cleaned. Measured
# 2026-08-01 — with SRCDEST set, --cleanafter logged "Cleaning .cache/yay/flux-bin"
# while the tarball survived in .cache/makepkg/sources. A surviving tarball shadows
# the URL: makepkg validates the file on disk and never re-downloads, so an upstream
# checksum correction can never be satisfied. That is what broke phase1 on 2026-08-01.
- name: Ensure node-maintenance user pacman config dir
  ansible.builtin.file:
    path: /var/lib/node-maintenance/.config/pacman
    state: directory
    owner: node-maintenance
    group: node-maintenance
    mode: "0755"
  when: "'workers' in group_names"
  tags: [base-config, user, makepkg]

- name: Deploy node-maintenance user-scoped makepkg.conf (BUILDDIR override for AUR yay runs)
  ansible.builtin.copy:
    dest: /var/lib/node-maintenance/.config/pacman/makepkg.conf
    owner: node-maintenance
    group: node-maintenance
    mode: "0644"
    content: |
      # Writable makepkg dirs for node-maintenance yay (phase2 AUR upgrade);
      # overrides any restrictive system-wide /etc/makepkg.conf.d/ entry.
      BUILDDIR=/tmp/makepkg-node-maintenance
      PKGDEST=/var/lib/node-maintenance/.cache/makepkg/packages
      SRCPKGDEST=/var/lib/node-maintenance/.cache/makepkg/srcpackages
      LOGDEST=/var/lib/node-maintenance/.cache/makepkg/logs
  when: "'workers' in group_names"
  tags: [base-config, user, makepkg]

- name: Ensure node-maintenance makepkg cache dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: node-maintenance
    group: node-maintenance
    mode: "0755"
  loop:
    - /var/lib/node-maintenance/.cache/makepkg/packages
    - /var/lib/node-maintenance/.cache/makepkg/srcpackages
    - /var/lib/node-maintenance/.cache/makepkg/logs
  when: "'workers' in group_names"
  tags: [base-config, user, makepkg]

- name: Add admin_user to adm group (read /var/log/node-maintenance without sudo)
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: adm
    append: true
  when: admin_user is defined
  tags: [base-config, user]

# Kernel cmdline drift detection. Bootloader (systemd-boot) sets these once at
# install via setup-node.sh, never re-applied. Read-only assert; missing param
# = task fail = telegram alert. Operator fixes by editing
# /boot/loader/entries/*.conf and rebooting.
- name: Verify expected kernel boot params present
  ansible.builtin.shell: |
    set -o pipefail
    missing=""
    for p in {{ expected_kernel_params | join(' ') }}; do
      grep -qFw "$p" /proc/cmdline || missing="$missing $p"
    done
    if [ -n "$missing" ]; then
      echo "missing kernel params:$missing" >&2
      echo "current /proc/cmdline:" >&2
      cat /proc/cmdline >&2
      exit 1
    fi
  args:
    executable: /bin/bash
  register: cmdline_check
  changed_when: false
  failed_when: cmdline_check.rc != 0
  when: expected_kernel_params is defined
  tags: [base-config, kernel-cmdline]

# Swap state assertion. Each host has different mechanism (CP=swapfile,
# W1=partition, W2=LVM-LV) → host_vars carry path + fstab entry. This role does
# NOT create swap (an init-time concern). It asserts only that swap is active and
# that the fstab entry is present, so a reboot restores swap. Drift = no swap →
# fail task → telegram alert.
- name: Assert swap fstab entry present (host-specific)
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "{{ swap_fstab_entry }}"
    state: present
    create: false
    backup: false
  when: swap_fstab_entry is defined
  tags: [base-config, swap]

- name: Verify swap active (path={{ swap_path | default('?') }})
  ansible.builtin.shell: |
    set -o pipefail
    # readlink -f resolves LVM LV symlinks to backing /dev/dm-N device.
    # swapon --show prints whatever was activated: dm path for LVM,
    # block device for partitions, absolute path for files.
    real=$(readlink -f '{{ swap_path }}')
    swapon --show=NAME --noheadings | grep -qxF "$real"
  args:
    executable: /bin/bash
  register: swap_check
  changed_when: false
  failed_when: swap_check.rc != 0
  when: swap_path is defined
  tags: [base-config, swap]

# SSH host key fingerprint baseline. Capture current pubkey fingerprints to
# state dir; alert on diff (drift = MITM, unauthorized rotation, reprovision).
# Read-only — no rotation, no auto-fix. Operator investigates on alert.
- name: Capture SSH host key fingerprints baseline
  ansible.builtin.shell: |
    set -e
    out="{{ state_dir }}/ssh-host-fingerprints.txt"
    new=$(mktemp)
    for k in /etc/ssh/ssh_host_*_key.pub; do
      [ -r "$k" ] || continue
      ssh-keygen -lf "$k" >> "$new"
    done
    sort -o "$new" "$new"
    if [ ! -f "$out" ]; then
      install -m 0644 -o root -g root "$new" "$out"
      rm -f "$new"
      echo "BASELINE-CREATED"
      exit 0
    fi
    if ! diff -q "$out" "$new" >/dev/null 2>&1; then
      diff "$out" "$new" >&2 || true
      rm -f "$new"
      echo "FINGERPRINT-DRIFT"
      exit 1
    fi
    rm -f "$new"
    echo "OK"
  register: ssh_fp_check
  changed_when: ssh_fp_check.stdout == "BASELINE-CREATED"
  failed_when: ssh_fp_check.stdout == "FINGERPRINT-DRIFT"
  tags: [base-config, ssh-fingerprints]

# /etc/hosts — declarative cluster node entries. Inventory is source of truth;
# any drift gets reconciled. Block markers preserve other entries (e.g. user
# customizations, virt managers). Other names resolve through systemd-resolved's
# public upstreams (hardening role: resolved-upstream-dns.conf), not Blocky.
- name: Manage /etc/hosts cluster block
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED — homelab cluster nodes"
    block: |
      {% for host in groups['all'] %}
      {{ hostvars[host].node_ip | default(hostvars[host].ansible_host) }} {{ host }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  tags: [base-config, hosts]

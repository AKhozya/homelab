---
# firewall_preflight — settle barrier + modprobe + per-chain repair, run BEFORE
# any firewall/ufw work in node-config.yml.
#
# This role exists separately from `firewall` so any task (in any role) that
# transitively invokes ufw via community.general.ufw or shells out to
# /usr/sbin/ufw has a clean netfilter state to operate against.
#
# Scope: best-effort. The preflight run reports no change and does not fail the play; failures
# surface in the later firewall tasks. The one exception: if the script
# cannot load node-script-lib.sh, the settle barrier is gone, so the host fails here and
# Ansible skips its later plays (no firewall change without the barrier).

- name: Deploy firewall-preflight.sh
  ansible.builtin.copy:
    src: firewall-preflight.sh
    dest: /usr/local/sbin/firewall-preflight.sh
    owner: root
    group: root
    mode: "0755"
  tags: [firewall, preflight]

- name: Run firewall preflight (settle + modprobe + chain repair)
  ansible.builtin.command:
    cmd: /usr/local/sbin/firewall-preflight.sh
  register: preflight
  changed_when: false
  failed_when: preflight.rc == 1 and 'cannot load' in preflight.stderr
  tags: [firewall, preflight]

# If ufw-heal-post-k3s.sh --cni-heal cannot verify the portmap rules or kube-proxy's jumps after
# firewall-preflight.sh runs flush-all, the preflight exits 3. If this task fails the node, Ansible
# skips its later plays, so the last play in node-config.yml reports the failure.
- name: Record a failed firewall recovery check from preflight
  ansible.builtin.set_fact:
    firewall_cni_heal_failed: true
  when: preflight.rc == 3
  tags: [firewall, preflight]

- name: Log preflight outcome
  ansible.builtin.debug:
    msg: "{{ preflight.stderr_lines | default([]) }}"
  when: preflight.stderr_lines is defined
  tags: [firewall, preflight]

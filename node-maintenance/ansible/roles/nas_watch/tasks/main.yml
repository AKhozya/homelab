---
# nas_watch: a timer on the CP that checks the NAS's SSH and firewall hardening and writes
# nas_hardening.prom for node-exporter. The NAS is not in Ansible, so this only watches it.
# Alerts: NAS* in monitoring/configs/victoria-metrics/vmrules.yaml. node-config.yml runs it in the
# control-plane play.

- name: Install the NAS hardening probe
  ansible.builtin.copy:
    src: nas-hardening-probe.sh
    dest: /usr/local/sbin/nas-hardening-probe.sh
    owner: root
    group: root
    mode: "0755"
  tags: [nas-watch]

- name: Install the probe service and timer
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - nas-hardening-probe.service
    - nas-hardening-probe.timer
  tags: [nas-watch]

- name: Enable and start the probe timer
  ansible.builtin.systemd_service:
    name: nas-hardening-probe.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: [nas-watch]

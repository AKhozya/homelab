---
# Firmware update via fwupd. Tag: firmware.
# Apply-mode (install updates, never reboots): -e ad_hoc_firmware_apply=true --limit <host>
# Check-only (default): only refresh metadata + list pending updates.

- name: Ensure fwupd installed
  ansible.builtin.package:
    name: fwupd
    state: present
  register: pkg_fwupd
  until: pkg_fwupd is not failed
  retries: 3
  delay: 30
  tags: [never, firmware, ad-hoc]

# refresh/get-updates intentionally keep failed_when: false — LVFS 5xx is
# tolerated (check-mode, next run catches up). retry would add latency without
# behaviour change since the play never fails regardless.
- name: Refresh fwupd metadata
  ansible.builtin.command: fwupdmgr refresh --force
  changed_when: false
  failed_when: false
  tags: [never, firmware, ad-hoc]

- name: List available firmware updates
  ansible.builtin.command: fwupdmgr get-updates --no-unreported-check
  register: fwupd_updates
  changed_when: false
  failed_when: false
  tags: [never, firmware, ad-hoc]

- name: Show available updates
  ansible.builtin.debug:
    var: fwupd_updates.stdout_lines
  tags: [never, firmware, ad-hoc]

# If you omit --no-reboot-check, --assume-yes accepts the restart prompt. The play can then
# reboot several nodes at once. An in-guest reboot of immich-vm leaves its passed-through iGPU
# unresponsive and can crash the NAS host.
# Reboot through the phase1/phase2 flow.
- name: Refuse to apply firmware to more than one node per run
  ansible.builtin.assert:
    that: ansible_play_hosts_all | length == 1
    fail_msg: "apply mode needs --limit <one host>: one node at a time"
    quiet: true
  when: ad_hoc_firmware_apply | bool
  tags: [never, firmware, ad-hoc]

- name: Apply firmware updates (only when ad_hoc_firmware_apply=true)
  ansible.builtin.command: fwupdmgr update --no-unreported-check --no-reboot-check --assume-yes
  when:
    - ad_hoc_firmware_apply | bool
    - "'virtual' not in group_names"
  register: fwupd_apply
  until: fwupd_apply is not failed
  retries: 3
  delay: 20
  changed_when: fwupd_apply.rc == 0 and 'No updatable devices' not in (fwupd_apply.stdout | default(''))
  tags: [never, firmware, ad-hoc]

- name: Show apply result
  ansible.builtin.debug:
    var: fwupd_apply.stdout_lines
  when: ad_hoc_firmware_apply | bool and fwupd_apply is defined
  tags: [never, firmware, ad-hoc]

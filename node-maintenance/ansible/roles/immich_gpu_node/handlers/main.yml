---
# Rebuild the systemd-boot UKI after a kernel cmdline change. mkinitcpio bakes /etc/kernel/cmdline
# into /boot/EFI/Linux/<preset>.efi; the change takes effect only after this rebuild and a reboot.
# No reboot here: on the GPU node it must be a cold-cycle (graceful poweroff, then `virsh start` of the
# shut-off domain), run by phase2 PLAY 1b or the operator. Never an in-guest `systemctl reboot`.
- name: Rebuild UKI for i915 cmdline change
  ansible.builtin.command: "mkinitcpio -p {{ immich_gpu_kernel_preset }}"
  changed_when: true

# Applies the reset-bug panic override (99-zz-immich-vm-nopanic.conf) at runtime. Its name sorts after
# 99-watchdog.conf, so a full `sysctl --system` gives the same result, and systemd-sysctl applies it
# last at boot. This VM cannot set kernel.nmi_watchdog, so the hardening role deploys that key only to
# physical nodes.
- name: Apply nopanic sysctl
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-zz-immich-vm-nopanic.conf
  changed_when: false

# Applies the reset-bug watchdog override (zz-immich-vm-nowatchdog.conf). systemd Manager config
# (RuntimeWatchdogSec/RebootWatchdogSec) is ONLY re-read on daemon-reexec, never daemon-reload — so a
# reexec is required to guarantee the watchdog stays disarmed. Safe: PID-1 re-exec preserves state and
# does not disrupt k3s-agent/containerd (they are not children of the re-exec).
- name: Disarm systemd watchdog
  ansible.builtin.systemd_service:
    daemon_reexec: true
  changed_when: false

# The drop-in skips the next start and leaves this boot's failed state in place, so `systemctl --failed`
# keeps listing these units until a reboot. Reset only these units: a bare `systemctl reset-failed`
# would also clear any other failure.
- name: Clear the skipped TPM units
  ansible.builtin.shell: |
    set -euo pipefail
    systemctl daemon-reload
    systemctl list-units --failed --plain --no-legend \
      systemd-tpm2-setup-early.service systemd-tpm2-setup.service systemd-pcrproduct.service \
      'systemd-pcrlogin@*.service' |
      awk '{print $1}' | while read -r unit; do systemctl reset-failed "$unit"; done
  args:
    executable: /bin/bash
  changed_when: true

# Passthrough-VM safety (GPU reset bug; 2026-07-10 NAS host crash). A kernel lockup or panic must
# NEVER auto-reboot in-guest: an in-guest reboot wedges the passed-through iGPU and crashes the NAS
# host. Overrides the hardening role's 99-watchdog.conf (kernel.panic=10 + softlockup/hardlockup_panic=1);
# sorts after it in /etc/sysctl.d (99-zz > 99-watchdog), so systemd-sysctl at boot and `sysctl --system`
# apply these last.
# On a lockup the guest hangs, goes unreachable and is alerted; the operator recovers it with a NAS host
# reboot. The immich-vm-heal CronJob never restarts a running domain. NEVER virsh destroy/reset (both
# re-trigger the reset bug → NAS host crash).
kernel.panic = 0
kernel.softlockup_panic = 0
kernel.hardlockup_panic = 0

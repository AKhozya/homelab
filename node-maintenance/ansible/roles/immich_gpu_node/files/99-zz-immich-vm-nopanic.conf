# Passthrough-VM safety (reset-bug C3). A kernel lockup/panic must NEVER auto-reboot in-guest — an
# in-guest reboot wedges the passed-through iGPU and crashes the NAS host. Overrides the hardening
# role's 99-watchdog.conf (kernel.panic=10 + softlockup/hardlockup_panic=1); sorts lexically AFTER it
# in /etc/sysctl.d (99-zz > 99-watchdog) so `sysctl --system` applies these last.
# On a lockup the guest hangs, goes unreachable, and is alerted — the operator / Tier-2 host watchdog
# does a NAS host reboot (the only clean iGPU reset). NEVER an in-guest auto-reboot, NEVER virsh
# destroy/reset (both re-trigger the reset-bug → NAS host crash).
kernel.panic = 0
kernel.softlockup_panic = 0
kernel.hardlockup_panic = 0

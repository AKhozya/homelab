# Passthrough-VM safety (GPU reset bug; 2026-07-10 NAS host crash). The q35 machine type emulates an
# ICH9 LPC bridge whose iTCO watchdog appears in-guest as /dev/watchdog0 (iTCO_wdt), so the hardening
# role's watchdog.conf (RuntimeWatchdogSec=30 + RebootWatchdogSec=2min) is NOT inert here. If systemd
# armed it, a PID-1 freeze would fire the hardware watchdog → in-guest reset → wedged iGPU → NAS host
# crash. The panic sysctls (99-zz-immich-vm-nopanic.conf) do not cover this: a watchdog reset fires
# while the kernel is still alive.
#
# This drop-in sorts after hardening's watchdog.conf in /etc/systemd/system.conf.d (zz-* > watchdog.conf),
# so systemd applies these values last and never arms the watchdog on this VM. A guest lockup instead
# hangs, goes unreachable and is alerted; the operator recovers it with a NAS host reboot. The
# immich-vm-heal CronJob never restarts a running domain. NEVER virsh destroy/reset (both re-trigger
# the reset bug → NAS host crash).
[Manager]
RuntimeWatchdogSec=0
RebootWatchdogSec=0

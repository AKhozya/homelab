---
# immich_gpu_node role defaults.

# Kernel package whose UKI is rebuilt when the i915 boot-blacklist cmdline token changes
# (systemd-boot + UKI; mkinitcpio bakes /etc/kernel/cmdline into /boot/EFI/Linux/<preset>.efi).
immich_gpu_kernel_preset: linux-lts

# Gates the role's UKI cmdline task: i915,xe in modprobe.blacklist (an early i915 load on the passed-
# through IGD, with no vBIOS/opregion, wedges the guest; load-i915.service loads it render-only after
# multi-user.target), plus drm_kms_helper.fbdev_emulation=0 and fbcon=off. A cmdline change needs a UKI
# rebuild (handler) and a cold-cycle to take effect. Set false to skip the task and that rebuild.
immich_gpu_boot_blacklist: true

# Guest packages for the watchdog's QSV check (vainfo) + the iHD VAAPI driver. The Immich container
# ships its own iHD; these are only for on-guest health probing. qemu-guest-agent lets a NAS-side
# `virsh shutdown --mode agent` and domtime/domfsinfo reach the guest over the org.qemu.guest_agent.0
# channel already in the domain XML — no SSH into the guest.
immich_gpu_packages:
  - intel-media-driver
  - libva-utils
  - qemu-guest-agent

# akhozya's authorized_keys on the guest (operator + automation pubkeys). Empty default = the role skips
# key management on any host that doesn't set it; immich-vm sets the real list in host_vars.
immich_gpu_authorized_keys: []

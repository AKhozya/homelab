---
# immich_gpu_node — Immich GPU node (Arch VM) i915 render config + guest-local heal watchdog.
# Applied to the `virtual` inventory group only (node-config.yml's Immich GPU node play): the passed-
# through Meteor Lake iGPU exists only on this VM.
#
# i915 is render-only (disable_display=1) and boot-blacklisted; load-i915.service loads it after boot
# (see files/i915-render.conf + files/load-i915.service). The heal watchdog mirrors clusterip_heal
# (bounded restart + node-exporter textfile metrics) but heals only the render node. clusterip_heal
# owns k3s-agent. A reset-bug wedge needs the operator to cold-restart the host; the immich-vm-heal
# CronJob only starts a shut-off domain. See files/immich-gpu-heal.sh.

# ---- i915 render-only driver config ----

- name: Deploy i915 render-only modprobe conf
  ansible.builtin.copy:
    src: i915-render.conf
    dest: /etc/modprobe.d/i915-render.conf
    owner: root
    group: root
    mode: "0644"
  tags: [immich-gpu-node, i915]

# Manage the guest UKI cmdline as a token set, independent of order:
#   - modprobe.blacklist  — one comma-list token; merge i915 and xe into it. i915 stays out of the
#                           boot path and loads render-only after boot. xe probes the iGPU at boot and
#                           binds nothing, so keep it out too.
#   - drm_kms_helper.fbdev_emulation=0 + fbcon=off — the virtio-gpu fbdev wedge fix. They remove the
#                           kernel fbdev consumer whose damage work blocks on the stalled host virtio-gpu
#                           virtqueue while holding drm_modeset_lock, so every GPU open hangs in D-state.
# Standalone tokens are appended only if absent; missing drivers merge into the existing blacklist
# token, never a second one. A second run changes nothing.
- name: Ensure GPU/display kernel cmdline tokens on the UKI (fbdev-off + i915,xe blacklist)
  ansible.builtin.shell: |
    set -euo pipefail
    f=/etc/kernel/cmdline
    # If the file is missing or empty, the rewrite below would produce a UKI with no root=,
    # which does not boot.
    [ -s "$f" ] || { echo "$f is missing or empty" >&2; exit 1; }
    read -r -a toks < <(head -n1 "$f") || true
    case " ${toks[*]} " in
      *" root="*) ;;
      *) echo "$f has no root= token; refusing to rewrite it" >&2; exit 1 ;;
    esac

    blacklist_want='i915 xe'      # drivers that must be present in the one modprobe.blacklist token
    have_fbdev=0 have_fbcon=0 bl_idx=-1
    for i in "${!toks[@]}"; do
      case "${toks[$i]}" in
        drm_kms_helper.fbdev_emulation=0) have_fbdev=1 ;;
        fbcon=off) have_fbcon=1 ;;
        modprobe.blacklist=*) bl_idx=$i ;;
      esac
    done

    changed=0
    if [ "$bl_idx" -ge 0 ]; then
      new="${toks[$bl_idx]#modprobe.blacklist=}"
      for d in $blacklist_want; do
        case ",$new," in
          *",$d,"*) : ;;
          *) new="${new:+$new,}$d"; changed=1 ;;
        esac
      done
      toks[$bl_idx]="modprobe.blacklist=$new"
    else
      toks+=("modprobe.blacklist=$(printf '%s' "$blacklist_want" | tr ' ' ',')"); changed=1
    fi
    [ "$have_fbdev" -eq 1 ] || { toks+=("drm_kms_helper.fbdev_emulation=0"); changed=1; }
    [ "$have_fbcon" -eq 1 ] || { toks+=("fbcon=off"); changed=1; }

    if [ "$changed" -eq 1 ]; then
      printf '%s\n' "${toks[*]}" >"$f"
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  register: immich_gpu_cmdline
  changed_when: "'CHANGED' in immich_gpu_cmdline.stdout"
  when: immich_gpu_boot_blacklist | bool
  notify: Rebuild UKI for i915 cmdline change
  tags: [immich-gpu-node, i915, i915-cmdline]

- name: Deploy load-i915.service (post-boot render load)
  ansible.builtin.copy:
    src: load-i915.service
    dest: /etc/systemd/system/load-i915.service
    owner: root
    group: root
    mode: "0644"
  tags: [immich-gpu-node, i915]

# Enabled (fires After=multi-user.target on every boot), not started here: a mid-run start would load
# i915 out of band. It runs at the next boot — which for this node is a host cold-restart (reset-bug).
- name: Enable load-i915.service
  ansible.builtin.systemd_service:
    name: load-i915.service
    enabled: true
    daemon_reload: true
  tags: [immich-gpu-node, i915]

# ---- Reset-bug safety: never auto-reboot in-guest ----
# On this GPU-passthrough VM an in-guest reboot wedges the passed-through iGPU and crashes the NAS host
# (2026-07-10). The `hardening` role (hosts: all) brings two in-guest auto-reboot paths, and this role
# overrides both (hardening runs before this play, so its files are on disk to override):
#   - kernel.panic=10 + softlockup/hardlockup_panic=1 → 0 (sysctl drop-in, applied by `sysctl -p`)
#   - systemd RuntimeWatchdogSec=30 on the q35 iTCO /dev/watchdog0 → 0 (system.conf.d drop-in, applied
#     by `systemctl daemon-reexec`; systemd re-reads Manager config only on re-exec, not reload).
# The sysctls do not cover the watchdog: a hardware-watchdog reset fires while the kernel is still alive.

- name: Disable auto-reboot-on-panic (reset-bug safety — overrides hardening 99-watchdog.conf sysctls)
  ansible.builtin.copy:
    src: 99-zz-immich-vm-nopanic.conf
    dest: /etc/sysctl.d/99-zz-immich-vm-nopanic.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply nopanic sysctl
  tags: [immich-gpu-node, reset-bug, sysctl]

- name: Disarm systemd hardware watchdog (reset-bug safety — q35 iTCO /dev/watchdog0 is NOT inert)
  ansible.builtin.copy:
    src: zz-immich-vm-nowatchdog.conf
    dest: /etc/systemd/system.conf.d/zz-immich-vm-nowatchdog.conf
    owner: root
    group: root
    mode: "0644"
  notify: Disarm systemd watchdog
  tags: [immich-gpu-node, reset-bug, watchdog]

# ---- TPM NvPCR units (systemd 262) ----
# This VM boots a measured UKI, so systemd 262 runs its TPM setup and NvPCR units here; the physical
# nodes skip them on ConditionSecurity. NvPCR setup fails with ENOENT on this VM. The early setup
# and pcrproduct fail at every boot, and each pcrlogin@<uid> instance fails when logind starts it.
# Nothing here uses a TPM-bound secret: no crypttab, no LUKS, no unit loads an encrypted credential.
# The late systemd-tpm2-setup.service has only ever run here after the early unit wrote
# /run/systemd/tpm2-srk-public-key.pem. What it does without that file is untested, so the drop-in
# skips it too.
# A condition drop-in, not a mask: logind starts systemd-pcrlogin@<uid> directly.
# If a caller starts a masked unit directly, systemd returns an error to that caller.
# The template drop-in covers every instance. If the initrd gains systemd (mkinitcpio `systemd`
# hook), the early unit runs there without this drop-in.
- name: Ensure drop-in dirs for the TPM NvPCR units that fail on this VM
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: &nvpcr_units
    - systemd-tpm2-setup-early.service
    - systemd-tpm2-setup.service
    - systemd-pcrproduct.service
    - systemd-pcrlogin@.service
  tags: [immich-gpu-node, tpm]

- name: Skip the TPM NvPCR units on this VM (ConditionVirtualization=!vm)
  ansible.builtin.copy:
    src: zz-immich-vm-no-nvpcr.conf
    dest: "/etc/systemd/system/{{ item }}.d/zz-immich-vm-no-nvpcr.conf"
    owner: root
    group: root
    mode: "0644"
  loop: *nvpcr_units
  notify: Clear the skipped TPM units
  tags: [immich-gpu-node, tpm]

# ---- Admin-sudo parity (remove the VM-build NOPASSWD override) ----
# The VM image shipped /etc/sudoers.d/akhozya-nopasswd (`akhozya ALL=(ALL) NOPASSWD:ALL`). sudoers
# applies the last matching rule, reading files in lexical order, so that file overrides base_config's
# password-required `00_akhozya`. base_config never removes it. Removing it here restores parity with
# the physical nodes. Safe: akhozya has a login password, node-maintenance keeps NOPASSWD for
# automation, and virsh console gives emergency access.
- name: Remove VM-build akhozya NOPASSWD sudoers override (admin-sudo parity — 00_akhozya governs)
  ansible.builtin.file:
    path: /etc/sudoers.d/akhozya-nopasswd
    state: absent
  tags: [immich-gpu-node, sudoers, hardening]

# ---- Admin user (akhozya) SSH authorized_keys ----
# Seed the operator + automation pubkeys, exclusive, so drift-heal reconciles adds, removes and
# duplicates. /home is persistent ext4 LVM (no cloud-init), so keys survive reboots. sshd StrictModes
# refuses the keys if ~/.ssh, the file or the home directory is writable by other users (sshd(8));
# this role sets 0700 and 0600. The recurring NAS-side ~/.ssh 0771 reset is group-writable, so
# StrictModes refuses key logins there. It happens on the appliance, outside IaC; the operator fixes
# it with `chmod 700 ~/.ssh`.
- name: Ensure admin_user ~/.ssh dir (StrictModes 0700)
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.ssh"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"
  tags: [immich-gpu-node, user, authorized-keys]

# The bot line must match what base_config's authorized_key task writes, byte for byte:
# `<options> <type> <key> <comment>`. If it differs, the two tasks rewrite the file on every heal.
- name: Deploy admin_user authorized_keys (operator + automation pubkeys + restricted bot key, exclusive)
  ansible.builtin.copy:
    dest: "/home/{{ admin_user }}/.ssh/authorized_keys"
    content: "{{ (immich_gpu_authorized_keys + immich_gpu_bot_key_line) | join('\n') }}\n"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
  vars:
    immich_gpu_bot_key_line: >-
      {{ ['command="/usr/local/bin/agent-diag",restrict ' ~ agent_diag_bot_pubkey]
         if agent_diag_bot_pubkey | default('') | length > 0 else [] }}
  when: immich_gpu_authorized_keys | length > 0
  tags: [immich-gpu-node, user, authorized-keys]

# ---- yay AUR helper bootstrap (parity with physical nodes) ----
# phase2's yay_cmd needs yay. The operator installed it by hand on the physical nodes (setup-node.sh
# only uses yay if present); this VM's onboarding skipped it, so the weekly upgrade failed with `yay:
# command not found`, and the old rescue hid that until 2026-07-11. Install it here only if absent; after that the
# weekly yay_cmd updates yay itself.
# Build and install run as separate steps: makepkg refuses root, and akhozya has no NOPASSWD here (see
# above), so `makepkg -si` would hang on its own `sudo pacman`. Build as akhozya with deps pre-installed,
# then `pacman -U` as root.
# stat, not `command -v yay`: ansible.builtin.command runs no shell, and `command` is a shell builtin,
# so the guard would always report yay missing and rebuild it on every drift-heal.
- name: Check yay present (AUR helper — the fleet weekly updater)
  ansible.builtin.stat:
    path: /usr/bin/yay
  register: immich_gpu_yay_check
  tags: [immich-gpu-node, yay, packages]

- name: Bootstrap yay-bin from AUR (idempotent — only when missing)
  when: not immich_gpu_yay_check.stat.exists
  tags: [immich-gpu-node, yay, packages]
  block:
    - name: Ensure makepkg build deps present (so the akhozya build needs no `-s` sudo)
      ansible.builtin.package:
        name:
          - base-devel
          - git
        state: present

    - name: Build yay-bin as the admin user (makepkg only — no install; akhozya has no NOPASSWD)
      become: true
      become_user: "{{ admin_user }}"
      ansible.builtin.shell: |
        set -euo pipefail
        build=/tmp/yay-bootstrap
        rm -rf "$build"
        mkdir -p "$build/src" "$build/pkg" "$build/bld"
        git clone --depth 1 https://aur.archlinux.org/yay-bin.git "$build/src/yay-bin"
        cd "$build/src/yay-bin"
        PKGDEST="$build/pkg" BUILDDIR="$build/bld" makepkg --noconfirm
        ls -1 "$build/pkg"/yay-bin-*.pkg.tar.zst | head -n1
      register: immich_gpu_yay_build
      changed_when: true

    - name: Install the built yay package as root (pacman -U — akhozya sudo not needed)
      ansible.builtin.command: "pacman -U --noconfirm {{ immich_gpu_yay_build.stdout_lines[-1] }}"
      changed_when: true

    - name: Remove the yay bootstrap build dir
      ansible.builtin.file:
        path: /tmp/yay-bootstrap
        state: absent

# ---- Guest packages for on-node QSV health probing (vainfo) ----

- name: Ensure iHD VAAPI driver + vainfo + qemu-guest-agent present (watchdog QSV probe + agent shutdown)
  ansible.builtin.package:
    name: "{{ immich_gpu_packages }}"
    state: present
  tags: [immich-gpu-node, packages]

# qemu-guest-agent talks to the host over the org.qemu.guest_agent.0 virtio channel (already in the
# domain XML), so a NAS-side `virsh shutdown --mode agent` works even if the guest ignores ACPI, and
# domtime/domfsinfo report guest health without SSH. Safe to start mid-run: a plain systemd service
# with no GPU or reboot interaction, unlike load-i915.service.
- name: Enable + start qemu-guest-agent
  ansible.builtin.systemd_service:
    name: qemu-guest-agent.service
    enabled: true
    state: started
    daemon_reload: true
  tags: [immich-gpu-node, packages, guest-agent]

# ---- virtiofs library mount (Immich library share from the NAS host) ----
# The library lives on the NAS host and reaches this guest as a virtiofs share (tag immich-library, in
# the domain XML). Mount it at a stable path so the k3s Immich pod bind-mounts a real directory, not an
# empty one. The unit filename MUST be the systemd escape of the mount path
# (var-lib-immich\x2dlibrary.mount): immich-gpu-heal.sh restarts it by that exact name
# (library_unit → systemd-escape -p --suffix=mount /var/lib/immich-library).

- name: Ensure Immich library mountpoint
  ansible.builtin.file:
    path: /var/lib/immich-library
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [immich-gpu-node, virtiofs]

- name: Deploy immich-library virtiofs mount unit
  ansible.builtin.copy:
    src: immich-library.mount
    dest: '/etc/systemd/system/var-lib-immich\x2dlibrary.mount'
    owner: root
    group: root
    mode: "0644"
  tags: [immich-gpu-node, virtiofs]

# enabled=at boot (WantedBy, non-fatal), started=mount now on this heal run. A mount failure here alerts
# (drift) — correct: an unmountable library means Immich is broken, worth a page. The heal watchdog
# covers transient drops between runs.
- name: Enable + start immich-library virtiofs mount
  ansible.builtin.systemd_service:
    name: 'var-lib-immich\x2dlibrary.mount'
    enabled: true
    state: started
    daemon_reload: true
  tags: [immich-gpu-node, virtiofs]

# ---- local-path volume root ----
# local-path-provisioner uses /mnt/k8s-storage on every node. The VM has no separate data volume,
# so bind the path onto the home LV (same reasoning as k3s_data_dir=/home/k3s in host_vars).
# 0700 matches what local-path's helper enforces on the volume root (chmod 700 on the parent).
- name: Ensure local-path source and mountpoint dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /home/k8s-storage
    - /mnt/k8s-storage
  tags: [immich-gpu-node, local-path]

- name: Deploy local-path bind mount unit
  ansible.builtin.copy:
    src: mnt-k8s-storage.mount
    dest: '/etc/systemd/system/mnt-k8s\x2dstorage.mount'
    owner: root
    group: root
    mode: "0644"
  tags: [immich-gpu-node, local-path]

# k3s-agent must not start without the mount (see the drop-in). The bind-mount task below runs
# daemon_reload, which loads this drop-in. No k3s restart: that is a human gate on the GPU VM.
- name: Ensure k3s-agent service.d drop-in dir
  ansible.builtin.file:
    path: /etc/systemd/system/k3s-agent.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [immich-gpu-node, local-path]

- name: Deploy k3s-agent RequiresMountsFor drop-in
  ansible.builtin.copy:
    src: k3s-agent-local-path-mount.conf
    dest: /etc/systemd/system/k3s-agent.service.d/local-path-mount.conf
    owner: root
    group: root
    mode: "0644"
  tags: [immich-gpu-node, local-path]

- name: Enable + start local-path bind mount
  ansible.builtin.systemd_service:
    name: 'mnt-k8s\x2dstorage.mount'
    enabled: true
    state: started
    daemon_reload: true
  tags: [immich-gpu-node, local-path]

# ---- Heal watchdog (mirrors clusterip_heal) ----

# /var/lib/node-maintenance is node-maintenance's HOME (owned by base_config, 0751). Do NOT re-assert
# ownership here — the heal state file is written as root inside it, which works with o+x on the parent.

- name: Ensure node-exporter textfile dir (heal metrics)
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [immich-gpu-node, heal]

- name: Deploy immich-gpu-heal.sh
  ansible.builtin.copy:
    src: immich-gpu-heal.sh
    dest: /usr/local/sbin/immich-gpu-heal.sh
    owner: root
    group: root
    mode: "0755"
  tags: [immich-gpu-node, heal]

- name: Deploy immich-gpu-heal-watchdog.service
  ansible.builtin.copy:
    src: immich-gpu-heal-watchdog.service
    dest: /etc/systemd/system/immich-gpu-heal-watchdog.service
    owner: root
    group: root
    mode: "0644"
  tags: [immich-gpu-node, heal]

- name: Deploy immich-gpu-heal-watchdog.timer
  ansible.builtin.copy:
    src: immich-gpu-heal-watchdog.timer
    dest: /etc/systemd/system/immich-gpu-heal-watchdog.timer
    owner: root
    group: root
    mode: "0644"
  tags: [immich-gpu-node, heal]

- name: Enable + start immich-gpu-heal-watchdog.timer
  ansible.builtin.systemd_service:
    name: immich-gpu-heal-watchdog.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: [immich-gpu-node, heal]

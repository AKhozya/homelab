# /etc/modules-load.d/ufw-iptables.conf
# Ensure netfilter modules required by UFW are loaded at boot.
# Without these, `ufw status verbose` returns "ERROR: problem running ip6tables".
#
# Every table module, not only ip6_tables: W2 lost ip6_tables mid-runtime on 2026-04-26, and
# on 2026-04-28 `ufw status` failed with ip6_tables loaded. iptables-restore of before6.rules
# references the *mangle and *nat tables, and auto-load fails under K3s/fail2ban iptables lock
# contention.
# Keep in sync with MODULES in firewall-preflight.sh and the modprobe loop in tasks/main.yml.
#
# Modules cover: filter (default UFW chains), nat (route rules / MASQUERADE),
# mangle (TOS / mark), raw (NOTRACK), nf_conntrack (stateful matching).
ip6_tables
ip6table_filter
ip6table_nat
ip6table_mangle
ip6table_raw
iptable_filter
iptable_nat
iptable_mangle
iptable_raw
nf_conntrack

---
# security_scan — monthly lynis + rkhunter scan. Applies to all hosts.
# Requires lynis and rkhunter from the `packages` role.

- name: Ensure /var/log/node-maintenance exists (owner root:adm 0750)
  ansible.builtin.file:
    path: /var/log/node-maintenance
    state: directory
    owner: root
    group: adm
    mode: "0750"
  tags: [security-scan]

- name: Deploy security-scan.sh
  ansible.builtin.copy:
    src: security-scan.sh
    dest: /usr/local/sbin/node-maintenance-security-scan.sh
    owner: root
    group: root
    mode: "0750"
  tags: [security-scan]

- name: Deploy security-scan systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - node-maintenance-security-scan.service
    - node-maintenance-security-scan.timer
  notify: Reload systemd
  tags: [security-scan]

- name: Enable + start security-scan timer
  ansible.builtin.systemd_service:
    name: node-maintenance-security-scan.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: [security-scan]

# install.sh installs telegram-notify.sh and its credentials on the CP only. Copy them to every host,
# or each worker-side ExecStopPost/notify path (this role's scan-failure notify, the firewall role's
# check-phase2-flag-age) fails silently. The control node is the CP, so its copy is the source.
- name: Deploy telegram-notify.sh (CP-installed copy -> all hosts)
  ansible.builtin.copy:
    src: /usr/local/sbin/telegram-notify.sh
    dest: /usr/local/sbin/telegram-notify.sh
    owner: root
    group: root
    mode: "0750"
  tags: [security-scan]

- name: Distribute telegram credentials (CP-local files -> all hosts, 0600)
  ansible.builtin.copy:
    src: "/etc/node-maintenance/{{ item }}"
    dest: "/etc/node-maintenance/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - telegram-token
    - telegram-chat-id
  no_log: true
  tags: [security-scan]

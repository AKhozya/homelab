---
# Renovate bumps this line (renovate.json, custom manager for 0xERR0R/blocky, 7-day release age).
# It is not grouped with the cluster image spx01/blocky, so the two can differ for a while.
blocky_fallback_version: v0.37.0

blocky_fallback_install_dir: /opt/blocky-fallback
blocky_fallback_bin: "{{ blocky_fallback_install_dir }}/{{ blocky_fallback_version }}/blocky"
blocky_fallback_config: /etc/blocky-fallback/config.yml
# The CP's git checkout, which node-maintenance-sync pulls before each run. playbook_dir does not
# work: /etc/node-maintenance/ansible is an rsync of node-maintenance/ansible only.
blocky_fallback_source_config: "{{ state_dir }}/homelab/apps/blocky/config.yml"
# systemd CacheDirectory=blocky-fallback creates this path for the dynamic service user.
blocky_fallback_cache_dir: /var/cache/blocky-fallback
# systemd LogsDirectory=blocky-fallback creates this symlink to /var/log/private/blocky-fallback.
# The Alloy DaemonSet (monitoring/controllers/loki-stack/alloy-release.yaml) mounts the private path.
blocky_fallback_log_dir: /var/log/blocky-fallback
blocky_fallback_listen_ip: "{{ node_ip }}"
# IPv6 listener: the CP's address that ends in ::53 on a private prefix (fd00::/8), read live by
# tasks/main.yml, so the prefix never enters the repo. Only an address that stays valid at least this
# long counts. The eero's prefix lasts about 30 days. The Thread border routers' prefix lasts 1800 s and
# can vanish once the eero announces its own, so the default skips it. 0 accepts it, for a test.
blocky_fallback_iface: "{{ static_ipv4.interface }}"
blocky_fallback_v6_min_lifetime: 86400

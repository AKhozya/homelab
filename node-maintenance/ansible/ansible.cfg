[defaults]
# Force ansible-core 2.24 future behavior: facts NOT auto-injected as top-level vars.
# Bare `ansible_hostname` fails; must use `ansible_facts['hostname']`.
# Catches deprecation usage before upstream removal.
inject_facts_as_vars = False

# Fail-fast on deprecation warnings (CI/dev only — humans see stderr output anyway).
deprecation_warnings = True

[ssh_connection]
# Pipe modules straight into the remote Python interpreter (no tempfile + no login/PTY
# shell). Stops systemd v257 /etc/profile.d/80-systemd-osc-context.sh from sourcing and
# leaking OSC 3008 escapes into module stdout ("Module invocation had junk after the JSON
# data: ]3008;end=..." 2026-06-20). Also a drift-heal speedup (fewer SSH round-trips).
# Safe here: sudoers is NOPASSWD with no `requiretty`, which pipelining requires.
pipelining = True

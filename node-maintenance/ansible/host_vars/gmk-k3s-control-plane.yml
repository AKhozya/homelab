---
# gmk-k3s-control-plane (192.168.1.127) — Intel Alder Lake-N + Intel UHD Graphics.

# Cluster LAN IP for /etc/hosts block. ansible_host=127.0.0.1 because
# ansible_connection: local on CP — wrong source for hosts file.
node_ip: 192.168.1.127

# Swap config — file-backed 8G on /swapfile.
swap_kind: file
swap_path: /swapfile
swap_fstab_entry: "/swapfile none swap defaults 0 0"

# ---- Packages ----
ucode_pkg: intel-ucode
gpu_vendor: intel

# ---- Admin user ----
# Granted `adm` group membership so interactive reads of
# /var/log/node-maintenance/ work without sudo.
admin_user: akhozya

# ---- NIC tuning (Intel I225-V igc workaround) ----
# Force 1Gbps + EEE off on enp3s0 to prevent link drops.
# Reference: 2026-04-26 21:05-21:10 NIC link-down isolation incident.
nic_tuning_iface: enp3s0
nic_tuning_force_speed: 1000

# ---- claude-telegram bot SSH key (base_config forced command) ----
# Public key of the bot pod's identity. Setting this makes base_config install
# /usr/local/bin/agent-diag and pin this key to it with command=…,restrict, so the key serves
# read-only diagnostics instead of a shell. Unset on a host = the tasks skip (immich-vm carries
# no bot key). Public keys are not secret; the operator's own key on this account is untouched.
agent_diag_bot_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII6y/bDuSaR/mRuwgRj0Amuzcwev30tNoenExFvFjCIM claude-telegram-bot"

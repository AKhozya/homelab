---
# worker-node-2 (192.168.1.126) — AMD Ryzen 7 8745H, 8c/16t, 32GB, Radeon 780M iGPU.
# Workload memory limits here were cut after repeated OOM incidents (2026-02-21 DPDK
# build, 2026-04-26 host OOM). Their driver, rebuilderd, was removed 2026-07-06.

# Cluster LAN IP for /etc/hosts block (mirrors ansible_host but explicit).
node_ip: 192.168.1.126

# ---- NIC tuning (Realtek 8125 r8169 EEE-off; no speed-force) ----
# Primary NIC = enp2s0 (r8169 driver, 2.5GbE). EEE was enabled-active 2026-04-28
# audit — flipped off via nic-tune@enp2s0.service. Same wake-transition class
# of bugs as igc; preventive measure even without observed link drops yet.
nic_tuning_iface: enp2s0

# Swap config — 16G LVM logical volume, mounted via LV path in fstab.
swap_kind: lvm
swap_path: /dev/ArchinstallVg/swap
swap_fstab_entry: "/dev/ArchinstallVg/swap none swap sw 0 0"

# ---- Packages ----
ucode_pkg: amd-ucode
gpu_vendor: amd

# ---- Admin user ----
admin_user: z3us

# ---- K3s config ----
# K3s data (containerd, images, state) lives on LVM, not root FS.
k3s_data_dir: /mnt/k8s-storage/k3s

# ---- UFW firewall ----
# W2-specific rules. Extras vs base: 8472/udp from LAN (narrow dup of
# anywhere rule — preserved to match live state).
ufw_rules_host:
  - { comment: "Flannel VXLAN", rule: allow, from_ip: 192.168.1.0/24, to_port: 8472, proto: udp }

# W2 route rules: pod-to-node (diff comment vs CP/W1) + 2 legacy broad forwards.
# Broad routes are supersets of pod-to-pod, left in place to match live state.
ufw_route_rules_host:
  - { comment: "K3s pod to nodes", rule: allow, from_ip: 10.42.0.0/16, to_ip: 192.168.1.0/24 }
  - { rule: allow, from_ip: 10.42.0.0/16 }
  - { rule: allow, to_ip: 10.42.0.0/16 }

# Primary NIC .network filename — target for the DNS-decoupling drop-in.
# Static link; its existing `DNS=192.168.1.129` is reset to public DNS via
# the resolved global drop-in + networkd UseDNS reset.
primary_network_file: 20-wired-static.network

# ---- node_isolation_heal (CP-isolation self-recovery watchdog) ----
# Reboot stagger index 1 → self-reboots at 23min isolated (8min after W1's 15min), so the
# two workers never self-reboot together. W2 = the Realtek r8169 node that lost the
# 2026-07-10 reload↔tunnel race → the primary beneficiary of this watchdog.
node_isolation_reboot_index: 1

# ---- claude-telegram bot SSH key (base_config forced command) ----
# Public key of the bot pod's identity. Setting this makes base_config install
# /usr/local/bin/agent-diag and pin this key to it with command=…,restrict, so the key serves
# read-only diagnostics instead of a shell. Unset on a host = the tasks skip (immich-vm carries
# no bot key). Public keys are not secret; the operator's own key on this account is untouched.
agent_diag_bot_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII6y/bDuSaR/mRuwgRj0Amuzcwev30tNoenExFvFjCIM claude-telegram-bot"

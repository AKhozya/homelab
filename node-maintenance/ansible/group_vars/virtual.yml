---
# Group vars for `virtual` — the GPU-passthrough VM(s) that must never in-guest reboot.
#
# vm_cold_cycle_force: if true, phase2 PLAY 1b cold-cycles the VM on every weekly run (graceful
# poweroff, watchdog cold-start, wait for Ready). If false, it cold-cycles only when the running kernel
# differs from the installed linux-lts.
# true tests the restart path and the boot-time settings every week. It costs a few minutes of Immich
# downtime each Saturday. apps/immich/gpu-node/README.md says how to skip one cycle.
vm_cold_cycle_force: true

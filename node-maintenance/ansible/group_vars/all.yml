---
# Paths
state_dir: /var/lib/node-maintenance
flag_file: "{{ state_dir }}/phase2-pending"
log_dir: /var/log/node-maintenance
silence_id_file: "{{ state_dir }}/silence-id"
updated_packages_log: "{{ state_dir }}/updated-packages.log"
metrics_file: /var/lib/node_exporter/textfile/node_maintenance.prom

# Kubernetes
kubeconfig_path: /etc/rancher/k3s/k3s.yaml

# Alertmanager — reached with `kubectl exec` + amtool in the alertmanager pod.
# The CP host cannot reach the pod CIDR and the API-server proxy 502s on a pod
# dial.
silence_duration_seconds: 5400   # 90 minutes (covers phase1 + CP reboot + phase2 typical runtime)
# Every name must match an alert rule in the cluster (kubectl get vmrules -A); a stale name
# silences nothing.
silence_alertnames: "KubeletDown|KubernetesAPIServerDown|DeploymentReplicasMismatch|StatefulSetReplicasMismatch|CloudflareTunnelDown|CloudflareTunnelPodNotRunning|CloudflareTunnelNoConnections|CouchDBDown|CouchDBPodNotRunning|FluxControllerReconcileErrors|KyvernoAdmissionControllerDown|LokiDown|LokiCompactorNotRunning|MySQLDown|MySQLHAProxyNotRunning|MySQLOrchestratorNotRunning|RedisDown|RedisPodNotRunning|AlertmanagerFailedToSendAlerts|AlloyDown|AlloyLogDeliveryFailing|DaemonSetNotScheduled|TraefikDown|PodCrashLooping|PodRunningNotReady|PodPhaseNotRunning|ScrapeTargetDown|TooManyPodsPending|JobFailed"

# Preflight thresholds
min_free_root_gb: 5
min_free_var_gb: 3

# Reboot / stabilization
reboot_timeout_sec: 400
post_reboot_delay_sec: 30
node_ready_retries: 40
node_ready_delay_sec: 10
cp_stabilize_minutes: 4
per_node_stabilize_minutes: 4
final_stabilize_minutes: 5

flux_kustomizations:
  - flux-system
  - infrastructure-controllers
  - infrastructure-configs
  - apps
  - monitoring-configs
  - monitoring-controllers

# Used by phase2 (workers and immich-vm).
# -Syyu forces a mirror DB re-download even if the cache looks fresh, which catches a DB that lists
# package files the mirror has rotated out.
# --cleanafter clears the per-package tree under .cache/yay/ after a successful install. If SRCDEST
# stays unset (see base_config makepkg.conf), that tree holds the sources, so they go too.
# If a cached source remains, makepkg validates the file on disk and never re-downloads it. So if
# upstream replaces the file and the PKGBUILD checksum follows, the old copy fails every run. 2026-08-01:
# flux-bin pkgrel=2 hit this, phase1 failed fast, phase2 never ran, and the workers stayed unpatched.
yay_cmd: "sudo -u node-maintenance yay -Syyu --noconfirm --answerdiff=None --answerclean=None --removemake --cleanafter"
# phase1 (CP): AUR packages only. phase1.service runs `pacman -Syu` before the play; `-a` keeps
# yay from refreshing and upgrading repo packages (python, ansible) under the running play.
yay_aur_cmd: "sudo -u node-maintenance yay -Sua --noconfirm --answerdiff=None --answerclean=None --removemake --cleanafter"

# Expected kernel cmdline params, universal across all nodes. Set by
# bootloader (systemd-boot) at install via setup-node.sh — bootstrap-only,
# never re-applied. base_config asserts presence in /proc/cmdline; drift =
# missing param → fail task → telegram alert. Reading is read-only — operator
# investigates by editing /boot/loader/entries/*.conf and rebooting.
expected_kernel_params:
  - pcie_aspm=off
  - efi_pstore.pstore_disable=0
  - printk.always_kmsg_dump=Y
  - panic=10

# ---- UFW firewall ----
# Keep logging low so user.log stays free of noise.
ufw_policy_incoming: deny
ufw_policy_outgoing: allow
ufw_policy_routed: deny
ufw_logging: low

# ---- Packages ----
# Applied by `packages` role. AUR pkgs out of scope (setup-node.sh bootstrap).
pacman_packages_base:
  # arch-audit: CVE scan of the installed package set; companion to the security_scan role.
  - arch-audit
  - base-devel
  - bash-completion
  # Modern CLI viewing/diff/lint — parity with Mac dev env, useful when SSH'd in
  - bat
  - bc
  - btop
  - chezmoi
  - duf
  - dust
  - efibootmgr
  - ethtool
  - eza
  - fail2ban
  - fd
  - fwupd
  - fzf
  - git
  - git-delta
  - github-cli
  - go
  - gron
  - inetutils
  - jc
  - jq
  # kernel-modules-hook keeps /usr/lib/modules/<running> when pacman upgrades the kernel. Without it, a
  # mid-session `pacman -Syu` lets 60-mkinitcpio-remove.hook delete the running kernel's modules dir, and
  # every later modprobe fails (2026-05-02 W1: ufw silently disabled → INPUT chain DROP).
  # It lives in `extra`, not the AUR, so it belongs here: every node, every node-config run. A
  # bootstrap-only install failed silently on immich-vm, which hit the same cascade on 2026-07-18
  # (kernel 6.18.38-2 → -4).
  - kernel-modules-hook
  # k8s-adjacent (most useful on control plane; small on workers)
  - kubectl
  - kubectx
  - kubeconform
  - helm
  - linux-lts
  - linux-lts-headers
  - lvm2
  - lynis
  - neovim
  - nvme-cli
  - openssh
  - pacman-contrib
  - reflector
  - rkhunter
  - rsync
  - shellcheck
  - shfmt
  - smartmontools
  - sops
  - stern
  - sysstat
  - tree
  - ufw
  - ufw-extras
  - vim
  - xclip
  - yamllint
  - yq
  - zoxide
# Note: `yay` is not here: it is AUR-only, so pacman cannot install it. It was installed by hand on the
# physical nodes; the immich_gpu_node role bootstraps it on immich-vm. setup-node.sh Section 1 uses it
# for the AUR firmware packages.
# Note: `taplo` (TOML lint) intentionally not on nodes — not in extra or AUR.
# Mac-only via Homebrew. Nodes have ~no TOML files; cost > benefit to track GH releases.
# Note: deliberately excluded from the 19 packages the 2026-07-18 fleet-parity audit found
# hand-installed on W1/W2 (the repo-installable ones are listed above):
#   flux-bin, viddy, zsh-you-should-use — AUR-only; this list is pacman-only by design.
#   packagekit, pkgstats, udisks2      — dependency leftovers, not deliberate installs.
# Node-local extras beyond this list are tolerated drift; the list is a floor, not a whitelist.

# Base rules common to all 4 nodes.
# Order preserved as UFW orders rules internally by insertion; module idempotency
# compares rule match (not comment), so minor comment drift is tolerated as no-op.
# Duplicate-looking entries (e.g. port 80 vs 80/tcp) are intentional — UFW treats
# them as distinct rules and live state has both.
ufw_rules_base:
  - { comment: "SSH from LAN", rule: allow, from_ip: 192.168.1.0/24, to_port: 65300, proto: tcp }
  - { comment: "K3s control-plane", rule: allow, from_ip: 192.168.1.127 }
  - { comment: "K3s worker-node", rule: allow, from_ip: 192.168.1.129 }
  - { comment: "K3s worker-node-2", rule: allow, from_ip: 192.168.1.126 }
  - { comment: "K3s immich-vm", rule: allow, from_ip: 192.168.1.231 }
  - { rule: allow, from_ip: 192.168.1.0/24, to_port: 80 }
  - { comment: "K3s pod network", rule: allow, from_ip: 10.42.0.0/16 }
  - { comment: "K3s service network", rule: allow, from_ip: 10.43.0.0/16 }
  - { comment: "HTTP from LAN", rule: allow, from_ip: 192.168.1.0/24, to_port: 80, proto: tcp }
  - { comment: "HTTPS from LAN", rule: allow, from_ip: 192.168.1.0/24, to_port: 443, proto: tcp }
  - { rule: allow, from_ip: 10.42.0.0/16, to_port: 8000, proto: tcp }

# Rules to delete. If you drop a rule from the lists above, the live rule stays;
# name it here to delete it. A rule with no source opens the port
# over IPv6 as well, and every node has a public IPv6 address. No entry
# carries a `comment`: `ufw delete` then matches the rule whatever its comment.
# An entry for a no-source rule carries no `from_ip`, so the delete removes its
# IPv4 and IPv6 copies together; an entry for a rule with a source names that
# source. Each no-source port here keeps a node-IP, pod-network or LAN-only
# rule for its real callers; 9090 has no listener. Deleting a rule that is not
# there is a no-op.
ufw_rules_absent:
  - { rule: allow, to_port: 6443, proto: tcp }    # was "Kubernetes API server" on the CP
  - { rule: allow, to_port: 10250, proto: tcp }   # was "Kubelet API"
  - { rule: allow, to_port: 22, proto: tcp }      # immich-vm build-time rule
  - { rule: allow, from_ip: 192.168.1.0/24, to_port: 9090, proto: tcp }  # CP: Prometheus, removed; no listener
  - { rule: allow, to_port: 8472, proto: udp }    # flannel VXLAN; peers send from the four node IPs

# Base route rules common to all 4 nodes.
ufw_route_rules_base:
  - { comment: "K3s pod-to-pod traffic", rule: allow, from_ip: 10.42.0.0/16, to_ip: 10.42.0.0/16 }

ufw_rules_group: []
ufw_rules_host: []
ufw_route_rules_group: []
ufw_route_rules_host: []

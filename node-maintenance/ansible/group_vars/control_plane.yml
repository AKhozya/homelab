---
# control_plane group overrides (CP = gmk-k3s-control-plane, 192.168.1.127).

# ---- K3s config ----
# Drift-alert only, no auto-restart. Restart via: sudo systemctl restart k3s.
k3s_default_storage_path: /mnt/k8s-storage
k3s_disable_helm_controller: true
k3s_disable:
  - traefik
  # coredns disabled: Flux manages CoreDNS (infrastructure/coredns/ — coredns-ha DaemonSet, one pod per
  # node, plus the kube-dns Service/CM/SA/RBAC). Those objects carry no objectset.rio.cattle.io/owner
  # label, so k3s --disable cannot delete them.
  # DNS deadlock (2026-05-31 cutover): the first CP restart with --disable deleted the still-addon-owned
  # objects. Flux could not recreate them, because kustomize-controller reaches source-controller through
  # cluster DNS, so every reconcile stalled; forcing a reconcile fails for the same reason. Break-glass:
  # `kubectl apply -k infrastructure/coredns/`; Flux adopts the objects on its next reconcile.
  - coredns
  # gateway-api-crd disabled: k3s v1.37.0 moved the Gateway API CRDs out of the traefik chart into a
  # packaged component of their own, and that component is a HelmChart CR. `k3s_disable_helm_controller`
  # above leaves the helm.cattle.io group unregistered, so the deploy controller cannot resolve the kind:
  # since the 2026-09-26 upgrade it retried every ~18s and logged ~38k ApplyManifestFailed
  # "the server could not find the requested resource" events. Every apply failed, so the addon owns no
  # objects and --disable uninstalls nothing. The live gateway.networking.k8s.io CRDs come from the
  # traefik chart, and nothing in this repo declares a Gateway, GatewayClass or HTTPRoute.
  - gateway-api-crd
k3s_node_taints:
  - "node-role.kubernetes.io/control-plane:NoSchedule"
k3s_node_labels:
  - "svccontroller.k3s.cattle.io/enablelb=false"
k3s_terminated_pod_gc_threshold: 20
k3s_secrets_encryption: true

# kube-controller-manager node-lease tuning. A node goes NotReady (Unknown) after
# k3s_node_monitor_grace_period without a heartbeat: a lease renewal (every ~15s, 25% of
# nodeLeaseDurationSeconds=60 in roles/hardening/files/k3s-kubelet.yaml) or a status update.
# 75s tolerates brief network drops (UFW reload during drift-heal, kube-proxy and
# flannel iptables churn). Raised in 086c33f9 after the 2026-05-02 W2 NotReady incident.
k3s_node_monitor_period: 5s
k3s_node_monitor_grace_period: 75s

# API-server cert SANs. Restart K3s after a change to regenerate the cert.
# Cert lifetime: K3s rotates internally.
k3s_tls_san:
  - 127.0.0.1
  - localhost
  - gmk-k3s-control-plane
  - 192.168.1.127


# UFW rules specific to CP.
# Extras vs base: 6443 from the LAN (the operator's kubectl), 10.42.2.0/24 (W2
# pod subnet — redundant vs base 10.42.0.0/16 but preserved as live state).
# The firewall role deletes 6443 from any source and 9090 from the LAN through
# ufw_rules_absent in all.yml.
ufw_rules_group:
  - { rule: allow, from_ip: 192.168.1.0/24, to_port: 6443, proto: tcp }
  - { comment: "K8s pod network worker-node-2", rule: allow, from_ip: 10.42.2.0/24 }

# UFW route rules specific to CP.
ufw_route_rules_group:
  - { comment: "K3s pod-to-node traffic (API server)", rule: allow, from_ip: 10.42.0.0/16, to_ip: 192.168.1.0/24 }
  - { comment: "K3s node-to-pod traffic", rule: allow, from_ip: 192.168.1.0/24, to_ip: 10.42.0.0/16 }

# Primary NIC .network filename — target for the DNS-decoupling drop-in
# (CP is a single-host group). DHCP link.
primary_network_file: 10-enp3s0.network

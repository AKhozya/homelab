---
# workers group overrides (worker-node, worker-node-2, immich-vm).
# Per-worker UFW rules live in host_vars/ — the two physical workers diverge on the pod-to-node
# route comment (W2: "to nodes", W1: "(API server)") + W2 broad routes + 8472 LAN.

# ---- K3s config ----
# Drift-alert only, no auto-restart. Restart via: sudo systemctl restart k3s-agent.
k3s_node_labels:
  - "svccontroller.k3s.cattle.io/enablelb=true"

# Use k3s's bundled iptables binaries (not the host's xtables-nft v1.8.13) to avoid the stale-chain
# iptables-restore conflict that wedges kube-proxy ClusterIP DNAT on reboot (commit 9d8d57a1,
# 2026-05-25). Applies on the next k3s-agent restart; config.yaml drift is alerted, not auto-restarted.
k3s_prefer_bundled_bin: true

# Workers extend universal kernel cmdline assertions with AMD-specific tuning.
# amd_pstate=active enables EPP power profile. nvme_core.default_ps_max_latency_us=0
# disables NVMe APST for SSD stability (paired with hardening role's NVMe APST modprobe).
expected_kernel_params:
  - pcie_aspm=off
  - efi_pstore.pstore_disable=0
  - printk.always_kmsg_dump=Y
  - panic=10
  - amd_pstate=active
  - nvme_core.default_ps_max_latency_us=0

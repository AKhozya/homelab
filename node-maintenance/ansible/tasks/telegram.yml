---
# Shared include. Callers must set `tg_message` in `vars:`.
# telegram-notify.sh keeps the bot token out of the task and reports its own failure
# (an err journal line and node_maintenance_telegram_notify_success 0). Plain text, no
# parse_mode: if parse_mode is Markdown, Telegram rejects a message with an unpaired `_` or `*`.
- name: Send Telegram notification
  ansible.builtin.command:
    argv: [/usr/local/sbin/telegram-notify.sh, "{{ tg_message }}"]
  changed_when: false
  failed_when: false   # If Telegram fails, keep maintenance running.

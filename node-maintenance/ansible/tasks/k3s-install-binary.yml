---
# Puts the CP's cached k3s_version binary at /usr/local/bin/k3s on this node, keeping the old one
# as k3s.prev. Reads k3s_target_sha256 from rolling-restart-k3s.yml's preflight play; a
# config-only run sets none, and then nothing here runs.
# ansible copy renames a temp file into place; a shell cp over the running binary fails with
# "Text file busy". The running k3s keeps the old inode until the restart that follows.
- name: Install k3s_version
  vars:
    _target_sha256: "{{ hostvars[groups['control_plane'][0]].k3s_target_sha256 | default('') }}"
  when: _target_sha256 | length > 0
  block:
    - name: Hash the installed k3s binary
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
        checksum_algorithm: sha256
      register: _k3s_live

    - name: Swap in k3s_version
      when: _k3s_live.stat.checksum | default('') != _target_sha256
      block:
        - name: Keep the running binary as k3s.prev
          ansible.builtin.copy:
            src: /usr/local/bin/k3s
            dest: /usr/local/bin/k3s.prev
            remote_src: true
            owner: root
            group: root
            mode: "0755"
          when: _k3s_live.stat.exists

        - name: Copy k3s_version from the CP cache
          ansible.builtin.copy:
            src: "{{ k3s_cache_dir }}/k3s-{{ k3s_version }}"
            dest: /usr/local/bin/k3s
            owner: root
            group: root
            mode: "0755"

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  interval: 1m0s
  # 2m: on reboot the cnpg-operator cold start (image pull, CRD, pod ready) can exceed
  # the former 45s timeout, which fails this health-gated reconcile falsely and churns
  # its dependents.
  timeout: 2m
  dependsOn:
    - name: infrastructure-controllers
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cnpg-operator-cloudnative-pg
      namespace: databases
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age

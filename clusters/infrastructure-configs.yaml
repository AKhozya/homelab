apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  interval: 1m0s
  # 2m (was 45s): cnpg-operator cold-start on reboot (image pull + CRD + pod ready) can exceed
  # 45s, false-failing this health-gated reconcile and churning dependents. UR2 P3-1.
  timeout: 2m
  dependsOn:
    - name: infrastructure-controllers
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cnpg-operator-cloudnative-pg
      namespace: databases
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-controllers
  namespace: flux-system
spec:
  interval: 1m0s
  retryInterval: 2m
  # 2m: on reboot the operator's cold start can exceed the former 45s timeout and fail
  # the health gate falsely.
  timeout: 2m
  dependsOn:
    - name: infrastructure-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./monitoring/controllers
  prune: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: kube-prometheus-stack-operator
      namespace: monitoring
    - apiVersion: apps/v1
      kind: Deployment
      name: victoria-metrics-operator
      namespace: monitoring
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-configs
  namespace: flux-system
spec:
  interval: 1m0s
  retryInterval: 2m
  # 2m: on reboot the VMSingle cold start can exceed the former 45s timeout and fail the
  # health gate falsely.
  timeout: 2m
  dependsOn:
    - name: monitoring-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./monitoring/configs
  prune: true
  # Flux evaluates healthCheckExprs only for objects that healthChecks (or wait: true)
  # selects, so both are needed. VMSingle publishes no status.conditions, so default
  # kstatus evaluation reports Current. The CEL expression checks updateStatus instead.
  healthChecks:
    - apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMSingle
      name: vmsingle
      namespace: monitoring
  healthCheckExprs:
    - apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMSingle
      # No inProgress arm on purpose: Flux treats anything matching neither current nor
      # failed as still in progress. The operator's full updateStatus vocabulary is not
      # published (the CRD ships no description), so enumerating it would risk a value
      # like "updating" matching nothing and wedging the gate on every rollout.
      # observedGeneration guards against reading a stale status from the previous
      # generation as if it described the spec just applied.
      failed: has(status.updateStatus) && status.updateStatus == 'failed' && status.observedGeneration == metadata.generation
      current: has(status.updateStatus) && status.updateStatus == 'operational' && status.observedGeneration == metadata.generation
  decryption:
    provider: sops
    secretRef:
      name: sops-age

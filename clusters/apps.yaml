apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1m0s
  retryInterval: 2m
  wait: false
  timeout: 45s
  dependsOn:
    - name: infrastructure-configs
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: main-postgres
      namespace: databases
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/staging
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age